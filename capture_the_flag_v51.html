  // ==========================================================
  // THE WALL BOARDS
  // ==========================================================
  // These used to hang over the pitch on either side of the
  // jumbotron, which is two signs too many in the middle of the room
  // and a third thing between you and the sky. Dinopawnz: "now that
  // we have the jumbotron, can you move this sign to be on the sides
  // walls somewhere".
  //
  // Four of them now, flat against the inner face of each touchline
  // wall, two per side. They face across the pitch, so wherever you
  // are on the floor one of them is square to you and the jumbotron
  // is overhead - and nothing is hanging in the middle distance any
  // more.
  //
  // Mounted at 11.5: clear of the gallery rail, under the roof
  // trusses, and low enough that the sightline to one is along the
  // pitch rather than up through it.
  const WALL_BOARD_Y = 11.5;
  [-1, 1].forEach((s) => {
    const bx = s * 47.4, ry = s > 0 ? -90 : 90;
    [-55, 55].forEach((bz) => {
      // WIDER, because the second line on these is a long one and
      // width is what a long line needs. 26 metres across a 96 metre
      // pitch is a big sign, and it is meant to be - you read it
      // from the far touchline.
      el("m-cube", {
        x: bx + s * 0.5, z: bz, y: WALL_BOARD_Y, ry: ry,
        width: 27, height: 6.0, depth: 0.5, color: FRAME,
      });
      el("m-cube", {
        x: bx, z: bz, y: WALL_BOARD_Y, ry: ry,
        width: 26, height: 5.3, depth: 0.4, color: BOARD,
      });
      statusLabels.push(fitted(el("m-label", {
        x: bx - s * 0.3, z: bz, y: WALL_BOARD_Y + 1.1, ry: ry,
        width: 25, height: 2.6, "font-size": 140, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "CAPTURE THE FLAG",
      }), 25, 2.6, 190));
      countLabels.push(fitted(el("m-label", {
        x: bx - s * 0.3, z: bz, y: WALL_BOARD_Y - 1.3, ry: ry,
        width: 25, height: 1.7, "font-size": 70, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "",
      }), 25, 1.7, 120));
      el("m-light", {
        x: bx - s * 3, z: bz, y: WALL_BOARD_Y + 3.4,
        type: "point", intensity: 10, distance: 14, color: "#cfd8e6",
      });
    });
  });

  // ==========================================================
  // GAME FLOW
  // ==========================================================
  function flagsHome() { [-1, 1].forEach((t) => returnFlag(t)); }

  // ==========================================================
  // STARTING, AND BEING SEEN TO START
  // ==========================================================
  // Dinopawnz: "its impossible for the players to know when the game
  // is in motion."
  //
  // It was. The operator typed 1718 into a console in a side room,
  // the phase flipped from STANDBY to LIVE between one frame and the
  // next, and the only announcement was four seconds of small text on
  // boards you had to be facing and near enough to read. Somebody in
  // the room under the far base found out when they got caged.
  //
  // Starting is now FIVE SECONDS LONG and it happens to the whole
  // room at once. The jumbotron over the centre circle counts it
  // down in numbers a metre tall on all four faces, the colour walks
  // white -> gold -> red as it runs out, the eight floodlights take
  // the same colour on every second so the light in the room changes
  // even with your back to the board, and at zero the whole thing
  // goes green and says START while the floods flash white.
  //
  // None of that is text you have to be facing to read. If the light
  // changes, the game changed.
  const COUNT_FROM = 10;        // seconds of countdown
  const BLAZE_MS = 3000;        // how long START stays up after it
  let countLeft = 0, countNext = 0, startBlaze = 0;

  function countColour(n) {
    return n > 5 ? CHALK : n > 3 ? WIN_GOLD : n > 0 ? CALL_RED : "#3ef07a";
  }

  function armGame() {
    clearCages();
    flagsHome();
    score["-1"] = 0; score["1"] = 0;
    suddenDeath = false;
    winner = 0;
    startBlaze = 0;
    phase = "COUNT";
    countLeft = COUNT_FROM;
    countNext = Date.now() + 1000;
    flash(countColour(countLeft));
    paintBoards();
  }

  function countTick() {
    if (phase !== "COUNT") { return; }
    const now = Date.now();
    if (now >= countNext) {
      countNext = now + 1000;
      countLeft--;
      if (countLeft > 0) flash(countColour(countLeft));
      else { startGame(); return; }
    }
    paintBoards();
  }
  every(countTick, 100);

  function startGame() {
    clearCages();
    flagsHome();
    score["-1"] = 0; score["1"] = 0;
    suddenDeath = false;
    winner = 0;
    countLeft = 0;
    startBlaze = Date.now() + BLAZE_MS;
    clockEnds = Date.now() + ROUND_TIME * 1000;
    phase = "LIVE";
    flash(CHALK);
    notice("GO!   FIRST TO " + CAPS_TO_WIN, 4000, CHALK);
    paintBoards();
  }

  function stopGame() {
    phase = "STANDBY";
    countLeft = 0;
    startBlaze = 0;
    clearCages();
    flagsHome();
    unflash();
    paintBoards();
  }

  function finish(t) {
    phase = "WIN";
    winner = t;
    clearCages();
    flagsHome();
    flash(homeCol(t));
    notice(teamName(t) + " WINS!   " + scoreLine(), 15000, homeCol(t));
  }

  let stopArmedUntil = 0;
  let lastStop = null;
  function toggleGame() {
    // the code during a countdown cancels it, so a mis-start is one
    // entry to undo rather than a game you have to stop twice
    if (phase === "COUNT") { stopArmedUntil = 0; noticeUntil = 0; stopGame(); return; }
    if (phase !== "LIVE") { stopArmedUntil = 0; noticeUntil = 0; armGame(); return; }
    const now = Date.now();
    if (STOP_TWICE && now > stopArmedUntil) {
      stopArmedUntil = now + 10000;
      notice("ENTER THE CODE AGAIN TO STOP", 10000, CHALK);
      return;
    }
    stopArmedUntil = 0;
    noticeUntil = 0;
    lastStop = { at: now, why: "CODE" };
    stopGame();
  }

  // the clock
  every(() => {
    if (phase === "LIVE" && ROUND_TIME && !suddenDeath && Date.now() >= clockEnds) {
      if (score["-1"] !== score["1"]) finish(score["-1"] > score["1"] ? -1 : 1);
      else { suddenDeath = true; notice("TIME! LEVEL - NEXT CAPTURE WINS", 8000, WIN_GOLD); }
    }
    paintBoards();
  }, 1000);

  every(() => { if (flashUntil && Date.now() > flashUntil) unflash(); }, 200);

  // ==========================================================
  // OPERATOR CONSOLES
  // ==========================================================
  let entry = [];
  let entryExpires = 0;

  function setKeyDisplay() {
    const dots = [];
    for (let i = 0; i < CODE.length; i++) dots.push(i < entry.length ? "*" : "-");
    const text = dots.join(" ");
    keyDisplays.forEach((l) => l.setAttribute("content", text));
  }

  const CODES = [CODE];
  function isPrefix(seq) {
    return CODES.some((c) => seq.every((d, i) => c[i] === d));
  }
  function same(a, b) { return a.length === b.length && a.every((d, i) => d === b[i]); }

  function enter(digit, who) {
    const now = Date.now();
    if (now > entryExpires) entry = [];
    entryExpires = now + CODE_TIMEOUT * 1000;
    entry.push(digit);
    while (entry.length && !isPrefix(entry)) entry.shift();
    setKeyDisplay();
    if (same(entry, CODE)) {
      entry = [];
      setKeyDisplay();
      toggleGame(who);
    }
  }

  function press(digit, clear, cap, who) {
    const lit = clear ? CALL_RED : WIN_GOLD;
    const dark = clear ? CALL_DIM : "#2a3530";
    cap.setAttribute("color", lit);
    later(() => cap.setAttribute("color", dark), 150);
    if (clear) {
      entry = [];
      setKeyDisplay();
    } else {
      enter(digit, who);
    }
  }

  const KEYS = [
    ["1", "2", "3"],
    ["4", "5", "6"],
    ["7", "8", "9"],
    ["C", "0", ""],
  ];

  function buildConsole(zPod, face) {
    const ry = face < 0 ? 180 : 0;

    el("m-cube", { z: zPod, y: 0.5, width: 18, height: 1, depth: 10, color: CONCRETE, collide: "true" });
    el("m-cube", { z: zPod + face * 5.6, y: 0.25, width: 18, height: 0.5, depth: 1.6, color: STEEL_DK, collide: "true" });
    el("m-cube", { z: zPod, y: 1.04, width: 18.4, height: 0.12, depth: 10.4, color: homeCol(face) });
    [-1, 1].forEach((s) => {
      el("m-cylinder", { x: s * 7.5, z: zPod - face * 3.5, y: 3, radius: 0.35, height: 6, color: STEEL_DK });
      orb({ x: s * 7.5, z: zPod - face * 3.5, y: 6.3, radius: 0.55, color: LAMP });
      el("m-light", { x: s * 7.5, z: zPod - face * 3.5, y: 6.3, type: "point", intensity: 5, color: LAMP });
    });

    const cg = document.createElement("m-group");
    cg.setAttribute("z", zPod + face);
    cg.setAttribute("y", 1);
    cg.setAttribute("ry", ry);
    arena.append(cg);

    el("m-cube", { y: 0.3, width: 2.6, height: 0.6, depth: 0.7, color: CONCRETE, collide: "true" }, cg);
    el("m-cube", { y: 2.2, width: 3.4, height: 3.3, depth: 0.2, color: BOARD, collide: "true" }, cg);
    [-1, 1].forEach((s) => {
      el("m-cube", { x: s * 1.76, y: 2.2, width: 0.16, height: 3.3, depth: 0.28, color: FRAME }, cg);
    });
    [0.55, 3.85].forEach((y) => {
      el("m-cube", { y: y, width: 3.68, height: 0.16, depth: 0.28, color: FRAME }, cg);
    });

    statusLabels.push(el("m-label", {
      y: 3.58, z: 0.12, width: 3.0, height: 0.5,
      "font-size": 40, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "BULLDOG",
    }, cg));

    keyDisplays.push(el("m-label", {
      y: 3.06, z: 0.12, width: 3.0, height: 0.46,
      "font-size": 36, alignment: "center",
      color: "#101a15", "font-color": HOME_YEL, content: "- - - -",
    }, cg));

    countLabels.push(el("m-label", {
      y: 0.34, z: 0.4, width: 3.3, height: 0.4,
      "font-size": 17, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "",
    }, cg));
    diagLabels.push(el("m-label", {
      y: 0.08, z: 0.4, width: 3.3, height: 0.28,
      "font-size": 13, alignment: "center",
      color: BOARD, "font-color": STEEL, content: "",
    }, cg));

    KEYS.forEach((row, r) => {
      row.forEach((key, c) => {
        if (key === "") return;
        const clear = key === "C";
        const x = (c - 1) * 0.92;
        const y = 2.42 - r * 0.62;

        const cap = el("m-cube", {
          x: x, y: y, z: 0.2,
          width: 0.78, height: 0.5, depth: 0.24,
          color: clear ? CALL_DIM : "#2a3530",
          collide: "true",
        }, cg);

        const capFace = el("m-label", {
          z: 0.13, width: 0.74, height: 0.42,
          "font-size": 30, alignment: "center",
          color: clear ? CALL_DIM : "#2a3530",
          "font-color": clear ? CALL_RED : CHALK,
          content: key, collide: "true",
        }, cap);

        let last = 0;
        const hit = (e) => {
          const now = Date.now();
          if (now - last < 180) return;
          last = now;
          press(Number(key), clear, cap, e && e.detail ? e.detail.connectionId : undefined);
        };
        on(cap, "click", hit);
        on(capFace, "click", hit);
      });
    });

    // and the button that opens every cage, beside the keypad

    // typed entry, as a backstop for a fiddly cursor
    const promptWrap = document.createElement("m-prompt");
    promptWrap.setAttribute("message", "Operator code");
    promptWrap.setAttribute("placeholder", "4 digits");
    arena.append(promptWrap);

    const promptPad = el("m-cube", {
      z: zPod + face * 3.6, y: 1.08,
      width: 3.6, height: 0.16, depth: 1.6,
      color: BOARD, collide: "true",
    }, promptWrap);

    el("m-cube", {
      z: zPod + face * 3.6, y: 1.1,
      width: 3.9, height: 0.1, depth: 1.9, color: FRAME,
    });

    el("m-label", {
      y: 0.1, rx: -90, rz: ry,
      width: 3.4, height: 1.4,
      "font-size": 30, alignment: "center",
      color: BOARD, "font-color": CHALK,
      content: "TYPE CODE", collide: "true",
    }, promptPad);

    on(promptWrap, "prompt", (event) => {
      const d = event.detail || {};
      const typed = String(d.value || "").replace(/[^0-9]/g, "");
      entry = [];
      for (let i = 0; i < typed.length; i++) enter(Number(typed[i]), d.connectionId);
    });
  }

  buildConsole(CTRL_Z, -1);
  if (FINISH_CONSOLE) buildConsole(FIN_CTRL_Z, 1);

  // ==========================================================
  // GO
  // ==========================================================
  setKeyDisplay();
  stopGame();
</script>
