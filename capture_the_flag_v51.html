  // world at any height, on any surface, padded or not. If it can see
  // them, they are there, and the ball rides their head - and
  // markerAt() and standY() are already reading the probe in exactly
  // that case, so the position and the height are right too. If the
  // probe goes quiet - which it does within PROBE_FRESH of a client
  // dying - this falls back to the floor and nothing else changes.
  // ...and it stops at the touchline. THE GALLERY IS NOT THE PITCH.
  // The probe can see the whole arena - the stands, the gallery, the
  // lobby, the terrace - and none of that is the playing field, so
  // none of it gets a marker. Only the floor-first half of this
  // answers for somebody who is airborne, which is deliberate: a
  // jumper who drifts over the touchline and back is still on the
  // pitch by the same window they always were, and their ball does
  // not blink at the line.
  function overField(q) {
    return Math.abs(q.x) <= FIELD_W / 2 + PITCH_EDGE &&
           Math.abs(q.z) <= FIELD_L / 2 + PITCH_EDGE;
  }
  function present(p) {
    return onPitch(p) || (tracked(p) && overField(markerAt(p, 0)));
  }
  // Where they are now, carried forward a little by their speed. In
  // the air nothing reports them, but a jumper keeps travelling at
  // the speed they took off at - so keep carrying them forward for
  // the length of a hop rather than freezing them at the take-off
  // spot and snapping them forward when they land.
  function predict(p, ahead) {
    // If the probe is up and calibrated, it knows exactly where they
    // are - in the air as well as on the ground - so there is nothing
    // to guess at. Lead it by the probe's own velocity, not the
    // floor's, because the floor's is the speed they took off at.
    const g = (p.pads > 0) ? null : glideAt(p);
    if (g) {
      const t2 = Math.min(0.25, ahead || 0);
      return { x: g.x + p.gvx * t2, z: g.z + p.gvz * t2 };
    }
    const air = airborne(p);
    const raw = (Date.now() - p.t) / 1000;
    if (!air && raw > 0.45) return { x: p.x, z: p.z };   // standing still
    const age = Math.min(air ? AIR_COAST : 0.5, raw);
    const t = age + (ahead || 0);
    let dx = p.vx * t, dz = p.vz * t;
    const cap = air ? AIR_LEAD_MAX : CAGE_LEAD_MAX;
    const m = Math.hypot(dx, dz);
    if (m > cap) { dx *= cap / m; dz *= cap / m; }
    return { x: p.x + dx, z: p.z + dz };
  }
  // WHERE TO DRAW THE BALL, which is a different question from where
  // the GAME thinks somebody is, and gets a different answer.
  //
  // predict() above is the rules answer and it is floor-first on
  // purpose: a tag, a half, a jail break and a flag pickup are all
  // decided by pads, so the position they are decided from had
  // better be the pad's. But a pad is eight metres wide and reports
  // its own centre, so as a thing to hang a ball over it is four
  // metres of slack that the smoothing then smears into a ball
  // trailing its player across open ground.
  //
  // So the marker gets the probe instead, on the ground as well as
  // in the air: a real position every PROBE_MS, corrected by the
  // calibration, led by the probe's OWN velocity - which is measured
  // off continuous readings rather than off pad centres, and is the
  // first honest speed this document has had on the ground.
  //
  // Three ways out, all of them back to predict() and the floor:
  // the probe said nothing in this world, it is not calibrated for
  // this player yet, or it disagrees with the pad underneath them by
  // more than MARKER_PROBE_TOL - which is a calibration that has
  // drifted, and is the one failure that would park a ball off to
  // one side of somebody and leave it there.
  function markerAt(p, ahead) {
    if (MARKER_PROBE) {
      const g = glideAt(p);
      if (g && (p.pads < 1 ||
                Math.hypot(g.x - p.x, g.z - p.z) < MARKER_PROBE_TOL)) {
        const age = Math.min(0.25, Math.max(0, (Date.now() - p.gt) / 1000));
        const t = age + Math.min(0.25, ahead || 0);
        return { x: g.x + p.gvx * t, z: g.z + p.gvz * t };
      }
    }
    return predict(p, ahead);
  }

  // Which half they are over - a jumper is judged where they are,
  // not where they left the ground. Pass a position you already have.
  function ownHalf(p, at) {
    const q = at || predict(p, 0);
    return p.team * q.z >= -HALF_TOL;
  }

  function teamCount(t) {
    let n = 0;
    players.forEach((p) => { if (p.team === t) n++; });
    return n;
  }
  function jailCount(t) {
    let n = 0;
    players.forEach((p) => { if (p.team === t && p.state === "jail") n++; });
    return n;
  }

  // somebody left the world entirely
  if (typeof window !== "undefined" && window.addEventListener) {
    on(window, "disconnected", (e) => {
      const id = e && e.detail ? e.detail.connectionId : undefined;
      const p = players.get(id);
      if (!p) return;
      if (p.carrying) returnFlag(p.carrying, teamName(p.carrying) + " FLAG RETURNED");
      if (p.marker && p.marker.parentNode) p.marker.parentNode.removeChild(p.marker);
      for (let i = cages.length - 1; i >= 0; i--) if (cages[i].id === id) removeCage(cages[i]);
      players.delete(id);
    });
  }

  // ==========================================================
  // THE FLOOR - pads that report who stepped where
  // ==========================================================
  const PAD_COLS = Math.max(1, Math.round(FIELD_W / FOOT_PITCH));
  const PAD_ROWS = Math.max(1, Math.round(FIELD_L / FOOT_PITCH));
  const PAD_W = FIELD_W / PAD_COLS;
  const PAD_D = FIELD_L / PAD_ROWS;

  // hook any collider up to the identity system; extra(p, e, kind)
  // runs after the position is taken.
  // ry is the collider's own Y rotation, if it has one. The position
  // in a collision event is relative to the ELEMENT, so on a turned
  // block it arrives in the block's frame and has to be turned back
  // before it means anything in the world. Nothing needed this until
  // the turned crates started reporting for themselves.
  function listen(node, cx, cz, extra, sy, ry) {
    const a = ((ry || 0) * Math.PI) / 180;
    const ca = Math.cos(a), sa = Math.sin(a);
    const hit = (kind) => (e) => {
      const q = e && e.detail && e.detail.position;
      const has = q && typeof q.x === "number";
      const p = stepped(e, kind,
        has ? cx + q.x * ca + q.z * sa : cx,
        has ? cz + q.z * ca - q.x * sa : cz, sy);
      if (p && extra) extra(p, kind);
    };
    on(node, "collisionstart", hit("start"));
    on(node, "collisionmove", hit("move"));
    on(node, "collisionend", hit("end"));
  }

  // one pad maker, used for the floor, the decks and every tread of
  // every ramp. base is where the pad sits; the walking surface is
  // base + PAD_T, and that is the height the pad reports.
  function padAt(px, pz, w, d, base) {
    const pad = el("m-cube", {
      x: +px.toFixed(2), z: +pz.toFixed(2), y: +(base + PAD_T / 2).toFixed(3),
      width: w, height: PAD_T, depth: d,
      color: "#000000", opacity: 0,
      collide: "true", "collision-interval": PAD_MS,
    });
    listen(pad, px, pz, null, +(base + PAD_T).toFixed(3));
    return pad;
  }

  // the floor
  for (let r = 0; r < PAD_ROWS; r++) {
    for (let c = 0; c < PAD_COLS; c++) {
      padAt(-FIELD_W / 2 + PAD_W / 2 + c * PAD_W,
            -FIELD_L / 2 + PAD_D / 2 + r * PAD_D,
            PAD_W + 0.4, PAD_D + 0.4, 0);
    }
  }

  // every deck, gridded the same way. The pads ARE the deck surface,
  // exactly as they are on the floor, so there is no lip to trip on
  // anywhere except the very edge - where a lip is wanted anyway.
  DECKS.forEach(([x0, x1, z0, z1, dy]) => {
    const cols = Math.max(1, Math.round((x1 - x0) / FOOT_PITCH));
    const rows = Math.max(1, Math.round((z1 - z0) / FOOT_PITCH));
    const w = (x1 - x0) / cols, d = (z1 - z0) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        padAt(x0 + w / 2 + c * w, z0 + d / 2 + r * d, w + 0.3, d + 0.3, dy);
      }
    }
  });

  // and every tread. A step is small enough to be one pad on its own,
  // which is the whole reason the ramps are stepped: the game can say
  // how high up a ramp somebody is, to the tread.
  RAMP_STEPS.forEach((st) => {
    padAt(st.x, st.z, st.width, st.depth, st.top);
  });

  // NOTHING ELSE GETS A PAD.
  // Cover, the kerbs, the rails and the flag plinths all report as
  // themselves where they are built - see THE THING YOU STAND ON IS
  // THE THING THAT REPORTS. The pads above are the ones with nothing
  // to hang on: open floor, open deck, a ramp tread, a tunnel roof.
  //
  // AND THE ROOFS. A lid is a solid surface, so it is a place people
  // land - gridded exactly like a deck, so the floor knows which one
  // you are on and at what height.
  ROOF_TOPS.forEach(([x0, x1, z0, z1, top]) => {
    const cols = Math.max(1, Math.round((x1 - x0) / FOOT_PITCH));
    const rows = Math.max(1, Math.round((z1 - z0) / FOOT_PITCH));
    const w = (x1 - x0) / cols, d = (z1 - z0) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        padAt(x0 + w / 2 + c * w, z0 + d / 2 + r * d, w + 0.3, d + 0.3, top);
      }
    }
  });

  // ==========================================================
  // TEAM PADS - where you pick a side
  // ==========================================================
  // One of each in the lobby and on the terrace. Off the pitch, so
  // standing on one never counts as being on the field.
  const padCounts = [];
  function teamPad(t, x, z) {
    const g = el("m-group", { x: x, z: z });
    el("m-cylinder", { y: 0.15, radius: 5.6, height: 0.3, color: homeDark(t) }, g);
    const pad = el("m-cylinder", {
      y: 0.35, radius: 5, height: 0.3, color: homeCol(t),
      collide: "true", "collision-interval": 200,
    }, g);
    el("m-label", {
      y: 0.52, rx: -90, rz: 180, width: 8, height: 2.4, "font-size": 110,
      alignment: "center", color: homeCol(t), "font-color": "#ffffff", content: "JOIN " + teamName(t),
    }, g);
    el("m-cylinder", { y: 3.2, radius: 0.12, height: 6, color: STEEL }, g);
    el("m-cube", { x: 0.9, y: 5.4, width: 1.8, height: 1.2, depth: 0.06, color: homeCol(t) }, g);
    el("m-light", { y: 3, type: "point", intensity: 12, distance: 12, color: homeCol(t) }, g);
    const count = el("m-label", {
      y: 7.0, width: 6, height: 1.2, "font-size": 60, alignment: "center",
      color: "#0a0d14", "font-color": homeCol(t), content: "",
    }, g);
    el("m-label", {
      y: 7.0, ry: 180, width: 6, height: 1.2, "font-size": 60, alignment: "center",
      color: "#0a0d14", "font-color": homeCol(t), content: "",
    }, g);
    padCounts.push([count, t], [g.children[g.children.length - 1], t]);
    const join = (e) => { joinTeam(e, t); };
    on(pad, "collisionstart", join);
    on(pad, "collisionmove", join);
  }
  // put whoever sent event e on team t. Returns "joined", "same",
  // "busy" (carrying or caged), "locked" or "noid".
  //
  // TEAMS LOCK WHILE A GAME IS ON - v50.
  // Dinopawnz: "once the game starts, players cannot switch teams...
  // some players accidentally step on a plate and might switch."
  // From the countdown until the game is stopped or won, somebody
  // already on a team stays on it, whichever pad, tile or button
  // they touch. Somebody with NO team can still pick one, so a late
  // arrival is not locked out of the game. TEAM_LOCK false turns it
  // off.
  function joinTeam(e, t) {
    const id = e && e.detail ? e.detail.connectionId : undefined;
    if (id === undefined || id === null) { noIdHits++; return "noid"; }
    idSeen = true;
    const p = player(id);
    if (p.team === t) return "same";
    if (TEAM_LOCK && p.team && (phase === "COUNT" || phase === "LIVE")) return "locked";
    if (p.carrying || p.state === "jail") return "busy";   // no switching mid-play
    p.team = t;
    p.shown = "";
    paintBoards();
    return "joined";
  }

  // ==========================================================
  // TEAM BUTTONS - click it or stand on it
  // ==========================================================
  // A pair at each end of the field and halfway along each gallery.
  // Every sign shows the head count; the one you used flashes.
  //
  // Both work and they share everything below the surface: a click
  // and a collision both arrive carrying a connectionId, which is
  // the whole team mechanism, so joinTeam() cannot tell them apart
  // and does not need to.
  const teamSigns = [];
  function teamStation(x, y, z, ry, only) {
    const g = el("m-group", { x: x, y: y, z: z, ry: ry });
    const sign = el("m-label", {
      y: 4.2, width: 6, height: 1.1, "font-size": 56, alignment: "center",
      color: "#0a0d14", "font-color": homeCol(only), content: "",
    }, g);
    el("m-cube", { y: 4.2, z: -0.1, width: 6.4, height: 1.4, depth: 0.1, color: FRAME }, g);
    sign.team = only;
    teamSigns.push(sign);
    [only].forEach((t) => {
      const bx = 0;
      el("m-cylinder", { x: bx, y: 0.55, radius: 0.8, height: 1.1, color: STEEL_DK, collide: "true" }, g);
      el("m-cylinder", { x: bx, y: 1.13, radius: 0.92, height: 0.06, color: CHALK }, g);
      const dome = el("m-cylinder", {
        x: bx, y: 1.32, radius: 0.72, height: 0.34, color: homeCol(t), collide: "true",
      }, g);
      const top = el("m-label", {
        y: 0.18, rx: -90, width: 1.3, height: 0.6, "font-size": 30, alignment: "center",
        color: homeCol(t), "font-color": "#ffffff", content: teamName(t), collide: "true",
      }, dome);
      el("m-label", {
        x: bx, y: 2.4, width: 2.8, height: 0.7, "font-size": 50, alignment: "center",
        color: homeCol(t), "font-color": "#ffffff", content: "JOIN " + teamName(t),
      }, g);
      let last = 0;
      const press = (e) => {
        const now = Date.now();
        if (now - last < 250) return;
        last = now;
        const r = joinTeam(e, t);
        dome.setAttribute("color", "#ffffff");
        later(() => dome.setAttribute("color", homeCol(t)), 200);
        if (r === "noid") {
          sign.setAttribute("content", "CAN'T TELL WHO CLICKED");
          sign.setAttribute("font-color", CALL_RED);
          later(() => { sign.setAttribute("font-color", homeCol(only)); signShown = ""; paintSigns(); }, 4000);
        } else if (r === "locked") {
          sign.setAttribute("content", "TEAMS LOCKED - GAME ON");
          later(() => { signShown = ""; paintSigns(); }, 2500);
        } else if (r === "busy") {
          sign.setAttribute("content", "NOT WHILE CARRYING OR CAGED");
          later(() => { signShown = ""; paintSigns(); }, 2500);
        } else {
          signShown = "";
          paintSigns();
        }
      };
      on(dome, "click", press);
      on(top, "click", press);

      // ====================================================
      // AND THE SAME THING, WITHOUT THE CLICK
      // ====================================================
      // A tile of team colour on the floor all the way round the
      // plinth. Walk up to the button and you are already standing
      // on it. The click is untouched - this is a second way in.
      //
      // Square and centred rather than placed in front, because a
      // station is a group with its own ry and the two ends face
      // opposite ways; a tile that surrounds the plinth is right
      // whichever side you approach from.
      //
      // IT IS ALSO A REPORTER. Everything else you can stand on in
      // this world tells the floor where you are, and a tile that
      // did not would be a square you go quiet on - marker parked,
      // tail showing, for as long as you stood on it. reports()
      // gives it the same pad plumbing as the pitch.
      //
      // NO DEBOUNCE, ON PURPOSE. The click guards with 250ms because
      // a click is one person; a tile is a crowd, and a shared timer
      // would swallow the second person to step on inside a quarter
      // second of the first. The handler asks whether THIS player is
      // already on this team and leaves if so, which makes it
      // per-player and free to repeat.
      //
      // A carrier or a caged player standing on it is told nothing.
      // joinTeam already refuses them - "no switching mid-play" - and
      // the click says so on the sign. A tile cannot: they are stood
      // on it, the events repeat every PAD_MS, and the sign would
      // flash the same refusal forever.
      const tile = el("m-cube", {
        y: 0.18, width: 6.6, height: 0.36, depth: 6.6, color: homeDark(t),
      }, g);
      el("m-cube", { y: 0.37, width: 5.4, height: 0.06, depth: 5.4, color: homeCol(t) }, g);
      el("m-label", {
        y: 0.41, rx: -90, z: 2.1, width: 5, height: 1.4,
        "font-size": 40, alignment: "center",
        color: homeCol(t), "font-color": "#ffffff", content: "STAND HERE",
      }, g);
      reports(tile, x, z, y + 0.36, ry);
      const step = (e) => {
        const id = e && e.detail ? e.detail.connectionId : undefined;
        if (id === undefined || id === null) return;
        const q = player(id);
        if (q.team === t) return;              // already ours
        if (joinTeam(e, t) === "joined") {
          tile.setAttribute("color", CHALK);
          later(() => tile.setAttribute("color", homeDark(t)), 250);
        }
      };
      on(tile, "collisionstart", step);
      on(tile, "collisionmove", step);
    });
  }
  let signShown = "";
  function paintSigns() {
    const key = teamCount(-1) + ":" + teamCount(1);
    if (key === signShown) return;
    signShown = key;
    teamSigns.forEach((l) => l.setAttribute("content", teamName(l.team) + " TEAM: " + teamCount(l.team)));
  }
  // Each side only offers its own team. Behind each end line, and on
  // each gallery halfway along that team's half.
  teamStation(0, 0, -(FIELD_L / 2 + 5), 180, -1);
  teamStation(0, 0, FIELD_L / 2 + 5, 0, 1);
  if (GALLERY) {
    [61, -61].forEach((x) => {
      teamStation(x, DECK_Y, -50, x > 0 ? 90 : -90, -1);
      teamStation(x, DECK_Y, 50, x > 0 ? 90 : -90, 1);
    });
  }

  const LOBBY_PAD_Z = -(ARENA_L / 2) - 18;
  const TER_PAD_Z = ARENA_L / 2 + 18;
  teamPad(-1, 0, LOBBY_PAD_Z);    // the lobby is the red end
  teamPad(1, 0, TER_PAD_Z);       // the terrace is the blue end

  // ==========================================================
  // FLAGS
  // ==========================================================
  const flags = {};
  function flagModel(parent, t, k) {
    el("m-cylinder", { y: 3.2 * k, radius: 0.1 * k, height: 6.4 * k, color: STEEL }, parent);
    el("m-cube", { x: 1.4 * k, y: 5.5 * k, width: 2.8 * k, height: 1.8 * k, depth: 0.08, color: homeCol(t) }, parent);
    el("m-cube", { x: 1.4 * k, y: 5.5 * k, width: 1.0 * k, height: 0.6 * k, depth: 0.1, color: "#ffffff" }, parent);
    el("m-sphere", { y: 6.5 * k, radius: 0.22 * k, color: WIN_GOLD }, parent);
  }

  // Both flags stand on a platform above their base deck. Taking one
  // means getting up there, and then getting back DOWN and all the
  // way home, which is the whole point of building the thing on
  // stilts - and there is one more flight of it now at each end.
  const FLAG_Y = FLAG_UP_Y + PAD_T;
  [-1, 1].forEach((t) => {
    const z = t * FLAG_Z;
    const base = el("m-group", { z: z, y: FLAG_Y }, flagRoot);
    el("m-cylinder", { y: 0.3, radius: 3.4, height: 0.6, color: STEEL_DK }, base);
    el("m-cylinder", { y: 0.62, radius: 3.5, height: 0.06, color: homeCol(t) }, base);
    // THE STAND IS AS BIG AS IT LOOKS, AND AS TALL.
    // The pad was radius 3.0 with its top at 0.6, standing inside a
    // disc of radius 3.5 whose top is at 0.65. So the outer half-metre
    // of the thing you can SEE was not there - walk onto the rim of
    // your own flag stand and you drop through it to the deck - and
    // the five centimetres of coloured disc above the pad were not
    // there either. Same fault as the crate tops in v27: the ledge and
    // the floor were two different objects. They are one now. It is
    // also the collider that hands the flag over, so the grab radius
    // is now the painted circle, which is what anybody would guess.
    const standPad = el("m-cylinder", {
      y: 0.45, radius: 3.5, height: 0.4, color: homeMid(t),
      collide: "true", "collision-interval": PAD_MS,
    }, base);
    // THE PLINTH THE POLE STANDS IN.
    // Dinopawnz: "this block located on the flag is not solid and im
    // able to walk through it." It was not solid, and it never had
    // been - el() turns collide OFF unless a caller asks for it, and
    // this one never did. So the one piece of the stand that reads
    // most like an object you could hide behind was the one piece you
    // could stand inside. It collides now, and its top is padded like
    // any other metre-high block in this map, so climbing it keeps
    // your marker.
    // The plinth reports as itself, exactly like the stand it sits
    // on, so climbing it keeps your marker. No pad - a pad cannot be
    // round, and there is a perfectly good round solid here already.
    reports(el("m-cylinder", {
      y: 1.1, radius: 0.9, height: 1.0, color: STEEL_DK,
    }, base), 0, z, FLAG_Y + 1.6);
    el("m-light", { y: 7, type: "point", intensity: 30, distance: 20, color: homeCol(t) }, base);
    const home = el("m-group", { y: 1.6 }, base);
    flagModel(home, t, 1);
    listen(standPad, 0, z, (p, kind) => { if (kind !== "end") flagTouch(p, t); }, FLAG_Y + 0.65);

    // the copy that rides over a carrier's head
    const carried = el("m-group", { y: PARK }, flagRoot);
    flagModel(carried, t, 0.45);
    // Shield lights round the carrier's feet, shown while protected.
    // With escorts gone the only thing that lights these is BREAKAWAY,
    // the few seconds after a grab, so they now read as exactly one
    // thing: "this one just came off the stand, you cannot have them
    // yet." Coloured for the CARRIER's team.
    const shield = el("m-group", { y: PARK }, carried);
    for (let k = 0; k < 10; k++) {
      const a = k * 36 * Math.PI / 180;
      orb({
        x: ((ESCORT_R || 3) * Math.sin(a)).toFixed(2), z: ((ESCORT_R || 3) * Math.cos(a)).toFixed(2),
        y: 0, radius: 0.28, color: homeCol(-t),
      }, shield);
    }
    // and a beam for the same reason the players have one: a carrier
    // who goes up takes the flag with them, and everybody in the
    // stadium needs to be able to see where it went.
    const fbeam = skyColumn(carried);
    beamShow(fbeam, false, homeCol(t));
    flags[t] = { t: t, state: "home", carrier: null, home: home, carried: carried, shield: shield, shieldOn: false, beam: fbeam, follow: follower(carried) };
  });

  function flagTouch(p, standTeam) {
    if (phase !== "LIVE" || !p.team || p.state !== "free") return;
    const f = flags[standTeam];
    if (p.team !== standTeam) {
      if (f.state === "home" && !p.carrying) pickUp(p, f);
    } else if (p.carrying) {
      if (!BOTH_FLAGS_HOME || flags[p.team].state === "home") capture(p);
    }
  }

  function pickUp(p, f) {
    f.state = "carried";
    f.carrier = p.id;
    p.carrying = f.t;
    p.grabbedAt = Date.now();
    p.shown = "";
    f.home.setAttribute("y", PARK);
    notice(teamName(p.team) + " HAS THE " + teamName(f.t) + " FLAG!", 5000, homeCol(p.team));
  }

  function returnFlag(t, message) {
    const f = flags[t];
    if (f.state === "home") return;
    const p = players.get(f.carrier);
    if (p) { p.carrying = 0; p.shown = ""; }
    f.state = "home";
    f.carrier = null;
    f.home.setAttribute("y", 1.6);        // inside the base group, so on the deck
    hideFollower(f.follow);
    if (f.beam) beamShow(f.beam, false);
    f.carried.setAttribute("y", PARK);
    f.shield.setAttribute("y", PARK);
    f.shieldOn = false;
    if (message) notice(message, 4000, homeCol(t));
  }

  function capture(p) {
    const t = p.carrying;
    returnFlag(t);
    score[p.team]++;
    flash(homeCol(p.team));
    if (score[p.team] >= CAPS_TO_WIN || suddenDeath) {
      finish(p.team);
    } else {
      notice(teamName(p.team) + " SCORES!   " + scoreLine(), 6000, homeCol(p.team));
    }
  }

  function scoreLine() { return "RED " + score["-1"] + " - " + score["1"] + " BLUE"; }

  // ==========================================================
  // TAGGING
  // ==========================================================
  // In your own half, get within TAG_R of an enemy and they are
  // caught. Positions are the floor's, carried forward by speed.
  // a carrier with a teammate close by, or fresh off the stand
  function protectedCarrier(a, now) {
    if (!a.carrying) return false;
    if (now - (a.grabbedAt || 0) < BREAKAWAY_MS) return true;
    if (!ESCORT_R) return false;
    const pa = predict(a, 0);
    let found = false;
    players.forEach((p) => {
      if (found || p === a || p.team !== a.team || p.state !== "free" || !onPitch(p)) return;
      const q = predict(p, 0);
      if (Math.hypot(q.x - pa.x, q.z - pa.z) <= ESCORT_R) found = true;
    });
    return found;
  }
  // a defender parked on their own flag - see THE RING IS A DISC,
  // NOT A COLUMN. Two tests and both have to pass: near the stand in
  // PLAN, and standing at the stand's own HEIGHT. Standing on the
  // platform is not parking in the ring either; it is holding the one
  // piece of ground you have to climb for.
  function guarding(d, at) {
    if (!NO_GUARD_R) return false;
    const q = at || predict(d, 0);
    if (Math.hypot(q.x, q.z - d.team * FLAG_Z) >= NO_GUARD_R) return false;
    // ANOTHER FLOOR IS NOT THE RING. Anything under the flag - the
    // deck below it and the room below that - is a storey away from
    // the stand and is not somewhere anybody can camp a flag from.
    const y = standY(d);
    if (Math.abs(y - (FLAG_UP_Y + PAD_T)) > LEVEL_TOL) return false;
    if (!NO_GUARD_ON_PLATFORM && onFlagClimb(d.team, q.x, q.z, y)) return false;
    return true;
  }

  function tagTick() {
    if (phase !== "LIVE") return;
    const now = Date.now();
    const live = [];
    players.forEach((p) => { if (p.team && p.state === "free" && onPitch(p)) live.push(p); });
    for (let i = 0; i < live.length; i++) {
      const a = live[i];
      const pa = predict(a, 0);
      // Anyone in the enemy half is fair game. So is a carrier,
      // wherever they are standing - there is no back garden to walk
      // the flag home through.
      const exposed = (a.carrying && CARRIER_ANYWHERE) || !ownHalf(a, pa);
      if (!exposed || now < a.safeUntil) continue;
      if (protectedCarrier(a, now)) continue;
      for (let j = 0; j < live.length; j++) {
        const d = live[j];
        if (d.team === a.team || now - d.lastTagAt < TAG_COOLDOWN) continue;
        // hands full: you cannot catch anybody while you are holding
        // a flag, so a carrier who runs into an enemy carrier loses
        if (d.carrying && !CARRIER_CAN_TAG) continue;
        const pd = predict(d, 0);
        // A chaser normally has to be in their own half. Running down
        // a carrier is the exception - that chase goes wherever it
        // has to go.
        if (!ownHalf(d, pd) && !(a.carrying && CARRIER_ANYWHERE)) continue;
        if (guarding(d, pd)) continue;
        // and they have to be on the same floor. Standing on the
        // catwalk is not standing on the person underneath it.
        if (Math.abs(standY(a) - standY(d)) > LEVEL_TOL) continue;
        if (Math.hypot(pa.x - pd.x, pa.z - pd.z) <= TAG_R) {
          d.lastTagAt = now;
          jail(a, d);
          break;
        }
      }
    }
  }
  every(tagTick, 100);

  // by: whoever made the tag. They are standing within TAG_R of
  // their catch when the cage comes down, which is well inside where
  // the walls are about to be - so the cage is slid off them, and if
  // it cannot be, it waits a moment and tries again rather than
  // shutting the pair of them in together.
  function jail(p, by) {
    const now = Date.now();
    if (p.carrying) returnFlag(p.carrying, teamName(p.carrying) + " FLAG SAVED - BACK HOME");
    const at = predict(p, CAGE_LAG);
    // ON THEM first, close by second, and if a crowd has taken all of
    // it, anywhere up to CAGE_FAR that shuts nobody in.
    //
    // The first pass is new in v39 and it is the one that matters:
    // take a spot ONLY if the prisoner ends up inside the cage. Left
    // to itself the fitter will happily answer a tag on a crowded
    // platform with a small cage two metres away, which then sits
    // there for CAGE_CHECK_MS with the person standing beside it
    // before it gives up and lets them go. Better to find one that
    // holds them, and failing that to fall through to the behaviour
    // that was already here.
    //
    // And when no spot holds them, WAITING beats settling. The
    // commonest reason nothing fits is the tagger standing where the
    // wall wants to be, and they are about to run off; CAGE_RETRY_MS
    // is already built for exactly that and is a quarter of the time
    // a wrong cage takes to notice it missed. So the loose passes are
    // held back until the retries are used up.
    let rec = dropCage(at.x, at.z, p, by, CAGE_FIT, true);
    if (!rec && (p.tries || 0) >= CAGE_TRIES) {
      rec = dropCage(at.x, at.z, p, by, CAGE_FIT) ||
            dropCage(at.x, at.z, p, by, CAGE_FAR);
    }
    if (!rec) {
      // nowhere that would not also shut somebody else in. Give it a
      // moment for whoever is in the way to move, and hold the tag
      // meanwhile so the same catch cannot be made twice.
      p.tries = (p.tries || 0) + 1;
      if (p.tries <= CAGE_TRIES) {
        p.safeUntil = now + CAGE_RETRY_MS + 60;
        later(() => {
          if (phase === "LIVE" && p.state === "free") jail(p, by);
        }, CAGE_RETRY_MS);
      } else {
        p.tries = 0;
        p.safeUntil = now + 2000;
      }
      return;
    }
    p.tries = 0;
    p.state = "jail";
    p.shown = "";
  }

  // ==========================================================
  // CAGES AND RESCUE
  // ==========================================================
  // SIDE is gone: the hex side length is a function of how wide THIS
  // cage was allowed to be, so it is worked out in buildCage() now.
  // CORNER stays because the rescue plate still reasons about a
  // full-sized one, and a plate is only built when RESCUE is on.
  const CORNER = CAGE_A / Math.cos(Math.PI / 6);
  const CAGE_CLEAR = CORNER + CAGE_CLEAR_M;   // nobody but the prisoner
                                              // inside this of a cage centre
  const EDGE_X = FIELD_W / 2 - CAGE_A + 0.3;
  const EDGE_Z = FIELD_L / 2 - CAGE_A;

  function nearStand(x, z, r) {
    return Math.hypot(x, z - FLAG_Z) < r || Math.hypot(x, z + FLAG_Z) < r;
  }
  // HOW WIDE A CAGE MAY BE HERE - the plan half of cageHeight(), and
  // it answers in metres for the same reason: so the thing gets built
  // to the room that is actually there instead of being refused.
  //
  // Three things take room away. The surface underfoot has edges, and
  // a cage hanging off the side of a deck is not a cage. A flag pole
  // must not end up inside one. And there is a floor under how small
  // is still a cage, below which the spot is refused after all.
  //
  // The apron of a flag stand is deliberately NOT in that list. It is
  // a 65cm dais you walk over, and refusing the whole 3.5m disc is
  // what pushed cages into the corners of the platform in the first
  // place. What has to stay outside the walls is the pole - see
  // STAND_KEEP - and a caged player cannot pick a flag up anyway,
  // because flagTouch() wants state "free".
  // It measures by PROBING rather than by reading edges out of a
  // table, because reading edges makes a cliff out of every seam in
  // the map - the top tread of the flag stairs and the near edge of
  // the platform are two tables apart and half a step high. Six
  // points round the rim of the cage, shrinking until they all have
  // ground under them; on a flight of stairs the ground is allowed to
  // be a slope's worth out, which is what surfaceNear's tolerance is.
  // What a cage centred here stands on. The usual surfaces first; then
  // a box top, if the prisoner is up on one - see BOXES. On a box the
  // answer carries the box and its base, and the cage is built from
  // the base up.
  function cageSurface(x, z, y) {
    const b = boxAt(x, z, y, CAGE_A - 0.3);
    if (b) return { top: b[4], base: b[5], slope: 0, box: b };
    const s = surfaceAt(x, z, y);
    if (s) return s;
    const r = roofNear(x, z, y, 1.0);
    return r === null ? null : { top: r, slope: 0, roof: true };
  }
  // THE TUNNEL ROOFS ARE FLOORS TOO - v49.
  // Dinopawnz: "tagging still does not work on here on the 2nd floor
  // bridge on top of these ceilings."
  //
  // The lids over the bridge arms and the rim climbs are gridded with
  // pads like any deck, so people on them were seen and tagged - and
  // then the cage fitter, which reads surfaces out of DECKS and
  // RAMPS, found nothing under them and let the prisoner go. A roof's
  // walking height is its pad top: the lid plus PAD_T.
  function roofNear(x, z, ref, tol) {
    let best = null, bestD = tol;
    for (let i = 0; i < ROOF_TOPS.length; i++) {
      const r = ROOF_TOPS[i];
      if (x < r[0] || x > r[1] || z < r[2] || z > r[3]) continue;
      const gap = Math.abs(r[4] + PAD_T - ref);
      if (gap <= bestD) { bestD = gap; best = r[4] + PAD_T; }
    }
    return best;
  }
  function cageRoom(x, z, y) {
    const s = cageSurface(x, z, y);
    if (!s) return 0;
    // on a box the rim is measured against the floor the box stands
    // on, and any rim point that is still over a box is fine too
    const top = s.box ? s.base : s.top;
    let cap = CAGE_A;
    if (STAND_KEEP && Math.abs(top - FLAG_Y) < 1.2) {
      // ...AND A CAGE AT THE FOOT OF THE POLE IS STILL A CAGE.
      // This was cap = distance - STAND_KEEP and nothing else, which
      // goes NEGATIVE within 1.4m of the pole and under CAGE_MIN_A
      // within 2.9m of it - so cageRoom answered zero over a 5.8m
      // circle centred on the flag, and a raider tagged at the stand
      // got three retries and then a cage in the corner they were
      // standing outside of. That circle is where the whole game
      // happens. Keeping the pole out of the walls is worth a
      // narrower cage; it is not worth no cage, and a prisoner cannot
      // pick the flag up from inside one anyway - flagTouch() wants
      // state "free". So the pole still pushes the walls in, down to
      // the narrowest thing that is still a cage, and no further.
      cap = Math.min(cap, Math.max(CAGE_MIN_A,
                          Math.min(Math.hypot(x, z - FLAG_Z),
                                   Math.hypot(x, z + FLAG_Z)) - STAND_KEEP));
    }
    for (let a = cap; a >= CAGE_MIN_A - 0.001; a -= 0.2) {
      const tol = s.slope * a + 0.5;
      let good = true;
      for (let k = 0; k < 6 && good; k++) {
        const ang = k * Math.PI / 3;
        const rx = x + Math.cos(ang) * a, rz = z + Math.sin(ang) * a;
        if (surfaceNear(rx, rz, top, tol) === null &&
            roofNear(rx, rz, top, tol) === null &&
            !(s.box && boxGap(s.box, rx, rz) === 0)) good = false;
      }
      if (good) return +a.toFixed(2);
    }
    return 0;
  }
  // A spot has to be a surface at the right height, clear of the flag
  // poles, clear of other cages on the same floor, clear of cover,
  // and - the one that matters most - not about to close round
  // anybody who is not the prisoner. It returns the half-width that
  // fits here, which is a number rather than a yes: zero is "no", and
  // anything else is both the answer and the size.
  function spotClear(x, z, y, keepId) {
    if (Math.abs(x) > EDGE_X || Math.abs(z) > EDGE_Z) return 0;
    let a = cageRoom(x, z, y);
    if (!a) return 0;
    // low ceilings are fine - see CAGE_MIN_H - but there is a floor
    // under how short a cage may be, and a pillar is not somewhere to
    // shut anybody in with
    // A box under a deck is the exception. Somebody is already
    // standing on it, so there is room for a person; the cage is
    // just shorter - see BOX_MIN_H.
    const onBox = boxAt(x, z, y, CAGE_A - 0.3);
    if (headroomAt(x, z, y) < (onBox ? BOX_MIN_H : CAGE_MIN_H) + CAGE_HEAD_GAP) return 0;
    // A BYSTANDER SHRINKS THE CAGE, it does not only push it away.
    //
    // This was a yes/no: anybody within CAGE_CLEAR of the centre and
    // the spot was refused outright. But CAGE_CLEAR is measured off a
    // FULL-SIZED cage, and the person it refuses is nearly always the
    // tagger, who by definition is standing within TAG_R. A cage that
    // is 5.6m across cannot both hold somebody and keep their tagger
    // out from a metre away - but one that is 4m across can, and a
    // smaller cage that closes now beats a big one that never does.
    //
    // So the nearest bystander sets a width the same way the ground
    // does, and the spot is only refused when even CAGE_MIN_A would
    // shut them in.
    let near = Infinity;
    players.forEach((q) => {
      if (q.id === keepId || !q.team || !onPitch(q)) return;
      if (Math.abs(q.y - y) > LEVEL_TOL) return;
      const at = predict(q, 0);
      near = Math.min(near, Math.hypot(x - at.x, z - at.z));
    });
    if (near !== Infinity) a = Math.min(a, (near - CAGE_CLEAR_M) * Math.cos(Math.PI / 6));
    if (a < CAGE_MIN_A) return 0;
    if (onPillar(x, z, y, a)) return 0;
    if (inCover(x, z, a, y)) return 0;
    // two cages stay a cage and a half apart, which for full-sized
    // ones is the CAGE_MIN_GAP it always was and for a pair of narrow
    // ones on a platform is as much as there is room for
    for (let i = 0; i < cages.length; i++) {
      const c = cages[i];
      if (Math.abs(c.y - y) > LEVEL_TOL) continue;      // a floor apart is fine
      const gap = Math.min(CAGE_MIN_GAP, a + (c.a || CAGE_A) + 0.8);
      if (Math.hypot(x - c.x, z - c.z) < gap) return 0;
    }
    return +a.toFixed(2);
  }
  // Returns [x, z, halfWidth] - the width comes back with the spot
  // because it is a property OF the spot, and dropCage must not go
  // and work it out again from the ground alone: spotClear may have
  // narrowed it to keep a bystander outside, and rebuilding it wider
  // would shut that bystander in.
  function freeSpot(x, z, bx, bz, y, keepId) {
    const cx = clamp(x, -EDGE_X, EDGE_X), cz = clamp(z, -EDGE_Z, EDGE_Z);
    const here = spotClear(cx, cz, y, keepId);
    if (here) return [cx, cz, here];
    for (let ring = 1; ring <= 16; ring++) {
      const r = ring * 0.45;
      // Ranked by how far INSIDE the cage the prisoner ends up, not
      // by how near the cage lands. On open ground every candidate in
      // a ring is the same width, so the two are the same question
      // and this picks the closest exactly as it always did. Where
      // the width varies - a platform edge, a flight of stairs - they
      // come apart, and then a slightly further spot that holds them
      // beats a nearer one that leaves them against the wall.
      let best = null, bestScore = -Infinity;
      for (let k = 0; k < 16; k++) {
        const ang = (k / 16) * Math.PI * 2 + ring * 0.31;
        const tx = cx + Math.cos(ang) * r, tz = cz + Math.sin(ang) * r;
        const a = spotClear(tx, tz, y, keepId);
        if (!a) continue;
        const score = a - Math.hypot(tx - bx, tz - bz);
        if (score > bestScore) { bestScore = score; best = [tx, tz, a]; }
      }
      if (best) return best;
    }
    return null;
  }

  // Shove the cage off whoever made the tag: away from them, far
  // enough that the walls close behind their back, but never so far
  // that the prisoner ends up outside their own cage.
  function pushOff(x, z, by) {
    if (!by) return [x, z];
    const a = predict(by, 0);
    let dx = x - a.x, dz = z - a.z;
    let r = Math.hypot(dx, dz);
    if (r > CAGE_CLEAR) return [x, z];              // already outside
    if (r < 0.05) { dx = 0; dz = 1; r = 1; }        // standing on each other
    const d = clamp(CAGE_CLEAR - r, 0, CAGE_A - 0.5);
    return [x + (dx / r) * d, z + (dz / r) * d];
  }

  // The plate faces the prisoner's own half - rescuers come from home
  // - but never lands on a stand, another cage or another plate, and
  // never off the pitch.
  function plateOK(x, z, self) {
    if (Math.abs(x) > FIELD_W / 2 - PLATE_RAD - 0.5 || Math.abs(z) > FIELD_L / 2 - PLATE_RAD - 0.5) return false;
    if (nearStand(x, z, 3.5 + PLATE_RAD + 0.3)) return false;
    for (let i = 0; i < cages.length; i++) {
      const c = cages[i];
      if (c === self) continue;
      if (Math.hypot(x - c.x, z - c.z) < CORNER + PLATE_RAD + 0.4) return false;
      if (Math.hypot(x - c.px, z - c.pz) < PLATE_RAD * 2 + 0.6) return false;
    }
    return true;
  }
  function plateSpot(rec) {
    const hx = 0, hz = rec.team * FLAG_Z;   // towards the prisoner's own flag
    const toward = Math.atan2(hx - rec.x, hz - rec.z);
    for (const r of [PLATE_R, PLATE_R + 2, PLATE_R + 4]) {
      for (let k = 0; k < 24; k++) {
        const off = (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 15 * Math.PI / 180;
        const dx = Math.sin(toward + off), dz = Math.cos(toward + off);
        if (plateOK(rec.x + dx * r, rec.z + dz * r, rec)) return [rec.x + dx * r, rec.z + dz * r];
      }
    }
    return [rec.x + Math.sin(toward) * PLATE_R, rec.z + Math.cos(toward) * PLATE_R];
  }

  function buildCage(rec) {
    // H and A, not CAGE_H and CAGE_A. Everything in here is measured
    // off the height and the width this particular cage was allowed -
    // see CAGE_MIN_H and CAGE_MIN_A. DROP is how far the walls reach
    // below the middle, which is nothing on the flat.
    const H = rec.h || CAGE_H;
    const A = rec.a || CAGE_A;
    const DROP = rec.drop || 0;
    const WALL = H + DROP;
    const side = 2 * A * Math.tan(Math.PI / 6) + 0.4;
    const corner = A / Math.cos(Math.PI / 6);
    const g = document.createElement("m-group");
    g.setAttribute("x", rec.x.toFixed(2));
    g.setAttribute("z", rec.z.toFixed(2));
    g.setAttribute("y", (rec.y - DROP).toFixed(2));   // the floor they were
                                                      // caught on, or below it
                                                      // if that floor is stairs
    cageRoot.append(g);
    const tint = homeCol(rec.team);
    // no base plate on a slope - it would be a flat disc cutting
    // through the steps it is meant to be sitting on
    if (DROP < 0.25) el("m-cylinder", { y: 0.2, radius: A + 0.55, height: 0.4, color: STEEL_DK }, g);

    // walls inside an m-prompt: click one to type the cage code
    const lock = document.createElement("m-prompt");
    lock.setAttribute("message", "Host code");
    lock.setAttribute("placeholder", "code");
    g.append(lock);
    for (let i = 0; i < 6; i++) {
      const a = i * 60, r = a * Math.PI / 180;
      el("m-cube", {
        x: A * Math.sin(r), z: A * Math.cos(r), y: WALL / 2, ry: a,
        width: side, height: WALL, depth: 0.12,
        color: tint, opacity: 0.14, collide: "true",
      }, lock);
      for (let b = -1; b <= 1; b++) {
        el("m-cylinder", {
          x: A * Math.sin(r) + b * (side / 4) * Math.cos(r),
          z: A * Math.cos(r) - b * (side / 4) * Math.sin(r),
          y: WALL / 2, radius: 0.05, height: WALL, color: STEEL,
        }, g);
      }
    }
    for (let i = 0; i < 6; i++) {
      const r = (i * 60 + 30) * Math.PI / 180;
      el("m-cylinder", { x: corner * Math.sin(r), z: corner * Math.cos(r), y: WALL / 2, radius: 0.13, height: WALL + 0.4, color: STEEL }, g);
    }
    // The lid is H above the MIDDLE of the cage however far the walls
    // reach below it, so a cage on the stairs is taller on the low
    // side rather than lower overall - the prisoner still has CAGE_H
    // of headroom wherever they stand in it.
    el("m-cylinder", { y: WALL + 0.15, radius: A + 0.55, height: 0.3, color: STEEL_DK, collide: "true" }, lock);
    // and the count sits closer to the lid on a short one, so it is
    // not floating inside the deck the cage is standing under
    rec.count = crossLabels(g, WALL + (H >= CAGE_H ? 1.1 : 0.55), "JAIL", tint, "#ffffff",
                            Math.min(3.2, A * 1.15), 0.9, 56);
    on(lock, "prompt", (e) => {
      const typed = String((e && e.detail && e.detail.value) || "").replace(/[^0-9]/g, "");
      if (typed === CAGE_CODE.join("")) openCage(rec, "host");
    });

    // the rescue plate. Off by default - see RESCUE.
    if (!RESCUE) { rec.group = g; return; }
    const pg = el("m-group", { x: (rec.px - rec.x).toFixed(2), z: (rec.pz - rec.z).toFixed(2) }, g);
    el("m-cylinder", { y: 0.14, radius: PLATE_RAD + 0.35, height: 0.28, color: tint }, pg);
    const disc = el("m-cylinder", {
      y: 0.4, radius: PLATE_RAD, height: 0.32, color: homeMid(rec.team),
      collide: "true", "collision-interval": PAD_MS,
    }, pg);
    el("m-label", {
      y: 0.57, rx: -90, width: 2.6, height: 0.9, "font-size": 26, alignment: "center",
      color: homeMid(rec.team), "font-color": "#ffffff", content: "FREE " + teamName(rec.team),
    }, pg);
    el("m-cylinder", { y: 1.6, radius: 0.09, height: 3.0, color: tint }, pg);
    rec.lamp = el("m-sphere", { y: 3.3, radius: 0.34, color: tint }, pg);
    // A hop on the plate must not restart the hold: losing contact is
    // remembered, not acted on, and coming back within HOP_MS keeps
    // the clock they already had running.
    listen(disc, rec.px, rec.pz, (p, kind) => {
      const held = rec.holders.get(p.id);
      if (kind === "end") { if (held) held.left = Date.now(); return; }
      if (p.team !== rec.team || p.state !== "free" || p.id === rec.id) return;
      if (held) held.left = 0;
      else rec.holders.set(p.id, { since: Date.now(), left: 0 });
    });
    rec.group = g;
  }

  // hold: only accept a spot the prisoner ends up INSIDE. jail() asks
  // for that first and settles for less afterwards - see the note
  // there. Without it the fitter was free to answer a tag beside the
  // flag with a narrow cage two metres to the left, which is a box
  // the person is standing next to.
  function dropCage(x, z, p, by, fit, hold) {
    if (cages.length >= MAX_CAGES) return null;
    const y = p.y;
    const want = pushOff(x, z, by);
    let spot = freeSpot(want[0], want[1], x, z, y, p.id);
    // pushOff shoves by what a FULL-SIZED cage needs to clear the
    // tagger, and a narrowed one does not need all of it - so on a
    // staircase or a platform edge the shove can carry the walls past
    // the person it is shutting in. When it does, search again from
    // where they are actually standing.
    if (hold && spot && Math.hypot(spot[0] - x, spot[1] - z) > spot[2]) {
      spot = freeSpot(x, z, x, z, y, p.id) || spot;
    }
    if (!spot || Math.hypot(spot[0] - x, spot[1] - z) > (fit || CAGE_FIT)) return null;
    // ...and "inside" means the same thing here as it does in
    // cageTick, which is the only other place that asks: within the
    // wall line. Anything stricter is unsatisfiable, because the
    // tagger is standing TAG_R away and the cage has to be slid off
    // them - a prisoner near their own wall is the normal case, not a
    // failure. Anything looser and cageTick disagrees and lets them
    // go, which is the whole fault being fixed.
    if (hold && Math.hypot(spot[0] - x, spot[1] - z) > spot[2]) return null;
    // the width that fits at the spot that was chosen, and the
    // surface it is standing on - which on a staircase is NOT the
    // height the prisoner reported, because the cage may have landed
    // a step or two down the flight from them
    const a = spot[2] || CAGE_A;
    const s = cageSurface(spot[0], spot[1], y);
    const top = s ? s.top : y;
    const rec = {
      x: spot[0], z: spot[1], y: top, id: p.id, team: p.team, born: Date.now(),
      outSince: 0, retried: false, holders: new Map(), group: null, px: 0, pz: 0,
      // built to the room that is actually here: CAGE_H of air out in
      // the open and about four metres under any deck, CAGE_A across
      // on the pitch and less on a platform
      a: a,
      h: s && s.box
        ? clamp(headroomAt(spot[0], spot[1], top) - CAGE_HEAD_GAP, BOX_MIN_H, CAGE_H)
        : cageHeight(spot[0], spot[1], top),
      // ON A STAIRCASE THE FLOOR IS NOT LEVEL. The treads under the
      // footprint drop away by the slope times the width, so the
      // walls are extended DOWN by that much and the group is sunk to
      // match - otherwise the low side of the cage hangs a metre over
      // the steps with a gap under it to walk out through. The lid
      // does not move: it is still h above the middle.
      // ON A BOX the walls go all the way down to the box's floor.
      drop: s && s.box ? +(s.top - s.base).toFixed(2)
          : s && s.slope ? +(s.slope * a + 0.2).toFixed(2) : 0,
    };
    const ps = plateSpot(rec);
    rec.px = ps[0]; rec.pz = ps[1];
    buildCage(rec);
    cages.push(rec);
    return rec;
  }

  function removeCage(rec) {
    const i = cages.indexOf(rec);
    if (i >= 0) cages.splice(i, 1);
    if (rec.group && rec.group.parentNode) rec.group.parentNode.removeChild(rec.group);
  }

  function openCage(rec, why) {
    removeCage(rec);
    const p = players.get(rec.id);
    if (p && p.state === "jail") {
      p.state = "free";
      p.safeUntil = Date.now() + SAFE_AFTER_FREE;
      p.shown = "";
    }
    if (why === "rescue") notice(teamName(rec.team) + " RESCUE!", 2500, homeCol(rec.team));
  }

  function clearCages() {
    while (cages.length) removeCage(cages[cages.length - 1]);
    players.forEach((p) => { p.state = "free"; p.shown = ""; });
  }

  function cageTick() {
    const now = Date.now();
    for (let i = cages.length - 1; i >= 0; i--) {
      const rec = cages[i];
      const p = players.get(rec.id);
      if (!p) { removeCage(rec); continue; }
      // rescue: a teammate on the plate long enough
      let lit = false;
      if (!RESCUE) rec.holders.clear();
      rec.holders.forEach((held, hid) => {
        const h = players.get(hid);
        if (!h || h.state !== "free" || h.team !== rec.team) { rec.holders.delete(hid); return; }
        // off the plate longer than a hop: they really did step off
        if (held.left && now - held.left > HOP_MS) { rec.holders.delete(hid); return; }
        lit = true;
        if (now - held.since >= RESCUE_HOLD) rec.rescued = true;
      });
      if (rec.lamp && rec.lampLit !== lit) { rec.lampLit = lit; rec.lamp.setAttribute("color", lit ? "#ffffff" : homeCol(rec.team)); }
      if (rec.rescued) { openCage(rec, "rescue"); continue; }
      // The sentence. Three seconds, counted down on the cage itself,
      // and then it lets go on its own.
      if (JAIL_MS) {
        const left = JAIL_MS - (now - rec.born);
        if (left <= 0) { openCage(rec, "time"); continue; }
        const secs = String(Math.ceil(left / 1000));
        if (rec.shownCount !== secs && rec.count) {
          rec.shownCount = secs;
          rec.count.forEach((l) => l.setAttribute("content", secs));
        }
      }
      // did it land on them? If they are clearly outside it, one more
      // try where they are now; after that, give up and let them go.
      // mid-hop their last floor report is stale - wait until they land
      if (!onPitch(p) || airborne(p)) continue;
      const inside = p.y > rec.y - (rec.drop || 0) - 0.6 && p.y < rec.y + LEVEL_TOL &&
                     Math.hypot(p.x - rec.x, p.z - rec.z) < (rec.a || CAGE_A) + 0.4;
      if (inside) { rec.outSince = 0; continue; }
      if (!rec.outSince) rec.outSince = now;
      if (now - rec.outSince < CAGE_CHECK_MS) continue;
      const retried = rec.retried;
      removeCage(rec);
      if (!retried) {
        const at = predict(p, CAGE_LAG);
        const again = dropCage(at.x, at.z, p, null);
        if (again) { again.retried = true; continue; }
      }
      p.state = "free";
      p.safeUntil = now + 2000;
      p.shown = "";
    }
  }
  every(cageTick, 200);

  // ==========================================================
  // MARKERS - a team diamond over everybody, a flag over a carrier
  // ==========================================================
  // A follower is a group that rides with a player. It keeps its own
  // shown position and eases towards where the player will be a
  // moment from now, so it glides between floor reports instead of
  // hopping from one to the next.
  function follower(node) {
    const lerp = document.createElement("m-attr-lerp");
    lerp.setAttribute("attr", "x,z");
    lerp.setAttribute("duration", String(LERP_MS));
    lerp.setAttribute("easing", "linear");
    node.append(lerp);
    return { node: node, x: 0, z: 0, lx: 1e9, lz: 1e9, ly: 1e9, shown: false, showAt: 0 };
  }
  // y is how high above the player's own feet the thing rides, so a
  // marker follows them up a ramp and onto a deck instead of staying
  // down on the floor where they got on.
  function followTo(f, p, y, now) {
    const tgt = markerAt(p, FOLLOW_LEAD);
    const ry = +(standY(p) + y).toFixed(2);
    if (!f.shown) {
      // put it in place while still hidden, then show it - so it never
      // streaks in from wherever it was last
      f.x = tgt.x; f.z = tgt.z; f.lx = f.x; f.lz = f.z;
      f.node.setAttribute("x", f.x.toFixed(2));
      f.node.setAttribute("z", f.z.toFixed(2));
      f.shown = true;
      f.ly = ry;
      f.showAt = now + 140;
      return;
    }
    const dx = tgt.x - f.x, dz = tgt.z - f.z;
    if (Math.hypot(dx, dz) > FOLLOW_SNAP) { f.x = tgt.x; f.z = tgt.z; }
    else { f.x += dx * FOLLOW_EASE; f.z += dz * FOLLOW_EASE; }
    if (Math.hypot(f.x - f.lx, f.z - f.lz) > 0.015) {
      f.lx = f.x; f.lz = f.z;
      f.node.setAttribute("x", f.x.toFixed(2));
      f.node.setAttribute("z", f.z.toFixed(2));
    }
    if (f.showAt && now >= f.showAt) { f.node.setAttribute("y", ry); f.ly = ry; f.showAt = 0; }
    else if (!f.showAt && Math.abs(ry - f.ly) > 0.05) { f.ly = ry; f.node.setAttribute("y", ry); }
  }
  function hideFollower(f) {
    if (!f.shown) return;
    f.node.setAttribute("y", PARK);
    f.shown = false;
    f.showAt = 0;
  }

  // THE SKY BEAM.
  // The floor is the only thing that knows where anybody is, and it
  // knows nothing about height once you leave it. So a marker cannot
  // follow you up - there is no number to follow. What it can do is
  // stand a column of your team colour on the spot you left the
  // ground and run it up through the sky, which puts your colour
  // beside you however high you go, and tells everybody else that
  // somebody is up there and roughly where. It is a sightline, not a
  // wall: nothing collides with it.
  // THE SKY COLUMN.
  // One ball at one height is no good here, because there is no
  // height to put it at. So the marker becomes a column: a thin line
  // of team colour standing on the spot you left the ground, with a
  // team ball threaded up it every SKY_STEP metres. Whatever height
  // you are at, one of them is beside your head - which is the thing
  // that was asked for, done the only way the floor allows. It also
  // tells everybody else at a glance that somebody is up there and
  // where they went up from. Nothing in it collides.
  function skyColumn(g) {
    if (!SKY_COLUMN) return null;   // v15: see THE SKY COLUMN IS OFF
    const c = el("m-group", { y: PARK }, g);
    const parts = [el("m-cube", {
      y: SKY_BEAM / 2, width: SKY_BEAM_W, height: SKY_BEAM, depth: SKY_BEAM_W,
      color: "#ffffff", opacity: SKY_BEAM_OP, collide: "false",
    }, c)];
    for (let i = 1; i <= SKY_DOTS; i++) {
      parts.push(orb({
        y: 2.5 + i * SKY_STEP, radius: 0.34,
        color: "#ffffff", collide: "false",
      }, c));
    }
    c.__parts = parts;
    return c;
  }
  function beamShow(node, on, color) {
    if (!node) return;
    const want = on ? 0 : PARK;
    if (node.__on !== want) { node.__on = want; node.setAttribute("y", want); }
    if (on && color && node.__col !== color) {
      node.__col = color;
      node.__parts.forEach((q) => q.setAttribute("color", color));
    }
  }

  // THE TAIL. When the probe is working the ball rides over your
  // head at your real height, which is right - but from the floor,
  // forty metres below, a small ball against the sky is nothing. So
  // while you are up and tracked, a short line hangs under it. It is
  // not the sky column: the column stands on the ground and marks a
  // spot you have left, this hangs from YOU and moves with you.
  function tail(g) {
    return el("m-cube", {
      y: PARK, width: SKY_BEAM_W, height: GLIDE_TAIL_H, depth: SKY_BEAM_W,
      color: "#ffffff", opacity: SKY_BEAM_OP, collide: "false",
    }, g);
  }
  function tailShow(p, on) {
    if (!p.tail) return;
    const want = on ? +(2.2 - GLIDE_TAIL_H / 2).toFixed(2) : PARK;
    if (p.tail.__on === want) return;
    p.tail.__on = want;
    p.tail.setAttribute("y", want);
    if (on) p.tail.setAttribute("color", homeCol(p.team));
  }

  function markerFor(p) {
    const g = el("m-group", { y: PARK }, markRoot);
    // A REAL SPHERE, not a LOW_POLY cube. Dinopawnz: "maybe turn that
    // square marker into a circle above our heads." Everything else in
    // this document that calls orb() still gets the cheap cube - this
    // is the one thing on screen that is always in shot and always
    // moving, and a cube's hard edges turn a centimetre of movement
    // into a visible flicker where a sphere just slides. At MARKER_R
    // 0.24 it is about 128 triangles a player, which is nothing.
    const gem = MARKER_SPHERE
      ? el("m-sphere", { y: MARKER_Y, radius: MARKER_R, color: "#ffffff" }, g)
      : orb({ y: MARKER_Y, radius: MARKER_R, color: "#ffffff" }, g);
    p.marker = g;
    p.gem = gem;
    p.beam = skyColumn(g);
    p.tail = GLIDE_TAIL ? tail(g) : null;
    // a ring on the ground in the team colour. In a scrum every ball
    // is up above the heads and they all look alike from a distance;
    // this is at eye level with the people you are trying to tell
    // apart, and it is right under the person it belongs to.
    p.ring = FOOT_RING ? el("m-cylinder", {
      y: 0.07, radius: 1.15, height: 0.14,
      color: "#ffffff", opacity: 0.55, collide: "false",
    }, g) : null;
    p.follow = follower(g);
  }
  function markerTick() {
    const now = Date.now();
    players.forEach((p) => {
      if (!TEAM_MARKERS || !p.team) return;
      if (!p.marker) markerFor(p);
      const want = !present(p) ? "hide" : p.state === "jail" ? "jail" : "team" + p.team;
      if (want !== p.shown) {
        p.shown = want;
        if (want !== "hide") {
          const c = want === "jail" ? "#555a66" : homeCol(p.team);
          p.gem.setAttribute("color", c);
          if (p.ring) p.ring.setAttribute("color", c);
        }
      }
      if (want === "hide") {
        beamShow(p.beam, false); tailShow(p, false); hideFollower(p.follow); return;
      }
      followTo(p.follow, p, 0, now);
      // up in the air the ball is at the height they took off from,
      // which is nowhere near them. The beam is what they are marked
      // by until they land.
      // The sky column is the FALLBACK. When the probe is calibrated
      // the ball is already over their head at their real height, so
      // the column is not needed and would only be a line standing on
      // a spot they left. It comes back the moment tracking drops.
      const trk = tracked(p);
      beamShow(p.beam, highUp(p) && !trk, want === "jail" ? "#555a66" : homeCol(p.team));
      // The tail is a "somebody is above you" sign for people on the
      // pitch, so it is only ever hung over the pitch - the same
      // touchline present() uses.
      tailShow(p, trk && p.pads === 0 && highUp(p) && overField(markerAt(p, 0)));
    });
    // carried flags ride over their carrier
    [-1, 1].forEach((t) => {
      const f = flags[t];
      if (f.state !== "carried") return;
      const p = players.get(f.carrier);
      if (!p) { returnFlag(t, teamName(t) + " FLAG RETURNED"); return; }
      // the clock on a carrier who is off the pitch only starts once
      // the hop they might be in the middle of is over
      // TWO CLOCKS ON A CARRIED FLAG, and the shorter one wins.
      //
      // The first only starts once the flight they might be in the
      // middle of is over, so no jump or glide can run it out - a flag
      // comes home because its carrier LEFT, never because they went
      // up. Somebody who walks off the touchline is off the pitch in a
      // fifth of a second and has dropped it inside four.
      //
      // The second does not care what the floor thinks. It is a hard
      // ceiling on how long a flag may be held by somebody no pad has
      // reported at all, and it exists because "airborne" and "gone"
      // look identical from down here. A player who disappears in the
      // middle of the pitch without a disconnect - a respawn, a
      // portal, a client that dies quietly - would otherwise take a
      // flag out of the game with them.
      if (p.offSince && now - p.offSince > FLAG_AIR_MAX) {
        returnFlag(t, teamName(t) + " FLAG RETURNED");
        return;
      }
      if (!onPitch(p) && p.offSince && now - p.offSince > FLAG_OFF_MS + airWindow(p)) {
        returnFlag(t, teamName(t) + " FLAG RETURNED");
        return;
      }
      const safe = phase === "LIVE" && protectedCarrier(p, now);
      if (safe !== f.shieldOn) {
        f.shieldOn = safe;
        f.shield.setAttribute("y", safe ? -FLAG_RIDE : PARK);  // back down to their feet
      }
      followTo(f.follow, p, FLAG_RIDE, now);
      beamShow(f.beam, highUp(p) && !tracked(p), homeCol(t));
    });
  }
  every(markerTick, FOLLOW_MS);

  // floods flash a team colour on a capture
  function flash(color) {
    flashUntil = Date.now() + 1500;
    floods.forEach((l) => l.setAttribute("color", color));
  }
  function unflash() {
    flashUntil = 0;
    floods.forEach((l) => l.setAttribute("color", LAMP));
  }

  // ==========================================================
  // BOARDS
  // ==========================================================
  const statusLabels = [];
  const countLabels = [];
  // the jumbotron's four faces. Declared up here with the other board
  // arrays so paintBoards() can reach them - they stay empty until
  // the thing is built further down, and painting an empty list is
  // free.
  // ==========================================================
  // MAKING TEXT THE SIZE IT SHOULD BE
  // ==========================================================
  // Dinopawnz: "i have no idea what the lines under 0-0 even say.
  // theyre so tiny lettered."
  //
  // They were 36 and 46, and the reason is worth writing down
  // because guessing font sizes by eye has now caused two bugs in a
  // row - first STAND BY running off the panel, now this.
  //
  // An m-label's font-size is fixed, its box is fixed, and the label
  // will silently wrap or shrink whatever you give it. So a size
  // that looks right for "0 - 0" is far too big for "STAND BY" and
  // far too small for nothing at all - and a line like
  // "14:59 RED FLAG HOME BLUE FLAG HOME JAIL 0-0" is forty-two
  // characters, which at ANY readable size does not fit a fifteen
  // metre board. It was not set small because small looked good. It
  // was set small because that was the only way it fitted, and
  // nobody measured what that cost.
  //
  // So nothing on a board carries a hand-picked size any more. Two
  // numbers, measured off the one size that was known to look right
  // ("0 - 0" at 210 in a 15.4 x 7.2 box):
  //
  //   a character is about 0.0086 metres wide per unit of font-size
  //   a line is about 0.0119 metres tall per unit of font-size
  //
  // fitFS() takes the longer of those constraints and returns the
  // biggest size that still fits the box it was given. Every label
  // on every board is then as large as its own content and its own
  // frame allow, and the failure mode is text that is a bit small
  // rather than text that is cut in half.
  // A CHARACTER COUNT IS NOT A WIDTH, and that is the third bug in
  // this row of the board.
  //
  // Dinopawnz: "when this game is starting the jumbotron says stand
  // behind the line or something. the words are cut off during the
  // start."
  //
  // It says GET BEHIND YOUR OWN LINE, and it was cut off for exactly
  // the reason STAND BY was cut off two versions ago: the line needed
  // more width than the panel had, so the label wrapped it, and the
  // second line fell off the bottom of the face. The only difference
  // is that last time the size was hand-picked and this time it was
  // computed - by a function that measures a string by COUNTING ITS
  // CHARACTERS, which assumes every character is the same width.
  //
  // They are not, and the error is not small. FS_PER_CHAR was
  // calibrated off the detail row - "RED HOME   BLUE HOME   JAIL 0-0"
  // - which is a third spaces and digits, the two narrowest things
  // this board ever prints. GET BEHIND YOUR OWN LINE is twenty-one
  // capitals and three spaces. Same character count, twelve per cent
  // more ink, and the margin in FS_PER_CHAR was thirteen per cent. So
  // the countdown line came out at 102% of its box and wrapped, and
  // "BLUE WIN" and "STAND BY" were sitting on 100% and 104% of theirs
  // for the same reason.
  //
  // So a string is measured in EMS now, off the advance widths of the
  // characters actually in it. There are only ten distinct widths in
  // an uppercase alphabet and the table below is all of them; a W is
  // three and a half times an I, which is the whole point. Unknown
  // characters get 0.7, which is a wide-ish letter, so an emoji or an
  // accent errs towards making the text smaller.
  const EM = {};
  [[0.28, " I.,:;'!|"], [0.33, "-"], [0.50, "J"], [0.56, "0123456789L$/"],
   [0.61, "FTZ"], [0.67, "ABEKPSVXY?"], [0.72, "CDHNRU"], [0.78, "GOQ"],
   [0.83, "M"], [0.94, "W"]].forEach(([w, chars]) => {
    for (let i = 0; i < chars.length; i++) EM[chars[i]] = w;
  });
  function textEms(text) {
    const s = String(text).toUpperCase();
    let e = 0;
    for (let i = 0; i < s.length; i++) e += EM[s[i]] === undefined ? 0.7 : EM[s[i]];
    return Math.max(0.5, e);
  }
  // Measured off the same photograph as before, but per em instead of
  // per character: the detail row at font-size 82 is 16.7 ems and
  // covered 59% of the 23m panel, which is 101 font-size units per
  // metre of width per em. 91 is used rather than 101 so a line never
  // fills more than nine tenths of its box - the penalty for being
  // slightly small is text you squint at, and the penalty for being
  // slightly large is text that wraps and falls off the panel.
  const FS_PER_EM = 91;         // font-size units per metre of width, per em
  const FS_PER_LINE = 84;       // font-size units per metre of height
  function fitFS(text, w, h, cap) {
    const byWidth = FS_PER_EM * w / textEms(text);
    const byHeight = FS_PER_LINE * h;
    return Math.max(20, Math.round(Math.min(byWidth, byHeight, cap || 999)));
  }
  // a label that remembers its own box, so it can be resized later
  function fitted(node, w, h, cap) {
    node.__w = w; node.__h = h; node.__cap = cap;
    return node;
  }

  const jumboBig = [];
  const jumboSub = [];
  const jumboSub2 = [];
  const jumboLamps = [];
  const jumboPanels = [];
  const keyDisplays = [];
  const diagLabels = [];

  function ago(ms) {
    const t = Math.floor(Math.max(0, ms) / 1000), m = Math.floor(t / 60), r = t % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  // UP is how long this copy of the document has been running. IDS
  // says whether collisions are arriving with player ids - without
  // them this game cannot tell anybody apart.
  let lastDiag = "";
  function paintDiag() {
    const now = Date.now();
    let text = BUILD + "   UP " + ago(now - BOOT) + "   " +
      (idSeen ? "IDS OK" : noIdHits ? "NO PLAYER IDS" : "IDS -");
    if (lastStop) text += "   STOPPED BY " + lastStop.why + " " + ago(now - lastStop.at) + " AGO";
    if (scriptErrors) text += "   ERR " + scriptErrors + " " + lastError;
    if (text === lastDiag) return;
    lastDiag = text;
    diagLabels.forEach((l) => l.setAttribute("content", text));
  }

  let lastBanner = "", lastBannerColor = "", lastCount = "";
  function setBanner(text, color) {
    if (text === lastBanner && color === lastBannerColor) return;
    lastBanner = text; lastBannerColor = color;
    statusLabels.forEach((l) => {
      l.setAttribute("content", text);
      l.setAttribute("font-color", color);
      if (l.__w) l.setAttribute("font-size", fitFS(text, l.__w, l.__h, l.__cap));
    });
  }
  function setCount(text) {
    text = text + "   " + BUILD;
    if (text === lastCount) return;
    lastCount = text;
    countLabels.forEach((l) => {
      l.setAttribute("content", text);
      if (l.__w) l.setAttribute("font-size", fitFS(text, l.__w, l.__h, l.__cap));
    });
  }

  let noticeText = "", noticeUntil = 0, noticeColor = CHALK;
  function notice(text, ms, color) {
    noticeText = text;
    noticeUntil = Date.now() + ms;
    noticeColor = color || CHALK;
    paintBoards();
  }

  const padShown = new Map();
  function paintBoards() {
    paintDiag();
    paintSigns();
    padCounts.forEach(([label, t]) => {
      const text = teamName(t) + " " + teamCount(t);
      if (padShown.get(label) !== text) { padShown.set(label, text); label.setAttribute("content", text); }
    });
    const now = Date.now();
    paintJumbo(now);
    const title = phase === "STANDBY" ? "CAPTURE THE FLAG"
      : phase === "COUNT" ? "STARTING IN " + countLeft
      : phase === "WIN" ? teamName(winner) + " WINS"
      : scoreLine();
    const titleColor = phase === "WIN" ? homeCol(winner)
      : phase === "COUNT" ? countColour(countLeft)
      : now < noticeUntil ? noticeColor : CHALK;
    setBanner(title, titleColor);
    if (now < noticeUntil && phase !== "COUNT") { setCount(noticeText); return; }
    if (phase === "COUNT") {
      setCount("GET BEHIND YOUR OWN LINE");
    } else if (phase === "STANDBY") {
      setCount("RED " + teamCount(-1) + "   BLUE " + teamCount(1) + "   CLICK A RED OR BLUE BUTTON TO JOIN");
    } else if (phase === "WIN") {
      setCount(scoreLine());
    } else {
      setCount(detailLine(true));
    }
  }

  // blackboards behind each end line, readable from both sides
  [-112, 112].forEach((bz) => {
    [-1, 1].forEach((s) => {
      el("m-cylinder", { x: s * 7, z: bz, y: 3.4, radius: 0.4, height: 6.8, color: FRAME });
    });
    el("m-cube", { z: bz, y: 7.2, width: 16.6, height: 4.2, depth: 0.4, color: FRAME });
    el("m-cube", { z: bz, y: 7.2, width: 16, height: 3.6, depth: 0.5, color: BOARD });
    [180, 0].forEach((ry) => {
      statusLabels.push(fitted(el("m-label", {
        z: bz + (ry ? -0.3 : 0.3), y: 7.9, ry: ry,
        width: 14, height: 1.8, "font-size": 100, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "CAPTURE THE FLAG",
      }), 14, 1.8, 130));
      countLabels.push(fitted(el("m-label", {
        z: bz + (ry ? -0.3 : 0.3), y: 6.4, ry: ry,
        width: 15, height: 1.1, "font-size": 40, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "",
      }), 15, 1.1, 90));
    });
  });

  // ==========================================================
  // THE JUMBOTRON
  // ==========================================================
  // Hung over the centre circle where the middle sign used to be.
  // Four faces, because a flat sign is only readable from two
  // directions and half the pitch was looking at its edge.
  //
  // The digits are deliberately enormous - a metre tall, and nothing
  // else on the face while a countdown is running. The point of this
  // object is to be legible from the far end line at a glance, not
  // to carry detail; the detail lives on the end boards and the two
  // remaining hung signs, which are unchanged.
  //
  // The ring of lamps under it carries the same colour as the
  // numbers, so the thing throws its state onto the pitch as light
  // as well as printing it.
  const JUMBO_Y = 24;
  const JUMBO_R = 11.5;         // was 8.2 - the faces are wider now
  // HOW HARD IT LIGHTS THE ROOM.
  // Dinopawnz: "the jumbotron is just a little bit too bright...
  // people hate brightness in the metaverse."
  //
  // It was four point lights at intensity 60 reaching 70 metres,
  // which is floodlight numbers - they were not lighting the board,
  // they were lighting the pitch, and from underneath the thing was
  // a white hole in the ceiling. These are down to a fifth of that
  // power and a third of the reach, which is enough to say what
  // colour the board is without being something you squint at.
  //
  // The colour still carries the countdown. That was always the job:
  // the lamps are a SIGNAL, not a light source, and a signal only has
  // to be seen, not to illuminate anything.
  const JUMBO_LAMP = 12;        // was 60
  const JUMBO_REACH = 24;       // was 70

  // THE BIG ROW SIZES ITSELF TO WHAT IS ON IT.
  // It was a fixed 320, which is right for "8" and far too big for
  // "STAND BY" - eight characters at that size wrapped onto a second
  // line and the second line fell off the bottom of the panel, so
  // the board read "STAND" with a sliver of "BY" under it.
  //
  // A label cannot tell you it overflowed, so the size is chosen from
  // the LENGTH of the string instead. Three steps is enough for
  // everything this row ever shows: one or two characters is a
  // countdown digit and gets the full metre; up to five is "START"
  // or a score like "0 - 0"; anything longer is a phrase and drops
  // again so it stays on one line.
  //
  // If you add a longer phrase than "STAND BY" to this row, add a
  // step here as well - the label will not complain, it will just
  // quietly eat the end of it.
  const BIG_FS = 320;           // one or two characters
  function bigSize(text) {
    return text.length <= 2 ? BIG_FS
      : text.length <= 5 ? 210
      : text.length <= 9 ? 132
      : 96;
  }
  el("m-cylinder", { y: 44, radius: 0.5, height: 26, color: STEEL_DK });
  el("m-cube", { y: JUMBO_Y + 6.8, width: 25, height: 1.2, depth: 25, color: FRAME });
  el("m-cube", { y: JUMBO_Y - 6.2, width: 25, height: 1.0, depth: 25, color: FRAME });
  [0, 90, 180, 270].forEach((a) => {
    const r = a * Math.PI / 180;
    const ox = JUMBO_R * Math.sin(r), oz = JUMBO_R * Math.cos(r);
    jumboPanels.push(el("m-cube", {
      x: ox, z: oz, y: JUMBO_Y, ry: a,
      width: 23, height: 12, depth: 0.5, color: BOARD,
    }));
    const fx = (JUMBO_R + 0.4) * Math.sin(r), fz = (JUMBO_R + 0.4) * Math.cos(r);
    // three rows, each as big as its own box and its own text allow.
    // The boxes get the space in the order the rows matter: the
    // headline takes half the face, the clock takes what is left
    // over, and the detail row takes the bottom strip.
    jumboBig.push(fitted(el("m-label", {
      x: fx, z: fz, y: JUMBO_Y + 2.1, ry: a,
      width: 22, height: 6.2, "font-size": 420, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "CTF",
    }), 22, 6.2, 460));
    jumboSub.push(fitted(el("m-label", {
      x: fx, z: fz, y: JUMBO_Y - 2.6, ry: a,
      width: 22, height: 2.5, "font-size": 190, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "",
    }), 22, 2.5, 200));
    // THE DETAIL LINE. This is what used to be on the sign hanging
    // over the pitch - clock, both flag states, jail counts. It is on
    // the jumbotron now as well as on the walls, so the object in the
    // middle of the room answers every question about the game
    // instead of only the score.
    jumboSub2.push(fitted(el("m-label", {
      x: fx, z: fz, y: JUMBO_Y - 5.0, ry: a,
      width: 22, height: 2.1, "font-size": 120, alignment: "center",
      color: BOARD, "font-color": STEEL, content: "",
    }), 22, 2.1, 130));
    jumboLamps.push(el("m-light", {
      x: ox * 1.15, z: oz * 1.15, y: JUMBO_Y - 6.6,
      type: "point", intensity: JUMBO_LAMP, distance: JUMBO_REACH, color: STEEL,
    }));
  });

  // WHAT IT SAYS, AND WHEN IT BOTHERS SAYING IT.
  // Everything on this board is rebuilt from one key string, and it
  // only touches the elements when that string changes. It is asked
  // ten times a second during a countdown and once a second the rest
  // of the time; without the key it would be rewriting sixteen
  // labels and four lights ten times a second for nothing.
  // the line the hung sign used to carry, built once and used twice:
  // on the jumbotron's third row and on the wall boards
  // withClock, because the two places this goes are not the same
  // place. The wall board has one line and has to carry the clock in
  // it; the jumbotron already has the clock on the row above, and
  // printing it twice on the same face is the sort of thing that
  // makes a board look like it is broken.
  function detailLine(withClock) {
    const now = Date.now();
    const clockText = !withClock ? ""
      : suddenDeath ? "NEXT CAPTURE WINS"
      : ROUND_TIME ? ago(clockEnds - now) : "";
    // SHORT WORDS, because length is what was making this unreadable.
    // "RED FLAG HOME   BLUE FLAG HOME" is thirty characters of which
    // ten are the word FLAG twice, on a board whose whole subject is
    // flags. Dropping it buys eight points of font size and costs
    // nothing anybody needs.
    const fl = (t) => teamName(t) + " " + (flags[t].state === "home" ? "HOME" : "OUT");
    return [clockText, fl(-1), fl(1),
      "JAIL " + jailCount(-1) + "-" + jailCount(1)].filter(Boolean).join("   ");
  }

  let jumboShown = "";
  function paintJumbo(now) {
    let big, sub, sub2, col;
    if (phase === "COUNT") {
      big = String(countLeft);
      sub = "GET BEHIND YOUR OWN LINE";
      sub2 = "RED " + teamCount(-1) + "    BLUE " + teamCount(1);
      col = countColour(countLeft);
    } else if (phase === "LIVE" && now < startBlaze) {
      big = "START";
      sub = "FIRST TO " + CAPS_TO_WIN;
      sub2 = "";
      col = countColour(0);
    } else if (phase === "LIVE") {
      big = score["-1"] + " - " + score["1"];
      sub = suddenDeath ? "NEXT CAPTURE WINS"
        : ROUND_TIME ? ago(clockEnds - now) : "RED v BLUE";
      sub2 = detailLine(false);
      col = CHALK;
    } else if (phase === "WIN") {
      big = teamName(winner) + " WIN";
      sub = scoreLine();
      sub2 = "";
      col = homeCol(winner);
    } else {
      big = "STAND BY";
      sub = "RED " + teamCount(-1) + "    BLUE " + teamCount(1);
      sub2 = "ENTER THE CODE ON A CONSOLE TO START";
      col = STEEL;
    }
    const key = big + "|" + sub + "|" + sub2 + "|" + col;
    if (key === jumboShown) return;
    jumboShown = key;
    // bigSize() is gone - it was three hand-picked numbers doing
    // badly what fitFS() now does from the box itself.
    jumboBig.forEach((l) => {
      l.setAttribute("content", big);
      l.setAttribute("font-color", col);
      l.setAttribute("font-size", fitFS(big, l.__w, l.__h, l.__cap));
    });
    jumboSub.forEach((l) => {
      l.setAttribute("content", sub);
      l.setAttribute("font-size", fitFS(sub, l.__w, l.__h, l.__cap));
    });
    jumboSub2.forEach((l) => {
      l.setAttribute("content", sub2);
      l.setAttribute("font-size", fitFS(sub2, l.__w, l.__h, l.__cap));
    });
    jumboLamps.forEach((l) => l.setAttribute("color", col));
    const face = (phase === "LIVE" && now < startBlaze) ? "#0c2a18" : BOARD;
    jumboPanels.forEach((p) => p.setAttribute("color", face));
  }
