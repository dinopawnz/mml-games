      paint("m-cube", 0.26, 0.04, { x: s * (FIELD_W / 2 - 1.9), z: zc, width: 1.6, depth: FIELD_L / 2 - 2, color: homeMid(t) });
    });
    // the base: a big ring round the flag stand, and the team's name
    paint("m-cylinder", 0.25, 0.06, { z: t * FLAG_Z, radius: 10, color: homeCol(t) });
    paint("m-cylinder", 0.27, 0.08, { z: t * FLAG_Z, radius: 9.2, color: homeDark(t) });
    el("m-label", {
      z: t * 40, y: 0.29, rx: -90, rz: t < 0 ? 0 : 180,
      width: 50, height: 7, "font-size": 260, alignment: "center",
      color: homeDark(t), "font-color": homeMid(t), content: homeName(t) + " BASE",
    });
  });
  // lines
  [-1, 1].forEach((s) => {
    paint("m-cube", 0.28, 0.08, { x: s * (FIELD_W / 2 - 0.4), width: 0.5, depth: FIELD_L, color: PITCH_LINE });
    paint("m-cube", 0.28, 0.08, { z: s * (FIELD_L / 2 - 0.3), width: FIELD_W, depth: 0.5, color: PITCH_LINE });
  });
  paint("m-cube", 0.3, 0.1, { width: FIELD_W, depth: 0.7, color: "#ffffff" });            // halfway
  paint("m-cylinder", 0.31, 0.1, { radius: 1.4, color: "#ffffff" });                     // centre spot


  // ==========================================================
  // THE MAP - two floors, ramps between them, cover on both
  // ==========================================================
  // Everything above the ground is described by one table and then
  // built, padded and reasoned about from it. Decks are flat
  // rectangles. Ramps are flights of steps, because a sloped box
  // cannot tell the game where you are standing on it and a step
  // can: every tread is its own pad reporting its own height.
  //
  // The shape is a ring. Both bases sit up on decks at the ends,
  // two catwalks run the flanks, two bridges cross to a platform
  // over the centre spot, and six ramps come up off the floor.
  // From anywhere up top you can run the whole loop or drop off
  // the edge, and the ground underneath it all stays open - the
  // decks stand on pillars, so under the enemy base is a room you
  // can run through rather than a wall you go round.
  //
  // Symmetry is exact in both directions. Whatever one team has,
  // the other has the mirror of it.

  const UP_Y = 5.4;             // deck slab top - the second floor
  const PAD_T = 0.36;           // pad thickness - the ground does the same,
                                // so the walking surface everywhere is the
                                // slab plus this
  const GROUND = PAD_T;         // walking height on the floor
  const UPPER = UP_Y + PAD_T;   // walking height on the second floor
  // How deep a deck is, measured from its walking surface down to the
  // underside a person beneath it would bang their head on: 0.9 of
  // structural slab, a 0.16 plate under that, and the pad on top.
  // Declared here rather than beside ceilingAt() because the flag
  // platform's HEIGHT is now worked out from it - see below.
  const SLAB_UNDER = 1.04;
  // THE FLAG SITS ABOVE THE BASE DECK, NOT ON IT.
  // It stood on the deck at 5.76 with the whole 36x20 strip flat
  // around it, so a raider who got up the base stairs was already
  // level with it - the last stretch of a run on the flag cost
  // nothing but walking. It is now on a platform of its own with one
  // flight of stairs up to it, which puts a climb at the end of the
  // approach and, more usefully, puts the defenders looking DOWN at
  // whoever is coming.
  //
  // AND THE ROOM UNDER IT IS A ROOM, not a crawlspace.
  //
  // Dinopawnz: "the area under the flag where cages dont work... we
  // can maybe make cages work there by raising the platform where the
  // flags are currently located slightly higher."
  //
  // Right, and 9.0 was the reason. It left 2.20m of air between the
  // base deck and the underside of the platform, and a cage needs
  // CAGE_MIN_H plus CAGE_HEAD_GAP - 3.30m - or it is not a cage and
  // the spot is refused. So the strip of deck directly under the flag
  // was the last place on the map where a tag did nothing, which is
  // exactly the ground both teams fight hardest over.
  //
  // The height is not a chosen number any more. It is the height that
  // makes the room under it work, measured: the deck you stand on,
  // plus the air a cage needs, plus a little margin, plus the
  // thickness of the slab itself. Change CAGE_MIN_H and the platform
  // moves with it.
  const FLAG_HEAD = CAGE_MIN_H + CAGE_HEAD_GAP + 0.3;
  const FLAG_UP_Y = +(UPPER + FLAG_HEAD + SLAB_UNDER).toFixed(2);   // 10.40
  // It now stands 0.4 ABOVE RIM_Y rather than a metre below it. That
  // was never load-bearing: the old note said so itself - the rim
  // runs out at the flanks (x 38 to 46) and this is x -11 to 11, so
  // the two never share a spot and deckUnder() is asked about a spot
  // before it is asked about a height. Nothing has to disambiguate
  // them and nothing ever did.
  //
  // ...and its footprint, written at the + end and mirrored to the
  // other. These were four hand-typed numbers in the deck table and
  // four more in the ramp table; three separate things now have to
  // ask "is this spot the flag climb?" - guarding(), the cage fitter
  // and the map query - and none of them should be asking it with a
  // number somebody typed again.
  const PLAT_X = 11;            // the platform runs x -PLAT_X..PLAT_X
  const PLAT_Z0 = 80, PLAT_Z1 = 96;
  // THE FLIGHT IS LONGER, NOT STEEPER. The climb is 5.0m now instead
  // of 3.6, and left on its old ten metres of run that would have
  // turned a staircase you jog up into one you labour up. It starts
  // three metres further back instead, which keeps the going per step
  // at 0.93m against the 1.0m it has always been - same stairs, more
  // of them. There is room: the front tongue it starts from runs back
  // to z 64, and the ramp off the floor tops out there.
  const STAIR_UP_X = 6;         // and the single flight up onto it
  const STAIR_UP_Z0 = 67, STAIR_UP_Z1 = 80;
  const RIM_Y = 10.0;           // the rim landings, halfway up the climb
  const TOP_Y = 14.2;           // and the peak of it, over midfield
  const RIMMER = RIM_Y + PAD_T; // on a rim landing
  const TOPPER = TOP_Y + PAD_T; // and at the peak
  const PEAK_Z = 12;            // the peak deck runs from -PEAK_Z to +PEAK_Z
  const RIM_X0 = 38;            // the rim corridor takes the OUTER part of the
  const RIM_X1 = 46;            // flank catwalk and leaves the inner 4m clear
  const BR_Z = 6;               // half-width of the bridge across the middle

  // ==========================================================
  // THE TUNNEL  -  the one thing on the rim that is enclosed
  // ==========================================================
  // Everything else about this map is open. This is not, and it is
  // the whole of the glide balance now.
  //
  // The top of each climb and the peak it leads to are boxed in -
  // wall, wall, roof - from about five steps below the top all the
  // way over the summit, and the bridge across the middle is boxed
  // the same way. So the highest ground on the map is somewhere you
  // RUN THROUGH rather than somewhere you launch from: you cannot
  // come up the stairs and immediately glide off the top of the
  // world, which is exactly what was happening.
  //
  // Two deliberate holes in it. The mouths where the bridge leaves
  // each peak are open, because that is the route. And there is a
  // gap left in the middle of the bridge - no roof, no walls - so
  // you can drop out of the tunnel onto the second floor below, or
  // come up into it from there. That gap is the balance: the tunnel
  // takes the cheap glide away and gives you one place to leave it
  // from, in the middle of the map where everybody can see you.
  //
  // It is glass, so from inside you can see the whole pitch and
  // from outside you can see who is in it.
  const TUNNEL = true;
  const TUN_Z = 24;             // the tunnel runs z -24 to 24 on each
                                // flank: the peak plus the top 12m of
                                // the climb at each end of it
  const TUN_H = 4.0;            // headroom over the peak. Nothing on
                                // this map hangs lower than this - the
                                // 2.4m beams in v10 were the reason a
                                // tall avatar could not use the stairs.
  const TUN_T = 0.5;
  const BR_TUN_H = 4.0;         // headroom in the second-floor bridge
                                // tunnel. Same as the rim tunnel: a
                                // tall avatar runs it without ducking.
  const TUN_GAP = 5;            // half-width of the hole in the middle
                                // of the bridge

  // THE RIM IS ROOFED, NOT GLAZED.
  // v9 walled the rim with five metres of glass on both sides and it
  // did not work, for a reason that is obvious in hindsight: a wall
  // with no lid is a thing you glide OVER. In a world where gliding
  // is cheap, the only geometry that stops a flight is geometry
  // ABOVE it. So the glass is gone and the rim is a covered gantry
  // instead - open down both sides, roofed the whole way. You can
  // see out, shoot out, step off the side and drop into the map. You
  // cannot climb out of the top of it, and you cannot gain any
  // height inside it, which is the only thing that mattered.
  const RIM_ROOF = false;      // v10 had this on. See the note at the top.
  const ROOF_H = 3.3;           // headroom over the PEAK, which is the
                                // highest point of the run
  const ROOF_T = 0.5;
  // The roof is FLAT and at one height for the whole run, and it
  // reaches inboard past the corridor to the inside edge of the flank
  // catwalk. Both of those came out of the harness rather than out of
  // taste. A roof that stepped down with the ramps left a clear lane
  // just above the lower bays - jump at the peak, drop over the side,
  // and you flew a hundred metres down the flank and landed nine
  // metres from the enemy flag. A flat lid kills that, and reaching
  // it inboard to x 34 closes the four-metre slot between the rim and
  // the stack field, which was the same flight one lane over.
  const ROOF_X0 = 34;
  const ROOF_X1 = 47;
  // ...and because the lid is flat, the low end of the run has twelve
  // metres of air under it, which is its own little motorway. So
  // beams hang down off it, leaving BAFFLE_H over the walkway. You
  // walk under them without noticing. You cannot fly under them.
  // 2.4m over the walkway, and that number is not a guess either.
  // The rim descends at almost exactly the slope a floaty glide
  // follows, so a jumper who launches inside the corridor stays about
  // the same distance over the walkway the whole way down - three
  // metres of clearance let them ride it a hundred metres and out the
  // far end. At 2.4 they are into the first beam within one bay. An
  // avatar is about 1.8m, so you walk under them; you just cannot fly
  // under them, and jumping in here bangs your head, which is the
  // signal that the rim is a place you RUN.
  const BAFFLE_H = 2.4;
  const BAFFLE_EVERY = 8;       // metres between beams
  const BAFFLES = false;        // and these are off with it
  const GLASS_T = 0.22;         // (kept: the posts are sized off it)
  const RAMP_RISE = 0.36;       // step height. Low enough to run up.
  const KERB = 0.34;            // lip round the outside of the decks.
                                // It is a place people stand - see THE
                                // THING YOU STAND ON REPORTS - so it is
                                // laid in RUNS now rather than 2m tiles,
                                // one solid per run, and each run
                                // reports as itself.

  // Flat decks: [x0, x1, z0, z1, y]. Written out in full rather than
  // mirrored in code, because being able to read the map off the
  // page is worth more than the six lines it saves.
  const DECKS = [];
  // Where the pillars under the decks ended up: [x, z, foot, top].
  // Nothing needed this while cages could not go under a deck at all.
  // Now that they can, a cage has to know not to close round one.
  const PILLARS = [];
  // Plain solid boxes, built where a kerb is not enough: [x, z, w, d,
  // base, height]. The only ones in the map are the two at the peak
  // of the rim, and they are there to stop anybody launching off the
  // top of the map at a flag.
  const WALLS = [];
  // Decks that do NOT get the lip round their edge. Only the two
  // second-floor bridge arms are in here.
  const NO_KERB = [];
  const RAMP_STEPS = [];      // filled in as the ramps are built; the pad
                                // grid turns every tread into a reporter
  // THE THING YOU STAND ON IS THE THING THAT REPORTS.
  //
  // This document has had two kinds of reporter since v1 and only
  // ever thought about one of them. A floor PAD is an invisible box
  // because the floor needs a GRID - eight metres of it at a time -
  // and there is nothing out there to hang a grid on. It works
  // because it is the TOP COLLIDER: your feet rest on the pad itself.
  //
  // The flag stand is the other kind, and it has always worked: a
  // visible, solid cylinder with listen() on it, reporting as itself.
  // Every flag ever picked up in this game came through it.
  //
  // Everywhere else - a crate, a kerb, a rail, the plinth - there IS
  // something to stand on, and putting an invisible pad near it can
  // only ever be wrong. Above it and you float 36cm over the ledge
  // (v24). Inside it and your feet never reach the pad, because the
  // BLOCK stopped you (v27, and this is why the crates beside both
  // flags have reported nothing for four versions). Beside it and you
  // get nothing at all.
  //
  // So they report as themselves, the way the flag stand does. No
  // pads, no split bodies, no invisible caps, nothing to trip on, and
  // the geometry goes back to exactly what it looked like in v27.
  function reports(node, cx, cz, top, ry) {
    node.setAttribute("collide", "true");
    node.setAttribute("collision-interval", PAD_MS);
    listen(node, cx, cz, null, +top.toFixed(3), ry);
    return node;
  }
  function deck(x0, x1, z0, z1, y) {
    DECKS.push([x0, x1, z0, z1, y === undefined ? UP_Y : y]);
  }

  // THE BASE, with two holes in it.
  // The deck used to be one 76x20 slab, which made the room
  // underneath a dead end - Dinopawnz: "if you are under the flag
  // area, there is no way up to the flag area. that underneath part
  // of the flag is claustrophobic." It was both. So the deck is cut
  // into five pieces with a 20x12 opening on each side, and a stair
  // climbs up through each opening out of the room below. The room
  // now has daylight, two ways up, and a reason to be in it; the
  // deck keeps the middle strip where the flag stands, and a lip at
  // the front and back of each opening so the edge reads as an edge.
  [-1, 1].forEach((t) => {
    const F0 = t > 0 ? 76 : -78, F1 = t > 0 ? 78 : -76;   // front lip
    const B0 = t > 0 ? 90 : -96, B1 = t > 0 ? 96 : -90;   // back
    deck(-18, 18, t > 0 ? 76 : -96, t > 0 ? 96 : -76);    // the flag strip
    deck(-38, -18, F0, F1);
    deck( 18,  38, F0, F1);
    deck(-38, -18, B0, B1);
    deck( 18,  38, B0, B1);
    deck(-16, 16, t > 0 ? 64 : -76, t > 0 ? 76 : -64);    // its front tongue
    // and the flag platform on top of the strip, 22 wide by 16 deep,
    // with the stand in the middle of it
    deck(-PLAT_X, PLAT_X, t > 0 ? PLAT_Z0 : -PLAT_Z1, t > 0 ? PLAT_Z1 : -PLAT_Z0, FLAG_UP_Y);
  });
  [-1, 1].forEach((s) => {
    // THE GAPS.
    // The flank catwalk used to run the full 152m unbroken, from one
    // base past the other. Dinopawnz: "this piece of floor that my
    // avatar is standing on can just not be there. if people want to
    // get to the 3rd floor stairs, theyll have to jump and glide to
    // make the jump... you can leave gaps in multiple places to make
    // people have to jump and glide more."
    //
    // So it is in three pieces now with two 10m gaps in it, and it
    // stops 10m short of each base rather than running into it. Four
    // jumps per flank, none of them mandatory - every piece is still
    // reachable on foot from a quarter ramp or the second-floor
    // bridge, so a gap is a shortcut you take rather than a toll you
    // pay. What they cost is TIME for anybody not willing to commit
    // to the air, which is exactly the trade this map wanted.
    const CW0 = s > 0 ? 34 : -46, CW1 = s > 0 ? 46 : -34;
    deck(CW0, CW1, -66, -24);
    deck(CW0, CW1, -14,  14);
    deck(CW0, CW1,  24,  66);
    // THE SECOND-FLOOR BRIDGE, one arm each side, catwalk to top mid.
    // It is registered NO_KERB: the lip that runs round every other
    // deck in the map is left off here. Dinopawnz: "dont add this
    // extra lip on the sides of the 2nd floor bridge." It would only
    // be in the way, because the sides of this bridge are now walled
    // floor to ceiling - see THE BRIDGE TUNNEL below.
    deck(s > 0 ? 15 : -34, s > 0 ? 34 : -15, -6, 6);
    NO_KERB.push([s > 0 ? 15 : -34, s > 0 ? 34 : -15, -6, 6]);
  });
  deck(-15, 15, -15, 15);                                 // top mid

  // Ramps: [x0, x1, z0, z1, lowEnd, axis, yLow, yHigh]. axis "x"
  // climbs along x, "z" along z. lowEnd is which end is the bottom:
  // -1 = the x0/z0 end, +1 = the x1/z1 end. yLow and yHigh default to
  // the ground and the second floor; the rim ramps pass their own
  // pair, because they start on a deck rather than on the floor. The
  // ninth entry is which side gets a rail - "outer" means the arena
  // wall side only, and that is what leaves a rim ramp open to the
  // pitch so you can step off it wherever you like.
  const RAMPS = [];
  [-1, 1].forEach((t) => {
    // up the front of each base, straight off the halfway run
    RAMPS.push([-8, 8, t > 0 ? 50 : -64, t > 0 ? 64 : -50, t > 0 ? -1 : 1, "z"]);
    // THE FLAG STAIRS. Off the deck, up the middle, onto the
    // platform. One flight and one only: the platform has a single
    // way up and three edges you can be knocked off, which is the
    // trade for making it high ground. It starts back on the front
    // tongue so the climb begins before you are under the flag, and
    // there is nothing above it at any point - the rim is out at the
    // flanks and the bases carry no roof.
    RAMPS.push([-STAIR_UP_X, STAIR_UP_X,
      t > 0 ? STAIR_UP_Z0 : -STAIR_UP_Z1, t > 0 ? STAIR_UP_Z1 : -STAIR_UP_Z0,
      t > 0 ? -1 : 1, "z", UP_Y, FLAG_UP_Y]);
    // and up out of the room under the base, through the openings
    // cut in the deck above it, one stair on each side
    [-1, 1].forEach((s) => {
      RAMPS.push([
        s > 0 ? 18 : -34, s > 0 ? 34 : -18,
        t > 0 ? 80 : -88, t > 0 ? 88 : -80,
        s > 0 ? 1 : -1, "x",
      ]);
    });
    [-1, 1].forEach((s) => {
      // one in each quarter, off the floor onto the flank catwalk
      RAMPS.push([
        s > 0 ? 18 : -34, s > 0 ? 34 : -18,
        t > 0 ? 38 : -50, t > 0 ? 50 : -38,
        s > 0 ? -1 : 1, "x",
      ]);
    });
  });
  // --- the third floor: THE RIM ------------------------------
  // The second floor owns the middle of the map. The third owns the
  // OUTSIDE EDGES, and it is not a place you fight from - it is a
  // CORRIDOR. Down each flank, a 8m-wide run at the arena wall that
  // climbs off the catwalk, crosses midfield at its peak, and comes
  // back down at the far end. A bridge joins the two peaks across
  // the middle of the map.
  //
  //   catwalk --/--  landing  --/--  PEAK ===bridge=== PEAK  --\--
  //   landing --\-- catwalk                (and the mirror of it)
  //
  // GLASS BOTH SIDES, THE WHOLE WAY. Every metre of it - ramps,
  // landings, peaks, the bridge - is walled on both sides to
  // GLASS_H, which is higher than anybody can jump. There is no
  // section you can step off, no open middle to drop through, and no
  // way to leave except back out of one of the four ends.
  //
  // That is the point of it. The rim is a SECRET ROUTE, not a
  // firing platform: you cannot launch off the top of the map at
  // somebody's flag, you cannot shortcut down into the middle, and
  // once you are on it you are committed to running it. It is much
  // longer than going through the middle, it is the only way to
  // cross the map without touching the second floor, and it puts you
  // out on a flank deep in the enemy half where nobody is looking.
  //
  // It is one table. Change a number in RIM_RUN and the decks, the
  // ramps, the glass, the pads and the pillars all follow it.
  //   [z0, z1, yLow, yHigh, lowEnd]  -  lowEnd 0 means a flat deck,
  //   -1 means it climbs towards +z, +1 means it climbs towards -z.
  const RIM_RUN = [
    // pulled in from z 72 to z 66 at both ends, so the foot of each
    // climb sits INSIDE the flank catwalk rather than at the far end
    // of it - which is what lets the catwalk stop short of the base
    // and leave a jump there. See THE GAPS.
    [-66, -42, UPPER,  RIM_Y, -1],    // up off the catwalk
    [-42, -32, RIM_Y,  RIM_Y,  0],    // landing
    [-32, -12, RIMMER, TOP_Y, -1],    // up to the peak
    [-12,  12, TOP_Y,  TOP_Y,  0],    // THE PEAK, and the bridge off it
    [ 12,  32, RIMMER, TOP_Y,  1],    // down
    [ 32,  42, RIM_Y,  RIM_Y,  0],    // landing
    [ 42,  66, UPPER,  RIM_Y,  1],    // down to the catwalk again
  ];

  const ROOFS = [];   // [x0, x1, z0, z1, y]  - the lid over each rim piece
  // THE ROOFS YOU CAN STAND ON. Every lid the tunnels put over the
  // map is a solid surface, which means it is somewhere a player can
  // land - and until v24 none of them had floor pads, so standing on
  // one read exactly like being in the air: no team marker, and a
  // carried flag on its clock. Dinopawnz: "make sure the team marker
  // works on this area above the bridge as well... the roof of the
  // bridge needs to register team markers."
  //
  // Each lid pushes its footprint here as it is built, and the pad
  // grid treats them like any other deck.
  const ROOF_TOPS = [];   // [x0, x1, z0, z1, walkingSurface]

  [-1, 1].forEach((s) => {
    const X0 = s > 0 ? RIM_X0 : -RIM_X1;
    const X1 = s > 0 ? RIM_X1 : -RIM_X0;
    RIM_RUN.forEach(([z0, z1, yL, yH, lowEnd]) => {
      const flat = lowEnd === 0;
      if (flat) {
        deck(X0, X1, z0, z1, yH);
        // NO RAILINGS ON THE LANDINGS. Dinopawnz: "there are these
        // weird railings on the landing pad that connects the 2
        // stairs. u can remove those railings." Right - the rim ramps
        // either side of a landing already carry no rail on the pitch
        // side, so a kerb round the landing was a fence between two
        // open staircases. The peak keeps its own.
        if (yH < TOP_Y - 0.01) NO_KERB.push([X0, X1, z0, z1]);
      }
      else RAMPS.push([X0, X1, z0, z1, lowEnd, "z", yL, yH, "none"]);
      // A LID, not walls. Flat over each piece, at ROOF_H over the
      // highest point of it - so a ramp gets more headroom at the
      // bottom than the top, which is what a real gantry looks like
      // and means you can never gain height under it.
      if (RIM_ROOF) ROOFS.push([
        s > 0 ? ROOF_X0 : -ROOF_X1, s > 0 ? ROOF_X1 : -ROOF_X0,
        z0, z1, TOP_Y + PAD_T + ROOF_H, yL, yH, lowEnd,
      ]);
    });
  });

  // THERE IS NO THIRD-FLOOR BRIDGE ANY MORE.
  // v9 through v14 joined the two peaks with a span across midfield at
  // the highest point in the world, and every one of those versions
  // then had to spend something keeping people from launching off it -
  // glass, a roof, a hole in the roof. Dinopawnz: "remove the 3rd
  // floor bridge entirely. lets just make only the side stairs go
  // across the field."
  //
  // Which is the better map, and it is obvious in hindsight. The two
  // flanks are now two SEPARATE runs. Each one climbs off its own
  // catwalk, crosses midfield high and alone, and comes back down at
  // the far end - so the rim is a long committed lane down one side of
  // the pitch rather than a ring you can cut across. Crossing the map
  // at height means going ALL THE WAY round, and there is nothing over
  // the middle of the world at all.

  // ==========================================================
  // THE SCREENS  -  thin walls, not towers
  // ==========================================================
  // v10 and v11 both answered "stop the direct glide" with big solid
  // blocks, and both were wrong the same way. Dinopawnz: "these
  // stacks are super clunky. walls should be thin. not SUPER THICK.
  // also theres way too much. i liked the map when it was nice and
  // open and visible."
  //
  // Right - and obvious once said. A wall stops a flight because of
  // WHERE IT IS, not because of how much of it there is. A 0.6m pane
  // blocks exactly the same line as an eleven-metre stack. So these
  // are panes: thin, tinted, and you can see the whole map through
  // them. They take almost nothing off the floor, and there are six
  // assemblies on the pitch instead of seventeen lumps.
  //
  // They are L SHAPES and PAIRS OF Ls rather than straight walls,
  // which is the part worth explaining. A straight wall is something
  // you run round. An L is something you can put between yourself
  // and whoever is chasing you - break one way round the corner and
  // they have to commit to a side. Two Ls facing opposite ways make
  // a short winding corridor: obvious once you are in it, invisible
  // from thirty metres. That is the Heretic trick and it is what
  // makes a map play bigger than it measures.
  //
  // Each run is a polyline; consecutive points become panes.
  //   [height, base, mirror, [x, z], [x, z], ...]
  // mirror "z" turns the map end for end and nothing else - for the
  // runs that are already written out across the whole width. "xz"
  // mirrors both ways, for the ones written for one quarter.
  const PANE_T = 0.6;
  // EVERY FLOOR SCREEN IS GONE. v12 put 46 panes on the pitch and
  // Dinopawnz: "this is absolutely atrocious. lets go back to the
  // very basic formation and remove all these glass walls. keep it
  // open like it used to be."
  //
  // So the arena is open again, and there are exactly two panes left
  // on the whole map - the two on top mid that face the flags. They
  // are the ones that break the straight line from one flag to the
  // other over the centre platform, which is the only line that was
  // ever really broken. The pair that used to stand at left and
  // right made a glass box in the middle of the second floor, which
  // looked like a mistake because it was one.
  const WALL_RUNS = [];
  // ...and now none at all. The last two stood on top mid facing the
  // flags and Dinopawnz: "remove the glass walls in the center 2nd
  // floor bridge. lets keep that open again." There is no glass
  // anywhere on this pitch. The tunnel over the top of the climb is
  // the only enclosed thing in the world.
  const WALL_RUNS_UP = [];
  // flattened into panes: [x, z, len, ry, base, h]
  const PANES = [];
  function wallRun(run, sx, sz) {
    const h = run[0], base = run[1];
    for (let i = 3; i < run.length - 1; i++) {
      const a = run[i], b = run[i + 1];
      const ax = sx * a[0], az = sz * a[1], bx = sx * b[0], bz = sz * b[1];
      const len = Math.hypot(bx - ax, bz - az);
      if (len < 0.5) continue;
      PANES.push([(ax + bx) / 2, (az + bz) / 2, len,
        (Math.atan2(bx - ax, bz - az) * 180) / Math.PI, base, h]);
    }
  }
  // Mirrored in z only, and that is the right symmetry rather than a
  // shortcut: turn the map end for end and it is identical, so both
  // teams face exactly the same problem. The Ls are handed, which is
  // what makes them read as a designed corridor instead of a fence.
  [WALL_RUNS, WALL_RUNS_UP].forEach((set) => set.forEach((run) => {
    const xs = run[2] === "xz" ? [-1, 1] : [1];
    const zs = run[2] === "1" ? [1] : [1, -1];
    xs.forEach((sx) => zs.forEach((sz) => wallRun(run, sx, sz)));
  }));

  // Cover on the floor: [x, z, w, d, h, ry]. Mirrored four ways, so
  // one entry here is four blocks on the pitch and every team sees
  // the same thing from their own end.
  const COVER_Q = [
    [10, 26, 9, 2.2, 2.6, 28],     // angled wall off the centre
    [27, 13, 4.5, 4.5, 2.4, 0],    // crate pair inside the ramp mouth
    [27, 20, 4.5, 4.5, 1.3, 0],
    [42, 34, 3.0, 9, 2.6, 0],      // slab against the flank, under the walk
    [11, 47, 12, 2.2, 1.3, 0],     // low wall across the approach - moved
                                   // inboard off the mouth of the quarter
                                   // ramp, which it used to sit on
    [33, 62, 5, 5, 2.6, 18],       // block short of the base
    [11, 72, 2.4, 8, 1.3, 0],      // kerbs BESIDE the base ramp. They were
                                   // at x 8, which is the ramp edge, so
                                   // they stood on the bottom steps
  ];
  const COVER = [];
  COVER_Q.forEach(([x, z, w, d, h, ry]) => {
    [-1, 1].forEach((sx) => {
      [-1, 1].forEach((sz) => {
        COVER.push([sx * x, sz * z, w, d, h, sx * sz * ry]);
      });
    });
  });

  // --- asking the map questions -----------------------------
  // These are what the cages, the flags and the pad grid all go
  // through, so the map only has to be right in one place.
  // With three levels, "the deck at this spot" is a question about a
  // height as well as a position - the ring over the centre spot is
  // directly above top mid, and a perch is directly above a catwalk.
  // Pass a walking height and get the deck at THAT level; pass none
  // and get the highest one there.
  function deckUnder(x, z, y) {
    let best = null;
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      if (y === undefined) { if (!best || d[4] > best[4]) best = d; }
      else if (Math.abs(d[4] + PAD_T - y) < 1.2) return d;
    }
    return best;
  }
  // the top of whatever a deck at this spot is standing on: the floor,
  // or the deck below it. Pillars are built from here up.
  function supportTop(x, z, y) {
    let best = 0;
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (d[4] >= y - 0.5) continue;
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      best = Math.max(best, d[4] + PAD_T);
    }
    return best;
  }
  // flatAt(x, z, y, margin) WAS HERE and is gone. It asked "is there
  // room for something this big at this spot", yes or no, and the one
  // thing that ever asked it - the cage - now needs the answer in
  // METRES instead, so it can build to what is there rather than walk
  // away when the answer is no. See cageRoom(). It also only knew
  // about decks and the floor, which is the second half of the same
  // bug: a staircase was not a surface it could see.
  //
  // (The note it used to carry is worth keeping: BEING UNDER
  // SOMETHING IS NOT THE SAME AS BEING BLOCKED. The floor under a
  // deck is floor. How much air is above it is a separate question,
  // asked by ceilingAt() and answered in metres.)
  // A STAIRCASE IS A SURFACE.
  //
  // deckUnder() answers for decks and flatAt() answers for decks and
  // the floor, and between them they describe every flat thing in
  // this map - which left the twenty RAMPS describing nothing. A
  // player halfway up a flight is not within 1.2 of any deck, so as
  // far as anything downstream of flatAt() was concerned they were
  // standing on nothing at all.
  //
  // Nothing noticed while the only caller was the cage, and the cage
  // was already refusing half the map for other reasons. It shows up
  // now because the flag climb is a ramp, and "tag somebody on the
  // stairs and nothing happens" is exactly what a missing surface
  // looks like from inside the game.
  //
  // The tread heights are not stored - there are hundreds of them -
  // so the height is interpolated along the flight instead. A tread
  // is RAMP_RISE tall, so the answer is never more than half a riser
  // out, which is 18cm on a surface the game reasons about in metres.
  // The slope comes back with it, because anything sitting on a ramp
  // has to know the ground under it is tilted.
  function rampAt(x, z, y) {
    for (let i = 0; i < RAMPS.length; i++) {
      const r = RAMPS[i];
      if (x < r[0] || x > r[1] || z < r[2] || z > r[3]) continue;
      const yLow = r[6] === undefined ? 0 : r[6];
      const yTop = r[7] === undefined ? UP_Y : r[7];
      const along = r[5] === "x" ? r[1] - r[0] : r[3] - r[2];
      const pos = r[5] === "x" ? x - r[0] : z - r[2];
      const f = r[4] < 0 ? pos / along : 1 - pos / along;
      const top = yLow + (yTop - yLow) * f + PAD_T;
      if (y === undefined || Math.abs(top - y) < 1.0) {
        return { top: top, slope: Math.abs(yTop - yLow) / along, ramp: r };
      }
    }
    return null;
  }
  // What somebody at this spot and this height is standing on: a
  // deck, a ramp, or the floor. The height matters and is not
  // optional - a ramp climbs THROUGH the deck it starts from, so at
  // the bottom of the flag stairs there are two honest answers and
  // only the height says which one is underfoot.
  function surfaceAt(x, z, y) {
    const d = deckUnder(x, z, y);
    if (d) return { top: d[4] + PAD_T, slope: 0, deck: d };
    const r = rampAt(x, z, y);
    if (r) return r;
    if (y <= GROUND + 1.0 &&
        Math.abs(x) <= FIELD_W / 2 && Math.abs(z) <= FIELD_L / 2) {
      return { top: GROUND, slope: 0 };
    }
    return null;
  }
  // THE SURFACE NEAREST A HEIGHT, which is the question a FOOTPRINT
  // asks. surfaceAt() answers for a person - it is handed the height
  // they reported and looks for the thing under their feet. Something
  // with WIDTH needs the other version: it knows roughly how high its
  // ground is and wants to know whether there is still ground a
  // couple of metres out, wherever that ground belongs.
  //
  // That distinction is what lets a cage sit across a junction. The
  // top tread of the flag stairs and the near edge of the flag
  // platform are two different objects in two different tables, and
  // to anything measuring one footprint at a time the seam between
  // them is a cliff. It is not a cliff. It is a step.
  function surfaceNear(x, z, ref, tol) {
    let best = null, bestD = tol;
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      const gap = Math.abs(d[4] + PAD_T - ref);
      if (gap <= bestD) { bestD = gap; best = d[4] + PAD_T; }
    }
    for (let i = 0; i < RAMPS.length; i++) {
      const r = RAMPS[i];
      if (x < r[0] || x > r[1] || z < r[2] || z > r[3]) continue;
      const yLow = r[6] === undefined ? 0 : r[6];
      const yTop = r[7] === undefined ? UP_Y : r[7];
      const along = r[5] === "x" ? r[1] - r[0] : r[3] - r[2];
      const pos = r[5] === "x" ? x - r[0] : z - r[2];
      const f = r[4] < 0 ? pos / along : 1 - pos / along;
      const top = yLow + (yTop - yLow) * f + PAD_T;
      const gap = Math.abs(top - ref);
      if (gap <= bestD) { bestD = gap; best = top; }
    }
    if (Math.abs(GROUND - ref) <= bestD &&
        Math.abs(x) <= FIELD_W / 2 && Math.abs(z) <= FIELD_L / 2) best = GROUND;
    return best;
  }
  // Is this spot on a team's flag platform, or on the flight up to
  // it? Both ends are folded onto the + end by the team's sign, so
  // one footprint answers for both. Used by guarding(), which stops
  // at the bottom step.
  function onFlagClimb(t, x, z, y) {
    if (!t) return false;
    const az = t * z;
    if (Math.abs(x) <= PLAT_X + 0.5 && az >= PLAT_Z0 - 0.5 && az <= PLAT_Z1 + 0.5 &&
        Math.abs(y - (FLAG_UP_Y + PAD_T)) < 1.2) return true;
    if (Math.abs(x) <= STAIR_UP_X + 0.5 &&
        az >= STAIR_UP_Z0 - 0.5 && az <= STAIR_UP_Z1 + 0.5 &&
        y > UPPER - 0.7 && y < FLAG_UP_Y + PAD_T + 0.7) return true;
    return false;
  }
  // HOW MUCH AIR IS OVER THIS SPOT.
  // The lowest solid thing above a walking surface at (x, z), or
  // Infinity for open sky. Two kinds of lid in this map:
  //
  //   a DECK, whose slab hangs SLAB_UNDER below its walking surface
  //   (0.9 of structural slab and a 0.16 plate under that, inset)
  //
  //   a TUNNEL LID, over the rim climbs and the bridge arms, whose
  //   underside is TUN_T below the surface you can walk on top of it
  //
  // Ramps are not in here and must not be: a ramp is solid from the
  // ground up, so there is no air under one to measure. A spot inside
  // a ramp footprint is dealt with by the ground being occupied,
  // not by the ceiling being low.
  //
  // SLAB_UNDER is declared up with the heights now, because the flag
  // platform's height is worked out from it.
  function ceilingAt(x, z, y) {
    let low = Infinity;
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      const under = d[4] - SLAB_UNDER;
      if (under > y + 0.6 && under < low) low = under;     // over their head
    }
    for (let i = 0; i < ROOF_TOPS.length; i++) {
      const r = ROOF_TOPS[i];
      if (x < r[0] || x > r[1] || z < r[2] || z > r[3]) continue;
      const under = r[4] - TUN_T;
      if (under > y + 0.6 && under < low) low = under;
    }
    return low;
  }
  function headroomAt(x, z, y) {
    const c = ceilingAt(x, z, y);
    return c === Infinity ? Infinity : c - y;
  }
  // and the cage that fits in it
  function cageHeight(x, z, y) {
    const head = headroomAt(x, z, y);
    if (head === Infinity) return CAGE_H;
    return clamp(head - CAGE_HEAD_GAP, CAGE_MIN_H, CAGE_H);
  }
  // A pillar is a 1.5m block standing in the middle of the ground
  // under a deck, which is exactly the ground this change just opened
  // up. Closing a cage round one would leave the prisoner sharing
  // three metres with a concrete column.
  function onPillar(x, z, y, a) {
    const r = (a || CAGE_A) + 0.9;
    for (let i = 0; i < PILLARS.length; i++) {
      const p = PILLARS[i];
      if (p[3] < y + 0.5) continue;                  // it is below this floor
      if (p[2] > y + 2.5) continue;                  // it starts above head height
      if (Math.abs(x - p[0]) < r && Math.abs(z - p[1]) < r) return true;
    }
    return false;
  }
  // Cover only blocks the floor it stands on - a crate on the floor
  // is nothing to a cage coming down on the catwalk above it.
  // deck or ramp underfoot - used to find the doorways in the kerbs
  // Level-aware too, and it has to be: without the height, a perch
  // overhead would delete the kerb off the catwalk edge underneath it
  // and turn a railed walkway into an open drop.
  function topsideAt(x, z, y) {
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      if (y === undefined || Math.abs(d[4] - y) < 1.2) return true;
    }
    for (let i = 0; i < RAMPS.length; i++) {
      const r = RAMPS[i];
      if (x < r[0] - 0.3 || x > r[1] + 0.3 || z < r[2] - 0.3 || z > r[3] + 0.3) continue;
      if (y === undefined) return true;
      const yL = r[6] === undefined ? 0 : r[6];
      const yH = r[7] === undefined ? UP_Y : r[7];
      if (y >= Math.min(yL, yH) - 1.4 && y <= Math.max(yL, yH) + 1.4) return true;
    }
    return false;
  }
  // v42: a cage no longer has to keep off cover. Its walls stand on
  // the box's own floor and pass through the box, so the only thing
  // refused is a cage whose floor is not the one the box is on, AND
  // whose walls would land inside the box - a cage floating in a
  // crate. See BOXES.
  function inCover(x, z, m, y) {
    for (let i = 0; i < BOXES.length; i++) {
      const b = BOXES[i];
      if (y > b[5] - 0.6 && y < b[4] + 0.6) continue;   // this box's floor, or its top
      if (y < b[5] - 0.6 || y > b[4] + 3) continue;      // another floor entirely
      if (boxGap(b, x, z) < (m || 0) * 0.2) return true;
    }
    return false;
  }

  // --- building it ------------------------------------------
  const mapRoot = el("m-group", {});

  // deck slabs, their kerbs, and the pillars holding them up
  DECKS.forEach(([x0, x1, z0, z1, dy]) => {
    const w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    el("m-cube", {
      x: cx, z: cz, y: dy - 0.45, width: w, height: 0.9, depth: d,
      color: CONCRETE, collide: "true",
    }, mapRoot);
    el("m-cube", {
      x: cx, z: cz, y: dy - 0.96, width: w - 1.2, height: 0.16, depth: d - 1.2,
      color: dy > UP_Y + 1 ? STEEL : STEEL_DK,
    }, mapRoot);
    // A lip round the edge, so a drop reads as a drop rather than as
    // floor that stops. It is laid in short tiles and any tile with
    // deck or ramp on the far side of it is left out - otherwise
    // every junction in the ring, and the top of every ramp, would
    // be walled off by two kerbs facing each other.
    const bare = NO_KERB.some(r => r[0] === x0 && r[1] === x1 && r[2] === z0 && r[3] === z1);
    if (!bare) [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([nx, nz]) => {
      const along = nx ? d : w;
      const tiles = Math.max(1, Math.round(along / 2));
      const step = along / tiles;
      // A KERB IS A FLOOR TOO. The lip is KERB high - a STEP - so you
      // walk up onto it without deciding to, and once you are on it
      // the deck pad is below your feet and nothing is reporting. It
      // reports for itself now, and it is laid in RUNS rather than 2m
      // tiles: same continuous lip, one solid and one listener per
      // run instead of twenty. A run ends wherever a tile would have
      // been left out for a doorway or a staircase, so the doorways
      // are still in it.
      let run = -1;                       // index of the first tile in the run
      const flush = (end) => {            // end = last tile index in the run
        if (run < 0) return;
        const c0 = (nx ? z0 : x0) + step * run;
        const c1 = (nx ? z0 : x0) + step * (end + 1);
        const len = c1 - c0, mid = (c0 + c1) / 2;
        const kx = nx ? (nx < 0 ? x0 + 0.2 : x1 - 0.2) : mid;
        const kz = nx ? mid : (nz < 0 ? z0 + 0.2 : z1 - 0.2);
        reports(el("m-cube", {
          x: +kx.toFixed(2), z: +kz.toFixed(2), y: dy + PAD_T + KERB / 2,
          width: nx ? 0.4 : len + 0.05, height: KERB,
          depth: nx ? len + 0.05 : 0.4, color: STEEL,
        }, mapRoot), kx, kz, dy + PAD_T + KERB);
        run = -1;
      };
      for (let i = 0; i < tiles; i++) {
        const t = (nx ? z0 : x0) + step * (i + 0.5);
        const kx = nx ? (nx < 0 ? x0 + 0.2 : x1 - 0.2) : t;
        const kz = nx ? t : (nz < 0 ? z0 + 0.2 : z1 - 0.2);
        // ...and a STAIRCASE is a doorway too. A kerb laid along the
        // edge of a deck ran straight across the mouth of every ramp
        // that climbs off it, which is the "block in the stairs" you
        // walk into at the bottom of a rim climb. Nothing the map
        // lays down goes inside a ramp footprint.
        const gap = topsideAt(kx + nx * 1.3, kz + nz * 1.3, dy) ||   // a doorway
          RAMPS.some(([rx0, rx1, rz0, rz1]) =>
            kx > rx0 - 0.6 && kx < rx1 + 0.6 && kz > rz0 - 0.6 && kz < rz1 + 0.6);
        if (gap) { flush(i - 1); continue; }
        if (run < 0) run = i;
      }
      flush(tiles - 1);
    });
    // Pillars, on a grid, doubling as cover underneath. A third-tier
    // deck stands on the deck below it, not on the ground, so each
    // column starts at whatever is actually under that spot.
    for (let px = x0 + 6; px <= x1 - 5; px += 14) {
      for (let pz = z0 + 6; pz <= z1 - 5; pz += 16) {
        const foot = supportTop(px, pz, dy);
        const h = dy - 0.9 - foot;
        if (h < 0.6) continue;
        PILLARS.push([px, pz, foot, foot + h]);
        el("m-cube", {
          x: px, z: pz, y: foot + h / 2, width: 1.5,
          height: h, depth: 1.5, color: STEEL_DK, collide: "true",
        }, mapRoot);
      }
    }
  });

  // ramps, tread by tread
  RAMPS.forEach(([x0, x1, z0, z1, lowEnd, axis, yL, yH, railMode]) => {
    const yLow = yL === undefined ? 0 : yL;
    const yTop = yH === undefined ? UP_Y : yH;
    const rise = yTop - yLow;
    const along = axis === "x" ? x1 - x0 : z1 - z0;
    const across = axis === "x" ? z1 - z0 : x1 - x0;
    const n = Math.max(4, Math.round(rise / RAMP_RISE));
    const run = along / n;
    for (let i = 0; i < n; i++) {
      // Step i, counting up from the low end. The last one tops out
      // level with the deck SLAB, not with the deck surface, because
      // the tread then gets a pad on it exactly as the deck does -
      // so the two meet flush and there is no lip at the top.
      const top = yLow + rise * (i + 1) / n;
      const c = lowEnd < 0
        ? (axis === "x" ? x0 : z0) + run * (i + 0.5)
        : (axis === "x" ? x1 : z1) - run * (i + 0.5);
      const attrs = axis === "x"
        ? { x: c, z: (z0 + z1) / 2, width: run + 0.06, depth: across }
        : { x: (x0 + x1) / 2, z: c, width: across, depth: run + 0.06 };
      RAMP_STEPS.push(Object.assign({ top: top }, attrs));
      el("m-cube", Object.assign({
        y: (yLow + top) / 2, height: top - yLow,
        color: CONCRETE, collide: "true",
      }, attrs), mapRoot);
    }
    // A rail down each side, so a ramp reads as a way up - except on
    // the rim, where only the OUTBOARD side gets one. The pitch side
    // of a rim ramp is deliberately open: that is what lets you step
    // off it the whole way down and is the difference between the
    // climb, which commits you, and the descent, which does not.
    // ...and the rail sits just OUTSIDE the tread rather than a
    // quarter of a metre inside it. Dinopawnz: "keep the stairs clear
    // of blocks protruding from the stairs." A rail overhanging the
    // top step is the thing you catch a foot on.
    let railA = axis === "x"
      ? [{ x: (x0 + x1) / 2, z: z0 - 0.3 }, { x: (x0 + x1) / 2, z: z1 + 0.3 }]
      : [{ x: x0 - 0.3, z: (z0 + z1) / 2 }, { x: x1 + 0.3, z: (z0 + z1) / 2 }];
    if (railMode === "outer") {
      railA = [railA.reduce((a2, b2) => (Math.abs(b2.x) > Math.abs(a2.x) ? b2 : a2))];
    } else if (railMode === "none") railA = [];
    railA.forEach((r) => {
      // A RAIL IS A LEDGE. Flat on top, half a metre wide, the length
      // of the ramp, and at the top of a climb its top stands 0.44
      // over the deck you arrive on - so you step up onto it the same
      // way you step up onto a kerb. The two beside the stairs at
      // each base are the "platform next to the flag". It reports as
      // itself, at the height it actually is.
      reports(el("m-cube", Object.assign({
        y: yLow + rise / 2 + 0.4, height: rise + 0.8,
        width: axis === "x" ? along : 0.5,
        depth: axis === "x" ? 0.5 : along,
        color: STEEL_DK, opacity: 0.55,
      }, r), mapRoot), r.x, r.z, yLow + rise + 0.8);
    });
  });

  // THE ROOF over the rim, and the posts holding it up. The posts
  // stand at the corners of each bay so the sides stay open - you can
  // see the whole map from in here and step off it wherever you like.
  // What you cannot do is go UP.
  ROOFS.forEach(([x0, x1, z0, z1, y, yL, yH, lowEnd]) => {
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    el("m-cube", {
      x: cx, z: cz, y: y + ROOF_T / 2, width: x1 - x0 + 0.4,
      height: ROOF_T, depth: z1 - z0, color: STEEL_DK, collide: "true",
    }, mapRoot);
    el("m-cube", {
      x: cx, z: cz, y: y + ROOF_T + 0.12, width: x1 - x0 + 0.8,
      height: 0.2, depth: (z1 - z0) * 0.55, color: WIN_GOLD, opacity: 0.75,
    }, mapRoot);
    // posts: one at each corner of the bay, and a pair down the
    // middle of a long one
    const zs = (z1 - z0) > 20 ? [z0 + 1, cz, z1 - 1] : [z0 + 1, z1 - 1];
    zs.forEach((pz) => {
      [x0 + 0.7, x1 - 0.7].forEach((px) => {
        el("m-cube", {
          x: px, z: pz, y: y - 3.2, width: 0.55, height: 7.2, depth: 0.55,
          color: STEEL_DK, collide: "true",
        }, mapRoot);
      });
    });
    // THE BAFFLES. Beams hung off the lid down to BAFFLE_H over
    // whatever the walkway is doing underneath at that point, so the
    // clearance is the same whether the bay is a flat landing or the
    // middle of a climb. Head height under one, impassable above it.
    const n = BAFFLES ? Math.max(1, Math.round((z1 - z0) / BAFFLE_EVERY)) : 0;
    for (let i = 0; i < n; i++) {
      const bz = z0 + ((z1 - z0) * (i + 0.5)) / n;
      const t = lowEnd === 0 ? 1
        : lowEnd < 0 ? (bz - z0) / (z1 - z0) : (z1 - bz) / (z1 - z0);
      const surf = (lowEnd === 0 ? yH : yL + (yH - yL) * t) + PAD_T;
      const bot = surf + BAFFLE_H;
      if (y - bot < 0.4) continue;              // no room, the lid is already there
      el("m-cube", {
        x: cx, z: bz, y: (bot + y) / 2, width: x1 - x0,
        height: y - bot, depth: 0.7, color: STEEL_DK, collide: "true",
      }, mapRoot);
      el("m-cube", {
        x: cx, z: bz, y: bot + 0.14, width: x1 - x0 + 0.2,
        height: 0.28, depth: 0.9, color: WIN_GOLD, opacity: 0.7,
      }, mapRoot);
    }
  });

  // THE TUNNEL over the top of each climb, and over the bridge.
  if (TUNNEL) {
    const roofY = TOP_Y + PAD_T + TUN_H;
    // the walkway height at the ends of the tunnel, where it is
    // lowest - the walls run from there so they meet the deck all
    // the way along without a gap under them
    const lowSurf = RIMMER + (TOP_Y - RIM_Y) * 0.5;
    const glass = { color: "#9fe8ff", opacity: 0.18, collide: "true" };
    // SOLID. The roof is the whole point of the tunnel; a decorative
    // one that nothing collides with does nothing at all.
    const frame = { color: STEEL_DK, collide: "true" };

    [-1, 1].forEach((s) => {
      // inboard is the side facing the middle of the map, whichever
      // flank this is - mixing those up put the bridge mouth on the
      // arena-wall side of the west tunnel
      const inX = s * RIM_X0, outX = s * RIM_X1;
      const cx = (inX + outX) / 2;
      // the roof
      el("m-cube", Object.assign({ x: cx, z: 0, y: roofY + TUN_T / 2,
        width: RIM_X1 - RIM_X0 + 0.5, height: TUN_T, depth: TUN_Z * 2 }, frame), mapRoot);
      ROOF_TOPS.push([cx - (RIM_X1 - RIM_X0 + 0.5) / 2, cx + (RIM_X1 - RIM_X0 + 0.5) / 2,
        -TUN_Z, TUN_Z, roofY + TUN_T]);
      // the outboard wall, full length
      el("m-cube", Object.assign({ x: outX - s * TUN_T / 2, z: 0,
        y: (lowSurf + roofY) / 2, width: TUN_T, height: roofY - lowSurf,
        depth: TUN_Z * 2 }, glass), mapRoot);
      // the inboard wall, now FULL LENGTH. In v13 and v14 this was in
      // two pieces with a mouth in the middle for the bridge off the
      // peak; there is no bridge any more, so the corridor is closed
      // on both sides for its whole twenty-four metres and the only
      // ways out of it are the two ends you ran in through.
      el("m-cube", Object.assign({ x: inX + s * TUN_T / 2, z: 0,
        y: (lowSurf + roofY) / 2, width: TUN_T, height: roofY - lowSurf,
        depth: TUN_Z * 2 }, glass), mapRoot);
      // a rib at each end so the mouth of the tunnel reads as a mouth
      [-TUN_Z, TUN_Z].forEach((rz) => {
        el("m-cube", Object.assign({ x: cx, z: rz, y: roofY - 0.4,
          width: RIM_X1 - RIM_X0 + 0.6, height: 0.8, depth: 0.6 }, frame), mapRoot);
      });
    });

    // THE BRIDGE TUNNEL  -  the second floor, across the middle
    //
    // The tunnel treatment moves DOWN a floor in v15. Dinopawnz:
    // "lets turn the 2nd floor bridge into what the third floor
    // bridge used to look like."
    //
    // This is the right place for it and always was. The flag-to-
    // bridge-to-flag glide was never launched from the rim; it was
    // launched from HERE, the second-floor span that sits dead centre
    // of the map with a clear line to both ends. Every version since
    // v10 has been trying to break that line with something standing
    // on the pitch. A roof over the span breaks it at the source, and
    // costs the map nothing, because a bridge is a place you CROSS.
    //
    // One arm each side, catwalk to top mid, 19m long: glass down
    // both sides floor to ceiling and a solid lid over the top, with
    // both ends wide open. No lip on the deck - the walls are the
    // edge now.
    //
    // AND THE MIDDLE IS STILL A HOLE. Top mid, the 30x30 platform the
    // two arms meet on, has nothing over it at all. You can drop to
    // the floor off it, jump back up onto it, and see straight up out
    // of the middle of the map. That is the gap, and it is where it
    // has always been.
    const brRoofY = UPPER + BR_TUN_H;
    [-1, 1].forEach((s) => {
      const bx0 = s > 0 ? 15 : -34, bx1 = s > 0 ? 34 : -15;
      const bcx = (bx0 + bx1) / 2, bw = bx1 - bx0;
      // the lid
      el("m-cube", Object.assign({ x: bcx, z: 0, y: brRoofY + TUN_T / 2,
        width: bw, height: TUN_T, depth: BR_Z * 2 + TUN_T }, frame), mapRoot);
      ROOF_TOPS.push([bx0, bx1, -BR_Z - TUN_T / 2, BR_Z + TUN_T / 2, brRoofY + TUN_T]);
      // a wall down each side, sitting on the deck
      [-1, 1].forEach((w2) => {
        el("m-cube", Object.assign({
          x: bcx, z: w2 * (BR_Z - TUN_T / 2), y: (UPPER + brRoofY) / 2,
          width: bw, height: brRoofY - UPPER, depth: TUN_T,
        }, glass), mapRoot);
      });
      // a rib at each end, so both mouths read as mouths
      [bx0, bx1].forEach((rx) => {
        el("m-cube", Object.assign({ x: rx, z: 0, y: brRoofY - 0.4,
          width: 0.6, height: 0.8, depth: BR_Z * 2 + TUN_T }, frame), mapRoot);
      });
    });
  }

  // THE SCREENS. Glass in a steel frame - a post at each end, a rail
  // top and bottom. Solid to a body and to a flight; see-through to
  // a player, which is the whole point of them being panes.
  PANES.forEach(([x, z, len, ry, base, h]) => {
    el("m-cube", {
      x: x, z: z, y: base + h / 2, ry: ry,
      width: PANE_T, height: h, depth: len,
      color: "#8fd8f0", opacity: 0.20, collide: "true",
    }, mapRoot);
    [base + 0.22, base + h - 0.22].forEach((ry2) => {
      el("m-cube", {
        x: x, z: z, y: ry2, ry: ry,
        width: PANE_T + 0.35, height: 0.44, depth: len,
        color: STEEL_DK,
      }, mapRoot);
    });
    // the mullions, so a 30m pane does not read as one sheet
    const n = Math.max(1, Math.round(len / 12));
    for (let i = 0; i <= n; i++) {
      const t = -len / 2 + (len * i) / n;
      // along the pane's own length, which after ry is
      // (sin ry, cos ry) in world x/z - NOT (cos, -sin). Getting
      // that backwards puts the mullions across the glass instead
      // of down it, and it put the harness's own pane-vs-deck test
      // 90 degrees out too.
      el("m-cube", {
        x: x + Math.sin((ry * Math.PI) / 180) * t,
        z: z + Math.cos((ry * Math.PI) / 180) * t,
        y: base + h / 2, ry: ry,
        width: PANE_T + 0.3, height: h, depth: 0.5,
        color: STEEL_DK,
      }, mapRoot);
    }
  });

  // THE TOP OF A PIECE OF COVER, WHICH WAS NOT A SURFACE.
  // Dinopawnz: "this platform right here is designed a little
  // poorly. when you jump on it, you cant walk on it smoothly. its
  // not a straight ledge."
  //
  // Right, and it was two faults stacked on the same 2.5m of steel.
  // On a 1.3m block the top used to be:
  //
  //   block body     0.36 -> 1.66     2.2m across
  //   steel cap      1.66 -> 1.80     2.5m across  (0.15 proud, each side)
  //   standing pad   1.80 -> 2.16     2.0m across  (0.25 inside the cap)
  //
  // The pad is an invisible collider, and it was sitting ON TOP of
  // the cap rather than filling it. So the thing you could see was
  // 36cm below the thing you could stand on, and the thing you could
  // stand on was 25cm narrower. Jump up and you land on a visible
  // steel shelf a quarter of a metre wide with an invisible kerb
  // running along the inside of it; get over that and you are
  // walking on air with the ledge below and outside you. It is not a
  // straight ledge because the ledge and the floor were never the
  // same object.
  //
  // The cap being 15cm proud is the second fault and it is the one
  // you feel on the way up: a lip that overhangs the face it sits on
  // catches you as you rise past it.
  //
  // Both are numbers now. The pad is sunk so its top is flush with
  // the cap, and the cap is brought in almost flush with the body,
  // which makes the visible edge and the walkable edge the same
  // line - which is all "a straight ledge" ever meant.
  const CAP_T = 0.14;           // thickness of the steel cap on cover
  const CAP_OUT = 0.04;         // how far it stands proud of the body, each
                                // side. 0.15 through v26. It is a reveal
                                // line, not a shelf.

  // COVER ON THE FLOOR, AND IT IS THE CAP THAT REPORTS.
  // The geometry is exactly v27's - body, then a steel cap almost
  // flush with it, so the visible edge and the walkable edge are the
  // same line, which is all "a straight ledge" ever meant. What
  // changed is where the reporting lives. v27 put an invisible pad
  // inside the block, flush with the cap; but the cap is what stops
  // you, so your feet rest on the CAP and the pad sat underneath the
  // surface you were standing on, untouched. Dinopawnz: "these
  // platforms right next to the flag still do not detect my team
  // marker." The cap is the top collider, so the cap is the reporter.
  COVER.forEach(([x, z, w, d, h, ry]) => {
    el("m-cube", {
      x: x, z: z, y: GROUND + h / 2, ry: ry,
      width: w, height: h, depth: d, color: CONCRETE, collide: "true",
    }, mapRoot);
    reports(el("m-cube", {
      x: x, z: z, y: GROUND + h + CAP_T / 2, ry: ry,
      width: w + CAP_OUT * 2, height: CAP_T, depth: d + CAP_OUT * 2,
      color: STEEL,
    }, mapRoot), x, z, GROUND + h + CAP_T, ry);
  });

  // and cover up top, where there is otherwise nothing at all to
  // stand behind. Same four-way mirror as the floor.
  const COVER_UP = [];
  // THE CLEAN-UP. Dinopawnz on v15: "this area by the flag could use
  // some cleaning up. theres a very thin ledge that has a random
  // block on it. theres a block in the stairs going up."
  //
  // Both were true, and both were this table:
  //   [30, 78] stood on the FRONT LIP of a base deck, a 20x2m strip.
  //     A 3x3 crate in the middle of a two-metre ledge leaves
  //     nothing either side of it. Deleted - there is no version of
  //     that block that is not clutter.
  //   [22, 86] stood inside the OPENING cut in the base deck, which
  //     is where the stair up out of the room below arrives. It was
  //     a block in the stairs. Moved onto the flag strip at x 14,
  //     where it does what it was meant to do: give the flag itself
  //     something to be fought over behind.
  //   [40, 62] sat inside the footprint of the rim staircase on each
  //     flank. Deleted; the block at z 30 already covers that run and
  //     a second one was only ever in the way.
  [[9, 9, 4, 1.6, 1.2],      // wings either side of the middle
   [40, 30, 2.4, 6, 1.4],    // one block on each flank catwalk, clear
                             // of both staircases
   [14, 86, 4, 4, 1.4]].forEach(([x, z, w, d, h]) => {
    [-1, 1].forEach((sx) => {
      [-1, 1].forEach((sz) => COVER_UP.push([sx * x, sz * z, w, d, h]));
    });
  });
  COVER_UP.push([0, 0, 5, 5, 1.4]);     // the pillar on top mid
  // and on the third tier. Sixth number is the height it stands on.
  // Deliberately thin: up here the cover is the shape of the map -
  // the arms, the corners of the tower ring, the drop off the end of
  // a diagonal - and a wall of crates would ruin the sightlines that
  // are the whole reason to climb.
  // and on the rim. Two blocks on each peak, nothing on the ramps -
  // a crate on a ramp you are meant to be able to step off is just
  // something to trip over.
  // Nothing stands on the rim. Cover up there was a block in the
  // middle of a 8m walkway and it read as clutter on the stairs.
  // and cover up top. One cube, as it always was, reporting as
  // itself. The four of these on the flag strips are the blocks the
  // marker fell off.
  COVER_UP.forEach(([x, z, w, d, h, cy]) => {
    const base = cy === undefined ? UPPER : cy;
    reports(el("m-cube", {
      x: x, z: z, y: base + h / 2,
      width: w, height: h, depth: d, color: STEEL_DK,
    }, mapRoot), x, z, base + h);
  });

  // EVERY BOX IS A FLOOR THE CAGE KNOWS ABOUT - v47.
  // Dinopawnz: "im not able to cage anyone on any of the boxes
  // placed around the map."
  //
  // Nobody could be, on any of the 41 of them. The boxes report, so
  // a tag on one landed - and then the cage fitter asked surfaceAt()
  // what the prisoner was standing on, and surfaceAt() only knows
  // decks, ramps and the floor. A box top was "nothing", the fitter
  // answered zero room, and the tag ran out its retries and let go.
  // Even had it found a floor, inCover() refused any cage within a
  // box's length of any box, as a square, so the ground right beside
  // most of them was refused too.
  //
  // A cage on a box is now a cage AROUND that spot from the box's own
  // floor up: the walls stand on the ground (or the deck) the box is
  // standing on and rise past the box top by the usual height. The
  // walls go straight through the box where they cross it, which is
  // exactly what keeps the prisoner in - stepping off the edge lands
  // you inside the same walls. The same goes for a cage on the floor
  // that happens to overlap a box: allowed now, rather than refused.
  //
  // [x, z, w, d, top, base, ry]
  const BOXES = [];
  // the shortest cage on a box top. Two boxes sit under a deck - the
  // kerbs beside each base ramp and the slabs under the flank walk -
  // with a little over two metres of air above them.
  const BOX_MIN_H = 1.9;
  COVER.forEach(([x, z, w, d, h, ry]) => BOXES.push([x, z, w, d, GROUND + h + CAP_T, GROUND, ry || 0]));
  COVER_UP.forEach(([x, z, w, d, h, cy]) => {
    const base = cy === undefined ? UPPER : cy;
    BOXES.push([x, z, w, d, base + h, base, 0]);
  });
  // how far (x, z) is from a box's footprint, in plan. 0 inside it.
  function boxGap(b, x, z) {
    const a = (b[6] * Math.PI) / 180;
    const dx = x - b[0], dz = z - b[1];
    const lx = dx * Math.cos(a) - dz * Math.sin(a);
    const lz = dx * Math.sin(a) + dz * Math.cos(a);
    return Math.hypot(Math.max(Math.abs(lx) - b[2] / 2, 0),
                      Math.max(Math.abs(lz) - b[3] / 2, 0));
  }
  // The box somebody at height y is standing on, or near enough to
  // that a cage centred here would still be around them. reach is
  // how far off the footprint the centre may be.
  function boxAt(x, z, y, reach) {
    let best = null, bestG = (reach || 0) + 0.001;
    for (let i = 0; i < BOXES.length; i++) {
      const b = BOXES[i];
      if (Math.abs(b[4] - y) > 0.6) continue;
      const g = boxGap(b, x, z);
      if (g < bestG) { bestG = g; best = b; }
    }
    return best;
  }

  // ==========================================================
  // BOUNDARY - wall plus an invisible extension to y 24.4
  // ==========================================================
  const BOUND_L = GALLERY ? DECK_L : ARENA_L - 4;

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * 48.3, y: 2.1, width: 1.2, height: 4.2, depth: BOUND_L,
      color: CONCRETE, collide: "true",
    });
    el("m-cube", {
      x: s * 48.3, y: 4.34, width: 1.7, height: 0.28, depth: BOUND_L, color: CHALK,
    });
    el("m-cube", {
      x: s * 48.3, y: 14.3, width: 1.2, height: 20.2, depth: BOUND_L,
      color: "#000000", opacity: 0, collide: "true",
    });
  });

  // ==========================================================
  // STANDS + GALLERY
  // ==========================================================
  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * 58.45, y: (DECK_TOP - 0.16) / 2,
      width: 19.1, height: DECK_TOP - 0.16, depth: DECK_L,
      color: CONCRETE, collide: "true",
    });
    el("m-cube", {
      x: s * 58.45, y: DECK_TOP - 0.08,
      width: 19.5, height: 0.16, depth: DECK_L, color: "#6c7176",
    });
  });

  const STAIR_RISE = DECK_Y / STAIR_N;
  const ZEDGE = ARENA_L / 2 + 1;
  const DOOR_X = (PORTAL_X + PORTAL_W / 2 + ARENA_W / 2) / 2;

  function galleryStair(sx, sz) {
    const x = sx * STAIR_X;

    el("m-cube", {
      x: sx * DOOR_X, z: sz * (ARENA_L / 2 + 0.5), y: DECK_Y / 2,
      width: DOOR_W - 0.4, height: DECK_Y, depth: 3,
      color: CONCRETE, collide: "true",
    });

    for (let i = 0; i < STAIR_N; i++) {
      const h = (i + 1) * STAIR_RISE;
      const zc = sz * (ZEDGE + (STAIR_N - 1 - i) * STAIR_RUN + STAIR_RUN / 2);

      el("m-cube", {
        x: x, z: zc, y: h / 2,
        width: STAIR_W, height: h, depth: STAIR_RUN + 0.06,
        color: CONCRETE, collide: "true",
      });
      el("m-cube", {
        x: x, z: zc + sz * (STAIR_RUN / 2), y: h + 0.04,
        width: STAIR_W + 0.2, height: 0.08, depth: 0.18,
        color: BLUE,
      });
      [-1, 1].forEach((e) => {
        el("m-cube", {
          x: x + e * (STAIR_W / 2 + 0.3), z: zc, y: (h + 1.0) / 2,
          width: 0.6, height: h + 1.0, depth: STAIR_RUN + 0.06,
          color: STEEL_DK, collide: "true",
        });
      });
    }

    const zFoot = sz * (ZEDGE + STAIR_N * STAIR_RUN + 0.4);
    [-1, 1].forEach((e) => {
      const nx = x + e * (STAIR_W / 2 + 0.3);
      el("m-cylinder", { x: nx, z: zFoot, y: 1.6, radius: 0.45, height: 3.2, color: STEEL_DK, collide: "true" });
      orb({ x: nx, z: zFoot, y: 3.6, radius: 0.6, color: LAMP });
      el("m-light", { x: nx, z: zFoot, y: 3.6, type: "point", intensity: 5, color: LAMP });
    });

    const zSign = sz * (ZEDGE + STAIR_N * STAIR_RUN + 2.2);
    const ry = sz < 0 ? 180 : 0;
    el("m-cube", {
      x: x, z: zSign, y: 2.6, ry: ry,
      width: 9, height: 2.0, depth: 0.3, color: FRAME,
    });
    el("m-label", {
      x: x, z: zSign + sz * 0.25, y: 2.6, ry: ry,
      width: 8.4, height: 1.4, "font-size": 52, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "SPECTATOR GALLERY",
    });
  }

  if (GALLERY) {
    [-1, 1].forEach((sx) => {
      el("m-cube", {
        x: sx * 49.0, y: DECK_Y + RAIL_H / 2,
        width: 0.18, height: RAIL_H, depth: DECK_L,
        color: "#cfe8f0", opacity: 0.12, collide: "true",
      });
      el("m-cube", {
        x: sx * 49.0, y: DECK_Y + RAIL_H,
        width: 0.5, height: 0.18, depth: DECK_L, color: STEEL,
      });
      for (let z = -132; z <= 132; z += 12) {
        el("m-cylinder", {
          x: sx * 49.0, z: z, y: DECK_Y + RAIL_H / 2,
          radius: 0.1, height: RAIL_H, color: STEEL,
        });
      }
      el("m-cube", {
        x: sx * 66.9, y: DECK_Y + 0.45,
        width: 0.5, height: 0.9, depth: DECK_L, color: STEEL_DK, collide: "true",
      });
    });

    GALLERY_ENDS.forEach((sz) => {
      [-1, 1].forEach((sx) => galleryStair(sx, sz));
    });

    [-1, 1].forEach((sx) => {
      [-1, 1].forEach((sz) => {
        el("m-cube", {
          x: sx * 49.55, z: sz * 140, y: DECK_Y / 2,
          width: 1.3, height: DECK_Y, depth: 2.6,
          color: CONCRETE, collide: "true",
        });

        const zEnd = sz * (DECK_L / 2 - 0.1);
        const runs = hasGallery(sz)
          ? [[48.9, DOOR_X - DOOR_W / 2], [DOOR_X + DOOR_W / 2, 68]]
          : [[48.9, 68]];

        runs.forEach(([x0, x1]) => {
          el("m-cube", {
            x: sx * (x0 + x1) / 2, z: zEnd, y: DECK_Y + RAIL_H / 2,
            width: x1 - x0, height: RAIL_H, depth: 0.18,
            color: "#cfe8f0", opacity: 0.12, collide: "true",
          });
          el("m-cube", {
            x: sx * (x0 + x1) / 2, z: zEnd, y: DECK_Y + RAIL_H,
            width: x1 - x0, height: 0.18, depth: 0.5, color: STEEL,
          });
        });
      });
    });
  }

                             : orb({ y: y, radius: r, color: fire }, g);
          const a = document.createElement("m-attr-anim");
          a.setAttribute("attr", "sy");
          a.setAttribute("start", "0.8");
          a.setAttribute("end", "1.25");
          a.setAttribute("duration", String(ms + k * 23));
          a.setAttribute("loop", "true");
          f.append(a);
        });
        el("m-light", { y: 2.2, type: "point", intensity: FIRE_GLOW, distance: 14, color: fire }, g);
      });
      // banners in each half's colour, each with a white flag on it
      for (let z = -100; z <= 100; z += 50) {
        const t = z < 0 ? -1 : z > 0 ? 1 : 0;
        const bx = s * (ARENA_W / 2 - 2.2);
        el("m-cube", { x: bx, z: z, y: 31, width: 0.4, height: 20, depth: 8, color: t ? homeMid(t) : "#2a2f3a" });
        [-1, 1].forEach((e) => {
          el("m-cube", { x: bx, z: z + e * 3.85, y: 31, width: 0.46, height: 20, depth: 0.3, color: t ? homeCol(t) : CHALK });
        });
        el("m-cube", { x: s * (ARENA_W / 2 - 2.2), z: z, y: 41.4, width: 0.6, height: 0.5, depth: 8.6, color: STEEL });
        // the flag emblem: pole and cloth
        el("m-cube", { x: bx - s * 0.25, z: z - 1.4, y: 31, width: 0.06, height: 9, depth: 0.25, color: CHALK });
        el("m-cube", { x: bx - s * 0.25, z: z, y: 33.8, width: 0.06, height: 2.6, depth: 2.6, color: CHALK });
      }
      // slogan boards over the gallery
      ["TAKE THEIR FLAG.", "STAY CLOSE TO YOUR CARRIER.", "FIRST TO " + CAPS_TO_WIN + " WINS."].forEach((text, k) => {
        const z = -60 + k * 60;
        el("m-cube", { x: s * 66.2, z: z, y: 13, ry: s * -90, width: 31, height: 4.6, depth: 0.3, color: FRAME });
        el("m-label", {
          x: s * 66.0, z: z, y: 13, ry: s * -90,
          width: 30, height: 3.8, "font-size": 80, alignment: "center",
          color: BOARD, "font-color": CHALK, content: text,
        });
      });
    });
  }

  brandDress();

  // ==========================================================
  // GAME STATE
  // ==========================================================
  let phase = "STANDBY";      // STANDBY | LIVE | WIN
  let idSeen = false;         // has any collision come in WITH an id?
  let noIdHits = 0;           // collisions that came in without one
  const score = { "-1": 0, "1": 0 };
  let clockEnds = 0;
  let suddenDeath = false;
  let winner = 0;
  let flashUntil = 0;

  const players = new Map();  // connectionId -> player
  const cages = [];
  const PARK = -900;

  function teamName(t) { return homeName(t); }
  function other(t) { return -t; }

  // ==========================================================
  // PLAYERS - the floor says who is where
  // ==========================================================
  // Every collider a player can stand on reports their connection id
  // and the spot. That is the whole identity system.
  function player(id) {
    let p = players.get(id);
    if (!p) {
      p = {
        id: id, team: 0, x: 0, z: 0, y: GROUND, t: 0,
        vx: 0, vz: 0, ax: 0, az: 0, at: 0,
        pads: 0, offSince: 0, state: "free", carrying: 0,
        safeUntil: 0, lastTagAt: 0, marker: null, mx: 1e9, mz: 1e9, mAt: 0, shown: "",
        // the probe half: raw reading, when it came, the learned
        // offset, and how many readings have agreed with the floor
        gx: 0, gy: 0, gz: 0, gt: 0, ox: 0, oy: 0, oz: 0, cal: 0,
        gvx: 0, gvz: 0, lgx: 0, lgz: 0, lgt: 0,
      };
      players.set(id, p);
    }
    return p;
  }

  // kind: "start" | "move" | "end". wx, wz: world position (not for
  // end). wy: the height of the surface they are standing on, which is
  // how the game knows which floor somebody is on. Every pad knows its
  // own, so a player's height comes free with their position.
  function stepped(e, kind, wx, wz, wy) {
    const d = e && e.detail;
    const id = d ? d.connectionId : undefined;
    if (id === undefined || id === null) { noIdHits++; return null; }
    idSeen = true;
    const p = player(id);
    const now = Date.now();
    if (kind === "end") {
      p.pads = Math.max(0, p.pads - 1);
      if (!p.pads) p.offSince = now;
      return p;
    }
    if (kind === "start") p.pads++;
    else if (p.pads < 1) p.pads = 1;     // a lost start event
    p.offSince = 0;
    if (typeof wy === "number") p.y = wy;
    if (typeof wx !== "number" || isNaN(wx)) return p;
    p.x = wx; p.z = wz; p.t = now;
    const dt = (now - p.at) / 1000;
    if (dt >= 0.1) {
      if (dt < 1.2) {
        const vx = (wx - p.ax) / dt, vz = (wz - p.az) / dt;
        if (Math.hypot(vx, vz) < 20) {
          p.vx = p.vx * 0.35 + vx * 0.65;
          p.vz = p.vz * 0.35 + vz * 0.65;
        }
      } else { p.vx = 0; p.vz = 0; }
      p.ax = wx; p.az = wz; p.at = now;
    }
    return p;
  }

  // ==========================================================
  // THE PROBE - the only thing that can see you in the air
  // ==========================================================
  let probeSeen = false;        // has the probe ever said anything?
  let probeCal = 0;             // how many players it is calibrated for

  function probeAt(e) {
    const d = e && e.detail;
    if (!d) return;
    const id = d.connectionId;
    if (id === undefined || id === null) return;
    const pos = (d.documentRelative && d.documentRelative.position) ||
                (d.elementRelative && d.elementRelative.position) ||
                d.position;
    if (!pos || typeof pos.x !== "number" || isNaN(pos.x)) return;
    probeSeen = true;
    const p = player(id);
    const now = Date.now();

    // how fast the probe says they are moving, which is the only
    // velocity that means anything while they are off the floor
    if (p.lgt && now - p.lgt > 40 && now - p.lgt < 1200) {
      const dt = (now - p.lgt) / 1000;
      const vx = (pos.x - p.lgx) / dt, vz = (pos.z - p.lgz) / dt;
      if (Math.hypot(vx, vz) < 40) {
        p.gvx = p.gvx * 0.4 + vx * 0.6;
        p.gvz = p.gvz * 0.4 + vz * 0.6;
      }
    }
    p.lgx = pos.x; p.lgz = pos.z; p.lgt = now;
    p.gx = pos.x; p.gy = pos.y; p.gz = pos.z; p.gt = now;

    // CALIBRATION. Only ever done while they are standing on a pad,
    // because that is the only moment the true answer is known.
    if (p.pads > 0 && now - p.t < 400) {
      const ox = p.x - pos.x, oy = p.y - pos.y, oz = p.z - pos.z;
      if (!p.cal) {
        p.ox = ox; p.oy = oy; p.oz = oz; p.cal = 1;
      } else if (Math.hypot(ox - p.ox, oz - p.oz) < CAL_JUMP) {
        // ease towards it rather than snapping, so one bad reading
        // cannot throw a calibration that a hundred good ones built
        p.ox = p.ox * 0.82 + ox * 0.18;
        p.oy = p.oy * 0.82 + oy * 0.18;
        p.oz = p.oz * 0.82 + oz * 0.18;
        if (p.cal < CAL_MIN + 6) p.cal++;
        if (p.cal === CAL_MIN) probeCal++;
      } else {
        // the offset moved a long way in one reading. That is the
        // probe being wrong in a new way, not the player moving, so
        // start the calibration again rather than averaging junk in.
        if (p.cal >= CAL_MIN) probeCal--;
        p.ox = ox; p.oy = oy; p.oz = oz; p.cal = 1;
      }
    }
  }
  function probeGone(e) {
    const d = e && e.detail;
    if (!d || d.connectionId === undefined) return;
    const p = players.get(d.connectionId);
    if (p) p.gt = 0;
  }

  // Where the probe says they are, corrected into real coordinates -
  // or null, which means fall back to the floor and to the sky column.
  function glideAt(p) {
    if (!GLIDE_PROBE || !p.gt || p.cal < CAL_MIN) return null;
    if (Date.now() - p.gt > PROBE_FRESH) return null;
    return { x: p.gx + p.ox, y: p.gy + p.oy, z: p.gz + p.oz };
  }
  // true when the marker can honestly ride over their head
  function tracked(p) { return !!glideAt(p); }
  // the height to hang a marker at: the probe while they are off the
  // floor and it is working, the floor the rest of the time
  function standY(p) {
    const g = (p.pads > 0) ? null : glideAt(p);
    return g ? g.y : (p.y || 0);
  }

  if (GLIDE_PROBE) {
    const probe = el("m-position-probe", {
      range: PROBE_RANGE, interval: PROBE_MS, debug: "false",
    });
    on(probe, "positionenter", probeAt);
    on(probe, "positionmove", probeAt);
    on(probe, "positionleave", probeGone);
  }

  // --- in the air -------------------------------------------
  // Every pad going quiet at once means one of two things: they
  // jumped, or they walked off the pad grid. Somebody last seen out
  // at the edge probably stepped off; anybody else is in the air.
  // Carry a player forward at the speed they were last seen doing.
  // Separate from predict() because predict() asks whether they are
  // airborne and this is part of answering that.
  function coast(p, t) {
    let dx = p.vx * t, dz = p.vz * t;
    const m = Math.hypot(dx, dz);
    if (m > EDGE_LOOK_MAX) { dx *= EDGE_LOOK_MAX / m; dz *= EDGE_LOOK_MAX / m; }
    return { x: p.x + dx, z: p.z + dz };
  }
  // WHO LEFT.
  // Every pad going quiet at once means one of two things - they
  // jumped, or they left the pitch - and the floor says exactly the
  // same thing in both cases. Two questions separate them, and both
  // have to pass before anybody is given the long window:
  //   1. were they standing at the rim when the floor lost them?
  //   2. were they HEADING OFF it? Carry them forward a second at the
  //      speed they were last doing, and if that puts them over the
  //      touchline they walked out, however far inside they were when
  //      the last pad reported.
  // Either one and they get EDGE_AIR_MS - a fifth of a second - which
  // is the same answer v5 gave and is why walking off has always been
  // noticed straight away. The long window is only ever handed to
  // somebody who was inside the pitch and not on their way out of it.
  function airWindow(p) {
    if (Math.abs(p.x) > FIELD_W / 2 - EDGE_M ||
        Math.abs(p.z) > FIELD_L / 2 - EDGE_M) return EDGE_AIR_MS;
    const q = coast(p, EDGE_LOOK);
    if (Math.abs(q.x) > FIELD_W / 2 ||
        Math.abs(q.z) > FIELD_L / 2) return EDGE_AIR_MS;
    return AIR_MS;
  }
  function airborne(p) {
    return !p.pads && !!p.offSince && Date.now() - p.offSince < airWindow(p);
  }
  // Off the pads for longer than a hop. Still on the pitch, still
  // holding the flag, but nobody - the game included - knows where
  // they actually are any more, so they are out of reach both ways.
  function highUp(p) {
    return airborne(p) && Date.now() - p.offSince > HIGH_MS;
  }
  const SKY_DOTS = Math.max(2, Math.floor(SKY_BEAM / SKY_STEP));

  function onPitch(p) {
    return (p.pads > 0 || airborne(p)) && Date.now() - p.t < GHOST_MS;
  }
  // IS THERE ANYBODY THERE - and this is a different question from
  // onPitch(), which is a RULES question and is answered by the floor
  // on purpose. This one is only ever asked about drawing a marker,
  // and for that the floor is the wrong authority: the floor knows
  // about pads, and a player is not standing on a pad, they are
  // standing on the MAP.
  //
  // Every pad the map is missing therefore reads as "gone" - and the
  // map was missing a few, which is what this version is about. The
  // kerbs and rails below are padded now, but "I have enumerated
  // every surface" is a claim that goes stale the first time anybody
  // adds a block to this document, and the cost of getting it wrong
  // is somebody's ball falling off their head while they stand still.
  //
  // So the marker gets a second opinion that does not care about the
  // floor at all. The probe sees a calibrated player anywhere in the
