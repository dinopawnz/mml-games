  v28 - THE THING YOU STAND ON IS THE THING THAT REPORTS.

  Dinopawnz, on the crate beside Red's flag: "these platforms
  right next to the flag still do not detect my team marker."

  This document has had two kinds of reporter since v1 and only
  ever thought about one of them.

  A floor PAD is an invisible box, because the floor needs a GRID
  - eight metres of it at a time - and out on open ground there
  is nothing to hang a grid on. It works because it is the TOP
  COLLIDER: your feet rest on the pad itself. True of the floor,
  every deck, every tread of every ramp, every tunnel roof.

  The FLAG STAND is the other kind and has always worked: a
  visible, solid cylinder with listen() on it, reporting as
  itself. Every flag ever picked up in this game came through it.
  Which is the proof that resting on a solid fires its events -
  and therefore the proof that the problem was never detection,
  it was WHICH ELEMENT was listening.

  Because everywhere else in the map there IS something to stand
  on, and an invisible pad near it can only ever be wrong:
    ABOVE it  - v24 - and you float 36cm over the visible ledge.
                Dinopawnz: "you cant walk on it smoothly. its not
                a straight ledge."
    INSIDE it - v27 - and your feet never reach the pad, because
                the BLOCK stopped you. Straight ledge, silent
                surface. This is why the crates beside both flags
                have reported nothing since v27, and it is the
                block in the screenshot.
    BESIDE it - the kerbs and rails, which had no pad at all.

  So they report as THEMSELVES now, the way the flag stand does.
  reports(node, x, z, top) puts collide, an interval and a
  listener on a solid that already exists. No pads, no split
  bodies, no invisible caps, nothing new to trip over, and every
  piece of geometry in the map is back to exactly what it looked
  like in v27.

  WHAT GAINED A VOICE: every crate on the floor (the steel cap,
  which is what stops you, not the body under it), every crate up
  top - including the four on the flag strips - both flag
  plinths, every ramp rail, and the kerb round every deck. The
  kerb is laid in RUNS rather than 2m tiles now, one solid and
  one listener per run instead of twenty, which took 500
  colliders out of the map.

  AND listen() UNDERSTANDS A TURNED BLOCK. A collision position
  arrives in the ELEMENT's frame, so on the two angled crates it
  has to be turned back before it means anything in the world.
  Nothing needed that while only square-on pads listened.

  AND A SECOND OPINION. onPitch stays floor-first, because tags

  v26 - THE MARKER STOPS READING THE FLOOR.

  Dinopawnz: "why does the marker go a little far away when im
  running. id like it to stay relatively close to my character
  when im running."

  It was not the smoothing, and it was not the lead. It was the
  NUMBER being followed.

  The ball was driven by the floor whenever a pad had you, and a
  pad reports ITSELF, not you. Pads are 8m across. So while you
  run, the target the ball is chasing is a pad centre that can
  already be four or five metres off you when it is read, and only
  jumps when you cross into the next pad. The 115ms of smoothing
  added in v24 then spreads each of those jumps out, which is what
  turns a stepping target into a ball that hangs back and then
  hurries up. It looks perfect when you stand still, because a
  stale pad centre is still the pad you are standing on - which is
  exactly the shape of the complaint.

  Worse, every velocity the game had on the ground was measured
  BETWEEN pad centres, so the lead it was spending was guesswork
  built on 8m steps. That is the v24 harness's "speed unknown"
  row, the one that measured 1.47m behind at a sprint.

  THE FIX. The marker now rides the probe on the ground as well as
  in the air - a real continuous position every 100ms, corrected
  by the calibration the probe already maintains, and led by the
  probe's own velocity, which is the first honest ground speed
  this document has ever had. The pad steps are simply not in the
  signal any more.

  The rules did not move. Tags, halves, jail, flag pickups and
  carry clocks are all still decided by the floor, exactly as
  before - the floor is the authority for what HAPPENED, and it
  should be. It just is not the right place to ask where to draw
  a ball. That split is the new markerAt(), sitting next to the
  old predict(), which is untouched.

  One smaller thing comes with it: the lead went 0.08 to 0.10. It
  has to cover the write interval plus about half the smoothing,
  and v24 stretched both (40/52ms became 60/115ms) without
  re-cutting it. On a model of a 6m/s sprint with a dead stop:

    lead    behind at a sprint    past you on a hard stop
    0.06          0.33m                   0.38m
    0.08          0.21m                   0.50m
    0.10          0.09m                   0.62m
    0.12          0.03m                   0.73m

  which is the whole trade in one table - every centimetre taken
  off the running lag is paid for at the moment you stop dead.
  0.10 because running is what was asked about. The same model
  puts v25's floor-driven ball at 1.86m behind on average through
  that sprint, and 4.31m at worst, which is a pad and a half.

  (An asymmetric velocity filter - drop fast, rise slow - was
  tried here to buy back the overshoot, and measured 0.61m
  against 0.62m. It is not in the build. The overshoot is the
  smoothing still flying toward a target written before the stop
  was seen, not a stale speed, so the filter had nothing to fix.)

  THREE WAYS IT FALLS BACK, all of them to v25's behaviour: the
  world has no probe, the probe is not calibrated for that player
  yet, or its corrected position disagrees with the pad under
  them by more than 6.5m - a drifted calibration, which is the
  one failure that could park a ball beside somebody instead of
  over them. MARKER_PROBE = false turns the whole thing off.

  WHAT TO WATCH FOR when you test it. The marker should now sit
  on you at a flat sprint and through a turn, which is where v25
  was worst. If instead it sits consistently a metre or two to
  one SIDE of you and stays there - same offset, not a lag - that
  is the calibration, not the lead, and MARKER_PROBE = false puts
  it back. Worth a look on the bridge and the roofs too, since
  those are where the probe matters most and the pads are
  sparsest.

  v24 - A CALMER MARKER, AND THE ROOFS REPORT.

  The map is v21's map and the rules are v23's. Two fixes.

  THE MARKER: SMALLER, ROUND, AND IT SITS STILL
  ------------------------------------------------------------
  Dinopawnz: "the square above our heads now stays very close to
  our character but make that square smaller because its spazzing
  around wayy to much. you can maybe tone down the refresh of that
  marker a tiny bit just so it doesnt bother our eyes with how much
  it spazzes on the screen. also maybe turn that square marker into
  a circle above our heads."

  Three separate things, and all three were real.

  IT WAS A SQUARE because of LOW_POLY: in MML a sphere costs about
  a hundred triangles and a cube costs twelve, so everything ball-
  shaped in this document is a cube turned 45 degrees. Fine for a
  shield dot that never moves. Wrong for the one object on screen
  that is always in shot and always moving - a cube's hard edges
  turn a centimetre of movement into a visible flicker where a
  sphere just slides. The team marker is now a real m-sphere.
  Nothing else changed; it costs about 128 triangles a player.

  IT WAS TOO BIG at 0.68m across. It is 0.48m now.

  AND IT WAS TWITCHING because v22 and v23 chased accuracy alone:
  rewritten every 45ms, the whole gap closed each time, and only
  55ms of smoothing to absorb it. The floor reports a QUANTISED
  position - a pad reports the pad, not the metre - so the target
  steps, and v23 snapped to every step. Toned down exactly as
  asked:

                        v21      v23      v24
    rewritten every     55ms     45ms     60ms
    smoothing takes     85ms     55ms     115ms
    aimed ahead by      30ms     20ms     80ms

  The longer glide absorbs the steps; the longer lead keeps the
  ball on the player anyway.

  HOW IT IS MEASURED, WHICH ALSO CHANGED
  ------------------------------------------------------------
  The v23 harness measured a marker that moved once per game tick
  against a target reported to the metre. Neither is true. The
  model now quantises the floor's report to the pad, renders at
  60fps rather than per tick, reads the last value actually
  WRITTEN, and repeats the whole run across six floor-report rates
  taking the worst of each. Jitter is the mean frame-to-frame
  change in the rendered marker's speed - acceleration, which is
  exactly what reads as twitching.

  On that measurement, at a full sprint:

                                      v21     v23     v24
    behind on average, speed known    0.63m   0.38m   0.40m
    behind on average, speed unknown  1.29m   0.97m   1.47m
    worst instant                     1.87m   1.82m   1.99m
    jitter                            3.06    5.24    2.39
    full-speed turnaround             1.11m   1.76m   1.18m

  v23 was the closest and by far the twitchiest. v24 is calmer
  than v21 - the build nobody complained about - and still closer
  than v21 on the case the game can actually lead, which is most of
  the time you are watching somebody run. The honest cost is the
  "speed unknown" row: when the game has no velocity for you, the
  ball now takes a little longer to catch up. That is the price of
  not snapping, and it was the thing that was asked for.

  ------------------------------------------------------------
  v8 - THE MARKER FOLLOWS YOU WHILE YOU GLIDE
  ------------------------------------------------------------
  The floor cannot see you in the air and m-position-probe can,
  but the probe's numbers do not line up with the world. So the
  two are used together: the probe is CONTINUOUS and wrong by some
  offset, the floor is INTERMITTENT and exact, and every time both
  speak about the same player in the same moment - every step
  anybody takes on the ground - the difference between them is
  measured and kept. Correct the probe by that offset and it can
  be used wherever the floor is silent.

  Stand on the pitch for a second and you are calibrated. Jump,
  and the ball rides over your head the whole way at your real
  height and a carried flag goes with you. Four readings have to
  agree with the floor before the offset is trusted, a reading
  over 700ms old is thrown away, and an offset that jumps more
  than 40m starts the calibration again. In a world where the
  probe says nothing this never switches on, and the marker simply
  holds at the last spot the floor saw them. (v8 to v14 raised a
  sky column there instead. See THE SKY COLUMN IS GONE, above.)

  v7 - THE SKY, AND A THIRD FLOOR
  ------------------------------------------------------------
  1  YOU CANNOT FALL OUT OF THE GAME BY GOING UP.
     Dinopawnz: "if you double jump very high up, your flag that
     you were carrying would reset and also your team assignment
     stops appearing next to your character until you fall back
     onto the field."

     The floor is the only thing in this world that knows where
     anybody is, and a jump takes you off it. v5 built a window
     for that - AIR_MS, two and a half seconds - which covers a
     hop and nothing else. A double jump and a glide lasts much
     longer, the window ran out, and the game concluded you had
     left: marker parked out of the world, carried flag timed out
     and sent home.

     AIR_MS is 30 seconds now, which is longer than anything this
     engine lets you stay up for. Tagging works the whole time -
     in the air, out of it, and between two people who are both
     up there. You cannot jump out of the game and you cannot jump
     out of a tag.

     THE MARKER. There is no altitude to follow you up with: the
     floor reports a height only for the surface you are standing
     on, and in the air you are standing on nothing. One ball at
     one height is therefore impossible. So the marker becomes a
     COLUMN - a thin line of your team colour standing on the spot
     you left the ground, with a team ball threaded up it every
     six metres to ninety-eight.

     (REMOVED IN v15. v8's probe made it unnecessary and it read
     as a beam full of floating flags in the middle of nowhere,
     because it stood where you took off rather than where you
     are. The marker now rides on you. See THE SKY COLUMN IS
     GONE at the top of this file.)

     WHO LEFT. Airborne and gone are the same silence down here,
     and the window being thirty seconds instead of two and a half
     makes getting that wrong thirty seconds expensive. Three
     things answer it, and none of them relies on the others:

       - Were they at the rim? Last seen within EDGE_M of the
         touchline and the window is EDGE_AIR_MS, a fifth of a
         second. That was already true in v5.
       - Were they HEADING OUT? New in v7, and the one that
         matters. Carry them forward a second at the speed they
         were last doing; if that puts them over the line they
         walked out, however far inside the last pad caught them.
         Somebody sprinting off the pitch is gone in 0.6s and has
         dropped the flag inside 3.6.
       - Did they vanish where neither of those applies? A
         respawn, a portal, a client that dies without saying so.
         FLAG_AIR_MAX is a hard ceiling - twenty seconds with no
         pad reporting at all and a carried flag comes home,
         whatever the rest of the game thinks. It is far longer
         than any flight, so it never fires on a real player, and
         it is the reason a ghost cannot take a flag out of the
         game with them.

     Behind all three, the disconnected event still clears
     everything the instant somebody leaves cleanly, and GHOST_MS
     drops the record after ninety seconds.

     One more in the same family, found while testing this: crates
     had no pads. Standing on one looked exactly like being in the
     air - floor quiet, marker parked, flag clock running. Every
     piece of cover on all three floors has a pad on top of it now.

  v6 - TWO FLOORS, AND A MUCH SHORTER SENTENCE.

  THE MAP. The pitch was a flat field; it is now an arena with an
  upstairs. Both flags stand on decks at the ends, two catwalks
  run the flanks, two bridges cross to a platform over the centre
  spot, and six stepped ramps come up off the floor - one at the
  front of each base and one in each quarter. The whole top level
  is a ring you can run without touching the ground, and you can
  drop off any edge of it. The decks stand on pillars, so the
  floor underneath stays open: under the enemy base is a room you
  run through, not a wall you go round. Cover is scattered on
  both floors, mirrored four ways, so both ends are identical.

  It is all generated from two tables, DECKS and RAMPS, near the
  top of THE MAP. Move a line there and the geometry, the pads,
  the cage placement and the flag all follow it.

  Ramps are flights of steps rather than slopes, and that is on
  purpose: a tilted box cannot tell the game where on it you are
  standing, and a step can. Every tread is its own pad reporting
  its own height, so the game knows which floor everybody is on
  to the tread - which is what makes the next part work.

  FLOORS. Two players more than LEVEL_TOL apart in height cannot
  touch each other. Without it everyone on a catwalk would be
  tagging everyone walking underneath it. Cages are built on the
  floor the catch happened on, markers ride at their player's own
  height, and a cage is never dropped on the floor beneath a deck
  where it would grow up through the ceiling.

  THE RULES.
  - A tag holds you for JAIL_MS - three seconds - counted down on
    the cage, and then it lets go. Being caught costs you the run
    you were on, not the rest of the match.
  - You get SAFE_AFTER_FREE - one second - of grace coming out,
    so you are not re-caught standing in the wreckage of your own
    cage.
  - A flag carrier can be tagged ANYWHERE, their own half
    included, and a chaser may leave their own half to run one
    down. There is no back garden to walk a flag home through.
  - A carrier cannot tag anyone. Hands full. Two carriers meeting
    means whoever is in their own half keeps their flag.
  - The tagger no longer gets shut in with the person they
    tagged. The cage is slid off whoever made the catch and never
    closes round anybody but its prisoner - if there is nowhere
    that works, it waits CAGE_RETRY_MS and tries again rather
    than trapping the pair of them.
  - The rescue plate and the cage code box are off (RESCUE). They
    were built for a sentence that lasted until somebody came for
    you; at three seconds nobody can get there in time.

  v5 - JUMPING. The floor is what tells this game who is where, and
  a jump takes you off the floor: every pad you were standing on
  reports collisionend, and until you land nothing reports you at
  all. v4 read that as "gone", so a jumper's team ball was parked
  out of the world and came back on landing - markers blinking off
  every time anybody hopped - and a long hop could time a carried
  flag out and send it home. A jumper also could not be tagged and
  could not tag, so jumping was a free dodge.

  Now, when all of a player's pads go quiet, they are treated as
  AIRBORNE rather than gone: they stay on the pitch for AIR_MS,
  they keep travelling for AIR_COAST at the speed they took off
  at, they can tag and be tagged in the air, and a carried flag
  only times out once the hop should have ended. Somebody last
  seen at the very edge of the pad grid gets a short window
  instead - losing the pads there means they walked off.

  v4
  - Smoother: the team dot and a carried flag no longer hop from one
    floor report to the next. Each keeps its own position and glides
    towards where the player will be a moment from now, updated about
    twelve times a second, with m-attr-lerp smoothing the gaps on
    clients that support it. A flag being picked up no longer streaks
    across the pitch - it appears on the carrier.
  - The team marker is a small ball in the team colour, not a cube.
  - Each side only offers its own team: RED buttons and pad at the
    red end and on the red half of both galleries, BLUE at the blue
    end and the blue half of the galleries.

  v3 - pick your team with a BUTTON. A red JOIN RED button and a blue
  JOIN BLUE button stand at both ends of the field (behind the end
  lines) and halfway down both side galleries. Click one to join or
  switch team (not while you are carrying a flag or caged). The
  sign above each pair shows how many are on each team, and flashes
  when somebody joins. The floor team pads in the lobby and on the
  terrace still work too.

  If a button's sign says "CAN'T TELL WHO CLICKED", this world is not
  reporting player ids and team play cannot work here - tell the
  person who built the game.

  v2 - flag carriers can be protected, so a wall of defenders can't
  just shut the game down:
  - ESCORT: (REMOVED IN v23 - a carrier is taggable no matter who is
    standing near them. See the v23 note at the top of this file.)
  - BREAKAWAY: nobody can tag a carrier for BREAKAWAY_MS after the
    grab, so a carrier gets off the stand.
  - NO GUARDING: a defender standing inside their own base ring
    cannot tag. Camping on the flag does nothing; defenders have to
    come out and play.
  A protected carrier has a ring of shield lights round their feet
  in their team colour.

  Built on the Bulldog arena: same stadium, gallery, lobby, terrace,
  consoles and cages. Two teams, two flags, one pitch.

  THE GAME
  ------------------------------------------------------------
  RED's half is the lobby end, BLUE's is the terrace end. Each team
  has its flag on a stand deep in its own half.

  - Join a team by standing on a team pad: RED or BLUE, in the lobby
    or on the terrace. Your team shows as a coloured diamond over
    your head for everyone to see.
  - Step on the ENEMY flag's stand to grab their flag. It rides over
    your head so everybody can see who has it.
  - Carry it back and step on YOUR OWN stand to score.
  - In the enemy half you can be tagged: any enemy who gets within
    arm's reach of you, while they are in their own half and on the
    same floor as you, tags you. A cage drops on you for three
    seconds and then lets you out with a second of grace. If you
    were carrying their flag, it goes straight back to their stand.
  - Carrying a flag changes both halves of that. You can be tagged
    anywhere, your own half included, and whoever is chasing you
    may follow you into it. And you cannot tag anybody yourself
    while you are holding it.
  - Nobody is caged for standing next to a catch. A cage only ever
    closes round the one person it was meant for.
  - First to CAPS_TO_WIN captures wins. If the clock runs out
    level, the next capture wins.

  THE ARENA
  ------------------------------------------------------------
  Three levels. The flags are up on the base decks at either end,
  reached by a ramp at the front of each base or by the flank
  catwalks. The catwalks run the length of the pitch and meet in
  the middle on a platform over the centre spot; four more ramps,
  one in each quarter, come up off the floor onto them. Every
  edge up there is a drop you can take. Everything under the
  decks is open floor, so the ground route runs the full length
  too, straight under both bases.

  Above all that, on the outside edges only, the rim: an open
  walkway down each flank, climbing from the catwalk through two
  landings to a peak over midfield and back down the far side,
  with a bridge joining the two peaks across the middle. Nothing
  over it and nothing beside it - step off it wherever you like.
  Four ways on and off, one at each end of each flank.

  The top of each climb, the peak and the bridge are enclosed in a
  glass tunnel with a ten metre hole in the middle of the bridge.
  That and two panes on top mid are the whole of the anti-gliding
  geometry; the pitch itself is empty. See v13 at the top.

  You cannot tag, or be tagged by, somebody on another floor. You
  can tag and be tagged at any height - see v7 at the top.

  HOW IT KNOWS WHO YOU ARE
  ------------------------------------------------------------
  Not from m-position-probe - in this world those positions do not
  line up. Every floor pad, flag stand, team pad and cage plate is a
  collider, and MML's collision events carry the player's
  connection id and the exact spot they touched. So the floor itself
  says who is where, which team they are on, who grabbed a flag and
  who tagged whom. The consoles show IDS OK once that is working.

  HOST
  ------------------------------------------------------------
  Enter the code on either console (or TYPE CODE) to start a game:
  scores to zero, flags home, cages open. Enter it twice to stop.
  Cages let go on their own after three seconds, so there is
  nothing to let anybody out of. Set RESCUE true to put the plate
  and the cage code box back. No code is written anywhere in the
  world.

  Set your spawn point in the lobby, around x 0, z -168.
-->

<m-group id="arena"></m-group>
<m-group id="flags"></m-group>
<m-group id="cages"></m-group>
<m-group id="marks"></m-group>

<script>
  // ==========================================================
  // GUARD - nothing that happens in an event or a timer can take
  // the script down. Errors are counted on the consoles (ERR n).
  // ==========================================================
  const BUILD = "CTF V51";
  const BOOT = Date.now();
  let scriptErrors = 0;
  let lastError = "";
  function guard(fn) {
    return function (a, b) {
      try { return fn.call(this, a, b); }
      catch (err) {
        scriptErrors++;
        lastError = String((err && err.message) || err).slice(0, 40);
      }
    };
  }
  function every(fn, ms) { return setInterval(guard(fn), ms); }
  function later(fn, ms) { return setTimeout(guard(fn), ms); }
  function on(node, type, fn) { node.addEventListener(type, guard(fn)); }

  // ==========================================================
  // TUNING
  // ==========================================================

  // --- the match --------------------------------------------
  const CAPS_TO_WIN = 3;        // captures to win
  const ROUND_TIME = 900;       // seconds on the clock. 0 = no clock.
                                // Level at the end: next capture wins.
  const BOTH_FLAGS_HOME = false;// true: you can only score while your own
                                // flag is on its stand (the strict rule)

  // --- tagging ----------------------------------------------
  const TAG_R = 1.8;            // metres between two players that is a tag
  const TAG_COOLDOWN = 1500;    // one defender, one tag per this long
  const HALF_TOL = 0.5;         // on the halfway line counts as your half
  const SAFE_AFTER_FREE = 1000; // somebody just let out can't be tagged
  const FLAG_OFF_MS = 3000;     // a carrier off the pitch this long drops it
  const LEVEL_TOL = 2.8;        // two players more than this far apart in
                                // height are on different floors and cannot
                                // touch each other. Without it everybody on
                                // the catwalk tags everybody underneath it.

  // --- the carrier ------------------------------------------
  // The flag is the game, so whoever has it is the game too: no
  // corner of the pitch is safe for them and they cannot do any
  // catching themselves while they hold it.
  const CARRIER_ANYWHERE = true;  // a carrier can be tagged in any half,
                                  // their own included, and a chaser may
                                  // leave their own half to run one down
  const CARRIER_CAN_TAG = false;  // a carrier cannot tag anybody

  // --- protecting the carrier -------------------------------
  // ESCORTS ARE OFF IN v23.
  // Dinopawnz: "is there a mechanic in this game that the flag
  // carrier cannot be tagged if he has friends around him? remove
  // that mechanic if its actually a thing. a flag carrier should be
  // able to get tagged no matter whos around him."
  //
  // It was a thing. Any teammate within four metres of the carrier
  // made the carrier untaggable, and the defence had to take the
  // escort out first. It was written in v2 to stop a wall of
  // defenders shutting the game down, and it did that - by making the
  // best play in the game "stand next to your carrier", which turns
  // a chase into a formation. A carrier is now taggable with anybody
  // standing anywhere.
  const ESCORT_R = 0;           // a teammate this close makes the carrier
                                // untaggable. 0 turns escorts off.
  const BREAKAWAY_MS = 4000;    // carrier untaggable this long after the grab
  const NO_GUARD_R = 10;        // defenders inside their own base ring (this
                                // radius round their flag) cannot tag. 0 = off.
  // THE RING IS ROUND THE BASE, NOT ON TOP OF IT.
  //
  // Dinopawnz: "the platform that the flag is on, its a brand new
  // platform and tagging players on that platform is not currently
  // working."
  //
  // It was not, and this constant is why. NO_GUARD_R was written when
  // the flag stood on the base deck with the whole 36x20 strip flat
  // around it: a ten-metre circle round the stand was a patch in the
  // middle of a much bigger floor, so "get out of the ring and play"
  // meant taking four steps sideways.
  //
  // Then the flag went up onto a platform of its own - 22 wide by 16
  // deep, with the stand in the middle of it. Ten metres from the
  // stand is now further than the platform goes in three directions.
  // Measured across the deck, EIGHTY PER CENT of the flag platform
  // sits inside the ring, so a defender standing on the thing the
  // platform was built for could not tag anybody at all, and a raider
  // who got up the stairs was untouchable until they walked back off
  // the far corner of it.
  //
  // The ring still does its job everywhere it was meant to: on the
  // deck below, in the room under the base, on the floor out front.
  // What it no longer does is cover the climb, because the climb is
  // not camping - it is the one piece of ground on this map you have
  // to work to stand on, and the platform note further down says as
  // much in as many words: it "puts the defenders looking DOWN at
  // whoever is coming."
  const NO_GUARD_ON_PLATFORM = false;  // true puts the ring back over the
                                       // flag platform and its stairs, which
                                       // is v38's behaviour
  // THE RING IS A DISC, NOT A COLUMN.
  //
  // Dinopawnz: "the platform underneath where the flags are does not
  // register tags and does not cage people."
  //
  // It did not, and v39 fixed the wrong half of it. The note above
  // took the ring off the flag PLATFORM and left the ring itself as
  // what it had been since v2: Math.hypot(x, z - FLAG_Z), a circle
  // drawn in PLAN with no height in it anywhere. That was harmless
  // while the base was one floor. It has not been one floor for a
  // long time.
  //
  // So the ten-metre circle was not a circle, it was a SHAFT, and it
  // ran from the ground up through every storey of the base:
  //
  //     the flag platform      let off by v39
  //     the base deck          directly under the flag - MUZZLED
  //     the room under it      the ground floor - MUZZLED
  //
  // A defender standing in either of the bottom two was inside their
  // own ring, ten metres from a flag five and ten metres over their
  // head, and could not tag anybody at all. Nobody was tagged there,
  // so nobody was ever caged there - which is the same one fault
  // reported twice, and it hit the exact ground the map was built to
  // make people fight over: "the room under each base - the one place
  // this map specifically wants a fight."
  //
  // guarding() asks for the height now as well as the spot. You are
  // camping your flag when you are stood NEXT to it, not when you are
  // stood under the building it is on top of.

  // --- jail -------------------------------------------------
  const JAIL_MS = 3000;         // how long a cage holds you. This is the
                                // whole punishment now - there is no waiting
                                // to be let out and nothing to do but watch
                                // the count. 0 = never opens on its own.
  const RESCUE = false;         // the rescue plate and the host code box.
                                // Both were built for a sentence that lasted
                                // until somebody came for you; at three
                                // seconds nobody can get there in time, so
                                // they are off and the pitch is clearer for
                                // it. true puts them back.
  const RESCUE_HOLD = 1000;     // a teammate stands on the plate this long
  const CAGE_A = 2.8;           // cage interior half-width
  const CAGE_H = 6;             // ...and how tall it is WHERE THERE IS ROOM
  // A CAGE THAT DOES NOT FIT NOW GETS SHORTER INSTEAD OF NOT EXISTING.
  //
  // Dinopawnz: "when you are under the bridge in this game, you are
  // not able to cage players when they are tagged."
  //
  // Right, and it was never about fitting - it was a rule. flatAt()
  // refused every spot on the FLOOR that had any deck over it,
  // because a six-metre cage under a five-metre deck would grow
  // through the ceiling. One line, written when the map had one
  // second floor over the middle of the pitch, and by v21 it had
  // quietly banned cages from:
  //
  //     under both bridge arms          the bit that was noticed
  //     under top mid
  //     the room under each base        the one place this map
  //                                     specifically wants a fight
  //     both flank lanes under the catwalks
  //
  // which is most of the covered ground on the map. Tag somebody in
  // any of it and jail() would hunt for a spot, fail, retry three
  // times, give up - and hand your catch two seconds of immunity for
  // the trouble. A raider who knew that could stand under a bridge
  // and be untouchable.
  //
  // So headroom is now MEASURED, and the cage is built to it. Under a
  // deck there is about four metres of air, so you get a four-metre
  // cage. The walls are colliders either way and three seconds is
  // three seconds. Nothing anywhere on the map is off limits now
  // except the spots that were always off limits for a real reason:
  // on top of somebody else, on a flag stand, or inside cover.
  const CAGE_MIN_H = 3.0;       // shorter than this and it is not a cage,
                                // so the spot is refused after all
  const CAGE_HEAD_GAP = 0.3;    // air left between the cage lid and
                                // whatever is over it
  // ...AND A CAGE THAT DOES NOT FIT IN PLAN GETS NARROWER.
  //
  // Same fault as the headroom one above, one axis over, and it came
  // back the moment the flag went up onto a platform of its own.
  //
  // A cage is 5.6 metres across. The flag platform is 22 by 16 with a
  // 7-metre stand in the middle of it, and the rule was that the
  // whole cage plus 40cm had to land clear of every edge AND clear of
  // the stand - which on that platform leaves four slivers in the
  // corners and nothing else. Tag a raider beside the flag and the
  // cage went up six metres away in a corner, the prisoner was
  // standing outside it, and CAGE_CHECK_MS noticed and let them go.
  // Three seconds of sentence, one and a half of it spent finding out
  // the cage had missed.
  //
  // So width is MEASURED now, exactly as height is: the fitter asks
  // how much room there actually is - to the edges of the deck or the
  // ramp underfoot, and to the flag pole - and builds to it. Out on
  // the pitch nothing changes, because out on the pitch there is
  // always 5.6 metres. On the platform you get a smaller cage that
  // lands ON the person, which is the only kind that is worth
  // anything.
  const CAGE_MIN_A = 1.5;       // narrower than this and it is not a cage
                                // either, so the spot is refused
  const STAND_KEEP = 1.4;       // a cage may cross the apron of a flag
                                // stand but never close round the POLE.
                                // The plinth is radius 0.9, so this
                                // leaves half a metre outside it.
  // A HUDDLE IS NOT A SHIELD EITHER.
  // With escorts gone there was still one way for a carrier's friends
  // to save them: a cage will not be built where it would shut
  // somebody else in, so a tight huddle left nowhere to put one. The
  // flag went home either way - that happens before the cage is even
  // looked for - but the raider walked, and after three tries the
  // game handed them two seconds of immunity for it.
  //
  // So the cage now gets a second, wider go: if it cannot land within
  // CAGE_FIT of where the tag happened, it lands anywhere up to
  // CAGE_FAR that shuts nobody in. You get caged a few metres from
  // where you were caught instead of not being caged at all, which is
  // the right trade. Nobody is ever trapped by somebody else's cage.
  const CAGE_FAR = 8.0;         // ...and how far it may land on the
                                // second go, when a crowd leaves no
                                // room close by
  const CAGE_FIT = 3.0;         // a cage must land within this of the person
  const CAGE_MIN_GAP = 6.4;     // two cages never closer than this
  const CAGE_LAG = 0.3;         // seconds of their own speed it is thrown ahead
  const CAGE_LEAD_MAX = 4.0;
  const CAGE_CHECK_MS = 1600;   // a cage the person is not inside after this
                                // is re-dropped once, then given up
  const MAX_CAGES = 80;
  const CAGE_CLEAR_M = 0.5;     // margin outside the walls that has to be free
                                // of everybody except the prisoner. The tagger
                                // is standing right next to their catch, so
                                // the cage is slid off them.
  const CAGE_TRIES = 3;         // goes at finding a spot that shuts nobody
                                // else in, before the tag is given up on
  const CAGE_RETRY_MS = 450;    // wait between those goes - long enough for
                                // whoever was in the way to move on
  const CAGE_JAM_MS = 2000;     // backstop: somebody who is not the prisoner
                                // shut inside this long and the cage opens
  const PLATE_R = 6.0;          // rescue plate, metres from the cage centre
  const PLATE_RAD = 1.5;

  // --- the floor --------------------------------------------
  const FOOT_PITCH = 8;         // floor pad grid, metres
  const PAD_MS = 90;            // collision-interval on every pad
  const GHOST_MS = 90000;       // nobody heard from this long is off the pitch

  // --- jumping ----------------------------------------------
  // A jump takes a player off every pad they were standing on, so the
  // floor goes quiet until they land. These say how long that silence
  // still counts as being on the pitch, and how far a hop carries.
  // v7: this was 2500, which covers a hop and nothing else. A double
  // jump and a glide in Otherside lasts far longer than that, and when
  // the window ran out the jumper was treated as gone: marker parked,
  // carried flag timed out and sent home. It is now long enough that
  // nothing you can do in the air can outlast it. Somebody who really
  // has left is caught by the disconnected event, and by GHOST_MS
  // behind that - neither of which needs this number to be short.
  const AIR_MS = 30000;         // pads all quiet: still on the pitch this long.
                                // Far longer than any jump or glide, and
                                // bounded on purpose - see WHO LEFT below.
  const EDGE_AIR_MS = 600;      // ...but only this long if they were last seen
                                // at the very edge of the pad grid, where
                                // losing the pads means they walked off.
  const EDGE_M = 2.0;           // how close to the edge counts as the edge
  const PITCH_EDGE = 1.5;       // slack outside the touchline that still
                                // counts as being over the pitch, for the
                                // one question that asks - see present().
                                // Somebody standing with their heels on the
                                // line should not flicker.
  const EDGE_LOOK = 1.0;        // seconds of travel used to ask whether they
                                // were heading OFF the pitch when the floor
                                // lost them. Standing at the rim and hopping
                                // straight up is a jump; crossing the rim at
                                // a run is leaving, and this is what tells
                                // the two apart.
  const EDGE_LOOK_MAX = 11;     // metres that look-ahead may cover
  // A HARD CEILING ON A CARRIED FLAG, independent of everything above.
  // The floor cannot tell "in the air" from "gone" - both are silence -
  // and the disconnect event only fires on a clean exit. Somebody who
  // vanishes in the middle of the pitch (a respawn, a portal, a client
  // that dies without saying so) would otherwise hold a flag hostage
  // for as long as the air window runs. Nothing you can do in the air
  // lasts twenty seconds; a ghost holding a flag costs everybody at
  // most that, and then it comes home on its own.
  const FLAG_AIR_MAX = 20000;
  const AIR_COAST = 0.85;       // seconds of a hop the marker carries them
                                // forward for before it settles. A little
                                // under a real hop, so it trails rather than
                                // races ahead and has to come back.
  const AIR_LEAD_MAX = 6;       // metres a hop may carry them, at most
  // In the air the floor cannot say where anybody is, so after a hop's
  // worth of silence the game stops pretending it knows. A player who
  // has been off the pads this long is HIGH: still on the pitch, still
  // holding whatever they were carrying, marked by a beam of light
  // instead of by a ball - and out of the tagging game entirely, both
  // ways, until they land. Guessing at a tag against a position that
  // is seconds stale is worse than not tagging at all.
  const HIGH_MS = 1800;         // off the pads this long and you are out
                                // of reach

  // --- the probe, and why it is here now --------------------
  // Every version of this game up to v7 read position from the floor
  // and from nothing else, because m-position-probe's numbers do not
  // line up with the world in Otherside - the note at the top of v6
  // says so and it is still true. The floor is exact and the probe is
  // wrong, so the floor won.
  //
  // But the floor cannot see you in the air, and the probe can.
  //
  // The way out is to use them together: the probe is CONTINUOUS and
  // wrong by some offset; the floor is INTERMITTENT and exact. So
  // every time both speak about the same player in the same moment -
  // which is every step they take on the ground - the difference
  // between the two is measured and kept. That difference is the
  // probe's offset, and once it is known the probe can be corrected
  // into real world coordinates and used where the floor is silent.
  //
  // Stand on the pitch for a second and you are calibrated. Jump, and
  // the game now knows where you are and HOW HIGH, so the marker
  // rides over your head the whole way and a carried flag goes with
  // you. Land, and the floor takes over again and re-checks the
  // offset.
  //
  // If the probe reports nothing in a given world, or its numbers are
  // nonsense, nothing here ever calibrates and every part of it turns
  // itself off: the game falls straight back to v7's behaviour, which
  // is the sky column standing on the spot you took off from. It
  // cannot make anything worse than it already was.
  const GLIDE_PROBE = true;     // false removes the probe entirely
  const PROBE_MS = 100;         // how often it reports
  const PROBE_RANGE = 260;      // metres. The whole arena and then some.
  const PROBE_FRESH = 700;      // a reading older than this is not used
  const CAL_MIN = 4;            // readings that agree with the floor before
                                // the offset is trusted at all
  const CAL_JUMP = 40;          // an offset that moves further than this
                                // between readings is noise, not a
                                // calibration, and is thrown away
  const GLIDE_TAIL = true;      // while tracking is live, hang a short
                                // line under the marker so people on the
                                // ground can see somebody overhead
  const GLIDE_TAIL_H = 14;      // and how long that line is
  // THE SKY COLUMN IS OFF IN v15.
  // Dinopawnz: "remove that weird beam that stores the flag and the
  // team marker whenever somebody glides in the air. its confusing to
  // see a floating flag and teammarker in the middle of nowhere inside
  // of a red or blue beam."
  //
  // Fair, and it was always the ugly half of the design. The column
  // stood on the spot you LEFT THE GROUND and ran a line of team balls
  // up through the sky, which is why it read as "in the middle of
  // nowhere": by the time anybody looked at it, the player it belonged
  // to was fifty metres downfield of it. It only ever existed because
  // v7 had no way to know a player's height.
  //
  // v8 fixed that. The probe gives a real position, the marker rides
  // over the player's actual head at their actual height, and the flag
  // rides with it - which is the thing the column was faking. So the
  // column comes out, and what is left when the probe says nothing is
  // the ball and the ring sitting at the last place the floor saw
  // them, which is honest: it marks where somebody went up from, and
  // it stops pretending to mark where they are now.
  const SKY_COLUMN = false;
  const SKY_BEAM = 96;          // how far up the airborne marker column goes
  const SKY_STEP = 6;           // and a team ball every this many metres of
                                // it, so there is one at your head whatever
                                // height you are at. See THE SKY COLUMN.
  const SKY_BEAM_W = 0.5;       // and how wide. Thin: it is a sightline,
                                // not a wall.
  const SKY_BEAM_OP = 0.42;
  const HOP_MS = 900;           // a hop off one pad (the rescue plate) that
                                // still counts as standing on it

  // --- look -------------------------------------------------
  const TEAM_MARKERS = true;    // a team-coloured ball over every player
  const MARKER_MS = 250;        // (unused since v4 - see FOLLOW_MS)
  // HOW TIGHTLY A MARKER STICKS TO ITS PLAYER. All four of these
  // were loosened in v4 to stop the ball jittering between floor
  // reports, and the cost was a marker that trails its player by a
  // metre or two in a fight - which is exactly when you need to know
  // who is who and who has the flag. The probe reports ten times a
  // second now, so the jitter that made the easing necessary is
  // mostly gone and these can be tightened right up.
  // THE MARKER IS TIGHTER IN v22.
  // Dinopawnz: "the marker doesnt follow our character as accurately
  // as i would like. please make sure the marker above our heads stays
  // as close to our character as possible."
  //
  // There are three separate lags between a player and their ball and
  // v21 was paying all three:
  //   1  the game only hears from the floor every 90ms or so;
  //   2  it only REWROTE the marker every 55ms, and then only closed
  //      88% of the gap it could see;
  //   3  the m-attr-lerp that smooths the write took 85ms to land, so
  //      the thing on your screen was behind even the written value.
  //
  // v22 pays 1 (nothing can be done about it), and all but kills 2
  // and 3: the marker is rewritten every 40ms, it closes the whole
  // gap each time, the lerp is down to 52ms, and the lead is set to
  // the tick plus half the lerp so the interpolation LANDS on the
  // player rather than arriving where they were. The harness now
  // measures the RENDERED ball rather than the bookkeeping, which is
  // the number that was always the honest one.
  const LERP_MS = 115;           // how long the smoothing takes to land.
                                // Long enough that the ball glides
                                // rather than teleports, short enough
                                // that it is never far behind.
  const FOLLOW_MS = 60;         // how often the team balls and carried flags
                                // are moved. Lower is smoother but busier.
  const FOLLOW_LEAD = 0.10;    // seconds ahead of the player they aim, on
                                // TOP of the age of the report itself, which
                                // predict() already allows for. It was 0.12
                                // when the easing was slack and the marker
                                // needed throwing forward to keep up; with
                                // the easing tight that same throw overshoots
                                // by a metre, which is just as unreadable as
                                // trailing by one.
                                // 0.08 through v25, nudged to 0.10 in v26.
                                // The lead has to cover the write interval
                                // plus about half the smoothing, and v24
                                // stretched both of those (40/52ms became
                                // 60/115ms) without re-cutting the lead.
                                // This is the dial if it still is not
                                // right: more makes the ball sit further
                                // forward while you run and overshoot
                                // further when you stop dead, less trails.
                                // 0.06/0.08/0.10/0.12 model out at
                                // 0.33/0.21/0.09/0.03m behind at a sprint
                                // against 0.38/0.50/0.62/0.73m past you on
                                // a dead stop. Do not go past 0.14.
  const FOLLOW_EASE = 1.0;      // how much of the remaining gap is closed
                                // every tick. 0.6 in v4-v8, which leaves
                                // 40% of the error standing after each one.
  const FOLLOW_SNAP = 2.5;      // a gap bigger than this is closed outright
                                // rather than eased - a marker should never
                                // be seen travelling across the pitch
  const MARKER_SPHERE = true;   // the team marker is a real sphere, not a
                                // LOW_POLY cube. See markerFor.
  const MARKER_R = 0.18;        // the team ball. 0.2 in v4, 0.24 in v22-v24,
                                // back under both in v25 because the thing
                                // sits in the middle of your own view all
                                // game and the size that reads best from
                                // 200m away is not the size that is
                                // comfortable to play under. 0.36m across.
  const MARKER_Y = 2.35;        // how high over the player it rides.
  // THE MARKER READS THE PROBE IN v26, NOT THE FLOOR.
  // Dinopawnz: "why does the marker go a little far away when im
  // running. id like it to stay relatively close to my character
  // when im running."
  //
  // Because until now the ball was driven by the FLOOR whenever you
  // were standing on one, and the floor reports the PAD, not the
  // metre. Pads are FOOT_PITCH (8m) apart, so while you run the
  // target the ball is chasing sits at a pad centre and only moves
  // when you cross into the next pad - it can be four or five metres
  // off you at the moment it is read, and the 115ms of smoothing
  // spreads that error out into a ball that drifts behind and then
  // hurries to catch up. Standing still it looks perfect, because a
  // stale pad centre is still the pad you are on. See markerAt.
  //
  // The probe does not have this problem: it reports a real
  // continuous position every PROBE_MS, and once calibrated it can
  // be corrected into world coordinates. It was already what the
  // marker rode on in the AIR - it was only ever thrown away on the
  // ground because the floor is the authority for the RULES. But
  // where to draw a ball is not a rules question.
  const MARKER_PROBE = true;    // drive the ball off the probe, on the
                                // ground as well as in the air. false
                                // puts it back on the floor.
  const MARKER_PROBE_TOL = 6.5; // and a sanity check on that: while a
                                // pad has them, the probe's corrected
                                // position must agree with the pad
                                // within this, or it is not trusted and
                                // the floor takes over. Wider than half
                                // a pad, narrower than a bad
                                // calibration. Nothing about the game
                                // reads the probe - tags, halves, jail
                                // and the flag are all still decided by
                                // the floor exactly as before.
  // THE FOOT RING IS OFF IN v22.
  // It was a team-coloured disc on the ground under every player, put
  // there so you could tell teams apart in a scrum where everybody's
  // ball is up above the heads. Dinopawnz: "i dont like the pad under
  // our feet. remove that. i only care about the marker above our
  // heads. the other marker is just annoying."
  //
  // Fair. It was solving a problem the ball had already solved - the
  // ball rides 2.35m up over the head, which reads fine at any
  // range this pitch has - and it sat right where your avatar's feet
  // and its shadow are, which is the one place on a player nothing
  // should be drawn. One marker per player now: the ball, and a flag
  // over it if they are carrying.
  const FOOT_RING = false;
  const FLAG_RIDE = 1.9;        // how high a carried flag rides over its
                                // carrier. Lower than v4's 2.2 so it reads
                                // as ON them rather than over them.
  const LOW_POLY = true;        // In MML a sphere costs about a hundred
                                // cubes and a cylinder a dozen, whatever
                                // size they are drawn at. This swaps a
                                // square for a round one everywhere the
                                // thing is small enough that nobody can
                                // tell - lamp globes, the tops of the
                                // touchline flames, the shield dots round
                                // a carrier's feet. It is most of the
                                // triangle count in this world.
  const DETAIL = true;
  const GALLERY = true;
  const GALLERY_ENDS = [-1, 1];
  const LIGHT = 0.055;          // global dimmer on every light
  const FLOOD = 22;             // each of the eight floodlights
  const FIRE_GLOW = 28;         // each touchline fire

  // --- control ----------------------------------------------
  const CODE = [1, 7, 1, 8];      // start / stop
  const CAGE_CODE = [1, 3, 4, 7]; // typed into a cage's code box
  const CODE_TIMEOUT = 15;
  const TEAM_LOCK = true;         // no switching sides from the countdown
                                  // until the game is stopped or won
  const FINISH_CONSOLE = true;
  const STOP_TWICE = true;

  // kept for the shared arena code
  const HOME_D = 22;

  // ==========================================================
  // GEOMETRY
  // ==========================================================
  const FIELD_W = 96;
  const FIELD_L = 200;
  const ARENA_W = FIELD_W + 40;
  const ARENA_L = FIELD_L + 80;
  const ARENA_H = 56;

  const DECK_Y = 4.3;
  const DECK_L = GALLERY ? ARENA_L - 2 : FIELD_L;
  const DECK_TOP = GALLERY ? DECK_Y : 7.16;
  const DOOR_W = 10;
  const DOOR_H = 9.5;
  const RAIL_H = 1.2;
  const STAIR_X = 58;
  const STAIR_W = 7;
  const STAIR_N = Math.max(6, Math.round(DECK_Y / 0.4));
  const STAIR_RUN = 1.0;

  const LINE_Z = FIELD_L / 2 - HOME_D;   // the two home lines sit at +-LINE_Z
  const CTRL_Z = -126;
  const FIN_CTRL_Z = 126;

  // ==========================================================
  // PALETTE - a night stadium
  // ==========================================================
  const TURF = "#16211a";       // the pitch: near-black green
  const TURF_B = "#1b281f";
  const LINE = "#b3ad9c";       // bone, not bright chalk
  const COLLAR_RED = "#6a141c";
  const STUD = "#8b939b";
  const PAW_INK = "#3d1318";
  const END_BLUE = "#131c36";
  const END_GOLD = "#2e2410";
  const HEAD = "#5c3f27", MUZZLE = "#7b5c3e", BRINDLE = "#2b1b10";
  const CHALK = "#f1f2ea";
  const BRICK = "#1c2230";      // the walls: gunmetal, not red brick
  const BRICK_DK = "#11151e";
  const CONCRETE = "#3b414d";
  const STEEL = "#a3abb2";
  const STEEL_DK = "#2b3034";
  const BOARD = "#1d2b24";      // blackboard green
  const FRAME = "#39404d";      // and its steel frame
  const INK = "#10141a";
  const LAMP = "#e9efff";       // cool stadium white
  const HOME_BLUE = "#2a5bd0";
  const HOME_BLUE_DIM = "#1b3470";
  const HOME_YEL = "#f0b418";
  const HOME_YEL_DIM = "#6e5717";
  const CALL_RED = "#e3262f";
  const CALL_DIM = "#5a1418";
  const WIN_GOLD = "#ffd23f";
  const DOG_FAWN = "#c4935f";
  const DOG_LIGHT = "#ead3b0";
  const DOG_DARK = "#5b3a22";
  const COLLAR = "#c8202c";

  // RED is team -1 and owns the lobby half (z < 0); BLUE is team +1
  // and owns the terrace half. A team's number is also its side.
  const RED = "#e0323c", BLUE = "#2f6bff";
  const RED_DK = "#3a1216", BLUE_DK = "#111c3a";
  const RED_MID = "#7a1c22", BLUE_MID = "#1e3c8a";
  function homeCol(side) { return side < 0 ? RED : BLUE; }
  function homeDark(side) { return side < 0 ? RED_DK : BLUE_DK; }
  function homeMid(side) { return side < 0 ? RED_MID : BLUE_MID; }
  function homeName(side) { return side < 0 ? "RED" : "BLUE"; }

  const arena = document.getElementById("arena");
  const flagRoot = document.getElementById("flags");
  const cageRoot = document.getElementById("cages");
  const markRoot = document.getElementById("marks");

  function el(tag, attrs, parent) {
    const node = document.createElement(tag);
    node.setAttribute("collide", "false");
    for (const key in attrs) {
      let value = attrs[key];
      if (tag === "m-light" && key === "intensity") {
        value = Math.round(value * LIGHT * 10) / 10;
      }
      node.setAttribute(key, value);
    }
    (parent || arena).append(node);
    return node;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function hasGallery(side) {
    return GALLERY && GALLERY_ENDS.indexOf(side) >= 0;
  }

  // four labels round one point, so a word reads from any side
  // a small glowing ball, or a small glowing box that reads as one
  function orb(attrs, parent) {
    if (!LOW_POLY) return el("m-sphere", attrs, parent);
    const r = attrs.radius;
    const b = Object.assign({}, attrs);
    delete b.radius;
    b.width = +(r * 1.6).toFixed(3);
    b.height = +(r * 1.6).toFixed(3);
    b.depth = +(r * 1.6).toFixed(3);
    b.ry = (attrs.ry || 0) + 45;
    return el("m-cube", b, parent);
  }

  function crossLabels(parent, y, text, bg, fg, w, h, fs) {
    const made = [];
    [0, 90, 180, 270].forEach((ry) => {
      const r = ry * Math.PI / 180;
      made.push(el("m-label", {
        x: 0.02 * Math.sin(r), z: 0.02 * Math.cos(r), y: y, ry: ry,
        width: w, height: h, "font-size": fs, alignment: "center",
        color: bg, "font-color": fg, content: text,
      }, parent));
    });
    return made;
  }

  // ==========================================================
  // SHELL
  // ==========================================================
  el("m-cube", {
    y: -2, width: ARENA_W, height: 4, depth: ARENA_L,

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * ARENA_W / 2, y: ARENA_H / 2,

    // two thin lit strips in the team colours, all the way down
    [[18.6, RED], [19.6, BLUE]].forEach(([y, c]) => {

    // steel ribs every 20 m, so the wall reads as structure, not a slab

      x: s * ARENA_W / 2, y: 40,
      width: 2.5, height: 1.8, depth: ARENA_L, color: COLLAR_RED,
    });
    [39.05, 40.95].forEach((y) => {
      el("m-cube", { x: s * ARENA_W / 2, y: y, width: 2.6, height: 0.16, depth: ARENA_L, color: STUD });

  // ==========================================================
  // ROOF AND FLOODLIGHTS
  // ==========================================================
  const CEIL_Y = 54;
  const FLOOD_Y = 40;

  el("m-cube", {
    y: CEIL_Y + 1.4, width: ARENA_W, height: 2, depth: ARENA_L,

  const floods = [];
  [-30, 30].forEach((x) => {

  // ==========================================================
  // END WALLS - two open portals at each end, always open
  // ==========================================================
  const PORTAL_W = 16;
  const PORTAL_H = 20;
  const PORTAL_X = 42;

  function endWall(z, side) {
    const half = ARENA_W / 2;
    const pL = PORTAL_X - PORTAL_W / 2;
    const pR = PORTAL_X + PORTAL_W / 2;

    el("m-cube", {
      x: 0, z: z, y: ARENA_H / 2,
      width: 2 * pL, height: ARENA_H, depth: 2,
      color: BRICK, collide: "true",
    });

    const retW = half - pR;
    const retC = (pR + half) / 2;
    const jambW = (retW - DOOR_W) / 2;
    const doorTop = DECK_Y + DOOR_H;

    [-1, 1].forEach((sx) => {
      const cx = sx * retC;

      if (!hasGallery(side)) {
        el("m-cube", {
          x: cx, z: z, y: ARENA_H / 2,
          width: retW, height: ARENA_H, depth: 2, color: BRICK, collide: "true",
        });
        return;
      }

      el("m-cube", {
        x: cx, z: z, y: DECK_Y / 2,
        width: retW, height: DECK_Y, depth: 2, color: BRICK, collide: "true",

        el("m-cube", {
          x: cx + e * (DOOR_W + jambW) / 2, z: z, y: DECK_Y + DOOR_H / 2,
          width: jambW, height: DOOR_H, depth: 2, color: BRICK, collide: "true",
        });
      });

        x: cx, z: z, y: (doorTop + ARENA_H) / 2,
        width: DOOR_W, height: ARENA_H - doorTop, depth: 2,

      [[1.35, 0], [-1.35, 180]].forEach(([dz, ry]) => {

  // the rules, chalked on a blackboard on the lobby face of the start wall
  el("m-cube", {
    z: -(ARENA_L / 2) - 1.2, y: 5.2, width: 35, height: 8.2, depth: 0.3, color: FRAME,
  });
  el("m-cube", {
    z: -(ARENA_L / 2) - 1.3, y: 5.2, width: 34, height: 7.4, depth: 0.3, color: BOARD,
  });
  // THE BOARD IS WRITTEN FROM THE RULES, NOT FROM MEMORY.
  //
  // Dinopawnz: "the sign outside the building that says the
  // instructions says that when you are tagged, you are caged until
  // you are freed by a teammate. that instruction is wrong. that was
  // an old version."
  //
  // It was wrong, and it had been wrong for a while. The sentence
  // stopped being "until somebody comes for you" when JAIL_MS came
  // down to three seconds and RESCUE went off - there is no plate in
  // the world any more and nobody to free you - and the one surface
  // that TELLS people the rules was left saying the old thing. A

  // So the line is not typed out any more. It is BUILT from the two
  // constants that actually decide it, which is the only way it
  // cannot drift again: change JAIL_MS or turn RESCUE back on and
  // the blackboard changes with them.
  const JAIL_SECS = Math.max(1, Math.round(JAIL_MS / 1000));
  const JAIL_RULE = !JAIL_MS
    ? "TAGGED IN THEIR HALF: CAGED TILL A TEAMMATE FREES YOU."
    : RESCUE
      ? "TAGGED IN THEIR HALF: CAGED " + JAIL_SECS + " SECONDS, OR TILL A TEAMMATE FREES YOU."
      : "TAGGED IN THEIR HALF: CAGED " + JAIL_SECS + " SECONDS, THEN IT LETS YOU OUT.";
  // and the same treatment for the ring, which gained an exception in
  // v39 - see THE RING IS ROUND THE BASE, NOT ON TOP OF IT.
  const GUARD_RULE = !NO_GUARD_R
    ? "THE CARRIER IS ALWAYS TAGGABLE. TAG ANYWHERE IN YOUR OWN HALF."
    : NO_GUARD_ON_PLATFORM
      ? "THE CARRIER IS ALWAYS TAGGABLE. NO GUARDING INSIDE THE RING."
      : "THE CARRIER IS ALWAYS TAGGABLE. NO GUARDING IN THE RING - THE FLAG PLATFORM IS YOURS TO HOLD.";
  [
    [7.5, 2.0, 88, WIN_GOLD, "CAPTURE THE FLAG"],
    [5.6, 1.3, 50, CHALK, "JOIN RED AT THIS END, OR BLUE AT THE FAR END."],
    [4.2, 1.3, 50, CHALK, "GRAB THEIR FLAG. BRING IT TO YOUR OWN STAND."],
    [2.8, 1.3, 50, CALL_RED, JAIL_RULE],
    [1.6, 1.1, 44, WIN_GOLD, GUARD_RULE],
  ].forEach(([y, h, fs, col, text]) => {
    el("m-label", {
      z: -(ARENA_L / 2) - 1.5, y: y, ry: 180,
      width: 32, height: h, "font-size": fs, alignment: "center",
      color: BOARD, "font-color": col, content: text,
    });
  });

  [-1, 1].forEach((s) => {
    [-1, 1].forEach((sz) => {
      el("m-cube", {
        x: s * 30, z: LOBBY_Z + sz * 16,
        y: 0.6, width: 16, height: 1.2, depth: 2.4, color: FRAME, collide: "true",
      });
    });
  });

  // ==========================================================
  // TERRACE
  // ==========================================================
  const TER_D = 40;
  const TER_Z = ARENA_L / 2 + TER_D / 2;

  el("m-cube", {
    z: TER_Z, y: -2, width: ARENA_W, height: 4, depth: TER_D,

  });
  el("m-cube", { z: TER_Z, y: 0.1, width: ARENA_W - 20, height: 0.2, depth: TER_D - 10, color: "#3a3320" });

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * (ARENA_W / 2 + 1.6), z: TER_Z, y: -0.5,
      width: 3.2, height: 1, depth: TER_D, color: CONCRETE, collide: "true",
    });
  });
  el("m-cube", {
    z: ARENA_L / 2 + TER_D + 1.6, y: -0.5,
    width: ARENA_W + 6.4, height: 1, depth: 3.2, color: CONCRETE, collide: "true",
  });

  [-1, 1].forEach((sx) => {
    [-1, 1].forEach((sz) => {
      const x = sx * (ARENA_W / 2 - 4);
      const z = TER_Z + sz * (TER_D / 2 - 4);
      el("m-cube", { x: x, z: z, y: 0.5, width: 4, height: 1, depth: 4, color: CONCRETE, collide: "true" });
      el("m-cylinder", { x: x, z: z, y: 8, radius: 1.3, height: 14, color: BRICK, collide: "true" });
      orb({ x: x, z: z, y: 15.6, radius: 1.5, color: BLUE });
    });
  });

  el("m-light", { z: TER_Z, y: 20, type: "point", intensity: 22, color: LAMP });

  // ==========================================================
  // THE PITCH - red half, blue half
  // ==========================================================
  // Painted in flat layers under the floor pads (pad tops 0.36).
  function paint(tag, top, h, attrs) {
    return el(tag, Object.assign({ y: +(top - h / 2).toFixed(3), height: h }, attrs));
  }
  const FLAG_Z = FIELD_L / 2 - 12;       // each flag stand sits at team * FLAG_Z
  const PITCH_LINE = "#c9c6b8";

  [-1, 1].forEach((t) => {
    const zc = t * FIELD_L / 4;
    paint("m-cube", 0.2, 0.2, { z: zc, width: FIELD_W, depth: FIELD_L / 2, color: homeDark(t) });
    // chevrons pointing at the enemy base, faint
    for (let k = 0; k < 4; k++) {
      const z = t * (18 + k * 16);
      [-1, 1].forEach((sx) => {

    // touchline band in the team colour
