<!--
  THE CUBE
  ============================================================
  v74 - SLOWER SHIFTS, AN EARLIER EXIT.
  * The Cube shifts every 4 minutes (was 3). CHAOS still shifts every
    minute.
  * The exit appears 5 minutes in (was 10) - in CLASSIC and every mode
    that uses the default (BONUS LIFE, ONE LIFE, EVERYONE OUT, CHAOS,
    SHARD HUNT, TRAINING). RACE (open from the start) and SURVIVAL (no
    exit) are unchanged, and the host can still set another time from
    the remote.

  v73 - THE GROUNDS ARE DRESSED.
  * Round the Cube, on its own axes: obsidian monuments at the ends of
    the four diagonal paving rays, ice crystals at the ends of the
    straight ones (split in two at the front so the way to the glass
    lift stays clear), eight ember gardens between the rays, and thin
    obsidian spikes standing round the moat. All of it is ONE model -
    cube_decor.glb (upload it to the Cube repo beside cube_wall.glb) -
    about 50,000 triangles, nothing solid. USE_DECOR = false removes it.
    Nothing else has changed.

  v72 - DEATH BUTTONS WORK.
  * In v71 the button colours BUTTON_DEATH and BUTTON_SPENT were never
    defined. Pressing a DEATH button stopped with an error before the
    room could go off, so it did nothing (and never went dark red). A
    used FREE button also stayed gold instead of going dark, and when
    the game's last free was used the other FREE buttons weren't all
    switched off. Both colours are defined now (next to buildButton);
    nothing else has changed.

  v71 - THE SAW AND THE BULL LOCK YOU IN AGAIN.
  * v69 undone: only spikes, arrows and fire can be escaped. The saw,
    the bull and the crusher slam the doors and catch everyone inside.
    The "locks you in" wall shape means any of those three again.
  * Kept from v69: 5 DEATH button rooms a Shift (DEATH_BUTTON_N).

  v70 - PRESS THE BUTTON AGAIN.
  * Button rooms are back to pressing: walking in is safe, and nothing
    happens until someone clicks the button on the ? post. Then it is
    DEATH (the room goes off and locks in everyone inside) or FREE
    (every cage in the Cube opens). No more OPEN outcome, and the doors
    never lock - pressing is your choice.
  * Each button works ONCE a Shift: DEATH turns it dark red, FREE gold
    then dark. All the FREE anti-spam limits from v67 still apply
    (2 FREE a Shift, 3 frees a game, 90 s cooldown, not wasted when
    nobody is caged).
  * Walking in is safe again, so button rooms' plates read SAFE (even)
    again, like before v67.

  v69 - NEARLY EVERY TRAP CAN BE ESCAPED.
  * Spikes, arrows, fire, the SAW and the BULL are all escapable now:
    no lockdown, nobody marked - get out of the room before the
    warning ends and you live. Only the CRUSHER still slams the doors
    and catches everyone who was inside (ESCAPE_KINDS). The wall shape
    for "locks you in" now only ever means a crusher.
  * Button DEATH rooms still lock you in, but there are only 5 a Shift
    now - 4% of the Cube (DEATH_BUTTON_N, was 10), plus the 2 FREE ones.

  v68 - STAND 3 S ON A HATCH.
  * TRAPDOORS AND LIFTS WAIT (STAND_MS, 3 s). Stepping onto one no
    longer opens it at once. A countdown (3, 2, 1) shows on the tile;
    it goes when at least one player is still standing on it, so a
    group can climb on together - step off before 0 and nothing
    happens. Everyone on it drops / rides up. Clicking is still
    instant.

  v67 - WALK IN AND FIND OUT. BUTTON ROOMS FIRE WHEN YOU ENTER.
  * There is nothing to press any more. The ? post is still in the
    middle of every button room, but the moment a living player walks
    in, the room decides: DEATH (it goes off, like any trap - and it
    re-arms, so it stays deadly for the rest of the Shift) or FREE
    (every cage in the Cube opens). The doors are never locked.
  * Button rooms' plates now read DEADLY (odd) - they can be. The wall
    shape still tells you it is a button room, so the gamble is yours.
    There is always still a plate-safe way from the drop rooms to the
    exit that goes through no button room.
  * FREE CAN'T BE SPAMMED:
      - every FREE room works ONCE, then its button goes dark for good
      - only FREE_PER_SHIFT of the button rooms are FREE (2 a Shift)
      - only FREE_MAX_PER_GAME frees in a whole game (3) - then "THE
        CUBE HAS NO MERCY LEFT" and every button room is DEATH
      - after a free, no other FREE room works for 90 s
        (REVIVE_COOLDOWN_MS) - walk in and it just says RECHARGING
      - a FREE room with nobody to free is not wasted - it waits
      - caged / out players can't set a button room off
      - the per-player life limit (MAX_REVIVES) still stands

  v66 - ROOM TRICKS YOU CAN ACTUALLY SEE.
  * FLICKER now snaps the whole room pitch black and flares it white;
    BLACKOUT hangs a black shell in front of every wall, the floor and
    the ceiling (in front of the hatch panels - they used to hide the
    effect) for 10 s; RED ALARM and FAKE TRAP WARNING pulse the whole
    room red with a strong light; FAKE SHIFT blinks it cyan. The shell
    and light are removed when the trick ends; nothing is solid.

  v65 - SAY HELLO, AND GREEN DOORS.
  * Two more room tricks on the remote: a spinning HELLO sign in the
    middle of the room, overhead ("DINOPAWNZ SAYS HELLO" - HELLO_TEXT),
    for 8 s; and GREEN DOORS - every door into the room glows bright
    green on both sides, to tell players it is safe. Green lasts a
    minute or until the next Shift; pick it again to switch it off.

  v64 - NO MORE ROOMS SHAKING FOREVER.
  * The Shift shake used to give each player's game a looping animation
    and take it away again after 1.5 s - but some games never let go of
    it, so their rooms kept shaking. Now the server shakes the room
    itself, nudging each part 12 times a second, then puts every part
    back where it belongs. There is no animation left to get stuck.

  v63 - THE WALL CODE CHANGES EVERY SHIFT.
  * The wall shapes no longer give traps away on their own. Each Shift,
    one shape means "a trap you can back out of", another "a trap that
    locks you in", another "a button room" - and safe rooms show random
    decoy shapes (even the trap ones). Only together with the plate do
    the walls tell you anything, and the code is reshuffled at every
    Shift. Nobody is told. Outside (two lines) and sealed (bars) stay
    fixed.
  * The chevrons pointing to the exit are off (EXIT_CHEVRONS = true
    brings them back).

  v62 - THE WALLS TALK.
  * The shape on each wall now tells you about the room BEHIND that
    wall: one line = safe; a cross = a trap you can back out of
    (spikes, arrows, fire); a diamond = a trap that locks you in (saw,
    crusher, bull); three dots = a button room; two lines = the outside;
    bars = a sealed door. Chevrons high on one wall point the way to
    the exit's room. Redrawn at every Shift. Nobody is told.
  * The ceiling light keeps its shape all game, so rooms still have a
    landmark.

  v61 - THE TRAPDOOR SWINGS DOWN.
  * The trapdoor no longer slides sideways at all. It is hinged on its
    wall-side edge and swings DOWN into the room below like a real
    trapdoor, then swings back up to close. (Still not solid the moment
    it opens, so you drop straight through.) The lift still comes up
    through the same hole - the open trapdoor hangs just clear of it.

  v60 - THE TRAPDOOR DROPS YOU STRAIGHT DOWN.
  * The trapdoor cover used to slide sideways while still solid, so it
    dragged whoever stood on it off to the side. Now it stops being
    solid the moment it opens - you drop straight through the hole -
    and only then slides away. It turns solid again once it has slid
    back shut.

  v59 - STEP ON THE LIFT TILE AND IT TAKES YOU UP.
  * Walk onto the lift tile and it rises, just as if you had clicked
    it (read the plate on the ceiling first!). Same rules as clicking:
    not while a trap has the room locked or before a button room's
    button is pressed. It takes a fresh step - riding it back down
    does not send you straight up again. Clicking still works;
    TOUCH_DOORS = false turns this off with the doors and trapdoors.

  v58 - NO SLAB UNDER THE LIFT TILE AT ALL.
  * The solid slab under the lift's metal skin is now 2 cm thin and a
    touch smaller, hidden inside the metal hatch - nothing pale can show
    under or round it. Riders stand on the see-through sheet on top of
    the metal, which moves with the lift.

  v57 - THE LIFT TILE IS ONLY METAL.
  * The plain slab under the lift tile's metal skin (its pale edges
    showed) is now see-through; the metal hatch is the full size and
    thickness of the tile. The slab is still there and still solid -
    it is what carries you up.

  v56 - ROOM TRICKS FROM THE REMOTE.
  * Click any room on the remote's map and mess with it: FLICKER (4 s of
    a dying bulb), BLACKOUT (10 s dark, then it stutters back), RED
    ALARM (4 s, no trap), SHAKE, FAKE TRAP WARNING (a real trap's
    warning, then nothing), CONFETTI, FAKE SHIFT (the Shift flash and
    shake, nothing changes). Harmless: no real trap is touched, and a
    room whose real alarm is going is left alone.

  v55 - THE LIFT TILE IS METAL TOO.
  * The lift tile (the square in a room's floor that carries you up to
    the room above) wears the same metal hatch as the doors and
    trapdoors, instead of a plain dark slab. A see-through sheet on top
    of it feels who is standing on it, so riders are still carried.

  v54 - STAND ON A TRAPDOOR AND IT OPENS.
  * Step onto a trapdoor in the floor and it slides open - you drop
    into the room below (read its plate first). Like the doors it takes
    a fresh step, and a locked one stays shut. Clicking still works;
    TOUCH_DOORS = false turns this off too.
  * Trapdoors now wear the same metal hatch as the doors (cube_door.glb
    laid flat) instead of a plain grey slab.

  v53 - SHARD HUNT (a new game mode - Classic is unchanged).
  * 5 glowing shards (7 in the 7 x 7 x 7 Cube) hide in safe rooms. Walk
    into a room with one and you carry it - a count floats over your
    head. When the players carry all of them between them, the exit
    opens at once and the walls say which floor it is on.
  * Get caught and your shards fall in that room (a trap room - brave
    it to get them back). At every Shift the loose shards move to new
    safe rooms. Never found? The exit still opens at its usual time.
  * Endless lives, freed by friends, like Classic. Pick it on the
    remote or with host code 1739. The remote's map shows the shards.

  v52 - PICK WHEN THE EXIT APPEARS.
  * On the remote: the exit appears after 1, 2, 3, 5, 7, 10, 15 or 20
    minutes (or the mode's default, 10). It takes effect straight away,
    in a running game too (unless the exit is already open), and stays
    for later games until you change it. RACE (exit open from the
    start) and SURVIVAL (no exit) keep their own rule.

  v51 - CLASSIC AND RESCUE SWAPPED.
  * CLASSIC now has endless lives: you are never DEAD, but a cage only
    opens when a friend runs into it (or the FREE button, or the host).
  * RESCUE is renamed BONUS LIFE (host code 1732) and is now the old
    Classic: two lives - caught once a friend can free you, caught
    twice you are DEAD.
  * The other modes are unchanged.

  v50 - THE WALL PANELS STAY IN FRONT.
  * The Shift shake used to slide everything in the room 3.5 cm each
    way - including the hatch panels INTO their own walls, and a panel
    only sits 4 mm in front of its wall. Where a viewer left a panel at
    the far end of the shake, the plain coloured wall showed in front
    of it from then on. Now every part only slides ALONG its own wall,
    floor or ceiling, never towards it, and when the shake stops every
    position is written back again.

  v49 - ESCAPING DOESN'T END THE GAME.
  * CLASSIC (and every mode but RACE): the round keeps going when
    somebody gets out. It ends when nobody is left inside, or when
    time runs out. RACE is still "first one out wins".
  * A gold WINNER sign appears over a player's head the moment they
    step out through the exit, and follows them. It stays for the rest
    of the game AND after it ends, until the next game starts (or the
    host resets). SURVIVAL's winners get it too.
  * EVERYONE OUT is now: once the exit is opened, it stays open.

  v48 - GAME MODES. Pick one on the remote (or type 1731-1738 at the
  host console); it is used from the next game on, and the lobby
  screens say which mode is next.
    1731 CLASSIC       endless lives - but only a friend running into
                       your cage (or the FREE button, or the host) frees
                       you; every escape wins (v51)
    1732 BONUS LIFE    two lives: caught once you can be freed, caught
                       twice you are DEAD (v51 - this was RESCUE)
    1733 ONE LIFE      caught once and you are DEAD
    1734 EVERYONE OUT  once the exit is opened it stays open (v49)
    1735 RACE          the exit is open from the start; 10-minute game;
                       the first one out wins and ends it
    1736 CHAOS         the Cube shifts every minute, 65% of rooms are traps
    1737 SURVIVAL      no exit (it never opens, and its plate has no
                       tell); with 2+ players the last one alive wins, and
                       whoever is alive when the 20 minutes run out wins
    1739 SHARD HUNT    (v53) find the shards and the exit opens early
    1738 TRAINING      every trap is escapable with a 2.5 s warning;
                       caught players are back in 8 s later; the game
                       doesn't end when everyone is caught

  v47 - WALK INTO A DOOR AND IT OPENS.
  * Touch a door and it opens, just as if you had clicked it (a locked
    door shudders, a brick door shows its brick). Each door has a
    see-through mat in its doorway, right up against it, and the door
    itself listens for bumps too.
  * It takes a fresh touch: a door that has just shut does not bounce
    back open for 1.2 s, and leaning on it does not hold it open - step
    back and walk into it again. Clicking still works. TOUCH_DOORS =
    false turns it off.
  * Trapdoors and lifts are unchanged - still clicked.

  v46 - A FAIR SHIFT.
  * SHIFT GRACE: whoever is standing in a room when the Cube shifts is
    safe in THAT room for 10 s (SHIFT_GRACE_MS). A trap the Shift put
    there waits, a dot room waits, a timer can't catch them. That is
    the time to read the new plates and get out if the room turned
    deadly. Step into another room and the grace is gone; walking
    into a trap room still sets it off as usual (anyone graced in
    there is still spared until their 10 s run out).
  * THE ROOM SHAKES at a Shift: everything you see in the room
    judders for 1.5 s and grit rains from the ceiling. Only the look
    moves - the solid walls and floor stay still, so nobody is pushed.
  * The Shift flash is the original one again (the seams round the
    ceiling blink cyan and white) - the extra cyan bands are gone, the
    shake does the job.

  v45 - GOTCHA YOU CAN SEE.
  * A fake-out's GOTCHA! words now hang 30 cm off each wall (they sat
    5 cm off it, where the hatch panel skin could cover them), bigger,
    on a gold frame - and a spinning GOTCHA! sign appears in the middle
    of the room as well, which no wall skin can hide.

  v44 - THE HOST REMOTE (cube_remote.html).
  * A hidden remote board lets cube_remote.html run the game from a
    browser tab, the way the Sky Dragon remote flies the dragon. It
    unlocks with REMOTE_PIN (1718). Nothing is visible or solid.
  * From the remote: start, drop now, end, back to lobby, CONTINUE a
    game that has ended (everyone who played is back in), Shift now,
    trap test, free everyone, +/- 5 minutes, exit in 10 s, open the
    exit, move the exit.
  * Test modes: NO GAME OVER (it never ends by itself), GOD MODE
    (traps catch nobody), AUTO-FREE (caught players come back 5 s
    later without using a life).
  * Per player: watch, free (no life used, works on DEAD too), give
    back their spare life, god mode, cage them, set off their room,
    make their room safe until the next Shift.
  * While a remote is unlocked the board carries the game state
    (clock, players, a map of every room and what it is, the watched
    player's doors) - nothing is sent while no remote is connected.

  v41 - ONLY THE HOST STARTS A GAME.
  * Stepping on a glowing square no longer starts the countdown
    (AUTO_START = false). Only the host code 1718 does, before the
    first game and after every game ends.
  * THE EXIT'S TELL. The exit door's plate is always a palindrome -
    it reads the same both ways (262, 484, 808) - and still even, so
    it fits the code. No other plate in the Cube is ever a
    palindrome. It gets a new palindrome every Shift. Nothing is
    written about it anywhere: players have to notice it themselves,
    which lets the sharp ones find the exit before it opens at 10:00
    and wait by it.
  * ESCAPABLE TRAPS (v42). Not every trap is a death sentence any
    more. Kinds in ESCAPE_KINDS (SPIKES, ARROWS and FIRE) do NOT lock the
    doors and do NOT mark anybody. They give the usual warning
    (ESCAPE_WARN_MS, 1.5 s) and only catch whoever is still in the
    room when they hit - so you can step in, see it start, and step
    straight back out. SAW, CRUSHER and BULL still lock you in.
    The doors stay as they are: if the one you came in by has shut,
    you have to click it open again inside the warning to get out.
    (ESCAPE_OPEN_DOORS = true would swing them all open instead.)
  * FAKE-OUTS FOLLOW THE SAME RULES (v42). A fake-out showing the
    spike, arrow or fire warning no longer locks the doors - they can
    be clicked open, exactly like the real thing. (Before, a spike warning
    with locked doors gave the fake away.) Fake saw, crusher and bull
    warnings still lock the doors, like the real ones.
  * NO MORE SLAM DOORS (v42, SLAM_FRAC = 0). Every door between rooms
    stays open for 8 seconds.
    These traps look exactly as they always did - only the rules
    changed.
  * A VAGUER HINT. The lobby no longer says the safe path is even.
    The only hint is now EVEN THE NUMBERS KNOW THE WAY. - it reads as
    "even" in the everyday sense, but the word is there for anyone who
    looks twice. It says nothing about adding digits or the exit's
    palindrome.

  v40 - TWO LIVES. DIE TWICE AND YOU ARE DEAD.
  * First death: OUT over your head, a red cage - a friend who runs
    into your cage frees you (or the FREE button does).
  * Second death: DEAD over your head, a dark cage with DEAD on its
    sides. Nobody can free you - not by touch, not the FREE button.
    (MAX_REVIVES = 1, was 2.) Only the host code 1347 still can.
  * The lobby screens count ALIVE / OUT / DEAD / ESCAPED.
  So every rescue costs the rescued player their spare life, and
  every rescuer risks theirs.

  v39 - NO HIDING IN A TRAP ROOM. A trap room only went off when
  somebody WALKED IN. So if you were already inside when it re-armed
  (6 s after it went off), or your landing/rescue protection ran out
  while you stood in one, or the floor missed the moment you arrived
  (falling through a trapdoor), you could stand in a corner of a
  deadly room forever. Now the Cube checks every tick: an armed trap
  room with an unprotected living player in it goes off (INSTANT) or
  starts its timer (TIMER), exactly as if they had just walked in.

  v38 - WALK OUT ANY OUTSIDE DOOR ONCE THE GAME IS OVER. The moment a
  round ends, every door to the outside - on every floor - opens and
  its brick disappears, so anyone left inside can walk straight out
  (upper floors drop down the side of the Cube to the ground). They
  stay open until the next countdown starts, then the brick is back.
  The glass lift at the front takes people back up to the lobby.
  The wall banners say so: GAME OVER (with the reason) and then NO
  GAME RUNNING - WALK OUT ANY OUTSIDE DOOR, TAKE THE GLASS LIFT UP.
  Before, the exit was the only way out, and if the round ended before
  it opened (10:00) everybody was stuck inside.

  v37 - SHIFTS ARE A SECRET (SHIFT_SECRET = true). Nothing tells the
  players a Shift is coming or has happened - not the room walls, not
  the lobby screens (no countdown, no NEXT SHIFT timer, no "the Cube
  has shifted" message). They have to notice for themselves that the
  numbers and colours changed. The only sign left is the short cyan
  flash in occupied rooms at the moment it happens (SHIFT_FLASH =
  false removes that too). SHIFT_SECRET = false brings v36's warnings
  back.

  v36 - PLAYERS ARE WARNED ABOUT SHIFTS, INSIDE THE CUBE. The warning
  used to be on the lobby screens only. Now every room somebody is in
  (or next to):
  * for the last 10 s before a Shift shows THE CUBE SHIFTS IN 10...9...
    on all four walls, with EVERY NUMBER WILL CHANGE under it (the
    count turns red for the last 3);
  * at the Shift, flashes cyan and white for 2 s and shows THE CUBE
    HAS SHIFTED - CHECK EVERY NUMBER AGAIN for 6 s (SHIFTED_SHOW_MS).
  Rooms in the middle of a trap alarm keep their red alarm instead of
  the flash. A host Shift (1720) gets the same treatment.

  v35 - A NEW CODE: EVEN OR ODD. The maths was too hard. Now every
  door, trapdoor and lift shows ONE 3-digit number. Add its digits:
  EVEN total = the room behind it is safe, ODD = a trap.
    473 -> 4+7+3 = 14, even, safe.   582 -> 15, odd, trap.
  Players are NOT told the rule. The lobby screens only show the
  riddle (RIDDLE): THE SAFE PATH IS EVEN. COUNT EVERY STEP.
  * The exit reads even like any other safe door - no special clue.
    (The old "adds up to 1000" clue is gone.)
  * Lonely and crowded rooms read odd (they can kill). Fake-outs read
    even (they never hurt anyone). Sealed doors read odd. Brick doors
    to the outside read even.
  * Every Shift still changes every number. The room numbers on the
    floors stay, but only as labels - the code doesn't use them.

  v34 - RUN INTO A CAGE TO FREE YOUR FRIEND. SMALLER CAGES.
  * No more rescue plates in the floor (RESCUE_N = 0) - the room
    number is never covered.
  * To free a caged player, an ALIVE player runs right into their
    cage. The moment you're pressed up against it (the floor reports
    you within TOUCH_R of the middle), the cage lifts away and your
    friend is back in the game with 6 s of protection.
  * THE RISK is the room: a cage sits in the room that caught them,
    and a trap room re-arms 6 s after it goes off and stays deadly
    until the Shift. Walk into an INSTANT room to save someone and it
    goes off on you; a TIMER room gives you 5-15 s; a LONELY room
    goes off if you're the only one alive in there for 3 s.
  * A cage can't be freed for the first 2.5 s (TOUCH_GRACE_MS), so
    someone standing next to their friend when the trap hits can't
    undo the death in the same moment.
  * The two-comebacks limit still stands: a cage whose player has
    used both goes dark red and can't be freed by touch (host code
    1347 and the FREE button still work).
  * SMALLER CAGES: the red glass is 0.5 m out (was 0.6), the
    forcefield closes to 0.65 m with 0.3 m walls (was 0.85 / 0.6), so
    a rescuer can get right up to the prisoner. If avatars jitter
    against the walls, raise FIELD_A to 0.72.

  v33 - THE END OF A GAME IS IMPOSSIBLE TO MISS. The moment a round
  ends, inside the Cube:
  * GAME OVER over EVERYONE'S head (escapers get ESCAPED), in red,
    in place of OUT, for OVER_SHOW_MS (30 s).
  * Every room anyone is in or next to flashes gold for 4 s, and a big
    spinning GAME OVER sign hangs in the middle of the room, just
    above head height, with the reason under it.
  * The wall banners say GAME OVER + the reason for the whole 30 s
    (they used to switch to NO GAME RUNNING after 6 s).
  * The doors open, as before.
  After the 30 s: signs and tags go, the banners say NO GAME RUNNING -
  HEAD UP TO THE LOBBY.

  v32 - OUT MEANS OUT, AND IT SAYS SO. RELEASE CODE 1347.
  * Everyone who is out has OUT floating over their head - in a cage
    or not - until they are brought back (rescue plate, FREE button,
    host release) or the next game starts.
  * The host release code is 1347 (was 1722). Click a cage, type it,
    and that player is BACK IN THE GAME - alive, 6 s of protection,
    OUT tag gone. (Before, the code only opened the cage and left them
    out, so traps ignored them and the game looked broken.) A host
    release does not use up one of their MAX_REVIVES.
  * The E-to-interact experiment (v28-v31) is gone - Otherside did
    not respond to it. Doors, trapdoors and lifts are click only.

  v29 - YOU CAN SEE WHEN THE GAME IS OVER, FROM INSIDE THE CUBE.
  "The rooms stopped trapping us" was the game ENDING: once nobody
  alive is left in the Cube (everyone caged - or out), or someone
  escapes, the round ends, every trap switches off, the doors open
  and 10 s later every cage opens. All of that was only ever said on
  the lobby screens, so inside the Cube it just looked broken.
  Now every room somebody is in (or next to) shows a banner on all
  four walls, high up, whenever no round is running:
    GAME OVER + why (EVERYONE IS OUT / X ESCAPED THE CUBE / ...)
    NO GAME RUNNING - HEAD UP TO THE LOBBY
    NEW GAME STARTING - GET TO THE LOBBY
  The banners go the moment a new round drops in.

  v27 - KODABALL'S FORCEFIELD INSIDE EVERY CAGE.
  The red glass is only the look now (not solid). What holds you is
  KodaBall v25's forcefield, built inside the same cage:
  * Six invisible walls, 0.6 m thick, that go down into the floor (no
    gap under them), and an invisible lid at 2.5 m (jumping does
    nothing).
  * It LANDS WIDE (1.6 m out) and CLOSES onto you in small steps
    (0.15 m every 30 ms). A wall never appears on top of you and
    shoves you out - a closing wall pushes you IN, to the middle.
    That was v26's weak spot: a small cage slammed down beside a
    moving player could knock them straight out of it.
  * Once closed it DOES NOT MOVE because of anything you do inside
    it. Leaning or bouncing on it cannot drag it anywhere.
  * It only re-lands on you if the floor reports - a real step, sent
    at least 0.6 s after it last moved - that you are clearly outside
    (0.5 m past the wall). Then it lands wide on you and closes again.
    No more killing the old cage and dropping a new one.
  * Nobody else gets shut in: while a field closes, a wall passing
    through another player switches off until it is past them (for
    another prisoner, always; for a free player, 0.8 s in total per
    cage, so a friend can't hold a gap open as a door).
  * A player let out with the host code STAYS out (v26 would have
    caged them again on their next step) and wears the OUT tag.
  The rule was already right, KodaBall-style: being out is a flag on
  the player, the cage is only there to hold them.

  v26 - CAGES THAT HOLD, AND AN OUT TAG WHEN THEY DON'T.
  * Why people were walking out: the game only hears where you are

  // trapdoor that has just shut ignores you for a moment, and a locked
  // one (a trap going off, an unpressed button) stays shut.
  function touchHatch(V, p) {
    if (!TOUCH_DOORS || !p || V.state !== "closed") return;
    if (p.room !== V.b) return;                                  // only from above, standing on it
    if (Date.now() - (V.shutAt || 0) < DOOR_TOUCH_COOLDOWN_MS) return;
    standArm(V, "hatch");                           // v68: opens in STAND_MS if someone is still on it
  }
  // v68: who is standing on a trapdoor (felt by its lid or its sensor sheet)
  function hatchFeel(V, src, p, kind) {
    if (!V.onHatch) V.onHatch = new Map();
    let set = V.onHatch.get(p.id);
    if (kind === "end") {
      if (set) { set.delete(src); if (!set.size) V.onHatch.delete(p.id); }
      standCheck(V);
      return;
    }
    if (!set) { set = new Set(); V.onHatch.set(p.id, set); }
    set.add(src);
    if (kind === "start") touchHatch(V, p);
  }
  // v68: STAND ON IT FOR STAND_MS. The first step starts a 3-2-1 on the
  // tile; it goes when it reaches 0 if anyone is still standing on it
  // (from the right room), and stops if everyone steps off first.
  function standers(V, kind) {
    const out = [];
    if (kind === "hatch") { if (V.onHatch) V.onHatch.forEach((_, id) => { const q = players.get(id); if (q && q.room === V.b) out.push(q); }); }
    else V.riders.forEach((id) => { const q = players.get(id); if (q && q.room === V.a) out.push(q); });
    return out;
  }
  function standStop(V) {
    if (V.standT) { clearInterval(V.standT); V.standT = null; }
    if (V.standL) { kill(V.standL); V.standL = null; }
    V.standKind = null;
  }
  function standCheck(V) { if (V.standKind && !standers(V, V.standKind).length) standStop(V); }
  function standArm(V, kind) {
    if (!STAND_MS) { const q = standers(V, kind)[0]; if (q) (kind === "hatch" ? clickHatch : callLift)(V, q); return; }
    if (V.standKind) return;                        // already counting - you just joined in
    V.standKind = kind;
    const y = kind === "hatch" ? RS * V.k + 0.26 : FY(V.k - 1) + 0.26;   // just above the sensor sheet each stands on
    V.standL = label(world, "", { x: V.hx, y: y, z: V.hz, rx: -90, width: 0.9, height: 0.9, color: "#07080a", "font-color": GOLD, collide: "false" }, 1);
    const ends = Date.now() + STAND_MS;
    const step = () => {
      if (V.state !== "closed" || V.locks || state === "OVER") { standStop(V); return; }
      const on = standers(V, kind);
      if (!on.length) { standStop(V); return; }
      const left = Math.ceil((ends - Date.now()) / 1000);
      if (left > 0) { setText(V.standL, String(left)); setFont(V.standL, left === 1 ? DANGER : GOLD); return; }
      standStop(V);
      if (kind === "hatch") clickHatch(V, on[0]); else callLift(V, on[0]);
    };
    step();
    V.standT = setInterval(safe(step), 100);
  }
  // v54: the trapdoor wears the same metal hatch as the doors (cube_door.glb,
  // laid flat), while someone is in one of its rooms or next door. The
  // skin would swallow footsteps in Otherside (v24), so a see-through
  // sensor sheet sits on top of it and does the feeling.
  function hatchSkin(V, on) {
    if (on) {
      if (V.skin) return;
      const HS = HOLE + 0.1;
      const skin = el("m-model", { src: DOOR_URL, rx: -90, y: 0.15, sx: HS / 1.7, sy: HS / 2.45, sz: 0.5, collide: "false" }, V.pc);
      const sheet = box(V.pc, 0, 0.207, 0, HS, 0.012, HS, "#000000", { collide: V.state === "closed" ? "true" : "false", opacity: 0 });
      sheet._sol = V.state === "closed";
      listen(sheet, V.hx, V.hz, (p, kind, x, z) => {
        if (kind !== "end") stepIn(p, V.b, x, FY(V.k), z);
        hatchFeel(V, "sheet", p, kind);                // v68
      });
      onClick([skin, sheet], (p) => clickHatch(V, p));
      // v55: the lift tile in the room below wears the same metal hatch
      // v57: the skin is the whole tile now - same size and thickness as the (see-through) solid slab
      const lskin = el("m-model", { src: DOOR_URL, rx: -90, y: 0, sx: LIFT / 1.7, sy: LIFT / 2.45, sz: 1, collide: "false" }, V.lift);
      const lsheet = box(V.lift, 0, 0.107, 0, LIFT, 0.012, LIFT, "#000000", { collide: "true", opacity: 0 });
      listen(lsheet, V.hx, V.hz, (p, kind, x, z) => liftFeel(V, "sheet", p, kind, x, z));
      onClick([lskin, lsheet], (p) => callLift(V, p));
      V.skin = [skin, sheet, lskin, lsheet];
      return;
    }
    if (!V.skin) return;
    if ((rooms[V.a] && rooms[V.a].dressed) || (rooms[V.b] && rooms[V.b].dressed)) return;
    V.skin.forEach(kill); V.skin = null;
    V.riderSrc.forEach((set, id) => { set.delete("sheet"); if (!set.size) { V.riderSrc.delete(id); V.riders.delete(id); } });
    if (V.onHatch) V.onHatch.forEach((set, id) => { set.delete("sheet"); if (!set.size) V.onHatch.delete(id); });   // v68
    standCheck(V);
  }
  function clickHatch(V, p) {
    if (!p || V.state !== "closed" || state === "OVER" || V.locks) return;
    if (buttonLocked(p.room) && (p.room === V.a || p.room === V.b)) return;   // v16
    if (p.room === V.a || p.room === V.b) watchOpening(p, p.room, p.room === V.a ? V.b : V.a, HATCH_MIN_OPEN_MS + 300);
    standStop(V);                                   // v68
    V.state = "open"; coverSet(V, true);
    V.t = later(() => { coverSet(V, false); V.state = "closed"; }, HATCH_MIN_OPEN_MS);
  }
  function callLift(V, p) {
    if (!p || V.state !== "closed" || state === "OVER" || V.locks) return;
    if (buttonLocked(p.room) && (p.room === V.a || p.room === V.b)) return;   // v16
    if (p.room === V.a) watchOpening(p, V.a, V.b, COVER_LERP_MS + LIFT_MS + LIFT_TOP_MS + 300);
    standStop(V);                                   // v68
    V.state = "lift"; coverSet(V, true);
    const top = FY(V.k) - 0.1, bottom = FY(V.k - 1) + 0.1;
    V.t = later(() => {
      put(V.lift, "y", top);
      V.t = later(() => {
        V.up = true;
        liftCarry(V, V.b, FY(V.k));
        V.t = later(() => {
          V.up = false;
          liftCarry(V, V.a, FY(V.k - 1) + 0.2);
          put(V.lift, "y", bottom);
          V.t = later(() => { coverSet(V, false); V.state = "closed"; }, LIFT_MS + 100);
        }, LIFT_TOP_MS);
      }, LIFT_MS);
    }, COVER_LERP_MS + 50);
  }

  // ==========================================================
  // THE SHELL - dark, with glowing seams. Only the knocked-out and
  // the winners ever see it.
  // ==========================================================
  FACES.forEach((F) => {
    const nx = F.n[0] !== 0;
    const nAcross = nx ? NZ : NX, CU = nx ? CZ : CX, SHC = nx ? SHCX : SHCZ, SHO = nx ? SHOX : SHOZ;
    const halfU = nx ? HZ : HX;
    // each row of rooms: one long strip above the doorways, and a piece between each pair of doorways
    const holesU = Array.from({ length: nAcross }, (_, j) => [CU(j) - DW / 2, CU(j) + DW / 2]);
    const low = 0.3 + DH;
    const sh = (u0, u1, y0, y1) => box(world, nx ? F.n[0] * SHC : (u0 + u1) / 2, (y0 + y1) / 2, nx ? (u0 + u1) / 2 : F.n[2] * SHC,
      nx ? 0.3 : u1 - u0, y1 - y0, nx ? u1 - u0 : 0.3, SHELL, SOLID);
    for (let iy = 0; iy < NY; iy++) {
      const y0 = RS * iy;
      sh(-halfU, halfU, y0 + low, y0 + RS);
      gaps(-halfU, halfU, holesU).forEach((g_) => sh(g_[0], g_[1], y0, y0 + low));
    }
    // seams on the outside: along every row and column of rooms
    for (let j = 1; j < nAcross; j++) {
      const u = -halfU + RS * j;
      box(world, nx ? F.n[0] * (SHO + 0.03) : u, TOPY / 2, nx ? u : F.n[2] * (SHO + 0.03), nx ? 0.03 : 0.08, TOPY, nx ? 0.08 : 0.03, OUT_GLOW);
    }
    for (let j = 1; j < NY; j++) {
      const w = 2 * (nx ? SHOZ : SHOX);
      box(world, nx ? F.n[0] * (SHO + 0.03) : 0, RS * j, nx ? 0 : F.n[2] * (SHO + 0.03), nx ? 0.03 : w, 0.08, nx ? w : 0.03, OUT_GLOW);
    }
    // v15: one hatch panel over every room on this face, facing out
    for (let iy = 0; iy < NY; iy++) for (let j = 0; j < nAcross; j++) {
      const u = CU(j), y = RS * iy + RS / 2, d = SHO + 0.02;
      el("m-model", { src: TILE_URL, x: nx ? F.n[0] * d : u, y: y, z: nx ? u : F.n[2] * d, ry: F.ry + 180, collide: "false" });
    }
  });
  [-1, 1].forEach((sx) => [-1, 1].forEach((sz) => box(world, sx * (HX + 0.225), (TOPY - 0.45) / 2, sz * (HZ + 0.225), 0.45, TOPY + 0.45, 0.45, SHELL, SOLID)));
  box(world, 0, -0.3, 0, 2 * SHOX, 0.3, 2 * SHOZ, SHELL, SOLID);

  // ==========================================================
  // THE GROUND - an ALIVE player who steps onto it is out
  // ==========================================================
  const ground = box(world, 0, GROUND_Y - 0.05, 0, 120, 0.1, 120, GROUND, SOLID);
  listen(ground, 0, 0, (p, kind, x, z) => {
    if (kind === "end") return;
    stepIn(p, null, x, GROUND_Y, z);
    if (p.alive && (state === "RUN" || state === "DROP")) knockout(p, "LEFT THE CUBE");
  });

  // ==========================================================
  // THE LOBBY - a sealed hall on top of the Cube
  // ==========================================================
  const LOBBY_H = 9;
  {
    const hs = rooms.filter((R) => R.drop).map((R) => [R.cx - PAD / 2, R.cx + PAD / 2, R.cz - PAD / 2, R.cz + PAD / 2]);
    const holesX = [];
    hs.forEach((h) => { if (!holesX.some((x) => x[0] === h[0])) holesX.push([h[0], h[1]]); });
    holesX.sort((a, b) => a[0] - b[0]);
    const strip = (x0, x1, z0, z1) => {
      const n = box(world, (x0 + x1) / 2, LY - 0.15, (z0 + z1) / 2, x1 - x0, 0.3, z1 - z0, "#1b1e24", SOLID);
      listen(n, (x0 + x1) / 2, (z0 + z1) / 2, (p, kind, x, z) => { if (kind !== "end") stepIn(p, null, x, LY, z); });
    };
    gaps(-LHX, LHX, holesX).forEach((gx) => strip(gx[0], gx[1], -LHZ, LHZ));
    holesX.forEach((hx) => {
      const hz = hs.filter((h) => h[0] === hx[0]).map((h) => [h[2], h[3]]).sort((a, b) => a[0] - b[0]);
      gaps(-LHZ, LHZ, hz).forEach((gz) => strip(hx[0], hx[1], gz[0], gz[1]));
    });
  }
  // the drop squares, over the DROP_TILES rooms only
  for (let iz = 0; iz < NZ; iz++) for (let ix = 0; ix < NX; ix++) {
    if (!rooms[RI(ix, NY - 1, iz)].drop) continue;
    const i = pads.length;
    const node = box(world, CX(ix), LY - 0.15, CZ(iz), PAD - 0.04, 0.3, PAD - 0.04, PAD_IDLE, SOLID);
    const rim = box(world, CX(ix), LY + 0.005, CZ(iz), PAD + 0.2, 0.01, PAD + 0.2, SEAM);
    pads.push({ node: node, rim: rim, room: RI(ix, NY - 1, iz) });
    listen(node, CX(ix), CZ(iz), (p, kind, x, z) => {
      if (kind === "end") { if (p.pad === i) p.pad = null; return; }

  }
  // walls and roof; the front wall has a glass gate to the lift

  [-1, 1].forEach((s) => {

  {
    const w = LHX + 0.2 - GATE_W / 2;

  // four giant screens, one on each wall

  [[0, -(LHZ - 0.01), 0], [0, LHZ - 0.01, 180], [-(LHX - 0.01), 0, 90], [LHX - 0.01, 0, -90]].forEach((w) => {
    const g = group({ x: w[0], y: LY, z: w[1], ry: w[2] });
    box(g, 0, 6.1, -0.05, 16, 4.6, 0.06, "#050608");
    box(g, 0, 8.45, -0.04, 16, 0.06, 0.06, SEAM);
    box(g, 0, 3.75, -0.04, 16, 0.06, 0.06, SEAM);

      label(g, "", { y: 7.4, z: 0.01, width: 15, height: 1.6, color: "#050608", "font-color": INK }, 22),
      label(g, "", { y: 6.2, z: 0.01, width: 15, height: 0.7, color: "#050608", "font-color": SEAM }, 48),
      label(g, "", { y: 5.2, z: 0.01, width: 15, height: 0.7, color: "#050608", "font-color": GOLD }, 48),
      label(g, "", { y: 4.3, z: 0.01, width: 15, height: 0.6, color: "#050608", "font-color": INK }, 48),
    ]);
  });
  // the floating countdown in the middle
  const counters = [];
  {
    const g = group({ y: LY + 5.5 });
    anim(g, "ry", 0, 360, 24000);
    box(g, 0, 0, 0, 4.6, 1.8, 4.6, "#050608", { opacity: 0.85 });
    [0, 90, 180, 270].forEach((a) => {
      const s = group({ ry: a }, g);

  }

  // ==========================================================
  // THE OUTSIDE (v12) - a monument, not a box
  // ==========================================================
  // Only the winners, the knocked-out and anyone riding the glass lift

  {

    // a box laid on the outside of a face: u along the face, y up, out = how far proud
    const onFace = (F, u, y, w, h, out, col, o) => {
      const f = face(F), d = f.half + out / 2;
      return box(world, f.nx ? f.s * d : u, y, f.nx ? u : f.s * d, f.nx ? out : w, h, f.nx ? w : out, col, o);
    };
    FACES.forEach((F) => {
      const f = face(F);
      // (v15: the portals round the outside doors are gone - the hatch panels cover the walls)
      // a glowing stud where every row and column of rooms meets
      for (let j = 0; j <= (f.nx ? NZ : NX); j++) for (let k = 1; k < NY; k++)
        onFace(F, -f.span + RS * j, RS * k, 0.34, 0.34, 0.1, OUT_GLOW, f.nx ? { rx: 45 } : { rz: 45 });
      // (v15: no crown or foot band - they covered the panels)
    });

    [-1, 1].forEach((a) => [-1, 1].forEach((b) => {
      box(world, a * (OX + 0.08), TOPY / 2, b * (OZ + 0.08), 0.5, TOPY, 0.5, TRIM);
      box(world, a * (OX + 0.34), TOPY / 2, b * (OZ + 0.34), 0.06, TOPY - 1.6, 0.06, OUT_GLOW);

    // the lobby hall: fins down every wall, a cornice, and the name

    [-1, 1].forEach((s) => {
      for (let x = -LHX + 1.5; x <= LHX - 1.4; x += 3) {
        if (s > 0 && Math.abs(x) < GATE_W / 2 + 0.8) continue;           // leave the gate clear
        box(world, x, LB, s * (LHZ + 0.35), 0.28, LOBBY_H - 0.6, 0.5, TRIM);
        box(world, x, LB, s * (LHZ + 0.61), 0.05, LOBBY_H - 1.4, 0.03, OUT_GLOW);
      }
      for (let z = -LHZ + 1.5; z <= LHZ - 1.4; z += 3) {
        box(world, s * (LHX + 0.35), LB, z, 0.5, LOBBY_H - 0.6, 0.28, TRIM);
        box(world, s * (LHX + 0.61), LB, z, 0.03, LOBBY_H - 1.4, 0.05, OUT_GLOW);
      }
      box(world, s * (LHX + 0.4), LY + LOBBY_H + 0.35, 0, 0.9, 0.5, 2 * LHZ + 1.7, TRIM);
      box(world, 0, LY + LOBBY_H + 0.35, s * (LHZ + 0.4), 2 * LHX + 1.7, 0.5, 0.9, TRIM);
      box(world, s * (LHX + 0.86), LY + LOBBY_H + 0.1, 0, 0.04, 0.06, 2 * LHZ + 1.7, OUT_GLOW);
      box(world, 0, LY + LOBBY_H + 0.1, s * (LHZ + 0.86), 2 * LHX + 1.7, 0.06, 0.04, OUT_GLOW);
    });
    [[0, LHZ + 0.72, 0], [0, -(LHZ + 0.72), 180], [LHX + 0.72, 0, 90], [-(LHX + 0.72), 0, -90]].forEach((w) => {
      const g = group({ x: w[0], y: LY + 6.6, z: w[1], ry: w[2] });
      box(g, 0, 0, -0.03, 15, 2.6, 0.04, "#07080a");
      label(g, "THE CUBE", { width: 14, height: 2.2, color: "#07080a", "font-color": OUT_GLOW }, 8);
    });
    // a low stone plinth, a moat of still dark water with light
    // rippling in it, and paving that runs away from the Cube
    const PL = Math.max(OX, OZ) + 3.5, MO = PL + 4;
    box(world, 0, (GROUND_Y + -0.45) / 2, 0, 2 * PL, -0.45 - GROUND_Y, 2 * PL, STONE, SOLID);
    [-1, 1].forEach((s) => {
      box(world, s * PL, -0.45, 0, 0.12, 0.04, 2 * PL, OUT_GLOW);
      box(world, 0, -0.45, s * PL, 2 * PL, 0.04, 0.12, OUT_GLOW);
    });
    const gap = RLW / 2 + 1;                                      // a causeway to the glass lift
    const water = (x0, x1, z0, z1) => box(world, (x0 + x1) / 2, GROUND_Y + 0.006, (z0 + z1) / 2, x1 - x0, 0.01, z1 - z0, WATER, { opacity: 0.9 });
    water(-MO, MO, -MO, -PL); water(-MO, -PL, -PL, PL); water(PL, MO, -PL, PL);
    water(-MO, -gap, PL, MO); water(gap, MO, PL, MO);
    for (let i = 0; i < 14; i++) {
      const s = i % 4, t = rand(-MO + 1, MO - 1), d = rand(PL + 0.8, MO - 0.8);
      const x = s === 0 ? d : s === 1 ? -d : t, z = s === 2 ? d : s === 3 ? -d : t;
      if (s === 2 && Math.abs(x) < gap) continue;
      const r = box(world, x, GROUND_Y + 0.013, z, s < 2 ? 0.05 : 1.6, 0.005, s < 2 ? 1.6 : 0.05, OUT_GLOW, { opacity: 0.2 });
      anim(r, "opacity", 0.05, 0.5, 1800 + i * 230, true);
    }
    [-1, 1].forEach((s) => {

  // ==========================================================

  // ==========================================================
  // PLATES, NUMBERS AND THE SHIFT
  // ==========================================================
  // v35: one 3-digit number whose digits add up EVEN (safe) or ODD (deadly)
  // v41: THE EXIT'S TELL. The exit's plate is always a palindrome
  // (reads the same both ways: 262, 484, 808) and still even. No other
  // plate in the Cube is ever a palindrome. Nobody is told.
  function isPal(n) { const t = String(n); return t[0] === t[2]; }
  function palNum() {
    const a = rint(1, 9), b = 2 * rint(0, 4);          // a b a: digits add to 2a + b, even when b is even
    return "" + a + b + a;
  }
  function plateNum(deadly, exit) {
    if (exit) return palNum();
    for (;;) {
      const n = rint(100, 999);
      if (isPal(n)) continue;                           // v41: palindromes belong to the exit alone
      const sum = Math.floor(n / 100) + Math.floor(n / 10) % 10 + n % 10;
      if ((sum % 2 === 1) === !!deadly) return String(n);
    }
  }
  // v70: walking into a button room is safe again, so its plates read safe
  function deadlyRoom(r) { const T = traps[r]; return !!(T && T.trap); }
  function writePlates(R) {
    if (R.dressed && R.decor) buildSigns(R);             // v62: the signs follow the plates
    const t = R.txt;
    R.face.forEach((D, k) => {
      if (D.kind === "door" && D.sealed) t.face[k] = plateNum(true);                     // it will not open: it reads deadly
      else if (D.kind === "door") t.face[k] = plateNum(deadlyRoom(D.a === R.i ? D.b : D.a));
      else t.face[k] = plateNum(false, D === exitDoor && !curMode.survival);   // v48: no exit, no tell, in SURVIVAL                                  // outside: brick or the exit, both even (v41: the exit's is a palindrome)
    });
    if (R.iy > 0) t.trap = plateNum(deadlyRoom(RI(R.ix, R.iy - 1, R.iz)));
    if (R.iy < NY - 1) t.lift = plateNum(deadlyRoom(RI(R.ix, R.iy + 1, R.iz)));
    showText(R);
  }
  function showText(R) {
    const L = R.labels;
    if (!L) return;
    setText(L.num, String(R.num));
    L.face.forEach((n, k) => setText(n, R.txt.face[k]));
    if (L.trap) setText(L.trap, R.txt.trap);
    if (L.lift) setText(L.lift, R.txt.lift);
  }
  // ==========================================================
  // DRESSING A ROOM - its look and its writing appear when somebody
  // is in it or next door, and go when they leave
  // ==========================================================
  function dress(R) {
    if (R.dressed) return;
    R.dressed = true;
    const g = R.g, fq = qOf(R.iy), cq = qOf(R.iy + 1);
    buildLooks(R, g, !R.drop);
    const L = R.labels = { all: [], face: [], trap: null, lift: null };
    const mk = (o, chars) => { const n = label(g, "", o, chars); L.all.push(n); return n; };
    L.num = mk({ y: -IN + 0.02, rx: -90, width: 1.5, height: 1.1 }, 3);
    FACES.forEach((F) => {
      const nx = F.n[0] !== 0;
      L.face.push(mk({ x: nx ? F.n[0] * (IN - 0.01) : 0, y: -IN + DH + 0.3, z: nx ? 0 : F.n[2] * (IN - 0.01), ry: F.ry, width: 1.7, height: 0.34 }, 5));
    });
    if (R.iy > 0) L.trap = mk({ x: fq * Q, y: -IN + 0.02, z: fq * 0.55, rx: -90, width: 1.4, height: 0.3 }, 5);
    if (R.iy < NY - 1) L.lift = mk({ x: cq * Q, y: -IN + 0.02, z: cq * 0.55, rx: -90, width: 1.4, height: 0.3 }, 5);
    // v20: the hatch panel on each wall, just in front of it (behind the
    // plates, patterns and seams, which all still show)
    R.panels = FACES.map((F) => el("m-model", { src: WALL_URL, x: F.n[0] * (IN - 0.004), y: 0, z: F.n[2] * (IN - 0.004), ry: F.ry, collide: "false" }, g));
    // v23: floor and ceiling. Just proud of the real floor, which still
    // does all the sensing - the panels are not solid.
    const plain = (y, rx) => el("m-model", { src: TILE_URL, y: y, rx: rx, sx: 0.9, sy: 0.9, collide: "false" }, g);
    const holed_ = (y, rx, ry) => { const h = group({ ry: ry }, g); el("m-model", { src: FLOOR_URL, y: y, rx: rx, collide: "false" }, h); return h; };
    R.panels.push(R.iy === 0 ? plain(-IN + 0.004, -90) : holed_(-IN + 0.004, -90, fq > 0 ? 0 : 180));
    // v24: the floor panel swallows footsteps in Otherside, so an
    // invisible sensor sheet sits just on top of it and does the
    // listening (same hole as the real floor, same maths)
    const sHole = R.iy > 0 ? [fq * Q - HOLE / 2, fq * Q + HOLE / 2, fq * Q - HOLE / 2, fq * Q + HOLE / 2] : null;
    rects(-IN, IN, -IN, IN, sHole).forEach((r) => {
      const uc = (r[0] + r[1]) / 2, vc = (r[2] + r[3]) / 2;
      const s = box(g, uc, -IN + 0.008, vc, r[1] - r[0], 0.012, r[3] - r[2], "#000000", { collide: "true", opacity: 0 });
      listen(s, R.cx + uc, R.cz + vc, (p, kind, x, z) => { if (kind !== "end") stepIn(p, R.i, x, FY(R.iy), z); });
      R.panels.push(s);
    });
    if (R.iy < NY - 1) R.panels.push(holed_(IN - 0.004, 90, cq > 0 ? -90 : 90));
    else if (!R.drop) R.panels.push(plain(IN - 0.004, 90));
    // v47: a see-through mat in every doorway, right up against the
    // door - step onto it (which you can only do by walking into the
    // door) and the door opens. It also keeps track of where you are.
    R.mats = [];
    if (TOUCH_DOORS) R.face.forEach((D, k) => {
      const F = FACES[k], nx = F.n[0] !== 0, d0 = IN - 0.2, d1 = IN + 0.18, dc = (d0 + d1) / 2;
      const mx = nx ? F.n[0] * dc : 0, mz = nx ? 0 : F.n[2] * dc;
      const m = box(g, mx, -IN + 0.02, mz, nx ? d1 - d0 : DW - 0.1, 0.012, nx ? DW - 0.1 : d1 - d0, "#000000", { collide: "true", opacity: 0 });
      listen(m, R.cx + mx, R.cz + mz, (p, kind, x, z) => {
        if (kind === "end") return;
        stepIn(p, R.i, x, FY(R.iy), z);
        if (kind === "start") touchDoor(D, p);
      });
      R.panels.push(m); R.mats[k] = m;
    });
    R.face.forEach((D) => doorSkin(D, true));
    verts.forEach((V) => { if (V.a === R.i || V.b === R.i) hatchSkin(V, true); });   // v54
    paint(R);
    showText(R);
  }
  // v23: a door wears its skin while either room it joins is dressed
  function doorSkin(D, on) {
    if (on) {
      if (D.skinM) return;
      const nx = FACES[D.f].n[0] !== 0;
      D.skinM = el("m-model", { src: DOOR_URL, ry: nx ? 90 : 0, sx: 1.02, sy: 1.02, sz: 1.25, collide: "false" }, D.g);
      // v24: the skin sits in front of the door and takes the click
      onClick([D.skinM], (p) => clickDoor(D, p));
      return;
    }
    if (!D.skinM) return;
    if ((rooms[D.a] && rooms[D.a].dressed) || (D.b !== null && rooms[D.b] && rooms[D.b].dressed)) return;
    kill(D.skinM); D.skinM = null;
  }
  function undress(R) {
    if (!R.dressed) return;
    R.dressed = false;
    R.decor.forEach(kill); R.decor = [];
    R.lamps.forEach(kill); R.lamps = [];
    (R.panels || []).forEach(kill); R.panels = [];
    R.face.forEach((D) => doorSkin(D, false));
    verts.forEach((V) => { if (V.a === R.i || V.b === R.i) hatchSkin(V, false); });   // v54
    if (R.labels) R.labels.all.forEach(kill);
    R.labels = null;
  }
  // v9: THE ONE WAY OUT. The exit is a door at the TOP of a corner
  // column of rooms - the SHAFT. Every side door of the shaft above
  // the ground floor is sealed, and the top room has a solid ceiling,
  // so the only way into it is through the shaft's bottom room on the
  // ground floor and up its lifts, one floor at a time. From the drop
  // rooms that is all the way down to the ground floor, across it,
  // and all the way back up.
  let shaft = [];                          // room indices, bottom to top
  function chooseExit() {

    rooms.forEach((R) => { if (near.has(R.i)) dress(R); else undress(R); });
    bannersTick();
    rooms.forEach((R) => { if (R.labels) setFont(R.labels.num, countIn(R.i) > 0 ? PALETTE[R.pal].glow : "#6a6a6a"); });
    rooms.forEach((R) => {
      const on = want.has(R.i);
      if (on && !R.light) {
        R.light = el("m-light", { type: "point", y: IN - 0.6, intensity: ROOM_LIGHT, distance: 9, color: "#ffffff", "cast-shadows": "false" }, R.g);
        R.light._col = "#ffffff";
      } else if (!on && R.light) { kill(R.light); R.light = null; }
    });
  }
  // v29: when no round is running, every dressed room says so on its walls
  const showingOver = () => (state === "OVER" || state === "WAIT") && Date.now() < overUntil;
  // v36: what the walls say - kind (a new kind rebuilds the banners, the
  // same kind just updates the words), title, line under it, title colour
  const SHIFTED_SHOW_MS = 6000;
  const SHIFT_SECRET = true;         // v37: never tell players about Shifts
  const SHIFT_FLASH = true;          // v37: ...but flash the rooms when one happens
  let shiftedUntil = 0;
  function bannerText() {
    const now = Date.now();
    if (state === "RUN" && shardMsg && now < shardMsgUntil) return { kind: "shard", t: shardMsg, col: "#5ff7ff" };   // v53
    if (state === "COUNT") return { kind: "count", t: ["NEW GAME STARTING", "GET TO THE LOBBY"], col: GOLD };
    if (showingOver()) return { kind: "over", t: ["GAME OVER", endWhy || "THE ROUND HAS ENDED"], col: DANGER };
    if (state === "OVER" || state === "WAIT") return { kind: "idle", t: ["NO GAME RUNNING", outsideOpen ? "WALK OUT ANY OUTSIDE DOOR - TAKE THE GLASS LIFT UP" : "HEAD UP TO THE LOBBY"], col: GOLD };
    if (state === "RUN" && !timeUpAt && !SHIFT_SECRET) {
      if (now < shiftedUntil) return { kind: "shifted", t: ["THE CUBE HAS SHIFTED", "CHECK EVERY NUMBER AGAIN"], col: SEAM };
      const toShift = tShift - now;
      if (toShift > 0 && toShift <= SHIFT_WARN_MS) {
        const sec = Math.ceil(toShift / 1000);
        return { kind: "shiftwarn", t: ["THE CUBE SHIFTS IN " + sec, "EVERY NUMBER WILL CHANGE"], col: sec <= 3 ? DANGER : GOLD };
      }
    }
    return null;
  }
  // v36: the rooms flash cyan and white for 2 s at a Shift (not a room
  // that is in the middle of a trap alarm)
  // v46: THE ROOM SHAKES. Everything you see in the room - the wall,
  // floor and ceiling panels, the patterns, lamps, seams, plates and
  // numbers - judders for SHAKE_MS while grit rains from the ceiling.
  // Only the look moves: the solid walls and floor stay put, so nobody
  // is pushed about or dropped through anything.
  const SHAKE_MS = 1500;
  function shakeRoom(R) {
    if (R.shaking) return;
    R.shaking = true;
    const parts = [].concat(R.panels || [], R.decor || [], R.lamps || [], R.seams || [], R.labels ? R.labels.all : []);
    const moved = [];
    const num = (n, k) => +(n.getAttribute(k) || 0);
    parts.forEach((n) => {
      if (!n || !n.parentNode || n.getAttribute("collide") === "true") return;   // never move anything solid (the floor sensors, the doorway mats)
      // v50: only ever slide a part ALONG its own wall, floor or ceiling -
      // never towards it, or it ends up behind the lining
      const kid = n.tagName === "M-GROUP" && n.firstElementChild ? n.firstElementChild : null;
      const at = (k) => num(n, k) + (kid ? num(kid, k) : 0);
      const near = (k) => Math.abs(at(k)) > IN - 0.4;
      const axes = ["x", "y", "z"].filter((k) => !near(k) && !(kid && k === "y"));
      axes.slice(0, 2).forEach((k) => moved.push({ n: n, k: k, b: num(n, k), a: k === "y" ? 0.02 : 0.03 }));
    });
    // v64: THE SERVER SHAKES IT, a jolt at a time. It used to hand each
    // player's game a looping animation and then remove it - and some
    // players' games never let go of a removed animation, so their rooms
    // shook forever. Now there is no animation to let go of: the server
    // nudges each part to a new spot 12 times a second, then puts it back.
    const fx = group({}, R.g);
    for (let i = 0; i < 16; i++) {
      const d = box(fx, rand(-IN + 0.3, IN - 0.3), IN - 0.05, rand(-IN + 0.3, IN - 0.3), 0.07, 0.07, 0.07, i % 2 ? "#8a8a80" : "#5f5f58");
      oneShot(d, "y,rx", rint(700, 1100), "easeInQuad", { y: -IN + 0.04, rx: rint(90, 360) }, rint(40, 700));
    }
    let flip = 1;
    const jolt = setInterval(safe(() => {
      flip = -flip;
      moved.forEach((m) => { if (m.n.parentNode) put(m.n, m.k, m.b + flip * m.a * (0.5 + Math.random() * 0.5)); });
    }), 85);
    later(() => {
      clearInterval(jolt);
      moved.forEach((m) => { if (m.n.parentNode) put(m.n, m.k, m.b + 0.001); });   // a hair off first, so the reset really is sent
      later(() => moved.forEach((m) => { if (m.n.parentNode) put(m.n, m.k, m.b); }), 150);
      kill(fx); R.shaking = false;
    }, SHAKE_MS);
  }
  function shiftFlash(R) {
    shakeRoom(R);                                // v46
    if (R.strobe) return;
    let k = 0;
    R.strobe = setInterval(safe(() => {
      k++;
      R.seams.forEach((n) => setColor(n, k % 2 ? "#ffffff" : SEAM));
      if (R.light) setColor(R.light, k % 2 ? SEAM : "#ffffff");
      if (k >= 10) alarm(R, false);
    }), 200);
  }
  // v33: the rooms flash gold for 4 s when a round ends
  function endFlash(R) {
    if (R.strobe) { clearInterval(R.strobe); R.strobe = null; }
    let k = 0;
    R.strobe = setInterval(safe(() => {
      k++;
      R.seams.forEach((n) => setColor(n, k % 2 ? "#3a2a00" : GOLD));
      if (R.light) setColor(R.light, k % 2 ? "#ffffff" : GOLD);
      if (k >= 16) alarm(R, false);            // back to normal
    }), 250);
  }
  function bannersTick() {
    const B = bannerText();
    const key = B ? B.kind : "";
    const bt = B ? B.t : null;
    rooms.forEach((R) => {
      const want = key && R.dressed;
      if (R.banner && (!want || R.banner.key !== key)) { kill(R.banner.g); R.banner = null; }
      if (!want) return;
      if (R.banner) {                          // same kind: just update the words
        R.banner.titles.forEach((n) => { setText(n, bt[0]); setFont(n, B.col); });
        R.banner.subs.forEach((n) => setText(n, bt[1]));
        return;
      }
      const g = group({}, R.g);
      const titles = [], subs = [];
      // v33: while GAME OVER shows, a big spinning sign in the middle of the room
      if (showingOver()) {
        const c = group({ y: -IN + 2.35 }, g);
        anim(c, "ry", 0, 360, 9000);
        box(c, 0, 0, 0, 2.0, 0.8, 2.0, "#07080a");
        [0, 90, 180, 270].forEach((a) => {
          const f = group({ ry: a }, c);
          label(f, "GAME OVER", { y: 0.12, z: 1.01, width: 1.9, height: 0.45, color: "#07080a", "font-color": DANGER }, 9);
          label(f, bt[1], { y: -0.22, z: 1.01, width: 1.9, height: 0.2, color: "#07080a", "font-color": INK }, 30);
          label(f, "WALK OUT ANY OUTSIDE DOOR", { y: -0.36, z: 1.01, width: 1.9, height: 0.14, color: "#07080a", "font-color": GOLD }, 26);
        });
      }
      FACES.forEach((F) => {
        const nx = F.n[0] !== 0;
        const o = { x: nx ? F.n[0] * (IN - 0.014) : 0, z: nx ? 0 : F.n[2] * (IN - 0.014), ry: F.ry };
        const tl = label(g, bt[0], withO({ y: IN - 0.9, width: 3.4, height: 0.55, color: "#07080a", "font-color": B.col }, o), Math.max(17, bt[0].length + 1));
        tl._txt = bt[0]; tl._fc = B.col; titles.push(tl);
        const sl = label(g, bt[1], withO({ y: IN - 1.4, width: 3.4, height: 0.32, color: "#07080a", "font-color": INK }, o), Math.max(30, bt[1].length + 1));
        sl._txt = bt[1]; subs.push(sl);
      });
      R.banner = { g: g, key: key, titles: titles, subs: subs };
    });
  }
  function showScreens(now) {
    let alive = 0, out = 0, dead = 0, won = 0;
    players.forEach((p) => {
      if (p.alive) alive++;
      if (p.out) { if ((p.revives || 0) >= MAX_REVIVES) dead++; else out++; }   // v40: DEAD = no lives left
      if (p.won) won++;
    });
    let L, big, bigCol = INK;
    if (state === "WAIT") {
      const NM = MODES[nextModeKey];
      L = ["WAITING FOR THE HOST", "MODE: " + NM.name + " - " + NM.blurb,
        lastEvent || RIDDLE, "WHEN IT STARTS, STAND ON A GLOWING SQUARE TO PLAY"];
      big = "WAITING";
    } else if (state === "COUNT") {
      const s = Math.max(0, Math.ceil((tCount - now) / 1000));
      L = ["THE FLOOR DROPS IN " + s, "STAND ON A GLOWING SQUARE TO PLAY - STAY OFF TO WATCH", "MODE: " + curMode.name + " - " + curMode.blurb, RIDDLE];
      big = String(s); bigCol = s <= 3 ? PAD_RED : INK;
    } else if (state === "DROP") {
      L = ["GOOD LUCK", curMode.survival ? "THERE IS NO WAY OUT - LAST ONE STANDING WINS" : "ONE DOOR LEADS OUT. EVERY OTHER DOOR TO THE OUTSIDE IS BRICK.", "MODE: " + curMode.name, RIDDLE];
      big = "GOOD LUCK";
    } else if (state === "RUN") {
      const toShift = tShift - now;
      const warn = !SHIFT_SECRET && toShift <= SHIFT_WARN_MS;      // v37
      L = [warn ? "THE CUBE SHIFTS IN " + Math.max(0, Math.ceil(toShift / 1000)) : curMode.name + "     ALIVE " + alive + (curMode.shards && shards.length ? "     SHARDS " + shardHeld() + "/" + shards.length : ""),
        "TIME LEFT " + mmss(tStart + GAME_MS - now) + (SHIFT_SECRET ? "" : "     NEXT SHIFT " + mmss(toShift))
          + (exitOpen || !isFinite(EXIT_OPENS_MS) ? "" : "     EXIT OPENS " + mmss(tStart + EXIT_OPENS_MS - now)), lastEvent,
        "ALIVE " + alive + "     OUT " + out + "     DEAD " + dead + "     ESCAPED " + won];
      big = mmss(tStart + GAME_MS - now);
      if (warn) bigCol = PAD_RED;
    } else {
      L = ["GAME OVER", "ESCAPED " + won + "     OUT " + out + "     DEAD " + dead, lastEvent, ""];
      big = "OVER";
    }
    screens.forEach((s) => { s.forEach((n, i) => setText(n, L[i] || "")); setFont(s[0], bigCol); });
    counters.forEach((n) => { setText(n, big); setFont(n, bigCol); });
    // the squares: pulse during the countdown, red for the last 3
    let pc = PAD_IDLE;
    if (state === "COUNT") {
      const s = (tCount - now) / 1000;
      pc = s <= 3 ? (Math.floor(now / 250) % 2 ? PAD_RED : "#5a0a0a") : (Math.floor(now / 500) % 2 ? PAD_HOT : PAD_IDLE);
    }
    pads.forEach((pd) => { setColor(pd.node, pc); setColor(pd.rim, state === "COUNT" ? pc : SEAM); });
  }

  // ==========================================================
  // START UP
  // ==========================================================
  chooseExit();
  newLayout(true);
  closeAll();
  setInterval(safe(tick), TICK_MS);
</script>
