  // ==========================================================
  // LIFE AND DEATH
  // ==========================================================
  let phase = "LOBBY";     // LOBBY | MUSTER | DELVE | CLEARED
  let phaseAt = Date.now(), musterEnds = 0, delveAt = 0, clearedAt = 0;
  let note = "", noteUntil = 0;
  function say(text, ms) { note = text; noteUntil = Date.now() + (ms || 4000); }

  function present(p) { return p.pads > 0 || Date.now() - p.t < GHOST_MS; }
  function fresh(p) { return Date.now() - p.t < GHOST_MS; }
  // heard from just now - or standing still on a pad that never said
  // goodbye (a player who doesn't move may not report for a while)
  function live(p, ms) {
    const age = Date.now() - p.t;
    return age < (ms || 1500) || (p.pads > 0 && age < GHOST_MS);
  }
  // can a monster hurt this person right now?
  function hittable(p) {
    if (p.state !== "free") return false;
    const now = Date.now();
    if (now < p.safeUntil) return false;
    if (now - p.t > GHOST_MS) return false;
    if (!p.pads && now - p.t > AIR_HIT_MS) return false;   // off the floor and not seen for a while: gone
    return true;
  }
  // can a monster see this person (to chase them)?
  function targetable(p) { return p.state === "free" && fresh(p) && present(p); }

  // ==========================================================
  // CAGES (Kingdom Clash v6.16 cages, with no tagger)
  // ==========================================================
  const CAGE_POOL_N = 100;      // v44/v47: 100+ players - a wipe comes at 70% caged, so 100 covers 140 people (was 48; v44-v46 120)
  const CAGE_A = 0.9, CAGE_T = 0.5, CAGE_LAND_A = 2.4, CAGE_STEP = 0.3;   // v24: 0.3 every 60 ms (was 0.15 / 30) - same speed, half the traffic
  const CAGE_STEP_MS = 60, CAGE_GUARD_MS = 120, CAGE_SINK = 0.6, CAGE_H = 3.2;
  const CAGE_CHASES = 12, CAGE_SETTLE_MS = 600;
  // v15 (Kodaball v25): thrown ahead of a runner, and re-landed ahead
  const CAGE_LEAD_S = 0.15;    // seconds of travel a cage is thrown ahead
  const CAGE_CHASE_LEAD = 0.3; // ...and when it re-lands on an escaper
  const CAGE_SLACK = 0.5;      // metres past the wall that count as out
  const LEAD_MAX = 4.0;        // most a position is ever led by speed
  const AVATAR_R = 0.4, CAGE_GAP_MAX = 400;
  const cagePool = [];
  for (let i = 0; i < CAGE_POOL_N; i++) {
    const g = group({ y: PARK }, cageRoot);
    const walls = [[0, 1], [0, -1], [1, 0], [-1, 0]].map(([ax, az]) => ({
      ax: ax, az: az, on: true,
      node: box(g, 0, (CAGE_H - CAGE_SINK) / 2, 0, 1, CAGE_H + CAGE_SINK, 1, CAGE_COL, { opacity: 0.32, collide: "true" }),
    }));
    const posts = [[1, 1], [1, -1], [-1, 1], [-1, -1]].map(([ax, az]) => ({
      ax: ax, az: az, node: box(g, 0, CAGE_H / 2, 0, 0.2, CAGE_H + 0.2, 0.2, IRON_LT),
    }));
    const lid = box(g, 0, CAGE_H + 0.15, 0, 1, 0.3, 1, IRON, { collide: "true" });
    const lamp = box(g, 0, CAGE_H + 0.75, 0, 0.6, 0.6, 0.6, GOLD, { ry: 45, rx: 45 });
    const sign = label(g, { y: CAGE_H + 1.7, width: 3.2, height: 0.75, color: INK, "font-color": CHALK, content: "CAGED" });
    cagePool.push({ g: g, walls: walls, posts: posts, lid: lid, lamp: lamp, sign: sign,
      a: 0, busy: false, who: null, at: 0, x: 0, z: 0, y: 0, gapMs: 0, guardAt: 0, landedAt: 0, chases: 0, lastT: 0 });
  }
  function sizeCage(c, A) {
    c.a = A;
    const len = 2 * A + CAGE_T + 0.1;
    c.walls.forEach((w) => {
      set(w.node, "x", w.ax * A); set(w.node, "z", w.az * A);
      set(w.node, "width", w.ax ? CAGE_T : len);
      set(w.node, "depth", w.az ? CAGE_T : len);
    });
    c.posts.forEach((q) => { set(q.node, "x", q.ax * A); set(q.node, "z", q.az * A); });
    set(c.lid, "width", len + 0.3); set(c.lid, "depth", len + 0.3);
  }
  function wallOn(w, yes) {
    if (w.on === yes) return;
    w.on = yes;
    set(w.node, "collide", yes ? "true" : "false");
  }
  // NOBODY BUT THE PRISONER IS SHUT IN: a wall with anybody else in it
  // (or a closing wall sweeping over them) lets them through
  function cageGuard(c) {
    const closing = c.a > CAGE_A + 0.001;
    const now = Date.now();
    const dt = c.guardAt ? now - c.guardAt : 0;
    c.guardAt = now;
    if (c.gapOthers) c.gapMs += dt;
    const budget = c.gapMs < CAGE_GAP_MAX;
    const hi = c.a + CAGE_T / 2 + AVATAR_R;
    const lo = c.a - CAGE_T / 2 - AVATAR_R - (closing ? CAGE_STEP + 0.1 : 0.05);
    const near = [];
    players.forEach((q) => {
      // anybody the floor says is standing here counts - even dead still
      if (q.id === c.who || !fresh(q) || (!q.pads && now - q.t > 1500)) return;
      if (Math.abs(q.y - c.y) > 3) return;
      const dx = q.x - c.x, dz = q.z - c.z;
      if (Math.abs(dx) > hi + 0.5 || Math.abs(dz) > hi + 0.5) return;
      const inside = Math.abs(dx) < c.a + CAGE_T / 2 && Math.abs(dz) < c.a + CAGE_T / 2;
      if (!closing && !inside) return;
      let best = 0, bestA = -Infinity;
      c.walls.forEach((w, k) => { const al = dx * w.ax + dz * w.az; if (al > bestA) { bestA = al; best = k; } });
      near.push({ dx: dx, dz: dz, inside: inside, best: best });
    });
    let others = false;
    c.walls.forEach((w, wk) => {
      let off = false;
      near.forEach((n) => {
        if (!n.inside && !budget) return;
        const along = n.dx * w.ax + n.dz * w.az;
        const side = Math.abs(n.dx * w.az - n.dz * w.ax);
        if (side > hi) return;
        let hit = along > lo && along < hi;
        if (!hit && n.inside && wk === n.best) hit = true;
        if (hit) { off = true; if (!n.inside) others = true; }
      });
      wallOn(w, !off);
    });
    c.gapOthers = others;
  }
  function cageClose() {
    const now = Date.now();
    cagePool.forEach((c) => {
      if (!c.busy) return;
      const p = players.get(c.who);
      // THE CAGE DOES NOT GIVE UP, AND IT DOES NOT GET PUSHED (Kodaball
      // v25). It re-lands only when the floor reports - a new, real
      // position, sent after it last moved - that the prisoner is
      // clearly outside it. Leaning on a wall can never do that.
      if (p && c.chases < CAGE_CHASES && p.t !== c.lastT
          && p.t > c.landedAt + CAGE_SETTLE_MS && now - p.t < 500) {
        c.lastT = p.t;
        const out = c.a + CAGE_T / 2 + CAGE_SLACK;
        if (Math.abs(p.x - c.x) > out || Math.abs(p.z - c.z) > out) {
          c.chases++;
          const at = predict(p, CAGE_CHASE_LEAD);
          landCage(c, at.x, at.z, Math.max(0, p.y - 0.2));
          p.cx = c.x; p.cz = c.z; p.cy = c.y;
          return;
        }
      }
      // CLOSING: one small step at a time, towards the middle, walls on
      const closing = c.a > CAGE_A + 0.001;
      if (closing) sizeCage(c, Math.max(CAGE_A, c.a - CAGE_STEP));
      if (closing || now - c.guardAt >= CAGE_GUARD_MS) cageGuard(c);
    });
  }
  function takeCage() {
    for (let i = 0; i < cagePool.length; i++) if (!cagePool[i].busy) return cagePool[i];
    let oldest = cagePool[0];
    for (let i = 1; i < cagePool.length; i++) if (cagePool[i].at < oldest.at) oldest = cagePool[i];
    const p = oldest.who != null ? players.get(oldest.who) : null;
    if (p) releaseCage(p);
    return oldest.busy ? null : oldest;
  }
  function releaseCage(p, safe, hp) {
    if (!p) return;
    if (p.cage) {
      const c = p.cage;
      park(c.g);
      c.busy = false; c.who = null;
      p.cage = null;
    }
    if (p.state === "caged") {
      p.state = "free";
      p.safeUntil = Date.now() + (safe === 0 ? 0 : SAFE_MS);
      p.guard = Math.max(1, Math.ceil(maxGuard(p.cls) * (hp == null ? 0 : hp)));
      p.shown = "";
    }
  }
  // WHERE A RUNNER IS NOW (Kodaball's predict): the floor's last spot,
  // carried on by their speed for as long ago as that report was, plus
  // `ahead` seconds. Somebody not reported for a while is standing still.
  function predict(p, ahead) {
    const raw = (Date.now() - p.t) / 1000;
    if (raw > 0.45) return { x: p.x, z: p.z };
    let dx = p.vx * (raw + (ahead || 0)), dz = p.vz * (raw + (ahead || 0));
    const m = hyp(dx, dz);
    if (m > LEAD_MAX) { dx *= LEAD_MAX / m; dz *= LEAD_MAX / m; }
    return { x: p.x + dx, z: p.z + dz };
  }
  // lands wide with its walls already solid, then closes in
  function landCage(c, x, z, y) {
    c.x = x; c.z = z; c.y = y;
    c.gapMs = 0; c.guardAt = 0; c.gapOthers = false;
    c.landedAt = Date.now();
    sizeCage(c, CAGE_LAND_A);
    set(c.g, "x", x); set(c.g, "y", y); set(c.g, "z", z);
    c.walls.forEach((w) => wallOn(w, true));
    cageGuard(c);                 // ...except where somebody else is standing
  }
  function cagePlayer(p, why) {
    if (!p || p.state === "caged") return false;
    const c = takeCage();
    if (!c) return false;
    const now = Date.now();
    // thrown ahead along their heading, so it lands on a runner
    const at = predict(p, CAGE_LEAD_S), x = at.x, z = at.z;
    c.busy = true; c.who = p.id; c.at = now; c.chases = 0; c.lastT = p.t;
    landCage(c, x, z, Math.max(0, p.y - 0.2));
    p.cx = x; p.cz = z; p.cy = c.y;
    set(c.lamp, "color", p.cls >= 0 ? CLS[p.cls].col : CHALK);
    p.cage = c;
    p.state = "caged";
    p.cagedAt = now;
    // v26: a small party isn't left waiting 150 s for a healer it may not have
    const mercyS = (CAGE_MAX_S > 0 ? CAGE_MAX_S : 600) + (EASY_CAGE_S - (CAGE_MAX_S > 0 ? CAGE_MAX_S : 600)) * ease;
    p.untilFree = CAGE_SELF_OPEN && (CAGE_MAX_S > 0 || ease > 0) ? now + mercyS * 1000 : Infinity;   // v46
    p.lostTo = why || "";
    p.deaths++;
    p.shown = "";
    runStats.deaths++;
    return true;
  }
  // THE ONE WAY ANYBODY IS HURT. The hit takes pips; the last pip gone
  // and you are caged.
  function hurt(p, dmg, why) {
    if (!hittable(p)) return false;
    const now = Date.now();
    if (now - p.hitAt < TANK_IFRAME_MS) return false;
    p.hitAt = now;
    if (ease >= 0.5 && (dmg || 1) > 1) dmg = dmg - 1;     // v26: a small party's big hits hurt less
    p.guard = Math.max(0, p.guard - (dmg || 1));
    p.shown = "";
    if (p.guard > 0) return true;
    return cagePlayer(p, why);
  }

  // ==========================================================
  // MARKERS - your oath turning over your head
  // ==========================================================
  const MARKER_Y = 2.75, MARK_MIN_M = 0.15;
  function markerFor(p) {
    const g = group({ y: PARK }, markRoot);
    lerpOn(g, "x,z", MARK_MS + 40, "linear");
    p.orb = box(g, 0, MARKER_Y, 0, 0.34, 0.34, 0.34, CHALK, { ry: 45, rx: 45 });
    p.emb = null; p.embKey = -2;
    p.pips = [];
    p.key = box(g, 0.7, PARK, 0, 0.26, 0.26, 0.26, GOLD, { ry: 45 });
    // a healer's heal bar, and the white diamond of a ready revive
    p.hbar = group({ y: PARK }, g);
    p.hcubes = [];
    for (let i = 0; i < HEAL_MAX; i++) p.hcubes.push(box(p.hbar, (i - (HEAL_MAX - 1) / 2) * 0.42, 0.12, 0, 0.3, 0.3, 0.3, CLS[HEALER].col, { ry: 45 }));
    box(p.hbar, 0, -0.18, 0, 1.3, 0.1, 0.1, INK);
    p.hfill = box(p.hbar, 0, -0.18, 0.04, 1.24, 0.07, 0.08, "#eaffea");
    p.rev = box(g, -0.8, PARK, 0, 0.3, 0.3, 0.3, "#ffffff", { ry: 45, rx: 45 });
    // v33: the pulse's STRIKE - a magenta diamond under your feet and four
    // shards bursting up round you, for a moment, when a pulse hits you
    p.zap = group({ y: PARK }, g);
    box(p.zap, 0, 0.14, 0, 2.4, 0.05, 2.4, PULSE_FLOOD, { ry: 45 });
    for (let i = 0; i < 4; i++) {
      const a = (i * PI) / 2 + PI / 4;
      box(p.zap, Math.cos(a) * 0.85, 1.1, Math.sin(a) * 0.85, 0.16, 2.2, 0.16, PULSE_WALL, { ry: -a * R2D, rz: 18 });
    }
    p.zapSerial = 0;
    p.marker = g;
  }
  const STRIKE_MS = 800;
  function strikeFx(p) {
    if (!p.zap) return;
    const s = ++p.zapSerial;
    set(p.zap, "y", 0);
    later(() => { if (p.zapSerial === s) park(p.zap); }, STRIKE_MS);
  }
  function markerTick() {
    const now = Date.now();
    players.forEach((p) => {
      if (!p.marker) markerFor(p);
      const show = present(p);            // v35: standing still on the floor still counts
      const safe = now < p.safeUntil;
      const want = !show ? "hide" : p.state + ":" + p.cls + ":" + p.guard + ":" + (safe ? "s" : "") + (p.libUsed ? "" : "k")
        + (p.cls === HEALER ? ":" + p.healN + "." + Math.floor(p.healProg * 5) + (now - p.reviveAt >= REVIVE_COOL_MS ? "r" : "") : "");
      if (want !== p.shown) {
        p.shown = want;
        if (!show) { park(p.marker); p.mx = p.mz = p.my = 1e9; }   // v35: forget where it was, so it comes back
        else {
          const col = p.cls >= 0 ? CLS[p.cls].col : CHALK;
          set(p.orb, "color", p.state === "caged" ? "#6a7078" : safe ? "#ffffff" : p.guard <= 1 && p.cls >= 0 ? "#ff3b3b" : col);
          if (p.embKey !== p.cls) {
            p.embKey = p.cls;
            if (p.emb && p.emb.remove) p.emb.remove();
            p.emb = null;
            if (p.cls >= 0) {
              p.emb = group({ y: MARKER_Y + 0.95 }, p.marker);
              anim(p.emb, "ry", 0, 360, 4000, false);
              emblem(p.emb, p.cls, 0.5);
            }
            p.pips.forEach((q) => q.remove && q.remove());
            p.pips = [];
            if (p.cls >= 0) {
              const n = maxGuard(p.cls);
              for (let i = 0; i < n; i++) {
                p.pips.push(box(p.marker, (i - (n - 1) / 2) * 0.3, MARKER_Y + 1.85, 0, 0.22, 0.22, 0.22, "#5cf095"));
              }
            }
          }
          // green while healthy, amber when hurt, red on the last pip
          const mx = maxGuard(p.cls), hc = p.guard <= 1 ? "#ff3b3b" : p.guard < mx ? "#ffc23a" : "#5cf095";
          p.pips.forEach((q, i) => set(q, "color", i < p.guard && p.state === "free" ? hc : "#1b1f26"));
          set(p.key, "y", TANK_KEY && p.cls === TANK && !p.libUsed ? MARKER_Y + 0.45 : PARK);
          const hl = p.cls === HEALER && p.state === "free";
          set(p.hbar, "y", hl ? MARKER_Y + 2.35 : PARK);
          if (hl) {
            p.hcubes.forEach((q, i) => set(q, "color", i < p.healN ? CLS[HEALER].col : "#1b1f26"));
            const k = p.healN >= HEAL_MAX ? 0.02 : Math.max(0.02, Math.floor(p.healProg * 5) / 5);
            set(p.hfill, "sx", k); set(p.hfill, "x", -0.62 * (1 - k));
          }
          set(p.rev, "y", hl && now - p.reviveAt >= REVIVE_COOL_MS ? MARKER_Y + 0.45 : PARK);
        }
      }
      if (!show) return;
      // v24: aim where they'll be when the next update lands, so a marker
      // sent 4x a second rides the head instead of trailing it
      const at = p.state === "free" ? predict(p, MARK_MS / 1000) : p;
      if (Math.abs(at.x - p.mx) < MARK_MIN_M && Math.abs(at.z - p.mz) < MARK_MIN_M && p.my === p.y) return;
      p.mx = at.x; p.mz = at.z; p.my = p.y;
      set(p.marker, "x", at.x); set(p.marker, "z", at.z); set(p.marker, "y", p.y);
    });
  }

  // ==========================================================
  // THE CLASS TICK, RESCUES AND MENDING
  // ==========================================================
  const runStats = { deaths: 0, revives: 0, frees: 0, wipes: 0, swarm: 0, heals: 0 };
  // v44: ROLE CAPS - how many may swear an oath with this many people here
  function crowdNow() { let n = 0; players.forEach((p) => { if (fresh(p) && present(p)) n++; }); return n; }
  function roleCap(cls, N) {
    if (cls === DPS || N < ROLE_CAPS_FROM) return Infinity;
    return Math.max(ROLE_MIN, Math.round(N * (cls === TANK ? TANK_SHARE : HEALER_SHARE)));
  }
  function swornAs(cls, not) { let n = 0; players.forEach((q) => { if (q !== not && q.cls === cls && fresh(q) && present(q)) n++; }); return n; }
  function classTick() {
    const now = Date.now();
    const N = crowdNow();
    OATHS.forEach((O) => {
      players.forEach((p) => {
        if (p.state !== "free" || now - p.t > 1500) return;
        if (hyp(p.x - O.x, p.z - O.z) > CLASS_PAD_R) return;
        if (p.cls === O.cls) return;
        const running = phase === "MUSTER" || phase === "DELVE";
        if (LOCK_CLASSES && running && p.cls >= 0) {
          if (now - O.flashUntil > 0) { O.flashUntil = now + 2500; set(O.flash, "content", "OATHS ARE LOCKED IN A RUN"); }
          return;
        }
        const cap = roleCap(O.cls, N);
        if (swornAs(O.cls, p) >= cap) {
          if (now - O.flashUntil > 0) { O.flashUntil = now + 2500; set(O.flash, "content", CLS[O.cls].key + " IS FULL (" + cap + ") - PICK ANOTHER"); }
          return;
        }
        p.cls = O.cls;
        SWORN.set(p.id, O.cls);             // v34
        p.guard = maxGuard(O.cls);
        p.shown = "";
        O.flashUntil = now + 2500;
        set(O.flash, "content", "+1 " + CLS[O.cls].key + " SWORN");
      });
      if (now > O.flashUntil) set(O.flash, "content", "");
    });
  }
  // healers run into cages; a tank can open one, once a run
  function rescueTick() {
    const now = Date.now();
    players.forEach((q) => {
      if (q.state !== "caged" || !q.cage) return;
      if (now - q.cagedAt < 500) return;
      // a healer at the cage always opens it before a tank spends its key
      let freedBy = null, tankBy = null;
      players.forEach((h) => {
        if (freedBy || h === q || h.state !== "free" || now - h.t > 1200) return;
        if (h.cls !== HEALER && h.cls !== TANK) return;
        if (Math.abs(h.y - (q.cy + 0.2 + PAD_T)) > 3 && Math.abs(h.y - q.y) > 3) return;
        if (hyp(h.x - q.cx, h.z - q.cz) > RESCUE_R) return;
        if (h.cls === HEALER && now - h.reviveAt >= REVIVE_COOL_MS) freedBy = h;
        else if (TANK_KEY && h.cls === TANK && !h.libUsed && !tankBy) tankBy = h;   // v46
      });
      freedBy = freedBy || tankBy;
      if (!freedBy) return;
      releaseCage(q, undefined, REVIVE_HP);
      if (freedBy.cls === HEALER) { freedBy.reviveAt = now; freedBy.revives++; runStats.revives++; }
      else { q.guard = Math.max(q.guard, Math.ceil(maxGuard(q.cls) * REVIVE_HP)); freedBy.libUsed = true; freedBy.frees++; runStats.frees++; freedBy.shown = ""; say("A TANK BROKE A CAGE OPEN - ONCE PER RUN", 2500); }
    });
  }
  // healers carry up to three heals and win one back every 10 s; each
  // hurt ally they run into gets a pip per heal
  let lastMend = Date.now();
  function mendTick() {
    const now = Date.now();
    const dt = clamp((now - lastMend) / 1000, 0, 0.5);
    lastMend = now;
    players.forEach((h) => {
      if (h.cls !== HEALER || h.state !== "free") return;
      if (h.healN < HEAL_MAX) {
        h.healProg += dt / healCharge;
        if (h.healProg >= 1) { h.healProg = 0; h.healN++; }
        if (Math.floor(h.healProg * 5) !== h.healProgShown) { h.healProgShown = Math.floor(h.healProg * 5); h.shown = ""; }
      }
      if (h.healN < 1 || now - h.mendAt < HEAL_GAP_MS || !live(h)) return;
      let best = null, bf = 9;
      players.forEach((t) => {
        if (t === h || t.state !== "free" || !live(t, 1500) || t.cls < 0) return;
        const mx = maxGuard(t.cls);
        if (t.guard >= mx) return;
        if (Math.abs(t.y - h.y) > 2.5 || hyp(t.x - h.x, t.z - h.z) > HEAL_TOUCH_R) return;
        const f = t.guard / mx;
        if (f < bf) { bf = f; best = t; }
      });
      if (!best) return;
      best.guard++;
      best.shown = "";
      h.healN--;
      h.mendAt = now;
      h.shown = "";
      h.heals++;
      runStats.heals++;
      bolt(h.x, h.y + 1.3, h.z, best.x, best.y + 2.2, best.z, CLS[HEALER].col, 300, 0.7);
      // the light flows back: every few heals given, a pip for the healer
      if (h.heals % SELF_HEAL_EVERY === 0 && h.guard < maxGuard(HEALER)) h.guard++;
    });
  }

  // ==========================================================
  // TELEGRAPHS - red on the ground: get out
  // ==========================================================
  // A telegraph is a flat shape that fills from its origin over the
  // warning time. When it is full, it fires: whoever is inside is hit.
  // Some burn on after they fire (breath, a dragon's fire run) and keep

    [-1, 1].forEach((a) => {
      box(head, a * 1.7, 0, 1.4, 3.4, 0.35, 0.35, WOOD_DK, { ry: a * 20 });
      box(head, a * 1.6, 0, 0.4, 0.06, 0.06, 2.3, CHALK, { ry: a * -55 });
    });
    const loaded = box(head, 0, 0.45, 0.6, 0.22, 0.22, 5.6, IRON_LT);
    box(head, 0, 0.45, 3.5, 0.5, 0.5, 0.6, IRON, { rz: 45 });
    // the charge bar
    const bg = group({ y: 5.2, ry: face }, g);
    box(bg, 0, 0, -0.05, 4.2, 0.6, 0.12, INK);
    const fill = box(bg, 0, 0, 0.05, 4, 0.45, 0.12, STAB_COL);
    const sign = label(group({ y: 6.4, ry: face + 180 }, g), { width: 5, height: 0.8, color: INK, "font-color": STAB_COL, content: "HARPOON" });
    const shot = group({ y: PARK }, fxRoot);
    const SL = lerpOn(shot, "x,y,z", 450, "linear");
    box(shot, 0, 0, 0, 0.5, 0.5, 0.5, IRON_LT, { ry: 45, rx: 45 });
    box(shot, 0, 0, 0, 0.12, 0.12, 3, IRON_LT);
    BALLISTAS.push({ k: k, x: S.x, z: S.z, y: Y, face: face, g: g, ring: ring, T: T, TL: TL, head: head, HL: HL,
      loaded: loaded, fill: fill, sign: sign, shot: shot, SL: SL, charge: 0, coolUntil: 0, ry: face, crew: 0, big: S.big });
  });
  // v45: the big set of harpoons is awake while the caldera holds a big crowd of DPS
  let bigHarp = false;
  function harpoonsBig() { return bigHarp; }
  function harpoonsLive() { return BALLISTAS.filter((B) => !B.big || bigHarp).length; }
  function paintBallista(B, active) {
    if (B.big && !bigHarp) active = false;
    set(B.fill, "sx", Math.max(0.01, B.charge));
    set(B.fill, "x", -2 * (1 - Math.max(0.01, B.charge)));
    set(B.ring, "color", active ? STAB_COL : "#3a2a1a");
    set(B.ring, "opacity", active ? 0.65 : 0.5);
    set(B.loaded, "y", Date.now() < B.coolUntil ? PARK : 0.45);
    set(B.sign, "content", B.big && !harpoonsBig() ? "HARPOON - BIG PARTIES" : !active ? "HARPOON - WHEN IT FLIES" : Date.now() < B.coolUntil ? "RELOADING"
      : B.crew ? "CHARGING  x" + Math.min(B.crew, HARPOON_MAXCREW) : "DPS: STAND HERE");
  }

  // ==========================================================
  // MONSTERS: the bodies
  // ==========================================================
  // Every model faces +z. Four legs swing on a loop when `animated`.
  function legs4(g, k, xs, zf, zb, hip, len, col, hoof, animated, ms) {
    const out = [];
    [[-xs, zf, 1], [xs, zf, -1], [-xs, zb, -1], [xs, zb, 1]].forEach(([x, z, ph]) => {
      const L = group({ x: x, y: hip, z: z }, g);
      box(L, 0, -len / 2, 0, 0.34 * k, len, 0.38 * k, col);
      box(L, 0, -len + 0.08 * k, 0.05 * k, 0.42 * k, 0.18 * k, 0.48 * k, hoof);
      if (animated) anim(L, "rx", -26 * ph, 26 * ph, ms || 300);
      out.push(L);
    });
    return out;
  }
  // v22: a four-legged creature from its cut-apart .glbs. Legs stride the way
  // legs4 did (diagonal pairs), the head and tail get their own pivots.
  function quadModel(p, prefix, piv, k, legMs, parent) {
    const g = parent || group({}, p);
    glbModel(g, prefix + "_body.glb", { sx: k, sy: k, sz: k });
    let hd = null, tail = null;
    if (piv.Head) { hd = group({ x: piv.Head[0] * k, y: piv.Head[1] * k, z: piv.Head[2] * k }, g); glbModel(hd, prefix + "_head.glb", { sx: k, sy: k, sz: k }); }
    if (piv.Tail) { tail = group({ x: piv.Tail[0] * k, y: piv.Tail[1] * k, z: piv.Tail[2] * k }, g); glbModel(tail, prefix + "_tail.glb", { sx: k, sy: k, sz: k }); }
    const PH = { Leg_FNegX: 1, Leg_FPosX: -1, Leg_BNegX: -1, Leg_BPosX: 1 };
    const legs = Object.keys(PH).map((nm) => {
      const q = piv[nm], L = group({ x: q[0] * k, y: q[1] * k, z: q[2] * k }, g);
      if (legMs) anim(L, "rx", -26 * PH[nm], 26 * PH[nm], legMs);
      glbModel(L, prefix + "_" + nm.toLowerCase() + ".glb", { sx: k, sy: k, sz: k });
      return L;
    });
    return { g: g, hd: hd || group({}, g), tail: tail, legs: legs };
  }
  // a bull. Called by the Gore Pit's statues and by the stampede.
  function bullModel(p, k, col, dk, hornCol, eyeCol, animated) {
    if (USE_MODELS) {
      if (!animated) { const g = group({}, p); glbModel(g, "bull_stone.glb", { sx: k, sy: k, sz: k }); return { g: g, hd: group({}, g), legs: [] }; }
      return quadModel(p, "bull", BULL_PIV, k, 0);         // v36: the gait drives the legs (mkLegs)
    }
    const g = group({}, p);
    box(g, 0, 1.6 * k, -0.1 * k, 1.5 * k, 1.25 * k, 2.6 * k, col);
    box(g, 0, 2.25 * k, 0.55 * k, 1.35 * k, 0.8 * k, 1.3 * k, dk);        // the hump
    box(g, 0, 1.5 * k, 1.1 * k, 1.6 * k, 1.35 * k, 0.8 * k, dk);          // chest
    box(g, 0, 1.0 * k, -0.1 * k, 1.2 * k, 0.3 * k, 2.2 * k, dk);
    const hd = group({ y: 1.65 * k, z: 1.75 * k }, g);
    box(hd, 0, 0, 0.3 * k, 0.85 * k, 0.85 * k, 1.0 * k, col, { rx: 18 });
    box(hd, 0, -0.3 * k, 0.85 * k, 0.72 * k, 0.5 * k, 0.4 * k, dk, { rx: 18 });
    [-1, 1].forEach((s) => {
      box(hd, s * 0.62 * k, 0.32 * k, 0.15 * k, 0.9 * k, 0.24 * k, 0.24 * k, hornCol, { rz: s * -12 });
      box(hd, s * 1.08 * k, 0.66 * k, 0.28 * k, 0.2 * k, 0.72 * k, 0.2 * k, hornCol, { rz: s * -24, rx: 22 });
      box(hd, s * 0.26 * k, 0.1 * k, 0.8 * k, 0.14 * k, 0.12 * k, 0.05 * k, eyeCol || "#1a1410");
      box(hd, s * 0.5 * k, 0.28 * k, 0.05 * k, 0.12 * k, 0.3 * k, 0.3 * k, dk);     // ears
    });
    box(g, 0, 1.7 * k, -1.45 * k, 0.14 * k, 1.0 * k, 0.14 * k, dk, { rx: 22 });
    box(g, 0, 1.2 * k, -1.63 * k, 0.28 * k, 0.3 * k, 0.28 * k, dk);
    const legs = legs4(g, k, 0.5 * k, 0.95 * k, -1.0 * k, 1.05 * k, 1.05 * k, col, "#141210", animated, 260);
    return { g: g, hd: hd, legs: legs };
  }
  // the stampede
  const BULL_COLS = [["#4a2c1e", "#2c1810"], ["#3a3430", "#1e1a18"], ["#5a3a24", "#301e12"]];

    const eyes = [];             // v25: no glowing eyes on the wolves

    legs4(body, k * 0.8, 0.22 * k, 0.5 * k, -0.6 * k, 0.75 * k, 0.72 * k, fur, dk, true, 220);
    const pips = [];
    if (alpha) for (let i = 0; i < 6; i++) pips.push(box(g, (i - 2.5) * 0.3, 3.1, 0, 0.22, 0.22, 0.22, GOLD, { ry: 45 }));

  function wardenModel(p) {

    box(head, 0, 0, 0, 3.2, 2.6, 3, ST);
    box(head, 0, 1.5, -0.3, 3.6, 0.6, 3.4, ST_LT);

      // v40: each paw on its own ankle joint, so it can stay flat on the floor as the leg swings

        glbModel(P_, "dragon_paw_" + q[3] + ".glb");
        paws.push(P_);
        return L;

        const nm = s > 0 ? "Wing_PosX" : "Wing_NegX", q = DRAGON_PIV[nm];

      });

    box(hd, 0, 0.9, 2.8, 2.4, 1.2, 2.6, RED_DK);
    const jaw = group({ y: -0.9, z: 0.2 }, hd);
    const JL = lerpOn(jaw, "rx", 300, "easeInOutQuad");
    box(jaw, 0, 0, 2.2, 2.6, 0.7, 4.2, RED_DK);
    for (let i = 0; i < 3; i++) [-1, 1].forEach((s) => box(jaw, s * 0.9, 0.5, 3.9 - i * 0.9, 0.25, 0.5, 0.25, BONE));

    [-1, 1].forEach((s) => {

    box(tail, 0, -0.4, -7.2, 2.4, 2, 5, RED);
    box(tail, 0, -0.8, -11.6, 1.5, 1.3, 4.8, RED_DK);

    // legs
    [[-2.6, 3.6], [2.6, 3.6], [-2.8, -3.4], [2.8, -3.4]].forEach(([x, z]) => {

      box(g, x, 0.3, z + 0.5, 2, 0.6, 2.8, "#1a0a06");

    });
    return { g: g, hd: hd, jaw: jaw, JL: JL, eyes: eyes, fire: fire, fire2: fire2, tail: tail, TL: TLr, wings: wings };
  }
  function wingMode(D, flying) {
    D.model.wings.forEach((w) => {
      const a = w.flap;
      if (flying) {
        a.setAttribute("start", String(w.s * -28)); a.setAttribute("end", String(w.s * 34));
        a.setAttribute("duration", "900");
      } else {
        a.setAttribute("start", String(w.s * (USE_MODELS ? 55 : -52))); a.setAttribute("end", String(w.s * (USE_MODELS ? 62 : -60)));

  // ==========================================================
  // MONSTERS: moving them
  // ==========================================================
  // The server moves a monster every TICK_MS and every screen glides it
  // the rest of the way (Sky Dragon's lerp, a shade longer than the tick).

    else E.tick(now, dt);
    if (E.gait || E.legs) gaitTick(E, now, dt);
    if (E.hp <= 0) { victory(E); return; }
    if (!E.ownTotems) totemsFor(E, !!E.canTotem(), dt);
    swarmTick(E, now);
    if (E.stab) stabTick(E, E.mob, E.stabBack, E.stabSide, !!E.canStab());
    if (E.stab && E.state === "engaged") wheelTick(E, now);
    if (E.chaseMode && E.state === "engaged") turnTick(E, now);
    if (E.chaseMode && E.state === "engaged") blockTick(E, now);     // v43
    if (E.state === "engaged" && !E.immune) clumpTick(E, now);        // v45
    pulseTick(E, now);
    if (E.mark) markTick(E);
    if (E.hp <= 0) { victory(E); return; }
    let free = 0, caged = 0;
    players.forEach((p) => {
      if (!fresh(p)) return;
      if (p.state === "caged") { if (inZone(E.zone, { x: p.cx, z: p.cz, y: p.cy + 0.2 + PAD_T })) caged++; }
      else if (inArena(E, p)) free++;
    });
    const total = free + caged;
    E.cagedN = caged; E.totalN = total;
    E.danger = total ? caged / total : 0;
    // ENRAGE
    if (!E.enraged && E.enrageAt) {
      const left = E.enrageAt - now;
      if (left <= 60000 && !E.enrageWarned) { E.enrageWarned = true; say(E.name + " ENRAGES IN ONE MINUTE", 4000); }
      if (left <= 0) { E.enraged = true; E.nextPulse = now + 2500; say(E.name + " IS ENRAGED - FINISH HIM OR FALL", 6000); }
    }
    // THE WIPE COUNTDOWN
    E.wipeNeed = total > WIPE_ALL_UPTO ? Math.ceil(total * WIPE_FRAC) : total;
    if (caged && caged >= E.wipeNeed) {
      E.emptySince = 0;
      if (!E.wipeAt) { E.wipeAt = now; say("WIPE IN " + secs(WIPE_WARN_MS) + " - FREE THE CAGED!", 3000); }
      if (now - E.wipeAt >= WIPE_WARN_MS) {
        runStats.wipes++;
        resetFight(E, true, "WIPE! " + E.name + " RESETS - REGROUP");
      }
      return;
    }
    if (E.wipeAt) { E.wipeAt = 0; say("SAVED! THE FIGHT GOES ON", 2500); }
    if (!free && !caged) {
      if (!E.emptySince) E.emptySince = now;
      if (now - E.emptySince >= LEASH_MS) resetFight(E, false, E.name + " LOST INTEREST - THE FIGHT RESETS");
    } else E.emptySince = 0;
  }

  // ==========================================================
  // THE RUN
  // ==========================================================
  function everyoneOut() {
    players.forEach((p) => { if (p.state === "caged") releaseCage(p, 0); });
  }
  function startRun() {
    walk = false;
    ENCS.forEach((E) => { quiet(E); E.reset(); if (E.mob) set(E.mob.g, "rz", 0); E.state = "sealed"; });
    Object.keys(GATES).forEach((k) => closeGate(GATES[k]));
    everyoneOut();
    let inside = 0;
    players.forEach((p) => {
      p.guard = maxGuard(p.cls);
      p.healN = HEAL_MAX; p.healProg = 0; p.reviveAt = 0;
      p.libUsed = false; p.dmg = 0; p.deaths = 0; p.revives = 0; p.frees = 0; p.shown = "";
      p.heals = 0; p.blocks = 0; p.kills = 0;             // v45: the Hall of Embers counts
      if (fresh(p) && !inZone(ZONES.camp, p)) inside++;
    });
    runStats.deaths = runStats.revives = runStats.frees = runStats.wipes = runStats.swarm = runStats.heals = 0;
    ambushReset();
    phase = "MUSTER"; phaseAt = Date.now();
    musterEnds = phaseAt + MUSTER_S * 1000;
    say(inside ? inside + " STILL INSIDE - 2606 OPENS EVERY GATE" : "TO THE MAW - SWEAR AN OATH IF YOU HAVEN'T", 6000);
  }
  function resetAll(why) {
    walk = false;
    ENCS.forEach((E) => { quiet(E); E.reset(); if (E.mob) set(E.mob.g, "rz", 0); E.state = "sealed"; });
    everyoneOut();
    ambushReset();
    // anyone still inside can walk home
    Object.keys(GATES).forEach((k) => openGate(GATES[k], "THE WAY BACK - TO THE CAMP"));
    phase = "LOBBY"; phaseAt = Date.now();
    say(why || "RESET - BACK TO THE CAMP", 5000);
  }
  function openAll() {
    walk = true;
    Object.keys(GATES).forEach((k) => openGate(GATES[k], "OPEN - WALKTHROUGH"));
    ENCS.forEach((E) => { if (E.state === "sealed") E.state = "ready"; });
    AMBUSHES.forEach((A) => { A.done = false; });
    say("WALKTHROUGH: EVERY GATE OPEN, EVERY FIGHT READY", 5000);
  }
  function runCode(v) {
    const now = Date.now();
    v = String(v || "").trim();
    if (v === CODE_START) {
      if (phase === "LOBBY" || phase === "CLEARED") { startRun(); return; }
      if (now - stopArmedAt < 6000) { stopArmedAt = 0; resetAll("THE HOST STOPPED THE RUN"); return; }
      stopArmedAt = now;
      say("PRESS 2601 AGAIN TO STOP THE RUN", 5000);
      return;
    }
    if (v === CODE_RESET) { resetAll(); return; }
    if (v === CODE_FREE) { everyoneOut(); say("EVERY CAGE IS OPEN", 3000); return; }
    if (v === CODE_SKIP) {
      const on = ENCS.filter((E) => E.state === "engaged");
      if (on.length) { on.forEach((E) => victory(E)); return; }
      const nx = ENCS.find((E) => E.state !== "done" && available(E));
      if (nx) { nx.engagedAt = now; victory(nx); } else say("NOTHING TO SKIP", 2500);
      return;
    }
    if (v === CODE_WIPE) {
      const on = ENCS.filter((E) => E.state === "engaged" || E.state === "regroup");
      on.forEach((E) => resetFight(E, false, E.name + " RESET BY THE HOST"));
      if (!on.length) say("NO FIGHT TO RESET", 2500);
      return;
    }
    if (v === CODE_GATES) { openAll(); return; }
    if (v === CODE_HARD) {
      if (ENCS.some((E) => E.state === "engaged")) { say("NOT MID-FIGHT - TRY 2607 BETWEEN FIGHTS", 3000); return; }
      hard = !hard;
      say(hard ? "HARD MODE: TOUGHER BOSSES, BIGGER SWARMS, LESS WARNING" : "HARD MODE OFF", 5000);
      return;
    }
    say("UNKNOWN CODE " + v, 2500);
  }
  function phaseTick() {
    const now = Date.now();
    if (phase === "MUSTER" && now >= musterEnds) {
      phase = "DELVE"; phaseAt = delveAt = now;
      openGate(GATES.maw, "ENTER - GOREHORN WAITS");
      say("THE MAW IS OPEN - GO IN TOGETHER", 5000);
    }
  }

  // cage timers, strays, and tanks catching their breath
  let lastRefill = 0;
  // v20: how fast heals come back, from the party's players per healer
  let healCharge = HEAL_CHARGE_S;
  function healChargeTick() {
    let sworn = 0, healers = 0;
    players.forEach((p) => { if (p.cls >= 0 && fresh(p) && present(p)) { sworn++; if (p.cls === HEALER) healers++; } });
    const ratio = sworn / Math.max(1, healers);
    const k = clamp((ratio - HEAL_RATIO_OK) / (HEAL_RATIO_MAX - HEAL_RATIO_OK), 0, 1);
    healCharge = HEAL_CHARGE_S - (HEAL_CHARGE_S - HEAL_CHARGE_MIN) * k;
  }
  // v23: everyone on the route caged, no boss fight on -> open every cage
  const PATH_WIPE_MS = 8000;
  let pathWipeAt = 0;
  function pathWipeTick(now, busy) {
    let out = 0, caged = 0;
    players.forEach((p) => {
      if (p.cls < 0 || !fresh(p)) return;
      const inCamp = p.state !== "caged" && inZone(ZONES.camp, p);
      if (inCamp) return;
      out++; if (p.state === "caged") caged++;
    });
    if (busy.length || !out || caged < out) { pathWipeAt = 0; return; }
    if (!pathWipeAt) { pathWipeAt = now + PATH_WIPE_MS; say("THE PARTY FALLS - THE CAGES OPEN IN 8 S", 3000); return; }
    if (now >= pathWipeAt) {
      pathWipeAt = 0;
      players.forEach((p) => { if (p.state === "caged") releaseCage(p); });
      say("GET UP - PICK YOURSELVES UP AND TRY AGAIN", 3000);
    }
  }
  // v24: someone gone PRUNE_MS is forgotten - their marker leaves the
  // document, so it isn't sent to every newcomer or kept on every screen
  function pruneTick(now) {
    players.forEach((p, id) => {
      if (now - p.t < PRUNE_MS || p.state !== "free" || p.cage) return;
      if (p.pads > 0) return;             // v34: still standing on the floor - just standing still
      if (p.marker) p.marker.remove();
      players.delete(id);
    });
  }
  function stateTick() {
    healChargeTick();
    hallTick(Date.now());          // v45
    const now = Date.now();
    pruneTick(now);
    const busy = ENCS.filter((E) => E.state === "engaged");
    // v26: between fights the ease follows the party (a fight holds its own)
    if (!busy.length) ease = easeFor(Math.max(swornCount(), partySize()));
    pathWipeTick(now, busy);
    const refill = now - lastRefill >= 2000;
    if (refill) lastRefill = now;
    players.forEach((p) => {
      if (p.state === "caged") {
        if (!fresh(p)) { releaseCage(p, 0); return; }
        if (now >= p.untilFree) { releaseCage(p); return; }
        // no mercy: only a healer, a tank's key, a wipe or the end of the
        // fight opens a cage (and CAGE_MAX_S as the last backstop)
        return;
      }
      // v19: no refilling anywhere while a boss fight is on - healers only
      // v26: ...except for a small party, which gets a slow trickle back
      const regenMs = !busy.length ? REFILL_MS : ease > 0.05 ? EASY_REGEN_MS / ease : 0;
      if (regenMs && p.guard < maxGuard(p.cls) && now - p.refillAt >= regenMs && (!busy.length || now - p.hitAt >= 2000) && fresh(p)) {
        p.refillAt = now; p.guard++; p.shown = "";
      }
    });
  }

  // ==========================================================
  // PAINT - the boards
  // ==========================================================
  function fightLine() {
    return ENCS.map((E) => (E.state === "done" ? "X " : "") + (E === PK ? "PACK" : E === WD ? "WARDEN" : E.name)).join("  -  ");
  }
  function paint() {
    const now = Date.now();
    ENCS.forEach(paintBar);
    const n = [0, 0, 0], un = [0];
    players.forEach((p) => { if (!present(p) || !fresh(p)) return; if (p.cls >= 0) n[p.cls]++; else un[0]++; });
    const N = crowdNow();
    OATHS.forEach((O) => {
      const cap = roleCap(O.cls, N);
      set(O.count, "content", (n[O.cls] ? n[O.cls] + " SWORN" : "NONE SWORN") + (cap < Infinity ? "  (MAX " + cap + ")" : ""));
    });
    let head;
    if (phase === "LOBBY") head = "SWEAR AN OATH - THE HOST OPENS THE MAW";
    else if (phase === "MUSTER") head = "THE MAW OPENS IN " + secs(musterEnds - now);
    else if (phase === "DELVE") {
      const E = ENCS.find((e) => e.state !== "done");
      head = E ? (E.state === "engaged" ? "FIGHTING " : "NEXT: ") + E.name : "";
    } else head = "EMBERHOLD HAS FALLEN";
    const L = CAMPB.lines;
    set(L[1], "content", head);
    set(L[2], "content", "DPS " + n[DPS] + "   TANKS " + n[TANK] + "   HEALERS " + n[HEALER] + (un[0] ? "   UNSWORN " + un[0] : "")
      + (ease >= 0.99 ? "   - SMALL PARTY: EASY FIGHTS" : ease > 0.01 ? "   - SMALLER PARTY: EASIER FIGHTS" : ""));
    set(L[3], "content", "CAGED " + runStats.deaths + "   FREED " + (runStats.revives + runStats.frees) + "   WIPES " + runStats.wipes
      + "   SWARM SLAIN " + runStats.swarm + (hard ? "   HARD" : ""));
    set(L[4], "content", fightLine());
    set(L[5], "content", now < noteUntil ? note : scriptErrors ? "ERR " + scriptErrors + ": " + lastError : "");
    set(CAMP.titleSub, "content", (hard ? "HARD MODE - " : "") + (phase === "LOBBY" ? "CHOOSE YOUR OATH" : phase === "MUSTER" ? "THE MAW OPENS IN " + secs(musterEnds - now)
      : phase === "DELVE" ? "THE DELVE IS ON" : "CONQUERED"));
    ENCS.forEach((E) => {
      let st, frac = E.hp / (E.max || 1), col = E.col;
      if (E.state === "sealed") { st = "SEALED"; frac = 1; }
      else if (E.state === "ready") { st = E.wake; frac = 1; }
      else if (E.state === "regroup") { st = "REGROUP - " + secs(E.regroupUntil - now); frac = 1; }
      else if (E.state === "done") { st = "SLAIN"; frac = 0; }
      else {
        const wipeAt = E.wipeNeed || E.totalN;
        st = E.wipeAt ? "WIPE IN " + secs(E.wipeAt + WIPE_WARN_MS - now) + " - FREE THE CAGED! " + E.cagedN + " OF " + E.totalN
          : now < (E.pulsingUntil || 0) ? "PULSE! NO DODGING - EVERYONE LOSES A PIP"
          : E.danger >= DANGER_FRAC && E.cagedN >= 2 ? "DANGER - " + E.cagedN + " OF " + E.totalN + " CAGED - WIPE AT " + wipeAt
          : E.status();
        if (E.immune) col = "#8a8a8a";
        if (E.mult > 1) col = STAB_COL;
        if (E.enraged) col = "#ff1a1a";
      }
      // the name line carries the enrage clock
      let nm = E.name;
      if (E.state === "engaged" && E.enrageAt) {
        if (E.enraged) nm = E.name + " - ENRAGED";
        else { const t = secs(E.enrageAt - now); nm = E.name + "   ENRAGE " + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
      }
      paintBoard(E.board, nm, frac, st, col);
      paintAlarm(E);
    });
    if (phase === "CLEARED") {
      const t = Math.round((clearedAt - delveAt) / 1000);
      set(VAULT.sub, "content", "CONQUERED IN " + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0")
        + "   CAGED " + runStats.deaths + "   FREED " + (runStats.revives + runStats.frees) + "   WIPES " + runStats.wipes);
    } else set(VAULT.sub, "content", "SLAY VYRATHAX TO CLAIM IT");
  }

  // ==========================================================
  // GO
  // ==========================================================
  ENCS.forEach((E) => { E.reset(); E.state = "sealed"; });
  let lastTick = Date.now();
  every(() => {
    const now = Date.now();
    const dt = clamp((now - lastTick) / 1000, 0, 0.25);
    lastTick = now;
    teleTick();
    ENCS.forEach((E) => guard(() => encTick(E, now, dt))());
    batchedTick(now);
    guard(() => addTick(now, dt))();
    if (phase === "DELVE" || walk) guard(() => ambushTick(now))();
  }, TICK_MS);
  // v24: a player who leaves is gone at once, not after the ghost timer
  if (typeof window !== "undefined" && window.addEventListener) {
    on(window, "disconnected", (e) => {
      const id = e && e.detail ? e.detail.connectionId : undefined;
      const p = id === undefined ? null : players.get(id);
      if (p) { p.t = 0; p.pads = 0; p.shown = ""; }
    });
  }
  every(cageClose, CAGE_STEP_MS);
  every(markerTick, MARK_MS);
  every(classTick, 200);
  every(rescueTick, 100);
  every(mendTick, 150);
  every(stateTick, 500);
  every(phaseTick, 250);
  every(paint, 500);
  every(clockTick, 250);
  clockTick();
  paint();
</script>
