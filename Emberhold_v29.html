<!--
  OTHERSIDE EMBERHOLD  v47  -  "THE DELVE"

  NEW IN v47 - ROUND THINGS ON THE FLOOR ARE PICTURES NOW
  ------------------------------------------------------------
    Still 1,029,809 triangles in Otherside. Its counts across versions
    show a plain m-cylinder costs well over a thousand triangles there -
    and this build had 140 of them, every one a thin disc on the floor
    (warning discs, totem and harpoon rings, sanctuary pools, the oath
    stones' circles, the gold backstab rings, the pulse cores). They
    are round pictures now (m-image, 2 triangles each), same size,
    colour and see-through-ness, drawn in code (discSrc). Nothing else
    looks or plays differently.
    Also a few fewer hidden spares: 100 cages (was 120 - still room for
    a wipe at 140 people), and slightly smaller monster pools.

  NEW IN v46 - ONLY A HEALER OPENS A CAGE
  ------------------------------------------------------------
    Cages no longer open by themselves (the 150 s backstop and a small
    party's 25 s are off) and tanks no longer carry a key. A healer's
    touch frees the caged; so do a wipe, the end of the fight and the
    host's 2603. CAGE_SELF_OPEN / TANK_KEY (with CAGE_MAX_S) put them back.

  NEW IN v45 - THE HALL OF EMBERS, DON'T CLUMP, MORE HARPOONS
  ------------------------------------------------------------
    THE HALL OF EMBERS: top 5 DPS (damage), healers (heals + revives,
      a revive counts 3) and tanks (blue marks blocked x3, monsters run
      down, cages broken x3). Live during a run, frozen when Vyrathax
      dies. One board on the Hoard's back wall, one north-west of the
      campfire. Beside the camp board is THE ROLL: click it and type a
      name to show on the board (otherwise "PLAYER 123").
    DON'T CLUMP: with 20+ in an arena, every 9-14 s fire falls on the
      tightest knot of players - a red disc wherever 8 or more stand
      within 5 m. 1 pip, 2 if 16+ are caught; one more disc per 40
      people. A totem crew (6 at most) never sets it off by itself.
    HARPOONS: six more ballistas round the caldera wake for a big run
      (past 21 DPS) - 10 in all, 30 DPS on harpoons. Each harpoon does
      a smaller share so the total is the same, and he needs 2 more
      hits to come down.
    Scaling now all starts with the crowd: the Pack's extra stones past
      21 DPS, the Warden's extra crawlers past 20 in the hall.

  NEW IN v44 - BUILT FOR 100, AND AMBUSHES ON THE EMBER STAIR
  ------------------------------------------------------------
    THE STAIR: monsters only used to come at the top - they walked on
    flat ground and the stair slopes. Monsters now follow the slope, and
    the climb has two ambushes of its own: crawlers drop off the stone
    dragons a quarter of the way up, spiders come over the walls
    halfway, then the imps at the top as before.
    BIG RUNS (80-120 people). A run of 20 or so plays as before.
      - ROLE CAPS: from 12 people the oath stones fill up - tanks 12%,
        healers 27%, the rest DPS (100 people: 12 / 27 / 61). Each stone
        shows "(MAX n)"; a full one says so and sends you elsewhere.
      - ROOM FOR DPS: past 21 DPS in a fight every totem can be lit, up
        to 6 DPS speed one totem (was 3), and the gold ring takes up to
        12 stabs a window (was 6).
      - BOSS HEALTH follows what a crowd can deal: full health per DPS up
        to 24, then 40% of it per DPS after that. 3-4 minute fights at
        any size, instead of racing the enrage.
      - 120 CAGES (was 48): a wipe at 100 people needs 70 caged.
      - BIGGER SWARMS: from 26 in an arena, 2 + 1 per 5 people up to 14
        (was 7), and bigger monster pools to fill them.
      - THE PACK: +1 spirit stone lit per 15 DPS; hounds stop getting
        tougher at 20 wounds.
      - THE WARDEN: more crawlers drop into the sanctuary pools, +1 per
        20 people in the hall.
      - HARD MODE (2607) now also brings the blue block marks 15% sooner.
    About 12,000 more triangles (the cages and the monster pools).

  NEW IN v43 - EVERY TANK HAS A JOB
  ------------------------------------------------------------
    With lots of tanks, most used to stand around: a boss only ever
    worked two of them. Now every tank past the first two gives the
    Gorehorn, the Warden and Vyrathax more to do (with 1-2 tanks in the
    arena nothing changes):
      - MORE CLEAVE: each front attack also lands on 1 more of the
        nearest tanks per 2 extra tanks (up to 4 tanks hit at once).
      - FASTER TURNS: he turns on a new tank sooner (up to twice as
        often), so every tank gets charged.
      - BLOCKS (new): every 9-14 s he marks DPS and healers with a
        BLUE disc that follows them. A tank standing in it when it
        lands takes the hit (1 pip) and nobody else is touched; nobody
        there and everyone in it loses 2 pips. 1 mark per 2 extra tanks,
        up to 4 at once. Tanks have to watch the whole arena now.
      - BIGGER SWARMS: +1 monster a swarm per extra tank (up to +4) for
        tanks to run down before they reach the DPS.
    The tank tax (health added per tank past 2) is halved to 400, since
    extra tanks now bring the boss extra attacks of their own.

  NEW IN v40 - VYRATHAX DIES, AND A HOARD WORTH THE CLIMB
  ------------------------------------------------------------
    HIS DEATH (about 5 s; he used to sink into the floor): a last roar -
    head flung back, a gout of fire at the sky, wings thrown wide - then
    his legs buckle and he drops onto his belly, rolls onto his side
    with a crash and a burst of dust, his wings fall limp, his head
    sinks and his jaw falls slack. The Last Fire drains away over 5 s.
    He is put back together when the run resets.
    THE HOARD: real treasure instead of stacked blocks - five new models:
      hoard_pile.glb    mounds of coins, gems and goblets (x6)
      hoard_chest.glb   open chests brimming with gold (x6)
      hoard_pillar.glb  fluted stone pillars banded in gold (x4)
      hoard_plinth.glb, hoard_crown.glb  the jewelled crown, turning on
                        its plinth
    HIS PAWS: his legs swung stiff from the hip, so his big paws (3.3 m
    long) tipped with them - claws dug 1.3 m into the floor at one end of
    a step and pointed up at the other, as if breaking off. Each paw is
    now its own piece on an ankle joint: flat on the floor while planted,

    dragon_paw_fnegx/fposx/bnegx/bposx.glb). His steps are 24 degrees

  NEW IN v39 - THE WARDEN AND VYRATHAX WALK ON THEIR LEGS
  ------------------------------------------------------------
    Their legs were part of one solid body model, so they could only
    sway. They are cut apart now - seven new models (upload them):
        warden_torso.glb, warden_leg_negx.glb, warden_leg_posx.glb
        dragon_torso.glb, dragon_leg_fnegx.glb, dragon_leg_fposx.glb,
        dragon_leg_bnegx.glb, dragon_leg_bposx.glb
    (warden_body.glb and dragon_body.glb are no longer used.) Each cut
    is closed, and standing still they look exactly as before.
    Both walk with Gorehorn's system - each leg planted and sweeping
    back as fast as the ground goes by, then lifted and swung forward:
      THE STONE WARDEN - two legs, long heavy strides: 20 degrees each
        way on 7 m legs, one foot at a time, a stride every 2.5 s at his
        pace, his body dipping with each step and barely rolling, his
        arms swinging against his legs.
      VYRATHAX - four legs, Gorehorn's walk: one foot down at a time,
        back left, front left, back right, front right. Only on the
        ground; in the air his legs hang still.

  NEW IN v38 - THE WOLVES GALLOP
  ------------------------------------------------------------
    The Pack's wolves run with Gorehorn's gallop now: the back legs push
    off one just after the other, the front legs reach and land one just
    after the other (the same footfall order and 48-degree swing as his),
    each foot lifts as it swings forward, and the body rocks and bounds
    with every stride. Their old run was diagonal pairs see-sawing at a
    constant speed - a trot, stiff and even.
    It is played by each screen, not sent: every leg is its own loop,
    started at its own point in the stride (start-time - the way Sky
    Dragon keys its moves), so 16 wolves cost the network nothing more.
    v38b: at Gorehorn's rhythm - one stride every 0.56 s
    (HOUND_STRIDE_MS; alphas 0.62 s), with a bigger bound so each stride
    reads as a leap. Only while they run, as before.

  NEW IN v37 - HE CHARGES, NOT TELEPORTS
  ------------------------------------------------------------
    - CHARGES ARE RUN: Gorehorn's gore and every boss's charge at another
      tank used to be one glide - 10 to 24 m in a third of a second - so
      he seemed to vanish and reappear. Now the server runs the charge
      step by step: he gallops down his red lane (Gorehorn 22 m/s, the
      Warden 14, Vyrathax 18) with his legs in a full gallop, the lane
      stays red until he's through, and he hits whoever he actually runs
      into (CHARGE_REACH) - not the whole lane the moment it fires.
    - THE MAW'S SIGNS ARE GONE: the Maw's gate has no stone frame, so its
      two signs hung in mid-air, one in front of the other, half inside the
      throat's ceiling - nothing on them could be read. The clock over the
      campfire and the camp board say when the Maw opens.
    - BIGGER STRIDES for Gorehorn and the bulls: legs swing 32 degrees
      walking (was 24) and 48 galloping (was 38), and lift higher.

  NEW IN v36 - SIGNS, WALKS, WALLS, AND THE LAST FIRE
  ------------------------------------------------------------
    SIGNS: every label's text is sized with Sky Dragon's proven rule
      (min 80 x height, 118 x width / letters). The old rule let long
      lines run past their board, so words were cut off or wrapped into
      the line below. Checked: no two signs overlap, and every letter on
      the map is at least 14 cm tall.
    WALKS (Sky Dragon v17's gait): Gorehorn and the stampede's bulls
      now really walk. Every tick each leg is either planted - sweeping
      back exactly as fast as the ground goes by - or lifted and swung
      forward; one foot at a time when walking (back left, front left,
      back right, front right), a gallop when running (his charges, the
      herd). The stride follows the distance travelled, so the legs slow
      and stop with him. The Stone Warden and Vyrathax have their legs
      built into one piece, so theirs stays body motion: longer, slower
      strides, far less side-to-side roll (that roll was the waddle),
      and eased, not linear, swings.
    WALLS: the rock tiles on the dressed rock walls are gone - the
      dressing already wears rock on every face, so each of those walls
      showed twice, one floating in front of the other (176 fewer models).
    THE LAST FIRE: real lava (two new models - upload them):
        lava_spill.glb  tongues of lava that climb the rim wall and pour
                        over it during the roar
        lava_flood.glb  a crusted, glowing lava field that floods in
                        from the wall and creeps inward over 12 s
                        (INFERNO_FLOOD_MS), turning slowly as it flows
      It only burns where it has reached. A red line marks where it
      stops (41 m from the middle), and lava bubbles as it comes.

  NEW IN v35 - THE MARKER OVER YOUR HEAD STAYS PUT
  ------------------------------------------------------------
    BUG: the oath, pips and heals over a player's head could vanish.
      - standing still for 9 s hid them (the floor only reports you while
        you move). Now anyone still standing on the floor keeps them.
      - once hidden, they stayed hidden if you came back at the very same
        spot - the marker was only put back when you moved. Now it is
        always put back.

  NEW IN v34 - YOUR OATH STAYS YOURS
  ------------------------------------------------------------
    BUG: players lost their oath after a fight. The game forgets anyone
    it hasn't heard from in 60 s (to tidy away markers of people who
    left) - and the floor only reports you while you MOVE, so anyone who
    stood still for a minute between fights was forgotten, and came back
    unsworn. Now:
      - nobody still standing on the floor is forgotten, however still;
      - every oath is remembered for the whole session (SWORN), so even
        someone who is forgotten gets their oath back the moment the
        floor sees them again. Only an oath stone changes it.

  NEW IN v32 - PULSES YOU CAN SEE
  ------------------------------------------------------------
    The pulse rings set only their END size and relied on each screen's
    glide to animate - where that didn't happen, the ring jumped straight
    to 2.5 m (hidden inside the boss) or to 66 m (outside the arena walls),
    and nobody saw a pulse at all. They were also too dark and thin to
    read on the new floors. Now the SERVER steps the rings and the star
    (PULSE_STEP_MS, ~8x a second; about 100 small updates per pulse), the
    shockwave stops just inside the arena edge, and the rings are taller
    (1.8 m / 1 m), thicker and a mid magenta - readable, still no glow,
    no light, nothing transparent.

  ------------------------------------------------------------
    What looked like a path was the stream: it started 28 m west of the

    - A flagstone path (WOOD_PATH) runs from the passage to the west gate,

    - The stream comes in and goes out through stone culverts with iron

    Rebuilt models: floor_stone.glb (the path) and dress_masonry.glb (the

  NEW IN v30 - EVERY WALL IS PART OF THE DUNGEON
  ------------------------------------------------------------
    DRESSING (USE_DRESS): 423 plain blocks now wear real stone - every

    Lighter than v29: 26% fewer objects drawn (3,382 -> 2,514) and 386

  NEW IN v27 - PULSES THAT LOOK LIKE A BLAST, AND A GENTLER SWARM
  ------------------------------------------------------------
    PULSES: the magenta floor blanket is gone. Two dim rings sweep in
      from the arena's edge and tighten onto the boss while the star over
      it swells; when it lands they race back out as shockwaves. No
      light, no flash, nothing transparent: 24 plain boxes per boss,
      hidden between pulses, one update per sweep. Same rules as before:
      no dodging, everyone in the arena loses a pip.
    SMALL PARTIES: the swarm was what beat them (bot fights: 70-90% of
      cagings). At half ease or more a swarm monster dies to one hit,
      bites 2.2x less often (EASY_ADD_BITE) and crumbles 1.8x sooner
      (EASY_ADD_LIFE). Bot fights, 3-4 players, v25 -> v27:
        Gorehorn  lost every time -> won in 1-3 min, 0-2 wipes
        the Pack  lost every time -> won in 1.5-4 min, 0-2 wipes
        Warden    lost every time -> won in 1.5-2 min, no wipes
        Vyrathax  lost every time -> won in 2.7-10 min, 0-3 wipes
      10+ players: unchanged (the ease is exactly 0).

  NEW IN v26 - SMALL PARTIES, AND HOUNDS THAT STAND STILL
  ------------------------------------------------------------
    - Fights scale to the party (EASY_* in TUNING). 4 or fewer sworn
      players: easiest; eases back to the full fight by 10. Set at the
      pull and held for the fight. At the easiest: boss health x0.4
      (hounds too, and 2 a wave), red warnings 35% longer, boss attacks
      40% less often, pulses 60% less often, enrage 50% later, swarms
      rarer and one smaller, big hits one pip less, a cage opens itself
      after 25 s (was 150), and pips trickle back mid-fight every 6 s.
      The camp board says when a party counts as small.
    - The Pack's hounds only run while they move (asleep or biting, they
      stand).

  NEW IN v25 - TOTEMS ONLY: THE EMBER BRAZIERS ARE GONE
  ------------------------------------------------------------
    DPS deal damage two ways now: SPELL TOTEMS (ranged) and the gold
    BACKSTAB ring (melee). Flames, braziers and the flame cubes over
    DPS heads are removed everywhere (bosses, hounds, the swarm).
    Tested with bot fights (3, 8 and 16 DPS, tanks holding, DPS on the
    totems). The flames had been about 80% of DPS damage, so:
      - Every brazier spot is a spell totem now: Gorehorn 8 totems (was
        4), the Warden 8 (was 5), Vyrathax +4, the Wolfwood 8 stones
        (was 5). With more to light, damage per DPS holds steady from 3
        to 16 DPS instead of collapsing in big parties.
      - Spells hit harder, per boss: GH_SPELL_DMG 240, WD_SPELL_DMG 200,
        DR_SPELL_DMG 165 (all were 60). Bot kill times match v24:
        Gorehorn ~2-2.5 min, the Warden ~3.5-4, Vyrathax ~6.5-7.5
        (without harpoons or backstabs, which still add on top).
      - The Wolfwood: 4 stones lit at once (PK_STONES_LIT, was 3), a zap
        deals 3 wounds (PK_STONE_WOUNDS, was 1), and a stone now reaches
        any hound in the wood. It used to stop at 80 m, so a pack held in
        a far corner could never be zapped - only flames saved that. Bot
        clears: 80-140 s (v24 with flames: ~100 s).
      - The swarm: DPS kill them from behind (two hits), tanks by
        charging - as before, minus the flame one-shot.
      - No glowing box eyes on the wolves: the Pack's hounds use the
        model's own eyes, and the ambush wolves lose their eye strip.

  ------------------------------------------------------------

    ambush on the bridge, a whole party (or one player testing alone)

    every sworn player out of the camp is caged and no boss fight is on,

    VYRATHAX
      - 60% more health (2100 + 2700 per DPS), heat pulses every 15 s.
      - THE LAST FIRE at 25%: he lands in the middle and ROARS (3 s,
        can't be hurt), and the lava lake floods the caldera. Its outer
        ring (past 41 m from the centre) goes red for 3 s, then turns to
        lava: anyone standing in it loses a pip every 1.5 s. Everybody
        fights in the inner circle from then on. He breathes, sweeps and
        buffets 30% faster, fire falls from the sky every 9 s, and the
        heat pulses every 8 s - the healers have to carry the finish.
    THE PACK
      - FOUR howls: west den, east den, both dens - then both dens again
        with TWO alphas leading. The dens howl every 25 s (was 30).

  NEW IN v20 - HEALING THAT KEEPS UP WITH A CROWD
  ------------------------------------------------------------
    Tested with 30-45 bots: pulses hit every player, and at one heal
    every 10 s no mix of healers could keep a crowd standing through
    Gorehorn. Now a healer gets a heal back every 5 s - and when
    healers are thin on the ground (more than 3.3 players each) it
    speeds up, down to 4 s at 4 or more players per healer. It never
    goes faster than 4 s, so a crowd of nearly all DPS still falls.

  NEW IN v19 - NO STEPPING OUT TO HEAL
  ------------------------------------------------------------
    Pips used to come back by themselves (one every 2 s) anywhere
    outside the arena of a fight in progress - so a hurt player could
    step out onto the bridge, fill up, and walk back in. Now, while ANY
    boss fight is on, nobody's pips come back by themselves, wherever
    they are standing. Only healers bring them back. Between fights
    (and during the regroup after a wipe) they refill as before.

  NEW IN v18 - EVERY TANK EARNS IT
  ------------------------------------------------------------
    A crowd of tanks used to be free: the boss hit only the nearest one
    and a hurt tank just stepped back for a fresh one. Now, for
    Gorehorn, the Warden and Vyrathax:
      1 HE TURNS ON ANOTHER TANK. Every 12-18 s he picks a different
        tank - any of them, near or far - and CHARGES: a red lane runs
        at them for 1.3 s, following them until the last half second,
        then he lunges down it (2 pips). He stays on that tank for 8 s
        whoever is closer. Swaps happen on HIS clock now.
      2 CLEAVE. Every front attack (gore, fists, breath) also drops a
        red disc on the SECOND-nearest tank, following them the same
        way the main attack follows its target (2 pips). Two tanks are
        always under fire - and tanks stacked together share the hit.
      3 TANK TAX. Every tank past the first 2 in the run adds 800 to
        each boss's health. A party of tanks pays for the safety.
    And stone crawlers take 3 hits (were 2).

  NEW IN v17 - TWO HITS TO KILL
  ------------------------------------------------------------
    Every small monster takes TWO hits now (gorelings, ambush wolves,
    lava imps and gorge spiders were one; stone crawlers were already
    two). A tank can't just run through a crowd one-shotting them: the
    first hit staggers it, and they have to turn and hit it again. A
    DPS needs two hits on its back too. A FLAME still kills one outright.

  NEW IN v16 - AMBUSHES WITH TEETH
  ------------------------------------------------------------
    - A TANK HAS TO CHARGE. A monster used to die the moment it touched
      a tank, so a tank standing still killed everything that came for
      it. Now a tank kills one only while ON THE MOVE (2 m/s or more,
      and not with it behind them). A tank that stands there gets bitten.
      (Same rule in boss fights - peel the swarm, don't wait for it.)
    - THE AMBUSHES COME IN WAVES, sized to the whole party (everybody
      out of the camp, not just whoever tripped it first):
        a wave  = the ambush's base + 1 per 3 people
        waves   = 2, or 3 with more than 12 people, 8 s apart
      30 people on the bridge: 3 waves of 13 spiders. Solo: 2 of 4.
    - They last 60 s (was 36), and there are more of them to go round:
      spiders 18 (was 8), crawlers 14 (was 9), imps 16 (was 10).

  NEW IN v15 - CAGES CATCH SPRINTERS (Kodaball v25's fix)
  ------------------------------------------------------------
    A cage used to drop with its walls OFF for 0.6 s, then snap to
    where the floor last saw you - so a sprinter was 5 m clear before
    it was solid, and its 3 chases landed behind them every time. Now,
    the way Kodaball's forcefields do it:
      - it is thrown AHEAD of a runner: their speed times how old the
        floor's last report is, plus 0.15 s (at most 4 m);
      - its walls are SOLID the moment it lands, 2.4 m out, and close
        in 0.15 m a step - less than an avatar is wide - so a closing
        wall pushes you inward, never out. Nobody else gets shut in:
        the walls open for anyone the floor says is standing there,
        even somebody standing dead still;
      - if the floor reports you clearly outside it, it re-lands ahead
        of you (0.3 s of lead), up to 12 times (was 3, with no lead).
    It looks exactly as it did.

  NEW IN v14 - NO JUMPING ANYTHING
  ------------------------------------------------------------
    v13 closed the jump trick for pulses only. Standing dead still and
    hopping in place still dodged a red circle, a lane, a bull or a bite
    (a still player may not be reported for a while, and a hop then read
    as "in the air"). Now EVERY hit reaches anyone seen on the floor in
    the last 4 s, jumping or not. Jumping never helps: in the air you
    are where you left the floor.

  NEW IN v13 - NO JUMPING THE PULSE
  ------------------------------------------------------------
    A jump timed on a pulse used to dodge it: anyone off the floor who
    hadn't reported for 1.2 s counted as "in the air" and couldn't be
    hit - and a player standing still may not report for a while. Pulses
    now land in the air too (anyone heard from in the last 4 s). Every
    other attack still misses you in the air.

  NEW IN v12 - THE MUSTER CLOCK
  ------------------------------------------------------------
    A big four-sided clock hangs over the campfire, readable from
    anywhere in the camp. In the lobby it reads THE MAW - SEALED. Once
    the host types 2601 it counts down the seconds to the gate - white,
    then AMBER from 5, RED from 3 - and the Maw's own gate signs count
    down with it. When the gate lifts the clock turns green: OPEN - GO.

  NEW IN v11 - THE PACK BITES BACK, GOREHORN EASES OFF (A LITTLE)
  ------------------------------------------------------------
    Tested with 30 bots: the Pack fell in about a minute whatever the
    party, and Gorehorn walled almost everyone. So:
    THE PACK
      - Hounds get tougher per DPS: +1 health per 4 DPS (was 8), alphas
        +1 per 3 DPS up to 12 (was per 6, up to 8). Small parties are
        unchanged - a solo tester meets the same 3 / 5 health hounds.
      - NO DOGPILING: a hound takes at most one touch-wound every 0.45 s,
        however many DPS run into it. Flame blows still land in full.
      - Hounds bite every 1.1 s (was 1.3).
    GOREHORN (a tiny bit)
      - Health 1000 + 1500 per DPS (was 1600).
      - The sand boils with 2 extra gorelings at half health (was 3).

  NEW IN v10 - PULSES YOU CAN SEE COMING
  ------------------------------------------------------------
    Pulses are MAGENTA, a colour used for nothing else. For the 2.2 s
    wind-up: the whole arena floor fills magenta (red means "get out" -
    magenta means "you can't"), a magenta star swells over the boss with
    a pillar of light, every boss board reads "PULSE! NO DODGING -
    EVERYONE LOSES A PIP", and the boss winds up:
      GOREHORN rears up and throws his head back - then slams down
      THE PACK - every hound throws its head back and howls
      THE WARDEN raises both fists, his heart and eyes burn magenta
      VYRATHAX flings his wings wide, opens his jaws, eyes magenta
    When it lands, a magenta shockwave rolls out over the arena.
    (No numbers changed.)

  NEW IN v8 - NO MERCY
  ------------------------------------------------------------
    - No cage opens by itself - not in a boss fight, not after an ambush.
      Only a healer's revive or a tank's key frees you (and a wipe, the
      end of the fight, 2603, leaving, or the 150 s backstop).
    - WIPE at 70%: with 11 or more people in an arena, when 70% of them
      are caged an 8 s countdown starts (10 or fewer: only when ALL of
      them are caged). Free enough of them and it stops ("SAVED!").
      Warnings you can't miss: four ALARM BEACONS round the arena glow
      AMBER from 50% caged and FLASH RED during the countdown, and every
      boss board shows "DANGER - 12 OF 30 CAGED - WIPE AT 21", then
      "WIPE IN 6 - FREE THE CAGED!".
    - ENRAGE: every boss board's name line counts down (GOREHORN 9:00,
      THE PACK 7:00, THE WARDEN 10:00, VYRATHAX 10:00). A minute out it
      warns you. At zero: pulses every 6 s and every boss attack takes one
      pip more. The board and the health bar turn red.

  NEW IN v7
  ------------------------------------------------------------
    - Healers carry THREE HEALS (green cubes over their head) and start
      full. One comes back every 10 s (the thin bar under the cubes).
      Run into a hurt ally: one pip per heal, one heal every 0.6 s - hold
      the touch and all three go in. Every 3rd heal, a pip for the healer.
    - Pulses every 20 s (Gorehorn and the Wolfwood 20, the hall 19, the
      caldera 18), a quarter sooner under half health.

  NEW IN v6 - HEALING IS SCARCE
  ------------------------------------------------------------
    - (Heal bar - replaced by three heals in v7, see above.)
    - ONE REVIVE per healer every 30 s - the white diamond beside the
      orb shows it is ready. Freed players come back on one pip.
    - (Pulse timings - changed again in v7, see above.)

  NEW IN v5
  ------------------------------------------------------------
    - Healers heal by TOUCH: run into a hurt ally (within 2.6 m). A green
      bolt jumps between you. (v6 made it one pip per full heal bar.)

  NEW IN v4 - HEALTH, HEALING, AND IT HURTS
  ------------------------------------------------------------
    - EVERYONE has health pips over their head: tanks 6, DPS 3, healers
      3. Green when full, amber when hurt, red on the last one (and the
      orb goes red). The last pip gone = CAGED. Out of a fight, a pip
      comes back every 2 s; in a fight, only healers bring them back.
    - HEALERS HEAL (by touch since v5 - see above). Anyone let
      out of a cage comes back on ONE pip: heal them before the next hit.
    - Almost every boss hit takes 2 pips now - gore, kick, bulls, fists,
      rocks, tail, fireballs, the ring attacks, the wheel. A DPS or healer
      survives ONE big hit; the next cages them unless a healer got there
      first. Bites, breath (each second you stand in it) and pulses take 1.
      The Warden's wrath takes 3.
    - PULSES - no dodging: Gorehorn BELLOWS, the Wolfwood HOWLS, the
      hall SHAKES, the caldera HEATS (in the air too) - timings in v6. The whole arena goes red for 2.2 s, then
      everyone in it loses a pip. Under half health they come a quarter
      sooner. Backstab while he bellows or shakes - he stands still.
    - A HEALTH BAR rides over Gorehorn, the Warden and Vyrathax.

  NEW IN v3 - THE THREAT IS REAL
  ------------------------------------------------------------
    - Attacks aimed at a tank FOLLOW them: Gorehorn's charge lane swings
      after its target, the Warden's fist disc slides after it, the
      dragon's breath turns with his head. Each LOCKS (the red flashes
      brighter) 0.7 / 1.0 / 0.7 s before it lands - move early or eat it.
    - The gold ring is hit on purpose: Gorehorn's rear kick every 7 s
      with 1 s warning, a new heel stamp from the Warden every 8 s, a
      wing buffet on the dragon's side every 8 s - and almost half the
      time one comes RIGHT AFTER a front attack, while you think he's busy.
    - THE WHEEL: keep stabbing and every 8-13 s he suddenly spins onto
      the ring and hits it (0.9 s of red). The ring vanishes until his
      tank has him turned back round.

  NEW IN v2
  ------------------------------------------------------------
    - DPS have two styles, on two kinds of totem round every arena:
      VIOLET SPELL TOTEMS (ranged: stand in the ring while it charges,
      then it hurls a spell) and EMBER BRAZIERS (melee: take a flame,
      up to 3, and run it into the boss - harder from behind). Neither
      needs a tank. The gold backstab ring is still there when one does.
    - THE SWARM: every fight throws small monsters at the DPS - goreling
      boars out of the sand, wolves over the Wolfwood walls, stone
      crawlers off the Warden's roof (and into his sanctuary pools),
      lava imps out of the lake at the harpoon crews. Purple on the
      ground first. Tanks walk into them; DPS hit their backs, or burn
      them with a flame. Healers can't fight them.
    - AMBUSHES on the way: spiders over the bridge parapets, crawlers
      off the vestibule roof, imps at the top of the Ember Stair.
    - Harder: more boss health, quicker attacks, a third Gorehorn rear,
      no small-party discount on the herd, 3 hounds a howl minimum.
    - 2607: HARD MODE on/off - x1.35 health, x1.5 swarms, 15% less
      warning on every red.
  ============================================================
  A co-op dungeon for 20-50 people. Three oaths, four bosses, one
  route about a kilometre long from a camp at the foot of a mountain
  to a dragon's hoard on top of it. Built on Kingdom Clash's engine:
  its guard, its floor pads, its cages, its keypads, its label cap.

  THE ROUTE
  ------------------------------------------------------------
    THE CAMP            campfire, tents, the rules board (east of the
                        fire), the live board (west), the three OATH
                        STONES, and the skull in the mountain: THE MAW
    BRIDGE OF CHAINS    120 m over a gorge with a waterfall
    THE GORE PIT        GOREHORN and his herd              (0, 262)
    THE WOLFWOOD        THE PACK - four howls of hounds   (-65, 410)
    THE WARDEN'S HALL   THE STONE WARDEN                   (-250, 410)
    THE EMBER STAIR     the one climb - 16 m up
    THE CALDERA         VYRATHAX, the Ember Dragon         (-245, 642)
    THE HOARD           the crown, and your time on the wall

  Every floor a fight happens on is flat and wide. Each boss's gate
  opens when it dies. A tall board over each arena shows its health
  and what it is doing.

  HOW TO PLAY
  ------------------------------------------------------------
    1  Stand in an OATH STONE's glowing circle: DPS, TANK or HEALER.
       Your oath turns over your head. Oaths lock once a run starts
       (the unsworn can still choose).
    2  The host types 2601. Ten seconds, then the Maw opens.
    3  Walk into each arena to wake its boss.
    4  Hit by a monster = CAGED. A healer running into your cage frees
       you. 70% of the arena caged (all of it, if 10 or fewer are there)
       = an 8 s countdown, then WIPE: the
       fight resets and the boss waits 10 s while you regroup.
    RED ON THE GROUND: it fills up, then it hurts - get out.
    GREEN ON THE GROUND: get in.
    PURPLE ON THE GROUND: something is about to climb out of it.
    GOLD RING BEHIND (or beside) A BOSS: DPS backstab from it.

  THE OATHS
  ------------------------------------------------------------
  DPS - the damage. Several ways, so there is always something to run to:
    SPELL TOTEMS (ranged). Violet stones round every arena. A lit one has
      a beam you can see from anywhere. Stand in its ring: the bar up its
      side fills (3.5 s alone, +50% for each friend, up to 3), then it
      hurls a spell (Gorehorn 240, the Warden 200, Vyrathax 165) and goes
      dark, and 3.5 s later a DIFFERENT one lights. Step out and the bar
      drains. More are lit the more DPS there are.
    BACKSTAB. While a TANK holds the boss, a gold ring sits behind it
      (beside the dragon). Stand in it: 14 every 1.5 s, at most 6 stabs
      a window however many crowd in. Every boss attacks the ring - a kick,
      a heel, a wing - often right after a front attack, and a boss stabbed
      for long enough WHEELS onto it. Watch for the red.
    THE HUNT (Wolfwood). A hound a tank is holding wears a GOLD collar:
      run into it to wound it. Red collars are hunting - run from them.
      The spirit stones are spell totems: charged, they deal 3 wounds to
      the nearest hound anywhere in the wood (4 stones lit at once).
    THE HARPOONS (Caldera). When Vyrathax flies, stand on a ballista's
      platform to charge it: 4 s alone, faster with up to 3 crew. Two
      hits (three with 12+ DPS) drag him down: stunned 9 s, x1.5 damage.
  TANK - six pips over your head (everyone has pips now: DPS and
    healers 3). A hit takes 1 or 2 pips; the last one gone cages you. Bosses go for any
    tank within 45 m, monsters within 20 m. Stand in a bull's lane and
    you stop it dead for one pip. Out of a fight your pips come back,
    one every 2 s. ONCE A RUN you can break a cage open by running into
    it - the gold key over your head. (A healer at the same cage opens
    it first, so the key isn't wasted.)
  HEALER - three heals, one back every 10 s. Run into a hurt ally: one
    pip per heal (0.6 s apart). Every 3rd heal, one comes back to you. One revive (run
    into a cage) every 30 s. Run into a cage: it opens (1.2 s between two), one pip back.

  THE BOSSES
  ------------------------------------------------------------
  GOREHORN. Charges a lane at whoever he is fighting (red lane in front,
    he lunges through it) and kicks behind him. At 66% and 33% he rears
    up at 75%, 50% and 25%: 17 m of red round him, 2.8 s to leave it.
    At half health the sand boils and the gorelings come. All fight long THE HERD
    comes out of the eight gates round the wall: a lane goes red for
    2.4 s, then a bull comes through it at 26 m/s. You can't outrun it -
    only leave the lane, or be a tank and stop it.
  THE PACK. Four howls: the west den, the east den, then both - then both
    again with two alphas leading - and
    from the second howl, more come over the walls. Then THE LAST HOWL:
    wolves over every wall at once; kill them all to win. Hounds
    run a shade slower than you. Tanks pull them in (gold), DPS finish
    them. Alphas take several wounds - the pips over them.
  THE STONE WARDEN. Slow. Raises both fists over his target: a red disc,
    2 s. Drops rocks on everyone else: red discs, 2.6 s. At 70% and 35%
    he calls SANCTUARY: the hall goes red, six green pools light, you
    have 8 s - and crawlers drop into the pools. Anyone outside a pool
    is caged (a tank loses 3 pips).
  VYRATHAX. On the ground: fire breath in a lane at his target - it
    burns on for 2 s - and a tail sweep behind. At 70% and 40% he takes
    off: fire runs across the whole caldera (2.6 s of red, then he comes
    down the lane breathing fire), fireballs on the crowd. Harpoon him
    down, or he lands by himself after 70 s with no stun. Imps crawl out
    of the lake after the harpoon crews.

  HOST CODES (any keypad, or TYPE CODE)
  ------------------------------------------------------------
    2601  in the lobby: start the run. In a run: press twice to stop.
    2602  reset everything. Every gate opens as THE WAY BACK so anyone
          still inside can walk home.
    2603  open every cage
    2604  the boss being fought dies now (or the next one, if none is)
    2605  reset the fight in progress - a clean retry
    2606  walkthrough: every gate open, every fight ready to wake
    2607  hard mode on / off (not mid-fight)
  Keypads: the camp, the end of the bridge, the Wolfwood's south door,
  the vestibule outside the hall, the top of the Ember Stair.

  TUNING THAT MATTERS
  ------------------------------------------------------------
  All in the TUNING block. Boss health is BASE + PER x the DPS in the
  run at the pull (at least 1, and every sworn DPS past the camp counts -
  an early pull can't make a boss easy):
    GOREHORN 1000 + 1500 n,  WARDEN 1000 + 1500 n,  VYRATHAX 1300 + 1700 n
  The Pack sends 3 hounds a howl up to 18 people, then 4 (hound health
  3 + 1 per 4 DPS, alphas 5 + 1 per 3 DPS up to 12). A swarm is
  2 + 1 per 5 people in the arena (7 at most), every 13-21 s from 14 s in.
  CAGE_MAX_S (150) is the mercy backstop; being let out by it gives the
  same 3.5 s of safety as a healer does. DETAIL 0.5 thins the scenery.

  TESTED IN A SIMULATION, NOT YET IN OTHERSIDE
  ------------------------------------------------------------
  v2 ran in the same node harness (fake page, fake clock, bots that pick
  oaths and styles, dodge red 75-85% of the time, grab flames, charge
  spells, man harpoons, peel the swarm, heal). Parties of 8 to 40
  cleared every fight with 0 script errors and no NaN written. Bot
  fights took roughly GOREHORN 3-6 min, THE PACK 1-1.5, THE WARDEN
  2.5-5, VYRATHAX 2.5-5. Bots under 5 wipe a lot - they did on v1 too,
  and people found v1 easy with 2, so small parties are the thing to
  try for real.
  Bots are not people. Things only a real session can show:
    - a player standing dead still: does the floor keep reporting them?
      (live() treats anyone on a pad as present for up to 9 s either way)
    - monsters move 10 times a second with a 140 ms glide - smooth, or
      steppy like bulldog's long glides?
    - how the red telegraphs read on the sand and on the black basalt
    - Gorehorn's 17 m stomp in 3 s and the breath at real run speed
    - frame rate with 50 avatars and every effect running

  PERFORMANCE
  ------------------------------------------------------------
    about 7,900 nodes (v1 6,400; the swarm is most of the rise), 691
    solid colliders, 270 labels all under LABEL_AREA, 7 lights. The 44
    swarm monsters' legs only animate while they are out (a parked one
    has its loops taken off), and they send their position 5 times a
    second, not 10.
    Everything that appears in a fight - telegraphs, bolts, rocks,
    bulls, cages - is pooled and built at load. Nothing is created
    mid-fight except a newly sworn player's emblem.

  IDEAS FOR NEXT VERSIONS
  ------------------------------------------------------------
    - TANK: a TAUNT pad by each boss - step on it to take aggro at once
    - HEALER: a once-a-fight burst that frees every cage within 8 m,
      charged by revives
    - a hard-mode code: telegraphs 25% shorter, bosses 30% tougher
-->

<script>
  // ==========================================================
  // GUARD - nothing in an event or a timer can take the script down
  // (Kingdom Clash's guard, unchanged)
  // ==========================================================
  let scriptErrors = 0;
  let lastError = "";
  function guard(fn) {
    return function (a, b) {
      try { return fn.call(this, a, b); }
      catch (err) {
        scriptErrors++;
        lastError = String((err && err.message) || err).slice(0, 60);
      }
    };
  }
  function every(fn, ms) { return setInterval(guard(fn), ms); }
  function later(fn, ms) { return setTimeout(guard(fn), ms); }
  function on(node, type, fn) { node.addEventListener(type, guard(fn)); }
  function r3(n) { return Math.round(n * 1000) / 1000; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function hyp(a, b) { return Math.sqrt(a * a + b * b); }
  const PI = Math.PI, D2R = Math.PI / 180, R2D = 180 / Math.PI;
  function rng(seed) {
    let s = (seed * 2654435761) >>> 0 || 1;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const RND = rng(7);
  function pick(arr) { return arr[Math.floor(RND() * arr.length) % arr.length]; }

  // ==========================================================
  // TUNING - the numbers you will actually want to touch
  // ==========================================================
  // --- models (v22) --------------------------------------------
  // Every .glb sits in ONE online folder. Put its address here, ending in /
  // e.g. "https://yourname.github.io/yourrepo/emberhold/"
  //  or  "https://cdn.jsdelivr.net/gh/yourname/yourrepo@main/emberhold/"
  const ASSET_BASE = "https://dinopawnz.github.io/emberhold/";
  const USE_MODELS = true;     // false = the original boxes everywhere
  // v42: the lighter copies of the heaviest models REPLACED the originals in
  // ASSET_BASE (same file names). LOW_POLY only adds "?v=lp42" to those links so
  // no player's game keeps showing a cached full-size copy.
  const LOW_POLY = true;
  const LOW_POLY_FILES = new Set(["flame_fire.glb", "flame_red.glb", "flame_blue.glb", "flame_green.glb", "maw_skull.glb", "lava_spill.glb", "lava_flood.glb", "dragon_torso.glb", "gorehorn_body.glb", "warden_torso.glb", "dragon_wing_negx.glb", "dragon_wing_posx.glb", "dragon_tail.glb", "hoard_pillar.glb", "hoard_pile.glb", "bull_body.glb", "bull_stone.glb"]);
  // v28: textured floors - six models (floor_earth/stone/sand/forest/hall/
  // basalt.glb) that each hold every floor area of their kind, laid at
  // their real positions. Six draw calls for the whole map's floor.
  // They are built for THIS map's layout: move a ground() and the floor
  // models need rebuilding. false = the old flat colours.
  const USE_FLOORS = true;
  // v30: DRESSING - plain static blocks (every wall's outside, tops and
  // ends, the bridge, the pit's stands, the hall roof, rock wall backs)
  // take their looks from two baked models: dress_masonry.glb (stone
  // brick sides, flagstone tops) and dress_rock.glb (basalt). The blocks
  // stay as invisible walls. Built for THIS layout, like the floors.
  const USE_DRESS = true;

  // --- host codes (any keypad, or TYPE CODE) ------------------
  const CODE_START = "2601";   // lobby: open the Maw. In a run: press twice to stop.
  const CODE_RESET = "2602";   // back to the camp: everything reset, gates shut
  const CODE_FREE  = "2603";   // open every cage
  const CODE_SKIP  = "2604";   // the boss you are fighting dies now
  const CODE_WIPE  = "2605";   // reset the fight you are in (a clean retry)
  const CODE_GATES = "2606";   // walkthrough: every gate open, every fight ready
  const CODE_HARD  = "2607";   // hard mode on / off (lobby or between fights)
  const CODE_TIMEOUT_S = 15;
  const MUSTER_S = 10;         // countdown before the Maw opens

    const f = box(p, x, y + 0.48 * k, z, 0.44 * k, 0.76 * k, 0.44 * k, FIRE_ORANGE, { ry: 45 });
    animD(f, "sy", 0.7, 1.3, 280 + RND() * 300);
    box(p, x, y + 0.56 * k, z, 0.22 * k, 0.5 * k, 0.22 * k, FIRE_HOT, { ry: 45 });
  }
  // a fire that always moves - the ones that set the mood
  // v33: a real flame - a cluster of flame tongues (flame_*.glb, 1 m tall at
  // scale 1) in a group sized w wide and h tall. It turns slowly and flickers.
  function flameFor(col) {
    return col === CLS[DPS].col ? "flame_red.glb" : col === CLS[TANK].col ? "flame_blue.glb"
      : col === CLS[HEALER].col ? "flame_green.glb" : "flame_fire.glb";
  }
  const FLAME_R = rng(97);             // its own dice: the map's other random spots don't move
  function flame(p, x, y, z, w, h, file, ry) {
    const g = group({ x: x, y: y, z: z, sx: w, sy: h, sz: w, ry: ry == null ? FLAME_R() * 360 : ry }, p);
    const f = glbModel(g, file || "flame_fire.glb");
    const turn = FLAME_R() < 0.5 ? 360 : -360;
    anim(f, "ry", 0, turn, 5200 + FLAME_R() * 2600, false);
    anim(f, "sy", 0.84, 1.1, 260 + FLAME_R() * 160);
    return g;
  }
  function brazier(p, x, y, z, k, hot) {
    k = k || 1;
    if (USE_MODELS) {                    // v33: an iron bowl of coals with a real flame in it
      RND(); RND();                      // (the box fire's two draws - keeps every later random spot where it was)
      glbModel(p, "brazier.glb", { x: x, y: y, z: z, sx: k, sy: k, sz: k, ry: FLAME_R() * 90 });
      flame(p, x, y + 1.55 * k, z, 1.75 * k, 1.9 * k, flameFor(hot));
      return;
    }
    box(p, x, y + 0.6 * k, z, 0.5 * k, 1.2 * k, 0.5 * k, IRON, { ry: 45 });
    box(p, x, y + 1.35 * k, z, 1.9 * k, 0.5 * k, 1.9 * k, IRON);
    box(p, x, y + 1.5 * k, z, 1.5 * k, 0.3 * k, 1.5 * k, "#1a0d06");
    const a = box(p, x, y + 2.3 * k, z, 1.4 * k, 1.6 * k, 1.4 * k, hot || FIRE_ORANGE, { ry: 45, opacity: 0.85 });
    anim(a, "sy", 0.65, 1.3, 330 + RND() * 200);
    const b = box(p, x, y + 2.2 * k, z, 0.8 * k, 1.4 * k, 0.8 * k, FIRE_HOT, { ry: 20 });
    anim(b, "sy", 0.6, 1.45, 240 + RND() * 160);
  }
  function rock(p, x, y, z, s, col, R, o) {
    const w = s * (0.8 + R() * 0.5), h = s * (0.6 + R() * 0.5), d = s * (0.8 + R() * 0.5);
    const rot = { ry: R() * 90, rx: (R() - 0.5) * 24, rz: (R() - 0.5) * 24 };
    if (!USE_MODELS) return box(p, x, y, z, w, h, d, col, withO(rot, o));
    if (o && o.collide === "true") box(p, x, y, z, w, h, d, "#000000", withO(withO({}, rot), { opacity: 0, collide: "true" }));
    return glbModel(p, "rock.glb", withO({ x: x, y: y, z: z, sx: w, sy: h, sz: d }, rot));
  }
  function pine(p, x, z, h, base, R, solid) {
    if (USE_MODELS) {
      const r1 = R(); R(); R();
      if (solid) box(p, x, base + h * 0.2, z, h * 0.06, h * 0.4, h * 0.06, "#000000", { opacity: 0, collide: "true" });
      glbModel(p, "pine.glb", { x: x, y: base, z: z, sx: h / 10, sy: h / 10, sz: h / 10, ry: r1 * 360 });
      return;
    }
    box(p, x, base + h * 0.2, z, h * 0.06, h * 0.4, h * 0.06, BARK, solid ? { collide: "true" } : {});
    [0.34, 0.57, 0.79].forEach((f, i) => {
      const w = h * (0.44 - i * 0.12);
      box(p, x, base + h * f, z, w, h * 0.27, w, i % 2 ? PINE_B : PINE_A, { ry: 45 + R() * 40 });
    });
    box(p, x, base + h * 0.96, z, h * 0.07, h * 0.12, h * 0.07, PINE_B, { ry: 45 });
  }
  function crystal(p, x, y, z, s, col, R) {
    const g = group({ x: x, y: y, z: z, ry: R() * 90 }, p);
    box(g, 0, s * 1.1, 0, s * 0.5, s * 2.4, s * 0.5, col, { ry: 45, opacity: 0.8 });
    box(g, s * 0.45, s * 0.7, s * 0.2, s * 0.35, s * 1.6, s * 0.35, col, { ry: 45, rz: -24, opacity: 0.8 });
    box(g, -s * 0.4, s * 0.6, -s * 0.25, s * 0.3, s * 1.3, s * 0.3, CRYSTAL_DK, { ry: 45, rz: 28 });
    return g;
  }
  function bones(p, x, z, base, R) {
    const g = group({ x: x, y: base, z: z, ry: R() * 360 }, p);
    box(g, 0, 0.12, 0, 1.6, 0.18, 0.18, BONE, { ry: 20 });
    box(g, 0.4, 0.12, 0.5, 1.2, 0.16, 0.16, BONE, { ry: -40 });
    box(g, -0.5, 0.25, -0.2, 0.5, 0.45, 0.55, BONE);      // a skull
    box(g, -0.5, 0.3, 0.07, 0.3, 0.12, 0.05, "#2a2218");
  }
  function banner(p, x, y, z, ry, col, h) {
    h = h || 6;
    const g = group({ x: x, y: y, z: z, ry: ry }, p);
    box(g, 0, 0, 0, 3.2, 0.2, 0.2, IRON);
    const cl = box(g, 0, -h / 2, 0.05, 2.8, h, 0.08, col);
    animD(cl, "rx", -4, 4, 2600 + RND() * 900);
    box(g, 0, -h / 2, 0.1, 2.9, 0.25, 0.1, GOLD);
    box(g, 0, -h * 0.35, 0.12, 1.1, 1.1, 0.06, GOLD, { rz: 45 });
    return g;
  }
  // a floor-standing sign on two posts. ry turns its face (+z) to the reader.
  function signpost(x, z, base, ry, title, sub, col) {
    const g = group({ x: x, y: base, z: z, ry: ry }, world);
    [-1, 1].forEach((a) => box(g, a * 4.6, 2.6, -0.2, 0.5, 5.2, 0.5, WOOD_DK));
    box(g, 0, 4.4, -0.25, 9.6, 3.2, 0.3, INK);
    box(g, 0, 4.4, -0.4, 10.1, 3.6, 0.12, col || GOLD);
    label(g, { y: 5.2, z: -0.05, width: 9, height: 1.3, color: INK, "font-color": col || GOLD, content: title });
    if (sub) label(g, { y: 3.75, z: -0.05, width: 9, height: 0.9, color: INK, "font-color": CHALK, content: sub });
    return g;
  }

  // a straight wall from (x0,z0) to (x1,z1). inside: a point on the side
  // the torches face. inv: an invisible collider this much taller.
  function wallSeg(x0, z0, x1, z1, o) {
    o = withO({ h: 10, base: 0, t: 2.4, col: MASON, dk: MASON_DK, lt: MASON_LT, pil: 16,
      torchEvery: 0, inside: null, rocky: false, crest: true, inv: 0, R: RND, face: null }, o);
    // v22: which model dresses the inside face (none for low rims)
    const face = !USE_MODELS || o.h < 4 || o.face === "none" ? "" : o.face || (o.rocky ? "rock" : "masonry");
    const dx = x1 - x0, dz = z1 - z0, L = hyp(dx, dz);
    if (L < 0.5) return null;
    const mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
    const g = group({ x: mx, y: o.base, z: mz, ry: headingDeg(dx, dz) }, world);
    // v24: behind rock tiles the wall is near-black, so any crack between
    // two bumpy tiles reads as a deep fissure, not a pale wall showing through
    const kind = face === "rock" || (!face && o.rocky) ? "rock" : "masonry";      // v30
    dress(box(g, 0, o.h / 2, 0, o.t, o.h, L, face === "rock" ? ROCK_GAP : o.col, { collide: "true" }), kind);
    if (o.inv) box(g, 0, o.h + o.inv / 2, 0, o.t, o.inv, L, "#000000", { opacity: 0, collide: "true" });
    dress(box(g, 0, 0.5, 0, o.t + 0.7, 1.0, L, o.dk), kind);
    if (o.crest) dress(box(g, 0, o.h + 0.35, 0, o.t + 0.6, 0.7, L + 0.3, face === "rock" ? ROCK_CAP : o.lt), kind);
    // which local side faces "inside"
    let side = 1;
    if (o.inside) {
      const sx = dx / L, sz = dz / L;
      side = ((o.inside[0] - mx) * sz + (o.inside[1] - mz) * -sx) >= 0 ? 1 : -1;
    }
    if (face) {
      const mw = face === "rock" ? 10 : 7.03, mh = face === "rock" ? 9.33 : 10;
      const rows = Math.max(1, Math.round(o.h / mh)), cols = Math.max(1, Math.ceil(L / mw));
      const rh = o.h / rows, cw = L / cols;
      // v24: rock tiles are bumpy and their edges don't match, so they
      // overlap: each is 8% wider than its cell, each row above hangs 10%
      // down over the one below, and neighbours sit 4 cm apart in depth
      const rock = face === "rock", ox = rock ? 1.08 : 1, oy = rock ? 0.1 : 0;
      // v30: a dressed masonry wall already wears the same stone on every face
      // v36: not on a dressed wall - the dressing already wears rock on every face, and the tiles
      // stood out in front of it: two walls, one floating in front of the other
      if (!USE_DRESS) for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const hang = r > 0 ? oy * rh : 0, lift = rock && (r + c) % 2 ? 0.04 : 0;
        glbModel(g, rock ? "wall_rock.glb" : "wall_masonry.glb", { x: side * (o.t / 2 + lift), y: r * rh - hang, z: -L / 2 + (c + 0.5) * cw,
          ry: side * 90, sx: (cw / mw) * ox, sy: (rh + hang) / mh, sz: 1 });
      }
    }
    if (o.pil && !face) {
      const n = Math.floor(L / o.pil);
      const off = (L - n * o.pil) / 2;
      for (let i = 0; i <= n; i++) {
        const s = -L / 2 + off + i * o.pil;
        dress(box(g, side * (o.t / 2 + 0.3), o.h / 2, s, 0.6, o.h, 1.8, o.dk), kind);
      }
    }
    if (o.torchEvery) {
      const n = Math.max(1, Math.floor(L / o.torchEvery));
      for (let i = 0; i < n; i++) {
        const s = -L / 2 + (i + 0.5) * (L / n);
        torch(g, side * (o.t / 2 + (face === "rock" && !USE_DRESS ? 1.9 : face ? 0.75 : 0.7)), Math.min(5.5, o.h - 1), s, 1.2, side * 90);   // v36: against the wall
      }
    }
    if (o.rocky && DETAIL > 0) {
      const n = Math.max(1, Math.round((L / 9) * DETAIL));
      for (let i = 0; i < n; i++) {
        const s = -L / 2 + (i + o.R()) * (L / n);
        rock(g, -side * (o.t * 0.4), o.h + 0.8 + o.R() * 1.6, s, 4 + o.R() * 3, o.R() < 0.5 ? ROCK : ROCK_DK, o.R);
      }
    }
    return g;
  }
  // a ring of chord walls, with gaps: [[angle deg, width m], ...].
  // Angle 90 is +z (north), 270 / -90 is -z (south).
  function ringWall(cx, cz, R, gaps, o) {
    o = withO({ chord: 12 }, o);
    const cuts = gaps.map(([a, w]) => {
      const c = ((a % 360) + 360) % 360 * D2R, hw = Math.asin(Math.min(0.99, w / 2 / R));
      return [c - hw, c + hw];
    }).sort((a, b) => a[0] - b[0]);
    const arcs = [];
    for (let i = 0; i < cuts.length; i++) {
      const s = cuts[i][1];
      let e = i + 1 < cuts.length ? cuts[i + 1][0] : cuts[0][0] + 2 * PI;
      arcs.push([s, e]);
    }
    if (!cuts.length) arcs.push([0, 2 * PI]);
    const pt = (a) => [cx + R * Math.cos(a), cz + R * Math.sin(a)];
    arcs.forEach(([s, e]) => {
      const n = Math.max(1, Math.ceil(((e - s) * R) / o.chord));
      for (let k = 0; k < n; k++) {
        const a0 = s + (k * (e - s)) / n, a1 = s + ((k + 1) * (e - s)) / n;
        const P = pt(a0), Q = pt(a1);
        wallSeg(P[0], P[1], Q[0], Q[1], withO(withO({}, o), { inside: [cx, cz], pil: 0 }));
        // a post on every joint seals the wedge between two chords
        dress(box(world, P[0], (o.base || 0) + (o.h + (o.inv || 0)) / 2, P[1], (o.t || 2.4) + 0.8,
          o.h + (o.inv || 0), (o.t || 2.4) + 0.8, o.dk || MASON_DK, { ry: -a0 * R2D, collide: "true" }), o.rocky ? "rock" : "masonry");
      }
      const E = pt(e);
      dress(box(world, E[0], (o.base || 0) + (o.h + 1.5) / 2, E[1], (o.t || 2.4) + 1.6, o.h + 1.5, (o.t || 2.4) + 1.6,
        o.lt || MASON_LT, { ry: -e * R2D, collide: "true" }), o.rocky ? "rock" : "masonry");
    });
  }

  // ---- gates: a portcullis with an invisible door in it --------
  const GATES = {};
  function makeGate(key, cx, cz, span, alongX, o) {
    o = withO({ h: 12, base: 0, sealed: "SEALED", frame: true }, o);
    const g = group({ x: cx, y: o.base, z: cz, ry: alongX ? 0 : 90 }, world);
    [-1, 1].forEach((a) => {
      box(g, a * (span / 2 + 1.6), (o.h + 4) / 2, 0, 3.2, o.h + 4, 4.4, MASON_DK, USE_MODELS ? { collide: "true", opacity: 0 } : { collide: "true" });
      if (!USE_MODELS) box(g, a * (span / 2 + 1.6), o.h + 4.5, 0, 4.2, 1.1, 5.2, MASON_LT);
      torch(g, a * (span / 2 + 1.6), 6, 2.9, 1.3, 0);
      torch(g, a * (span / 2 + 1.6), 6, -2.9, 1.3, 180);
    });
    if (!USE_MODELS) {
      box(g, 0, o.h + 2.2, 0, span + 6.4, 4.4, 4.2, MASON);
      box(g, 0, o.h + 0.2, 0, span + 1, 0.5, 4.6, MASON_LT);
    } else if (o.frame) glbModel(g, "gate_frame.glb", { sx: span / 24, sy: o.h / 12 });
    const bars = group({ y: 0 }, g);
    const barsLerp = lerpOn(bars, "y", 2600, "easeInOutQuad");
    if (USE_MODELS) glbModel(bars, "gate_bars.glb", { sx: span / 24, sy: o.h / 12 });
    else {
      const nb = Math.max(4, Math.round(span / 1.7));
      for (let i = 0; i < nb; i++) {
        const x = -span / 2 + (i + 0.5) * (span / nb);
        box(bars, x, o.h / 2, 0, 0.36, o.h, 0.36, IRON);
        box(bars, x, 0.25, 0, 0.5, 0.5, 0.5, IRON_LT, { ry: 45, rx: 45 });
      }
      [0.2, 0.5, 0.8].forEach((f) => box(bars, 0, o.h * f, 0, span, 0.34, 0.44, IRON));
    }
    const block = box(g, 0, (o.h + 3) / 2, 0, span, o.h + 3, 1.2, "#000000", { opacity: 0, collide: "true" });
    // v37: a gate with no frame (the Maw - the skull is its frame) has NO signs: its
    // two hung in mid-air, one in front of the other, half inside the throat's
    // ceiling so nothing on them could be read. The clock over the campfire and the
    // camp board already say when the Maw opens.
    const bare = USE_MODELS && !o.frame;
    const signs = bare ? [] : [1, -1].map((a) => label(g, {
      y: o.h + 2.2, z: a * (USE_MODELS && o.frame ? 2.6 : 2.18), ry: a > 0 ? 0 : 180, width: Math.min(span, 20), height: 2.4,
      color: INK, "font-color": GOLD, content: o.sealed,
    }));
    const G = { key: key, g: g, bars: bars, barsLerp: barsLerp, block: block, signs: signs, h: o.h,
      open: false, sealed: o.sealed };
    GATES[key] = G;
    return G;
  }
  function openGate(G, text) {
    if (!G) return;
    if (!G.open) {
      G.open = true;
      set(G.block, "collide", "false");
      glide(G.bars, G.barsLerp, 2600, { y: G.h + 1.6 }, "easeInOutQuad");
    }
    G.signs.forEach((s) => set(s, "content", text || "OPEN"));
  }
  function closeGate(G, text) {
    if (!G) return;
    G.open = false;
    set(G.block, "collide", "true");
    snap(G.bars, [G.barsLerp], { y: 0 });
    G.signs.forEach((s) => set(s, "content", text || G.sealed));
  }

  // ---- emblems: the sword, the shield, the cross ---------------
  function emblem(p, cls, k, col) {
    const g = group({}, p);
    col = col || CLS[cls].col;
    if (cls === DPS) {
      box(g, 0, 0.5 * k, 0, 0.18 * k, 1.5 * k, 0.06 * k, "#e2e7ee");
      box(g, 0, 1.28 * k, 0, 0.13 * k, 0.13 * k, 0.06 * k, "#e2e7ee", { rz: 45 });
      box(g, 0, -0.28 * k, 0, 0.8 * k, 0.14 * k, 0.14 * k, col);
      box(g, 0, -0.55 * k, 0, 0.13 * k, 0.45 * k, 0.13 * k, WOOD_DK);
      box(g, 0, -0.82 * k, 0, 0.2 * k, 0.2 * k, 0.2 * k, col, { ry: 45 });
    } else if (cls === TANK) {
      box(g, 0, 0, -0.04 * k, 1.0 * k, 1.2 * k, 0.08 * k, IRON_LT);
      box(g, 0, 0, 0.01 * k, 0.86 * k, 1.06 * k, 0.1 * k, col);
      box(g, 0, -0.62 * k, 0.01 * k, 0.6 * k, 0.6 * k, 0.1 * k, col, { rz: 45 });
      box(g, 0, 0.05 * k, 0.08 * k, 0.28 * k, 0.28 * k, 0.08 * k, GOLD, { rz: 45 });
    } else {
      box(g, 0, 0, 0, 0.34 * k, 1.2 * k, 0.12 * k, col);
      box(g, 0, 0.12 * k, 0, 1.0 * k, 0.34 * k, 0.12 * k, col);
      box(g, 0, 0.12 * k, 0.05 * k, 0.16 * k, 0.16 * k, 0.1 * k, "#eafff0", { rz: 45 });
    }
    return g;
  }

  // ==========================================================
  // LIGHT - seven lamps for the whole route

  el("m-light", { type: "point", x: 0, y: 14, z: 0, intensity: 34, distance: 70, color: "#ffb35a" });
  el("m-light", { type: "point", x: 0, y: 34, z: 262, intensity: 30, distance: 95, color: "#ffc27a" });
  el("m-light", { type: "point", x: -65, y: 30, z: 412, intensity: 22, distance: 110, color: "#b9ffcf" });
  el("m-light", { type: "point", x: -250, y: 24, z: 410, intensity: 30, distance: 95, color: CRYSTAL });
  el("m-light", { type: "point", x: -245, y: 44, z: 642, intensity: 36, distance: 120, color: "#ff7a3a" });
  el("m-light", { type: "point", x: -245, y: 28, z: 752, intensity: 30, distance: 60, color: GOLD });
  el("m-light", { type: "point", x: 0, y: 11, z: 44, intensity: 26, distance: 75, color: "#ff7a3a" });   // v24: the Maw's mouth

  // ==========================================================
  // THE FAR MOUNTAINS AND THE VOLCANO
  // ==========================================================
  {
    const R = rng(11);
    const n = Math.round(18 * Math.max(0.5, DETAIL));
    for (let i = 0; i < n; i++) {
      const a = (2 * PI * i) / n + R() * 0.2;
      const d = 760 + R() * 260;
      const x = -120 + Math.cos(a) * d, z = 360 + Math.sin(a) * d * 0.9;
      const h = 160 + R() * 180;
      const mc = R() < 0.5 ? "#23262c" : "#1c1e24", mry = R() * 90, cry = R() * 90;
      // v30: far peaks are rock (flat cubes read as pale walls in the fog), no pale caps
      if (USE_MODELS) {
        glbModel(world, "rock.glb", { x: x, y: h * 0.35, z: z, sx: h * 1.3, sy: h * 1.1, sz: h * 1.3, ry: mry });
        glbModel(world, "rock.glb", { x: x, y: h * 0.85, z: z, sx: h * 0.5, sy: h * 0.55, sz: h * 0.5, ry: cry });
      } else {
        box(world, x, h * 0.18, z, h, h, h, mc, { rx: 45, rz: 35, ry: mry });
        box(world, x, h * 0.18 + h * 0.6, z, h * 0.26, h * 0.26, h * 0.26, "#8f98a5", { rx: 45, rz: 35, ry: cry });
      }
    }
    // Vyrathax's mountain, behind the caldera, smoking
    const V = group({ x: -245, z: 1040 }, world);
    if (USE_MODELS) {                      // v30: a mountain of rock, not three stacked blocks
      glbModel(V, "rock.glb", { y: 45, sx: 380, sy: 130, sz: 340, ry: 8 });
      glbModel(V, "rock.glb", { y: 128, sx: 250, sy: 110, sz: 230, ry: 26 });
      glbModel(V, "rock.glb", { y: 190, sx: 150, sy: 60, sz: 140, ry: 44 });
    } else {
      box(V, 0, 50, 0, 340, 100, 300, "#1b1716", { ry: 8 });
      box(V, 0, 130, 0, 230, 80, 210, "#231d1b", { ry: 26 });
      box(V, 0, 190, 0, 140, 50, 130, "#2b2320", { ry: 44 });
    }
    const crater = box(V, 0, 216, 0, 90, 4, 80, LAVA, { ry: 44 });
    anim(crater, "opacity", 0.7, 1, 1800);

  function buildKeypad(x, z, base, ry) {

        face.setAttribute("collide", "true");
        let last = 0;
        const hit = () => { const now = Date.now(); if (now - last < 180) return; last = now; press(key, cap); };
        on(cap, "click", hit);
        on(face, "click", hit);
      });
    });
    const wrap = document.createElement("m-prompt");
    wrap.setAttribute("message", "Host code");
    wrap.setAttribute("placeholder", "code");
    g.append(wrap);

  }
