<!--
  PLAYER CATAPULT  v9
  ============================================================
  v9: A FIRE BUTTON. A red FIRE button on the control panel, under the
  LOFT row: click it (or use its interact prompt) and the catapult
  throws straight away - with whoever is in the bucket, or empty. It
  also cuts a countdown short. Stepping into the bucket no longer fires
  it - ONLY the FIRE button does (AUTO_FIRE = true in SETTINGS below
  brings back the 3-second auto-fire).
  One catapult (the same one as in Gray Ashlar Castle Battle) that flings
  PLAYERS. Place it anywhere on the ground. It throws towards its FRONT
  (the side away from the bucket) - turn the whole document to aim it,
  and leave a big open space in front of it.

  YOU RIDE IN THE BUCKET. The catapult is bigger (SCALE) so a person
  fits in the bucket. Jump into the bucket from the back. After 3 seconds
  in it, the arm swings up in one smooth motion with you in the bucket
  and flings you over the top at the release point.
  v8: A CONTROL PANEL, like the ones in the castle game, standing to the
  right of the catapult (behind it, facing you as you walk up):
    AIM LEFT / AIM RIGHT  turn the catapult 5 degrees
    POWER - / POWER +     how hard it throws (100% = v7's 170 m/s)
    LOFT - / LOFT +       how high it throws (50% = v7's 42 degrees)
  Use the interact prompt (or click the words). The panel ignores presses
  while a throw is under way. (v9 adds a FIRE button - see above.)
  v7: DOUBLE v6's SPEED: 170 m/s (about four times v6's distance, if
  Otherside lets you keep it all). Same 30 m carry, which now takes under
  0.2 s.
  v6: EVEN FURTHER. Same 85 m/s throw as v5 (which went about twice as
  far as v4), but the invisible floor now carries you CARRY_M = 30 m along
  the throw (a third of a second - it still feels like one launch) before
  it vanishes, so you start your flight about 10 m further out and 9 m
  higher up than in v5.
  v5: THROWS TWICE AS FAR. Distance goes with the square of the launch
  speed, so the speed is up by the square root of 2: 60 -> 85 m/s. The
  floor also carries you a little further before letting go, so it still
  lets go about 0.2 s after the release point, as before.
  v4: THE BUCKET TIPS FORWARD as it swings up, like the castle's catapults
  (v3 kept it upright the whole way, so it never looked like it threw
  anything), and the arm speeds up through the swing the same way theirs
  does, then slams to a stop. Your invisible floor rides with the tipping
  bucket but stays flat, so you stay on it until you're thrown.
  v3: no crates. The swing is one smooth animation (v2 was built from
  pieces that could arrive late and skip ahead), it starts LEAD_MS after
  the countdown so it reaches everyone in time to play from the start,
  and the invisible floor follows the bucket's exact curve.

  HOW IT WORKS (found with the Launch Lab): an invisible floor inside
  the bucket is moved by animations - up with the bucket, then out at
  full speed - and a moment later it vanishes from under you while still
  moving. Otherside hands you its speed and you fly on your own.

  SETTINGS TO TRY
  * The panel's POWER range: SPEED_MIN / SPEED_MAX (m/s)
  * The panel's LOFT range: ANGLE_MIN / ANGLE_MAX (degrees)
  * What it's set to when the document starts: START
  * If you change SCALE here, change sx/sy/sz on the "yaw" group to match
-->

  // ==========================================================
  // SETTINGS
  // ==========================================================

  const SWING_MS = 350;               // the arm swings up (with you in the bucket) over this long

  const LEAD_MS = 500;                // the swing is sent this far ahead, so it plays from the very start for everyone
  const SCALE = 1.8;                  // must match sx/sy/sz on the "yaw" group above
  const AUTO_FIRE = false;            // v9: false = ONLY the FIRE button throws it; true = stepping into the bucket fires it after COUNT_S

  const arm = document.getElementById("arm");
  const sling = document.getElementById("sling");
  const cw = document.getElementById("counterweight");

  const r3 = (v) => Math.round(v * 1000) / 1000;
  function el(tag, attrs, parent) {
    const n = document.createElement(tag);
    if ((tag === "m-cube" || tag === "m-cylinder" || tag === "m-label") && !(attrs && attrs.collide !== undefined)) n.setAttribute("collide", "false");
    for (const k in attrs) n.setAttribute(k, typeof attrs[k] === "number" ? String(r3(attrs[k])) : String(attrs[k]));
    (parent || rootEl).appendChild(n);
    return n;
  }
  function set(n, k, v) { const sv = typeof v === "number" ? String(r3(v)) : String(v); if (n.getAttribute(k) !== sv) n.setAttribute(k, sv); }
  function guard(fn) { return function () { try { return fn.apply(this, arguments); } catch (e) { console.log("catapult:", e && e.message); } }; }
  const on = (n, t, fn) => n.addEventListener(t, guard(fn));
  const idOf = (e) => (e && e.detail && e.detail.connectionId !== undefined ? e.detail.connectionId : null);
  const T0 = Date.now();
  function docNow() {
    try { if (document.timeline && typeof document.timeline.currentTime === "number") return document.timeline.currentTime; } catch (e) {}
    return Date.now() - T0;
  }

  const PIVOT_Y = 2.6, ARM_R = 1.9, IN_Y = -0.3, IN_Z = 0.62;    // bucket floor sits 0.3 below the sling, 0.62 along it
  const READY = 58, RELEASE = -60.4, FOLLOW = -78;
  const bucketAt = (a) => ({ y: SCALE * (PIVOT_Y - ARM_R * Math.sin(a * DEG) + IN_Y), z: SCALE * (ARM_R * Math.cos(a * DEG) + IN_Z) });
  const REST = bucketAt(READY);
  const BUCKET = 0.9 * SCALE;         // inside of the bucket

  const say = () => {};               // no sign

  // ---- THE INVISIBLE FLOOR IN THE BUCKET - moved ONLY by animations (that's what makes the launch work)
  // It hangs off its own (invisible) copy of the arm, so it follows the bucket's exact curve:
  // padArm swings like the arm, padSling tips like the bucket, level keeps the floor itself flat,
  // and fling throws it out at the top.
  // v8: everything that turns when you aim sits in "aimG": the catapult model and the pad's arm
  const aimG = el("m-group", {});
  aimG.appendChild(document.getElementById("yaw"));
  const padArm = el("m-group", { y: PIVOT_Y * SCALE, rx: READY }, aimG);

  const inBucket = el("m-group", { y: IN_Y * SCALE, z: IN_Z * SCALE }, padSling);
  const level = el("m-group", {}, inBucket);
  const fling = el("m-group", {}, level);
  const pad = el("m-cube", { y: -0.15, width: BUCKET, height: 0.3, depth: BUCKET, color: "#5a4020", visible: "false",
    collide: "true", "collision-interval": 100 }, fling);

  const onIt = new Map();
  let state = "idle", count = 0, anims = [], held = [];
  const heard = (id) => { if (id !== null) onIt.set(id, Date.now()); if (state === "idle" && AUTO_FIRE) startCount(); };
  on(pad, "collisionstart", (e) => heard(idOf(e)));
  on(pad, "collisionmove", (e) => heard(idOf(e)));
  on(pad, "collisionend", (e) => onIt.delete(idOf(e)));
  const anyone = () => { const now = Date.now(); let n = 0; onIt.forEach((t, id) => { if (now - t < 8000) n++; else onIt.delete(id); }); return n; };

  function startCount() { state = "count"; count = COUNT_S; say(String(count)); setTimeout(guard(countDown), 1000); }
  function countDown() {
    if (state !== "count") return;                        // v9: the FIRE button already threw it
    if (!anyone()) { state = "idle"; say(""); return; }   // stepped out: cancelled
    count--;
    if (count > 0) { say(String(count)); setTimeout(guard(countDown), 1000); return; }
    launch();
  }

  const panel = el("m-group", { x: PANEL_X, z: PANEL_Z });
  const readout = el("m-label", { content: "", width: 3.4, height: 0.5, "font-size": 15, color: "rgba(27,43,52,0)", "font-color": "#eff4ee",
    "cast-shadows": "false", clickable: "false", y: 3.02, z: 0.05 }, panel);
  const wrapYaw = (v) => { v = ((v + 180) % 360 + 360) % 360 - 180; return v === -180 ? 180 : v; };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function showSettings() {
    set(aimG, "ry", -settings.yaw);                  // positive aim turns right, as in the game
    const yt = (settings.yaw > 0 ? "+" : "") + settings.yaw.toFixed(0);
    set(readout, "content", "YAW " + yt + " deg     POWER " + settings.power.toFixed(0) + "%\n" + "LOFT " + settings.loft.toFixed(0) + "%");
  }
  function press(cmd) {
    if (state === "launch") return;                 // not while a throw is under way
    if (cmd === "yaw-minus") settings.yaw = wrapYaw(settings.yaw - 5);
    if (cmd === "yaw-plus") settings.yaw = wrapYaw(settings.yaw + 5);
    if (cmd === "power-minus") settings.power = clamp(settings.power - 10, 0, 100);
    if (cmd === "power-plus") settings.power = clamp(settings.power + 10, 0, 100);
    if (cmd === "loft-minus") settings.loft = clamp(settings.loft - 10, 0, 100);
    if (cmd === "loft-plus") settings.loft = clamp(settings.loft + 10, 0, 100);
    showSettings();
  }
  [["yaw-minus", "AIM LEFT", -0.89, 2.5], ["yaw-plus", "AIM RIGHT", 0.89, 2.5],
   ["power-minus", "POWER -", -0.89, 2], ["power-plus", "POWER +", 0.89, 2],
   ["loft-minus", "LOFT -", -0.89, 1.5], ["loft-plus", "LOFT +", 0.89, 1.5]].forEach(([cmd, word, x, y]) => {
    const btn = el("m-cube", { collide: "false", clickable: "true", x: x, y: y, z: 0.09, width: 1.62, height: 0.4, depth: 0.07, opacity: 0, color: "#a9c4d0", "cast-shadows": "false" }, panel);
    const img = el("m-image", { src: WORDS[word], width: 1.56, height: 0.33, x: x, y: y, z: 0.14, emissive: 1, collide: "false", clickable: "true", "cast-shadows": "false" }, panel);
    const it = el("m-interaction", { x: x, y: y, z: 0.2, range: 7, prompt: word, "in-focus": "false", "line-of-sight": "false" }, panel);
    on(btn, "click", () => press(cmd)); on(img, "click", () => press(cmd)); on(it, "interact", () => press(cmd));
  });
  // v9: THE FIRE BUTTON - a red button across the panel under the LOFT row.
  // Throws now (cuts a countdown short); ignored while a throw is under way.
  function fireNow() {
    if (state === "launch") return;
    launch();
  }
  {
    const x = 0, y = 0.95;
    const btn = el("m-cube", { collide: "false", clickable: "true", x: x, y: y, z: 0.07, width: 3.4, height: 0.5, depth: 0.08, color: "#a8321e", "cast-shadows": "false" }, panel);
    const img = el("m-image", { src: WORDS["FIRE"], width: 1.9, height: 0.4, x: x, y: y, z: 0.14, emissive: 1, collide: "false", clickable: "true", "cast-shadows": "false" }, panel);
    const it = el("m-interaction", { x: x, y: y, z: 0.2, range: 7, prompt: "FIRE", "in-focus": "false", "line-of-sight": "false" }, panel);
    on(btn, "click", fireNow); on(img, "click", fireNow); on(it, "interact", fireNow);
  }
  showSettings();

  // forward is -z (the way the castle catapults throw)
  const speedNow = () => Math.sqrt(SPEED_MIN * SPEED_MIN + (SPEED_MAX * SPEED_MAX - SPEED_MIN * SPEED_MIN) * settings.power / 100);   // distance goes up evenly with POWER
  const angleNow = () => ANGLE_MIN + (ANGLE_MAX - ANGLE_MIN) * settings.loft / 100;
  const drop = (a) => { if (a.parentNode) a.parentNode.removeChild(a); };
  const anim = (node, attr, a, b, t, ms, easing) => {
    const o = { attr: attr, start: a, end: b, duration: Math.max(1, Math.round(ms)), "start-time": Math.round(t), loop: "false" };
    if (easing) o.easing = easing;
    return el("m-attr-anim", o, node);
  };
  // The swing speeds up all the way (easeInCubic, like the castle). The visible arm carries on
  // past RELEASE to FOLLOW on the same curve, so it passes RELEASE exactly when the pad lets fly,
  // then stops dead. The bucket tips from upright to lined up with the arm by RELEASE.
  const EASE = "easeInCubic";
  const ARM_MS = SWING_MS * Math.cbrt((READY - FOLLOW) / (READY - RELEASE));
  function launch() {
    state = "launch"; say("");
    const v = speedNow(), ang = angleNow(), cy = Math.sin(ang * DEG), cz = -Math.cos(ang * DEG);
    const carryMs = CARRY_MS, flingMs = CARRY_MS + RUN_MS;
    const ts = docNow() + LEAD_MS, L = (v * flingMs) / 1000;
    anims = [
      // 1. up with the bucket: one smooth, speeding-up swing, READY -> RELEASE
      anim(padArm, "rx", READY, RELEASE, ts, SWING_MS, EASE),
      anim(padSling, "rx", -READY, 0, ts, SWING_MS, EASE),            // tips with the bucket...
      anim(level, "rx", 0, -RELEASE, ts, SWING_MS, EASE),             // ...but the floor stays flat
      // 2. at the release point: out over the top at full speed
      anim(fling, "y", 0, L * cy, ts + SWING_MS, flingMs), anim(fling, "z", 0, L * cz, ts + SWING_MS, flingMs),
      // the visible arm and bucket, and the counterweight (which stays hanging level)
      anim(arm, "rx", READY, FOLLOW, ts, ARM_MS, EASE),
      anim(sling, "rx", -READY, 0, ts, SWING_MS, EASE),
      anim(cw, "rx", -READY, -FOLLOW, ts, ARM_MS, EASE),
    ];
    held.forEach(drop); held = [];               // the "stay at home" anims from last time are no longer needed
    setTimeout(guard(letGo), LEAD_MS + SWING_MS + carryMs);
  }
  function letGo() {
    set(pad, "collide", "false");                  // gone from under you while still moving: you fly on
    onIt.clear();
    setTimeout(guard(reload), 2500);
  }
  function reload() {
    // bring everything home with NEW animations that end later than the throw's, so they win
    // even if Otherside keeps playing the old ones after they're removed
    const t0 = docNow() + 60;
    held = [
      anim(padArm, "rx", READY, READY, t0, 1), anim(padSling, "rx", -READY, -READY, t0, 1), anim(level, "rx", 0, 0, t0, 1),
      anim(fling, "y", 0, 0, t0, 1), anim(fling, "z", 0, 0, t0, 1),
      // wind the arm back down slowly
      anim(arm, "rx", FOLLOW, READY, t0, 1500, "easeInOutQuad"),
      anim(sling, "rx", 0, -READY, t0, 1500, "easeInOutQuad"),
      anim(cw, "rx", -FOLLOW, -READY, t0, 1500, "easeInOutQuad"),
    ];
    anims.forEach(drop); anims = [];
    setTimeout(guard(() => { set(pad, "collide", "true"); state = "idle"; say(""); }), 1700);
  }
})();
</script>
