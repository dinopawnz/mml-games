  // THE PENS (v7), all five moving parts decided in one place from
  // the phase and two clocks. Dinopawnz:
  //   "the 2nd floor pen is open when the game is not in session...
  //    stays open for the first 10 seconds of the game, it then
  //    closes permanently until the game concludes while the 1st
  //    floor pen is closed until the game starts and once the game
  //    starts, it stays open for the entire game but it closes again
  //    10 seconds after the game has ended."
  //
  //                        STANDBY  COUNT  LIVE<10s  LIVE  ended<10s
  //   upper doorway         open    SHUT    open     SHUT    open
  //   upper back            open    SHUT    SHUT     open    open
  //   upper floor          floor   floor   floor    DROPS   floor
  //   pen room doorway      SHUT    SHUT    open     open    open
  //   pen room back door    open    SHUT    SHUT     SHUT    open
  //
  // The two that are not in his list are what stop anybody being
  // locked out or locked in:
  //   * after the first ten seconds the upper floor drops away, so a
  //     latecomer who walks in the back of the pen falls into the pen
  //     room, crosses the strip, and is on the map. Nobody on the map
  //     can get back up - the hole is six metres over their heads.
  //   * the pen room has a back door to the outside that is open
  //     whenever a game is not live, so whoever is still in there
  //     when the doorway shuts walks out the back.
  // v8 - THE PEN ROOM IS A SEALED ROOM, NOT A WAY ONTO THE MAP.
  //   "when the game starts, i want the first floor pen to be
  //    enclosed. so everyone runs out of the 2nd floor pen and starts
  //    the game, after the 2nd floor pen is closed, the players who did
  //    not leave the room fall to the 1st floor pen and the ceiling is
  //    then closed off so the first floor pen remains an enclosed room."
  //
  //                     STANDBY  COUNT  LIVE 0-10s 10-11.5s LIVE 11.5s+ ended
  //   upper doorway      open    SHUT     open       SHUT      SHUT     open
  //   upper back         open    SHUT     SHUT       SHUT      SHUT     open
  //   upper floor       floor   floor    floor      DROPS     floor     floor
  //   pen room doorway   SHUT    SHUT     OPEN       OPEN      OPEN     SHUT
  //   pen room back door open    SHUT     SHUT       SHUT      SHUT     open
  //
  // The floor is open for HATCH_MS - long enough for everybody left
  // upstairs to land - then it comes back as the pen room ceiling.
  // Anybody who fell walks out of the pen room doorway onto the map,
  // which is open all game: "THE FIRST FLOOR PEN MUST ALWAYS BE OPEN
  // DURING A GAME OR PLAYERS CAN GET TRAPPED INSIDE!" When the game
  // ends the doorway shuts and the red back door opens, so anybody
  // inside walks out the back and up to the 2nd floor pen.
  // The upper back stays shut for the whole game: the floor only
  // drops once, so a latecomer let in later would be stuck upstairs.
  let liveSince = 0, endedAt = 0, penKey = "";
  function penTick() {
    const now = Date.now();
    const live = phase === "LIVE";
    const since = live ? now - liveSince : 0;
    const early = live && since < UPPER_OPEN_MS;
    const idle = phase === "STANDBY" || phase === "WIN";
    const upDoor = idle || early;
    const upBack = idle;
    const drop = live && !early && since < UPPER_OPEN_MS + HATCH_MS;
    // v8: the pen room doorway is OPEN FOR THE WHOLE GAME, so nobody
    // can be trapped in it, and shut the rest of the time. When the
    // game ends its red back door opens instead: out through the
    // corridor, round and up the stairs to the back of the upper pen.
    const lowFront = live;
    const lowBack = idle;
    const key = [upDoor, upBack, drop, lowFront, lowBack].join();
    if (key === penKey) return;
    if (penKey && live) {
      const was = penKey.split(",");
      if (was[0] === "true" && !upDoor) notice("PEN DOORS SHUT - ANYONE LEFT INSIDE DROPS TO THE PEN ROOM", 5000, CHALK);
      if (was[2] === "true" && !drop) notice("PEN FLOORS CLOSED", 3000, CHALK);
    }
    penKey = key;
    gates.forEach((g) => g.setAttribute("y", upDoor ? -40 : PEN_Y));
    backGates.forEach((g) => g.setAttribute("y", upBack ? -40 : PEN_Y));
    // v8: THE FLOOR IS ERASED IN PLACE, NEVER MOVED. v7 slid it down
    // to y -60, and a player standing on a moving floor is carried
    // with it - straight down under the map. Now it stays exactly
    // where it is: it just stops being solid and stops being drawn, so
    // anybody on it simply falls one storey. Then it comes back.
    hatches.forEach((h) => {
      h.setAttribute("visible", drop ? "false" : "true");
      (h.__solid || []).forEach((n) => n.setAttribute("collide", drop ? "false" : "true"));
    });
    lowFrontGates.forEach((g) => g.setAttribute("y", lowFront ? -40 : 0));
    lowBackGates.forEach((g) => g.setAttribute("y", lowBack ? -40 : 0));
  }
  function gateShut() { penTick(); }
  every(penTick, 250);

  // ==========================================================
  // THE MAP  -  "BASTION"  (v5, rebuilt from nothing)
  // ==========================================================
  // Dinopawnz: "the map is just awful for KodaBall. REDO THE MAP IN
  // ITS ENTIRETY... we dont want it to be like the capture the flag
  // one. we want little areas that can be defended well. we want
  // some corridors. we want some open space as well in the center.
  // think maps like guardian... recharge... heretic."
  //
  // What those three have in common, and what v2-v4 never had, is
  // that the map is a set of ROOMS joined by CORRIDORS around ONE
  // open fight. None of them is a ring round a hole. So:
  //
  //   * One open centre, MID, 80 x 44, open to the sky, the ball in
  //     the middle of it. Waist-high cover only, so it is always a
  //     fight and never a hide.
  //   * Every place worth holding the ball in is a small room with
  //     EXACTLY TWO WAYS IN. Hold one and you watch two doors.
  //   * Everything else is corridor: halls, lanes and an alley that
  //     join the rooms up, with no sightline longer than a room.
  //
  // Mirrored four ways. z is the team axis (RED -z, BLUE +z), x is
  // the side axis (GREEN -x, GOLD +x). Plan of one quarter:
  //
  //        x=0        20            40              62
  //   z=62 +--SPAWN---+----ALLEY----+.  (corner cut)
  //        |  (door)  |   ramp up-> |  .
  //        |  SPAWN   |             |   .
  //   z=42 |  HALL    +----+----+---+----+
  //   z=34 +-dr----dr-+ ROOM/TOWER  |    |
  //        |  UNDER   |    (2 lvls) | SIDE HALL
  //   z=22 +--open----+-dr----------+ (under the
  //        |   MID    |  LANE       |  WALK, with
  //        |  (ball)  |       ramp> |  the BUNKER
  //    z=0 +----------+-------------+  on top)
  //
  // TWO LEVELS. Ground (0) and the upper level (5.8):
  //   BASE     each team's deck, over their SPAWN HALL and UNDER.
  //            Its front edge is a balcony over mid.
  //   TOWER    a room on the upper level at each corner of mid,
  //            with a window slit looking straight down at the
  //            ball. Two doors: one to the BASE, one to the WALK.
  //            The best place on the map to hold the ball, and the
  //            one everybody knows about.
  //   WALK     a long deck down each side, over the SIDE HALL.
  //   BUNKER   a room in the middle of each WALK. Two doors, a
  //            slit over mid.
  //
  // THE FOUR KINDS OF HOLD, and what beats each one:
  //   TOWER    two doors, one window. Rush both doors at once, or
  //            drop out of the window when it goes wrong.
  //   BUNKER   two doors on the long walk - you see them coming,
  //            but so does everybody in mid.
  //   ROOM     the ground-floor corner rooms under each tower. Two
  //            doors, one from the spawn hall and one from the lane.
  //   HALL     the side halls: a split corridor, two lanes, cross
  //            walls. Slippery rather than strong.
  //
  // THE CLIMBS. Ten staircases:
  //   2 per base, out of mid onto the balcony
  //   1 per side, out of the lane onto the WALK, facing the bunker
  //   1 per corner, from the ALLEY onto the back of the base
  // So each base has four ways up and each walk has three (its ramp
  // and a tower at each end). Nothing on this map can be sealed.
  //
  // WHAT DID NOT CHANGE: the shell (smaller now), the pens, the
  // gates, the consoles, the ball and every rule. Spawn is where it
  // was, x 0 z 104 in the RED pen.
  const PAD_T = 0.36;
  const UP_Y = LEVEL_2;         // the second floor slab (6.8 since v6)
  const TOP_Y = LEVEL_3;        // the third floor slab
  const GROUND = PAD_T;
  const UPPER = UP_Y + PAD_T;   // walking height on the upper level
  const TOPPER = TOP_Y + PAD_T;
  const RIM_Y = TOP_Y;
  const RIMMER = TOPPER;

  const KERB = 0.34;
  const RAMP_RISE = 0.36;
  const BALL_HOME_R = 3.0;

  const DECKS = [];
  const NO_KERB = [];
  const RAMP_STEPS = [];
  const PILLARS = [];
  const ROOF_TOPS = [];         // walkable lids (none on this map)
  const ROOFS = [];             // [x0, x1, z0, z1, underside] - ceilings
                                // that are not decks, for the cages
  const PANES = [];
  const RAMPS = [];
  PEN_ROOMS.forEach(([x0, x1, z0, z1]) => ROOFS.push([x0, x1, z0, z1, PEN_ROOM_TOP]));

  function paint(tag, top, h, attrs) {
    return el(tag, Object.assign({ y: +(top - h / 2).toFixed(3), height: h }, attrs));
  }
  function reports(node, cx, cz, top, ry) {
    node.setAttribute("collide", "true");
    node.setAttribute("collision-interval", PAD_MS);
    listen(node, cx, cz, null, +top.toFixed(3), ry);
    return node;
  }
  function deck(x0, x1, z0, z1, y) {
    DECKS.push([x0, x1, z0, z1, y === undefined ? UP_Y : y]);
  }
  // run fn once per quarter / per team / per side. sx, sz are +-1.
  function quads(fn) { [-1, 1].forEach((sx) => [-1, 1].forEach((sz) => fn(sx, sz))); }
  function ends(fn) { [-1, 1].forEach((t) => fn(t)); }
  function span(s, a, b) { return s > 0 ? [a, b] : [-b, -a]; }

  // --- the plan, in numbers ---------------------------------
  const MID_X = 20, MID_Z = 22;     // mid proper (the lanes carry on to 40)
  const BASE_Z1 = 34;               // back of the UNDER / front of SPAWN HALL
  const ROOM_X0 = 20, ROOM_X1 = 40; // corner rooms and towers
  const ROOM_Z0 = 22, ROOM_Z1 = 42;
  const SIDE_X = 40;                // the side halls and walks start here
  const SIDE_Z = 40;                // and run to +-this
  const EDGE = OCT_A - 0.8;         // inner face of the outer wall
  const G_WALL = UP_Y - 0.9 - GROUND;  // a ground wall, floor to slab
  const U_WALL = TOP_Y - 0.9 - UPPER; // a tower wall, floor to the
                                    // underside of the third floor
  const U_DOOR = 4.2;               // door height up top
  const B_WALL = 4.8;               // a bunker wall, floor to its lid
  const WALL_T = 1.2;
  const WALL_COL = "#343b48";
  const WALL_UP = "#465063";
  const TRIM = "#242a34";

  // THE DECKS
  ends((t) => {
    const z = span(t, MID_Z, EDGE);
    deck(-MID_X, MID_X, z[0], z[1]);                 // BASE
  });
  quads((sx, sz) => {
    const x = span(sx, ROOM_X0, ROOM_X1), z = span(sz, ROOM_Z0, ROOM_Z1);
    deck(x[0], x[1], z[0], z[1]);                    // TOWER floor
  });
  [-1, 1].forEach((sx) => {
    const x = span(sx, SIDE_X, EDGE);
    deck(x[0], x[1], -SIDE_Z, SIDE_Z);               // WALK
  });
  // THE THIRD FLOOR (v6). Per team end it is a U: the two TOWER
  // TOPS, joined by the CROWN bridge over the back half of the base,
  // and a BRIDGE from each tower top back to the top of its CHUTE.
  // Red's third floor and blue's never touch - mid is between them.
  const CHUTE_X = 36;               // where the chute turns at the top
  const CORNER_X = OCT_DIAG - 1.3 - EDGE;  // how far the landing can
                                           // reach before the corner wall
  ends((t) => {
    const z = span(t, 36, ROOM_Z1);
    deck(-MID_X, MID_X, z[0], z[1], TOP_Y);          // CROWN
  });
  quads((sx, sz) => {
    const x = span(sx, ROOM_X0, ROOM_X1), z = span(sz, ROOM_Z0, ROOM_Z1);
    deck(x[0], x[1], z[0], z[1], TOP_Y);             // TOWER TOP
    const bx = span(sx, 34, CORNER_X), bz = span(sz, ROOM_Z1, 56);
    deck(bx[0], bx[1], bz[0], bz[1], TOP_Y);         // BRIDGE
    const lx = span(sx, CHUTE_X, CORNER_X), lz = span(sz, 56, EDGE);
    deck(lx[0], lx[1], lz[0], lz[1], TOP_Y);         // chute landing
  });

  // THE STAIRS. [x0, x1, z0, z1, lowEnd, axis, yLow, yHigh, rail]
  // lowEnd: -1 = bottom at x0/z0, +1 = bottom at x1/z1.
  quads((sx, sz) => {
    // mid up onto the balcony, climbing away from the ball
    const bx = span(sx, 13, MID_X), bz = span(sz, 5, MID_Z);
    RAMPS.push([bx[0], bx[1], bz[0], bz[1], sz > 0 ? -1 : 1, "z"]);
    // THE CHUTE (v6), in two flights against the back wall.
    // Flight 1: the alley floor up to the back corner of the base.
    const ax = span(sx, MID_X, CHUTE_X), az = span(sz, 50, 56);
    RAMPS.push([ax[0], ax[1], az[0], az[1], sx > 0 ? 1 : -1, "x"]);
    // Flight 2: turn round on the base and climb straight back out
    // along the wall to the third floor.
    const fz = span(sz, 56.4, EDGE);
    RAMPS.push([ax[0], ax[1], fz[0], fz[1], sx > 0 ? -1 : 1, "x", UP_Y, TOP_Y]);
  });
  [-1, 1].forEach((sx) => {
    // the lane up onto the walk, climbing outward
    const lx = span(sx, 23, SIDE_X);
    RAMPS.push([lx[0], lx[1], -5, 5, sx > 0 ? -1 : 1, "x"]);
  });

  // --- asking the map questions -----------------------------
  function deckUnder(x, z, y) {
    let best = null;
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      if (y === undefined) { if (!best || d[4] > best[4]) best = d; }
      else if (Math.abs(d[4] + PAD_T - y) < 1.2) return d;
    }
    return best;
  }
  function supportTop(x, z, y) {
    let best = 0;
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (d[4] >= y - 0.5) continue;
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      best = Math.max(best, d[4] + PAD_T);
    }
    return best;
  }
  // HOW MUCH AIR IS OVER THIS SPOT - decks, and the lids on the
  // towers and bunkers, so a cage never grows through a ceiling.
  const SLAB_UNDER = 1.04;
  function ceilingAt(x, z, y) {
    let low = Infinity;
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      const under = d[4] - SLAB_UNDER;
      if (under > y + 0.6 && under < low) low = under;
    }
    for (let i = 0; i < ROOFS.length; i++) {
      const r = ROOFS[i];
      if (x < r[0] || x > r[1] || z < r[2] || z > r[3]) continue;
      if (r[4] > y + 0.6 && r[4] < low) low = r[4];
    }
    return low;
  }
  function headroomAt(x, z, y) {
    const c = ceilingAt(x, z, y);
    return c === Infinity ? Infinity : c - y;
  }
  function onPillar(x, z, y, clear) {
    for (let i = 0; i < PILLARS.length; i++) {
      const p = PILLARS[i];
      if (p[3] < y + 0.5) continue;
      if (p[2] > y + 2.5) continue;
      if (Math.abs(x - p[0]) < clear && Math.abs(z - p[1]) < clear) return true;
    }
    return false;
  }
  function topsideAt(x, z, y) {
    for (let i = 0; i < DECKS.length; i++) {
      const d = DECKS[i];
      if (x < d[0] || x > d[1] || z < d[2] || z > d[3]) continue;
      if (y === undefined || Math.abs(d[4] - y) < 1.2) return true;
    }
    for (let i = 0; i < RAMPS.length; i++) {
      const r = RAMPS[i];
      if (x < r[0] - 0.3 || x > r[1] + 0.3 || z < r[2] - 0.3 || z > r[3] + 0.3) continue;
      if (y === undefined) return true;
      const yL = r[6] === undefined ? 0 : r[6];
      const yH = r[7] === undefined ? UP_Y : r[7];
      if (y >= Math.min(yL, yH) - 1.4 && y <= Math.max(yL, yH) + 1.4) return true;
    }
    return false;
  }

  // --- building it ------------------------------------------
  const mapRoot = el("m-group", {});

  // A STRAIGHT WALL WITH OPENINGS IN IT.
  // axis "x" runs along x at z = fixed; "z" runs along z at x = fixed.
  // gaps: [centre, halfWidth] doorways, absolute map coordinates.
  //   A doorway on the upper level gets a lintel above U_DOOR.
  // slits: [from, to, bottom, top] - a window, heights over the floor.
  function wallRun(axis, fixed, a0, a1, floor, h, gaps, slits, color) {
    const col = color || WALL_COL;
    const piece = (c0, c1, y0, y1) => {
      if (c1 - c0 < 0.3 || y1 - y0 < 0.1) return;
      const c = (c0 + c1) / 2, len = c1 - c0;
      el("m-cube", Object.assign(
        axis === "x"
          ? { x: +c.toFixed(2), z: fixed, width: +len.toFixed(2), depth: WALL_T }
          : { x: fixed, z: +c.toFixed(2), width: WALL_T, depth: +len.toFixed(2) },
        { y: +(floor + (y0 + y1) / 2).toFixed(3), height: +(y1 - y0).toFixed(3),
          color: col, collide: "true" }), mapRoot);
    };
    // cut the run at every opening, full height or partial
    const cuts = [];
    (gaps || []).forEach(([c, hw]) => cuts.push([c - hw, c + hw, 0, floor > 1 ? U_DOOR : h]));
    (slits || []).forEach(([c0, c1, b, tp]) => cuts.push([c0, c1, b, tp]));
    cuts.sort((p, q) => p[0] - q[0]);
    let at = a0;
    cuts.forEach(([c0, c1, b, tp]) => {
      piece(at, c0, 0, h);
      piece(c0, c1, 0, b);        // under the opening (a sill)
      piece(c0, c1, tp, h);       // over it (a lintel)
      at = c1;
    });
    piece(at, a1, 0, h);
  }
  // a column holding something up, remembered so cages dodge it
  function pillar(x, z, foot, top, w) {
    const s = w || 1.4;
    PILLARS.push([x, z, foot, top]);
    el("m-cube", {
      x: x, z: z, y: +((foot + top) / 2).toFixed(3), width: s, depth: s,
      height: +(top - foot).toFixed(3), color: TRIM, collide: "true",
    }, mapRoot);
  }
  // cover you can stand on. The cap is the top collider, so the cap
  // reports. [x, z, w, d, h, floorY, ry]
  const CAP_T = 0.14;
  // v8: THE SECOND-FLOOR PLATFORMS ARE A LITTLE BIGGER, so they are
  // easier to land on and give a bit more height to glide up to the
  // third floor from. Only blocks standing on the second floor grow.
  // Set both to 0 to put them back to v7's sizes.
  const UP_PLAT_GROW = 0.8;     // metres added to width and depth
  const BALCONY_RAISE = 0.5;    // v8: extra on the two balcony blocks over mid
  const UP_PLAT_RAISE = 0.6;    // metres added to height (was 0.4)
  const COVER = [];
  function block(x, z, w, d, h, floorY, ry, color) {
    if (floorY === UP_Y) { w += UP_PLAT_GROW; d += UP_PLAT_GROW; h += UP_PLAT_RAISE; }
    const surf = floorY ? floorY + PAD_T : GROUND;
    COVER.push([x, z, w, d, h, surf, ry || 0]);
    el("m-cube", {
      x: x, z: z, y: +(surf + h / 2).toFixed(3), ry: ry || 0,
      width: w, height: h, depth: d, color: color || "#3b414d", collide: "true",
    }, mapRoot);
    reports(el("m-cube", {
      x: x, z: z, y: +(surf + h + CAP_T / 2).toFixed(3), ry: ry || 0,
      width: w + 0.08, height: CAP_T, depth: d + 0.08, color: STEEL,
    }, mapRoot), x, z, surf + h + CAP_T, ry || 0);
  }
  // a lid: solid, not walkable, and a ceiling for the cages
  function roof(x0, x1, z0, z1, underside, color) {
    ROOFS.push([x0, x1, z0, z1, underside]);
    // v7: and it reports, so somebody on a bunker roof is tracked
    reports(el("m-cube", {
      x: (x0 + x1) / 2, z: (z0 + z1) / 2, y: underside + 0.35,
      width: x1 - x0, height: 0.7, depth: z1 - z0,
      color: color || CONCRETE,
    }, mapRoot), (x0 + x1) / 2, (z0 + z1) / 2, underside + 0.7);
  }
  function light(x, z, y, k, col) {
    el("m-light", {
      x: x, z: z, y: y, type: "point",
      intensity: k || 24, distance: 26, color: col || "#ffd9a8",
    });
  }
  function floorWord(x, z, y, text, rz, fg, w) {
    el("m-label", {
      x: x, z: z, y: +(y + 0.03).toFixed(3), rx: -90, rz: rz || 0,
      width: w || 12, height: 2.6, "font-size": 110, alignment: "center",
      color: "#111418", "font-color": fg || "#8d98a6", content: text,
    }, mapRoot);
  }

  // deck slabs, their kerbs
  DECKS.forEach(([x0, x1, z0, z1, dy]) => {
    const w = x1 - x0, d = z1 - z0, cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;
    el("m-cube", {
      x: cx, z: cz, y: dy - 0.45, width: w, height: 0.9, depth: d,
      color: CONCRETE, collide: "true",
    }, mapRoot);
    el("m-cube", {
      x: cx, z: cz, y: dy - 0.96, width: w - 1.2, height: 0.16, depth: d - 1.2,
      color: STEEL_DK,
    }, mapRoot);
    // the lip at every drop, left out wherever there is deck or a
    // staircase on the far side, and never against the outer wall
    [[0, -1], [0, 1], [-1, 0], [1, 0]].forEach(([nx, nz]) => {
      // v7: no lip on the third floor at all - Dinopawnz: "remove the
      // white railings from the third floor area... they limit movement"
      if (dy > UP_Y + 1) return;
      const edgeC = nx ? (nx < 0 ? x0 : x1) : (nz < 0 ? z0 : z1);
      if (Math.abs(edgeC) >= EDGE - 0.1) return;
      const along = nx ? d : w;
      const tiles = Math.max(1, Math.round(along / 2));
      const step = along / tiles;
      let run = -1;
      const flush = (end) => {
        if (run < 0) return;
        const c0 = (nx ? z0 : x0) + step * run;
        const c1 = (nx ? z0 : x0) + step * (end + 1);
        const len = c1 - c0, mid = (c0 + c1) / 2;
        const kx = nx ? (nx < 0 ? x0 + 0.2 : x1 - 0.2) : mid;
        const kz = nx ? mid : (nz < 0 ? z0 + 0.2 : z1 - 0.2);
        reports(el("m-cube", {
          x: +kx.toFixed(2), z: +kz.toFixed(2), y: dy + PAD_T + KERB / 2,
          width: nx ? 0.4 : +(len + 0.05).toFixed(2), height: KERB,
          depth: nx ? +(len + 0.05).toFixed(2) : 0.4, color: STEEL,
        }, mapRoot), kx, kz, dy + PAD_T + KERB);
        run = -1;
      };
      for (let i = 0; i < tiles; i++) {
        const tt = (nx ? z0 : x0) + step * (i + 0.5);
        const kx = nx ? (nx < 0 ? x0 + 0.2 : x1 - 0.2) : tt;
        const kz = nx ? tt : (nz < 0 ? z0 + 0.2 : z1 - 0.2);
        const gap = topsideAt(kx + nx * 1.3, kz + nz * 1.3, dy) ||
          RAMPS.some(([rx0, rx1, rz0, rz1]) =>
            kx > rx0 - 0.6 && kx < rx1 + 0.6 && kz > rz0 - 0.6 && kz < rz1 + 0.6);
        if (gap) { flush(i - 1); continue; }
        if (run < 0) run = i;
      }
      flush(tiles - 1);
    });
  });

  // ramps, tread by tread
  RAMPS.forEach(([x0, x1, z0, z1, lowEnd, axis, yL, yH]) => {
    const yLow = yL === undefined ? 0 : yL;
    const yTop = yH === undefined ? UP_Y : yH;
    const rise = yTop - yLow;
    const along = axis === "x" ? x1 - x0 : z1 - z0;
    const across = axis === "x" ? z1 - z0 : x1 - x0;
    const n = Math.max(4, Math.round(rise / RAMP_RISE));
    const run = along / n;
    for (let i = 0; i < n; i++) {
      const top = yLow + rise * (i + 1) / n;
      const c = lowEnd < 0
        ? (axis === "x" ? x0 : z0) + run * (i + 0.5)
        : (axis === "x" ? x1 : z1) - run * (i + 0.5);
      const attrs = axis === "x"
        ? { x: +c.toFixed(3), z: (z0 + z1) / 2, width: +(run + 0.06).toFixed(3), depth: across }
        : { x: (x0 + x1) / 2, z: +c.toFixed(3), width: across, depth: +(run + 0.06).toFixed(3) };
      RAMP_STEPS.push(Object.assign({ top: top }, attrs));
      el("m-cube", Object.assign({
        y: +((yLow + top) / 2).toFixed(3), height: +(top - yLow).toFixed(3),
        color: CONCRETE, collide: "true",
      }, attrs), mapRoot);
    }
    // a thin painted stripe up each side instead of a rail - rails
    // were something to catch a foot on and a place to stand
    const sides = axis === "x"
      ? [{ x: (x0 + x1) / 2, z: z0 + 0.25 }, { x: (x0 + x1) / 2, z: z1 - 0.25 }]

  // ==========================================================
  // GAME STATE
  // ==========================================================
  let phase = "STANDBY";      // STANDBY | LIVE | WIN
  let idSeen = false;         // has any collision come in WITH an id?
  let noIdHits = 0;           // collisions that came in without one

  let clockEnds = 0;
  let suddenDeath = false;
  let winner = 0;
  let flashUntil = 0;

  const players = new Map();  // connectionId -> player
  const PARK = -900;

  function teamName(t) { return homeName(t); }
  function other(t) { return -t; }

  // ==========================================================
  // PLAYERS - the floor says who is where
  // ==========================================================
  // Every collider a player can stand on reports their connection id
  // and the spot. That is the whole identity system.
  function player(id) {
    let p = players.get(id);
    if (!p) {
      p = {
        id: id, team: 0, x: 0, z: 0, y: GROUND, t: 0,
        vx: 0, vz: 0, ax: 0, az: 0, at: 0,
        pads: 0, offSince: 0, state: "free", carrying: 0,
        safeUntil: 0, lastTagAt: 0, marker: null, mx: 1e9, mz: 1e9, mAt: 0, shown: "",
        // the probe half: raw reading, when it came, the learned
        // offset, and how many readings have agreed with the floor
        gx: 0, gy: 0, gz: 0, gt: 0, ox: 0, oy: 0, oz: 0, cal: 0,
        gvx: 0, gvz: 0, lgx: 0, lgz: 0, lgt: 0,
      };
      players.set(id, p);
    }
    return p;
  }

  // kind: "start" | "move" | "end". wx, wz: world position (not for
  // end). wy: the height of the surface they are standing on, which is
  // how the game knows which floor somebody is on. Every pad knows its
  // own, so a player's height comes free with their position.
  function stepped(e, kind, wx, wz, wy) {
    const d = e && e.detail;
    const id = d ? d.connectionId : undefined;
    if (id === undefined || id === null) { noIdHits++; return null; }
    idSeen = true;
    const p = player(id);
    const now = Date.now();
    if (kind === "end") {
      p.pads = Math.max(0, p.pads - 1);
      if (!p.pads) p.offSince = now;
      return p;
    }
    if (kind === "start") p.pads++;
    else if (p.pads < 1) p.pads = 1;     // a lost start event
    p.offSince = 0;
    if (typeof wy === "number") p.y = wy;
    if (typeof wx !== "number" || isNaN(wx)) return p;
    p.x = wx; p.z = wz; p.t = now;
    const dt = (now - p.at) / 1000;
    if (dt >= 0.1) {
      if (dt < 1.2) {
        const vx = (wx - p.ax) / dt, vz = (wz - p.az) / dt;
        if (Math.hypot(vx, vz) < 20) {
          p.vx = p.vx * 0.35 + vx * 0.65;
          p.vz = p.vz * 0.35 + vz * 0.65;
        }
      } else { p.vx = 0; p.vz = 0; }
      p.ax = wx; p.az = wz; p.at = now;
    }
    return p;
  }

  // ==========================================================
  // THE PROBE - the only thing that can see you in the air
  // ==========================================================
  // ---- v8: THE FITTER ---------------------------------------
  // v7 assumed the probe differs from the map by a SHIFT (plus the
  // 180 degree build turn). If the world places this document turned
  // or mirrored, a shift can never line up and air tracking silently
  // never switched on. So instead: keep pairs of (probe reading, floor
  // position) from every player, and fit the best TURN + SHIFT (and
  // test a mirror) between them. Tried separately for the probe's
  // document frame and its element frame; the better one is used.
  // Nothing is trusted until the pairs are spread out enough to pin
  // the turn down and agree to within FIT_RMS_MAX.
  const FIT_KEEP = 300;         // pairs remembered per frame
  const FIT_MIN = 12;           // pairs needed before a fit counts
  const FIT_SPREAD = 3;         // metres the pairs must be spread over
  const FIT_RMS_MAX = 1.2;      // metres of disagreement allowed
  const PROBE_FRESH_MAX = 2500; // longest a reading is ever trusted for
  const GLIDE_LEAD_MAX = 12;    // metres a reading may be carried forward
  const FIT = {
    doc: { name: "DOC", pairs: [], at: 0, ok: false },
    el: { name: "EL", pairs: [], at: 0, ok: false },
  };
  let fitBest = null;
  function okPos(q) {
    return q && typeof q.x === "number" && typeof q.z === "number" && !isNaN(q.x) && !isNaN(q.z)
      ? { x: q.x, y: typeof q.y === "number" ? q.y : 0, z: q.z } : null;
  }
  function fitAdd(F, a, bx, by, bz) {
    F.pairs[F.at] = { ax: a.x, ay: a.y, az: a.z, bx: bx, by: by, bz: bz };
    F.at = (F.at + 1) % FIT_KEEP;
  }
  function solve(pairs, mirror) {
    const n = pairs.length;
    let max = 0, maz = 0, mbx = 0, mbz = 0, dy = 0;
    pairs.forEach((q) => {
      max += q.ax; maz += mirror ? -q.az : q.az; mbx += q.bx; mbz += q.bz; dy += q.by - q.ay;
    });
    max /= n; maz /= n; mbx /= n; mbz /= n; dy /= n;
    let sc = 0, ss = 0, spread = 0;
    pairs.forEach((q) => {
      const ax = q.ax - max, az = (mirror ? -q.az : q.az) - maz;
      const bx = q.bx - mbx, bz = q.bz - mbz;
      sc += ax * bx + az * bz;
      ss += ax * bz - az * bx;
      spread += ax * ax + az * az;
    });
    const th = Math.atan2(ss, sc), c = Math.cos(th), sn = Math.sin(th);
    const f = { c: c, s: sn, mirror: mirror, dy: dy,
      tx: mbx - (max * c - maz * sn), tz: mbz - (max * sn + maz * c),
      spread: Math.sqrt(spread / n), rms: 0 };
    let e = 0;
    pairs.forEach((q) => { const w = fitApply(f, q); e += (w.x - q.bx) ** 2 + (w.z - q.bz) ** 2; });
    f.rms = Math.sqrt(e / n);
    return f;
  }
  function fitApply(f, a) {
    const ax = a.ax !== undefined ? a.ax : a.x;
    const ay = a.ay !== undefined ? a.ay : a.y;
    const az0 = a.az !== undefined ? a.az : a.z;
    const az = f.mirror ? -az0 : az0;
    return { x: ax * f.c - az * f.s + f.tx, y: ay + f.dy, z: ax * f.s + az * f.c + f.tz };
  }
  function fitFrame(F) {
    const pairs = F.pairs.filter(Boolean);
    F.ok = false; F.n = pairs.length;
    if (pairs.length < FIT_MIN) return;
    let best = null;
    [false, true].forEach((m) => {
      let f = solve(pairs, m);
      // one pass of throwing out the worst readings, then again
      const keep = pairs.filter((q) => {
        const w = fitApply(f, q);
        return Math.hypot(w.x - q.bx, w.z - q.bz) <= 2 * f.rms + 0.5;
      });
      if (keep.length >= FIT_MIN) f = solve(keep, m);
      if (!best || f.rms < best.rms) best = f;
    });
    F.f = best;
    F.ok = best.spread >= FIT_SPREAD && best.rms <= FIT_RMS_MAX;
  }
  function fitTick() {
    fitFrame(FIT.doc);
    fitFrame(FIT.el);
    const c = [FIT.doc, FIT.el].filter((F) => F.ok);
    c.sort((a, b) => a.f.rms - b.f.rms);
    fitBest = c[0] || null;
  }
  every(fitTick, 1000);
  function fitPos(p) {
    if (!fitBest) return null;
    const r = fitBest === FIT.doc ? p.rDoc : p.rEl;
    return r ? fitApply(fitBest.f, r) : null;
  }

  let probeSeen = false;        // has the probe ever said anything?
  let probeCal = 0;             // how many players it is calibrated for
  let probeEvents = 0;          // v8: every probe event that arrived
  let probeLastAt = 0;          // v8: when the last one arrived
  let probeEnters = 0, probeMoves = 0, probeLeaves = 0;

  function probeAt(e, px, pz) {
    const d = e && e.detail;
    probeEvents++;
    probeLastAt = Date.now();
    if (!d) return;
    const id = d.connectionId;
    if (id === undefined || id === null) return;
    // v8: keep BOTH frames the probe offers for the fitter. The element
    // frame is relative to whichever probe heard them, so it is moved
    // back to the probes' shared origin first.
    const rawDoc = okPos(d.documentRelative && d.documentRelative.position) || okPos(d.position);
    let rawEl = okPos(d.elementRelative && d.elementRelative.position);
    if (rawEl) { rawEl.x += px || 0; rawEl.z += pz || 0; }
    const raw = rawDoc || rawEl;
    if (!raw) return;
    {
      const q = players.get(id);
      if (q && q.gt && Date.now() - q.gt < PROBE_MS * 0.6) return;   // another probe just reported them
    }
    // THE PROBE LIVES OUTSIDE THE TURNED WORLD, AND IT HAS TO.
    // Everything else hangs off #world, which is rotated by BUILD_RY.
    // The probe cannot go in there: it reports in the DOCUMENT's
    // frame, and the calibration underneath can only ever absorb a
    // SHIFT between probe and floor, never a TURN - offsets add, they
    // do not rotate. So the probe stays unturned and its readings are
    // turned here instead, into the frame the floor speaks in.
    //
    // This is the first thing to suspect if tracking ever goes
    // strange: markers parked, the ball trailing somebody by half the
    // pitch, nobody reading as present. Set BUILD_RY to 0 and both
    // the rotation and this correction go away together.
    const pos = BUILD_RY === 180
      ? { x: -raw.x, y: raw.y, z: -raw.z }
      : raw;
    probeSeen = true;
    const p = player(id);
    const now = Date.now();

    // v8: how often this client's probe actually reports - some worlds
    // throttle it well past PROBE_MS, and a freshness limit shorter
    // than the real interval switched air tracking off between reports
    if (p.gt && now - p.gt < 5000) p.gint = p.gint ? p.gint * 0.8 + (now - p.gt) * 0.2 : now - p.gt;
    const prevDoc = p.rDoc;
    p.rDoc = rawDoc; p.rEl = rawEl;
    const still = prevDoc && rawDoc && Math.hypot(rawDoc.x - prevDoc.x, rawDoc.z - prevDoc.z) < 0.15;
    // v8: THE FITTER. Every moment the floor and the probe both know
    // where somebody is, the pair is kept - for everybody, in one pool.
    if (p.pads > 0 && (now - p.t < 150 || (still && now - p.t < 4000)) && now - (p.pairAt || 0) > 200) {
      p.pairAt = now;
      const lag = still ? 0 : Math.min(0.15, (now - p.t) / 1000);
      const fx = p.x + p.vx * lag, fz = p.z + p.vz * lag;
      if (rawDoc) fitAdd(FIT.doc, rawDoc, fx, p.y, fz);
      if (rawEl) fitAdd(FIT.el, rawEl, fx, p.y, fz);
    }

    // where the probe says they are in MAP coordinates: the fitted
    // transform if there is a good one, else v7's flipped reading
    const tp = fitPos(p) || pos;
    // how fast the probe says they are moving, which is the only
    // velocity that means anything while they are off the floor
    if (p.lgt && now - p.lgt > 40 && now - p.lgt < 2500) {
      const dt = (now - p.lgt) / 1000;
      const vx = (tp.x - p.lgx) / dt, vz = (tp.z - p.lgz) / dt;
      if (Math.hypot(vx, vz) < 40) {
        p.gvx = p.gvx * 0.4 + vx * 0.6;
        p.gvz = p.gvz * 0.4 + vz * 0.6;
      }
    }
    p.lgx = tp.x; p.lgz = tp.z; p.lgt = now;
    p.gx = pos.x; p.gy = pos.y; p.gz = pos.z; p.gt = now;

    // CALIBRATION. Only ever done while they are standing on a pad,
    // because that is the only moment the true answer is known.
    // v8: standing still counts too - a still player sends no floor
    // moves, and was never calibrated at all.
    if (p.pads > 0 && (now - p.t < 400 || (still && now - p.t < 4000))) {
      const ox = p.x - pos.x, oy = p.y - pos.y, oz = p.z - pos.z;
      if (!p.cal) {
        p.ox = ox; p.oy = oy; p.oz = oz; p.cal = 1;
      } else if (Math.hypot(ox - p.ox, oz - p.oz) < CAL_JUMP) {
        // ease towards it rather than snapping, so one bad reading
        // cannot throw a calibration that a hundred good ones built
        p.ox = p.ox * 0.82 + ox * 0.18;
        p.oy = p.oy * 0.82 + oy * 0.18;
        p.oz = p.oz * 0.82 + oz * 0.18;
        if (p.cal < CAL_MIN + 6) p.cal++;
        if (p.cal === CAL_MIN) probeCal++;
      } else {
        // the offset moved a long way in one reading. That is the
        // probe being wrong in a new way, not the player moving, so
        // start the calibration again rather than averaging junk in.
        if (p.cal >= CAL_MIN) probeCal--;
        p.ox = ox; p.oy = oy; p.oz = oz; p.cal = 1;
      }
    }
  }
  function probeGone(e) {
    const d = e && e.detail;
    if (!d || d.connectionId === undefined) return;
    const p = players.get(d.connectionId);
    if (p) p.gt = 0;
  }

  // Where the probe says they are, corrected into real coordinates -
  // or null, which means fall back to the floor and to the sky column.
  function probeFresh(p) {
    return Math.min(PROBE_FRESH_MAX, Math.max(PROBE_FRESH, 2.5 * (p.gint || 0)));
  }
  function glideAt(p) {
    if (!GLIDE_PROBE || !p.gt) return null;
    if (Date.now() - p.gt > probeFresh(p)) return null;
    let g = fitPos(p);
    if (!g) {
      if (p.cal < CAL_MIN) return null;
      g = { x: p.gx + p.ox, y: p.gy + p.oy, z: p.gz + p.oz };
    }
    // v8: carried forward to NOW at their measured speed, so a probe
    // that only reports every second does not leave the ball behind
    const age = (Date.now() - p.gt) / 1000;
    let dx = p.gvx * age, dz = p.gvz * age;
    const m = Math.hypot(dx, dz);
    if (m > GLIDE_LEAD_MAX) { dx *= GLIDE_LEAD_MAX / m; dz *= GLIDE_LEAD_MAX / m; }
    return { x: g.x + dx, y: g.y, z: g.z + dz };
  }
  // true when the marker can honestly ride over their head
  function tracked(p) { return !!glideAt(p); }
  // the height to hang a marker at: the probe while they are off the
  // floor and it is working, the floor the rest of the time
  function standY(p) {
    const g = (p.pads > 0) ? null : glideAt(p);
    return g ? g.y : (p.y || 0);
  }

  // v8: THE PROBE EXPERIMENT. In Dinopawnz's world the probe reports
  // for a few seconds after you load in and then never again, and a
  // probe rebuilt later never reports at all (KICK87, IN7 unchanged).
  // So several different setups run side by side, and the jumbotron
  // says which of them - if any - keep reporting LATE, i.e. more than
  // PROBE_LATE_MS after that setup first reported. Any setup that
  // reports is used for tracking; readings are thinned per player.
  //   A  one big probe, the platform's own default interval
  //   B  one big probe, 1000ms
  //   C  one big probe, 100ms, REBUILT whenever everything is quiet
  //   D  a ring of 70m probes over the arena and pens, 1000ms
  //   E  one big probe, 250ms, RESTARTED by nudging its range
  const PROBE_LATE_MS = 15000;
  const PROBE_KICK_MS = 700;
  // RESULT (Dinopawnz, v8): A 2/0 B 2/0 C 9/0 D 10/0 E 7/0 - no setup
  // reports after the first couple of seconds in that world, so only A
  // is kept, and nothing is rebuilt. If the platform ever fixes probes,
  // A's readings switch air tracking on by themselves. PROBE_EXPERIMENT
  // true brings the whole test back.
  const PROBE_EXPERIMENT = false;
  const PROBE_GROUPS = PROBE_EXPERIMENT ? {
    A: { spots: [[0, 0, PROBE_RANGE]], interval: null, main: true },
    B: { spots: [[0, 0, PROBE_RANGE]], interval: 1000 },
    C: { spots: [[0, 0, PROBE_RANGE]], interval: PROBE_MS, rebuild: true },
    D: { spots: [[45, 0, 70], [-45, 0, 70], [0, 45, 70], [0, -45, 70],
                 [45, 45, 70], [-45, 45, 70], [45, -45, 70], [-45, -45, 70],
                 [0, 100, 60], [0, -100, 60]], interval: 1000 },
    E: { spots: [[0, 0, PROBE_RANGE]], interval: 250, nudge: true },
  } : {
    A: { spots: [[0, 0, PROBE_RANGE]], interval: null, main: true },
  };
  const probeStats = {};
  let probeKicks = 0, lastKick = 0;
  function makeProbe(name, G, i) {
    const [x, z, range] = G.spots[i];
    const attrs = { x: x, z: z, range: range };
    if (G.interval) attrs.interval = G.interval;
    const probe = el("m-position-probe", attrs, probeRoot);   // OUTSIDE #world - see probeAt()
    const st = probeStats[name];
    const got = (e) => {
      const now = Date.now();
      if (!st.first) st.first = now;
      st.n++;
      if (now - st.first > PROBE_LATE_MS) st.late++;
      probeAt(e, x, z);
    };
    on(probe, "positionenter", (e) => { probeEnters++; got(e); });
    on(probe, "positionmove", (e) => { probeMoves++; got(e); });
    on(probe, "positionleave", (e) => { probeLeaves++; if (G.main) probeGone(e); });
    G.els[i] = probe;
  }
  function kickProbes() {
    Object.keys(PROBE_GROUPS).forEach((name) => {
      const G = PROBE_GROUPS[name];
      G.els.forEach((n, i) => {
        if (G.rebuild) {
          if (n.parentNode) n.parentNode.removeChild(n);
          makeProbe(name, G, i);
        } else if (G.nudge) {
          G.flip = !G.flip;
          n.setAttribute("range", G.spots[i][2] - (G.flip ? 1 : 0));
        }
      });
    });
    probeKicks++;
  }
  if (GLIDE_PROBE) {
    Object.keys(PROBE_GROUPS).forEach((name) => {
      const G = PROBE_GROUPS[name];
      G.els = [];
      probeStats[name] = { n: 0, late: 0, first: 0 };
      G.spots.forEach((_, i) => makeProbe(name, G, i));
    });
    if (PROBE_EXPERIMENT) every(() => {
      if (!players.size) return;
      const now = Date.now();
      if (now - probeLastAt > PROBE_KICK_MS && now - lastKick > 1000) {
        lastKick = now;
        kickProbes();
      }
    }, 100);
  }
  function probeReport() {
    return Object.keys(PROBE_GROUPS).map((k) => k + " " + probeStats[k].n + "/" + probeStats[k].late).join("  ");
  }

  // --- in the air -------------------------------------------
  // Every pad going quiet at once means one of two things: they
  // jumped, or they walked off the pad grid. Somebody last seen out
  // at the edge probably stepped off; anybody else is in the air.
  // Carry a player forward at the speed they were last seen doing.
  // Separate from predict() because predict() asks whether they are
  // airborne and this is part of answering that.
  function coast(p, t) {
    let dx = p.vx * t, dz = p.vz * t;
    const m = Math.hypot(dx, dz);
    if (m > EDGE_LOOK_MAX) { dx *= EDGE_LOOK_MAX / m; dz *= EDGE_LOOK_MAX / m; }
    return { x: p.x + dx, z: p.z + dz };
  }
  // WHO LEFT.
  // Every pad going quiet at once means one of two things - they
  // jumped, or they left the pitch - and the floor says exactly the
  // same thing in both cases. Two questions separate them, and both
  // have to pass before anybody is given the long window:
  //   1. were they standing at the rim when the floor lost them?
  //   2. were they HEADING OFF it? Carry them forward a second at the
  //      speed they were last doing, and if that puts them over the
  //      touchline they walked out, however far inside they were when
  //      the last pad reported.
  // Either one and they get EDGE_AIR_MS - a fifth of a second - which
  // is the same answer v5 gave and is why walking off has always been
  // noticed straight away. The long window is only ever handed to
  // somebody who was inside the pitch and not on their way out of it.
  function airWindow(p) {
    if (Math.abs(p.x) > FIELD_W / 2 - EDGE_M ||
        Math.abs(p.z) > FIELD_L / 2 - EDGE_M) return EDGE_AIR_MS;
    const q = coast(p, EDGE_LOOK);
    if (Math.abs(q.x) > FIELD_W / 2 ||
        Math.abs(q.z) > FIELD_L / 2) return EDGE_AIR_MS;
    return AIR_MS;
  }
  function airborne(p) {
    return !p.pads && !!p.offSince && Date.now() - p.offSince < airWindow(p);
  }
  // Off the pads for longer than a hop. Still on the pitch, still
  // holding the flag, but nobody - the game included - knows where
  // they actually are any more, so they are out of reach both ways.
  function highUp(p) {
    return airborne(p) && Date.now() - p.offSince > HIGH_MS;
  }
  const SKY_DOTS = Math.max(2, Math.floor(SKY_BEAM / SKY_STEP));

  function onPitch(p) {
    return (p.pads > 0 || airborne(p)) && Date.now() - p.t < GHOST_MS;
  }
  // IS THERE ANYBODY THERE - and this is a different question from
  // onPitch(), which is a RULES question and is answered by the floor
  // on purpose. This one is only ever asked about drawing a marker,
  // and for that the floor is the wrong authority: the floor knows
  // about pads, and a player is not standing on a pad, they are
  // standing on the MAP.
  //
  // Every pad the map is missing therefore reads as "gone" - and the
  // map was missing a few, which is what this version is about. The
  // kerbs and rails below are padded now, but "I have enumerated
  // every surface" is a claim that goes stale the first time anybody
  // adds a block to this document, and the cost of getting it wrong
  // is somebody's ball falling off their head while they stand still.
  //
  // So the marker gets a second opinion that does not care about the
  // floor at all. The probe sees a calibrated player anywhere in the
  // world at any height, on any surface, padded or not. If it can see
  // them, they are there, and the ball rides their head - and
  // markerAt() and standY() are already reading the probe in exactly
  // that case, so the position and the height are right too. If the
  // probe goes quiet - which it does within PROBE_FRESH of a client
  // dying - this falls back to the floor and nothing else changes.
  // ...and it stops at the touchline. THE GALLERY IS NOT THE PITCH.
  // The probe can see the whole arena - the stands, the gallery, the
  // lobby, the terrace - and none of that is the playing field, so
  // none of it gets a marker. Only the floor-first half of this
  // answers for somebody who is airborne, which is deliberate: a
  // jumper who drifts over the touchline and back is still on the
  // pitch by the same window they always were, and their ball does
  // not blink at the line.
  function overField(q) {
    return Math.abs(q.x) <= FIELD_W / 2 + PITCH_EDGE &&
           Math.abs(q.z) <= FIELD_L / 2 + PITCH_EDGE;
  }
  function present(p) {
    return onPitch(p) || (tracked(p) && overField(markerAt(p, 0)));
  }
  // Where they are now, carried forward a little by their speed. In
  // the air nothing reports them, but a jumper keeps travelling at
  // the speed they took off at - so keep carrying them forward for
  // the length of a hop rather than freezing them at the take-off
  // spot and snapping them forward when they land.
  function predict(p, ahead) {
    // If the probe is up and calibrated, it knows exactly where they
    // are - in the air as well as on the ground - so there is nothing
    // to guess at. Lead it by the probe's own velocity, not the
    // floor's, because the floor's is the speed they took off at.
    const g = (p.pads > 0) ? null : glideAt(p);
    if (g) {
      const t2 = Math.min(0.25, ahead || 0);
      return { x: g.x + p.gvx * t2, z: g.z + p.gvz * t2 };
    }
    const air = airborne(p);
    const raw = (Date.now() - p.t) / 1000;
    if (!air && raw > 0.45) return { x: p.x, z: p.z };   // standing still
    const age = Math.min(air ? AIR_COAST : 0.5, raw);
    const t = age + (ahead || 0);
    let dx = p.vx * t, dz = p.vz * t;
    const cap = air ? AIR_LEAD_MAX : LEAD_MAX;
    const m = Math.hypot(dx, dz);
    if (m > cap) { dx *= cap / m; dz *= cap / m; }
    return { x: p.x + dx, z: p.z + dz };
  }
  // WHERE TO DRAW THE BALL, which is a different question from where
  // the GAME thinks somebody is, and gets a different answer.
  //
  // predict() above is the rules answer and it is floor-first on
  // purpose: a tag, a half, a jail break and a flag pickup are all
  // decided by pads, so the position they are decided from had
  // better be the pad's. But a pad is eight metres wide and reports
  // its own centre, so as a thing to hang a ball over it is four
  // metres of slack that the smoothing then smears into a ball
  // trailing its player across open ground.
  //
  // So the marker gets the probe instead, on the ground as well as
  // in the air: a real position every PROBE_MS, corrected by the
  // calibration, led by the probe's OWN velocity - which is measured
  // off continuous readings rather than off pad centres, and is the
  // first honest speed this document has had on the ground.
  //
  // Three ways out, all of them back to predict() and the floor:
  // the probe said nothing in this world, it is not calibrated for
  // this player yet, or it disagrees with the pad underneath them by
  // more than MARKER_PROBE_TOL - which is a calibration that has
  // drifted, and is the one failure that would park a ball off to
  // one side of somebody and leave it there.
  function markerAt(p, ahead) {
    if (MARKER_PROBE) {
      const g = glideAt(p);
      if (g && (p.pads < 1 ||
                Math.hypot(g.x - p.x, g.z - p.z) < MARKER_PROBE_TOL)) {
        // (glideAt has already carried it forward to now)
        const t = Math.min(0.25, ahead || 0);
        return { x: g.x + p.gvx * t, z: g.z + p.gvz * t };
      }
    }
    return predict(p, ahead);
  }

  // Which half they are over - a jumper is judged where they are,
  // not where they left the ground. Pass a position you already have.
  function ownHalf(p, at) {
    const q = at || predict(p, 0);
    return p.team * q.z >= -HALF_TOL;
  }

  function teamCount(t) {
    let n = 0;
    players.forEach((p) => { if (p.team === t) n++; });
    return n;
  }
  function frozenCount(t) {
    let n = 0;
    players.forEach((p) => { if (p.team === t && p.state === "frozen") n++; });
    return n;
  }

  // somebody left the world entirely
  if (typeof window !== "undefined" && window.addEventListener) {
    on(window, "disconnected", (e) => {
      const id = e && e.detail ? e.detail.connectionId : undefined;
      const p = players.get(id);
      if (!p) return;
      // they take the ball with them if they had it, and it is back
      // on the plinth before anybody notices they are gone
      if (p.carrying) dropBall("BALL RESET", WIN_GOLD);
      if (p.marker && p.marker.parentNode) p.marker.parentNode.removeChild(p.marker);
      openCage(id);
      players.delete(id);
    });
  }

  // ==========================================================
  // THE FLOOR - pads that report who stepped where
  // ==========================================================
  const PAD_COLS = Math.max(1, Math.round(FIELD_W / FOOT_PITCH));
  const PAD_ROWS = Math.max(1, Math.round(FIELD_L / FOOT_PITCH));
  const PAD_W = FIELD_W / PAD_COLS;
  const PAD_D = FIELD_L / PAD_ROWS;

  // hook any collider up to the identity system; extra(p, e, kind)
  // runs after the position is taken.
  // ry is the collider's own Y rotation, if it has one. The position
  // in a collision event is relative to the ELEMENT, so on a turned
  // block it arrives in the block's frame and has to be turned back
  // before it means anything in the world. Nothing needed this until
  // the turned crates started reporting for themselves.
  function listen(node, cx, cz, extra, sy, ry) {
    const a = ((ry || 0) * Math.PI) / 180;
    const ca = Math.cos(a), sa = Math.sin(a);
    const hit = (kind) => (e) => {
      const q = e && e.detail && e.detail.position;
      const has = q && typeof q.x === "number";
      const p = stepped(e, kind,
        has ? cx + q.x * ca + q.z * sa : cx,
        has ? cz + q.z * ca - q.x * sa : cz, sy);
      if (p && kind !== "end") p.exact = !!has;   // v25: a real spot, not a pad centre
      if (p && extra) extra(p, kind);
    };
    on(node, "collisionstart", hit("start"));
    on(node, "collisionmove", hit("move"));
    on(node, "collisionend", hit("end"));
  }

  // one pad maker, used for the floor, the decks and every tread of
  // every ramp. base is where the pad sits; the walking surface is
  // base + PAD_T, and that is the height the pad reports.
  function padAt(px, pz, w, d, base) {
    const pad = el("m-cube", {
      x: +px.toFixed(2), z: +pz.toFixed(2), y: +(base + PAD_T / 2).toFixed(3),
      width: w, height: PAD_T, depth: d,
      color: "#000000", opacity: 0,
      collide: "true", "collision-interval": PAD_MS,
    });
    listen(pad, px, pz, null, +(base + PAD_T).toFixed(3));
    return pad;
  }

  // THE FLOOR, CULLED TO THE OCTAGON.
  // The grid is square because a square grid is the only thing that
  // indexes cheaply, but the room is not, and at this size the four
  // cut corners are about a tenth of the grid. A pad whose middle is
  // outside the walls can never be stood on, so it is never built -
  // which is a couple of hundred colliders and their three listeners
  // each that the client does not have to carry.
  for (let r = 0; r < PAD_ROWS; r++) {
    for (let c = 0; c < PAD_COLS; c++) {
      const px = -FIELD_W / 2 + PAD_W / 2 + c * PAD_W;
      const pz = -FIELD_L / 2 + PAD_D / 2 + r * PAD_D;
      if (!inOct(px, pz, -PAD_W / 2)) continue;
      padAt(px, pz, PAD_W + 0.4, PAD_D + 0.4, 0);
    }
  }

  // every deck, gridded the same way. The pads ARE the deck surface,
  // exactly as they are on the floor, so there is no lip to trip on
  // anywhere except the very edge - where a lip is wanted anyway.
  DECKS.forEach(([x0, x1, z0, z1, dy]) => {
    const cols = Math.max(1, Math.round((x1 - x0) / FOOT_PITCH));
    const rows = Math.max(1, Math.round((z1 - z0) / FOOT_PITCH));
    const w = (x1 - x0) / cols, d = (z1 - z0) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        padAt(x0 + w / 2 + c * w, z0 + d / 2 + r * d, w + 0.3, d + 0.3, dy);
      }
    }
  });

  // and every tread. A step is small enough to be one pad on its own,
  // which is the whole reason the ramps are stepped: the game can say
  // how high up a ramp somebody is, to the tread.
  RAMP_STEPS.forEach((st) => {
    padAt(st.x, st.z, st.width, st.depth, st.top);
  });

  // NOTHING ELSE GETS A PAD.
  // Cover, the kerbs, the rails and the flag plinths all report as
  // themselves where they are built - see THE THING YOU STAND ON IS
  // THE THING THAT REPORTS. The pads above are the ones with nothing
  // to hang on: open floor, open deck, a ramp tread, a tunnel roof.
  //
  // AND THE ROOFS. A lid is a solid surface, so it is a place people
  // land - gridded exactly like a deck, so the floor knows which one
  // you are on and at what height.
  ROOF_TOPS.forEach(([x0, x1, z0, z1, top]) => {
    const cols = Math.max(1, Math.round((x1 - x0) / FOOT_PITCH));
    const rows = Math.max(1, Math.round((z1 - z0) / FOOT_PITCH));
    const w = (x1 - x0) / cols, d = (z1 - z0) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        padAt(x0 + w / 2 + c * w, z0 + d / 2 + r * d, w + 0.3, d + 0.3, top);
      }
    }
  });

  // v7: THE PEN ROOMS are map, so they get floor pads like the map
  PEN_ROOMS.forEach(([x0, x1, z0, z1]) => {
    const cols = Math.max(1, Math.round((x1 - x0) / FOOT_PITCH));
    const rows = Math.max(1, Math.round((z1 - z0) / FOOT_PITCH));
    const w = (x1 - x0) / cols, d = (z1 - z0) / rows;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        padAt(x0 + w / 2 + c * w, z0 + d / 2 + r * d, w + 0.3, d + 0.3, 0);
      }
    }
  });
  function inPenRoom(x, z, m) {
    const k = m || 0;
    return PEN_ROOMS.some(([x0, x1, z0, z1]) => x >= x0 + k && x <= x1 - k && z >= z0 + k && z <= z1 - k);
  }

  // ==========================================================
  // TEAM PADS - where you pick a side
  // ==========================================================
  // One of each in the lobby and on the terrace. Off the pitch, so
  // standing on one never counts as being on the field.
  const padCounts = [];
  function teamPad(t, x, z) {
    const g = el("m-group", { x: x, z: z });
    el("m-cylinder", { y: 0.15, radius: 5.6, height: 0.3, color: homeDark(t) }, g);
    const pad = el("m-cylinder", {
      y: 0.35, radius: 5, height: 0.3, color: homeCol(t),
      collide: "true", "collision-interval": 200,
    }, g);
    el("m-label", {
      y: 0.52, rx: -90, rz: 180, width: 8, height: 2.4, "font-size": 110,
      alignment: "center", color: homeCol(t), "font-color": "#ffffff", content: "JOIN " + teamName(t),
    }, g);
    el("m-cylinder", { y: 3.2, radius: 0.12, height: 6, color: STEEL }, g);
    el("m-cube", { x: 0.9, y: 5.4, width: 1.8, height: 1.2, depth: 0.06, color: homeCol(t) }, g);
    el("m-light", { y: 3, type: "point", intensity: 12, distance: 12, color: homeCol(t) }, g);
    const count = el("m-label", {
      y: 7.0, width: 6, height: 1.2, "font-size": 60, alignment: "center",
      color: "#0a0d14", "font-color": homeCol(t), content: "",
    }, g);
    el("m-label", {
      y: 7.0, ry: 180, width: 6, height: 1.2, "font-size": 60, alignment: "center",
      color: "#0a0d14", "font-color": homeCol(t), content: "",
    }, g);
    padCounts.push([count, t], [g.children[g.children.length - 1], t]);
    const join = (e) => { joinTeam(e, t); };
    on(pad, "collisionstart", join);
    on(pad, "collisionmove", join);
  }
  // put whoever sent event e on team t. Returns "joined", "same",
  // "busy" (carrying or frozen) or "noid".
  // v7: onlyIfNone - the PEN ROOM strips, which only ever give a team
  // to somebody who has none. And once a game is LIVE nobody who has a
  // team can change it, from anywhere.
  function joinTeam(e, t, onlyIfNone) {
    const id = e && e.detail ? e.detail.connectionId : undefined;
    if (id === undefined || id === null) { noIdHits++; return "noid"; }
    idSeen = true;
    const p = player(id);
    if (p.team === t) return "same";
    if (onlyIfNone && p.team !== 0) return "same";
    if (phase === "LIVE" && p.team !== 0) return "locked";
    if (p.carrying || p.state === "frozen") return "busy";   // no switching mid-play
    p.team = t;
    p.shown = "";
    paintBoards();
    return "joined";
  }

  // ==========================================================
  // TEAM BUTTONS - click to join
  // ==========================================================
  // A pair at each end of the field and halfway along each gallery.
  // Every sign shows the head count; the one you used flashes.
  const teamSigns = [];
  function teamStation(x, y, z, ry, only) {
    const g = el("m-group", { x: x, y: y, z: z, ry: ry });
    const sign = el("m-label", {
      y: 4.2, width: 6, height: 1.1, "font-size": 56, alignment: "center",
      color: "#0a0d14", "font-color": homeCol(only), content: "",
    }, g);
    el("m-cube", { y: 4.2, z: -0.1, width: 6.4, height: 1.4, depth: 0.1, color: FRAME }, g);
    sign.team = only;
    teamSigns.push(sign);
    [only].forEach((t) => {
      const bx = 0;
      el("m-cylinder", { x: bx, y: 0.55, radius: 0.8, height: 1.1, color: STEEL_DK, collide: "true" }, g);
      el("m-cylinder", { x: bx, y: 1.13, radius: 0.92, height: 0.06, color: CHALK }, g);
      const dome = el("m-cylinder", {
        x: bx, y: 1.32, radius: 0.72, height: 0.34, color: homeCol(t), collide: "true",
      }, g);
      const top = el("m-label", {
        y: 0.18, rx: -90, width: 1.3, height: 0.6, "font-size": 30, alignment: "center",
        color: homeCol(t), "font-color": "#ffffff", content: teamName(t), collide: "true",
      }, dome);
      el("m-label", {
        x: bx, y: 2.4, width: 2.8, height: 0.7, "font-size": 50, alignment: "center",
        color: homeCol(t), "font-color": "#ffffff", content: "JOIN " + teamName(t),
      }, g);
      let last = 0;
      const press = (e) => {
        const now = Date.now();
        if (now - last < 250) return;
        last = now;
        const r = joinTeam(e, t);
        dome.setAttribute("color", "#ffffff");
        later(() => dome.setAttribute("color", homeCol(t)), 200);
        if (r === "noid") {
          sign.setAttribute("content", "CAN'T TELL WHO CLICKED");
          sign.setAttribute("font-color", CALL_RED);
          later(() => { sign.setAttribute("font-color", homeCol(only)); signShown = ""; paintSigns(); }, 4000);
        } else if (r === "busy") {
          sign.setAttribute("content", "NOT WHILE CARRYING OR FROZEN");
          later(() => { signShown = ""; paintSigns(); }, 2500);
        } else {
          signShown = "";
          paintSigns();
        }
      };
      on(dome, "click", press);
      on(top, "click", press);
    });
  }
  let signShown = "";
  function paintSigns() {
    const key = teamCount(-1) + ":" + teamCount(1);
    if (key === signShown) return;
    signShown = key;
    teamSigns.forEach((l) => l.setAttribute("content", teamName(l.team) + " TEAM: " + teamCount(l.team)));
  }
  // Each side only offers its own team. Behind each end line, and on
  // each gallery halfway along that team's half.
  // one pair inside each doorway, where everybody walks in, and one
  // pair up on each base deck for anybody who spawned on the map
  // EVERY JOIN BUTTON IS IN A PEN, AND NONE OF THEM IS ON THE MAP.
  // Dinopawnz: "there does not need to be buttons inside of the map
  // to choose teams. they should have already chosen their teams
  // before entering the map."
  //
  // Right - and the ones on the base decks were worse than clutter,
  // they were a way to change sides mid-game while standing in the
  // middle of a fight. Three buttons per pen now, spread across it so
  // thirty people are not queueing for one, and nothing past the
  // gate.
  // v6: NO BUTTONS. THE PEN FLOOR IS THE BUTTON.
  // Dinopawnz: "dont put so many join blue buttons and so many join
  // red buttons. instead just put a strip on the floor like how i
  // have in territory that when people walk over it, you join that
  // team color... or you can make that strip the entirety of the
  // blue pen and red pen."
  // The entirety it is: stand anywhere in a pen and you are on that
  // team. No debounce, the same as Territory: joinTeam() returns
  // early for anybody already on the team, so thirty people standing
  // on it cost nothing. The floor flashes only when somebody actually
  // changes sides. Carriers and frozen players still cannot switch,
  // and the gates keep everybody out of the pens once it is live.
  penFloors.forEach(([t, floor, backHalf]) => {
    let flashAt = 0;
    const step = (e) => {
      if (joinTeam(e, t) !== "joined") return;
      const now = Date.now();
      if (now - flashAt < 300) return;
      flashAt = now;
      floor.setAttribute("color", homeCol(t));
      later(() => floor.setAttribute("color", homeDark(t)), 220);
    };
    on(floor, "collisionstart", step);
    on(floor, "collisionmove", step);
    // and the strip in the PEN ROOM underneath
    roomStrips.filter(([rt]) => rt === t && !backHalf).forEach(([, strip]) => {
      let at = 0;
      const give = (e) => {
        if (joinTeam(e, t, true) !== "joined") return;
        const now = Date.now();
        if (now - at < 300) return;
        at = now;
        strip.setAttribute("color", "#ffffff");
        later(() => strip.setAttribute("color", homeCol(t)), 220);
      };
      on(strip, "collisionstart", give);
      on(strip, "collisionmove", give);
    });
    // (v8: the head-count sign over the doorway is gone, at Dinopawnz's
    // request - the team counts are on the jumbotron and the consoles)
  });

  // ==========================================================
  // THE BALL
  // ==========================================================
  // One ball, one home, dead centre of the world. It is the only
  // object in this game and everything else is arranged round it.
  const ball = {
    state: "home",            // home | carried | resetting
    carrier: null,
    grabbedAt: 0,
    home: null, carried: null, beam: null, follow: null,
  };

  // v8: THE BALL. A still gold ball with Dinopawnz's logo on it, on

  const BALL_LOGO = BALL_LOGO_URL || BALL_LOGO_DATA;

    el("m-sphere", { radius: R, color: WIN_GOLD }, body);
