  // THE PLINTH. Solid, and it reports as itself exactly the way the
  // flag stands did in Capture the Flag - which is the one kind of
  // reporter in this engine that has always worked, because it is
  // the thing your feet actually rest on. Standing on the spawn is
  // the worst idea on the map, but your marker still follows you
  // while you do it.
  //
  // PICKUP FIX: the plinth TOP counts as well as the ring round it.
  // Before, only the ring handed the ball over, so anybody who jumped
  // straight onto the plinth (or stepped from the ring onto it) never
  // got the ball. And a collider only reports when somebody steps on
  // or moves, so a player standing still on the plinth when the ball
  // came home, when GO was pressed, or when they thawed, got nothing.
  // onHome remembers who is standing on either part, and homeTick
  // below hands the ball to them without waiting for them to move.
  const onHome = new Map();       // connectionId -> Set("ring" | "top")
  const HOME_Y_MIN = 0.9;         // ring reports 0.95, top 0.94, floor 0.36
  const HOME_REACH = BALL_HOME_R + 1.6;
  function homeSeen(p, part, kind) {
    let s = onHome.get(p.id);
    if (kind === "end") {
      if (s) { s.delete(part); if (!s.size) onHome.delete(p.id); }
      return;
    }
    if (!s) { s = new Set(); onHome.set(p.id, s); }
    s.add(part);
    ballTouch(p);
  }
  {
    const base = el("m-group", { x: 0, z: 0 }, ballRoot);
    el("m-cylinder", { y: 0.3, radius: BALL_HOME_R + 0.5, height: 0.6, color: STEEL_DK }, base);
    const top = el("m-cylinder", {
      y: 0.62, radius: BALL_HOME_R, height: 0.64, color: "#4a4033",
      collide: "true", "collision-interval": PAD_MS,
    }, base);
    listen(top, 0, 0, (p, kind) => homeSeen(p, "top", kind), 0.94);
    // the grab collider: the painted circle round the plinth, so the
    // radius you pick the ball up from is the one anybody would guess
    const grab = el("m-cylinder", {
      y: 0.45, radius: BALL_HOME_R + 1.2, height: 0.5, color: "#3a3226",
      collide: "true", "collision-interval": PAD_MS,
    }, base);
    el("m-light", { y: 4, type: "point", intensity: 34, distance: 26, color: WIN_GOLD }, base);
    const home = el("m-group", { y: 0.94 }, base);
    ballModel(home, 1);
    listen(grab, 0, 0, (p, kind) => homeSeen(p, "ring", kind), 0.95);
    ball.home = home;
  }

  // the copy that rides over a carrier's head
  {
    const carried = el("m-group", { y: PARK }, ballRoot);
    ballModel(carried, 0.7);
    ball.carried = carried;
    ball.beam = skyColumn(carried);
    if (ball.beam) beamShow(ball.beam, false, WIN_GOLD);
    ball.follow = follower(carried);
  }

  function ballTeam() {
    if (ball.state !== "carried") return 0;
    const p = players.get(ball.carrier);
    return p && p.team ? p.team : 0;
  }

  function ballTouch(p) {
    if (phase !== "LIVE") return;
    if (!p.team || p.state !== "free" || p.carrying) return;
    if (ball.state !== "home") return;
    pickUp(p);
  }

  // Anybody already standing on the ball's home gets it the moment it
  // is there to get - no need to step off and back on.
  function homeTick() {
    if (phase !== "LIVE" || ball.state !== "home" || !onHome.size) return;
    for (const id of Array.from(onHome.keys())) {
      const p = players.get(id);
      // gone, or a lost "end" event: their last reported spot is not
      // on the plinth any more
      if (!p || p.y < HOME_Y_MIN || Math.hypot(p.x, p.z) > HOME_REACH) {
        onHome.delete(id);
        continue;
      }
      ballTouch(p);
      if (ball.state !== "home") return;
    }
  }
  every(homeTick, 150);

  function pickUp(p) {
    const now = Date.now();
    ball.state = "carried";
    ball.carrier = p.id;
    ball.grabbedAt = now;
    p.carrying = 1;
    p.grabbedAt = now;
    p.shown = "";
    ball.home.setAttribute("y", PARK);
    notice(teamName(p.team) + " HAS THE BALL", 3500, homeCol(p.team));
  }

  // THE BALL GOES HOME THE MOMENT IT IS DROPPED.
  // Tagged, walked off the pitch, gone quiet, disconnected, switched
  // teams, game stopped - all one thing. It never lies on the ground
  // where it fell, which means the reset point is the most dangerous
  // square metre in the world and both teams always know exactly
  // where the next fight is.
  function dropBall(message, color) {
    if (ball.state === "home") return;
    const p = players.get(ball.carrier);
    if (p) { p.carrying = 0; p.shown = ""; }
    ball.carrier = null;
    hideFollower(ball.follow);
    if (ball.beam) beamShow(ball.beam, false);
    ball.carried.setAttribute("y", PARK);
    if (message) notice(message, 3000, color || WIN_GOLD);
    if (RESET_DELAY > 0) {
      ball.state = "resetting";
      later(() => {
        if (ball.state !== "resetting") return;
        ball.state = "home";
        ball.home.setAttribute("y", 0.94);
      }, RESET_DELAY);
    } else {
      ball.state = "home";
      ball.home.setAttribute("y", 0.94);
    }
  }
  function ballHome() { dropBall(); ball.state = "home"; ball.home.setAttribute("y", 0.94); }

  // ==========================================================
  // THE HOLD CLOCK  -  this is the scoreboard
  // ==========================================================
  // score[] is MILLISECONDS HELD, not captures. It runs for whichever
  // team has somebody carrying, it is added to every SCORE_MS, and
  // the first one to HOLD_TO_WIN seconds ends the game.
  let holdLast = Date.now();
  function holdTick() {
    const now = Date.now();
    const dt = now - holdLast;
    holdLast = now;
    if (phase !== "LIVE" || ball.state !== "carried") return;
    const p = players.get(ball.carrier);
    if (!p || !p.team) return;
    // a clock that is behind because the document was busy should not
    // hand out a second and a half in one go
    score[p.team] += Math.min(dt, SCORE_MS * 3);
    if (suddenDeath) {
      if (score[p.team] > score[other(p.team)]) finish(p.team);
      return;
    }
    if (score[p.team] >= holdToWin * 1000) finish(p.team);
  }
  every(holdTick, SCORE_MS);

  function heldSec(t) { return Math.floor(score[t] / 1000); }
  function scoreLine() {
    return "RED " + heldSec(-1) + " - " + heldSec(1) + " BLUE";
  }

  // ==========================================================
  // TAGGING  -  possession is permission
  // ==========================================================
  // The four constants at the top of this document are the whole
  // rule. This function is just them, written out, and it is
  // deliberately the shortest tagging code in this series - there
  // are no halves to check, no home ground to be safe in, no
  // escorts to look for and no guard rings to stand outside of.
  //
  //   d = whoever might make the tag
  //   a = whoever might be caught
  //   bt = which team is holding the ball right now, 0 if nobody
  //
  // They are already known to be on opposite teams by the time this
  // is asked.
  function mayTag(d, a, bt) {
    if (d.carrying && !CARRIER_CAN_TAG) return false;  // hands full
    if (a.carrying) return CARRIER_TAGGABLE;           // always catchable
    if (!POSSESSION_TAGS) return true;
    if (!bt) return LOOSE_BALL_TAGS;                   // nobody has it
    return d.team === bt;                              // only the ball team
  }

  function tagTick() {
    if (phase !== "LIVE") return;
    const now = Date.now();
    const bt = ballTeam();
    const live = [];
    players.forEach((p) => {
      if (p.team && p.state === "free" && onPitch(p)) live.push(p);
    });
    for (let i = 0; i < live.length; i++) {
      const a = live[i];
      // live[] IS A SNAPSHOT, AND A TAG CHANGES THE WORLD MID-SWEEP.
      // Somebody frozen earlier in this same pass is still in this
      // list, and without these two lines they went on to tag people
      // with the walls already closing round them - and, worse, the
      // player who had just been caught could turn round inside the
      // same tick and catch the person who caught them. Both states
      // are re-read on every pair.
      if (a.state !== "free") continue;
      if (now < a.safeUntil) continue;
      // the few seconds after a grab, so the scramble at the plinth
      // does not simply hand the ball straight back
      if (a.carrying && PICKUP_GRACE && now - (a.grabbedAt || 0) < PICKUP_GRACE) continue;
      const pa = predict(a, 0);
      for (let j = 0; j < live.length; j++) {
        const d = live[j];
        if (d.team === a.team || d.state !== "free") continue;
        if (now - d.lastTagAt < TAG_COOLDOWN) continue;
        if (!mayTag(d, a, bt)) continue;
        // and they have to be on the same floor. Standing on the ring
        // is not standing on the person under the hole.
        if (Math.abs(standY(a) - standY(d)) > LEVEL_TOL) continue;
        const pd = predict(d, 0);
        if (Math.hypot(pa.x - pd.x, pa.z - pd.z) <= TAG_R) {
          d.lastTagAt = now;
          freeze(a, d);
          break;
        }
      }
    }
  }
  every(tagTick, 100);

  // ==========================================================
  // THE FREEZE, AND THE CAGE  -  two separate things
  // ==========================================================
  // Dinopawnz: "i dont want the shells anymore. i want cages just
  // like in redlight game. but i also want there to be an 8 second
  // shell... 8 seconds where they cannot tag this way even if the
  // cage misses, they still cannot tag the ball person."
  //
  // That is the whole design and it is worth saying plainly, because
  // every previous game in this series conflated these two and every
  // one of them had the same bug:
  //
  //   THE FREEZE is the rule. It lives on the player, it lasts
  //   FREEZE_MS, and it is what actually takes them out of the game.
  //   It cannot miss, because it is not a thing in the world - it is
  //   a number on a player record.
  //
  //   THE CAGE is the furniture. It is a physical box thrown at the
  //   floor where they were last seen, exactly the way Red Light
  //   Green Light throws one. Sometimes it lands square on them.
  //   Sometimes they were sprinting and it lands behind them, or
  //   they were mid-jump and it closes under them.
  //
  // Capture the Flag made the freeze DEPEND on the cage: no room for
  // a cage meant no catch at all, and a sprinter who outran the
  // build was never caught. Here the cage is decoration on a rule
  // that has already been applied. It misses, they are still out for
  // eight seconds, and - the case that actually matters - they still
  // cannot lay a finger on the ball carrier while it runs.
  //
  // A frozen player, caged or not:
  //   cannot tag anybody, carrier or otherwise
  //   cannot be tagged
  //   cannot pick the ball up
  //   and drops it on the spot if they had it
  const cages = [];
  const SIDE = 2 * CAGE_A * Math.tan(Math.PI / 6) + 0.4;  // wall width
  const CORNER = CAGE_A / Math.cos(Math.PI / 6);          // post radius

  function freeze(p, by) {
    const now = Date.now();
    if (p.carrying) {
      dropBall(teamName(p.team) + " CARRIER DOWN - BALL RESET",
        homeCol(by && by.team ? by.team : other(p.team)));
    }
    p.state = "frozen";
    p.frozenUntil = now + FREEZE_MS;
    p.shown = "";
    if (CAGES) cageOn(p, by);
  }

  function thaw(p, now) {
    p.state = "free";
    p.frozenUntil = 0;
    p.safeUntil = now + SAFE_AFTER_FREE;
    p.shown = "";
    openCage(p.id);
  }

  function thawAll() {
    const now = Date.now();
    players.forEach((p) => { if (p.state === "frozen") thaw(p, now); });
    for (let i = cages.length - 1; i >= 0; i--) removeCage(cages[i]);
  }

  function frozenCount(t) {
    let n = 0;
    players.forEach((p) => { if (p.team === t && p.state === "frozen") n++; });
    return n;
  }

  // ==========================================================
  // THE CAGE ITSELF  -  Red Light's, with a lid that fits
  // ==========================================================
  // Six translucent walls, six posts, a lid, and no door. Built where
  // they are, thrown CAGE_LEAD along their heading because a cage
  // built exactly where the contact was reported arrives behind a
  // sprinter - Trap Run and Red Light both hit this and both solved
  // it the same way.
  //
  // The ONE thing this does that Red Light's does not is measure the
  // ceiling. That map is a flat field under open sky; this one has a
  // ring deck four metres over most of the ground worth fighting on,
  // and a seven-metre cage under it would grow straight through the
  // floor of the street above. So the lid is built to whatever air is
  // actually there - see headroomAt(). Under the ring you get a four
  // metre cage, in the open you get the full CAGE_H, and the eight
  // seconds are the same either way.
  function cageHeight(x, z, y) {
    const head = headroomAt(x, z, y);
    if (head === Infinity) return CAGE_H;
    return clamp(head - CAGE_HEAD_GAP, CAGE_MIN_H, CAGE_H);
  }

  function cageOn(p, by) {
    if (cages.length >= MAX_CAGES) return;
    // v8: a forcefield is tight, so it is placed off the best position
    // there is (the probe, when it is calibrated) and led only a little
    const at = FORCEFIELD ? markerAt(p, FIELD_LEAD) : predict(p, 0);
    let x = at.x, z = at.z;
    // thrown along the heading, so it lands on a runner rather than
    // behind one
    const sp = Math.hypot(p.vx || 0, p.vz || 0);
    if (!FORCEFIELD && sp > 0.6) { x += (p.vx / sp) * CAGE_LEAD; z += (p.vz / sp) * CAGE_LEAD; }
    const y = standY(p);
    const R = FORCEFIELD ? FIELD_A : CAGE_A;
    const floor = y < GROUND + 1.0;
    // keep it inside the walls. Only on the floor - up on a deck the
    // octagon is not the boundary, the deck is, and a cage half off
    // the edge of a street is a fine outcome.
    if (floor && !inOct(x, z, R + 0.6) && !inPenRoom(x, z, R + 0.6)) {
      const m = Math.hypot(x, z) || 1;
      const k = (OCT_A - R - 1.2) / m;
      if (k < 1) { x *= k; z *= k; }
    }
    // and off the pillars, with one short nudge and no search. If it
    // still does not clear, it is built anyway - THE CAGE IS ALLOWED
    // TO MISS. The eight seconds are already running.
    if (onPillar(x, z, y, R + 0.6)) {
      const m = Math.hypot(x, z) || 1;
      x += (x / m) * (FORCEFIELD ? 1.2 : 3.2); z += (z / m) * (FORCEFIELD ? 1.2 : 3.2);
    }
    // v26: THE TAGGER IS NEVER SHUT IN. They are within a couple of
    // metres by definition, so the field is put down a little further
    // from them, on the far side of the person they caught.
    const tg = FORCEFIELD && by && by.id !== undefined ? players.get(by.id) : null;
    if (tg) {
      const tp = predict(tg, FIELD_CHASE_LEAD);
      const ax = x - tp.x, az = z - tp.z, m = Math.hypot(ax, az);
      if (m > 0.05) { x += (ax / m) * TAGGER_SHIFT; z += (az / m) * TAGGER_SHIFT; }
    }
    const rec = {
      id: p.id, team: p.team, x: x, z: z, y: y, by: tg ? tg.id : null,
      h: FORCEFIELD ? Math.min(FIELD_H, cageHeight(x, z, y)) : cageHeight(x, z, y),
      born: Date.now(), group: null,
    };
    buildCage(rec);
    cages.push(rec);
  }

  // v8: the invisible forcefield (v25: solid - see FIELD_A)
  // puts the six walls and the lid at half-width A
  function sizeField(rec, A) {
    rec.a = A;
    const H = rec.h;
    rec.panels.forEach((pn) => {
      const r = pn.a * Math.PI / 180;
      pn.node.setAttribute("x", +(A * Math.sin(r)).toFixed(3));
      pn.node.setAttribute("z", +(A * Math.cos(r)).toFixed(3));
      // long enough to overlap its neighbours at the corners
      pn.node.setAttribute("width", +(2 * (A + FIELD_T / 2) * Math.tan(Math.PI / 6) + 0.2).toFixed(3));
      // from under the floor up to the lid - no gap underneath, even on
      // a stair or the edge of a kerb
      pn.node.setAttribute("height", +(H + FIELD_SINK).toFixed(3));
      pn.node.setAttribute("y", +((H - FIELD_SINK) / 2).toFixed(3));
    });
    rec.lid.node.setAttribute("radius", +(A + FIELD_T / 2 + 0.3).toFixed(3));
    rec.lid.node.setAttribute("y", +(H + 0.15).toFixed(3));
  }
  // lands wide, then closes in
  function landField(rec, x, z, y) {
    rec.x = x; rec.z = z; rec.y = y;
    rec.h = Math.min(FIELD_H, cageHeight(x, z, y));
    rec.group.setAttribute("x", x.toFixed(2));
    rec.group.setAttribute("z", z.toFixed(2));
    rec.group.setAttribute("y", y.toFixed(2));
    sizeField(rec, FIELD_LAND_A);
    rec.movedAt = Date.now();
    rec.outN = 0;
    fieldGuard(rec);
  }
  function buildField(rec) {
    const g = document.createElement("m-group");
    cageRoot.append(g);
    rec.group = g;
    rec.panels = [];
    for (let i = 0; i < 6; i++) {
      rec.panels.push({ a: i * 60, on: true, node: el("m-cube", {
        ry: i * 60, depth: FIELD_T,
        color: "#000000", opacity: 0, collide: "true",
      }, g) });
    }
    rec.lid = { on: true, node: el("m-cylinder", {
      height: 0.3, color: "#000000", opacity: 0, collide: "true",
    }, g) };
    rec.chases = 0;
    rec.lastT = 0;
    landField(rec, rec.x, rec.z, rec.y);
    // the seconds left, over their head
    rec.count = crossLabels(g, rec.h + 0.7, String(Math.ceil(FREEZE_MS / 1000)),
      FROZE_COL, "#0b2530", 1.4, 0.7, 48);
    rec.shown = "";
  }

  // v8: WHERE A PLAYER IS, ONLY IF THE GAME HAS HEARD RECENTLY.
  function freshPos(p) {
    const now = Date.now();
    if (glideAt(p) && now - p.gt < Math.max(400, 1.5 * (p.gint || 0))) return markerAt(p, FIELD_LEAD);
    if (p.pads > 0 && now - p.t < 500) return predict(p, 0);
    return null;
  }
  function setOn(part, on) {
    if (part.on === on) return;
    part.on = on;
    part.node.setAttribute("collide", on ? "true" : "false");
  }
  // NOBODY ELSE GETS SHUT IN - AND NOBODY LETS THE FROZEN PLAYER OUT.
  // Other players are judged by the spot the floor last reported for
  // them, never a position led by their speed, so a team-mate running
  // at the field cannot switch a wall off. A wall only switches off
  // while it is actually passing through somebody else (a closing wall
  // reaching the tagger, say), and comes back on as soon as it is past
  // them. Standing next to a field does nothing: a wall with somebody
  // outside it is just a wall. Once a field is CLOSED, only the other
  // team can switch a wall off (by being caught inside it), so a
  // team-mate cannot hug a frozen player to open a way out for them.
  const AVATAR_R = 0.4;         // roughly how wide an avatar is, each way
  const TAGGER_SHIFT = 0.7;     // v26: a field lands this much further from
                                // its tagger than the person it caught
  const TAGGER_LAG = 0.8;       // v26: extra metres either side of a wall
                                // that count as the tagger being in it -
                                // the floor always reports them a little late
  const FIELD_GAP_MAX = 400;    // ms, over the whole freeze, that walls may
                                // be off for anybody but the tagger or
                                // another frozen player. After that those
                                // walls stay on, so a gap cannot be kept
                                // open as a door.
  function fieldGuard(rec) {
    const closing = rec.a > FIELD_A + 0.001;
    const lo = rec.a - FIELD_T / 2 - AVATAR_R - (closing ? FIELD_STEP + 0.1 : 0.05);
    const hi = rec.a + FIELD_T / 2;
    const half = (rec.a + FIELD_T / 2) * Math.tan(Math.PI / 6) + 0.1 + AVATAR_R;
    const near = [];
    players.forEach((q) => {
      if (q.id === rec.id || !present(q)) return;
      // v26: the TAGGER, and anybody frozen (their own field holds
      // them), always get let through, with no time limit, judged
      // from where the floor last saw them AND where they are heading
      const free = q.id === rec.by || q.state === "frozen";
      if (!closing && !free && q.team !== -rec.team) return;
      if (Math.abs(standY(q) - rec.y) > LEVEL_TOL) return;
      const pts = [{ x: q.x, z: q.z }];
      if (q.id === rec.by) pts.push(predict(q, FIELD_CHASE_LEAD));
      const spots = pts.map((pt) => ({ dx: pt.x - rec.x, dz: pt.z - rec.z }));
      // lag only matters for a tagger who is MOVING - one standing
      // beside the field is exactly where the floor says, and gets no
      // extra room (or the caught player could walk out past them)
      const moving = Date.now() - q.t < 450 ? Math.hypot(q.vx || 0, q.vz || 0) : 0;
      const slack = q.id === rec.by ? Math.min(TAGGER_LAG, moving * 0.15) : 0;
      const reach = hi + half + slack;
      if (spots.every((n) => Math.hypot(n.dx, n.dz) > reach)) return;
      near.push({ spots: spots, free: free, slack: slack,
        tagger: q.id === rec.by, vx: moving ? q.vx : 0, vz: moving ? q.vz : 0 });
    });
    const now = Date.now();
    const dt = rec.guardAt ? now - rec.guardAt : 0;
    rec.guardAt = now;
    if (rec.gapOthers) rec.gapMs = (rec.gapMs || 0) + dt;
    const budget = (rec.gapMs || 0) < FIELD_GAP_MAX;
    let others = false;
    rec.panels.forEach((pn) => {
      const r = pn.a * Math.PI / 180, nx = Math.sin(r), nz = Math.cos(r);
      let off = false;
      near.forEach((n) => {
        if (!n.free && !budget) return;
        // where along this wall's line they are - for the tagger, the
        // whole stretch between where they were seen and where they
        // are going, widened for lag
        let aMin = Infinity, aMax = -Infinity, sMin = Infinity;
        n.spots.forEach((sp) => {
          const along = sp.dx * nx + sp.dz * nz;
          aMin = Math.min(aMin, along); aMax = Math.max(aMax, along);
          sMin = Math.min(sMin, Math.abs(sp.dx * nz - sp.dz * nx));
        });
        // a moving tagger only needs the wall they are going OUT
        // through; the one behind them stays shut
        if (n.tagger && n.slack > 0 && n.vx * nx + n.vz * nz < 0) {
          const r0 = n.spots[0];
          const al = r0.dx * nx + r0.dz * nz;
          if (!(al > lo && al < hi + AVATAR_R && Math.abs(r0.dx * nz - r0.dz * nx) < half)) return;
        }
        if (aMax > lo - n.slack && aMin < hi + n.slack && sMin < half + n.slack) {
          off = true;
          if (!n.free) others = true;
        }
      });
      setOn(pn, !off);
    });
    rec.gapOthers = others;
    setOn(rec.lid, true);
  }
  // CLOSING: one small step at a time, towards the middle
  function fieldClose() {
    if (!FORCEFIELD) return;
    cages.forEach((rec) => {
      if (!rec.panels || rec.a <= FIELD_A + 0.001) return;
      sizeField(rec, Math.max(FIELD_A, rec.a - FIELD_STEP));
      fieldGuard(rec);
    });
  }
  every(fieldClose, FIELD_STEP_MS);
  // THE FIELD DOES NOT GIVE UP, AND IT DOES NOT GET PUSHED. It only
  // re-lands when the floor has reported - with a real position, no
  // lead, after the field last moved - FIELD_CONFIRM times in a row
  // that the frozen player is clearly outside it. Leaning on a wall
  // or bouncing inside it can never do that.
  function fieldTick() {
    if (!FORCEFIELD) return;
    const now = Date.now();
    cages.forEach((rec) => {
      if (!rec.panels) return;
      const p = players.get(rec.id);
      if (!p || p.state !== "frozen") return;
      if (p.pads > 0 && p.exact && now - p.t < 500 &&
          p.t > rec.movedAt + FIELD_SETTLE && p.t !== rec.lastT) {
        rec.lastT = p.t;
        const d = Math.hypot(p.x - rec.x, p.z - rec.z);
        rec.outN = d > rec.a + FIELD_T / 2 + FIELD_SLACK ? rec.outN + 1 : 0;
      }
      if (rec.outN >= FIELD_CONFIRM && rec.chases < FIELD_CHASES) {
        rec.chases++;
        const at = predict(p, FIELD_CHASE_LEAD);
        landField(rec, at.x, at.z, standY(p));
        return;
      }
      if (rec.a <= FIELD_A + 0.001) fieldGuard(rec);
    });
  }
  every(fieldTick, FIELD_TICK);

  function buildCage(rec) {
    if (FORCEFIELD) { buildField(rec); return; }
    const H = rec.h;
    const g = document.createElement("m-group");
    g.setAttribute("x", rec.x.toFixed(2));
    g.setAttribute("z", rec.z.toFixed(2));
    g.setAttribute("y", rec.y.toFixed(2));
    cageRoot.append(g);
    const tint = homeCol(rec.team);
    el("m-cylinder", { y: 0.18, radius: CAGE_A + 0.55, height: 0.36, color: STEEL_DK }, g);
    for (let i = 0; i < 6; i++) {
      const a = i * 60, r = a * Math.PI / 180;
      el("m-cube", {
        x: CAGE_A * Math.sin(r), z: CAGE_A * Math.cos(r), y: H / 2, ry: a,
        width: SIDE, height: H, depth: 0.12,
        color: tint, opacity: 0.16, collide: "true",
      }, g);
      el("m-cylinder", {
        x: CORNER * Math.sin((a + 30) * Math.PI / 180),
        z: CORNER * Math.cos((a + 30) * Math.PI / 180),
        y: H / 2, radius: 0.12, height: H + 0.4, color: STEEL,
      }, g);
    }
    // the lid, and the reason nobody vaults out
    el("m-cylinder", {
      y: H + 0.15, radius: CAGE_A + 0.55, height: 0.3,
      color: STEEL_DK, collide: "true",
    }, g);
    el("m-light", { y: H * 0.6, type: "point", intensity: 16, distance: 10, color: tint }, g);
    rec.count = crossLabels(g, H + (H >= CAGE_H ? 0.95 : 0.55), "8",
      tint, "#ffffff", 2.2, 0.9, 56);
    rec.shown = "";
    rec.group = g;
  }

  function removeCage(rec) {
    const i = cages.indexOf(rec);
    if (i >= 0) cages.splice(i, 1);
    if (rec.group && rec.group.parentNode) rec.group.parentNode.removeChild(rec.group);
  }
  function openCage(id) {
    for (let i = cages.length - 1; i >= 0; i--) if (cages[i].id === id) removeCage(cages[i]);
  }

  // The count on the lid, and the sweep. A cage outlives its freeze
  // by nothing: the moment the player thaws, thaw() opens it. This
  // only catches the ones whose owner left the world while inside.
  every(() => {
    const now = Date.now();
    for (let i = cages.length - 1; i >= 0; i--) {
      const c = cages[i];
      const p = players.get(c.id);
      if (!p || p.state !== "frozen") {
        if (now - c.born > FREEZE_MS + 500) removeCage(c);
        continue;
      }
      const left = String(Math.max(0, Math.ceil((p.frozenUntil - now) / 1000)));
      if (left !== c.shown && c.count) {
        c.shown = left;
        c.count.forEach((l) => l.setAttribute("content", left));
      }
    }
  }, 250);

  // THE EIGHT SECONDS RUN THEMSELVES. This is the only way out of a
  // freeze, and it does not ask whether a cage was ever built, where
  // it landed, or whether anybody is still inside it.
  every(() => {
    const now = Date.now();
    players.forEach((p) => {
      if (p.state === "frozen" && now >= p.frozenUntil) thaw(p, now);
    });
  }, 100);

  // ==========================================================
  // MARKERS - a team diamond over everybody, a flag over a carrier
  // ==========================================================
  // A follower is a group that rides with a player. It keeps its own
  // shown position and eases towards where the player will be a
  // moment from now, so it glides between floor reports instead of
  // hopping from one to the next.
  function follower(node) {
    const lerp = document.createElement("m-attr-lerp");
    lerp.setAttribute("attr", "x,z");
    lerp.setAttribute("duration", String(LERP_MS));
    lerp.setAttribute("easing", "linear");
    node.append(lerp);
    return { node: node, x: 0, z: 0, lx: 1e9, lz: 1e9, ly: 1e9, shown: false, showAt: 0 };
  }
  // y is how high above the player's own feet the thing rides, so a
  // marker follows them up a ramp and onto a deck instead of staying
  // down on the floor where they got on.
  function followTo(f, p, y, now) {
    const tgt = markerAt(p, FOLLOW_LEAD);
    const ry = +(standY(p) + y).toFixed(2);
    if (!f.shown) {
      // put it in place while still hidden, then show it - so it never
      // streaks in from wherever it was last
      f.x = tgt.x; f.z = tgt.z; f.lx = f.x; f.lz = f.z;
      f.node.setAttribute("x", f.x.toFixed(2));
      f.node.setAttribute("z", f.z.toFixed(2));
      f.shown = true;
      f.ly = ry;
      f.showAt = now + 140;
      return;
    }
    const dx = tgt.x - f.x, dz = tgt.z - f.z;
    if (Math.hypot(dx, dz) > FOLLOW_SNAP) { f.x = tgt.x; f.z = tgt.z; }
    else { f.x += dx * FOLLOW_EASE; f.z += dz * FOLLOW_EASE; }
    if (Math.hypot(f.x - f.lx, f.z - f.lz) > 0.015) {
      f.lx = f.x; f.lz = f.z;
      f.node.setAttribute("x", f.x.toFixed(2));
      f.node.setAttribute("z", f.z.toFixed(2));
    }
    if (f.showAt && now >= f.showAt) { f.node.setAttribute("y", ry); f.ly = ry; f.showAt = 0; }
    else if (!f.showAt && Math.abs(ry - f.ly) > 0.05) { f.ly = ry; f.node.setAttribute("y", ry); }
  }
  function hideFollower(f) {
    if (!f.shown) return;
    f.node.setAttribute("y", PARK);
    f.shown = false;
    f.showAt = 0;
  }

  // THE SKY BEAM.
  // The floor is the only thing that knows where anybody is, and it
  // knows nothing about height once you leave it. So a marker cannot
  // follow you up - there is no number to follow. What it can do is
  // stand a column of your team colour on the spot you left the
  // ground and run it up through the sky, which puts your colour
  // beside you however high you go, and tells everybody else that
  // somebody is up there and roughly where. It is a sightline, not a
  // wall: nothing collides with it.
  // THE SKY COLUMN.
  // One ball at one height is no good here, because there is no
  // height to put it at. So the marker becomes a column: a thin line
  // of team colour standing on the spot you left the ground, with a
  // team ball threaded up it every SKY_STEP metres. Whatever height
  // you are at, one of them is beside your head - which is the thing
  // that was asked for, done the only way the floor allows. It also
  // tells everybody else at a glance that somebody is up there and
  // where they went up from. Nothing in it collides.
  function skyColumn(g) {
    if (!SKY_COLUMN) return null;   // v15: see THE SKY COLUMN IS OFF
    const c = el("m-group", { y: PARK }, g);
    const parts = [el("m-cube", {
      y: SKY_BEAM / 2, width: SKY_BEAM_W, height: SKY_BEAM, depth: SKY_BEAM_W,
      color: "#ffffff", opacity: SKY_BEAM_OP, collide: "false",
    }, c)];
    for (let i = 1; i <= SKY_DOTS; i++) {
      parts.push(orb({
        y: 2.5 + i * SKY_STEP, radius: 0.34,
        color: "#ffffff", collide: "false",
      }, c));
    }
    c.__parts = parts;
    return c;
  }
  function beamShow(node, on, color) {
    if (!node) return;
    const want = on ? 0 : PARK;
    if (node.__on !== want) { node.__on = want; node.setAttribute("y", want); }
    if (on && color && node.__col !== color) {
      node.__col = color;
      node.__parts.forEach((q) => q.setAttribute("color", color));
    }
  }

  // THE TAIL. When the probe is working the ball rides over your
  // head at your real height, which is right - but from the floor,
  // forty metres below, a small ball against the sky is nothing. So
  // while you are up and tracked, a short line hangs under it. It is
  // not the sky column: the column stands on the ground and marks a
  // spot you have left, this hangs from YOU and moves with you.
  function tail(g) {
    return el("m-cube", {
      y: PARK, width: SKY_BEAM_W, height: GLIDE_TAIL_H, depth: SKY_BEAM_W,
      color: "#ffffff", opacity: SKY_BEAM_OP, collide: "false",
    }, g);
  }
  function tailShow(p, on) {
    if (!p.tail) return;
    const want = on ? +(2.2 - GLIDE_TAIL_H / 2).toFixed(2) : PARK;
    if (p.tail.__on === want) return;
    p.tail.__on = want;
    p.tail.setAttribute("y", want);
    if (on) p.tail.setAttribute("color", homeCol(p.team));
  }

  function markerFor(p) {
    const g = el("m-group", { y: PARK }, markRoot);
    // A REAL SPHERE, not a LOW_POLY cube. Dinopawnz: "maybe turn that
    // square marker into a circle above our heads." Everything else in
    // this document that calls orb() still gets the cheap cube - this
    // is the one thing on screen that is always in shot and always
    // moving, and a cube's hard edges turn a centimetre of movement
    // into a visible flicker where a sphere just slides. At MARKER_R
    // 0.24 it is about 128 triangles a player, which is nothing.
    const gem = MARKER_SPHERE
      ? el("m-sphere", { y: MARKER_Y, radius: MARKER_R, color: "#ffffff" }, g)
      : orb({ y: MARKER_Y, radius: MARKER_R, color: "#ffffff" }, g);
    p.marker = g;
    p.gem = gem;
    p.beam = skyColumn(g);
    p.tail = GLIDE_TAIL ? tail(g) : null;
    // v8: THE SHELL - rides on the player, shown only while frozen
    p.shell = FORCEFIELD ? el("m-sphere", {
      y: PARK, radius: SHELL_R, color: FROZE_COL, opacity: SHELL_OP, collide: "false",
    }, g) : null;
    // a ring on the ground in the team colour. In a scrum every ball
    // is up above the heads and they all look alike from a distance;
    // this is at eye level with the people you are trying to tell
    // apart, and it is right under the person it belongs to.
    p.ring = FOOT_RING ? el("m-cylinder", {
      y: 0.07, radius: 1.15, height: 0.14,
      color: "#ffffff", opacity: 0.55, collide: "false",
    }, g) : null;
    p.follow = follower(g);
  }
  function markerTick() {
    const now = Date.now();
    players.forEach((p) => {
      if (!TEAM_MARKERS || !p.team) return;
      if (!p.marker) markerFor(p);
      // "safe" is the SAFE_AFTER_FREE window (2s) after a freeze ends,
      // when nobody can tag you - shown as a white shell
      const want = !present(p) ? "hide" : p.state === "frozen" ? "frozen"
        : now < p.safeUntil ? "safe" + p.team : "team" + p.team;
      if (want !== p.shown) {
        p.shown = want;
        const safe = want.indexOf("safe") === 0;
        if (p.shell) {
          p.shell.setAttribute("y", want === "frozen" || safe ? 1.0 : PARK);
          p.shell.setAttribute("color", safe ? "#ffffff" : FROZE_COL);
          p.shell.setAttribute("opacity", safe ? 0.18 : SHELL_OP);
        }
        if (want !== "hide") {
          const c = want === "frozen" ? FROZE_COL : homeCol(p.team);
          p.gem.setAttribute("color", c);
          if (p.ring) p.ring.setAttribute("color", c);
        }
      }
      if (want === "hide") {
        beamShow(p.beam, false); tailShow(p, false); hideFollower(p.follow); return;
      }
      followTo(p.follow, p, 0, now);
      // up in the air the ball is at the height they took off from,
      // which is nowhere near them. The beam is what they are marked
      // by until they land.
      // The sky column is the FALLBACK. When the probe is calibrated
      // the ball is already over their head at their real height, so
      // the column is not needed and would only be a line standing on
      // a spot they left. It comes back the moment tracking drops.
      const trk = tracked(p);
      beamShow(p.beam, highUp(p) && !trk, want === "frozen" ? FROZE_COL : homeCol(p.team));
      // The tail is a "somebody is above you" sign for people on the
      // pitch, so it is only ever hung over the pitch - the same
      // touchline present() uses.
      tailShow(p, trk && p.pads === 0 && highUp(p) && overField(markerAt(p, 0)));
    });
    // THE BALL RIDES WHOEVER HAS IT, and comes home if they go.
    //
    // TWO CLOCKS ON A CARRIED BALL, and the shorter one wins.
    //
    // The first only starts once the flight they might be in the
    // middle of is over, so no jump or glide can run it out - the
    // ball resets because its carrier LEFT, never because they went
    // up. Somebody who walks off the touchline is off the pitch in a
    // fifth of a second and has dropped it inside four.
    //
    // The second does not care what the floor thinks. It is a hard
    // ceiling on how long the ball may be held by somebody no pad has
    // reported at all, and it exists because "airborne" and "gone"
    // look identical from down here. A player who disappears in the
    // middle of the pitch without a disconnect - a respawn, a portal,
    // a client that dies quietly - would otherwise take the only
    // object in this game out of the world with them, and with it
    // everybody's ability to tag anybody.
    if (ball.state === "carried") {
      const p = players.get(ball.carrier);
      if (!p) {
        dropBall("BALL RESET", WIN_GOLD);
      } else if (p.offSince && now - p.offSince > BALL_AIR_MAX) {
        dropBall("BALL RESET", WIN_GOLD);
      } else if (!onPitch(p) && p.offSince &&
                 now - p.offSince > BALL_OFF_MS + airWindow(p)) {
        dropBall("BALL OUT OF PLAY - RESET", WIN_GOLD);
      } else {
        followTo(ball.follow, p, BALL_RIDE, now);
        beamShow(ball.beam, highUp(p) && !tracked(p), WIN_GOLD);
      }
    }
  }
  every(markerTick, FOLLOW_MS);

  // floods flash a team colour on a capture
  function flash(color) {
    flashUntil = Date.now() + 1500;
    floods.forEach((l) => l.setAttribute("color", color));
  }
  function unflash() {
    flashUntil = 0;
    floods.forEach((l) => l.setAttribute("color", LAMP));
  }

  // ==========================================================
  // BOARDS
  // ==========================================================
  const statusLabels = [];
  const countLabels = [];
  const keyDisplays = [];
  const diagLabels = [];

  function ago(ms) {
    const t = Math.floor(Math.max(0, ms) / 1000), m = Math.floor(t / 60), r = t % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  // UP is how long this copy of the document has been running. IDS
  // says whether collisions are arriving with player ids - without
  // them this game cannot tell anybody apart.
  // v8: the short form, for the jumbotron between games
  function airStatus() {
    if (!GLIDE_PROBE) return "AIR OFF";
    if (!probeEvents) return "AIR: NO PROBE";
    const now = Date.now();
    // the frame with the most samples, fitted or not
    const F = (FIT.doc.n || 0) >= (FIT.el.n || 0) ? FIT.doc : FIT.el;
    let t = "AIR: " + (fitBest ? "OK" : "LEARNING " + Math.min(F.n || 0, FIT_MIN) + "/" + FIT_MIN);
    const G = fitBest || F;
    if (G.f) t += " ERR " + G.f.rms.toFixed(1) + "M SPREAD " + G.f.spread.toFixed(0) + "M";
    t += "   " + probeReport() + "   KICK" + probeKicks;
    const quiet = Math.round((now - probeLastAt) / 1000);
    if (quiet >= 3) t += " QUIET " + quiet + "S";
    return t;
  }
  let lastDiag = "";
  function paintDiag() {
    const now = Date.now();
    let text = BUILD + "   UP " + ago(now - BOOT) + "   " +
      (idSeen ? "IDS OK" : noIdHits ? "NO PLAYER IDS" : "IDS -");
    if (lastStop) text += "   STOPPED BY " + lastStop.why + " " + ago(now - lastStop.at) + " AGO";
    // v8: AIR - is anything able to see players off the ground?
    //   AIR OFF          GLIDE_PROBE is false
    //   AIR NO PROBE     not one probe event has ever arrived. The world
    //                    is not sending them, and nothing in this file
    //                    can track a player in the air without them.
    //   AIR PROBE QUIET  it did report, but not in the last 3 seconds
    //   AIR CAL n/m      reporting; n of the m players it has seen are
    //                    calibrated. Only calibrated players are tracked
    //                    in the air. n stuck at 0 = calibration bug.
    if (!GLIDE_PROBE) text += "   AIR OFF";
    else if (!probeEvents) text += "   AIR NO PROBE";
    else {
      let seen = 0, cal = 0, gint = 0;
      players.forEach((p) => {
        if (p.gt && now - p.gt < 5000) {
          seen++; gint = Math.max(gint, p.gint || 0);
          if (fitBest || p.cal >= CAL_MIN) cal++;
        }
      });
      text += "   AIR CAL " + cal + "/" + seen + " " + Math.round(gint) + "MS";
      const F = fitBest || (FIT.doc.f && (!FIT.el.f || FIT.doc.f.rms <= FIT.el.f.rms) ? FIT.doc : FIT.el);
      if (F && F.f) text += "   FIT " + (fitBest ? "OK " : "NO ") + F.name + " " +
        F.f.rms.toFixed(1) + "M/" + F.f.spread.toFixed(0) + "M N" + F.n +
        " " + Math.round(Math.atan2(F.f.s, F.f.c) * 180 / Math.PI) + (F.f.mirror ? "M" : "");
      else text += "   FIT -";
    }
    if (scriptErrors) text += "   ERR " + scriptErrors + " " + lastError;
    if (text === lastDiag) return;
    lastDiag = text;
    diagLabels.forEach((l) => l.setAttribute("content", text));
  }

  let lastBanner = "", lastBannerColor = "", lastCount = "";
  function setBanner(text, color) {
    if (text === lastBanner && color === lastBannerColor) return;
    lastBanner = text; lastBannerColor = color;
    statusLabels.forEach((l) => {
      l.setAttribute("content", text);
      l.setAttribute("font-color", color);
    });
  }
  function setCount(text) {
    text = text + "   " + BUILD;
    if (text === lastCount) return;
    lastCount = text;
    countLabels.forEach((l) => l.setAttribute("content", text));
  }

  let noticeText = "", noticeUntil = 0, noticeColor = CHALK;
  function notice(text, ms, color) {
    noticeText = text;
    noticeUntil = Date.now() + ms;
    noticeColor = color || CHALK;
    paintBoards();
  }

  const padShown = new Map();
  let penDoorShown = "";
  function paintPenDoors() {
    let top = "WAITING FOR HOST", big = "";
    if (phase === "COUNT") { top = "GAME STARTS IN"; big = String(Math.max(0, countLeft)); }
    else if (restartAt) { top = "RESTARTING - COUNTDOWN IN"; big = String(Math.max(0, Math.ceil((restartAt - Date.now()) / 1000))); }
    else if (phase === "LIVE") { top = "GAME IN PROGRESS"; big = "SHUT"; }
    const key = top + "|" + big;
    if (key === penDoorShown) return;
    penDoorShown = key;
    penDoorTop.forEach((l) => l.setAttribute("content", top));
    penDoorBig.forEach((l) => {
      l.setAttribute("content", big);
      l.setAttribute("font-color", phase === "COUNT" && countLeft <= 3 ? CALL_RED : WIN_GOLD);
    });
  }
  function paintBoards() {
    paintDiag();
    paintPenDoors();
    paintSigns();
    padCounts.forEach(([label, t]) => {
      const text = teamName(t) + " " + teamCount(t);
      if (padShown.get(label) !== text) { padShown.set(label, text); label.setAttribute("content", text); }
    });
    const now = Date.now();
    const title = phase === "STANDBY" ? "KODABALL"
      : phase === "COUNT" ? "STARTING IN " + countLeft
      : phase === "WIN" ? teamName(winner) + " WINS"
      : scoreLine();
    const titleColor = phase === "WIN" ? homeCol(winner)
      : phase === "COUNT" ? WIN_GOLD
      : now < noticeUntil ? noticeColor : CHALK;
    setBanner(title, titleColor);
    {
      let bot = "";
      if (phase === "STANDBY") bot = "RED " + teamCount(-1) + "   BLUE " + teamCount(1) + (PROBE_EXPERIMENT ? "   " + airStatus() : "");
      else if (phase === "COUNT") bot = "IN YOUR PENS - DOORS OPEN AT ZERO";
      else if (phase === "WIN") bot = scoreLine();
      else {
        const bt = ballTeam();
        const who = bt ? teamName(bt) + " BALL" : ball.state === "home" ? "BALL LOOSE" : "BALL RESETTING";
        bot = (suddenDeath ? "SUDDEN DEATH" : ROUND_TIME ? ago(clockEnds - now) : "") + "   " + who;
      }
      paintJumbo(phase === "LIVE" ? "RED " + heldSec(-1) + "  -  " + heldSec(1) + " BLUE" : title,
        phase === "LIVE" ? CHALK : titleColor, bot.trim());
    }
    if (now < noticeUntil) { setCount(noticeText); return; }
    if (phase === "COUNT") {
      setCount("STAY IN YOUR PEN   -   THE DOORS OPEN AT ZERO");
    } else if (phase === "STANDBY") {
      setCount("RED " + teamCount(-1) + "   BLUE " + teamCount(1) + "   WALK INTO A PEN TO PICK A SIDE");
    } else if (phase === "WIN") {
      setCount(scoreLine());
    } else {
      const clockText = suddenDeath ? "LEVEL - NEXT SECOND WINS"
        : ROUND_TIME ? ago(clockEnds - now) : "";
      const bt = ballTeam();
      const who = bt ? teamName(bt) + " BALL"
        : ball.state === "home" ? "BALL LOOSE" : "BALL RESETTING";
      setCount([clockText, who,
        "HOLD " + heldSec(-1) + "-" + heldSec(1) + " TO " + holdToWin,
        "FROZEN " + frozenCount(-1) + "-" + frozenCount(1),
      ].filter(Boolean).join("   "));
    }
  }

  // THE JUMBOTRON (v7), and nothing on the walls.
  // Dinopawnz: "remove these ugly green things off the glass walls"
  // and "add a giant jumbotron hanging from the sky in the center of
  // the field that tells the score. make sure the font is big enough
  // so everyone can see it."
  // A four-sided box over mid, 24 metres a side, hung high enough to
  // clear everybody on the third floor. Two lines per face: the
  // score in letters about two and a half metres tall, and the clock
  // and who has the ball under it.
  const JUMBO_Y = 26, JUMBO_W = 24, JUMBO_H = 11;
  const jumboTop = [], jumboBot = [];
  {
    const jg = el("m-group", { y: JUMBO_Y });
    el("m-cube", { width: JUMBO_W, height: JUMBO_H, depth: JUMBO_W, color: "#0a0c10" }, jg);
    el("m-cube", { y: JUMBO_H / 2 + 0.3, width: JUMBO_W + 0.8, height: 0.6, depth: JUMBO_W + 0.8, color: STEEL_DK }, jg);
    el("m-cube", { y: -JUMBO_H / 2 - 0.3, width: JUMBO_W + 0.8, height: 0.6, depth: JUMBO_W + 0.8, color: STEEL_DK }, jg);
    [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([sx, sz]) => {
      el("m-cylinder", { x: sx * 9, z: sz * 9, y: JUMBO_H / 2 + 9, radius: 0.18, height: 18, color: STEEL_DK }, jg);
    });
    [0, 90, 180, 270].forEach((ry) => {
      const r = ry * Math.PI / 180, off = JUMBO_W / 2 + 0.06;
      const fx = +(off * Math.sin(r)).toFixed(3), fz = +(off * Math.cos(r)).toFixed(3);
      jumboTop.push(el("m-label", {
        x: fx, z: fz, y: 1.9, ry: ry, width: JUMBO_W - 1.6, height: 5.2,
        "font-size": 240, alignment: "center",
        color: "#0a0c10", "font-color": CHALK, content: "KODABALL",
      }, jg));
      jumboBot.push(el("m-label", {
        x: fx, z: fz, y: -3.0, ry: ry, width: JUMBO_W - 1.6, height: 3.2,
        "font-size": 150, alignment: "center",
        color: "#0a0c10", "font-color": WIN_GOLD, content: "",
      }, jg));
    });
    el("m-light", { y: -JUMBO_H / 2 - 1, type: "point", intensity: 30, distance: 30, color: "#cfe0ff" }, jg);
  }
  let jumboShown = "";
  function paintJumbo(top, topColor, bot) {
    const key = top + "|" + topColor + "|" + bot;
    if (key === jumboShown) return;
    jumboShown = key;
    jumboTop.forEach((l) => { l.setAttribute("content", top); l.setAttribute("font-color", topColor); });
    // v8: long lines (the AIR readout between games) get a smaller font
    const fs = bot.length > 60 ? 70 : bot.length > 30 ? 95 : 150;
    jumboBot.forEach((l) => { l.setAttribute("content", bot); l.setAttribute("font-size", fs); });
    // v8: and every wall screen says the same
    const wfs = bot.length > 26 ? 40 : 55;
    wallScreens.forEach(([tl, bl]) => {
      tl.setAttribute("content", top);
      tl.setAttribute("font-color", topColor);
      bl.setAttribute("content", bot);
      bl.setAttribute("font-size", wfs);
    });
  }

  // ==========================================================
  // GAME FLOW
  // ==========================================================
  // ==========================================================
  // STARTING, AND BEING SEEN TO START
  // ==========================================================
  // Dinopawnz: "there needs to be a way for players to know that the
  // game started."
  //
  // There was not one. The operator typed 1718 into a console in a
  // side room and the game simply became live, with a four-second
  // line of text on boards most of the room could not see. Somebody
  // standing in a corner room on the ground floor had no way at all
  // of knowing.
  //
  // So starting is now an EVENT, and it happens to the whole room at
  // once:
  //
  //   COUNT_FROM seconds of countdown, not an instant switch
  //   every board in the world showing the number
  //   the eight floodlights strobing on each second
  //   the floor ring under the ball pulsing with them
  //   the gates dropping shut on both pens at zero
  //   and the whole arena flashing white on GO
  //
  // None of it is text you have to be facing to read. If the lights
  // in this room change, the game changed.
  const COUNT_FROM = 10;        // v8: was 5
  let countLeft = 0, countNext = 0;

  function armGame() {
    thawAll();
    ballHome();
    score["-1"] = 0; score["1"] = 0;
    suddenDeath = false;
    winner = 0;
    phase = "COUNT";
    // v7: the code shuts both gates on every pen straight away - you
    // are in your pen for the countdown
    penTick();
    countLeft = COUNT_FROM;
    countNext = Date.now() + 1000;
    notice("GET READY", 1200, WIN_GOLD);
    flash(WIN_GOLD);
    paintBoards();
  }

  function countTick() {
    if (phase !== "COUNT") return;
    const now = Date.now();
    if (now < countNext) return;
    countNext = now + 1000;
    countLeft--;
    if (countLeft > 0) {
      // strobe: the lights go team-neutral gold on the odd seconds
      // and back to white on the even ones, so the change is visible
      // from anywhere in the room including with your back to it
      if (countLeft % 2) flash(WIN_GOLD); else unflash();
      paintBoards();
      return;
    }
    startGame();
  }
  every(countTick, 100);

  function startGame() {
    thawAll();
    ballHome();
    score["-1"] = 0; score["1"] = 0;
    holdLast = Date.now();
    suddenDeath = false;
    winner = 0;
    clockEnds = Date.now() + ROUND_TIME * 1000;
    phase = "LIVE";
    // the pens: see penTick. Both doorways open now; the upper one
    // shuts after UPPER_OPEN_MS.
    liveSince = Date.now();
    penTick();
    flash(CHALK);
    later(unflash, 900);
    notice("GO!   FIRST TO " + holdToWin + " POINTS - TEAMS ARE LOCKED", 4000, CHALK);
    paintBoards();
  }

  function stopGame() {
    const lastPhaseLive = phase === "LIVE";
    phase = "STANDBY";
    countLeft = 0;
    thawAll();
    ballHome();
    unflash();
    if (lastPhaseLive) endedAt = Date.now();
    penTick();
    paintBoards();
  }

  function finish(t) {
    phase = "WIN";
    winner = t;
    countLeft = 0;
    thawAll();
    ballHome();
    endedAt = Date.now();
    penTick();                // the pens open again when it is over -
                              // walk up to your base and out the back,
                              // or out the back of the pen room
    flash(homeCol(t));
    notice(teamName(t) + " WINS!   " + scoreLine(), 15000, homeCol(t));
  }

  let stopArmedUntil = 0;
  let lastStop = null;
  // v8: RESTART. Stop whatever is happening, open the pens so people
  // can walk back, then start a fresh countdown RESTART_WAIT later.
  // Typing the start/stop code during the wait skips the wait and
  // starts the countdown now; typing it again during the countdown
  // stops everything.
  let restartAt = 0;
  function restartGame() {
    if (phase !== "STANDBY") { lastStop = { at: Date.now(), why: "RESTART" }; stopGame(); }
    stopArmedUntil = 0;
    restartAt = Date.now() + RESTART_WAIT * 1000;
    notice("RESTARTING - GET BACK TO YOUR PENS", 4000, WIN_GOLD);
    paintBoards();
  }
  every(() => {
    if (!restartAt) return;
    const now = Date.now();
    if (phase !== "STANDBY") { restartAt = 0; return; }
    if (now >= restartAt) { restartAt = 0; noticeUntil = 0; armGame(); return; }
    notice("RESTART IN " + Math.ceil((restartAt - now) / 1000) + " - GET TO YOUR PENS", 1200, WIN_GOLD);
    paintBoards();
  }, 1000);

  function toggleGame() {
    if (phase === "COUNT") { stopArmedUntil = 0; noticeUntil = 0; stopGame(); return; }
    if (phase !== "LIVE") { stopArmedUntil = 0; noticeUntil = 0; armGame(); return; }
    const now = Date.now();
    if (STOP_TWICE && now > stopArmedUntil) {
      stopArmedUntil = now + 10000;
      notice("ENTER THE CODE AGAIN TO STOP", 10000, CHALK);
      return;
    }
    stopArmedUntil = 0;
    noticeUntil = 0;
    lastStop = { at: now, why: "CODE" };
    stopGame();
  }

  // the clock
  every(() => {
    if (phase === "LIVE" && ROUND_TIME && !suddenDeath && Date.now() >= clockEnds) {
      // whole seconds, so three milliseconds of hold never decides a
      // ten-minute game
      if (heldSec(-1) !== heldSec(1)) finish(heldSec(-1) > heldSec(1) ? -1 : 1);
      else { suddenDeath = true; notice("TIME! LEVEL - NEXT SECOND OF BALL WINS", 8000, WIN_GOLD); }
    }
    paintBoards();
  }, 1000);

  every(() => { if (flashUntil && Date.now() > flashUntil) unflash(); }, 200);

  // ==========================================================
  // OPERATOR CONSOLES
  // ==========================================================
  let entry = [];
  let entryExpires = 0;

  function setKeyDisplay() {
    const dots = [];
    for (let i = 0; i < CODE.length; i++) dots.push(i < entry.length ? "*" : "-");
    let text = dots.join(" ");
    // v26: past four digits it can only be a score being typed - show it
    if (entry.length > CODE.length) text = "* * * * " + entry.slice(CODE.length).join("") + " OK?";
    keyDisplays.forEach((l) => l.setAttribute("content", text));
  }

  const CODES = [CODE, RESTART_CODE];
  function isPrefix(seq) {
    return CODES.some((c) => seq.every((d, i) => c[i] === d));
  }
  function same(a, b) { return a.length === b.length && a.every((d, i) => d === b[i]); }

  // v8: THE KEYPADS GIVE NOTHING AWAY. Every key adds a star, right
  // or wrong, and nothing is checked until all four are in. A wrong
  // code clears the lot and says WRONG - no hint which digits were
  // right. There is no lockout.
  let keyMsgUntil = 0;
  function keyMessage(text, ms) {
    keyMsgUntil = Date.now() + ms;
    keyDisplays.forEach((l) => l.setAttribute("content", text));
    later(() => { if (Date.now() >= keyMsgUntil) setKeyDisplay(); }, ms + 20);
  }
  // v26: 2233 is different - it waits for the score and then OK (or,
  // in the TYPE CODE box, just the whole thing: 2233400)
  function setWinTarget(n, who) {
    if (!(n >= SCORE_MIN && n <= SCORE_MAX)) { keyMessage("SCORE 1-9999", 1800); return; }
    if (phase === "LIVE" && n <= Math.max(heldSec(-1), heldSec(1))) {
      keyMessage("TOO LOW NOW", 1800);
      return;
    }
    holdToWin = n;
    keyMessage("FIRST TO " + n, 2500);
    notice("FIRST TO " + n + " POINTS", 3500, WIN_GOLD);
    paintBoards();
  }
  function submitScore(who) {
    const typed = entry;
    entry = [];
    if (typed.length > SCORE_CODE.length && same(typed.slice(0, SCORE_CODE.length), SCORE_CODE)) {
      setWinTarget(Number(typed.slice(SCORE_CODE.length).join("")), who);
    } else {
      keyMessage("WRONG", 1200);
    }
  }
  function enter(digit, who) {
    const now = Date.now();
    if (now > entryExpires) entry = [];
    entryExpires = now + CODE_TIMEOUT * 1000;
    entry.push(digit);
    if (entry.length < CODE.length) { keyMsgUntil = 0; setKeyDisplay(); return; }
    // 2233 keeps listening for the score (up to four more digits)
    if (same(entry.slice(0, SCORE_CODE.length), SCORE_CODE)) {
      if (entry.length > SCORE_CODE.length + 4) entry = entry.slice(0, SCORE_CODE.length + 4);
      keyMsgUntil = 0;
      setKeyDisplay();
      return;
    }
    const typed = entry;
    entry = [];
    if (same(typed, CODE)) {
      setKeyDisplay();
      restartAt = 0;
      toggleGame(who);
    } else if (same(typed, RESTART_CODE)) {
      setKeyDisplay();
      restartGame();
    } else {
      keyMessage("WRONG", 1200);
    }
  }

  function press(digit, clear, cap, who, ok) {
    const lit = clear ? CALL_RED : WIN_GOLD;
    const dark = clear ? CALL_DIM : ok ? OK_DIM : "#2a3530";
    cap.setAttribute("color", lit);
    later(() => cap.setAttribute("color", dark), 150);
    if (clear) {
      entry = [];
      setKeyDisplay();
    } else if (ok) {
      submitScore(who);
    } else {
      enter(digit, who);
    }
  }
  const OK_DIM = "#1f3a2a";

  // a code typed into the TYPE CODE box: exactly four digits, or it
  // is simply a wrong code
  function typedCode(event) {
    const d = event.detail || {};
    let typed = String(d.value || "").replace(/[^0-9]/g, "");
    // v26: 2233 followed by a score, all in one go
    if (typed.length > SCORE_CODE.length && typed.startsWith(SCORE_CODE.join(""))) {
      entry = typed.split("").map(Number);
      submitScore(d.connectionId);
      return;
    }
    if (typed.length !== CODE.length) typed = "x".repeat(CODE.length);
    entry = [];
    for (let i = 0; i < typed.length; i++) enter(typed[i] === "x" ? -1 : Number(typed[i]), d.connectionId);
  }
  const KEYS = [
    ["1", "2", "3"],
    ["4", "5", "6"],
    ["7", "8", "9"],
    ["C", "0", "OK"],
  ];

  function buildConsole(zPod, face) {
    const ry = face < 0 ? 180 : 0;
    // v6: the pens are upstairs, so the whole pod is built on a group
    // at pen-floor height. el() with no parent means the arena, so
    // every piece below is routed through up().
    const pod = el("m-group", { y: PEN_Y - 0.1 });
    const up = (tag, attrs) => el(tag, attrs, pod);

    up("m-cube", { z: zPod, y: 0.5, width: 18, height: 1, depth: 10, color: CONCRETE, collide: "true" });
    up("m-cube", { z: zPod + face * 5.6, y: 0.25, width: 18, height: 0.5, depth: 1.6, color: STEEL_DK, collide: "true" });
    up("m-cube", { z: zPod, y: 1.04, width: 18.4, height: 0.12, depth: 10.4, color: homeCol(face) });
    [-1, 1].forEach((s) => {
      up("m-cylinder", { x: s * 7.5, z: zPod - face * 3.5, y: 3, radius: 0.35, height: 6, color: STEEL_DK });
      orb({ x: s * 7.5, z: zPod - face * 3.5, y: 6.3, radius: 0.55, color: LAMP }, pod);
      up("m-light", { x: s * 7.5, z: zPod - face * 3.5, y: 6.3, type: "point", intensity: 5, color: LAMP });
    });

    const cg = document.createElement("m-group");
    cg.setAttribute("z", zPod + face);
    cg.setAttribute("y", 1);
    cg.setAttribute("ry", ry);
    pod.append(cg);

    el("m-cube", { y: 0.3, width: 2.6, height: 0.6, depth: 0.7, color: CONCRETE, collide: "true" }, cg);
    el("m-cube", { y: 2.2, width: 3.4, height: 3.3, depth: 0.2, color: BOARD, collide: "true" }, cg);
    [-1, 1].forEach((s) => {
      el("m-cube", { x: s * 1.76, y: 2.2, width: 0.16, height: 3.3, depth: 0.28, color: FRAME }, cg);
    });
    [0.55, 3.85].forEach((y) => {
      el("m-cube", { y: y, width: 3.68, height: 0.16, depth: 0.28, color: FRAME }, cg);
    });

    statusLabels.push(el("m-label", {
      y: 3.58, z: 0.12, width: 3.0, height: 0.5,
      "font-size": 40, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "KODABALL",
    }, cg));

    keyDisplays.push(el("m-label", {
      y: 3.06, z: 0.12, width: 3.0, height: 0.46,
      "font-size": 36, alignment: "center",
      color: "#101a15", "font-color": HOME_YEL, content: "- - - -",
    }, cg));

    countLabels.push(el("m-label", {
      y: 0.34, z: 0.4, width: 3.3, height: 0.4,
      "font-size": 17, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "",
    }, cg));
    diagLabels.push(el("m-label", {
      y: 0.08, z: 0.4, width: 3.3, height: 0.28,
      "font-size": 11, alignment: "center",
      color: BOARD, "font-color": STEEL, content: "",
    }, cg));

    KEYS.forEach((row, r) => {
      row.forEach((key, c) => {
        if (key === "") return;
        const clear = key === "C";
        const ok = key === "OK";
        const x = (c - 1) * 0.92;
        const y = 2.42 - r * 0.62;

        const cap = el("m-cube", {
          x: x, y: y, z: 0.2,
          width: 0.78, height: 0.5, depth: 0.24,
          color: clear ? CALL_DIM : ok ? OK_DIM : "#2a3530",
          collide: "true",
        }, cg);

        const capFace = el("m-label", {
          z: 0.13, width: 0.74, height: 0.42,
          "font-size": ok ? 24 : 30, alignment: "center",
          color: clear ? CALL_DIM : ok ? OK_DIM : "#2a3530",
          "font-color": clear ? CALL_RED : ok ? "#7fe0a0" : CHALK,
          content: key, collide: "true",
        }, cap);

        let last = 0;
        const hit = (e) => {
          const now = Date.now();
          if (now - last < 180) return;
          last = now;
          press(Number(key), clear, cap, e && e.detail ? e.detail.connectionId : undefined, ok);
        };
        on(cap, "click", hit);
        on(capFace, "click", hit);
      });
    });

    // and the button that opens every cage, beside the keypad

    // typed entry, as a backstop for a fiddly cursor
    const promptWrap = document.createElement("m-prompt");
    promptWrap.setAttribute("message", "Operator code");
    promptWrap.setAttribute("placeholder", "code (2233 + score to set the score)");
    pod.append(promptWrap);

    const promptPad = el("m-cube", {
      z: zPod + face * 3.6, y: 1.08,
      width: 3.6, height: 0.16, depth: 1.6,
      color: BOARD, collide: "true",
    }, promptWrap);

    el("m-cube", {
      z: zPod + face * 3.6, y: 1.1,
      width: 3.9, height: 0.1, depth: 1.9, color: FRAME,
    }, pod);

    el("m-label", {
      y: 0.1, rx: -90, rz: ry,
      width: 3.4, height: 1.4,
      "font-size": 30, alignment: "center",
      color: BOARD, "font-color": CHALK,
      content: "TYPE CODE", collide: "true",
    }, promptPad);

    on(promptWrap, "prompt", (event) => typedCode(event));
  }

  // v8: THE DOOR LOCKS. A small host keypad on the map side of each
  // 2nd floor pen door, on the wall beside the doorway, so the host
  // can stop or restart a game from the field while the pens are
  // shut. Same codes as the consoles; the codes are not written on it.
  //   1718  start / stop (stopping a live game needs it twice)
  //   1719  restart: stop now, pens open, countdown in RESTART_WAIT
  function buildDoorLock(x, t) {
    const g = el("m-group", {
      x: x, z: t * (OCT_A - 0.7 - 0.12), y: UPPER, ry: t > 0 ? 180 : 0,
    });
    el("m-cube", { y: 1.55, width: 1.9, height: 2.9, depth: 0.16, color: BOARD, collide: "true" }, g);
    el("m-cube", { y: 1.55, width: 2.06, height: 3.06, depth: 0.1, z: -0.04, color: FRAME }, g);
    el("m-label", {
      y: 2.82, z: 0.09, width: 1.8, height: 0.3, "font-size": 22, alignment: "center",
      color: BOARD, "font-color": homeCol(t), content: "HOST LOCK",
    }, g);
    keyDisplays.push(el("m-label", {
      y: 2.48, z: 0.09, width: 1.6, height: 0.34, "font-size": 26, alignment: "center",
      color: "#101a15", "font-color": HOME_YEL, content: "- - - -",
    }, g));
    KEYS.forEach((row, r) => {
      row.forEach((key, c) => {
        if (key === "") return;
        const clear = key === "C";
        const ok = key === "OK";
        const cap = el("m-cube", {
          x: (c - 1) * 0.52, y: 2.0 - r * 0.42, z: 0.12,
          width: 0.44, height: 0.34, depth: 0.12,
          color: clear ? CALL_DIM : ok ? OK_DIM : "#2a3530", collide: "true",
        }, g);
        const face = el("m-label", {
          z: 0.07, width: 0.42, height: 0.3, "font-size": ok ? 18 : 22, alignment: "center",
          color: clear ? CALL_DIM : ok ? OK_DIM : "#2a3530",
          "font-color": clear ? CALL_RED : ok ? "#7fe0a0" : CHALK,
          content: key, collide: "true",
        }, cap);
        let last = 0;
        const hit = (e) => {
          const now = Date.now();
          if (now - last < 180) return;
          last = now;
          press(Number(key), clear, cap, e && e.detail ? e.detail.connectionId : undefined, ok);
        };
        on(cap, "click", hit);
        on(face, "click", hit);
      });
    });
    // and a TYPE CODE button under the keys, for a fiddly cursor
    const wrap = document.createElement("m-prompt");
    wrap.setAttribute("message", "Host code");
    wrap.setAttribute("placeholder", "code (2233 + score to set the score)");
    g.append(wrap);
    const btn = el("m-cube", { y: 0.3, z: 0.12, width: 1.5, height: 0.3, depth: 0.12, color: FRAME, collide: "true" }, wrap);
    el("m-label", {
      z: 0.07, width: 1.46, height: 0.26, "font-size": 18, alignment: "center",
      color: FRAME, "font-color": CHALK, content: "TYPE CODE", collide: "true",
    }, btn);
    on(wrap, "prompt", (event) => typedCode(event));
  }
  if (DOOR_LOCKS) [-1, 1].forEach((t) => buildDoorLock(DOOR_W / 2 + 3, t));

  buildConsole(CTRL_Z, -1);
  if (FINISH_CONSOLE) buildConsole(FIN_CTRL_Z, 1);

  // ==========================================================
  // GO
  // ==========================================================
  setKeyDisplay();
  stopGame();
</script>
