  v8 - 150 TO WIN, A NEW PEN ROOM, AND AN AIR-TRACKING READOUT

    * THE TIMELINE (penTick has the full table):

    * Mid-air tracking depends entirely on m-position-probe. It now
      LEARNS how the probe's numbers relate to the map (turned,

        AIR NO PROBE      the world sends no probe data at all
        AIR CAL n/m 100MS n of m players tracked; probe interval
        FIT OK DOC 0.1M/11M N89 0   the learned fit, its error, how
                          spread out the samples are, and the turn
    * HOST LOCKS: a keypad on the wall beside each 2nd floor pen door,

  v6 - FIVE CHANGES FROM DINOPAWNZ, ALL MADE.

    3. NO JOIN BUTTONS. The whole pen floor is the join pad - walk

    SPAWN MOVED UP: set it to x 0, z 96, y 7.2 in the RED pen (v8).

  v5 - THE MAP IS NEW, AND ONLY THE MAP.
    Dinopawnz: "the map is just awful for KodaBall. REDO THE MAP IN
    ITS ENTIRETY... little areas that can be defended well...

    think maps like guardian... recharge... heretic."
    Rules, cages, tracking, pens and consoles are exactly v4's.

  ------------------------------------------------------------
  THE RULE, and it is one table

  POSSESSION IS PERMISSION. There are no halves in KodaBall, no
  home ground and nowhere safe. There is only: who has it.

                        TARGET
                  a plain      the
                  enemy        carrier
    TAGGER   +-------------+-------------+
    ball     |    YES      |      -      |  your escort
    team     +-------------+-------------+
    other    |     NO      |     YES     |  always, anywhere
    team     +-------------+-------------+
    the      |     NO      |     NO      |  hands full
    carrier  +-------------+-------------+

  With the ball loose on its plinth, nobody tags at all. A drop is
  a footrace, not a brawl. LOOSE_BALL_TAGS turns that round.

  ------------------------------------------------------------
  THE FREEZE IS A RULE. THE CAGE IS FURNITURE.

  Eight seconds on the player: cannot tag, cannot be tagged,
  cannot pick the ball up, drops it if they had it. That number
  is on a player record, so it cannot fail to apply.

  The cage is thrown at the floor afterwards, led along their
  heading. Sometimes it lands square. Sometimes a sprinter is
  already past it. It does not matter: the freeze has already
  happened, and somebody who outran their own cage still cannot
  touch the carrier for eight seconds.

  Capture the Flag had these the other way round - no room for a
  cage meant no catch - and that is the bug this version is
  built to not have.

  The one thing this cage does that Red Light's does not is
  MEASURE THE CEILING. Most of the ground worth fighting on here
  is under the ring deck, four metres up, and a seven-metre cage
  under it would grow through the street above. So the lid is
  built to the air that is actually there.

  ------------------------------------------------------------

              zig-zag corridors, four open ALLEYS behind the towers.
    UPPER     each team's BASE deck with a balcony over mid. Four
              TOWERS (two doors, a window slit over the ball). Two

    STAIRS    ten. 2 per base out of mid, 1 per side out of the

  position probe sits outside the turned group and its readings

  BUILD_RY 0 undoes both together.

  ------------------------------------------------------------
  HOST

  1718 on either console to start, twice to stop. Nobody needs

  IDS OK on the consoles is the first thing to check.

<m-group id="world">
  <m-group id="arena"></m-group>
  <m-group id="ball"></m-group>
  <m-group id="shells"></m-group>
  <m-group id="marks"></m-group>
</m-group>
<m-group id="probe"></m-group>

<script>
  // ==========================================================
  // GUARD - nothing that happens in an event or a timer can take
  // the script down. Errors are counted on the consoles (ERR n).
  // ==========================================================
  const BUILD = "KODABALL V29";
  const BOOT = Date.now();
  let scriptErrors = 0;
  let lastError = "";
  function guard(fn) {
    return function (a, b) {
      try { return fn.call(this, a, b); }
      catch (err) {
        scriptErrors++;
        lastError = String((err && err.message) || err).slice(0, 40);
      }
    };
  }
  function every(fn, ms) { return setInterval(guard(fn), ms); }
  function later(fn, ms) { return setTimeout(guard(fn), ms); }
  function on(node, type, fn) { node.addEventListener(type, guard(fn)); }

  // ==========================================================
  // TUNING
  // ==========================================================

  // --- the match --------------------------------------------
  // There is no scoreboard in KodaBall, there are two stopwatches.
  // Each team's runs while one of theirs is holding the ball.
  const HOLD_TO_WIN = 150;      // points to win - one point per second held (v8: was 100)
                                // v26: the host can change it from any keypad:
                                // 2233 then the score, then OK (e.g. 2233400 OK)
  const ROUND_TIME = 600;       // seconds on the match clock. 0 = no clock.
                                // Ahead on the hold clock at the end wins;
                                // dead level and the next second wins it.
  const SCORE_MS = 200;         // how often held time is added on. Small,
                                // because a clock that ticks in whole
                                // seconds loses most of a short hold.

  // --- tagging ----------------------------------------------
  const TAG_R = 1.8;            // metres between two players that is a tag
  const TAG_COOLDOWN = 1500;    // one tagger, one tag per this long
  const HALF_TOL = 0.5;         // (kept because ownHalf() still answers it.
                                // Nothing in KodaBall asks - there are no
                                // halves in this game.)
  const SAFE_AFTER_FREE = 2000; // 2s of no-tag after a freeze ends (v8 had 1s),
                                // shown as a white shell. A shell that just broke cannot be
                                // re-frozen for this long, so nobody can
                                // stand next to you waiting for it
  const LEVEL_TOL = 2.8;        // two players further apart in height than
                                // this are on different floors and cannot
                                // touch each other. Without it everybody on
                                // the ring tags everybody under it.
  const LEAD_MAX = 4.0;         // metres a floor position may be led by its
                                // own speed when the rules ask where
                                // somebody is

  // ==========================================================
  // WHO MAY TAG WHOM  -  the whole game is these four constants
  // ==========================================================
  // POSSESSION IS PERMISSION. The team holding the ball is the only
  // team allowed to tag, because the only reason to tag in this game
  // is to clear people off your own carrier. The team without it may
  // touch exactly one person on the pitch: whoever has the ball.
  //
  //                        TARGET
  //                  a plain      the
  //                  enemy        carrier
  //    TAGGER   +-------------+-------------+
  //    ball     |    YES      |      -      |
  //    team     +-------------+-------------+
  //    other    |     NO      |     YES     |
  //    team     +-------------+-------------+
  //    the      |     NO      |     NO      |  hands full
  //    carrier  +-------------+-------------+
  //
  const POSSESSION_TAGS = true;   // only the holding team may tag plain
                                  // enemies. false makes this an ordinary
                                  // everybody-tags-everybody game.
  const LOOSE_BALL_TAGS = false;  // may anybody tag while the ball is on
                                  // its plinth and nobody has it? No: a
                                  // loose ball is a footrace, not a fight.
                                  // true turns every drop into a brawl.
  const CARRIER_CAN_TAG = false;  // hands full. A carrier catches nobody.
  const CARRIER_TAGGABLE = true;  // and is catchable anywhere, by anybody
                                  // on the other team, with whoever they
                                  // like standing next to them. There is
                                  // no escort mechanic in this document
                                  // and there is not going to be one.
  const PICKUP_GRACE = 1200;      // a carrier cannot be tagged for this
                                  // long after picking the ball up, so the
                                  // scramble at the plinth does not just
                                  // hand it straight back. 0 turns it off.

  // --- the ball ---------------------------------------------
  const BALL_OFF_MS = 3000;     // a carrier off the pitch this long drops it
                                // (BALL_AIR_MAX, the hard ceiling on a ball
                                // held by somebody no pad has reported at
                                // all, is with the jumping constants below,
                                // and BALL_RIDE is with the look ones - both
                                // belong to the problems they solve)
  const RESET_DELAY = 0;        // ms the plinth stays empty after a drop.
                                // 0 = the ball is home before the tagger
                                // has stopped moving, which is the rule as
                                // asked for. A second or two here gives the
                                // scramble somewhere to start FROM.

  // --- the freeze, and the cage -----------------------------
  // TWO SEPARATE THINGS, and keeping them separate is the point.
  // FREEZE_MS is the rule and it cannot miss. The cage is furniture
  // thrown at the floor afterwards and it is allowed to. See THE
  // FREEZE, AND THE CAGE further down.
  const FREEZE_MS = 8000;       // how long you are out of the game for,
                                // caged or not
  const CAGES = true;           // build the box as well. false leaves the
                                // rule running with nothing to look at,
                                // which is a useful thing to test with.
  const CAGE_A = 2.8;           // interior half-width - Red Light's and
                                // Trap Run's, the size that actually lands
                                // on people
  const CAGE_H = 7;             // height WHERE THERE IS ROOM. Red Light's
                                // field is under open sky; most of the
                                // ground worth fighting on in this map has
                                // a deck four metres over it, so see below.
  const CAGE_MIN_H = 3.0;       // a lid lower than this is not a cage
  const CAGE_HEAD_GAP = 0.3;    // air left between the lid and the deck
                                // it is being built under
  const CAGE_LEAD = 1.0;        // metres thrown along their heading. A cage
                                // built exactly where the contact was
                                // reported arrives BEHIND a sprinter.
  const MAX_CAGES = 60;         // hard ceiling, protects framerate
  // v8: THE FORCEFIELD REPLACES THE CAGE.
  // Dinopawnz: "instead of trapping people in cages when they are
  // tagged... apply a shell to them that signifies that they cant tag
  // people and also make it so that player physically cannot move...
  // just put invisible forcefields around that player."
  // So a tagged player gets two things:
  //   THE SHELL - a see-through ice-blue bubble that rides on the
  //     player (it is part of their marker), so it is on them even if
  //     the forcefield misses. It means: frozen, cannot tag.
  //   THE FORCEFIELD - six invisible walls and an invisible lid, built
  //     tight around where they are. No posts, no base, no glass.
  // MML cannot switch a player's movement off, so walls are the only
  // way to hold somebody still, and a wall can only be put where the
  // game THINKS they are. The tighter the field, the less room to move
  // and the more a fast runner can be just outside it when it appears.
  const FORCEFIELD = true;      // false puts the old visible cages back
  // v25: THE FIELD IS SOLID. It used to be possible to walk a frozen
  // player metres away by pushing or bouncing against the walls: the
  // field re-landed on a position led by the player's own speed, so
  // leaning on a wall made the game think they were through it, it
  // moved the field that way, and the player went with it. Now:
  //   * a field LANDS WIDE and SHRINKS onto the player in small steps,
  //     so a wall never appears on top of them and shoves them out -
  //     a closing wall pushes them in, towards the middle;
  //   * once closed it is tight and it DOES NOT MOVE because of
  //     anything a player inside it can do;
  //   * it only re-lands if the floor reports, with real positions
  //     and no guessing, that they are clearly outside it -
  //     FIELD_CONFIRM reports in a row, all sent after it last moved;
  //   * the walls are thicker and go down into the floor, so
  //     there is no gap under them on a step or a ramp.
  const FIELD_A = 0.85;         // closed half-width (wall centre line).
                                // Inside face = FIELD_A - FIELD_T/2 = 0.55m,
                                // about a shuffle each way for an avatar.
                                // If avatars jitter against the walls,
                                // raise it a little (0.95).
  const FIELD_T = 0.6;          // wall thickness
  const FIELD_SINK = 0.8;       // how far the walls go down into the floor
  const FIELD_LAND_A = 2.4;     // half-width it lands at before closing
  const FIELD_STEP = 0.15;      // metres a wall closes per step - less than
                                // an avatar's radius, so it pushes inward
  const FIELD_STEP_MS = 30;     // time between closing steps (~0.3s total)
  const FIELD_H = 2.5;          // the invisible lid - low enough that a
                                // jump goes nowhere
  const FIELD_LEAD = 0.15;      // seconds of travel it is thrown ahead
  const FIELD_TICK = 150;       // how often a field re-checks
  const FIELD_CHASES = 12;      // times a field may re-land on an escaper
  const FIELD_SLACK = 0.5;      // metres past the wall that count as out
  const FIELD_SETTLE = 600;     // ms after a field moves before reports count
  const FIELD_CONFIRM = 1;      // outside reports in a row before it re-lands
  const FIELD_CHASE_LEAD = 0.3; // extra seconds of lead on a re-land (lag)
  const SHELL_R = 1.15;         // the visible bubble
  const SHELL_OP = 0.3;
  const FROZE_COL = "#9fe8ff";  // the colour of being out of the game

  // --- the floor --------------------------------------------
  // THE PAD GRID SCALES WITH THE MAP.
  // 8 metres was right for a 92-metre room. This one is 152 across
  // with two full ring decks and sixteen flights of stairs on it,
  // and at 8 it came to 1145 reporting colliders against Capture the
  // Flag's 875 - a third more traffic than the build this engine is
  // actually proven at. At 10 it lands about level with it.
  //
  // It costs nothing in accuracy. A pad reports where INSIDE itself
  // it was stepped on - listen() adds the collision offset to the
  // pad's own centre - so a wider pad is only coarser in the
  // fallback case where an event arrives with no position at all.
  const FOOT_PITCH = 10;        // floor pad grid, metres
  const PAD_MS = 90;            // collision-interval on every pad
  const GHOST_MS = 90000;       // nobody heard from this long is off the pitch

  // --- jumping ----------------------------------------------
  // A jump takes a player off every pad they were standing on, so the
  // floor goes quiet until they land. These say how long that silence
  // still counts as being on the pitch, and how far a hop carries.
  // v7: this was 2500, which covers a hop and nothing else. A double
  // jump and a glide in Otherside lasts far longer than that, and when
  // the window ran out the jumper was treated as gone: marker parked,
  // carried flag timed out and sent home. It is now long enough that
  // nothing you can do in the air can outlast it. Somebody who really
  // has left is caught by the disconnected event, and by GHOST_MS
  // behind that - neither of which needs this number to be short.
  const AIR_MS = 30000;         // pads all quiet: still on the pitch this long.
                                // Far longer than any jump or glide, and
                                // bounded on purpose - see WHO LEFT below.
  const EDGE_AIR_MS = 600;      // ...but only this long if they were last seen
                                // at the very edge of the pad grid, where
                                // losing the pads means they walked off.
  const EDGE_M = 2.0;           // how close to the edge counts as the edge
  const PITCH_EDGE = 1.5;       // slack outside the touchline that still
                                // counts as being over the pitch, for the
                                // one question that asks - see present().
                                // Somebody standing with their heels on the
                                // line should not flicker.
  const EDGE_LOOK = 1.0;        // seconds of travel used to ask whether they
                                // were heading OFF the pitch when the floor
                                // lost them. Standing at the rim and hopping
                                // straight up is a jump; crossing the rim at
                                // a run is leaving, and this is what tells
                                // the two apart.
  const EDGE_LOOK_MAX = 11;     // metres that look-ahead may cover
  // A HARD CEILING ON A CARRIED FLAG, independent of everything above.
  // The floor cannot tell "in the air" from "gone" - both are silence -
  // and the disconnect event only fires on a clean exit. Somebody who
  // vanishes in the middle of the pitch (a respawn, a portal, a client
  // that dies without saying so) would otherwise hold a flag hostage
  // for as long as the air window runs. Nothing you can do in the air
  // lasts twenty seconds; a ghost holding a flag costs everybody at
  // most that, and then it comes home on its own.
  const BALL_AIR_MAX = 20000;
  const AIR_COAST = 0.85;       // seconds of a hop the marker carries them
                                // forward for before it settles. A little
                                // under a real hop, so it trails rather than
                                // races ahead and has to come back.
  const AIR_LEAD_MAX = 6;       // metres a hop may carry them, at most
  // In the air the floor cannot say where anybody is, so after a hop's
  // worth of silence the game stops pretending it knows. A player who
  // has been off the pads this long is HIGH: still on the pitch, still
  // holding whatever they were carrying, marked by a beam of light
  // instead of by a ball - and out of the tagging game entirely, both
  // ways, until they land. Guessing at a tag against a position that
  // is seconds stale is worse than not tagging at all.
  const HIGH_MS = 1800;         // off the pads this long and you are out
                                // of reach

  // --- the probe, and why it is here now --------------------
  // Every version of this game up to v7 read position from the floor
  // and from nothing else, because m-position-probe's numbers do not
  // line up with the world in Otherside - the note at the top of v6
  // says so and it is still true. The floor is exact and the probe is
  // wrong, so the floor won.
  //
  // But the floor cannot see you in the air, and the probe can.
  //
  // The way out is to use them together: the probe is CONTINUOUS and
  // wrong by some offset; the floor is INTERMITTENT and exact. So
  // every time both speak about the same player in the same moment -
  // which is every step they take on the ground - the difference
  // between the two is measured and kept. That difference is the
  // probe's offset, and once it is known the probe can be corrected
  // into real world coordinates and used where the floor is silent.
  //
  // Stand on the pitch for a second and you are calibrated. Jump, and
  // the game now knows where you are and HOW HIGH, so the marker
  // rides over your head the whole way and a carried flag goes with
  // you. Land, and the floor takes over again and re-checks the
  // offset.
  //
  // If the probe reports nothing in a given world, or its numbers are
  // nonsense, nothing here ever calibrates and every part of it turns
  // itself off: the game falls straight back to v7's behaviour, which
  // is the sky column standing on the spot you took off from. It
  // cannot make anything worse than it already was.
  const GLIDE_PROBE = true;     // false removes the probe entirely
  const PROBE_MS = 100;         // how often it reports
  const PROBE_RANGE = 260;      // metres. The whole arena and then some.
  const PROBE_FRESH = 700;      // a reading older than this is not used
  const CAL_MIN = 4;            // readings that agree with the floor before
                                // the offset is trusted at all
  const CAL_JUMP = 40;          // an offset that moves further than this
                                // between readings is noise, not a
                                // calibration, and is thrown away
  const GLIDE_TAIL = true;      // while tracking is live, hang a short
                                // line under the marker so people on the
                                // ground can see somebody overhead
  const GLIDE_TAIL_H = 14;      // and how long that line is
  // THE SKY COLUMN IS OFF IN v15.
  // Dinopawnz: "remove that weird beam that stores the flag and the
  // team marker whenever somebody glides in the air. its confusing to
  // see a floating flag and teammarker in the middle of nowhere inside
  // of a red or blue beam."
  //
  // Fair, and it was always the ugly half of the design. The column
  // stood on the spot you LEFT THE GROUND and ran a line of team balls
  // up through the sky, which is why it read as "in the middle of
  // nowhere": by the time anybody looked at it, the player it belonged
  // to was fifty metres downfield of it. It only ever existed because
  // v7 had no way to know a player's height.
  //
  // v8 fixed that. The probe gives a real position, the marker rides
  // over the player's actual head at their actual height, and the flag
  // rides with it - which is the thing the column was faking. So the
  // column comes out, and what is left when the probe says nothing is
  // the ball and the ring sitting at the last place the floor saw
  // them, which is honest: it marks where somebody went up from, and
  // it stops pretending to mark where they are now.
  const SKY_COLUMN = false;
  const SKY_BEAM = 96;          // how far up the airborne marker column goes
  const SKY_STEP = 6;           // and a team ball every this many metres of
                                // it, so there is one at your head whatever
                                // height you are at. See THE SKY COLUMN.
  const SKY_BEAM_W = 0.5;       // and how wide. Thin: it is a sightline,
                                // not a wall.
  const SKY_BEAM_OP = 0.42;
  const HOP_MS = 900;           // a hop off one pad (the rescue plate) that
                                // still counts as standing on it

  // --- look -------------------------------------------------
  const TEAM_MARKERS = true;    // a team-coloured ball over every player
  const MARKER_MS = 250;        // (unused since v4 - see FOLLOW_MS)
  // HOW TIGHTLY A MARKER STICKS TO ITS PLAYER. All four of these
  // were loosened in v4 to stop the ball jittering between floor
  // reports, and the cost was a marker that trails its player by a
  // metre or two in a fight - which is exactly when you need to know
  // who is who and who has the flag. The probe reports ten times a
  // second now, so the jitter that made the easing necessary is
  // mostly gone and these can be tightened right up.
  // THE MARKER IS TIGHTER IN v22.
  // Dinopawnz: "the marker doesnt follow our character as accurately
  // as i would like. please make sure the marker above our heads stays
  // as close to our character as possible."
  //
  // There are three separate lags between a player and their ball and
  // v21 was paying all three:
  //   1  the game only hears from the floor every 90ms or so;
  //   2  it only REWROTE the marker every 55ms, and then only closed
  //      88% of the gap it could see;
  //   3  the m-attr-lerp that smooths the write took 85ms to land, so
  //      the thing on your screen was behind even the written value.
  //
  // v22 pays 1 (nothing can be done about it), and all but kills 2
  // and 3: the marker is rewritten every 40ms, it closes the whole
  // gap each time, the lerp is down to 52ms, and the lead is set to
  // the tick plus half the lerp so the interpolation LANDS on the
  // player rather than arriving where they were. The harness now
  // measures the RENDERED ball rather than the bookkeeping, which is
  // the number that was always the honest one.
  const LERP_MS = 115;           // how long the smoothing takes to land.
                                // Long enough that the ball glides
                                // rather than teleports, short enough
                                // that it is never far behind.
  const FOLLOW_MS = 60;         // how often the team balls and carried flags
                                // are moved. Lower is smoother but busier.
  const FOLLOW_LEAD = 0.10;    // seconds ahead of the player they aim, on
                                // TOP of the age of the report itself, which
                                // predict() already allows for. It was 0.12
                                // when the easing was slack and the marker
                                // needed throwing forward to keep up; with
                                // the easing tight that same throw overshoots
                                // by a metre, which is just as unreadable as
                                // trailing by one.
                                // 0.08 through v25, nudged to 0.10 in v26.
                                // The lead has to cover the write interval
                                // plus about half the smoothing, and v24
                                // stretched both of those (40/52ms became
                                // 60/115ms) without re-cutting the lead.
                                // This is the dial if it still is not
                                // right: more makes the ball sit further
                                // forward while you run and overshoot
                                // further when you stop dead, less trails.
                                // 0.06/0.08/0.10/0.12 model out at
                                // 0.33/0.21/0.09/0.03m behind at a sprint
                                // against 0.38/0.50/0.62/0.73m past you on
                                // a dead stop. Do not go past 0.14.
  const FOLLOW_EASE = 1.0;      // how much of the remaining gap is closed
                                // every tick. 0.6 in v4-v8, which leaves
                                // 40% of the error standing after each one.
  const FOLLOW_SNAP = 2.5;      // a gap bigger than this is closed outright
                                // rather than eased - a marker should never
                                // be seen travelling across the pitch
  const MARKER_SPHERE = true;   // the team marker is a real sphere, not a
                                // LOW_POLY cube. See markerFor.
  const MARKER_R = 0.18;        // the team ball. 0.2 in v4, 0.24 in v22-v24,
                                // back under both in v25 because the thing
                                // sits in the middle of your own view all
                                // game and the size that reads best from
                                // 200m away is not the size that is
                                // comfortable to play under. 0.36m across.
  const MARKER_Y = 2.35;        // how high over the player it rides.
  // THE MARKER READS THE PROBE IN v26, NOT THE FLOOR.
  // Dinopawnz: "why does the marker go a little far away when im
  // running. id like it to stay relatively close to my character
  // when im running."
  //
  // Because until now the ball was driven by the FLOOR whenever you
  // were standing on one, and the floor reports the PAD, not the
  // metre. Pads are FOOT_PITCH (8m) apart, so while you run the
  // target the ball is chasing sits at a pad centre and only moves
  // when you cross into the next pad - it can be four or five metres
  // off you at the moment it is read, and the 115ms of smoothing
  // spreads that error out into a ball that drifts behind and then
  // hurries to catch up. Standing still it looks perfect, because a
  // stale pad centre is still the pad you are on. See markerAt.
  //
  // The probe does not have this problem: it reports a real
  // continuous position every PROBE_MS, and once calibrated it can
  // be corrected into world coordinates. It was already what the
  // marker rode on in the AIR - it was only ever thrown away on the
  // ground because the floor is the authority for the RULES. But
  // where to draw a ball is not a rules question.
  const MARKER_PROBE = true;    // drive the ball off the probe, on the
                                // ground as well as in the air. false
                                // puts it back on the floor.
  const MARKER_PROBE_TOL = 6.5; // and a sanity check on that: while a
                                // pad has them, the probe's corrected
                                // position must agree with the pad
                                // within this, or it is not trusted and
                                // the floor takes over. Wider than half
                                // a pad, narrower than a bad
                                // calibration. Nothing about the game
                                // reads the probe - tags, halves, jail
                                // and the flag are all still decided by
                                // the floor exactly as before.
  // THE FOOT RING IS OFF IN v22.
  // It was a team-coloured disc on the ground under every player, put
  // there so you could tell teams apart in a scrum where everybody's
  // ball is up above the heads. Dinopawnz: "i dont like the pad under
  // our feet. remove that. i only care about the marker above our
  // heads. the other marker is just annoying."
  //
  // Fair. It was solving a problem the ball had already solved - the
  // ball rides 2.35m up over the head, which reads fine at any
  // range this pitch has - and it sat right where your avatar's feet
  // and its shadow are, which is the one place on a player nothing
  // should be drawn. One marker per player now: the ball, and a flag
  // over it if they are carrying.
  const FOOT_RING = false;
  // THE BALL RIDES ABOVE THE TEAM MARKER, NOT THROUGH IT.
  // Dinopawnz: "when you pick up the ball, the team marker
  // disappears." It never disappeared - it was swallowed. The marker
  // is a 0.18 sphere at MARKER_Y 2.35, so it occupies 2.17 to 2.53.
  // The ball rode at 1.9 and its skull is a 0.385 sphere centred
  // 0.385 above that, which is 1.9 to 2.67. The marker was sitting
  // entirely INSIDE the ball, and the ball is bigger and opaque.
  //
  // Fixed by moving the BALL rather than the marker, on purpose: the
  // marker is the thing everybody tracks all game and it should be
  // at the same height over every head on the pitch whether they are
  // carrying or not. So the ball floats a little higher and the
  // marker never moves. 2.75 puts the bottom of the skull 0.22 clear
  // of the top of the marker.
  const BALL_RIDE = 2.75;       // how high the ball rides over its
                                // carrier. Lower than v4's 2.2 so it reads
                                // as ON them rather than over them.
  const LOW_POLY = true;        // In MML a sphere costs about a hundred
                                // cubes and a cylinder a dozen, whatever
                                // size they are drawn at. This swaps a
                                // square for a round one everywhere the
                                // thing is small enough that nobody can
                                // tell - lamp globes, the tops of the
                                // touchline flames, the shield dots round
                                // a carrier's feet. It is most of the
                                // triangle count in this world.
  const DETAIL = true;
  const GALLERY = true;
  const GALLERY_ENDS = [-1, 1];
  const LIGHT = 0.018;          // global dimmer on every light (v8: was 0.055, then 0.03)
  const FLOOD = 22;             // each of the eight floodlights
  const FIRE_GLOW = 28;         // each touchline fire

  // --- control ----------------------------------------------
  const CODE = [1, 7, 1, 8];      // start / stop
  const RESTART_CODE = [1, 7, 1, 9]; // v8: stop, open the pens, and start
                                // again after RESTART_WAIT seconds
  const RESTART_WAIT = 15;      // time to walk back to the pens
  let holdToWin = HOLD_TO_WIN;  // v26: the live win target (2233 changes it)
  const DOOR_LOCKS = true;      // v8: host keypads beside the 2nd floor doors
  const CODE_TIMEOUT = 15;
  const SCORE_CODE = [2, 2, 3, 3];  // v26: 2233 + a score + OK sets the win target
  const SCORE_MIN = 1, SCORE_MAX = 9999;
  const FINISH_CONSOLE = true;
  const STOP_TWICE = true;

  // kept for the shared arena code
  const HOME_D = 22;

  // ==========================================================
  // GEOMETRY  -  AN OCTAGON WITH SHORT CORNERS
  // ==========================================================
  // v5: 124 across, down from 152. v4 needed size to fit thirty
  // people; this map fits them with rooms and corridors instead,
  // which is what makes a big lobby feel like a Halo map. OCT_K says
  // how hard the corners are cut: 2 is a square, 1.414 a regular
  // octagon. At 1.66 the four corner walls are short, just enough to
  // cut the dead corners off behind the alleys.
  const OCT_A = 62;                     // centre to each of the four
                                        // straight walls
  const OCT_K = 1.66;                   // 2 = square, 1.414 = regular
  const OCT_DIAG = OCT_A * OCT_K;       // |x| + |z| on a diagonal
  const OCT_FLAT = 2 * (OCT_DIAG - OCT_A);          // length of a straight wall
  const OCT_CHAM = Math.SQRT2 * (2 * OCT_A - OCT_DIAG); // and of a corner one
  const OCT_R = Math.hypot(OCT_A, OCT_DIAG - OCT_A);    // centre to a vertex

  // The pad grid underneath is still a square grid, because a square
  // grid is the only thing that indexes cheaply. It is CULLED to the
  // octagon - a pad whose middle is outside the walls is never built.
  const FIELD_W = OCT_A * 2;
  const FIELD_L = OCT_A * 2;
  const ARENA_L = FIELD_L + 40;
  const ARENA_H = 40;

  // is this spot inside the eight walls, with m metres to spare?
  function inOct(x, z, m) {
    const k = m || 0;
    return Math.abs(x) <= OCT_A - k &&
           Math.abs(z) <= OCT_A - k &&
           Math.abs(x) + Math.abs(z) <= OCT_DIAG - k * 1.4143;
  }

  const DECK_Y = 4.3;
  const DOOR_W = 13;
  const DOOR_H = 7.6;           // v6: the doorways are on the second floor
  // THE THREE FLOORS. Defined up here because the shell and the pens
  // need them before the map does.
  const LEVEL_2 = 6.8;          // second floor slab. 5.8 until v6 -
                                // a metre more headroom downstairs
  const LEVEL_3 = 13.6;         // third floor slab
  const PEN_Y = LEVEL_2 + 0.36; // pen floor, flush with the base deck
  const LOW_DOOR_H = 5.4;       // v7: the ground doorway into each PEN ROOM
  const GROUND_T = 0.36;        // walking height on the ground (= GROUND)
  const RAIL_H = 1.2;
  const CTRL_Z = -105;          // pens are fixed in place, see PEN_*
  const FIN_CTRL_Z = 105;       // v8: both were 116 - closer to the drop

  // ==========================================================
  // PALETTE - a night stadium
  // ==========================================================
  const TURF = "#16211a";
  const TURF_B = "#1b281f";
  const LINE = "#b3ad9c";
  const CHALK = "#f1f2ea";
  const BRICK = "#1c2230";
  const BRICK_DK = "#11151e";
  const CONCRETE = "#3b414d";
  const STEEL = "#a3abb2";
  const STEEL_DK = "#2b3034";
  const BOARD = "#1d2b24";
  const FRAME = "#39404d";
  const INK = "#10141a";
  const LAMP = "#e9efff";
  const WIN_GOLD = "#ffd23f";
  const HOME_BLUE = "#2a5bd0";
  const HOME_BLUE_DIM = "#1b3470";
  const HOME_YEL = "#f0b418";
  const HOME_YEL_DIM = "#6e5717";
  const CALL_RED = "#e3262f";
  const CALL_DIM = "#5a1418";
  const COLLAR_RED = "#6a141c";
  const STUD = "#8b939b";
  const PAW_INK = "#3d1318";
  const END_BLUE = "#131c36";
  const END_GOLD = "#2e2410";
  const HEAD = "#5c3f27", MUZZLE = "#7b5c3e", BRINDLE = "#2b1b10";
  const DOG_FAWN = "#c4935f";
  const DOG_LIGHT = "#ead3b0";
  const DOG_DARK = "#5b3a22";
  const COLLAR = "#c8202c";
  const GLASS = "#4e6f8c";
  const GLASS_OP = 0.16;

  const RED = "#e0323c", BLUE = "#2f6bff";
  const RED_DK = "#3a1216", BLUE_DK = "#111c3a";
  const RED_MID = "#7a1c22", BLUE_MID = "#1e3c8a";
  function homeCol(side) { return side < 0 ? RED : BLUE; }
  function homeDark(side) { return side < 0 ? RED_DK : BLUE_DK; }
  function homeMid(side) { return side < 0 ? RED_MID : BLUE_MID; }
  function homeName(side) { return side < 0 ? "RED" : "BLUE"; }

  // THE WHOLE WORLD HANGS OFF ONE GROUP, AND THAT GROUP IS TURNED.
  // A collision position arrives in the ELEMENT's frame, so every
  // pad, kerb, crate and plinth still reports the numbers it was
  // built with. The one thing that cannot go inside is the position
  // probe - see probeAt().
  const BUILD_RY = 180;
  const world = document.getElementById("world");
  world.setAttribute("ry", BUILD_RY);
  const arena = document.getElementById("arena");
  const ballRoot = document.getElementById("ball");
  const cageRoot = document.getElementById("shells");
  const markRoot = document.getElementById("marks");
  const probeRoot = document.getElementById("probe");

  function el(tag, attrs, parent) {
    const node = document.createElement(tag);
    node.setAttribute("collide", "false");
    for (const key in attrs) {
      let value = attrs[key];
      if (tag === "m-light" && key === "intensity") {
        value = Math.round(value * LIGHT * 10) / 10;
      }
      node.setAttribute(key, value);
    }
    (parent || arena).append(node);
    return node;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function hasGallery(side) { return false; }

  function orb(attrs, parent) {
    if (!LOW_POLY) return el("m-sphere", attrs, parent);
    const r = attrs.radius;
    const b = Object.assign({}, attrs);
    delete b.radius;
    b.width = +(r * 1.6).toFixed(3);
    b.height = +(r * 1.6).toFixed(3);
    b.depth = +(r * 1.6).toFixed(3);
    b.ry = (attrs.ry || 0) + 45;
    return el("m-cube", b, parent);
  }

  function crossLabels(parent, y, text, bg, fg, w, h, fs) {
    const made = [];
    [0, 90, 180, 270].forEach((ry) => {
      const r = ry * Math.PI / 180;
      made.push(el("m-label", {
        x: 0.02 * Math.sin(r), z: 0.02 * Math.cos(r), y: y, ry: ry,
        width: w, height: h, "font-size": fs, alignment: "center",
        color: bg, "font-color": fg, content: text,
      }, parent));
    });
    return made;
  }

  // ==========================================================
  // THE SHELL  -  eight walls and a lid of light
  // ==========================================================
  // Wall k is turned k*45 degrees so its own +z faces out. The even
  // ones are the four straight walls, standing OCT_A out and
  // OCT_FLAT long; the odd ones are the four corner walls, standing
  // further out and shorter. Two of the straight ones have a doorway.
  //
  // Above every wall sits an invisible solid panel to ARENA_H. That
  // is the ceiling of this game: you can get onto anything in here
  // and you cannot get out of it.
  const OUT_DOOR = [0, 4];
  const floods = [];

  el("m-cube", { y: -0.5, width: 240, height: 1, depth: 320, color: BRICK_DK });
  el("m-cylinder", { y: -0.02, radius: OCT_R + 1, height: 0.1, color: TURF_B });

  for (let k = 0; k < 8; k++) {
    const a = k * 45, r = a * Math.PI / 180;
    const diag = (k % 2) === 1;
    const dist = diag ? OCT_DIAG / Math.SQRT2 : OCT_A;
    const long = (diag ? OCT_CHAM : OCT_FLAT) + 1.5;
    const cx = dist * Math.sin(r), cz = dist * Math.cos(r);
    const door = OUT_DOOR.indexOf(k) >= 0;
    const segs = door
      ? [[-(long / 4 + DOOR_W / 4), long / 2 - DOOR_W / 2],
         [ (long / 4 + DOOR_W / 4), long / 2 - DOOR_W / 2]]
      : [[0, long]];
    segs.forEach(([off, w]) => {
      const ox = cx + off * Math.cos(r), oz = cz - off * Math.sin(r);
      el("m-cube", {
        x: +ox.toFixed(2), z: +oz.toFixed(2), y: 7.5, ry: a,
        width: w, height: 15, depth: 1.4, color: BRICK, collide: "true",
      });
      // v7: no steel cap and no step between wall and glass. The
      // glass starts exactly on top of the wall and is exactly as
      // thick, so there is no ledge anywhere on it to stand on.
      el("m-cube", {
        x: +ox.toFixed(2), z: +oz.toFixed(2), y: 22, ry: a,
        width: w, height: 14, depth: 1.4,
        color: GLASS, opacity: GLASS_OP, collide: "true",
      });
    });
    if (door) {
      // v6: the opening is up on the second floor - solid wall under
      // it, and a lintel from its top to the top of the wall
      // v7: and a second opening on the ground, into the PEN ROOM
      el("m-cube", {
        x: +cx.toFixed(2), z: +cz.toFixed(2), y: (LOW_DOOR_H + PEN_Y - 0.14) / 2, ry: a,
        width: DOOR_W + 2, height: PEN_Y - 0.14 - LOW_DOOR_H, depth: 1.4, color: BRICK, collide: "true",
      });
      reports(el("m-cube", {
        x: +cx.toFixed(2), z: +cz.toFixed(2), y: PEN_Y - 0.07, ry: a,
        width: DOOR_W + 2, height: 0.14, depth: 1.4, color: "#0d1016",
      }), cx, cz, PEN_Y, a);
      const lin0 = PEN_Y + DOOR_H;
      el("m-cube", {
        x: +cx.toFixed(2), z: +cz.toFixed(2), y: (lin0 + 15) / 2, ry: a,
        width: DOOR_W + 2, height: 15 - lin0, depth: 1.4, color: BRICK, collide: "true",
      });
      el("m-cube", {
        x: +cx.toFixed(2), z: +cz.toFixed(2), y: 22, ry: a,
        width: DOOR_W + 2, height: 14, depth: 1.4,
        color: GLASS, opacity: GLASS_OP, collide: "true",
      });
    }
    el("m-cube", {
      x: +cx.toFixed(2), z: +cz.toFixed(2), y: ARENA_H / 2 + 29, ry: a,
      width: long + 3, height: ARENA_H, depth: 0.6,
      color: "#000000", opacity: 0, collide: "true",
    });
    // a mast on each vertex of the octagon
    const vr = (a + 22.5) * Math.PI / 180;
    const vd = OCT_R;
    const vx = vd * Math.sin(vr), vz = vd * Math.cos(vr);
    el("m-cylinder", {
      x: +vx.toFixed(2), z: +vz.toFixed(2), y: 16, radius: 0.6, height: 32, color: STEEL_DK,
    });
    floods.push(el("m-light", {
      x: +(vx * 0.88).toFixed(2), z: +(vz * 0.88).toFixed(2), y: 31,
      type: "spotlight", intensity: 190, distance: 170, angle: 64,
      rx: -60, ry: a + 202.5, color: LAMP,
    }));
  }
  el("m-light", { y: 46, type: "point", intensity: 80, distance: 200, color: "#cfe0ff" });

  // ==========================================================
  // OTHERGAMES BRANDING  (v29)
  // ==========================================================
  // Arena dressing only: nothing here collides, reports or moves.
  // BRANDING = false takes all of it out. The logos are embedded as
  // pictures; if you host the PNGs yourself, put their web addresses
  // in BRAND_URLS and the embedded copies are not used.
  const BRANDING = true;
  const BRAND_GLOW = 1;           // the logos light themselves like an LED board (0 = lit like the walls)

  const BRAND_ASPECT = { lockup: 6.006, words: 2.016, flame: 0.824, flameWhite: 0.824 };
  const BRAND_NAVY = "#0b1026", BRAND_CYAN = "#2ef9fb", BRAND_VIOLET = "#5b44f8";
  // one logo, h metres tall, facing along its own +z
  function brandLogo(kind, h, attrs, parent) {
    return el("m-image", Object.assign({
      src: BRAND_URLS[kind] || BRAND_DATA[kind],
      width: +(h * BRAND_ASPECT[kind]).toFixed(3), height: h, emissive: BRAND_GLOW,
    }, attrs), parent);
  }
  // Three things, all on the INSIDE of the octagon's glass, above
  // every floor anybody can stand on (the third floor is 13.6):
  //   * a RIBBON BOARD all the way round at 16.5-18.7 - navy, cyan
  //     and violet trims, the OTHER GAMES lockup and the flame on it
  //   * a BIG BOARD over each wall: the stacked OTHER GAMES wordmark
  //     on the four straight walls, the flame on the four corners
  //   * a FLAME FLAG on top of each of the eight floodlight masts
  if (BRANDING) {
    const RIB_Y = 17.6, RIB_H = 2.2;
    const BIG_Y = 24.1, BIG_H = 9.4;
    for (let k = 0; k < 8; k++) {
      const a = k * 45, r = a * Math.PI / 180;
      const diag = (k % 2) === 1;
      const dist = diag ? OCT_DIAG / Math.SQRT2 : OCT_A;
      const len = (diag ? OCT_CHAM : OCT_FLAT) - 2;
      const sn = Math.sin(r), cs = Math.cos(r);
      // a point `off` metres along wall k, `inset` metres in from its centre line
      const at = (off, inset, y, extra) => Object.assign({
        x: +((dist - inset) * sn + off * cs).toFixed(2),
        z: +((dist - inset) * cs - off * sn).toFixed(2), y: y,
      }, extra);
      // the ribbon
      el("m-cube", at(0, 0.85, RIB_Y, { ry: a, width: len, height: RIB_H, depth: 0.12, color: BRAND_NAVY }));
      [[RIB_Y + RIB_H / 2, BRAND_CYAN], [RIB_Y - RIB_H / 2, BRAND_VIOLET]].forEach(([y, c]) => {
        el("m-cube", at(0, 0.9, y, { ry: a, width: len, height: 0.14, depth: 0.2, color: c }));
      });
      const slots = diag ? [[0, "lockup"]]
        : [[-30, "lockup"], [-15, "flame"], [0, "lockup"], [15, "flame"], [30, "lockup"]];
      slots.forEach(([off, kind]) => {
        brandLogo(kind, kind === "lockup" ? 1.6 : 1.9, at(off, 0.94, RIB_Y, { ry: a + 180 }));
      });
      // the big board
      const kind = diag ? "flame" : "words";
      const h = BIG_H - 1.2, w = h * BRAND_ASPECT[kind] + 1.9;
      el("m-cube", at(0, 0.8, BIG_Y, { ry: a, width: w + 0.5, height: BIG_H + 0.5, depth: 0.08, color: BRAND_VIOLET }));
      el("m-cube", at(0, 0.87, BIG_Y, { ry: a, width: w, height: BIG_H, depth: 0.08, color: BRAND_NAVY }));
      brandLogo(kind, h, at(0, 0.95, BIG_Y, { ry: a + 180 }));
      // the flag on the mast at this wall's corner (masts are 32 high)
      const va = a + 22.5, vr = va * Math.PI / 180;
      const vx = OCT_R * Math.sin(vr), vz = OCT_R * Math.cos(vr);
      [[-0.03, va + 180], [0.03, va]].forEach(([d, ry]) => {
        brandLogo("flame", 3.6, {
          x: +(vx + d * Math.sin(vr)).toFixed(2), z: +(vz + d * Math.cos(vr)).toFixed(2),
          y: 34.2, ry: ry,
        });
      });
    }
  }

  // ==========================================================
  // THE HOLDING PENS  -  and they are not part of the map
  // ==========================================================
  // Dinopawnz: "those rooms where you select your team look like
  // theyre part of the map" and "players should not be able to go
  // back to the lobby areas when theyre playing KodaBall."
  //
  // So they are now plainly a different kind of place. Low ceiling,
  // bare walls, no arena lighting, floor in flat team colour, and a
  // GATE across the doorway that CLOSES THE MOMENT THE GAME STARTS.
  // A pen you wait in, walk out of, and cannot walk back into.
  //
  // AND THE SPAWN POINT IS INSIDE IT, WITH ROOM ROUND IT.
  // v3's back wall stood at exactly the z I told him to spawn at,
  // which is the whole of "there is no way for players to enter the
  // map" - the doorway was never blocked, the spawn was inside a
  // wall. PEN_SPAWN is now a stated number with fourteen metres of
  // clear floor on every side of it, and it is marked on the floor.

  const PEN_Z1 = 116;           // v8: was 122. The upstairs pen is shorter,
                                // so spawn and console sit near the drop
  const PEN_HW = 15;
  const PEN_SPAWN = 96;         // v8: was 104 - 4m behind the drop line
  const SEAL_ON_START = true;   // shut the gate when the game goes live
  const gates = [];
  // v8: WALL SCREENS on the ground floor - the jumbotron's two lines,
  // for everybody who cannot see the sky. [topLabel, bottomLabel]
  const wallScreens = [];
  function wallScreen(x, y, z, ry, w) {
    const g = el("m-group", { x: +x.toFixed(2), y: +y.toFixed(2), z: +z.toFixed(2), ry: ry });

  const penDoorTop = [], penDoorBig = [];   // v8: countdown on the pen doors

  // v6: THE PENS ARE ON THE SECOND FLOOR, AND OPEN AT THE BACK.

  // gone; two staircases come up to it from the ground outside, one
  // each side of the console. And THE WHOLE PEN FLOOR IS THE JOIN
  // PAD - see penFloors, wired up at TEAM PADS.
  //    62  the doorway, onto the base deck
  //   92   (v8) where the drop zone ends - red line on the floor
  //   96   THE SPAWN MARK (y 7.2)
  //   105  the operator console, in the middle
  //   116  the open back, stairs down either side to z 135
  const PEN_BACK_RUN = 19;
  const HATCH_MS = 1500;        // v8: how long the pen floor stays open before the ceiling
                                // closes. A one-storey fall takes about 1.2s, so this is
                                // "a second after they land". Do not go under 1300.
  const penFloors = [];         // [team, collider] - the upper join floors
  const roomStrips = [];        // [team, collider] - the PEN ROOM strips
  const hatches = [];           // the upper pen floors, which drop
  const backGates = [];         // across the open back of each pen
  const lowBackGates = [];      // the PEN ROOM's back door
  const lowFrontGates = [];     // the PEN ROOM's doorway onto the map
  const UPPER_OPEN_MS = 10000;  // the upper doorway stays open this long into a game
  const LOWER_CLOSE_MS = 10000; // the PEN ROOM doorway shuts this long after one
  const PEN_ROOMS = [];         // [x0, x1, z0, z1] of each PEN ROOM
  const PEN_ROOM_TOP = PEN_Y - 0.95;   // the PEN ROOM ceiling
  [-1, 1].forEach((t) => {
    const z0 = OCT_A - 0.8;       // start under the doorway, flush with the deck
    const zc = t * (z0 + PEN_Z1) / 2, dep = PEN_Z1 - z0;

    const ROOM_MID = 92;          // fixed: the pen room keeps its size

    [-1, 1].forEach((s) => {

    // THE PEN ROOM's back wall. Solid: there is no way out of the map

    [[-9.5, 11], [9.5, 11]].forEach(([x, w]) => {

    el("m-cube", { z: t * PEN_Z1, y: (4.4 + PEN_Y) / 2, width: 8, height: PEN_Y - 4.4, depth: 1.2, color: "#171b24", collide: "true" });
    const lb = el("m-group", { z: t * (PEN_Z1 + 0.9), y: -40 });
    el("m-cube", { y: 2.2, width: 8.4, height: 4.4, depth: 0.4, color: CALL_RED, opacity: 0.45, collide: "true" }, lb);
    lowBackGates.push(lb);
    // v8: the new back wall of the pen room, with the same kind of

    [[-9.5, 11], [9.5, 11]].forEach(([x, w]) => {
      el("m-cube", { x: x, z: t * ROOM_MID, y: PEN_ROOM_TOP / 2, width: w, height: PEN_ROOM_TOP, depth: 1.2, color: "#2b313c", collide: "true" });
    });
    el("m-cube", { z: t * ROOM_MID, y: (4.4 + PEN_ROOM_TOP) / 2, width: 8, height: PEN_ROOM_TOP - 4.4, depth: 1.2, color: "#2b313c", collide: "true" });
    const lm = el("m-group", { z: t * (ROOM_MID + 0.9), y: -40 });
    el("m-cube", { y: 2.2, width: 8.4, height: 4.4, depth: 0.4, color: CALL_RED, opacity: 0.45, collide: "true" }, lm);
    lowBackGates.push(lm);
    el("m-cube", { z: t * (ROOM_MID + 0.6 + (PEN_Z1 - 0.6 - ROOM_MID - 0.6) / 2), y: 0.03,
      width: PEN_HW * 2 - 1.2, depth: PEN_Z1 - 0.6 - ROOM_MID - 0.6, height: 0.06, color: "#171a20", collide: "true" });
    // and the gate across the ground doorway onto the map
    const lf = el("m-group", { z: t * (OCT_A + 1.2), y: 0 });

    // a line on the floor where the drop zone ends

    el("m-cube", { z: t * (PEN_Z0 + 1.5), y: PEN_Y + 0.04, width: PEN_HW * 2 - 2, depth: 2.2, height: 0.02, color: homeCol(t) }, hatch);
    el("m-cylinder", { z: t * PEN_SPAWN, y: PEN_Y + 0.08, radius: 3.4, height: 0.04, color: homeCol(t), opacity: 0.5 });
    el("m-label", {

      color: homeDark(t), "font-color": CHALK, content: "DOOR OPENS AT GO",

    // a LID on it, which is most of why it does not read as the map
    el("m-cube", { z: zc, y: PEN_Y + 7.3, width: PEN_HW * 2 + 2, depth: dep, height: 0.6, color: "#0d1016", collide: "true" });
    el("m-light", { z: zc, y: PEN_Y + 6.2, type: "point", intensity: 26, distance: 34, color: homeCol(t) });

    // THE OPEN BACK: a header beam with the name on it both ways,

    el("m-cube", { z: t * PEN_Z1, y: PEN_Y + 6.1, width: PEN_HW * 2 + 2, height: 1.8, depth: 0.8, color: "#171b24", collide: "true" });
    [0, 180].forEach((ry) => {
      el("m-label", {

    const bg = el("m-group", { z: t * (PEN_Z1 + 0.9), y: -40 });

    [1.3, 2.6, 3.9].forEach((y) => el("m-cube", { y: y, width: PEN_HW * 2, height: 0.25, depth: 0.5, color: CALL_RED }, bg));

    [-1, 1].forEach((s) => {

    el("m-label", {

    });
    el("m-light", { z: t * (OCT_A - 2), y: PEN_Y + 5, type: "point", intensity: 40, distance: 26, color: CHALK });

    // THE UPPER GATE, across the second-floor doorway. Open only while

    [1, 2, 3].forEach((k) => {

    // v8: THE COUNTDOWN, written on the inside of the sealed door, big

      width: DOOR_W - 1, height: 2.2, "font-size": 150, alignment: "center",
      color: "#0a0c10", "font-color": CHALK, content: "WAITING FOR HOST",
    }, g));
    penDoorBig.push(el("m-label", {
      z: t * 0.76, ry: t > 0 ? 0 : 180, y: DOOR_H * 0.3,
      width: 6, height: 3.4, "font-size": 300, alignment: "center",
      color: "#0a0c10", "font-color": WIN_GOLD, content: "",
    }, g));
    gates.push(g);

    // ---- THE PEN ROOM (v7) ------------------------------------
    // Under the pen, part of the map, open to the HALL through the
    // ground doorway. Where everybody lands when the floor drops, and
    // after that just another room: a long one, split halfway by a
    // wall with two gaps, a ceiling you cannot get through and a back
    // wall you cannot get past. So once you are in the game you are
    // in it until it ends.
    const RZ = (v) => t * v;
    el("m-cube", { z: RZ((roomZ0 + roomZ1) / 2), y: 0.02, width: PEN_HW * 2 - 1.2, depth: roomZ1 - roomZ0, height: 0.06, color: "#171a20" });
    // the ceiling, from underneath: the hatch is above it, this is a
    // fixed soffit that the hatch lands flush with
    el("m-cube", { z: RZ((roomZ0 + roomZ1) / 2), y: PEN_ROOM_TOP + 0.05, width: PEN_HW * 2 - 1.2, depth: roomZ1 - roomZ0, height: 0.1, color: "#0d1016", opacity: 0.001 });
    // v8: A LITTLE SPICE. Stepping blocks up each side to a ledge on
    // either side of the back door, two pillars that break the
    // sightline from the doorway, and angled cover by the entrance.
    // Nothing in here looks at the ball, so it is somewhere to play,
    // not somewhere to sit.
    const penBlock = (x, z, w, d, h, ry, col) => {
      el("m-cube", { x: x, z: RZ(z), y: GROUND_T + h / 2, ry: ry || 0, width: w, depth: d, height: h, color: col || "#3b414d", collide: "true" });
      reports(el("m-cube", { x: x, z: RZ(z), y: GROUND_T + h + 0.07, ry: ry || 0, width: w + 0.08, depth: d + 0.08, height: 0.14, color: STEEL }),
        x, RZ(z), GROUND_T + h + 0.14, ry || 0);
    };
    [[0, 77, 6, 2, 1.4], [-10, 72, 2, 3, 1.2], [10, 72, 2, 3, 1.2]]
      .forEach(([x, z, w, d, h]) => penBlock(x, z, w, d, h));
    // v8: the two big back platforms stand OFF the walls now - a 3.2m
    // run behind each and a 2.4m gap at the side wall - so you can
    // hide behind them and run all the way round. The steps moved
    // forward, toward the doorway, to open that space up.
    const BACK_GAP = 3.2, LEDGE_D = 2.8, LEDGE_H = 2.6;
    const LEDGE_Z1 = roomZ1 - BACK_GAP, LEDGE_Z0 = LEDGE_Z1 - LEDGE_D;
    [-1, 1].forEach((s) => {

      penBlock(lcx, (LEDGE_Z0 + LEDGE_Z1) / 2, lw, LEDGE_D, LEDGE_H, 0, "#343b48");
      [LEDGE_Z0 - 0.02, LEDGE_Z1 + 0.02].forEach((zz) =>
        el("m-cube", { x: lcx, z: RZ(zz), y: GROUND_T + LEDGE_H - 0.3, width: lw, height: 0.2, depth: 0.06, color: homeCol(t) }));
      // two steps toward it: 0.9, then 1.75, then the platform at 2.6

      el("m-cube", { x: s * 6, z: RZ(76), y: 3, width: 1.26, depth: 1.26, height: 0.25, color: homeCol(t) });

    el("m-label", {

    const strip = el("m-cube", {
