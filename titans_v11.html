      R.unwinding = true;
      say(R, sword ? "SUPER SLASH!" : "SUPER SHIELD BASH!");
      say(enemyOf(R), sword ? "SUPER SLASH INCOMING!" : "SUPER SHIELD BASH INCOMING!");
      tween(R.root, { ry: ph(R) - c.off }, UNWIND_MS, "in");
      later(Math.max(0, UNWIND_MS - THROW_MS - pre), () => throwArm(THROW_MS));
      later(UNWIND_MS, () => { R.unwinding = false; resolvePunch(R, k, power, true); });
      later(UNWIND_MS + 650, () => { A.throwing = false; A.shown = null; A.coolUntil = Date.now() + PUNCH_COOL_MS; if (!sword) R.bashing = false; });
      return;
    }
    throwArm(THROW_MS);
    later(THROW_MS + pre, () => resolvePunch(R, k, power, false));
    later(THROW_MS + 740, () => { A.throwing = false; A.shown = null; A.coolUntil = Date.now() + PUNCH_COOL_MS; if (!sword) R.bashing = false; });
  }

  function resolvePunch(R, k, power, isSuper) {
    if (R.down) return;
    const E = enemyOf(R);
    const wr = worldPos(R), we = worldPos(E), f = worldFwd(R);
    const dx = we.x - wr.x, dz = we.z - wr.z, d = Math.hypot(dx, dz) || 1;
    const ang = Math.acos(clamp((dx * f.x + dz * f.z) / d, -1, 1)) / D2R;
    const sword = k === "R";
    const rMin = sword ? SWORD_REACH_MIN : REACH_MIN;
    const rMax = sword ? SWORD_REACH_MAX : REACH_MAX;
    const rAng = (sword ? SWORD_ANG : REACH_ANG) * (blinded(R) ? BLIND_AIM : 1);
    const reach = d - 8;
    const lim = sword ? 70 : 34;
    const hx = wr.x + f.x * Math.min(reach, lim), hz = wr.z + f.z * Math.min(reach, lim);
    const tag = (isSuper ? "SUPER " : "") + (sword ? "SLASH " : "");
    const nowT = Date.now();
    const inAir = nowT >= E.airFrom && nowT < E.airUntil;
    if (E.down || d > rMax || d < rMin || ang > rAng || inAir) {
      say(R, tag + (inAir ? "MISSED - THEY'RE IN THE AIR" : d > rMax ? "MISSED - TOO FAR"
        : ang > rAng ? (blinded(R) ? "MISSED - WE'RE BLIND!" : "MISSED - TURN TO FACE THEM") : "MISSED"));
      if (inAir) say(E, "DODGED IT IN THE AIR!");
      if (sword) slashFx(R, false);
      else pop(R.root, SHOULDER.x, SHOULDER.y, 32, 1, 5, "#ffffff", 300);
      return;
    }
    if (sword) slashFx(R, true);
    let dmg = (PUNCH_DMG_MIN + (PUNCH_DMG_MAX - PUNCH_DMG_MIN) * power) * (isSuper ? SUPER_MULT : 1)
      * (sword ? SWORD_DMG_MULT : 1)
      * (powered(R, sword ? "rarm" : "larm") ? ARM_POWER_MULT : 1);
    popWorld(R, hx, SHOULDER.y, hz, 2, isSuper ? 26 : 16, isSuper ? "#ff9a2e" : E.def.glow, isSuper ? 750 : 550);
    popWorld(R, hx, SHOULDER.y, hz, 1, 10, "#ffffff", 450);
    if (E.shieldUp) {
      aegisHit(E, Date.now() - E.shieldSince < PARRY_MS);
      if (Date.now() - E.shieldSince < PARRY_MS) {
        say(E, "PARRY!");
        say(R, "PARRIED!");
        R.stallUntil = Date.now() + PARRY_STALL_MS;
        hurt(R, PARRY_DMG, E);
        knockBack(R, -dx / d, -dz / d, PARRY_KNOCK);
        return;
      }
      dmg *= powered(E, "shield") || overOn(E) ? SHIELD_PASS : SHIELD_PASS_U;
      const done = hurt(E, dmg, R);
      say(E, tag + "BLOCKED - " + done + " DAMAGE");
      say(R, tag + "BLOCKED - " + done + " DAMAGE");
      knockBack(E, dx / d, dz / d, done * KNOCK_PER_DMG);
      return;
    }
    const done = hurt(E, dmg, R);
    say(E, tag + "HIT! -" + done + " ARMOR");
    say(R, tag + "HIT! " + done + " DAMAGE");
    knockBack(E, dx / d, dz / d, done * KNOCK_PER_DMG);
  }

  // ==========================================================
  // DASH - the captain's SPRINT button (latest update)
  // ==========================================================
  // Forward steps that alternate legs, each soon after the last, put
  // the legs IN SYNC. Only then can the captain dash.
  function syncCount(R, now) {
    const L = R.stepLog || [];
    if (!L.length || now - L[L.length - 1].at > SYNC_GAP_MS) return 0;
    let n = 1;
    for (let i = L.length - 1; i > 0; i--) {
      if (L[i].leg === L[i - 1].leg || L[i].at - L[i - 1].at > SYNC_GAP_MS) break;
      n++;
    }
    return n;
  }
  const legsInSync = (R) => syncCount(R, Date.now()) >= SYNC_STEPS;
  function dashReady(R, now) {
    return canAct(R) && now >= R.dashReadyAt && now >= R.sprintUntil
      && syncCount(R, now) >= SYNC_STEPS;
  }
  function tryDash(R) {
    const now = Date.now();
    if (!canAct(R) || R.unwinding || R.jumping) return;
    if (now < R.sprintUntil) return;
    if (now < R.dashReadyAt) return;
    // v10j: no gears, no button - the legs' own rhythm starts it
    if (emoting(R)) endEmote(R, false);
    const n = syncCount(R, now);
    if (n < SYNC_STEPS) return say(R, "LEGS NOT IN SYNC (" + n + "/" + SYNC_STEPS + ") - LEG BAYS: QUICK STEPS IN TURN");
    // take over from any step in progress
    R.moveTok++;
    R.moving = null;
    stopTween(R.root, "x"); stopTween(R.root, "z");
    R.sprintUntil = now + DASH_MS;
    R.dashStart = now;
    R.dashReadyAt = now + DASH_MS + DASH_COOL_MS;   // endDash sets the real one
    R.dashLegAt = 0;
    R.stepLog = [];
    say(R, "DASH! LEG BAYS - KEEP STEPPING IN TURN!");
    light(R, "legs");
  }
  // dashing into them
  // v9b: a dash runs for as long as the legs keep it up, so ending it
  // (rhythm lost, stumble, ram, brace, knocked about) happens in one
  // place - that is also when the cooldown starts.
  function endDash(R, why) {
    if (!R.sprintUntil) return;
    R.sprintUntil = 0;
    R.dashReadyAt = Date.now() + DASH_COOL_MS;
    R.stepLog = [];
    if (why) say(R, why);
  }
  function ram(R, E) {
    const wr = worldPos(R), we = worldPos(E);
    const dx = we.x - wr.x, dz = we.z - wr.z, d = Math.hypot(dx, dz) || 1;
    // the longer the run-up, the harder it lands
    const run = Math.min(1, (Date.now() - (R.dashStart || Date.now())) / RAM_BUILD_MS);
    const mom = 1 + RAM_MOMENTUM * run;
    popWorld(R, wr.x + (dx / d) * 24, SHOULDER.y - 10, wr.z + (dz / d) * 24, 2, 12 + 6 * run, "#ffffff", 600);   // v11p: was 20-30m at 16m out - through our own chest
    // v10g: they are off the ground - we go straight under them
    const t = Date.now();
    if (t >= E.airFrom && t < E.airUntil) {
      say(R, "RAM MISSED - THEY STOMPED OVER IT");
      say(E, "STOMPED OVER THEIR RAM!");
      return;
    }
    let dmg = RAM_DMG * mom;
    if (E.shieldUp) { dmg *= powered(E, "shield") ? SHIELD_PASS : SHIELD_PASS_U; aegisHit(E, true); }
    const done = hurt(E, dmg, R);
    if (E.down) return;
    say(R, "RAM! " + done + " DAMAGE");
    say(E, "RAMMED! -" + done + " ARMOR");
    knockBack(E, dx / d, dz / d, RAM_KNOCK * mom);
  }

  // ==========================================================
  // THE BLINDING FLASH - the waist's own weapon (v9c)
  // ==========================================================
  // A white flash out of the visor. For BLIND_MS the enemy's screens
  // go white, their scan and their coil warnings stop working and
  // their aim narrows to BLIND_AIM, so their punches and slashes miss
  // unless they are dead-on. One every BLIND_COOL_MS.
  const blinded = (R) => Date.now() < (R.blindUntil || 0);
  function tryBlind(R) {
    const now = Date.now();
    if (!canAct(R) || R.down) return;
    if (now < R.blindReadyAt) return say(R, "FLASH RECHARGING " + secs(R.blindReadyAt - now));
    const E = enemyOf(R);
    const wr = worldPos(R), we = worldPos(E), f = worldFwd(R);
    const dx = we.x - wr.x, dz = we.z - wr.z, d = Math.hypot(dx, dz) || 1;
    const ang = Math.acos(clamp((dx * f.x + dz * f.z) / d, -1, 1)) / D2R;
    R.blindReadyAt = now + BLIND_COOL_MS;
    R.blindFiredAt = now;   // v10s: a captain's BLIND order counts once it fires
    // the flash itself, out of the visor
    // v11p: out in front of the visor, not in the bridge. The beam used to
    // start AT the visor with a 28m flare, plus a white ball growing to 22m
    // - both reached right through the captain's room (Otherside draws the
    // ball solid). Now the flare is small and starts 5m out, and the flash
    // at the visor is a small team-coloured puff clear of the glass.
    const out = HEAD.cz + HEAD.d / 2 + 5;
    laserBeam(R.root, 0, H_FLOOR + 2.2, out, Math.max(1, Math.min(d, BLIND_RANGE) - 5), R.def.laser, 900, 4, 0.3);
    pop(R.root, 0, H_FLOOR + 2.2, out + 4, 1, 5, R.def.glow, 500);
    R.flashUntil = now + 900;
    if (E.down || d > BLIND_RANGE || ang > BLIND_ANG) {
      return say(R, d > BLIND_RANGE ? "FLASH MISSED - TOO FAR" : "FLASH MISSED - TURN TO FACE THEM");
    }
    E.blindUntil = now + BLIND_MS;
    E.flashUntil = now + BLIND_MS;
    popWorld(R, we.x, H_FLOOR + 2, we.z, 4, 40, "#ffffff", 900);
    say(R, "FLASH! THEY'RE BLIND FOR " + secs(BLIND_MS));
    say(E, "BLINDED! WE CAN'T SEE - HOLD ON");
  }

  // ==========================================================
  // GRAB AND THROW - left arm bay (latest update)
  // ==========================================================
  function tryGrab(R) {
    if (emoting(R)) return endEmote(R, false, "ARMS CANCELLED THE " + R.emote);
    if (!canAct(R) || R.unwinding || R.jumping) return;
    const now = Date.now();
    if (now < R.sprintUntil) return say(R, "NO GRABBING MID-DASH");
    if (R.shieldUp) return say(R, "DROP THE SHIELD TO GRAB");
    if (now < R.grabReadyAt) return say(R, "GRAB READY IN " + secs(R.grabReadyAt - now));
    const AL = R.arm.L, AR = R.arm.R;
    if (AL.throwing || AR.throwing) return;
    if (AL.charge < MIN_CHARGE) return say(R, "PULL BACK FIRST, THEN GRAB");
    AL.charge = 0;
    R.grabReadyAt = now + GRAB_COOL_MS;
    AL.throwing = AR.throwing = true;
    AL.grabbing = true;
    const release = (ms) => later(ms, () => {
      AL.throwing = AR.throwing = false;
      AL.grabbing = false;
      AL.shown = AR.shown = null;
    });
    light(R, "larm"); light(R, "rarm");
    ["L", "R"].forEach((k) => armTo(R, k, { rx: -85, rz: 28, erx: -10 }, 420, "out"));
    say(R, "GRAB!");
    later(460, () => {
      if (R.down) return release(0);
      const E = enemyOf(R);
      const wr = worldPos(R), we = worldPos(E), f = worldFwd(R);
      const dx = we.x - wr.x, dz = we.z - wr.z, d = Math.hypot(dx, dz) || 1;
      const ang = Math.acos(clamp((dx * f.x + dz * f.z) / d, -1, 1)) / D2R;
      const t = Date.now();
      const eAir = t >= E.airFrom && t < E.airUntil;
      let why = "";
      if (E.down) why = "THEY'RE DOWN";
      else if (d > GRAB_R) why = "TOO FAR (" + Math.round(d) + "M)";
      else if (ang > GRAB_ANG * (blinded(R) ? BLIND_AIM : 1)) why = blinded(R) ? "BLIND - WE GRABBED AT NOTHING" : "NOT AHEAD - TURN TO FACE THEM";
      else if (eAir) why = "THEY STOMPED - THEY'RE IN THE AIR";
      else if (E.gear === "brace") why = "THEY'RE BRACED";
      else if (t < E.heldUntil) why = "ALREADY IN THE AIR";
      if (why) {
        R.stallUntil = t + GRAB_MISS_STALL_MS;
        say(R, "GRAB MISSED - " + why);
        if (eAir || E.gear === "brace") say(E, "DODGED THEIR GRAB!");
        return release(300);
      }
      grabbed(R, E, f);
      release(1800);
    });
  }
  function grabbed(R, E, f) {
    const t = Date.now();
    const throwMs = (THROW_DIST / THROW_SPEED) * 1000;
    if (emoting(E)) endEmote(E, false);
    E.syncUntil = 0;                 // a grab breaks their finisher sync
    E.sv = 0; E.sprintUntil = 0;
    E.moveTok++;
    E.moving = "held";
    E.heldUntil = t + 1000 + throwMs;
    E.stallUntil = E.heldUntil + 600;
    E.jetUntil = t + 2600;
    say(E, "GRABBED! HOLD ON!");
    say(R, "GOT THEM! THROWING...");
    tween(E.root, { y: GRAB_LIFT }, 900, "out");
    E.legTok++;
    legsTo(E, { L: { hip: 25, knee: 45, ank: 10 }, R: { hip: -15, knee: 55, ank: 10 } }, 500);
    ["L", "R"].forEach((k) => armTo(R, k, { rx: -135, rz: 22, erx: -20 }, 900, "inOut"));
    later(1000, () => {
      if (E.down) return;
      ["L", "R"].forEach((k) => armTo(R, k, { rx: -55, rz: 45, erx: -5 }, 260, "in"));
      E.moving = null;
      knockBack(E, f.x, f.z, THROW_DIST, THROW_SPEED, true);   // the way the thrower faces
      tween(E.root, { y: 0 }, 1400, "in");
      say(R, "THROWN!");
      say(E, "THROWN! BRACE FOR IMPACT");
      later(1400, () => {
        if (E.down) return;
        dust(E, "L", true); dust(E, "R", true);
        const done = hurt(E, GRAB_DMG, R);
        if (!E.down) {
          say(E, "SLAMMED DOWN! -" + done + " ARMOR");
          say(R, "THROW LANDED - " + done + " DAMAGE");
        }
      });
    });
  }

  // ==========================================================
  // WIND SLASH - right arm bay (latest update)
  // ==========================================================
  // A glowing crescent of wind that flies straight ahead. 5 damage,
  // stopped completely by a raised shield, dodged by a jump.
  function tryWindSlash(R) {
    if (emoting(R)) return endEmote(R, false, "ARMS CANCELLED THE " + R.emote);
    if (!canAct(R) || R.unwinding) return;
    const A = R.arm.R;
    const now = Date.now();
    if (now < R.sprintUntil) return say(R, "NO SLASHING MID-DASH");
    if (A.throwing || now < A.coolUntil) return;
    if (now < R.wsReadyAt) return say(R, "WIND SLASH READY IN " + secs(R.wsReadyAt - now));
    if (A.charge < MIN_CHARGE) return say(R, "PULL BACK FIRST, THEN WIND SLASH");
    const power = A.charge;
    A.charge = 0;
    A.throwing = true;
    A.shown = null;
    R.wsReadyAt = now + WS_COOL_MS;
    R.wsFiredAt = now;   // v10u: a captain's WIND SLASH order counts once it's thrown
    light(R, "rarm");
    swordSwing(R, true);
    later(SWORD_HIT_AT, () => { if (!R.down) launchWindSlash(R, power); });
    later(SWORD_HIT_AT + 400, () => { A.throwing = false; A.shown = null; A.coolUntil = Date.now() + PUNCH_COOL_MS; });
  }
  function launchWindSlash(R, power) {
    const E = enemyOf(R);
    const wr = worldPos(R), f = worldFwd(R);
    const y = C_FLOOR + 6;
    let x = wr.x + f.x * 24, z = wr.z + f.z * 24;
    // v11l: turned to face its flight, it flies along ONE axis (z) of a
    // mover group, and collapses on ONE axis (sx) - one attribute each
    const g = group({ x: x, y: y, z: z, ry: Math.atan2(f.x, f.z) / D2R });
    const mover = ghostEl("m-group", {}, g), shrink = ghostEl("m-group", {}, mover);
    const blade = group({ rz: 35 }, shrink);
    const col = R.def.laser === "blue" ? "#4d9dff" : "#ff4d5a";
    // a crescent bowed forward, thick in the middle, thin at the tips
    for (let i = -4; i <= 4; i++) {
      const a = i * 15 * D2R;
      const bx = 15 * Math.sin(a), bz = -15 * (1 - Math.cos(a));
      const th = 2.4 * (1 - Math.abs(i) / 5.2);
      box(blade, bx, 0, bz, 4.4, th + 0.6, 1.4, col, { ry: i * 15 });
      box(blade, bx, 0, bz + 0.5, 4.2, th * 0.45 + 0.2, 0.9, "#ffffff", { ry: i * 15 });
    }
    const T = LASER_PNG[R.def.laser] || LASER_PNG.red;
    [{ ry: 0 }, { rx: -90 }].forEach((rot) => ghostEl("m-image", withO({ src: T.flare, width: 16, height: 16, emissive: 5 }, rot), shrink));
    // v10o: glow accents. Laser-style glow panels (soft edges baked into
    // the PNG, since Otherside ignores opacity on shapes) along the whole
    // crescent - one standing up to face the target, one lying flat - plus
    // flares on both tips, glowing trails streaming off the back, and a
    // light that washes over the arena as it flies past.
    const glows = [];
    for (let i = -4; i <= 4; i++) {
      const a = i * 15 * D2R;
      const bx = 15 * Math.sin(a), bz = -15 * (1 - Math.cos(a));
      const th = 2.4 * (1 - Math.abs(i) / 5.2);
      const seg = ghostEl("m-group", { x: bx, z: bz, ry: i * 15 }, blade);
      const w = th * 2.4 + 2.2;
      glows.push({ n: ghostEl("m-image", { src: T.glow, rz: 90, width: w, height: 5.2, emissive: 3 }, seg), w: w });
      glows.push({ n: ghostEl("m-image", { src: T.glow, rx: -90, rz: 90, width: w, height: 5.2, emissive: 3 }, seg), w: w });
    }
    [-1, 1].forEach((e) => {
      const a = e * 69 * D2R;
      const tip = ghostEl("m-group", { x: 15 * Math.sin(a), z: -15 * (1 - Math.cos(a)) }, blade);
      [{ ry: 0 }, { rx: -90 }].forEach((rot) => ghostEl("m-image", withO({ src: T.flare, width: 7, height: 7, emissive: 6 }, rot), tip));
    });
    [-8, 0, 8].forEach((tx) => {
      const tz = -15 * (1 - Math.cos(Math.asin(tx / 15))) - 10;
      glows.push({ n: ghostEl("m-image", { src: T.glow, x: tx, z: tz, rx: 90, width: tx ? 1.4 : 2.2, height: 20, emissive: 2 }, blade),
        w: tx ? 1.4 : 2.2 });
    });
    const lamp = ghostEl("m-light", { type: "point", intensity: 45, distance: 45, color: col }, mover);
    // v11h: the glows flicker in the players' clients, and the whole flight
    // is ONE glide sent once. The server still tracks x,z itself for the hit.
    glows.forEach((P) => loopAnim(P.n, "width", P.w * 0.8, P.w * 1.25, rnd(90, 160)));
    glide(mover, { z: WS_RANGE }, (WS_RANGE / WS_SPEED) * 1000, "linear");
    let travelled = 0, last = Date.now();
    const kill = () => {
      lamp.setAttribute("intensity", "0");
      clearInterval(tk);
      settle(mover, { z: travelled });              // stop it where the server says it is
      glide(shrink, { sx: 0.05 }, 250, "in");       // and fold it away (one attribute)
      setTimeout(() => { if (g.parentNode) g.parentNode.removeChild(g); }, 320);
    };
    const tk = setInterval(() => {
      const now = Date.now();
      const step = Math.min(0.2, (now - last) / 1000) * WS_SPEED;
      last = now;
      x += f.x * step; z += f.z * step; travelled += step;
      const we = worldPos(E);
      const inAir = now >= E.airFrom && now < E.airUntil;
      if (!E.down && !inAir && Math.hypot(we.x - x, we.z - z) < WS_HIT_R) {
        kill();
        windSlashHit(R, E, x, z, f, power);
        return;
      }
      if (travelled >= WS_RANGE || phase === "OVER") kill();
    }, 50);
  }
  function windSlashHit(R, E, x, z, f, power) {
    popWorld(R, x, C_FLOOR + 6, z, 2, 12, R.def.laser === "blue" ? "#4d9dff" : "#ff4d5a", 500);
    if (E.shieldUp) {
      aegisHit(E, false);
      say(E, "SHIELD STOPPED THEIR WIND SLASH");
      say(R, "WIND SLASH BLOCKED");
      return;
    }
    const done = hurt(E, Math.max(1, WS_DMG * (power === undefined ? 1 : power)), R);
    if (E.down) return;
    say(E, "WIND SLASH HIT US -" + done);
    say(R, "WIND SLASH HIT! " + done + " DAMAGE");
    knockBack(E, f.x, f.z, done * KNOCK_PER_DMG);
  }

  // ==========================================================
  // THE FINISHER
  // ==========================================================
  function stationGroups(R) {
    const S = R.st;
    const groups = [
      [S.captain], [S.lfwd, S.lback], [S.rfwd, S.rback], [S.turnL, S.turnR],
      [S.lpunch, S.lwind, S.lextra], [S.rpunch, S.rwind, S.rextra], [S.shield],
      Object.values(S.route),
    ];
    return groups.filter((g) => g.some(occupied)).length;
  }
  function trySync(R) {
    if (!canAct(R) || R.syncUntil) return;
    const now = Date.now();
    if (now < R.finReadyAt) return say(R, "FINISHER COOLING DOWN " + secs(R.finReadyAt - now));
    if (R.fin < 1) return say(R, "FINISHER " + Math.round(R.fin * 100) + "% - POWER ROOM: PICK FINISHER");
    R.syncUntil = Date.now() + SYNC_MS;
    R.syncPeak = 0;
    say(R, "SYNC! EVERYBODY ON YOUR PLATE!");
    // v10i: they get the same 3 seconds we do, to get the shield up
    say(enemyOf(R), "!!! THEY ARE FIRING A FINISHER - SHIELD UP NOW !!!");
  }
  function fireFinisher(R) {
    R.syncUntil = 0;
    R.fin = 0;
    R.finReadyAt = Date.now() + FIN_COOL_MS;
    const frac = Math.max(0.25, R.syncPeak / 8);
    endCharge(R);
    const beamLen = FIN_RANGE + 10, bz = CHEST.d / 2 + 0.5;
    const E = enemyOf(R);
    const wr = worldPos(R), we = worldPos(E), f = worldFwd(R);
    const dx = we.x - wr.x, dz = we.z - wr.z, d = Math.hypot(dx, dz) || 1;
    const ang = Math.acos(clamp((dx * f.x + dz * f.z) / d, -1, 1)) / D2R;
    const hit = !(E.down || d > beamLen || ang > FIN_ANG);
    // v11f: THE MEGA BEAM - stops at them when it hits. The more of the
    // crew synced, the fatter it is.
    megaBeam(R, hit ? Math.max(20, d - 8 - bz) : beamLen, FIN_BEAM_W + FIN_BEAM_W_SYNC * frac, FIN_BEAM_MS, hit);
    say(R, "FINISHER - " + R.syncPeak + " OF 8 SYNCED");
    if (!hit) {
      setTimeout(() => boom(R.root, 0, C_FLOOR + 7, bz + beamLen, 1.4, false), 300);   // it bursts at the end of the beam
      say(R, "FINISHER MISSED");
      return;
    }
    let dmg = FIN_DMG * frac;
    if (E.shieldUp) { dmg *= 0.5; aegisHit(E, true); }
    // v11f: J3FF-size explosions on them (was one white puff), as the
    // beam reaches them
    setTimeout(() => {
      const s_ = sgn(R), big = 1.3 + 0.7 * frac;
      boom(R.side, s_ * (we.x - (dx / d) * 8), C_FLOOR + 7, s_ * (we.z - (dz / d) * 8), big, false);
      setTimeout(() => boom(R.side, s_ * we.x, 0, s_ * we.z, big * 0.9, true), 250);   // v11g: 2 explosions (was 4)
    }, 250);
    const done = hurt(E, dmg, R);
    say(E, "HIT BY THE FINISHER! -" + done);
    knockBack(E, dx / d, dz / d, done * KNOCK_PER_DMG);
  }

  // ==========================================================
  // THE CAPTAIN: gears, height, emotes
  // ==========================================================
  const GEAR_NAME = { brace: "BRACE", walk: "WALK", sprint: "SPRINT" };
  function setGear(R, g) {
    const now = Date.now();
    if (R.down || R.gear === g) return;
    if (now - R.gearAt < GEAR_COOL_MS) return;
    R.gearAt = now;
    R.gear = g;
    R.lastLeg = null;
    if (g !== "sprint") endDash(R);
    if (g === "sprint" && emoting(R)) endEmote(R, false);
    ["L", "R"].forEach((k) => { R.arm[k].shown = null; });
    say(R, g === "sprint" ? "SPRINT! LEGS KEEP THE BEAT, ARMS PUMP"
      : g === "brace" ? "BRACE! LEGS DIG IN ON FWD" : "WALK - LEGS TAKE TURNS");
    legsTo(R, g === "brace" ? { L: { hip: -12, knee: 20, ank: -8 }, R: { hip: 10, knee: 16, ank: -6 } } : LEGS_ZERO, 700);
  }
  // JUMP: the captain calls it, the leg crews power it.
  function legsPushing(R) {
    const S = R.st;
    return (occupied(S.ljump) ? 1 : 0) + (occupied(S.rjump) ? 1 : 0);
  }
  function tryJump(R) {
    const now = Date.now();
    if (!canAct(R) || R.jumping) return;
    if (now < R.jumpReadyAt) return say(R, "STOMP RECHARGING " + secs(R.jumpReadyAt - now));
    if (R.gear === "brace") return say(R, "BRACED - PRESS WALK TO STOMP");
    if (burnt(R, "legs")) return say(R, "LEGS BURNT OUT - NO STOMP");
    if (emoting(R) && R.emoteLegs) return;
    const legs = legsPushing(R);
    if (legs < 2) return;   // the other leg crew is not on their plate yet
    const full = true;
    const pw = powered(R, "legs") || overOn(R);
    const k = pw ? JUMP_POWER : 1;
    const H = (full ? JUMP_H : JUMP_H_HALF) * k;
    const tok = ++R.jumpTok;
    const at = (ms, f) => later(ms, () => { if (tok === R.jumpTok && !R.down) f(); });
    R.jumping = true;
    R.jumpReadyAt = now + JUMP_COOL_MS;
    R.legTok++;
    if (full) { R.airFrom = now + 600; R.airUntil = now + 2350; }
    say(R, full ? "STOMP - UP AND DOWN HARD!" : "ONLY ONE LEG PUSHING - SMALL HOP");
    const armsFree = (a) => !R.arm[a].throwing && R.arm[a].charge <= 0.02 && !(a === "L" && R.shieldUp) && !emoting(R);
    const arms = (p, ms, ease) => ["L", "R"].forEach((a) => { if (armsFree(a)) armTo(R, a, p, ms, ease); });
    // crouch
    const crouch = { hip: -35, knee: 70, ank: -35 };
    legsTo(R, { L: crouch, R: crouch }, 550);
    arms({ rx: 30, erx: -30 }, 550);
    tween(R.root, { y: -2 }, 550, "inOut");
    // take off
    at(600, () => {
      R.jetUntil = Date.now() + 1200;
      tween(R.root, { y: H }, 900, "out");
      const tuck = { hip: -50, knee: 90, ank: -20 };
      legsTo(R, { L: tuck, R: tuck }, 450, "out");
      arms({ rz: 140, erz: 10 }, 450, "out");
    });
    // come down
    at(1550, () => {
      tween(R.root, { y: 0 }, 800, "in");
      legsTo(R, LEGS_ZERO, 650);
      arms({ rx: -30, rz: 30, erx: -50 }, 600);
    });
    // land
    at(2350, () => {
      dust(R, "L", true); dust(R, "R", true);
      tween(R.root, { y: -1.2 }, 200, "out");
      const give = { hip: -15, knee: 30, ank: -15 };
      legsTo(R, { L: give, R: give }, 200);
      if (!full) return;
      ring(R, 0, 0, 6, JUMP_SLAM_R, "#ffffff", 900);
      ring(R, 0, 0, 4, JUMP_SLAM_R * 0.8, R.def.glow, 800);
      const E = enemyOf(R);
      const a = worldPos(R), b = worldPos(E);
      const d = Math.hypot(a.x - b.x, a.z - b.z) || 1;
      if (phase === "LIVE" && !E.down && d <= JUMP_SLAM_R && !(Date.now() >= E.airFrom && Date.now() < E.airUntil)) {
        const done = hurt(E, JUMP_SLAM_DMG * k, R);
        say(E, "THEIR STOMP SHOCKWAVE! -" + done);
        say(R, "STOMP LANDED! " + done + " DAMAGE");
        knockBack(E, (b.x - a.x) / d, (b.z - a.z) / d, done * KNOCK_PER_DMG * SLAM_KNOCK_MULT);
      }
    });
    at(2650, () => {
      tween(R.root, { y: 0 }, 600, "inOut");
      legsTo(R, LEGS_ZERO, 600);
      ["L", "R"].forEach((a) => { R.arm[a].shown = null; });
    });
    at(3300, () => { R.jumping = false; set(R.root, { y: 0 }); });
    later(3400, () => { if (tok === R.jumpTok) R.jumping = false; });
  }
  function deskPress(R, name) {
    if (name === "FINISHER") return trySync(R);
    if (ORDER[name]) return issueOrder(R, name);
    emote(R, name);
  }

  // Emotes take over limbs for a few seconds. The crew always has
  // the last word: stepping on PUNCH cancels an arm emote,
  // FWD or BACK cancels a leg one. Finish one near the enemy
  // without being hit and it builds the finisher (hype).
  function endEmote(R, finished, why) {
    if (!R.emote) return;
    const name = R.emote;
    R.emote = null;
    R.emoteUntil = 0;
    R.emoteLegs = false;
    R.emoteTok = (R.emoteTok || 0) + 1;
    ["L", "R"].forEach((k) => { R.arm[k].shown = null; });
    if (!R.down) legsTo(R, LEGS_ZERO, 500);
    if (why) say(R, why);
    if (!finished || phase !== "LIVE") return;
    const E = enemyOf(R);
    const a = worldPos(R), b = worldPos(E);
    const near = Math.hypot(a.x - b.x, a.z - b.z) <= EMOTE_RANGE;
    if (R.emoteHit) return say(R, "CAUGHT SHOWING OFF - NO HYPE");
    if (!near) return say(R, "TOO FAR AWAY - NOBODY SAW THAT");
    const h = HYPE[name] || 0;
    if (h) {
      R.fin = Math.min(1, R.fin + h);
      say(R, name + " +" + Math.round(h * 100) + "% HYPE - FINISHER " + Math.round(R.fin * 100) + "%");
    }
    if (name === "FLEX") R.armor = Math.min(ARMOR_MAX, R.armor + FLEX_REPAIR);
  }
  function emote(R, name) {
    const now = Date.now();
    if (!live(R) || stalled(R)) return;
    if (R.gear === "sprint") return say(R, "SPRINTING - ARMS ARE BUSY");
    if (emoting(R)) return;
    if (now < R.emoteReadyAt) return;
    if (name === "ROAR" && now < R.roarReadyAt) return say(R, "ROAR RECHARGING");
    if (R.arm.L.throwing || R.arm.R.throwing || R.unwinding) return;
    const legsToo = name === "DANCE";
    if (legsToo && R.moving) return;
    const tok = (R.emoteTok = (R.emoteTok || 0) + 1);
    const at = (ms, f) => later(ms, () => { if (tok === R.emoteTok) f(); });
    const DUR = { TAUNT: 2800, FLEX: 3200, WAVE: 3000, DANCE: 5400, ROAR: 2800 };
    const dur = DUR[name];
    R.emote = name;
    R.emoteUntil = now + dur;
    R.emoteLegs = legsToo;
    R.emoteHit = false;
    R.emoteReadyAt = now + dur + EMOTE_COOL_MS;
    ["L", "R"].forEach((k) => { R.arm[k].charge = 0; });
    say(R, "CAPTAIN: " + name + "!");
    at(dur, () => endEmote(R, true));

    if (name === "TAUNT") {
      // come on, then
      armTo(R, "L", { rx: 5, rz: 38, erx: -100, erz: -20 }, 500);
      armTo(R, "R", { rx: -80, rz: 10, erx: -10 }, 500);
      [700, 1300, 1900].forEach((t) => {
        at(t, () => armTo(R, "R", { rx: -80, rz: 10, erx: -115 }, 280, "out"));
        at(t + 300, () => armTo(R, "R", { rx: -80, rz: 10, erx: -10 }, 280, "in"));
      });
    } else if (name === "FLEX") {
      ["L", "R"].forEach((k) => armTo(R, k, { rz: 85, erz: 95, erx: 0 }, 700));
      [1100, 2000].forEach((t) => {
        at(t, () => ["L", "R"].forEach((k) => armTo(R, k, { rz: 80, erz: 118, erx: 0 }, 320)));
        at(t + 420, () => ["L", "R"].forEach((k) => armTo(R, k, { rz: 85, erz: 95, erx: 0 }, 320)));
      });
    } else if (name === "WAVE") {
      armTo(R, "R", { rz: 150 }, 600);
      armTo(R, "L", GUARD_ARM, 600);
      for (let i = 0; i < 5; i++) at(700 + i * 420, () => armTo(R, "R", { rz: 150, erz: i % 2 ? -30 : 30 }, 400));
    } else if (name === "ROAR") {
      R.roarReadyAt = now + ROAR_COOL_MS;
      ["L", "R"].forEach((k) => armTo(R, k, { rx: 10, rz: 25, erx: -80 }, 500));
      at(600, () => {
        ["L", "R"].forEach((k) => armTo(R, k, { rz: 140, erz: 20 }, 450, "out"));
        pop(R.root, 0, H_FLOOR + 4, HEAD.cz + HEAD.d / 2 + 20, 3, 17, R.def.glow, 1200);   // v11p: clear of our own bridge (was 34m at the visor)
        // a roar up close rattles their arms
        const E = enemyOf(R);
        const a = worldPos(R), b = worldPos(E);
        if (phase === "LIVE" && !E.down && Math.hypot(a.x - b.x, a.z - b.z) <= ROAR_RANGE) {
          const until = Date.now() + ROAR_RATTLE_MS;
          ["L", "R"].forEach((k) => { E.arm[k].coolUntil = Math.max(E.arm[k].coolUntil, until); });
          say(E, "ROARED AT! ARMS RATTLED " + secs(ROAR_RATTLE_MS));
          say(R, "ROAR! THEIR ARMS ARE RATTLED");
        }
      });
      at(1400, () => pop(R.root, 0, H_FLOOR + 4, HEAD.cz + HEAD.d / 2 + 22, 3, 19, R.def.glow, 1200));   // v11p: was 44m white at the visor
    } else if (name === "DANCE") {
      for (let i = 0; i < 7; i++) {
        at(i * 740, () => {
          const up = i % 2 ? "R" : "L", down = i % 2 ? "L" : "R";
          armTo(R, up, { rz: 150, erz: -10 }, 340);
          armTo(R, down, { rx: -20, rz: 20, erx: -60 }, 340);
          legStep(R, i % 2 ? "L" : "R", i % 4 < 2 ? 1 : -1, 700, 0.55);
        });
      }
    }
  }

  // ==========================================================
  // THE FIELD (v8)
  // ==========================================================
  const fromCentre = (R) => { const p = worldPos(R); return Math.hypot(p.x - center.x, p.z - center.z); };
  // out of bounds: the other robot takes the point
  function ringOut(E) {
    if (phase !== "LIVE" || E.down) return;
    E.moveTok++; E.moving = null; E.sv = 0; E.sprintUntil = 0;
    stopTween(E.root, "x"); stopTween(E.root, "z");
    E.legTok++;
    legsTo(E, { L: { hip: 25, knee: 30, ank: -10 }, R: { hip: -20, knee: 45, ank: -12 } }, 500, "out");
    later(900, () => legsTo(E, LEGS_ZERO, 900));
    ring(E, 0, 0, 6, 45, "#ff3b3b", 1200);
    const W = enemyOf(E);
    say(E, "OUT OF BOUNDS - POINT LOST");
    say(W, "THEY STEPPED OUT - POINT TO US!");
    endRound(W, E.def.name + " STEPPED OUT");
  }
  // where the edge is, for the screens
  function edgeLine(R) {
    if (phase !== "LIVE") return "";
    const p = worldPos(R);
    const r = Math.hypot(p.x - center.x, p.z - center.z);
    const left = OUT_R - r;
    if (left > EDGE_WARN) return "";
    const k = r > 0.1 ? OUT_R / r : 0;
    const s = sideOf(R, center.x + (p.x - center.x) * k, center.z + (p.z - center.z) * k);
    return "EDGE " + Math.max(0, Math.round(left)) + "M " + s.dir + "!";
  }
  // between rounds: anyone too far out walks back in, then then()
  function bringInside(then) {
    let longest = 0;
    robots.forEach((R) => {
      const p = worldPos(R);
      const r = Math.hypot(p.x - center.x, p.z - center.z);
      if (r <= SAFE_R) return;
      const k = SAFE_R / r;
      const tx = center.x + (p.x - center.x) * k, tz = center.z + (p.z - center.z) * k;
      const dist = r - SAFE_R;
      const speed = clamp(dist / 40, HOME_SPEED, HOME_SPEED_MAX);
      const ms = Math.max(1500, (dist / speed) * 1000);
      longest = Math.max(longest, ms);
      say(R, "WALKING BACK INTO THE FIELD");
      moveTo(R, sgn(R) * tx, sgn(R) * tz, ms, "home", "inOut");
      let leg = "L";
      for (let t = 0; t < ms - 400; t += 900) {
        later(t, () => { if (phase === "RESET") { legStep(R, leg, 1, 850, 0.6); leg = leg === "L" ? "R" : "L"; } });
      }
    });
    later(longest + 400, then);
  }

  // ==========================================================
  // THE TICK
  // ==========================================================
  let lastTick = Date.now();
  setInterval(() => {
    const now = Date.now();
    const dt = Math.min(0.3, (now - lastTick) / 1000);
    lastTick = now;
    robots.forEach((R) => tickRobot(R, now, dt));
    if (phase === "COUNT") separate();
  }, TICK_MS);

  // during a countdown, robots too close are eased apart
  function separate() {
    const [A, B] = robots;
    const a = worldPos(A), b = worldPos(B);
    const d = Math.hypot(a.x - b.x, a.z - b.z);
    if (d >= START_GAP) return;
    const ux = d > 0.1 ? (a.x - b.x) / d : 0, uz = d > 0.1 ? (a.z - b.z) / d : 1;
    const step = 3 * (TICK_MS / 1000);
    [[A, 1], [B, -1]].forEach(([R, s]) => {
      if (R.moving) return;
      const k = sgn(R);
      tween(R.root, { x: px(R) + k * s * ux * step, z: pz(R) + k * s * uz * step }, TICK_MS + 30, "linear");
    });
  }

  function tickRobot(R, now, dt) {
    const S = R.st;
    const active = live(R);
    const fight = phase === "LIVE" && !R.down;
    tickSeat(R, now);
    tickLift(R, now);

    // v8: out of bounds loses the point
    if (fight) {
      const r = fromCentre(R);
      if (r > OUT_R) { ringOut(R); return; }
      if (r > OUT_R - EDGE_WARN / 2 && now > (R.edgeSaidAt || 0) + 4000) {
        R.edgeSaidAt = now;
        say(R, "EDGE CLOSE - " + Math.round(OUT_R - r) + "M TO THE LINE");
      }
    }

    // power: the extra power goes wherever the power room sent it
    // v10c: the power only flows while somebody is STANDING on a plate,
    // and only ever to one place - two plates at once split it to nothing
    {
      const on = ROUTES.filter(([key]) => occupied(S.route[key]));
      const want = on.length === 1 ? on[0][0] : null;
      if (want !== R.route) {
        R.route = want;
        if (want) {
          say(R, "EXTRA POWER TO " + ROUTES.find((r) => r[0] === want)[1]);
          light(R, want === "arms" ? "larm" : want);
          if (want === "arms") light(R, "rarm");
        } else if (on.length > 1) say(R, "POWER SPLIT - ONE PLATE AT A TIME");
        else say(R, "POWER ROOM PLATE EMPTY - NO EXTRA POWER");
      }
    }
    SOCKETS.forEach((k) => {
      const P = R.sock[k];
      P.heat = 0; P.burnUntil = 0;
      const want = k === "larm" || k === "rarm" ? "arms" : k;
      P.powered = active && R.route === want;
    });

      resetState(R);
      if (wasDown) standUp(R);
      armTo(R, "L", GUARD_ARM, 900);
      armTo(R, "R", GUARD_ARM, 900);
    });
    // v8: anyone near or past the line walks back in first
    phase = "RESET";
    const far = robots.some((R) => fromCentre(R) > SAFE_R);
    setStatus(far ? "ROUND " + round + " - ROBOTS WALKING BACK IN" : "ROUND " + round + " - GET TO YOUR STATIONS");
    bringInside(() => {
      if (phase !== "RESET") return;
      phase = "COUNT";
      countLeft = count;
      setStatus("ROUND " + round + " - GET TO YOUR STATIONS");
      robots.forEach((R) => say(R, (round <= 1 ? "MATCH" : "ROUND " + round) + " STARTS IN " + count + " - TO YOUR STATIONS!"));
    });
  }
  function endRound(winner, why) {
    if (phase !== "LIVE") return;
    phase = "OVER";
    robots.forEach((R) => {
      R.shieldUp = false; showOverlay(R.shield, false); shieldPose(R, false);
      R.syncUntil = 0; R.sv = 0; R.sprintUntil = 0;
      endEmote(R, false);
    });
    if (winner) {
      winner.wins++;
      if (!winner.down) {
        armTo(winner, "L", { rz: 150 }, 900);
        armTo(winner, "R", { rz: 150 }, 900);
      }
      setStatus(why + " - POINT TO " + winner.def.name);
    } else {
      setStatus(why + " - ROUND REPLAYED");
    }
    const done = winner && winner.wins >= POINTS_TO_WIN;
    later(BETWEEN_MS, () => {
      if (done) {
        phase = "IDLE";
        robots.forEach((R) => {
          if (R.down) { R.down = false; standUp(R); }
          R.armor = ARMOR_MAX;
          ["L", "R"].forEach((k) => { R.arm[k].shown = null; });
        });
        setStatus(winner.def.name + " WINS THE MATCH!");
      } else {
        nextRound(COUNT_NEXT_S);
      }
    });
  }
  function practiceRefill() {
    robots.forEach((R) => {
      if (R.armor < ARMOR_MAX && !R.down && Date.now() - (R.lastHitAt || 0) > PRACTICE_REFILL_MS) {
        R.armor = ARMOR_MAX;
        say(R, "PRACTICE - ARMOR REFILLED");
      }
    });
  }
  function timeUp() {
    const [A, B] = robots;
    if (A.armor !== B.armor) return endRound(A.armor > B.armor ? A : B, "TIME - MORE ARMOR LEFT");
    const ra = fromCentre(A), rb = fromCentre(B);
    if (Math.abs(ra - rb) > 1) return endRound(ra < rb ? A : B, "TIME - NEARER THE CENTRE");
    endRound(null, "TIME - DEAD EVEN");
  }
  function abortMatch() {
    clearGameTimers();
    phase = "IDLE";
    robots.forEach((R) => {
      R.syncUntil = 0; R.sv = 0; R.sprintUntil = 0;
      endEmote(R, false);
      if (R.down) { R.down = false; standUp(R); }
      R.armor = ARMOR_MAX;
    });
    setStatus("MATCH STOPPED");
  }
  function toggleMatch() {
    if (phase === "IDLE") startMatch("OPERATOR STARTED THE MATCH");
    else abortMatch();
  }

  setInterval(() => {
    if (phase === "COUNT") {
      countLeft--;
      if (countLeft <= 0) {
        phase = "LIVE";
        clockLeft = ROUND_S;
        fightFlashUntil = Date.now() + 2500;
        setStatus("ROUND " + round + " - FIGHT!");
        robots.forEach((R) => say(R, "FIGHT! PUSH THEM OUT"));
      }
    } else if (phase === "LIVE") {
      clockLeft--;
      if (clockLeft <= 0) timeUp();
    } else if (phase === "IDLE") {
      practiceRefill();
    }
  }, 1000);

  // ---- wire the plates --------------------------------------
  robots.forEach((R) => {
    const S = R.st;
    S.lfwd.onEnter = () => tryStep(R, "L", 1);
    S.lback.onEnter = () => tryStep(R, "L", -1);
    S.rfwd.onEnter = () => tryStep(R, "R", 1);
    S.rback.onEnter = () => tryStep(R, "R", -1);
    S.lpunch.onEnter = () => tryPunch(R, "L");
    S.rpunch.onEnter = () => tryPunch(R, "R");
    S.lextra.onEnter = () => tryGrab(R);
    const windIn = () => { if (emoting(R) && !R.emoteLegs) endEmote(R, false, "ARMS CANCELLED THE " + R.emote); };
    S.blind.onEnter = () => tryBlind(R);
    S.lwind.onEnter = windIn;
    S.rwind.onEnter = windIn;
    S.rextra.onEnter = () => tryWindSlash(R);
    // v10c: routing is decided by who is standing on a plate (see the
    // tick), so stepping on one just tells the room what it will do.
    ROUTES.forEach(([key, name]) => {
      S.route[key].onEnter = () => say(R, "HOLD THIS PLATE - EXTRA POWER TO " + name);
    });
  });

  // ==========================================================
  // AT SPAWN: the operator console and the board
  // ==========================================================
  // anybody aboard? (inside the body or the lift shaft)
  function crewAboard(R) {
    let n = 0;
    R.crew.forEach((p) => {
      const inBody = Math.abs(p.x) < 20 && p.y > 29 && p.y < 76 && p.z > -24 && p.z < 9;
      const inLift = p.x > 0 && p.x < 10 && p.y > -1 && p.y < 46 && p.z > -37 && p.z < -22;
      if (inBody || inLift) n++;
    });
    return n;
  }
  function sendHome() {
    if (phase !== "IDLE") return "LIVE";
    let sent = 0;
    robots.forEach((R) => {
      if (crewAboard(R) > 0) return say(R, "CALLED HOME - YOU HAVE CREW, DRIVE BACK");
      R.sv = 0; R.moveTok++; R.moving = null;
      set(R.root, { x: 0, z: -SPAWN_Z, y: 0, ry: Math.round(ph(R) / 360) * 360 });
      sent++;
    });
    return sent === 2 ? "HOME" : sent === 1 ? "ONE" : "CREW";
  }

  const board = (function spawnConsole() {
    // stands beside the spawn, facing +x - set the spawn point near x 30, z 0
    const g = group({ x: 22, ry: 90 });
    box(g, 0, 0.35, 0, 7, 0.7, 4, STONE, { collide: "true" });
    box(g, 0, 0.75, 0, 7.4, 0.14, 4.4, GOLD);
    const K = keypad(g, { y: 0.7, title: "START / STOP", promptX: -2.6 }, (K) => {
      const was = phase;
      toggleMatch();
      K.flash(was === "IDLE" ? "START" : "STOP");
    });
    // send idle robots home
    const hb = box(g, 2.6, 2.3, 0.1, 1.5, 1.1, 0.2, "#15151f", { collide: "true" });
    const hl = el("m-label", {
      z: 0.11, width: 1.4, height: 1.0, "font-size": fitFS(1.4, 1.0, 5), alignment: "center",
      color: "#15151f", "font-color": GOLD, content: "HOME", collide: "true",
    }, hb);
    let last = 0;
    const home = () => {
      if (Date.now() - last < 1000) return;
      last = Date.now();
      K.flash(sendHome());
    };
    hb.addEventListener("click", home);
    hl.addEventListener("click", home);
    // the board
    const bg = group({ y: 9, z: -1 }, g);
    box(bg, 0, 0, -0.2, 20, 6.4, 0.3, PANEL);
    label(bg, "TITANS", { y: 2.1, width: 12, height: 1.8, "font-color": GOLD }, 6);
    const l1 = label(bg, "", { y: 0.2, width: 19, height: 1.4 }, 48);
    const l2 = label(bg, "", { y: -1.8, width: 19, height: 1.6 }, 24);
    return { set: (a, b) => { setText(l1, a); setText(l2, b); } };
  })();

  // the bridge keypads start a match from inside a robot
  function bridgeCode(R, K) {
    if (phase === "IDLE") {
      startMatch(R.def.name + "'S CAPTAIN STARTED THE MATCH");
      K.flash("START");
    } else {
      K.flash("LIVE");
    }
  }

  robots.forEach((R) => { resetState(R); armTo(R, "L", IDLE_ARM, 1); armTo(R, "R", IDLE_ARM, 1); });
  refreshBoards();
</script>
