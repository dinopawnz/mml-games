  v11m: THE WIND-UP IS BACK
  ============================================================
  v11l fixed the frame-rate leak by keeping one animation per arm
  joint and re-aiming it for each move - and the arms stopped showing
  their pull-back. So the arms go back to v11i's way (a fresh one-shot
  animation per move, which is what made them smooth), and the leak
  is closed a different way: every permanent piece that animates two
  or more attributes (the arm joints already did; now the shield, the
  aegis and the armour bar too) carries an m-attr-lerp on them from
  the start. With that in place the player's client never starts the
  per-frame ticks that were leaking. Temporary effects keep v11l's
  one-attribute-per-piece build.
  ============================================================
  Every wind slash made the frame rate a little worse, for good.
  Found in MML's own player code: when a piece has animations on
  two or more of its attributes (say x and z, or width and height),
  the client starts a per-frame tick for each attribute but only
  remembers the last one. Take the animations off and the others
  keep ticking every frame, forever. v11h-v11k added and removed
  such animations constantly - every wind slash (3 left behind),
  every left-arm move (the shield, 2 left behind), every explosion,
  laser and finisher - so the pile of leftover ticks grew all game.
  Fixed two ways:
    - persistent pieces (arms, shield, armour bar, the aegis) keep
      ONE animation per attribute for life and just re-aim it. That
      costs a few ticks once, never more.
    - temporary effects animate ONE attribute per piece - nested
      groups carry the rest (the wind slash flies along one axis of
      a turned group; flares keep their shape with width only; the
      explosion's fireball scales through three nested groups) - so
      removing them cleans up completely.
  Nothing looks different. Reload the world to clear the ticks that
  earlier versions already left behind.

  which should fix it (and the knockouts). If the frame rate is still
  low, set SMOOTH_ARMS = false: the arms go back to the old server
  steps, and you'll know whether the arms were the cause.

  ============================================================
  v11f's finisher lagged the whole world with 40 players aboard. The

  server was pushing megabytes a second to every player; and every
  flicker, spark and explosion piece was moved by the server 14-20
  times a second, each move sent to all 40 players.

    - no picture ever changes after it is made, and the pictures

    - fewer pieces: 6 bolts on the beam (was 10), 3 on the charge,

  v6: ONE LEG SPINS YOU  (and v5, v4 notes follow)

  THE LEG RULE (replaces the v5 stumble)
  ------------------------------------------------------------
  The robot only walks when BOTH legs are working:
    first step         that leg plants itself and waits. No
                       movement - the screens call for the other
                       leg.
    other leg, same    a full stride forward (or back), exactly as
    way                before. Keep alternating and it walks.
    same leg again     NO forward movement. The robot pivots
                       PIVOT_DEG away from that leg: the left leg
                       pushing forward turns it right, the right
                       leg turns it left. Keep stepping alone and it
                       keeps spinning, until the other leg steps.
    legs opposite      left FWD then right BACK (or the reverse):
                       a tank turn, the robot pivots the same way.
  BACK with one leg spins the other way (left BACK turns left).
  There is no stall any more - spinning is the penalty, and it
  can be useful: two leg crews can turn the robot on the spot.
    PIVOT_DEG    12   degrees per lone step (PIVOT_DEG_P powered)

  ============================================================

  WHAT CHANGED
  ------------------------------------------------------------
  PLATES WORK EVERYWHERE. A plate used to count only the thin base
  slab's collisions, and the raised face and label sat on top of
  it, so standing in the middle often reported nothing. Now each
  robot has a position probe (m-position-probe) that checks where
  every crew member is standing, and a plate is lit when you are
  anywhere on it, edge or centre. Collisions on every part of the
  plate still count as a backup. Stepping off has a short grace
  (PLATE_GRACE_MS) so sliding across a plate never fires twice.

  LEG BAYS ARE SEPARATE ROOMS. The doors between the waist and the
  leg bays are gone. Each leg bay now has its own corridor that
  leaves the SPINE FLOOR through a door in the side of the spine:
  left door for the left leg, right door for the right. Walk down
  the ramp to the bottom of the spine and follow the floor signs.
  The legs must ALWAYS take turns now (STRICT_LEGS). In v4, one
  person could walk the robot alone by waiting 4 seconds between
  steps on the same leg.

  When the waist screen says COILED, the arm crew on that side
  steps on PUNCH. The robot unwinds back to face the enemy and the
  punch lands with SUPER_MULT (x2) the knockback. The arm still has
  to be wound up first. Punch with the other arm, or when not
  coiled, and it is an ordinary punch.

    COIL_MAX      45   twist further and the super is off
    UNWIND_MS   1200   how long the unwind takes (riders!)

  shield raised in that last half second is a parry.

  ============================================================
  v4: THE GAME
  ============================================================
  Two 75m robots, a crew inside each, best of three. Knock the
  other robot off the edge of the arena to win a round.

  Dinopawnz, after v3: "it works great. the players were able to
  move with the robot. however the captain window is hard to see
  through because its super blue and the shield also blocks
  vision. lets try to build the actual game now. ... the robots
  fight but they fight at like 5 frames a second ... the arms
  and legs dont move slowly. they teleport to their next
  position basically."

  WHAT CHANGED
  ------------------------------------------------------------
  SMOOTH LIMBS. The world glides positions smoothly (the body
  rode fine) but not rotations, so every joint snapped to its
  end pose. Now the script moves every joint itself, 20 times a
  second (ANIM_MS), with a short smoothing lerp on top for any
  client that supports one. The body is driven the same way. If
  it still looks steppy, try ANIM_MS 33 (30 a second).

  CLEAR GLASS. Every window is now near-clear (CLEAR, CLEAR_OP).
  The captain's visor glow is a frame round the slit instead of
  a tinted pane over it.

  SEE-THROUGH SHIELD. The shield is an outline - a glowing hexagon
  and a faint inner one - not a solid disc.

  HOW TO PLAY
  ============================================================
  Board your robot (lift tower, bridge, hatch), go to a station,
  and wait for the operator to type 1 7 1 8 on the ring console.
  Every room has a screen that says what its station does and
  what is happening right now.

  LEG BAYS (each side of the hip room)
    Step onto FWD to swing your leg forward, BACK to step back.
    Step off onto the floor and back on for the next one.
    THE LEGS MUST TAKE TURNS. Left, right, left, right. (v6: the
    same leg twice no longer stumbles - it SPINS the robot. See
    THE LEG RULE at the top.) Talk to the other leg.
    You cannot step while the shield is up.

  HIP ROOM
    Hold TURN L or TURN R to turn the robot. Slow on purpose -
    everybody inside is turning with you.

  ARM BAYS (sides of the chest hall)
    Step onto PUNCH to throw it (v8: no more WIND plate). A
    powered arm hits harder. It only lands if the enemy is in front
    of you and in reach, so the captain and the legs have to line
    you up.

  SHIELD (left arm bay)
    Hold to raise the shield. It blocks most of a punch - all but
    15%. Your legs are
    locked while it is up. Raise it in the half second before a
    punch lands and it is a PARRY: the attacker is knocked back
    instead and frozen for a second.

  POWER ROOM (centre of the chest hall) - NOW JUST THE CHARGE
  PLATE, see SIMPLE RULES at the top. What follows is history:
    Five sockets: L.ARM, SHIELD, FINISH, LEGS, R.ARM. Stand on
    one and that system is powered. Powered legs step further and
    turn faster; powered arms hit full strength; a powered shield blocks
    more; FINISH charges the finisher.
    Powered sockets HEAT UP. Stay too long and that system burns
    out for 8 seconds - the arm, the legs, whatever it was - and
    sparks. So keep moving: power what the robot needs right now.
    OVERCHARGE: two crew stand on it together for 3 seconds and
    EVERYTHING is powered for 6 seconds, with no heat. If one of
    you steps off early it fizzles and the robot stalls. Then it
    needs 30 seconds to recover.

  BRIDGE (the head)
    CAPTAIN: while somebody stands here, every screen in your
    robot also shows the ENEMY's state - what is burnt out, what
    is running hot, whether their shield is up, how far away they
    are. Call the moves.
    SYNC: when the finisher is charged, step onto SYNC. For the
    next 3 seconds everybody gets on their plate - the more
    stations are manned (captain, left leg, right leg, hips, left
    arm, right arm, shield, power room: 8 in all), the stronger
    the blast. It fires straight ahead, 80m, and a shield only
    halves it.

  A MATCH
  ------------------------------------------------------------
    1718     bridges pull back, 10 second countdown
    3:00     the round. Off the edge = round lost. If time runs
             out, the robot nearer the centre takes the round.
    between rounds, both robots walk home by themselves (a fallen
    one climbs back up first), then a 5 second countdown
    first to 2 rounds wins. Robots walk home, bridges come back.
    1718 during a match stops it - robots walk home, nobody is
    teleported.

  Crews are whoever is inside. Anybody can join either robot
  before the bridges pull back.

  Set the spawn point on the ring around x 124, z 0.

  TUNING (the numbers that matter most)
  ------------------------------------------------------------
    ANIM_MS            smoothness of every limb
    STEP_MS, STRIDE    how fast a robot walks (riders!)
    KNOCK_SPEED        how fast a knockback slides (riders!)
    TURN_RATE          how fast a robot turns (riders!)
    HEAT_UP_S          seconds on a socket before it burns out
    REACH_MAX/ANG      how forgiving punches are
    KNOCK_MIN/MAX      how far a punch pushes
    FALL_R             where the edge is
    ROUND_S, ROUNDS_TO_WIN

  ------------------------------------------------------------
  v3 - Dinopawnz: "why do the legs not have a bay for players to
  stand inside and control each leg"

  Because a leg swings - a room inside the thigh would tip 26
  degrees on every step. So each leg bay is in the armour block
  directly ABOVE its leg, which is part of the body and only
  glides. The leg swings freely underneath it.

    LEFT LEG BAY / RIGHT LEG BAY   y 32.5, through a door in each
        side of the hip room. The L.LEG or R.LEG plate, a window
        forward, a window out the side, and a glass floor looking
        straight down onto the top of your own leg - you watch it
        swing when you step.
    HIP ROOM   now just TURN L and TURN R, with the floor window
        moved back to the middle.

  To make room, the arms hang a little wider (ARM_FLARE 12,
  was 6) so a hanging forearm does not pass through the side of
  a leg bay, and the hip joint ball is smaller and sits lower so
  it stays out of the bay floor.

  ------------------------------------------------------------
  v2 - stage 1 rebuilt: CREWS INSIDE
  ============================================================
  Dinopawnz: "i was hoping that the robots would be big enough
  so that players can physically enter the robot and control
  each part of the robot from their specific spot inside"

  Ride test result: "people can stand inside moving mmls so long
  as the robots dont move THAAAT much and so fast"

  So the robots are now 75m tall and hollow, and every station
  is a room inside the robot. No command decks any more - you
  board your robot and fight from inside it.

  THE ONE MOVEMENT RULE
  ------------------------------------------------------------
  Everything with people in it - hips, chest, head, backpack -
  is one rigid BODY that only ever GLIDES: forward, back, and
  (from stage 2) slow turns. It never bobs, leans, twists or
  jerks. Arms and legs have nobody inside them, so they do all
  the dramatic moving - big stomps, huge punches.

    a step       4m over 1.5 seconds        (now STEP_MS)
    a lunge      up to 20m, 3 seconds
    a knockback  8m over 2 seconds          (KNOCK_MS)

  If riders still slide around, raise STEP_MS and lower KNOCK_SPEED first.

  INSIDE A ROBOT
  ------------------------------------------------------------
    BRIDGE       the head, y 65. The captain looks out through
                 the visor - the glowing eye strip IS the window.
    CHEST HALL   y 45. A two-storey hall built round the reactor,
                 which you can see from outside through the
                 chest window.
                   centre      POWER ROOM: five sockets in an
                               arc round the reactor, and the
                               OVERCHARGE plate behind it
                   left bay    LEFT ARM (punch) + SHIELD,
                               with a side window and a front one
                   right bay   RIGHT ARM (slash)
    HIP ROOM     y 32.5. TURN L, TURN R. A glass panel in the
                 floor looks straight down between the legs, and a
                 slit window looks forward.
    LEG BAYS     either side of the hip room, one over each leg.
                 (v3)
    THE SPINE    the backpack. A square spiral ramp from the hip
                 room to the bridge, with doors at each room and
                 a boarding hatch. Signs at every door. About a
                 minute to climb the whole thing.

  Left is the robot's left. Face the same way as your robot and
  your arm is on your side.

  GETTING ON
  ------------------------------------------------------------
  From the ring, walk across your team's bridge over the gap onto
  the arena, to the glass elevator tower behind your robot. The
  lift runs by itself, bottom to top and back, about 40 seconds a
  round trip. At the top a bridge crosses to the hatch in the
  robot's back.

  Red boards at -z, blue at +z. Set the spawn point on the ring,
  around x 124, z 0 - the console is there.

  THE SHOWCASE (v2-v3 only - replaced by the match in v4)
  ------------------------------------------------------------
  The boarding bridges pull back, the robots walk in, trade
  punches and shields, get knocked back, walk home, and the
  bridges come back out - then a pause long enough to get on or
  off, and it goes again. Same code turns it off, and the
  bridges return as soon as both robots are home.

  Get inside a robot and ride it through the showcase. That is
  the real test of this build: do the rooms feel right, and is
  the gliding gentle enough.

  The station plates light up while somebody stands on them, and
  still should while the robot is moving.

  THE SCALE
  ------------------------------------------------------------
    robot        about 75m tall, 30m across the shoulders

    box(p, x * (W || K), y * K, z * (W || K), w * (W || K), h * K, d * (W || K), c, o);
  const kcyl = (K, W) => (p, x, y, z, r, h, c, o) =>
    cyl(p, x * (W || K), y * K, z * (W || K), r * (W || K), h * K, c, o);
  const ksph = (K, W) => (p, x, y, z, r, c, o) =>

    n.setAttribute("ping-pong", "true");

    n.setAttribute("attr", attrs);
    n.setAttribute("duration", String(ms));

  // ==========================================================
  // ANIMATION - the script moves everything itself
  // ==========================================================
  // v4. The world glides POSITIONS smoothly but snaps ROTATIONS,

  // number is stepped from here, ANIM_MS apart, eased. The lerp on
  // each joint still smooths between steps where it works.
  const EASE = {
    linear: (t) => t,
    inOut: (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2),
    out: (t) => 1 - (1 - t) * (1 - t),
    in: (t) => t * t,
  };

    return node._v[k];

    if (!node._v) node._v = {};

    if (node._w[k] === out) return;
    node._w[k] = out;
    node.setAttribute(k, out);

  // ==========================================================
  // WALLS WITH HOLES
  // ==========================================================
  // A flat slab split round rectangular holes. axis is the slab's
  // normal: "z" (u = x, v = y), "x" (u = z, v = y), "y" (u = x,
  // v = z). holes are [u0, u1, v0, v1]. The pieces are merged
  // along each row so a wall with a window is a handful of boxes,
  // not a grid.
  function holed(p, axis, pos, u0, u1, v0, v1, t, color, holes, o) {
    const us = [u0, u1], vs = [v0, v1];
    (holes || []).forEach((h) => {
      us.push(Math.max(u0, Math.min(u1, h[0])), Math.max(u0, Math.min(u1, h[1])));
      vs.push(Math.max(v0, Math.min(v1, h[2])), Math.max(v0, Math.min(v1, h[3])));
    });
    const uniq = (a) => Array.from(new Set(a.map(r3))).sort((m, n) => m - n);
    const U = uniq(us), V = uniq(vs);
    const inHole = (u, v) => (holes || []).some((h) => u > h[0] && u < h[1] && v > h[2] && v < h[3]);
    const made = [];
    const emit = (a, b, c, d) => {
      const cu = (a + b) / 2, cv = (c + d) / 2, du = b - a, dv = d - c;
      if (du < 0.01 || dv < 0.01) return;
      if (axis === "z") made.push(box(p, cu, cv, pos, du, dv, t, color, o));
      else if (axis === "x") made.push(box(p, pos, cv, cu, t, dv, du, color, o));
      else made.push(box(p, cu, pos, cv, du, t, dv, color, o));
    };
    for (let j = 0; j < V.length - 1; j++) {
      let start = null;
      for (let i = 0; i < U.length - 1; i++) {
        const solid = !inHole((U[i] + U[i + 1]) / 2, (V[j] + V[j + 1]) / 2);
        if (solid && start === null) start = U[i];
        if (!solid && start !== null) { emit(start, U[i], V[j], V[j + 1]); start = null; }
      }
      if (start !== null) emit(start, U[U.length - 1], V[j], V[j + 1]);
    }
    return made;
  }

  // A hollow room: six walls you can stand inside, an interior
  // lining in its own colour, and a floor finish. Walls collide.
  // holes: { front, back, left, right, top, bottom } in the same
  // coordinates as the room.
  // v9: every walkable floor built while a robot is being made is
  // collected here, so the floors can flash red when it is hurt
  let floorSink = null;
  let roomSink = null;   // v11b: every room's inside, so solidify knows what's interior
  const DOOR_REACH = 2;  // v11c: m of clear space kept outside every doorway
  function room(p, R, colors, holes) {
    const hs = holes || {};
    const cy = R.floor - R.t + R.h / 2;
    const x0 = R.cx - R.w / 2, x1 = R.cx + R.w / 2;
    const z0 = R.cz - R.d / 2, z1 = R.cz + R.d / 2;
    const y0 = cy - R.h / 2, y1 = cy + R.h / 2;
    const t = R.t;
    const solid = { collide: "true" };
    const c = colors.shell;
    holed(p, "z", z1 - t / 2, x0, x1, y0 + t, y1 - t, t, c, hs.front, solid);
    holed(p, "z", z0 + t / 2, x0, x1, y0 + t, y1 - t, t, c, hs.back, solid);
    holed(p, "x", x1 - t / 2, z0 + t, z1 - t, y0 + t, y1 - t, t, c, hs.left, solid);
    holed(p, "x", x0 + t / 2, z0 + t, z1 - t, y0 + t, y1 - t, t, c, hs.right, solid);
    holed(p, "y", y1 - t / 2, x0, x1, z0, z1, t, c, hs.top, solid);
    holed(p, "y", y0 + t / 2, x0, x1, z0, z1, t, c, hs.bottom, solid);
    // lining and floor finish
    const L = 0.05, ic = colors.inner;
    holed(p, "z", z1 - t - L, x0 + t, x1 - t, y0 + t, y1 - t, L, ic, hs.front);
    holed(p, "z", z0 + t + L, x0 + t, x1 - t, y0 + t, y1 - t, L, ic, hs.back);
    holed(p, "x", x1 - t - L, z0 + t, z1 - t, y0 + t, y1 - t, L, ic, hs.left);
    holed(p, "x", x0 + t + L, z0 + t, z1 - t, y0 + t, y1 - t, L, ic, hs.right);
    holed(p, "y", y1 - t - L, x0 + t, x1 - t, z0 + t, z1 - t, L, ic, hs.top);
    const finish = holed(p, "y", y0 + t + 0.02, x0 + t, x1 - t, z0 + t, z1 - t, 0.04, colors.floor, hs.bottom);
    if (floorSink) finish.forEach((n) => floorSink.push(n));
    if (roomSink) {
      roomSink.push({ x0: x0 + t, x1: x1 - t, y0: y0 + t, y1: y1 - t, z0: z0 + t, z1: z1 - t });
      // v11c: every DOORWAY is walkable too - the opening carried right
      // through the wall and DOOR_REACH out past it on the far side, so
      // no trim band or beam outside a door ends up solid across it.
      // A hole is a door when its sill is on a floor people walk on.
      const floors = [R.floor, P_FLOOR, C_FLOOR, H_FLOOR, HATCH_Y];
      const isDoor = (h) => h[3] - h[2] >= 2.5 && floors.some((f) => Math.abs(h[2] - f) < 0.3);
      const reach = t + DOOR_REACH;
      [["front", "z", z1], ["back", "z", z0], ["left", "x", x1], ["right", "x", x0]].forEach(([k, ax, w]) => {
        (hs[k] || []).filter(isDoor).forEach((h) => {
          if (ax === "z") roomSink.push({ x0: h[0], x1: h[1], y0: h[2], y1: h[3], z0: w - reach, z1: w + reach });
          else roomSink.push({ x0: w - reach, x1: w + reach, y0: h[2], y1: h[3], z0: h[0], z1: h[1] });
        });

    return { cy: cy, x0: x0 + t, x1: x1 - t, z0: z0 + t, z1: z1 - t, y1: y1 - t };
  }

  let alarmSink = null;

  // v9: PANELS SIT FLAT ON THE WALL. Every screen, manual and health

  // The panel's face is pulled back to PANEL_OUT off the lining and a
  // SOLID backing fills the gap to the wall, so a panel is part of the
  // wall: nobody can walk into it and the text is never in your face.
  const PANEL_OUT = 0.16;
  const PANEL_SHIFT = 0.225 - PANEL_OUT;
  function panelMount(p, o, W, H, frameColor) {

  function screen(p, o, lines, chars, frame, fc) {
    const g = panelMount(p, o, o.width, o.height, frame);

    if (alarmSink) { bar = box(g, 0, o.height / 2 + 0.08, 0.02, o.width + 0.3, 0.16, 0.06, ALARM_OFF); alarmSink.push(bar); }

  // A station plate: lights up while anybody is standing on it.

  //   "c0..c2" - a collision with any visible part of the plate

  const stationPlates = [];

  function plate(p, x, y, z, w, d, name, color, base0, chars) {

    const sense = { collide: "true", "collision-interval": 100 };
    const base = box(p, x, y + 0.06, z, w, 0.12, d, dim, sense);
    const face = box(p, x, y + 0.13, z, w - 0.5, 0.02, d - 0.5, mix(base0, color, 0.55), sense);
    const lab = label(p, name, withO({
      x: x, y: y + 0.15, z: z, rx: -90, width: w - 0.4, height: Math.min(d - 0.5, 1.3),
      color: mix(base0, color, 0.55), "font-color": "#ffffff",
    }, sense), chars || Math.max(6, name.length));
    // onEnter fires when somebody arrives on the plate - that is what
    // a step or a punch is. Occupancy is for everything you hold.
    const P = {
      base: base, lab: lab, name: name, on: new Set(), onEnter: null,
      x: x, y: y, z: z, hw: w / 2 + PLATE_PAD, hd: d / 2 + PLATE_PAD,
      src: new Map(), leave: new Map(),
    };
    const paint = () => setColor(base, P.on.size ? color : dim);
    P.paint = paint; P.dim = dim;   // v10k: orders pulse a plate, then put it back
    P.mark = (key, src) => {
      let set_ = P.src.get(key);
      if (!set_) { set_ = new Set(); P.src.set(key, set_); }
      set_.add(src);
      const t = P.leave.get(key);
      if (t) { clearTimeout(t); P.leave.delete(key); }
      if (!P.on.has(key)) {
        P.on.add(key);
        paint();
        if (P.onEnter) P.onEnter(key);
      }
    };
    P.unmark = (key, src) => {
      const set_ = P.src.get(key);
      if (!set_ || !set_.has(src)) return;
      set_.delete(src);
      if (set_.size || P.leave.has(key)) return;
      P.leave.set(key, setTimeout(() => {
        P.leave.delete(key);
        const again = P.src.get(key);
        if (again && again.size) return;
        P.src.delete(key);
        P.on.delete(key);
        paint();
      }, PLATE_GRACE_MS));
    };
    P.forget = (key) => {
      const t = P.leave.get(key);
      if (t) clearTimeout(t);
      P.leave.delete(key);
      P.src.delete(key);
      if (P.on.delete(key)) paint();
    };
    P.contains = (ux, uy, uz) =>
      Math.abs(ux - P.x) <= P.hw && Math.abs(uz - P.z) <= P.hd && uy > P.y - 1 && uy < P.y + 2.6;
    [base, face, lab].forEach((n, i) => {
      const src = "c" + i;
      const keyOf = (e) => {
        const id = e && e.detail ? e.detail.connectionId : undefined;
        return id === undefined ? "anon" : id;
      };
      n.addEventListener("collisionstart", (e) => P.mark(keyOf(e), src));
      n.addEventListener("collisionmove", (e) => P.mark(keyOf(e), src));
      n.addEventListener("collisionend", (e) => P.unmark(keyOf(e), src));
    });
    stationPlates.push(P);
    if (plateSink) plateSink.push(P);
    return P;
  }

  // One probe per robot, inside its body, so the positions it
  // reports are already in the robot's own frame - the same frame
  // the plates were placed in - however the robot has moved.
  function plateProbe(body, plates, crew) {
    const probe = el("m-position-probe", {
      x: 0, y: PROBE_Y, z: PROBE_Z, range: PROBE_RANGE, interval: PROBE_MS,
    }, body);
    probe.removeAttribute("collide");
    const onPos = (e) => {
      const d = e && e.detail;
      if (!d || d.connectionId === undefined) return;
      const rel = d.elementRelative && d.elementRelative.position;
      if (!rel) return;
      const ux = rel.x, uy = rel.y + PROBE_Y, uz = rel.z + PROBE_Z;
      if (crew) crew.set(d.connectionId, { x: ux, y: uy, z: uz });
      plates.forEach((P) => {
        if (P.contains(ux, uy, uz)) P.mark(d.connectionId, "probe");
        else P.unmark(d.connectionId, "probe");
      });
    };
    probe.addEventListener("positionenter", onPos);
    probe.addEventListener("positionmove", onPos);
    probe.addEventListener("positionleave", (e) => {
      const d = e && e.detail;
      if (!d) return;
      plates.forEach((P) => P.unmark(d.connectionId, "probe"));
      if (crew) crew.delete(d.connectionId);
    });
    if (crew) crewMaps.push(crew);
    return probe;
  }
  // somebody left the world: take them off every plate at once
  if (typeof window !== "undefined" && window.addEventListener) {
    window.addEventListener("disconnected", (e) => {
      const id = e && e.detail ? e.detail.connectionId : undefined;
      if (id === undefined) return;
      stationPlates.forEach((P) => P.forget(id));
      crewMaps.forEach((m) => m.delete(id));
    });
  }

  // A sign on the inside of a wall. n is the wall's inward normal
  // ("+x", "-x", "+z", "-z"), at is the lining's face along that
  // axis. The sign stands SIGN_GAP in front of it so it never
  // flickers into the wall.
  function wallSign(p, text, n, at, o, chars) {
    const q = withO({}, o);
    const s = n.charAt(0) === "+" ? 1 : -1;
    const axis = n.charAt(1);
    q[axis] = at + s * SIGN_GAP;
    q.ry = axis === "z" ? (s > 0 ? 0 : 180) : (s > 0 ? 90 : -90);
    return label(p, text, q, chars);
  }
  // a floor sign whose text reads toward the given heading
  // (degrees, 0 = toward +z of the parent, 90 = toward +x)
  function floorSign(p, text, x, y, z, heading, o, chars) {
    const g = group({ x: x, y: y, z: z, ry: heading + 180 }, p);
    return label(g, text, withO({ rx: -90 }, o), chars);
  }

  // ==========================================================
  // KEYPADS (v5) - the ring console and one on each bridge
  // ==========================================================
  // A keypad faces its own +z, with its feet at y 0. Each keypad
  // keeps its own entry, so two people typing on two keypads never
  // mix digits. onCode(K) runs when the whole code is in.
  const keypads = [];
  function keypad(p, o, onCode) {
    const g = group({ x: o.x || 0, y: o.y || 0, z: o.z || 0, ry: o.ry || 0 }, p);
    const K = { entry: [], expires: 0, flashTok: 0 };
    box(g, 0, 2.2, 0, 3.4, 3.3, 0.25, "#15151f", { collide: "true" });
    K.display = label(g, "- - - -", { y: 3.4, z: 0.15, width: 3.0, height: 0.5,
      color: "#05050a", "font-color": "#7dffcf" }, 7);
    if (o.title) label(g, o.title, { y: 4.3, z: 0.05, width: 3.6, height: 0.6,
      color: PANEL, "font-color": GOLD }, 12);
    K.show = () => {
      if (K.flashing) return;
      const dots = [];
      for (let i = 0; i < CODE.length; i++) dots.push(i < K.entry.length ? "*" : "-");
      setText(K.display, dots.join(" "));
    };
    K.flash = (t) => {
      const tok = ++K.flashTok;
      K.flashing = true;
      setText(K.display, t);
      setTimeout(() => { if (tok !== K.flashTok) return; K.flashing = false; K.show(); }, 1600);
    };
    const isPrefix = (seq) => seq.every((d, i) => d === CODE[i]);
    K.enter = (digit) => {
      const now = Date.now();
      if (now > K.expires) K.entry = [];
      K.expires = now + CODE_TIMEOUT * 1000;
      K.entry.push(digit);
      while (K.entry.length && !isPrefix(K.entry)) K.entry.shift();
      K.show();
      if (K.entry.length === CODE.length) { K.entry = []; K.show(); onCode(K); }
    };
    K.typed = (str) => {
      const digits = String(str || "").replace(/[^0-9]/g, "");
      K.entry = [];
      for (let i = 0; i < digits.length; i++) K.enter(Number(digits[i]));
      if (digits.length && digits.length !== CODE.length) K.flash("NO");
    };
    [["1", "2", "3"], ["4", "5", "6"], ["7", "8", "9"], ["C", "0", ""]].forEach((row, r) => {
      row.forEach((key, c) => {
        if (key === "") return;
        const clear = key === "C";
        const capC = clear ? "#3d0c27" : "#181134";
        const cap = box(g, (c - 1) * 0.92, 2.42 - r * 0.62, 0.22, 0.78, 0.5, 0.26, capC, { collide: "true" });
        const face = el("m-label", {
          z: 0.14, width: 0.74, height: 0.42,
          "font-size": fitFS(0.74, 0.42, 1), alignment: "center",
          color: capC, "font-color": clear ? "#ff8fd8" : "#fff0b8", content: key, collide: "true",
        }, cap);
        let last = 0;
        const hit = (e) => {
          const now = Date.now();
          if (now - last < 180) return;
          last = now;
          if (o.allow && !o.allow(e)) { K.flash("CAPT"); return; }
          cap.setAttribute("color", clear ? "#ff5ec8" : GOLD);
          setTimeout(() => cap.setAttribute("color", capC), 150);
          if (clear) { K.entry = []; K.show(); } else K.enter(Number(key));
        };
        cap.addEventListener("click", hit);
        face.addEventListener("click", hit);
      });
    });
    // a TYPE button beside the pad opens a text box
    if (o.promptX !== undefined) {
      const pw = document.createElement("m-prompt");
      pw.setAttribute("message", "Match code");
      pw.setAttribute("placeholder", "4 digits");
      g.append(pw);
      const btn = box(pw, o.promptX, 1.6, 0.1, 1.4, 1.1, 0.2, "#15151f", { collide: "true" });
      el("m-label", {
        z: 0.11, width: 1.3, height: 1.0,
        "font-size": fitFS(1.3, 1.0, 5), alignment: "center",
        color: "#15151f", "font-color": GOLD, content: "TYPE", collide: "true",
      }, btn);
      pw.addEventListener("prompt", (event) => {
        if (o.allow && !o.allow(event)) return K.flash("CAPT");
        K.typed(event.detail && event.detail.value);
      });
    }
    K.show();
    keypads.push(K);
    return K;
  }

  // ==========================================================
  // THE CAPTAIN'S DESK (v7) - only the captain can press it
  // ==========================================================
  // Rows are farthest from the captain first. Column 0 is on the
  // captain's left. The gear row is nearest the hands.
  // The moves all live on the captain's desk - the other sectors have
  // enough to do. (The waist's BLIND is a weapon, not a move.)
  // v10c: the emotes are gone. Every button here now changes the fight.
  // v10k: THE COMMAND DESK. Only FINISHER does anything by itself. The
  // rest are ORDERS - named by what the captain wants, not by which room
  // does it - and they light up the room that has to carry them out.
  const DESK = [
    ["TURN LEFT", "FORWARD", "BACK", "TURN RIGHT"],
    ["MELEE ATTACK", "RANGED ATTACK", "SHIELD UP", "STOMP", "BLIND"],
    ["POWER LEGS", "POWER ARMS", "POWER SHIELD", "POWER FINISHER"],
    ["FINISHER"],
  ];
  const DESK_KIND = {
    "TURN LEFT": "nav", FORWARD: "nav", BACK: "nav", "TURN RIGHT": "nav",
    "MELEE ATTACK": "fight", "RANGED ATTACK": "fight", "SHIELD UP": "fight", STOMP: "fight", BLIND: "fight",
    "POWER LEGS": "power", "POWER ARMS": "power", "POWER SHIELD": "power", "POWER FINISHER": "power",
    FINISHER: "fin",
  };
  const DESK_COLOR = { nav: "#1d4a6b", fight: "#5c1f40", power: "#5a4712", fin: "#6b1a5a" };
  const DESK_LIT = "#2fd08a";
  // wallZ is the inside face of the visor wall, sill is how high above
  // the floor the window starts. v10c: the console leans back from the
  // floor and stops exactly at the sill, so there is no slope to walk
  // up and no gap behind it to fall into.
  function desk(body, def, R, wallZ, floorY, sill) {
    const G = 0.04, BH = DESK.length > 3 ? 0.3 : DESK.length > 1 ? 0.36 : 0.92, W = 11.0;   // v10r: wall to wall
    const H = DESK.length * BH + (DESK.length + 1) * G;
    const PL = H + 0.2;                       // panel length, bottom to top
    const rise = Math.min(PL * 0.98, sill);   // it ends where the glass starts
    const lean = Math.acos(rise / PL) * 180 / Math.PI;  // degrees off upright
    const run = Math.sqrt(PL * PL - rise * rise);
    const zTop = wallZ - 0.05, zBot = zTop - run;
    // the leaning face, hinged at the floor
    const d = group({ y: floorY + rise / 2, z: (zTop + zBot) / 2, ry: 180 }, body);
    const tilt = group({ rx: -lean }, d);
    // side cheeks seal the wedge behind the console so nobody can walk in
    [-1, 1].forEach((sx) => box(body, sx * (W / 2 + 0.2), floorY + rise / 2, (zTop + zBot) / 2,
      0.3, rise, run + 0.1, def.frame, { collide: "true" }));
    box(body, 0, floorY + 0.06, zBot + 0.12, W + 0.8, 0.12, 0.3, def.frame, { collide: "true" });
    box(tilt, 0, 0, -0.08, W + 0.2, H + 0.2, 0.12, "#101018", { collide: "true" });
    const out = {};
    DESK.forEach((row, r) => {
      const BW = (W - (row.length + 1) * G) / row.length;
      row.forEach((name, c) => {
        const base = DESK_COLOR[DESK_KIND[name]];
        const x = -W / 2 + G + BW / 2 + c * (BW + G);
        const y = H / 2 - G - BH / 2 - r * (BH + G);
        const cap = box(tilt, x, y, 0.06, BW, BH, 0.16, base, { collide: "true" });
        const face = el("m-label", {
          z: 0.085, width: BW - 0.06, height: BH - 0.08,
          "font-size": fitFS(BW - 0.06, BH - 0.08, Math.max(6, name.length)), alignment: "center",
          color: base, "font-color": "#ffffff", content: name, collide: "true",
        }, cap);
        const B = { cap: cap, face: face, base: base, lit: false, cur: base };
        const paint = (col) => { setColor(cap, col); face.setAttribute("color", col); };
        // show() is what the order system calls; a press flash forgets
        // the cached colour so the next pass repaints it properly
        B.show = (col) => { if (B.cur === col) return; B.cur = col; paint(col); };
        B.setLit = (on) => { B.lit = on; B.show(on ? DESK_LIT : base); };
        let last = 0;
        const hit = (e) => {
          const now = Date.now();
          if (!isCaptain(R, e)) {
            paint("#550000"); B.cur = null;
            return say(R, "ONLY THE CAPTAIN CAN USE THE DESK");
          }
          if (now - last < 250) return;
          last = now;
          paint("#ffffff"); B.cur = null;
          deskPress(R, name);
        };
        cap.addEventListener("click", hit);
        face.addEventListener("click", hit);
        out[name] = B;
      });
    });
    return out;
  }

  // ==========================================================
  // ORDERS (v10k) - the captain calls it, the crew does it
  // ==========================================================
  // An order has no effect of its own. v10q: there is NO time limit.
  //   pressed  -> the button goes RED, and so does the room that has to
  //               do it: its alarm bar, the plate(s) to stand on, and the
  //               top line of its screen holding the order
  //   followed -> the button goes GREEN and STAYS green; the room flashes
  //               green with DONE for a moment, then goes back to normal
  //   pressing any order (even the same one again) erases the last one
  //   and starts the new one red. One order at a time.
  const ORDER_DONE_FLASH_MS = 1600;
  const ORDER_RED = "#c0182b", ORDER_ROOM_RED = "#ff2d3d";
  // v10w: the fire-alarm light in each room. ON is written raw (it skips
  // the LIGHT scaling in el()), so this is the real intensity: as close
  // to 0 as still shows. Raise it a notch (0.2, 0.3) if nobody sees it.
  const ORDER_LAMP_ON = 0.2, ORDER_LAMP_COL = "#ff0000", ORDER_LAMP_MS = 500;
  // v10x: steady green for this long once the room obeys
  const ORDER_LAMP_DONE_COL = "#00ff00", ORDER_LAMP_DONE_MS = 1200, ORDER_LAMP_DONE_ON = 0.1;
  function orderLamp(R, k, p, x, y, z, dist) {
    R.lamps = R.lamps || {};
    R.lamps[k] = el("m-light", { x: x, y: y, z: z, type: "point", intensity: 0, distance: dist, color: ORDER_LAMP_COL }, p);
  }
  // v10z: the reactor column's colour while a power order is live or just
  // obeyed, on the same beat as the lamps; null means leave it alone
  const CORE_ORDER_ON = "#ff1a1a", CORE_ORDER_OFF = "#3a0008", CORE_ORDER_DONE = "#00ff00";
  function coreOrderColor(R, now) {
    if (R.down) return null;
    if (R.order) {
      if (ORDER[R.order.name].rooms.indexOf("hall") < 0) return null;
      return Math.floor(now / ORDER_LAMP_MS) % 2 === 0 ? CORE_ORDER_ON : CORE_ORDER_OFF;
    }
    const D = R.orderDone;
    if (D && D.doneAt && now - D.doneAt < ORDER_LAMP_DONE_MS && ORDER[D.name].rooms.indexOf("hall") >= 0) return CORE_ORDER_DONE;
    return null;
  }
  // v11a: a skin over one room's screen wall that can flash. Laid just in
  // front of the lining (lining face = room edge - 0.075), same holes.
  function alarmWall(R, k, p, axis, pos, u0, u1, v0, v1, holes, base) {
    R.walls = R.walls || {};
    R.walls[k] = { nodes: holed(p, axis, pos, u0, u1, v0, v1, 0.02, base, holes), base: base };
  }
  // blinks red in the rooms the live order is for; v10x: holds green in
  // the rooms that just obeyed; everything else dark
  function paintOrderLamps(R, now) {
    if (!R.lamps) return;
    const blinkOn = !!R.order && !R.down && Math.floor(now / ORDER_LAMP_MS) % 2 === 0;
    const rooms = R.order ? ORDER[R.order.name].rooms : [];
    const D = R.orderDone;
    const green = !R.order && D && D.doneAt && now - D.doneAt < ORDER_LAMP_DONE_MS ? ORDER[D.name].rooms : [];
    // v11a: the walls follow the same beat
    Object.keys(R.walls || {}).forEach((k) => {
      const W = R.walls[k];
      const c = green.indexOf(k) >= 0 ? ORDER_LAMP_DONE_COL
        : rooms.indexOf(k) >= 0 && blinkOn ? ORDER_ROOM_RED : W.base;
      if (W._c === c) return;
      W._c = c;
      W.nodes.forEach((n) => setColor(n, c));
    });
    Object.keys(R.lamps).forEach((k) => {
      const L = R.lamps[k];
      let v = 0, c = L._c || ORDER_LAMP_COL;
      if (green.indexOf(k) >= 0) { v = ORDER_LAMP_DONE_ON; c = ORDER_LAMP_DONE_COL; }
      else if (rooms.indexOf(k) >= 0) { c = ORDER_LAMP_COL; if (blinkOn) v = ORDER_LAMP_ON; }
      if (L._c !== c) { L._c = c; L.setAttribute("color", c); }
      if (L._i === v) return;
      L._i = v;
      L.setAttribute("intensity", String(v));
    });
  }
  const ORDER = {
    "MELEE ATTACK": { rooms: ["larm", "rarm"], plates: ["lwind", "rwind", "lpunch", "rpunch"],
      text: "MELEE! PULL BACK, THEN HIT", done: (R) => R.arm.L.throwing || R.arm.R.throwing },
    "SHIELD UP": { rooms: ["larm"], plates: ["shield"],
      text: "SHIELD UP! STAND ON SHIELD", done: (R) => R.shieldUp },
    "STOMP": { rooms: ["lleg", "rleg"], plates: ["ljump", "rjump"],
      text: "STOMP! BOTH ON STOMP", done: (R) => R.jumping },
    "TURN LEFT": { rooms: ["hip"], plates: ["turnL"],
      text: "TURN LEFT! STAND ON TURN L", done: (R) => occupied(R.st.turnL) && !occupied(R.st.turnR) },
    "TURN RIGHT": { rooms: ["hip"], plates: ["turnR"],
      text: "TURN RIGHT! STAND ON TURN R", done: (R) => occupied(R.st.turnR) && !occupied(R.st.turnL) },
    // any forward step counts - a walk or a dash
    "FORWARD": { rooms: ["lleg", "rleg"], plates: ["lfwd", "rfwd"],
      text: "FORWARD! STEP ON FWD", done: (R, o) => (R.lastFwdAt || 0) >= o.at },
    // v10u: its own order, so the right arm sees the WIND SLASH plate lit
    "RANGED ATTACK": { rooms: ["rarm"], plates: ["rwind", "rextra"],
      text: "RANGED! PULL BACK, THEN WIND SLASH", done: (R, o) => (R.wsFiredAt || 0) >= o.at },
    // v10t: step back - either leg crew stepping on BACK in turn
    "BACK": { rooms: ["lleg", "rleg"], plates: ["lback", "rback"],
      text: "BACK! STEP ON BACK", done: (R, o) => (R.lastBackAt || 0) >= o.at },
    // v10s: the waist fires the visor flash. Followed once it goes off,
    // hit or miss - the waist did what they were told.
    "BLIND": { rooms: ["hip"], plates: ["blind"],
      text: "BLIND THEM! STEP ON BLIND", done: (R, o) => (R.blindFiredAt || 0) >= o.at },
    // v10r: power orders - the power room is told which plate to hold.
    // Followed once that plate alone is manned and the power is flowing.
    "POWER LEGS": { rooms: ["hall"], plates: ["route.legs"],
      text: "POWER TO LEGS! STAND ON LEGS", done: (R) => R.route === "legs" },
    "POWER ARMS": { rooms: ["hall"], plates: ["route.arms"],
      text: "POWER TO ARMS! STAND ON ARMS", done: (R) => R.route === "arms" },
    "POWER SHIELD": { rooms: ["hall"], plates: ["route.shield"],
      text: "POWER TO SHIELD! STAND ON SHIELD", done: (R) => R.route === "shield" },
    "POWER FINISHER": { rooms: ["hall"], plates: ["route.fin"],
      text: "CHARGE FINISHER! STAND ON FINISHER", done: (R) => R.route === "fin" },
  };
  function orderPlate(R, k) {
    return k.indexOf("route.") === 0 ? (R.st.route || {})[k.slice(6)] : R.st[k];
  }
  function restorePlate(P) {
    if (!P) return;
    if (P.paint) P.paint();
    if (P.strip) setColor(P.strip, P.stripCol);
  }
  // true, or the reason the crew couldn't do it right now anyway
  function orderReady(R, name, now) {
    if (name === "SHIELD UP") {
      if (R.shieldUp) return "SHIELD IS ALREADY UP";
      if (now < R.shieldLockUntil) return "SHIELD RECHARGING " + secs(R.shieldLockUntil - now);
    }
    if (name === "BLIND" && now < R.blindReadyAt) return "FLASH RECHARGING " + secs(R.blindReadyAt - now);
    if (name === "RANGED ATTACK" && now < R.wsReadyAt) return "WIND SLASH READY IN " + secs(R.wsReadyAt - now);
    if (name === "STOMP") {
      if (R.jumping) return "ALREADY STOMPING";
      if (now < R.jumpReadyAt) return "STOMP RECHARGING " + secs(R.jumpReadyAt - now);
    }
    return true;
  }
  const orderLive = () => phase === "LIVE" || phase === "IDLE";
  function orderScreens(R, name) {
    return ORDER[name].rooms.map((k) => R.scr[k]).filter(Boolean);
  }
  function lockScreens(R, name, text) {
    orderScreens(R, name).forEach((scr) => { scr[0]._lock = text; setText(scr[0], text); });
  }
  function clearOrderVisuals(R, name) {
    orderScreens(R, name).forEach((scr) => {
      delete scr[0]._lock;
      if (scr.alarm) { scr.alarm._order = false; setColor(scr.alarm, ALARM_OFF); }
    });
    ORDER[name].plates.forEach((k) => restorePlate(orderPlate(R, k)));
  }
  function issueOrder(R, name) {
    const now = Date.now();
    if (!orderLive() || R.down) return;
    // erase whatever was there before: a live order, or a green one
    if (R.order) clearOrderVisuals(R, R.order.name);
    if (R.orderDone) { if (R.orderDone.flashUntil > now) clearOrderVisuals(R, R.orderDone.name); R.orderDone = null; }
    R.order = { name: name, at: now };
    lockScreens(R, name, orderText(R, name, now));
  }
  // what the ordered room reads: the instruction, or why it has to wait
  function orderText(R, name, now) {
    const ok = orderReady(R, name, now);
    return ok === true || /ALREADY/.test(ok) ? ORDER[name].text : ok;
  }
  function finishOrder(R) {
    const o = R.order, now = Date.now();
    R.order = null;
    R.orderStats = R.orderStats || { ok: 0 };
    R.orderStats.ok++;
    R.orderDone = { name: o.name, took: now - o.at, flashUntil: now + ORDER_DONE_FLASH_MS, doneAt: now };
    lockScreens(R, o.name, "DONE - NICE WORK!");
    ORDER[o.name].plates.forEach((k) => restorePlate(orderPlate(R, k)));
  }
  // runs with the boards, four times a second
  function orderTick(R, now) {
    // a round ending or the robot going down wipes the order, no score
    if (R.order && (R.down || !orderLive())) { clearOrderVisuals(R, R.order.name); R.order = null; }
    if (R.order && ORDER[R.order.name].done(R, R.order)) finishOrder(R);
    const D = R.orderDone;
    if (D && D.flashUntil && now >= D.flashUntil) { clearOrderVisuals(R, D.name); D.flashUntil = 0; }
    paintOrderLamps(R, now);   // v10w

    const threat = coilThreat(enemyOf(R));
    const loud = threat && threat.level === 2;   // an incoming super or finisher still wins the bar
    if (R.order) {
      const txt = orderText(R, R.order.name, now);
      orderScreens(R, R.order.name).forEach((scr) => {
        // the warning gets the screen back while it lasts
        if (loud) delete scr[0]._lock;
        else if (scr[0]._lock !== txt) { scr[0]._lock = txt; setText(scr[0], txt); }
        if (!scr.alarm) return;
        scr.alarm._order = !loud;
        if (!loud) setColor(scr.alarm, ORDER_ROOM_RED);
      });
      ORDER[R.order.name].plates.forEach((k) => {
        const P = orderPlate(R, k);
        if (!P || !P.paint) return;
        if (P.on.size) P.paint();
        else setColor(P.base, ORDER_ROOM_RED);
        if (P.strip) setColor(P.strip, ORDER_ROOM_RED);
      });
    } else if (D && D.flashUntil) {
      orderScreens(R, D.name).forEach((scr) => {
        if (!scr.alarm) return;
        scr.alarm._order = !loud;
        if (!loud) setColor(scr.alarm, DESK_LIT);
      });
    }
    // the desk: red while waiting, green once followed, until the next press
    if (!R.desk) return;
    Object.keys(R.desk).forEach((name) => {
      const B = R.desk[name];
      let c = B.base;
      if (name === "FINISHER") {
        if (R.syncUntil) c = "#ffffff";
        else if (R.fin >= 1 && now >= R.finReadyAt) c = DESK_LIT;
      } else if (R.order && R.order.name === name) c = ORDER_RED;
      else if (D && D.name === name) c = DESK_LIT;
      B.show(c);
    });
  }


  // ==========================================================
  // THE LIFT (v7) - rides on each robot's back
  // ==========================================================
  function buildLift(root, def) {
    const hatchZ = SPINE.cz - SPINE.d / 2;
    const TX = BOARD_X, SH = 8, TZ = hatchZ - 4.5 - SH / 2;
    const TOP = HATCH_Y;
    const g = group({}, root);
    const T = {};
    const ty0 = 0, ty1 = TOP + 5;
    const sx0 = TX - SH / 2, sx1 = TX + SH / 2, sz0 = TZ - SH / 2, sz1 = TZ + SH / 2;
    const glassO = { opacity: 0.16, collide: "true" };
    holed(g, "z", sz1, sx0, sx1, ty0, ty1, 0.2, GLASS, [[TX - 1.9, TX + 1.9, TOP, TOP + 3.6]], glassO);
    holed(g, "z", sz0, sx0, sx1, ty0, ty1, 0.2, GLASS, [[TX - 2.6, TX + 2.6, 0, 3.8]], glassO);
    holed(g, "x", sx0, sz0, sz1, ty0, ty1, 0.2, GLASS, [], glassO);
    holed(g, "x", sx1, sz0, sz1, ty0, ty1, 0.2, GLASS, [], glassO);
    box(g, TX, ty1 + 0.3, TZ, SH + 1, 0.6, SH + 1, def.main, { collide: "true" });
    [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([a, b]) =>
      box(g, TX + a * SH / 2, ty1 / 2, TZ + b * SH / 2, 0.8, ty1, 0.8, def.frame));
    for (let y = 6; y < ty1; y += 7) box(g, TX, y, TZ, SH + 0.6, 0.3, SH + 0.6, def.team_lit, { opacity: 0.5 });
    label(g, def.name, { x: TX, y: 6, z: sz0 - 0.2, ry: 180, width: 7.5, height: 1.4, "font-color": def.team_lit }, 8);
    label(g, "LIFT", { x: TX, y: 4.5, z: sz0 - 0.2, ry: 180, width: 4, height: 0.9, "font-color": GOLD }, 4);
    el("m-light", { x: TX, y: TOP + 3, z: TZ, type: "point", intensity: 10, distance: 16, color: def.team_lit }, g);

    T.car = box(g, TX, 0.25, TZ, SH - 0.6, 0.5, SH - 0.6, def.frame, { collide: "true" });
    box(T.car, 0, 0.26, 0, SH - 1.2, 0.02, SH - 1.2, def.team_lit);
    lerp(T.car, "y", LIFT_MS, "easeInOutQuad");
    T.botDoor = box(g, TX, 1.9, sz0, 5.2, 3.8, 0.25, def.team_lit, { opacity: 0.35, collide: "true" });
    T.topDoor = box(g, TX, TOP + 1.8, sz1, 3.8, 3.6, 0.25, def.team_lit, { opacity: 0.35, collide: "true" });
    const BZ = (sz1 + hatchZ) / 2, BL = hatchZ - sz1 + 1.2;
    const keep = new Set();
    keep.add(box(g, TX, TOP - 0.25, BZ, 3.6, 0.5, BL, def.frame, { collide: "true" }));
    [-1, 1].forEach((s) => keep.add(box(g, TX + s * 1.75, TOP + 0.55, BZ, 0.1, 1.1, BL - 0.6, GLASS, { opacity: 0.25, collide: "true" })));
    box(g, TX, TOP + 0.02, BZ, 1.2, 0.04, BL, def.team_lit);

    // The whole lift vanishes while the robot moves. If nobody is in
    // the shaft its walls, doors and car stop being solid too, so an
    // invisible lift never sweeps through people on the ground. With
    // riders inside it stays solid (just unseen) so they are carried
    // safely. The little bridge into the hatch always stays solid.
    T.solids = [];
    // (children is an HTMLCollection in a real DOM - no forEach on it)
    Array.from(g.children).forEach((n) => {
      if (!keep.has(n) && n.getAttribute && n.getAttribute("collide") === "true") T.solids.push(n);
    });
    T.hidden = false;
    T.solidOn = true;
    T.update = (hide, riders) => {
      if (hide !== T.hidden) {
        T.hidden = hide;
        g.setAttribute("visible", hide ? "false" : "true");
      }
      const solid = !hide || riders;
      if (solid !== T.solidOn) {
        T.solidOn = solid;
        T.solids.forEach((n) => n.setAttribute("collide", solid ? "true" : "false"));
      }
    };

    // Doors stay open at least LIFT_MIN_OPEN_MS. After that the car
    // leaves once somebody has been inside LIFT_GO_MS (bottom) or it
    // has been empty LIFT_GO_MS (top), or at the longest wait.
    // Standing in a doorway holds the doors, up to LIFT_HOLD_MS.
    // Signs over the doors count down.
    T.riders = () => 0;
    T.crew = () => [];
    const CAR = { x0: TX - SH / 2 + 0.3, x1: TX + SH / 2 - 0.3, z0: TZ - SH / 2 + 0.3, z1: TZ + SH / 2 - 0.3 };
    T.inCar = (p, top) => {
      const fy = top ? TOP : 0.5;
      return p.x > CAR.x0 && p.x < CAR.x1 && p.z > CAR.z0 && p.z < CAR.z1 && p.y > fy - 1.5 && p.y < fy + 4;
    };
    const inDoor = (p, top) => top
      ? Math.abs(p.x - TX) < 2.5 && p.z > sz1 - 1.2 && p.z < hatchZ + 0.5 && p.y > TOP - 1.5 && p.y < TOP + 4
      : Math.abs(p.x - TX) < 3.2 && p.z > sz0 - 2 && p.z < sz0 + 1.2 && p.y > -1.5 && p.y < 4;
    const doorBusy = (top) => T.crew().some((p) => inDoor(p, top));
    // status signs: over each door, inside and out
    const signO = (o) => label(g, "", withO({ width: 5.4, height: 0.7, color: "#07070c", "font-color": GOLD }, o), 18);
    T.signs = {
      bot: [signO({ x: TX, y: 4.3, z: sz0 + 0.2 }), signO({ x: TX, y: 7.4, z: sz0 - 0.2, ry: 180 })],
      top: [signO({ x: TX, y: TOP + 4.25, z: sz1 - 0.2, ry: 180 }), signO({ x: TX, y: TOP + 4.25, z: sz1 + 0.2 })],
    };
    const show = (which, t) => { T.signs.bot.concat(T.signs.top).forEach((n) => setText(n, "")); T.signs[which].forEach((n) => setText(n, t)); };
    const POLL = 250;
    const goUp = () => {
      T.botDoor.setAttribute("y", "1.9");
      set(T.car, { y: TOP - 0.25 });
      show("top", "LIFT COMING UP");
      T.signs.bot.forEach((n) => setText(n, "GOING UP"));
      setTimeout(() => {
        T.topDoor.setAttribute("y", "-50");
        waitTop(Date.now(), 0);
      }, LIFT_MS);
    };
    // v11o: the leaving time only ever comes EARLIER, never later, so the
    // countdown can't jump back up. Before, the timer switched rules the
    // moment somebody stepped in ("4, 3..." became "3, 2, 1" again), and
    // every blip in whether someone was seen inside restarted it.
    const goDown = () => {
      T.topDoor.setAttribute("y", String(TOP + 1.8));
      set(T.car, { y: 0.25 });
      show("bot", "LIFT COMING DOWN");
      T.signs.top.forEach((n) => setText(n, "GOING DOWN"));
      setTimeout(() => {
        T.botDoor.setAttribute("y", "-50");
        waitBottom(Date.now(), 0);
      }, LIFT_MS);
    };
    const secsLeft = (ms) => Math.max(1, Math.ceil(ms / 1000));
    const waitBottom = (opened, departAt) => {
      const now = Date.now(), t = now - opened;
      if (!departAt) departAt = opened + LIFT_WAIT_MS;
      // somebody aboard: leave LIFT_GO_MS from now (never before the doors'
      // minimum) - but only if that is SOONER than the time already shown
      if (T.riders(false) > 0) departAt = Math.min(departAt, Math.max(opened + LIFT_MIN_OPEN_MS, now + LIFT_GO_MS));
      if (t >= LIFT_MIN_OPEN_MS && doorBusy(false) && t < LIFT_HOLD_MS) {
        show("bot", "STEP CLEAR OF THE DOOR");
        return setTimeout(() => waitBottom(opened, departAt), POLL);
      }
      if (now >= departAt) return goUp();
      show("bot", "GOING UP IN " + secsLeft(departAt - now));
      setTimeout(() => waitBottom(opened, departAt), POLL);
    };
    const waitTop = (opened, departAt) => {
      const now = Date.now(), t = now - opened;
      if (!departAt) departAt = opened + LIFT_TOP_MS;
      // car empty: go back down LIFT_GO_MS from now - only if that is sooner
      if (T.riders(true) === 0) departAt = Math.min(departAt, Math.max(opened + LIFT_MIN_OPEN_MS, now + LIFT_GO_MS));
      if (t >= LIFT_MIN_OPEN_MS && doorBusy(true) && t < LIFT_HOLD_MS) {
        show("top", "STEP CLEAR OF THE DOOR");
        return setTimeout(() => waitTop(opened, departAt), POLL);
      }
      if (now >= departAt) return goDown();
      show("top", "GOING DOWN IN " + secsLeft(departAt - now));
      setTimeout(() => waitTop(opened, departAt), POLL);
    };
    T.botDoor.setAttribute("y", "-50");
    waitBottom(Date.now(), 0);
    return T;
  }

  // ==========================================================
  // THE FIELD (v8) - sumo on a big painted floor
  // ==========================================================
  // Centred on the document origin, where the robots start either
  // side of. A red band outside the OUT line, orange posts on it,
  // a centre circle and a score board floating over the middle,
  // readable from every side.
  const D2R_F = Math.PI / 180;
  const field = (function buildField() {
    const F = {};
    const g = group({});
    const HAZ = "#ff9a1f";
    cyl(g, 0, -0.04, 0, FIELD_R, 0.08, "#5a1020");               // out band, top 0.00
    cyl(g, 0, 0.01, 0, OUT_R, 0.1, "#1e1840");                   // in bounds, top 0.06
    // the OUT line: a stripe and posts
    const SEG = 120;
    const segW = (2 * Math.PI * OUT_R) / SEG + 0.3;
    for (let i = 0; i < SEG; i++) {
      const a = (i / SEG) * Math.PI * 2;
      box(g, OUT_R * Math.sin(a), 0.1, OUT_R * Math.cos(a), segW, 0.06, 3, i % 2 ? HAZ : "#ffe14d",
        { ry: a / D2R_F });
    }
    for (let i = 0; i < FIELD_POSTS; i++) {
      const a = (i / FIELD_POSTS) * Math.PI * 2;
      const x = (OUT_R + 2) * Math.sin(a), z = (OUT_R + 2) * Math.cos(a);
      box(g, x, 6, z, 1.4, 12, 1.4, HAZ, { ry: a / D2R_F });
      box(g, x, 12.4, z, 1.8, 0.8, 1.8, "#ffffff");
    }
    // guide rings, so crews can judge where they are
    [80, 160].forEach((r) => {
      const n = Math.round(r / 4);
      const w = (2 * Math.PI * r) / n * 0.55;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        box(g, r * Math.sin(a), 0.08, r * Math.cos(a), w, 0.04, 0.8, "#4a3f8a", { ry: a / D2R_F });
      }
    });
    // the edge-warning ring
    {
      const r = OUT_R - EDGE_WARN, n = 90, w = (2 * Math.PI * r) / n * 0.5;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        box(g, r * Math.sin(a), 0.08, r * Math.cos(a), w, 0.04, 1.2, "#8a4a1a", { ry: a / D2R_F });
      }
    }
    cyl(g, 0, 0.07, 0, 20, 0.04, GOLD, { opacity: 0.25 });
    cyl(g, 0, 0.08, 0, 18.5, 0.04, "#1e1840");
    // start lines in team colours
    ROBOTS.forEach((def, i) => {
      const z = (i === 0 ? -1 : 1) * SPAWN_Z;
      box(g, 0, 0.09, z, 40, 0.04, 1.5, def.team_lit);
    });
    // the board over the centre
    F.title = []; F.score = []; F.info = [];
    [0, 90, 180, 270].forEach((ry) => {
      const f = group({ y: 110, ry: ry }, g);
      box(f, 0, 0, -1.6, 40, 16, 0.3, PANEL);
      F.title.push(label(f, "TITANS", { y: 5, z: -1.4, width: 36, height: 4, "font-color": GOLD }, 16));
      F.score.push(label(f, "", { y: 0, z: -1.4, width: 38, height: 4, "font-color": INK }, 24));
      F.info.push(label(f, "", { y: -5, z: -1.4, width: 38, height: 3, "font-color": INK }, 40));
    });
    F.text = (t, sc, inf) => {
      F.title.forEach((n) => setText(n, t));
      F.score.forEach((n) => setText(n, sc));
      F.info.forEach((n) => setText(n, inf));
    };
    return F;
  })();

  // ==========================================================
  // SWORD AND SHIELD - a sword in the right hand, a shield on the
  // left forearm
  // ==========================================================
  // Both hang off the elbow joint, in real metres. The fist sits at
  // about y -18.3 in that frame and the forearm points down -y, so
  // the blade carries straight on from the arm: wherever the fist
  // points, the sword points, 30m further.
  const STEEL = "#c9d3de", STEEL_DK = "#7d8896";
  function swordCharge(c) {
    // winding the sword arm draws the blade back over the right shoulder
    return {
      rx: -35 + (SWORD_WIND.rx + 35) * c,
      rz: ARM_FLARE + (SWORD_WIND.rz - ARM_FLARE) * c,
      erx: -95 + (SWORD_WIND.erx + 95) * c,
    };
  }
  function buildSword(elbow, def, heavy, glowList) {
    // a broad greatsword: 30m blade, 8m wide, crossguard 20m across
    const L = SWORD_LEN, bw = heavy ? 8.5 : 7.5, bt = heavy ? 1.8 : 1.5;
    const y0 = -20.3;                                                    // crossguard
    const gw = heavy ? 22 : 19;
    box(elbow, 0, y0, 0, 3, 2.5, gw, def.trim);
    [-1, 1].forEach((s) => box(elbow, 0, y0 - 1.6, s * (gw / 2 - 0.6), 2.6, 5, 2.6, def.trim, { rx: s * 22 }));
    box(elbow, 0, y0, 0, 3.6, 3.4, 3.4, def.glow, { rx: 45 });           // gem
    [-1, 1].forEach((s) => box(elbow, 0, y0, s * (gw / 2 - 3), 3.2, 1.2, 3, def.lit));
    const yb0 = y0 - 1.25, yc = yb0 - L / 2;
    box(elbow, 0, yc, 0, bt, L, bw, STEEL);                              // blade
    box(elbow, 0, yc + 0.5, 0, bt + 0.1, L - 3, bw * 0.26, STEEL_DK);    // fuller
    [-1, 1].forEach((s) => glowList.push(box(elbow, s * (bt / 2 + 0.1), yc + 1, 0, 0.1, L - 7, 0.8, def.glow)));
    [-1, 1].forEach((e) => box(elbow, 0, yc, e * (bw / 2 - 0.1), bt * 0.45, L, 0.5, "#ffffff"));   // edges
    box(elbow, 0, yb0 - 2.5, 0, bt + 0.12, 5, bw + 0.4, def.dark);      // collar under the guard
    const d = bw / Math.SQRT2;
    box(elbow, 0, yb0 - L, 0, bt, d, d, STEEL, { rx: 45 });             // point
    // v10n: glow accents to match the shield. On both faces of the blade:
    [-1, 1].forEach((sx) => {
      const fx = sx * (bt / 2 + 0.06);
      // always lit: an inlay along the crossguard and a diamond near the tip
      box(elbow, sx * 1.55, y0, 0, 0.1, 0.8, gw - 4, def.glow);
      box(elbow, fx, yb0 - L + 3.2, 0, 0.1, 1.7, 1.7, def.glow, { rx: 45 });
      // lit with the arm's power: lines inside both edges...
      [-1, 1].forEach((e) => glowList.push(
        box(elbow, fx, yc + 1.5, e * (bw / 2 - 0.95), 0.1, L - 6, 0.3, def.glow)));
      // ...and chevrons down the fuller, pointing at the tip
      for (let i = 0; i < 4; i++) {
        const cy = yb0 - 5 - i * ((L - 10) / 3);
        [-1, 1].forEach((e) => glowList.push(
          box(elbow, sx * (bt / 2 + 0.12), cy + 0.45, e * 0.7, 0.1, 0.3, 1.7, def.glow, { rx: -e * 32.7 })));
      }
    });
  }
  // Where the sword point ends up (height above the feet) for an arm
  // pose - the same rotations armTo uses.
  function swordTipY(q) {
    const r = Math.PI / 180;
    const a = (q.rx === undefined ? 0 : q.rx) * r;
    const b = -(q.rz === undefined ? ARM_FLARE : q.rz) * r;
    const ea = (q.erx === undefined ? -12 : q.erx) * r;
    const eb = -(q.erz === undefined ? 0 : q.erz) * r;
    const ey = -5.6 * KA * Math.cos(b) * Math.cos(a);
    const D = SWORD_TIP_D;
    const ux = D * Math.sin(eb), uy = -D * Math.cos(eb) * Math.cos(ea), uz = -D * Math.cos(eb) * Math.sin(ea);
    const vy = ux * Math.sin(b) + uy * Math.cos(b);
    return SHOULDER.y + ey + vy * Math.cos(a) - uz * Math.sin(a);
  }
  // Any pose that would put the big blade in the ground bends the
  // elbow until it doesn't.
  function swordSafe(R, q) {
    const minY = SWORD_MIN_TIP + (R.down ? 7.3 : 0);
    const out = withO({}, q);
    let erx = out.erx === undefined ? -12 : out.erx;
    while (erx > -160 && swordTipY(withO(withO({}, out), { erx: erx })) < minY) erx -= 5;
    out.erx = erx;
    return out;
  }
  // v10m: THE SHIELD, rebuilt. v10d's shield used raw numbers inside an
  // arm that is scaled x2.8, so it sat buried in the forearm and nobody
  // could see it. This one is sized for a 75m robot and strapped to the
  // OUTSIDE of the left forearm. Its face is the group's +z.
  //   stowed: turned to face out to the side, like a shield carried low
  //   raised / bashing: the group is turned to cancel the whole arm's
  //   rotation (shieldFacing), so the face points dead ahead whatever

  const OG_ASPECT = 0.8344;   // width / height
  function buildHandShield(elbow, def, heavy, glowList) {
    // v10n: a proper knight's shield - long, white steel like the sword,
    // with a raised rim, a ridged cross and a big boss. Heater shape: a
    // tall slab that ends in a 45 degree point (one turned square).
    const H = heavy ? 35 : 32, W = heavy ? 15.5 : 14, T = 1.8;
    const WHITE = "#ffffff", PALE = "#e6ebf1";
    const out = (heavy ? 3.4 : 3.0) * KAW / 2 + 1.0;   // just clear of the forearm
    const g = group({ x: out, y: -9, z: 0, ry: 90 }, elbow);
    const half = W / 2;
    const yJoin = -H / 2 + half;                        // where the point starts
    const slabH = H / 2 - yJoin;
    const side = W / Math.SQRT2;
    // the body: slab + point
    box(g, 0, yJoin + slabH / 2, 0, W, slabH, T, STEEL);
    box(g, 0, yJoin, 0, side, side, T, STEEL, { rz: 45 });
    // a raised inner field, a step proud of the body
    const fz = T / 2 + 0.25;
    box(g, 0, yJoin + (slabH - 2.4) / 2 + 0.4, fz, W - 3.0, slabH - 2.4, 0.5, PALE);
    box(g, 0, yJoin, fz, side - 2.1, side - 2.1, 0.5, PALE, { rz: 45 });
    // the rim: white, standing well proud, round the whole outline
    const rz_ = T / 2 + 0.55, rw = 1.0;
    box(g, 0, H / 2 - rw / 2, rz_, W + 0.4, rw, 1.1, WHITE);
    [-1, 1].forEach((sx) => {
      box(g, sx * (half - rw / 2 + 0.2), yJoin + slabH / 2, rz_, rw, slabH, 1.1, WHITE);
      box(g, sx * half / 2, yJoin - half / 2, rz_, rw, side + 0.4, 1.1, WHITE, { rz: -sx * 45 });
    });
    // v11d: THE OG LOGO fills the field where the ridged cross and boss
    // used to be, in the team's colour. The gem moves down to the point.
    const yX = yJoin + slabH * 0.62;                     // (straps still hang here)
    const yTop = H / 2 - 3.8, yBot = yJoin + 2.6;       // between the two team bands
    let lh = yTop - yBot, lw = lh * OG_ASPECT;
    if (lw > W - 3.6) { lw = W - 3.6; lh = lw / OG_ASPECT; }
    ghostEl("m-image", { src: OG_LOGO[def.main] || OG_LOGO["#b3122a"], x: 0, y: (yTop + yBot) / 2, z: fz + 0.28,
      width: lw, height: lh, collide: "false" }, g);
    const yGem = yJoin - half * 0.35;
    box(g, 0, yGem, fz + 0.5, 3.4, 3.4, 0.8, STEEL_DK, { rz: 45 });
    box(g, 0, yGem, fz + 0.9, 2.4, 2.4, 0.6, def.trim, { rz: 45 });
    // flanges on the top corners
    [-1, 1].forEach((sx) => box(g, sx * (half - 0.6), H / 2 + 0.2, 0.3, 2.4, 2.4, T + 0.6, WHITE, { rz: 45 }));
    // team colour bands across the upper field
    box(g, 0, H / 2 - 3.0, fz + 0.3, W - 3.4, 1.1, 0.3, def.trim);
    box(g, 0, yJoin + 1.6, fz + 0.3, W - 5.0, 1.1, 0.3, def.trim);
    // straps on the back
    box(g, 0, yX, -T / 2 - 0.4, 1.8, 10, 0.8, def.dark);
    box(g, 0, yX - 3, -T / 2 - 0.4, 7, 1.6, 0.8, def.dark);
    // glow: a gem at the heart and lines inside the rim - lit when the
    // power room is holding SHIELD
    glowList.push(
      box(g, 0, yGem, fz + 1.3, 1.3, 1.3, 0.3, def.glow, { rz: 45 }),
      box(g, -(half - 2.0), yJoin + slabH / 2 + 0.6, fz + 0.3, 0.45, slabH - 5, 0.3, def.glow),
      box(g, half - 2.0, yJoin + slabH / 2 + 0.6, fz + 0.3, 0.45, slabH - 5, 0.3, def.glow),
      box(g, -half / 2 + 0.9, yJoin - half / 2 + 0.9, fz + 0.3, 0.45, side - 4, 0.3, def.glow, { rz: 45 }),
      box(g, half / 2 - 0.9, yJoin - half / 2 + 0.9, fz + 0.3, 0.45, side - 4, 0.3, def.glow, { rz: -45 }));
    return g;
  }

  // Raised: the upper arm comes forward (well clear of the chest) and
  // tucks in a little, the forearm rises in front. Checked against the
  // chest box so nothing passes through the body.
  const SHIELD_ARM = { rx: -55, rz: -12, erx: -75 };
  const SHIELD_STOWED = { rx: 0, ry: 90, rz: 0 };
  // rotation matrices for the arm chain (MML/three Euler order XYZ)
  function mRx(a) { const c = Math.cos(a), s = Math.sin(a); return [[1, 0, 0], [0, c, -s], [0, s, c]]; }
  function mRz(a) { const c = Math.cos(a), s = Math.sin(a); return [[c, -s, 0], [s, c, 0], [0, 0, 1]]; }
  function mMul(A, B) {
    return A.map((r) => [0, 1, 2].map((j) => r[0] * B[0][j] + r[1] * B[1][j] + r[2] * B[2][j]));
  }
  // the group rotation that points the shield face straight ahead
  // when the left arm is at shoulder (rx, rz) and elbow (erx, erz)
  function shieldFacing(srx, srz, erx, erz) {
    const M = mMul(mMul(mRx(srx * D2R_F), mRz(srz * D2R_F)), mMul(mRx(erx * D2R_F), mRz(erz * D2R_F)));
    const T = [[M[0][0], M[1][0], M[2][0]], [M[0][1], M[1][1], M[2][1]], [M[0][2], M[1][2], M[2][2]]];
    const ry = Math.asin(Math.max(-1, Math.min(1, T[0][2])));
    let rx, rz;
    if (Math.abs(T[0][2]) < 0.9999) { rx = Math.atan2(-T[1][2], T[2][2]); rz = Math.atan2(-T[0][1], T[0][0]); }
    else { rx = Math.atan2(T[2][1], T[1][1]); rz = 0; }
    return { rx: rx / D2R_F, ry: ry / D2R_F, rz: rz / D2R_F };
  }
  // v10p: the aegis snaps open from the shield with a burst of light
  function aegisRaise(R) {
    if (!R.aegis) return;
    set(R.aegis.g, { sx: 0.2, sy: 0.2, sz: 0.2 });
    glide(R.aegis.g, { sx: 1, sy: 1, sz: 1 }, 240, "out");
    const wr = worldPos(R), f = worldFwd(R);
    popWorld(R, wr.x + f.x * R.aegis.z, R.aegis.y, wr.z + f.z * R.aegis.z, 3, 14, R.def.glow, 340);   // v11j: was a 30m white ball
  }
  // ...and pulses when something hits it
  function aegisHit(E, big) {
    if (!E.aegis || !E.shieldUp) return;
    const now = Date.now();
    E.aegisHitUntil = now + 320;
    const fw = powered(E, "shield") ? 22 : 14;
    set(E.aegis.flare, { width: fw * (big ? 2.2 : 1.6) });   // v11j: was 4 / 2.6
    glide(E.aegis.flare, { width: fw }, 320, "out");
    E.aegis.fw = fw;
    E.aegis.bars.forEach((n) => setColor(n, mix(E.def.glow, "#ffffff", 0.6)));
    const wr = worldPos(E), f = worldFwd(E);
    // v11j: a smaller pulse (was 22m / 34m across). Otherside draws these
    // spheres solid, so a big one swallowed the whole view
    popWorld(E, wr.x + f.x * E.aegis.z, E.aegis.y, wr.z + f.z * E.aegis.z, 3, big ? 16 : 11, E.def.glow, 380);
  }
  // up = face the enemy; otherwise carried at the side
  function shieldPose(R, up) {
    if (R.arm && R.arm.L) R.arm.L.shown = null;   // the arm loop re-poses, and armTo turns the shield
    if (!up && R.shieldArt && !R.bashing) (SMOOTH_ARMS ? glide : tween)(R.shieldArt, SHIELD_STOWED, 260, "out");
  }

  // The tip's path through the swing (robot frame), worked out from
  // the three poses with the 30m blade: high right, over, down across
  // the front, low left.
  const TRAIL = [[-60, 108, 6], [-53, 115, 20], [-45, 111, 38], [-35, 102, 52], [-10, 68, 68], [9, 49, 63], [23, 32, 47]];
  const TRAIL_M = TRAIL[4];
  const TRAIL_HIT = 4;             // the point that matches the hit
  function trailSeg(R, p, q, strong) {
    const dx = q[0] - p[0], dy = q[1] - p[1], dz = q[2] - p[2];
    const L = Math.hypot(dx, dy, dz) || 1;
    const ux = dx / L, uy = dy / L, uz = dz / L;
    // turn a box's long (y) axis to point along the segment
    const rz = -Math.asin(clamp(ux, -1, 1)) / (Math.PI / 180);
    const rx = Math.atan2(uz, uy) / (Math.PI / 180);
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2, mz = (p[2] + q[2]) / 2;
    const parts = [
      box(R.root, mx, my, mz, 0.5, L + 0.6, 0.5, "#ffffff", { rx: rx, rz: rz, opacity: 0.95 }),
      box(R.root, mx, my, mz, strong ? 4 : 2.8, L + 0.6, 0.3, R.def.glow, { rx: rx, rz: rz, opacity: 0.45 }),
    ];
    parts.forEach((b) => {
      // v11h: no opacity fade - Otherside ignores opacity on shapes, so it only cost network writes
      setTimeout(() => { if (b.parentNode) b.parentNode.removeChild(b); }, 480);
    });
  }
  function swordSwing(R, strong) {
    armTo(R, "R", SWORD_WIND, SWING_WIND_MS, "out");
    setTimeout(() => armTo(R, "R", SWORD_MID, SWING_HIT_MS, "in"), SWING_WIND_MS);
    setTimeout(() => armTo(R, "R", SWORD_END, SWING_FOLLOW_MS, "out"), SWORD_HIT_AT);
    for (let i = 0; i < TRAIL.length - 1; i++) {
      const at = i < TRAIL_HIT
        ? SWING_WIND_MS + (SWING_HIT_MS * (i + 0.5)) / TRAIL_HIT
        : SWORD_HIT_AT + (SWING_FOLLOW_MS * (i - TRAIL_HIT + 0.5)) / (TRAIL.length - 1 - TRAIL_HIT);
      setTimeout(() => trailSeg(R, TRAIL[i], TRAIL[i + 1], strong), at);
    }
  }
  // the flash where the blade meets (or misses) something
  function slashFx(R, hit) {
    const [x, y, z] = TRAIL_M;
    pop(R.root, x, y, z, 1, hit ? 16 : 7, hit ? "#ffffff" : R.def.glow, hit ? 500 : 350);
    if (hit) pop(R.root, x, y, z, 1, 9, R.def.glow, 380);
  }

  // Show or hide an overlay group. Some clients don't hide an
  // m-group's children when the group itself is set invisible, so the
  // overlay is also moved far out of sight, and every child gets the
  // visible flag too.
  const PARK_Y = -2000;
  function showOverlay(g, on) {
    if (g._shown === on) return;
    g._shown = on;
    g.setAttribute("visible", on ? "true" : "false");
    g.setAttribute("y", String(on ? (g._homeY || 0) : PARK_Y));
    Array.from(g.children || []).forEach((n) => n.setAttribute && n.setAttribute("visible", on ? "true" : "false"));
  }
  function overlayGroup(p, y) {
    const g = group({ y: PARK_Y, visible: "false" }, p);
    g._homeY = y || 0;
    g._shown = false;
    return g;
  }

  // ==========================================================
  // HEALTH BOARDS AND MANUALS - one of each in every room
  // ==========================================================
  // A health board: a header line (round, clock, points), then our
  // armor bar, then theirs. They are all repainted together four
  // times a second by paintHp. A manual: a title and some lines of
  // plain instructions.
  const HP_BG = "#07070c";
  function hpPanel(R, p, o) {
    const W = o.width, H = o.height;
    const g = panelMount(p, o, W, H, R.def.frame);
    box(g, 0, 0, -0.02, W, H, 0.01, HP_BG);
    const rowH = H / 3;
    const P = { rows: [] };
    P.head = label(g, "", { y: H / 2 - rowH / 2, width: W, height: rowH * 0.9, color: HP_BG, "font-color": GOLD }, 40);
    const nameW = W * 0.3, barW = W * 0.5, numW = W * 0.16;
    const bx = -W / 2 + nameW + 0.02 * W + barW / 2;
    [0, 1].forEach((i) => {
      const y = H / 2 - rowH * (i + 1.5);
      const nm = label(g, "", { x: -W / 2 + nameW / 2, y: y, width: nameW, height: rowH * 0.8, color: HP_BG }, 13);
      box(g, bx, y, -0.005, barW + 0.1, rowH * 0.62, 0.01, "#23232f");
      const fill = box(g, bx, y, 0.005, barW, rowH * 0.5, 0.02, "#ffffff");
      const num = label(g, "", { x: W / 2 - numW / 2, y: y, width: numW, height: rowH * 0.8, color: HP_BG }, 4);
      P.rows.push({ nm: nm, fill: fill, num: num, bx: bx, barW: barW, last: null, col: "", who: null });
    });
    // the countdown / FIGHT! banner covers the whole board
    P.cover = overlayGroup(g);
    box(P.cover, 0, 0, 0.06, W + 0.1, H + 0.1, 0.04, HP_BG);
    P.bigTop = label(P.cover, "", { y: H / 4, z: 0.1, width: W, height: H * 0.4, color: HP_BG, "font-color": INK }, 18);   // v11e: "ROUND 3 STARTS IN" is 17 (was 15)
    P.big = label(P.cover, "", { y: -H / 5, z: 0.1, width: W, height: H * 0.58, color: HP_BG, "font-color": GOLD }, 6);
    P.coverOn = false;
    R.hp.push(P);
    return P;
  }
  // four boards back to back, hanging in the open middle of the spine
  function hpTower(R, p, x, y, z, w, h) {
    [0, 90, 180, 270].forEach((ry) => {
      const t = group({ x: x, y: y, z: z, ry: ry }, p);
      hpPanel(R, t, { z: 2.3, width: w, height: h });
    });
  }
  function manual(p, o, page) {
    const W = o.width, H = o.height, lines = page.lines;
    const g = panelMount(p, o, W, H, GOLD);
    box(g, 0, 0, -0.02, W, H, 0.01, HP_BG);
    const chars = Math.max(18, ...lines.map((t) => t.length));
    const tH = Math.min(H * 0.18, 0.8);
    // v11e: no label padding, and the letters sized to ~80% of the line
    // (they filled it before, so the bottoms of the letters got cut off)
    const tChars = Math.max(page.title.length, Math.round(chars * 0.7));
    label(g, page.title, { y: H / 2 - tH / 2, width: W, height: tH * 0.9, color: HP_BG, "font-color": GOLD,
      padding: 0, "font-size": fitFS(W, tH * 0.72, tChars) }, tChars);
    const lh = (H - tH) / lines.length;
    lines.forEach((t, i) => {
      const sub = t.charAt(0) === " ";
      label(g, sub ? "   " + t.trim() : t, {
        y: H / 2 - tH - lh * (i + 0.5), width: W - 0.2, height: lh * 0.95, alignment: "left",
        color: HP_BG, "font-color": sub ? "#b9b2d6" : INK,
        padding: 0, "font-size": fitFS(W - 0.2, lh * 0.76, chars + 3),
      }, chars + 3);
    });
  }
  // big = { top, text, color } to cover every board (the countdown)
  let fightFlashUntil = 0;
  function countdownBig(now) {
    if (phase === "COUNT") {
      return { top: round <= 1 ? "MATCH STARTS IN" : "ROUND " + round + " STARTS IN", text: String(Math.max(1, countLeft)),
        color: countLeft <= 3 ? "#ff5e5e" : GOLD };
    }
    if (phase === "LIVE" && now < fightFlashUntil) return { top: "ROUND " + round, text: "FIGHT!", color: "#5ef0b8" };
    return null;
  }
  // every screen in both robots shows the count on its top line
  function countdownScreens() {
    if (phase !== "COUNT") return;
    const t = (round <= 1 ? "MATCH STARTS IN " : "ROUND " + round + " IN ") + Math.max(1, countLeft);
    robots.forEach((R) => Object.keys(R.scr).forEach((k) => { const s = R.scr[k]; if (s && s[0]) setText(s[0], t); }));
  }
  function paintHp(header, now, big) {
    const blink = Math.floor(now / 250) % 2 === 0;
    robots.forEach((R) => {
      const E = enemyOf(R);
      R.hp.forEach((P) => {
        const on = !!big;
        if (on !== P.coverOn) {
          P.coverOn = on;
          showOverlay(P.cover, on);
        }
        if (on) {
          setText(P.bigTop, big.top);
          setText(P.big, big.text);
          if (P.bigCol !== big.color) { P.bigCol = big.color; P.big.setAttribute("font-color", big.color); }
        }
        setText(P.head, header);
        [R, E].forEach((X, i) => {
          const row = P.rows[i];
          if (row.who !== X) {
            row.who = X;
            setText(row.nm, (i === 0 ? "US " : "THEM ") + X.def.name);
            row.nm.setAttribute("font-color", X.def.team_lit);
          }
          const frac = clamp(X.armor / ARMOR_MAX, 0, 1);
          if (row.last !== X.armor) {
            row.last = X.armor;
            const w = Math.max(0.01, row.barW * frac);
            set(row.fill, { width: w, x: row.bx - (row.barW - w) / 2 });
            setText(row.num, String(X.armor));
          }
          const col = now < X.hurtFlashUntil ? "#ffffff"
            : frac < 0.3 ? (blink ? "#ff2d3d" : "#661020") : X.def.team_lit;
          if (row.col !== col) { row.col = col; setColor(row.fill, col); }
        });
      });
    });
  }
  // Puts a board and manual in every room. bridge(...) places the
  // bridge ones, which differ between games.
  function roomBoards(R, body, bridge) {
    const M = MANUAL;
    // waist: manual on the left wall, board on the right
    const wx = PELVIS.w / 2 - PELVIS.t - 0.3;
    manual(body, { x: wx, y: P_FLOOR + 3.5, ry: -90, width: 10, height: 5 }, M.waist);
    hpPanel(R, body, { x: -wx, y: P_FLOOR + 3.5, ry: 90, width: 8, height: 3 });
    // leg bays: manual on the inner wall, board over the front window
    [-1, 1].forEach((s) => {
      const bx = s * LEGBAY.cx;
      const inX = s * (LEGBAY.cx - LEGBAY.w / 2 + LEGBAY.t + 0.3);
      manual(body, { x: inX, y: P_FLOOR + 2.3, z: LEGBAY.cz, ry: s > 0 ? 90 : -90, width: 11.4, height: 3.7 },   // v11e: taller (was 3.1) - 15 lines
        s > 0 ? M.legL : M.legR);
      hpPanel(R, body, { x: bx, y: P_FLOOR + 4.55, z: LEGBAY.cz + LEGBAY.d / 2 - LEGBAY.t - 0.3, ry: 180,
        width: 5, height: 1.3 });
    });
    // arm bays: manual over the bay screen, board above that
    const ax = CHEST.w / 2 - CHEST.t - 0.3;
    [-1, 1].forEach((s) => {
      manual(body, { x: s * ax, y: C_FLOOR + 11.2, ry: s > 0 ? -90 : 90, width: 9, height: 3.9 },
        s > 0 ? M.armL : M.armR);
      hpPanel(R, body, { x: s * ax, y: C_FLOOR + 15, ry: s > 0 ? -90 : 90, width: 9, height: 2.6 });
    });
    // power room: manual over the hall screen, board over the front window
    const cz = CHEST.d / 2 - CHEST.t - 0.3;
    manual(body, { x: -1, y: C_FLOOR + 15.2, z: -cz, width: 17, height: 3.8 }, M.power);
    hpPanel(R, body, { y: C_FLOOR + 15, z: cz, ry: 180, width: 12, height: 3.4 });
    // spine: v9 - boards on the side walls instead of hanging in the
    // middle. Each height sits in the gap between two passes of the
    // ramp along that wall, and forward of the tall glass slot.
    const spX = SPINE.w / 2 - SPINE.t - 0.075 - 0.225;
    [[1, P_FLOOR + 9.6], [1, P_FLOOR + 29.6], [-1, P_FLOOR + 14.7], [-1, P_FLOOR + 24.7]].forEach(([s, y]) =>
      hpPanel(R, body, { x: s * spX, y: y, z: SPINE.cz + 3.8, ry: s > 0 ? -90 : 90, width: 4, height: 2.2 }));
    // bridge
    const hx = HEAD.w / 2 - HEAD.t - 0.3;
    bridge(hx);
  }
