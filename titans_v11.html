  function ghostEl(tag, attrs, parent) {
    const node = document.createElement(tag);
    node.setAttribute("cast-shadows", "false");
    for (const key in attrs) {
      const v = attrs[key];
      node.setAttribute(key, typeof v === "number" ? r3(v) : v);
    }
    parent.append(node);
    return node;
  }
  // parent frame: the beam starts at x, y, z and runs along +z for len
  function laserBeam(parent, x, y, z, len, colorKey, ms, width, flareK) {
    const fk = flareK === undefined ? 1 : flareK;   // v11f: the finisher's giant beam keeps its flares in check
    const T = LASER_PNG[colorKey] || LASER_PNG.red;
    const g = ghostEl("m-group", { x: x, y: y, z: z, rx: 90 }, parent);   // local +y = along the beam
    const panels = [];
    // v11h: the flicker is the players' clients scaling this group, not the server
    const bx = ghostEl("m-group", {}, g), bg = ghostEl("m-group", {}, bx);   // v11l: one axis per group
    loopAnim(bx, "sx", 0.8, 1.2, 80); loopAnim(bg, "sz", 1.2, 0.8, 100);
    [0, 60, 120].forEach((ry) => {
      panels.push({ n: ghostEl("m-image", { src: T.glow, ry: ry, y: len / 2, width: 0.01, height: len, emissive: 2 }, bg), w: width * 3.4 });
      panels.push({ n: ghostEl("m-image", { src: T.core, ry: ry + 30, y: len / 2, width: 0.01, height: len, emissive: 6 }, bg), w: width });
    });
    // flares: one facing each way
    [[0, width * 7 * fk], [len, width * 5 * fk]].forEach(([fy, size]) => {
      [{ ry: 0 }, { ry: 90 }, { rx: -90 }].forEach((rot) => {
        panels.push({ n: ghostEl("m-image", withO({ src: T.flare, y: fy, width: 0.01, emissive: 6 }, rot), g),   // v11l: width only
          w: size, square: true });
      });
    });
    const lamp = ghostEl("m-light", { y: 0.5, type: "point", intensity: 60, distance: 30,
      color: colorKey === "blue" ? "#4d8dff" : "#ff3a3a" }, g);
    const size = (P, f, t, ease) => glide(P.n, { width: P.w * f }, t, ease);   // v11l: one attribute
    panels.forEach((P) => size(P, 1, 120, "out"));
    const fadeAt = Math.max(200, ms - 320);
    setTimeout(() => {
      panels.forEach((P) => size(P, 0.01, 300, "in"));
      lamp.setAttribute("intensity", "0");
    }, fadeAt);
    setTimeout(() => { if (g.parentNode) g.parentNode.removeChild(g); }, ms + 80);
    return g;
  }

  // ==========================================================
  // v11f/v11g: THE MEGA BEAM - the finisher. A massive yellow beam out
  // of the chest, white-hot in the middle, with lightning crackling off
  // it. Like the lasers it is PNG image panels (Otherside ignores
  // opacity on shapes, so the soft edges live in the PNGs' alpha).
  // v11g - LAG: every bit of motion now runs IN EACH PLAYER'S CLIENT
  // (m-attr-anim loops and m-attr-lerp glides). The server writes a
  // piece once when it is made and once when it goes - nothing ticks

  // v11m: a permanent piece that glides on 2+ attributes gets this once,
  // at build - see THE LEAK above
  function keepLerp(node, attrs, ms) { lerp(node, attrs, ms || 1, "linear"); }
  // a new piece needs a moment to reach the players before it glides
  const soon = (fn, ms) => setTimeout(fn, 80 + (ms || 0));
  function gone(n, ms) { setTimeout(() => { if (n.parentNode) n.parentNode.removeChild(n); }, ms); }
  // v11l: a chain of groups, one per attribute, so each animates ONE
  // attribute (see glide). Returns [outermost, ..., innermost].
  function chain(parent, keys, base) {
    const out = [];
    let p = parent;
    keys.forEach((k, i) => { const g = ghostEl("m-group", i === 0 && base ? base : {}, p); out.push(g); p = g; });
    return out;
  }
  // a flicker in scale: three nested groups, one axis each
  function flicker(parent, lo, hi, ms) {
    const c = chain(parent, ["sx", "sy", "sz"]);
    loopAnim(c[0], "sx", lo, hi, ms); loopAnim(c[1], "sy", hi, lo, ms * 1.15); loopAnim(c[2], "sz", lo, hi, ms * 1.08);
    return c;
  }
  // n lightning bolts in g (whose local y is the beam's axis), between
  // y0 and y1, W wide. They spin round the beam, slide along it and
  // flash on and off - all in the players' clients. v11l: the slide is
  // on its own group, so every piece animates one attribute.
  function crackle(g, n, W, y0, y1) {
    const box_ = ghostEl("m-group", {}, g);
    for (let i = 0; i < n; i++) {
      const side = i % 2 ? 1 : -1;
      const holder = ghostEl("m-group", { ry: rnd(0, 360) }, box_);
      loopAnim(holder, "ry", 0, side * 360, rnd(700, 1500), false);
      const slide = ghostEl("m-group", { y: rnd(y0, y1) }, holder);
      loopAnim(slide, "y", y0 + (y1 - y0) * rnd(0, 0.3), y0 + (y1 - y0) * rnd(0.7, 1), rnd(400, 900));
      const img = ghostEl("m-image", { src: BOLT_SRC[i % 4], x: side * rnd(0.3, 0.55) * W,
        rz: side * rnd(20, 70), width: 0.01, height: W * rnd(0.3, 0.45), emissive: 7 * FIN_GLOW }, slide);
      loopAnim(img, "width", 0.01, rnd(0.9, 1.7) * W, rnd(110, 240));
    }
    return box_;
  }
  // a star of light seen from any side: three crossed panels. v11l: no
  // height - an image with only a width keeps its own shape, so a flare
  // grows by gliding ONE attribute
  function flareSet(g, y, emissive) {
    return [{ ry: 0 }, { ry: 90 }, { rx: -90 }].map((rot) =>
      ghostEl("m-image", withO({ src: MEGA_PNG.flare, y: y, width: 0.01, emissive: emissive }, rot), g));
  }
  // the beam itself: from the chest, len long, W wide at its core
  function megaBeam(R, len, W, ms, hit) {
    const g = ghostEl("m-group", { x: 0, y: C_FLOOR + 7, z: CHEST.d / 2 + 0.5, rx: 90 }, R.root);   // local +y = forward
    gone(g, ms + 150);
    // it races out of the chest: this group's length (sy) grows from the muzzle
    const reach = ghostEl("m-group", { sy: 0.02 }, g);
    soon(() => glide(reach, { sy: 1 }, 260, "out"));
    // and flickers fatter and thinner (one axis per group)
    const fx = ghostEl("m-group", {}, reach), fz = ghostEl("m-group", {}, fx);
    loopAnim(fx, "sx", 0.88, 1.12, 90); loopAnim(fz, "sz", 1.12, 0.88, 110);
    const body = [];
    [0, 60, 120].forEach((ry) => {
      body.push({ n: ghostEl("m-image", { src: MEGA_PNG.glow, ry: ry, y: len / 2, width: 0.01, height: len, emissive: 3 * FIN_GLOW }, fz), w: W * 2.3 });
      body.push({ n: ghostEl("m-image", { src: MEGA_PNG.core, ry: ry + 30, y: len / 2, width: 0.01, height: len, emissive: 9 * FIN_GLOW }, fz), w: W });
    });
    soon(() => body.forEach((P) => glide(P.n, { width: P.w }, 220, "out")));
    // v11p: the muzzle flare sits in FRONT of the chest, not centred on
    // its face (half of it was inside the rooms behind)
    const mSize = W * 2.6 * FIN_FLARE;
    const muzzle = flareSet(flicker(ghostEl("m-group", { y: mSize * 0.6 + 1 }, g), 0.85, 1.2, 120)[2], 0, 9 * FIN_GLOW);
    soon(() => muzzle.forEach((n) => glide(n, { width: W * 2.6 * FIN_FLARE }, 200, "out")));
    let tip = [];
    if (hit) {
      tip = flareSet(flicker(ghostEl("m-group", { y: len }, g), 0.8, 1.25, 110)[2], 0, 9 * FIN_GLOW);
      soon(() => tip.forEach((n) => glide(n, { width: W * 3.2 * FIN_FLARE }, 200, "out")), 180);
    }
    [4, len].forEach((y) => ghostEl("m-light", { y: y, type: "point", intensity: 70 * FIN_GLOW, distance: 100, color: "#ffd84a" }, g));
    // the lightning, once the beam is out
    let zap = null;
    setTimeout(() => { if (g.parentNode) zap = crackle(g, FIN_BOLTS, W, Math.min(len * 0.5, W * 1.2), len); }, 300);   // v11p: bolts start well out (they reached back into the chest)
    // and out it goes
    setTimeout(() => {
      if (zap && zap.parentNode) zap.parentNode.removeChild(zap);
      body.forEach((P) => glide(P.n, { width: 0.01 }, 320, "in"));
      muzzle.concat(tip).forEach((n) => glide(n, { width: 0.01 }, 320, "in"));
    }, Math.max(400, ms - 340));
  }
  // THE CHARGE: during the 3s sync a ball of yellow light swells in
  // front of the chest - the enemy can see it coming and shield:
  //   - the ball grows from 4m to 32m, crackling with lightning
  //   - sparks of energy stream in from all round, sucked into it
  //   - its light builds up, and in the last second it throbs hard
  // It is all built once and played by the clients; the only thing the
  // server does after that is switch it to the hard throb, once.
  const CHARGE_MOTES = 6;
  function chargeTick(R, now) {
    let C = R.finCharge;
    if (!C) {
      const [x, y, z] = SPARK_AT.fin;
      // v11p: far enough out that the 32m ball (and its sparks) stays
      // clear of the chest - it used to reach into the rooms behind it
      const g = ghostEl("m-group", { x: x, y: y, z: CHEST.d / 2 + 19, rx: 90 }, R.root);
      const pulse = chain(g, ["sx", "sy", "sz"]);
      const beats = ["sx", "sy", "sz"].map((a, i) => loopAnim(pulse[i], a, 0.85, 1.15, 140 + i * 20));
      const ball = flareSet(pulse[2], 0, 8 * FIN_GLOW), core = flareSet(pulse[2], 0, 10 * FIN_GLOW);
      ball.concat(core).forEach((n) => n.setAttribute("width", "4"));
      const lamp = ghostEl("m-light", { type: "point", intensity: 15 * FIN_GLOW, distance: 80, color: "#ffd84a" }, g);
      soon(() => {
        ball.forEach((n) => glide(n, { width: 32 }, SYNC_MS, "linear"));
        core.forEach((n) => glide(n, { width: 14 }, SYNC_MS, "linear"));
        glide(lamp, { intensity: 130 * FIN_GLOW }, SYNC_MS, "linear");
      });
      // sparks sucked in from every side
      for (let i = 0; i < CHARGE_MOTES; i++) {
        const h = ghostEl("m-group", { rx: rnd(0, 360), ry: rnd(0, 360), rz: rnd(0, 360) }, g);
        const t = rnd(420, 620);
        const slide = ghostEl("m-group", { y: 17 }, h);
        loopAnim(slide, "y", 17, 0, t, false);           // v11p: 17m ring (was 34m - it swept through the chest)
        const m = ghostEl("m-image", { src: MEGA_PNG.flare, width: 7, emissive: 8 * FIN_GLOW }, slide);
        loopAnim(m, "width", 7, 1, t, false);
      }
      crackle(g, 3, 12, -6, 6);
      C = R.finCharge = { g: g, t0: now, beats: beats, hot: false };
    }
    if (!C.hot && now - C.t0 > SYNC_MS * 0.66) {         // the last second: it throbs hard
      C.hot = true;
      C.beats.forEach((n) => { n.setAttribute("start", "0.7"); n.setAttribute("end", "1.35"); n.setAttribute("duration", "90"); });
    }
  }
  function endCharge(R) {
    const C = R.finCharge;
    if (!C) return;
    R.finCharge = null;
    if (C.g.parentNode) C.g.parentNode.removeChild(C.g);
  }

  // ==========================================================
  // v11f: EXPLOSIONS - the J3FF Titan Roamer's (v6.9) explosions,
  // brought over for the finisher. v11g: every movement is a client-
  // side glide or loop. v11l: every piece animates ONE attribute
  // (nested groups carry the rest), so nothing is left ticking after.
  // ==========================================================
  const FIRE_RED = "#ff2210", FIRE_HOT = "#ffd23a", FIRE_ORANGE = "#ff5a14";
  const FIRE_DEEP = "#c41200", FIRE_WHITE = "#fff4c8", SMOKE = "#3b3130";
  // An explosion at x,y,z inside parent. S = size (1 = J3FF's BLAST).
  // ground: it hit the ground - shock ring, a burning scorch mark and a
  // column of fire.
  function boom(parent, x, y, z, S, ground) {
    const g = group({ x: x, y: y, z: z }, parent);
    gone(g, ground ? 2600 : 1600);
    const lt = el("m-light", { type: "point", color: "#ff8a2a", intensity: 320 * S, distance: 110 * S }, g);
    soon(() => glide(lt, { intensity: 0 }, 900, "in"));
    // the fireball: white-hot heart, orange body, red skin - swells, rolls up, collapses
    const fbY = ghostEl("m-group", {}, g);
    const fs = chain(fbY, ["sx", "sy", "sz"]);
    fs.forEach((n, i) => n.setAttribute(["sx", "sy", "sz"][i], "0.2"));
    const fb = fs[2];
    const core = box(fb, 0, 0, 0, 7 * S, 7 * S, 7 * S, FIRE_WHITE, { ry: 45 });
    sph(fb, 0, 0, 0, 7 * S, FIRE_HOT);
    const body = box(fb, 0, 0, 0, 13 * S, 12 * S, 13 * S, FIRE_ORANGE);
    const skin = box(fb, 0, 0.5 * S, 0, 17 * S, 15 * S, 17 * S, FIRE_RED, { ry: 45 });
    anim(core, "sy", 0.7, 1.3, 110); anim(body, "sx", 0.8, 1.2, 140); anim(skin, "sz", 0.8, 1.25, 170);
    const scale = (v, ms, ease) => fs.forEach((n, i) => glide(n, { [["sx", "sy", "sz"][i]]: v[i] }, ms, ease));
    soon(() => scale([1, 1, 1], 240, "out"));
    setTimeout(() => { scale([1.3, 1.4, 1.3], 320, "linear"); glide(fbY, { y: 5 * S }, 320, "linear"); }, 330);
    setTimeout(() => { scale([0.05, 0.05, 0.05], 450, "in"); glide(fbY, { y: 11 * S }, 450, "in"); }, 660);
    gone(fbY, 1150);
    // smoke rolling up out of it: the group rises, the ball swells
    for (let i = 0; i < 3; i++) {
      const a = i * 2.1 + x;
      const up = ghostEl("m-group", { x: Math.cos(a) * 6 * S, y: 2 * S, z: Math.sin(a) * 6 * S }, g);
      const sm = sph(up, 0, 0, 0, 3 * S, SMOKE);
      soon(() => { glide(up, { y: (16 + i * 5) * S }, 1300 + i * 150, "out"); glide(sm, { radius: (8 + i * 1.5) * S }, 1300 + i * 150, "out"); });
      gone(up, 1500 + i * 150);
    }
    // embers flying out: each on a spoke that turns it outward, flying along z
    const nE = 6;
    for (let i = 0; i < nE; i++) {
      const a = (Math.PI * 2 * i) / nE + y, r = (18 + (i % 3) * 5) * S;
      const spoke = ghostEl("m-group", { ry: (Math.atan2(Math.cos(a), Math.sin(a)) * 180) / Math.PI }, g);
      const out = ghostEl("m-group", {}, spoke);
      const e = box(out, 0, 0, 0, 1.1 * S, 1.1 * S, 1.1 * S, i % 2 ? FIRE_HOT : FIRE_WHITE, { ry: 45 });
      soon(() => { glide(out, { z: r }, 700, "out"); glide(e, { y: (ground ? 12 : 0) * S + ((i % 4) - 1) * 6 * S }, 700, "out"); });
      gone(spoke, 800);
    }
    if (!ground) return;
    // shock ring racing out across the ground
    const rg = cyl(g, 0, 0.4, 0, 3 * S, 0.3, "#ffd8a0");
    soon(() => glide(rg, { radius: 48 * S }, 900, "out"));
    gone(rg, 1000);
    // a scorch mark that keeps burning for a couple of seconds
    const scorch = cyl(g, 0, 0.15, 0, 11 * S, 0.1, "#1a0c06");
    cyl(scorch, 0, 0.1, 0, 8 * S, 0.12, FIRE_DEEP);
    for (let i = 0; i < 4; i++) {
      const a = i * 2.2, r = 6 * S * (0.4 + (i % 3) * 0.3), t = (3 + (i % 3) * 2) * S;
      const f = box(scorch, Math.cos(a) * r, t / 2, Math.sin(a) * r, 1.8 * S, t, 1.8 * S, i % 2 ? FIRE_ORANGE : FIRE_HOT, { ry: (i * 37) % 90 });
      anim(f, "sy", 0.4, 1.3, 150 + i * 37);
    }
    // a column of fire punching up, with a cap of smoke
    const colY = ghostEl("m-group", { y: 1 }, g);
    const colX = ghostEl("m-group", {}, colY);
    anim(colX, "sx", 0.8, 1.2, 120);
    const col = box(colX, 0, 0, 0, 6 * S, 2, 6 * S, FIRE_ORANGE, { ry: 45 });
    soon(() => { glide(colY, { y: 16 * S }, 450, "out"); glide(col, { height: 32 * S }, 450, "out"); });
    setTimeout(() => { glide(colY, { y: 26 * S }, 500, "in"); glide(col, { height: 4 }, 500, "in"); }, 580);
    gone(colY, 1150);
    const capY = ghostEl("m-group", { y: 8 * S }, g);
    const cap = sph(capY, 0, 0, 0, 5 * S, SMOKE);
    soon(() => { glide(capY, { y: 36 * S }, 1100, "out"); glide(cap, { radius: 14 * S }, 1100, "out"); });
    setTimeout(() => glide(capY, { y: 44 * S }, 900, "in"), 1200);
  }

  // ==========================================================
  // A ROBOT
  // ==========================================================
  function buildRobot(side, def) {
    const heavy = def.style === "heavy";
    const R = {
      def: def, side: side,
      lines: { larm: [], rarm: [], legs: [], shield: [], fin: [] },
      st: { sock: {} }, scr: {},
      plates: [], alarms: [], jets: [], crew: new Map(), hp: [],
    };
    plateSink = R.plates;
    R.floors = [];
    floorSink = R.floors;
    alarmSink = R.alarms;
    R.interiors = [];
    roomSink = R.interiors;
    const lineDim = mix(def.dark, def.glow, 0.35);
    const colors = { shell: def.main, inner: def.inner, floor: def.innerFloor };

    const root = group({ z: -SPAWN_Z }, side);
    lerp(root, "x,y,z,ry", ROOT_LERP_MS, "linear");
    R.root = root;

    const body = group({}, root);
    const B = kbox(1), glow = (set_, p, x, y, z, w, h, d, o) => {
      const n = box(p, x, y, z, w, h, d, lineDim, o);
      R.lines[set_].push(n);
      return n;
    };

    // ------------------------------------------------------
    // HIP ROOM
    // ------------------------------------------------------
    // v5: the WAIST. No side doors - the leg bays are reached from
    // the spine now, so the two leg crews are in separate rooms.
    const pc = room(body, PELVIS, colors, {
      front: [[-7, 7, P_FLOOR + 1.2, P_FLOOR + 3.6]],
      back: [[-5 - DOOR_W / 2, -5 + DOOR_W / 2, P_FLOOR, P_FLOOR + DOOR_H]],
      bottom: [[-2.5, 2.5, -1.2, 2.8]],
    });
    pane(body, 0, P_FLOOR + 2.4, PELVIS.d / 2 - 0.4, 14, 2.4, 0.15, CLEAR, CLEAR_OP);
    pane(body, 0, P_FLOOR - 0.45, 0.8, 5, 0.1, 4, CLEAR, CLEAR_OP);
    R.st.turnL = plate(body, 5.2, P_FLOOR, 1.5, 3.4, 3.4, "TURN L", GLASS, def.innerFloor);
    R.st.turnR = plate(body, -5.2, P_FLOOR, 1.5, 3.4, 3.4, "TURN R", GLASS, def.innerFloor);
    // v9c: the waist also fires the blinding flash
    R.st.blind = plate(body, 0, P_FLOOR, -3.6, 3.2, 3.0, "BLIND", "#fff0b8", def.innerFloor);
    R.scr.hip = screen(body, { y: P_FLOOR + 5.0, z: PELVIS.d / 2 - PELVIS.t - 0.3, ry: 180, width: 12, height: 2.1 },
      3, 34, def.frame, [def.glow, "#ff9a2e", INK]);
    orderLamp(R, "hip", body, 0, P_FLOOR + 4.5, 0, 8);   // v10w
    alarmWall(R, "hip", body, "z", pc.z1 - 0.09, pc.x0, pc.x1, P_FLOOR, pc.y1,
      [[-7, 7, P_FLOOR + 1.2, P_FLOOR + 3.6]], colors.inner);   // v11a

    // ---- the leg bays ----
    // v5: each bay is its own room. Its door is in the back wall and
    // a corridor runs from there to a door in the side of the spine.
    [-1, 1].forEach((s) => {
      const bay = withO(withO({}, LEGBAY), { cx: s * LEGBAY.cx });
      const bx = bay.cx, hw = bay.w / 2;
      const outer = s * (Math.abs(bx) + hw);
      const bz0 = bay.cz - bay.d / 2, bz1 = bay.cz + bay.d / 2;
      const ax = s * LEGHALL.ax;
      const hs = {
        front: [[bx - 2.1, bx + 2.1, P_FLOOR + 1.2, P_FLOOR + 3.7]],
        bottom: [[Math.min(bx + s * 0.45, bx + s * 2.45), Math.max(bx + s * 0.45, bx + s * 2.45), -3.4, 3.4]],
        back: [[ax - DOOR_W / 2, ax + DOOR_W / 2, P_FLOOR, P_FLOOR + DOOR_H]],
      };
      // a window out the side, forward of the screen
      const outWin = [[-1.5, 3.5, P_FLOOR + 1.2, P_FLOOR + 3.7]];
      if (s > 0) hs.left = outWin; else hs.right = outWin;
      const bc = room(body, bay, colors, hs);
      pane(body, bx, P_FLOOR + 2.45, bz1 - 0.4, 4.2, 2.5, 0.15, CLEAR, CLEAR_OP);
      pane(body, outer - s * 0.4, P_FLOOR + 2.45, 1, 0.15, 2.5, 5, CLEAR, CLEAR_OP);
      // glass strip in the floor, straight over the leg
      const gx = bx + s * 1.45;
      pane(body, gx, P_FLOOR - 0.45, 0, 2, 0.1, 6.8, CLEAR, CLEAR_OP);
      [-1, 1].forEach((e) => box(body, gx + e * 1.05, P_FLOOR + 0.03, 0, 0.12, 0.04, 6.8, def.glow));
      // FWD and BACK, on the inner side, clear of the door
      const lx = bx - s * 1.35;
      const k = s > 0 ? "l" : "r";
      R.st[k + "fwd"] = plate(body, lx, P_FLOOR, 2.5, 2.6, 2.6, "FWD", "#5ef0b8", def.innerFloor);
      R.st[k + "back"] = plate(body, lx, P_FLOOR, -1.5, 2.6, 2.6, "BACK", "#ffb84e", def.innerFloor);
      // JUMP, on the outer side: both leg crews must stand on theirs
      // JUMP sits back, clear of FWD/BACK's edges and off the glass strip
      R.st[k + "jump"] = plate(body, bx + s * 1.35, P_FLOOR, -5.5, 2.6, 2.6, "STOMP", "#6ea8ff", def.innerFloor);
      // the screen sits on the outer wall behind the side window, at
      // eye height, so the ceiling never cuts it off
      const outFace = outer - s * (bay.t + 0.075);
      R.scr[k + "leg"] = screen(body, {
        x: outFace - s * 0.225, y: P_FLOOR + 2.6, z: -4.95, ry: s > 0 ? -90 : 90, width: 6, height: 2.2,
      }, 2, 36, def.frame, [def.glow, INK]);   // v11e: wider, and sized for its longest line (36 letters, was 22)
      orderLamp(R, k + "leg", body, bx, P_FLOOR + 4.5, bay.cz, 6);   // v10w
      alarmWall(R, k + "leg", body, "x", s > 0 ? bc.x1 - 0.09 : bc.x0 + 0.09, bc.z0, bc.z1, P_FLOOR, bc.y1,
        outWin, colors.inner);   // v11a: the outer wall, with its side window
      // the bay's name on its blank inner wall
      const inFace = s * (Math.abs(bx) - hw + bay.t + 0.075);
      wallSign(body, s > 0 ? "LEFT LEG BAY" : "RIGHT LEG BAY", s > 0 ? "+x" : "-x", inFace, {
        y: P_FLOOR + 4.8, z: bay.cz, width: 7, height: 0.8, color: def.inner, "font-color": def.glow,
      }, 15);   // v11e: a little margin (was 13), and moved up over the taller manual
      box(body, bx, P_FLOOR + bay.h - bay.t * 2 - 0.05, bay.cz, 0.4, 0.1, 10, def.glow);
      // outside of the bay - v11e: the armour plate has the side window
      // cut out of it (it used to cover the whole outer wall, window and all)
      holed(body, "x", outer + s * 0.25, bay.cz - (bay.d + 0.4) / 2, bay.cz + (bay.d + 0.4) / 2,
        P_FLOOR + 2.5 - 4.25, P_FLOOR + 2.5 + 4.25, 0.5, def.lit, outWin);
      box(body, outer + s * 0.55, P_FLOOR + 5.4, bay.cz, 0.3, 0.5, bay.d - 2, def.trim);
      box(body, bx, P_FLOOR - bay.t + bay.h + 0.3, bay.cz, bay.w + 0.4, 0.6, bay.d + 0.4, def.trim);

      // ---- the corridor: back from the bay, then in to the spine ----
      const H = LEGHALL, wt = H.wt, fl = { collide: "true" };
      const aOut = s * (LEGHALL.ax + H.hw + wt);          // outer face of the bend
      const aIn = s * (LEGHALL.ax - H.hw);                 // inner edge of leg A
      const zEnd = H.bz - H.hw - wt;                       // back face
      const spX = s * (SPINE.w / 2);                       // spine side wall, outside
      const zA0 = bz0 + 0.02, zA1 = zEnd;                  // leg A runs along z
      const slab = (y, h) => [
        box(body, ax, y, (zA0 + zA1) / 2,
          2 * (H.hw + wt), h, zA0 - zA1, def.frame, fl),
        box(body, (spX + aOut) / 2, y, H.bz, Math.abs(aOut - spX), h, 2 * (H.hw + wt), def.frame, fl),
      ];
      slab(P_FLOOR - 0.4, 0.8).forEach((n) => R.floors.push(n));
      slab(P_FLOOR + DOOR_H + 0.4, 0.8);
      box(body, ax, P_FLOOR + 0.02, (zA0 + H.bz) / 2, 0.3, 0.04, zA0 - H.bz, def.glow);
      box(body, (spX + ax) / 2, P_FLOOR + 0.02, H.bz, Math.abs(ax - spX), 0.04, 0.3, def.glow);
      const wy = P_FLOOR + DOOR_H / 2;
      // leg A: outer wall full length, inner wall up to the bend
      box(body, s * (LEGHALL.ax + H.hw + wt / 2), wy, (zA0 + zA1) / 2, wt, DOOR_H, zA0 - zA1, def.frame, fl);
      const zBend = H.bz + H.hw;
      box(body, aIn - s * wt / 2, wy, (zA0 + zBend) / 2, wt, DOOR_H, zA0 - zBend, def.frame, fl);
      // leg B: back wall full length, front wall from the spine to leg A
      box(body, (spX + aOut) / 2, wy, H.bz - H.hw - wt / 2, Math.abs(aOut - spX), DOOR_H, wt, def.frame, fl);

      // a lamp at the bend
      box(body, ax, P_FLOOR + DOOR_H - 0.05, H.bz, 1.2, 0.1, 1.2, def.glow);
      // v11b: the corridor's inside, both legs of it
      R.interiors.push({ x0: Math.min(ax - H.hw, ax + H.hw), x1: Math.max(ax - H.hw, ax + H.hw), y0: P_FLOOR, y1: P_FLOOR + DOOR_H,

    el("m-light", { y: P_FLOOR + 5, type: "point", intensity: 18, distance: 26, color: "#fff0dc" }, body);

    const cz0 = -PELVIS.d / 2, cz1 = SPINE.cz + SPINE.d / 2;
    const ccz = (cz0 + cz1) / 2, cl = cz0 - cz1;
    box(body, -5, P_FLOOR - 0.4, ccz, DOOR_W + 1.6, 0.8, cl + 0.2, def.frame, { collide: "true" });
    box(body, -5, P_FLOOR + DOOR_H + 0.4, ccz, DOOR_W + 1.6, 0.8, cl + 0.2, def.frame, { collide: "true" });
    [-1, 1].forEach((s) => box(body, -5 + s * (DOOR_W / 2 + 0.4), P_FLOOR + DOOR_H / 2, ccz, 0.8, DOOR_H, cl + 0.2, def.frame, { collide: "true" }));

    // outside of the hips
    B(body, 0, P_FLOOR - 2.2, 7.0, 7, 5, 1.4, def.lit);

    const abY0 = PELVIS.floor - PELVIS.t + PELVIS.h;

    [0, 1, 2].forEach((i) => box(body, 0, abY0 + 1 + i * 1.7, 5.2, 11 - i * 0.6, 1.1, 2, def.frame));
    glow("legs", body, 0, (abY0 + abY1) / 2, 6.25, 0.7, abY1 - abY0 - 0.6, 0.1);

    // ------------------------------------------------------
    // CHEST HALL
    // ------------------------------------------------------
    const WIN = { x0: -4.5, x1: 4.5, y0: C_FLOOR + 2.5, y1: C_FLOOR + 11.5 };
    const bayWin = (s) => [s > 0 ? 10 : -13.8, s > 0 ? 13.8 : -10, C_FLOOR + 1.2, C_FLOOR + 4.8];

      pane(body, s * (CHEST.w / 2 - 0.4), C_FLOOR + 3, 0, 0.15, 3.6, 10, CLEAR, CLEAR_OP);

    // the reactor, seen from outside through the window
    const RZ = 4.2, RY0 = C_FLOOR, RH = 13;

    R.core = core;

    el("m-light", { y: RY0 + 7, z: RZ, type: "point", intensity: 40, distance: 30, color: def.glow }, body);

    // the power room: four plates round the reactor - step on one

    R.st.route = {};
    ROUTES.forEach(([key, name], i) => {

        { ry: (Math.atan2(dx, dz) * 180) / Math.PI });

    R.scr.hall = screen(body, { x: -1, y: C_FLOOR + 9.6, z: -CHEST.d / 2 + CHEST.t + 0.3, width: 17, height: 6.4 },
      7, 36, def.frame, [def.glow, INK, INK, INK, INK, "#ff5ec8", GOLD]);
    orderLamp(R, "hall", body, 0, C_FLOOR + 7, 0, 8);   // v10w
    // v11a: the back wall between the arm partitions (inner faces at +-8.3)
    alarmWall(R, "hall", body, "z", cc.z0 + 0.09, -8.3, 8.3, C_FLOOR, cc.y1,
      [[5 - DOOR_W / 2, 5 + DOOR_W / 2, C_FLOOR, C_FLOOR + DOOR_H]], colors.inner);
    wallSign(body, "POWER ROOM", "+z", CHEST.cz - CHEST.d / 2 + CHEST.t + 0.075, {
      y: C_FLOOR + 5.2, x: -2, width: 10, height: 1.3, color: def.inner, "font-color": def.glow }, 10);

    // the two side bays, half-height partitions
    [-1, 1].forEach((s) => {
      const px = s * 8.5;
      holed(body, "x", px, cc.z0, cc.z1, C_FLOOR, C_FLOOR + 5, 0.4, def.frame,
        [[cc.z0, cc.z0 + 3.4, C_FLOOR, C_FLOOR + 3.6]], { collide: "true" });
      box(body, px, C_FLOOR + 5.05, 0, 0.6, 0.1, cc.z1 - cc.z0, def.glow);
      const k = s > 0 ? "l" : "r";
      // v9: two columns. The outer one is the attack line - an attack,

      // steps straight onto a hit. The left bay's inner column is the
      // shield.
      // the right bay has no shield, so its plates get the full width
      const wide = s < 0;
      const colOut = wide ? s * 11.4 : s * 12.775, colIn = s * 10.05;
      const PW = wide ? 2.9 : 2.1, PD = 2.6;
      // the right bay has no shield, so its plates get the full width
      const zHit = -3.0, zWind = wide ? 0.5 : 0.5, zExtra = 4.0;
      R.st[k + "punch"] = plate(body, colOut, C_FLOOR, zHit, PW, PD, s > 0 ? "SHIELD BASH" : "SLASH", "#ff3b52", def.innerFloor);
      R.st[k + "wind"] = plate(body, colOut, C_FLOOR, zWind, PW, PD, "PULL BACK", "#ffb347", def.innerFloor);
      R.st[k + "extra"] = plate(body, colOut, C_FLOOR, zExtra, PW, PD, s > 0 ? "GRAB" : "WIND SLASH", s > 0 ? "#ffd166" : "#8ff0ff", def.innerFloor);
      if (s > 0) R.st.shield = plate(body, colIn, C_FLOOR, 0.5, PW, PD, "SHIELD", "#4de8ff", def.innerFloor);
      R.scr[k + "arm"] = screen(body, {
        x: s * (CHEST.w / 2 - CHEST.t - 0.3), y: C_FLOOR + 7.2, ry: s > 0 ? -90 : 90, width: 9, height: 3.4,
      }, 3, 34, def.frame, [def.glow, INK, "#4de8ff"]);
      orderLamp(R, k + "arm", body, s * 11.5, C_FLOOR + 4, 0.5, 5);   // v10w
      alarmWall(R, k + "arm", body, "x", s > 0 ? cc.x1 - 0.09 : cc.x0 + 0.09, cc.z0, cc.z1, C_FLOOR, cc.y1,
        [[-5, 5, C_FLOOR + 1.2, C_FLOOR + 4.8]], colors.inner);   // v11a: the chest side wall
      // sign on the partition, readable from the hall
      wallSign(body, s > 0 ? "LEFT FIST + SHIELD" : "RIGHT ARM - SWORD", s > 0 ? "-x" : "+x", px - s * 0.2, {
        y: C_FLOOR + 6.2, width: 12, height: 1.3, color: def.inner, "font-color": def.glow,
      }, 17);
    });
    // ceiling glow strips and light
    [-1, 1].forEach((s) => box(body, s * 4, cc.y1 - 0.1, 0, 0.5, 0.1, 13, def.glow));

    // outside of the chest: frame round the window
    [[0, WIN.y1 + 0.6, 11, 1.2], [0, WIN.y0 - 0.6, 11, 1.2]].forEach(([x, y, w, h]) => box(body, x, y, fz + 0.3, w, h, 0.8, def.trim));
    [-1, 1].forEach((s) => box(body, s * 5.1, (WIN.y0 + WIN.y1) / 2, fz + 0.3, 1.2, 9, 0.8, def.trim));
    [-1, 1].forEach((sx) => [-1, 1].forEach((sy) => box(body, sx * 5.3, (WIN.y0 + WIN.y1) / 2 + sy * 5.3, fz + 0.5, 2.2, 2.2, 0.8, def.frame, { rz: 45 })));
    // bay window frames
    [-1, 1].forEach((s) => box(body, s * 11.9, C_FLOOR + 5.2, fz + 0.2, 4.6, 0.5, 0.6, def.trim));
    const chestTop = CHEST.floor - CHEST.t + CHEST.h;
    if (heavy) {
      box(body, 0, chestTop - 0.4, fz + 1.4, 32, 2.6, 2.4, def.trim);
      [-1, 1].forEach((s) => {
        box(body, s * 10.5, C_FLOOR + 10, fz + 0.5, 8, 8, 1.2, def.lit, { rz: s * -6 });
        box(body, s * 10.5, C_FLOOR + 10, fz + 1.15, 5.5, 0.5, 0.2, def.trim, { rz: s * -6 });
      });
    } else {
      [-1, 1].forEach((s) => {
        box(body, s * 8.6, C_FLOOR + 13.4, fz + 0.4, 13, 1.6, 0.9, def.trim, { rz: s * -24 });
        box(body, s * 10.2, C_FLOOR + 8.2, fz + 0.4, 7, 5.5, 1.0, def.lit, { rz: s * 10 });
      });

    }
    [-1, 1].forEach((s) => {
      glow("fin", body, s * 3.4, WIN.y1 + 2.8, fz + 0.25, 0.6, 5, 0.1, { rz: s * 32 });
      glow("fin", body, s * 6.4, WIN.y0 - 1.6, fz + 0.25, 0.6, 4, 0.1, { rz: s * -40 });
    });
    // side armour round the bay windows
    [-1, 1].forEach((s) => {
      box(body, s * (CHEST.w / 2 + 0.3), C_FLOOR + 5.2, 0, 0.6, 0.5, 11, def.trim);
      box(body, s * (CHEST.w / 2 + 0.4), C_FLOOR + 11, 0, 0.8, 5, 12, def.frame);
    });

    // ------------------------------------------------------
    // BRIDGE (the head)
    // ------------------------------------------------------
    const neckY0 = chestTop, neckY1 = H_FLOOR - HEAD.t;
    cyl(body, 0, (neckY0 + neckY1) / 2, 0.5, 4, neckY1 - neckY0 + 0.2, def.dark);
    // v10c: a bigger visor and bigger side windows
    const VIS = { x0: -5.4, x1: 5.4, y0: H_FLOOR + 1.0, y1: H_FLOOR + 3.9 };
    // v8: a window in each side wall, beside the desk (u = z, v = y)
    const SIDE = { z0: 0.2, z1: 5.2, y0: H_FLOOR + 0.9, y1: H_FLOOR + 4.5 };
    const sideHole = [[SIDE.z0, SIDE.z1, SIDE.y0, SIDE.y1]];
    const hc = room(body, HEAD, colors, {
      front: [[VIS.x0, VIS.x1, VIS.y0, VIS.y1]],
      back: [[5 - DOOR_W / 2, 5 + DOOR_W / 2, H_FLOOR, H_FLOOR + DOOR_H]],
      left: sideHole,
      right: sideHole,
    });
    const hz = HEAD.cz + HEAD.d / 2;
    // the glass is clear - the glow is a frame round the slit, so the
    // eyes still light up from outside without tinting the view
    // v10b: flush with the inside of the wall so there is no ledge to get wedged in
    const VW = VIS.x1 - VIS.x0, VH = VIS.y1 - VIS.y0, VY = (VIS.y0 + VIS.y1) / 2;
    pane(body, 0, VY, hz - HEAD.t - 0.075, VW + 0.2, VH + 0.2, 0.15, CLEAR, CLEAR_OP);
    R.visor = [
      box(body, 0, VIS.y1 + 0.15, hz + 0.08, VW + 0.4, 0.3, 0.2, def.glow),
      box(body, 0, VIS.y0 - 0.15, hz + 0.08, VW + 0.4, 0.3, 0.2, def.glow),
      box(body, VIS.x0 - 0.15, VY, hz + 0.08, 0.3, VH + 0.3, 0.2, def.glow),
      box(body, VIS.x1 + 0.15, VY, hz + 0.08, 0.3, VH + 0.3, 0.2, def.glow),
    ];
    {
      const sz = (SIDE.z0 + SIDE.z1) / 2, sw = SIDE.z1 - SIDE.z0;
      const sy = (SIDE.y0 + SIDE.y1) / 2, sh = SIDE.y1 - SIDE.y0;
      [-1, 1].forEach((s) => {
        const wx = s * (HEAD.w / 2);
        pane(body, s * (HEAD.w / 2 - HEAD.t - 0.075), sy, sz, 0.15, sh + 0.2, sw + 0.2, CLEAR, CLEAR_OP);
        const fx = wx + s * 0.08;
        R.visor.push(
          box(body, fx, SIDE.y1 + 0.15, sz, 0.2, 0.3, sw + 0.6, def.glow),
          box(body, fx, SIDE.y0 - 0.15, sz, 0.2, 0.3, sw + 0.6, def.glow),

          box(body, fx, sy, SIDE.z1 + 0.15, 0.2, sh, 0.3, def.glow));
      });
    }
    // v7: the captain's plate and desk. The first person on the plate

    R.desk = desk(body, def, R, hz - HEAD.t - 0.05, H_FLOOR, VIS.y0 - H_FLOOR);
    R.scr.bridge = screen(body, { y: H_FLOOR + 5.3, z: hz - HEAD.t - 0.3, ry: 180, width: 10.6, height: 3 },
      4, 40, def.frame, [GOLD, def.glow, "#ff5ec8", INK]);
    wallSign(body, "BRIDGE", "+z", HEAD.cz - HEAD.d / 2 + HEAD.t + 0.075, {
      y: H_FLOOR + 5.4, width: 6, height: 1.2, color: def.inner, "font-color": def.glow }, 6);
    // the start keypad, on the right-hand wall - captain only
    R.keypad = keypad(body, {
      x: HEAD.cx - HEAD.w / 2 + HEAD.t + 0.075 + 0.15, y: H_FLOOR, z: -2.0, ry: 90,
      title: "START MATCH", promptX: -2.6, allow: (e) => isCaptain(R, e),
    }, (K) => bridgeCode(R, K));
    el("m-light", { y: H_FLOOR + 6, type: "point", intensity: 10, distance: 12, color: "#fff0dc" }, body);
    // corridor to the spine
    {
      const z0 = HEAD.cz - HEAD.d / 2, z1 = SPINE.cz + SPINE.d / 2;
      const zc = (z0 + z1) / 2, L = z0 - z1 + 0.2;
      box(body, 5, H_FLOOR - 0.4, zc, DOOR_W + 1.6, 0.8, L, def.frame, { collide: "true" });
      box(body, 5, H_FLOOR + DOOR_H + 0.4, zc, DOOR_W + 1.6, 0.8, L, def.frame, { collide: "true" });
      [-1, 1].forEach((s) => box(body, 5 + s * (DOOR_W / 2 + 0.4), H_FLOOR + DOOR_H / 2, zc, 0.8, DOOR_H, L, def.frame, { collide: "true" }));
      R.interiors.push({ x0: 5 - DOOR_W / 2, x1: 5 + DOOR_W / 2, y0: H_FLOOR, y1: H_FLOOR + DOOR_H, z0: z1, z1: z0 });   // v11c
    }
    // helmet dressing
    const headTop = H_FLOOR - HEAD.t + HEAD.h;
    if (heavy) {
      box(body, 0, headTop + 1.2, HEAD.cz, 1.8, 2.8, 10, def.trim);
      [-1, 1].forEach((s) => {
        box(body, s * 6.4, headTop + 3.4, hz - 2, 1.2, 7, 1.4, def.trim, { rz: s * -30 });
        box(body, s * 6.8, H_FLOOR + 2.5, (HEAD.cz - HEAD.d / 2 + SIDE.z0) / 2, 0.8, 6, SIDE.z0 - (HEAD.cz - HEAD.d / 2) - 0.6, def.frame);
      });
      box(body, 0, VIS.y1 + 0.5, hz + 0.3, 11.6, 0.8, 0.6, def.trim);
      box(body, 0, H_FLOOR - 0.2, hz + 0.3, 7, 1.6, 1.2, def.trim);
    } else {
      [-1, 1].forEach((s) => {
        box(body, s * 2.6, headTop + 3.4, hz - 1.5, 0.8, 7.5, 0.8, def.trim, { rz: s * -36 });
        box(body, s * 6.7, H_FLOOR + 2.6, (HEAD.cz - HEAD.d / 2 + SIDE.z0) / 2, 0.6, 5, SIDE.z0 - (HEAD.cz - HEAD.d / 2) - 0.6, def.frame);
      });
      box(body, 0, headTop - 0.8, hz + 0.3, 2, 2, 0.6, def.lit, { rz: 45 });
      box(body, 0, H_FLOOR - 0.2, hz + 0.8, 5, 2.4, 1.6, def.trim);
      box(body, 0, VIS.y1 + 0.4, hz + 0.25, 11, 0.6, 0.5, def.lit);
    }

    // ------------------------------------------------------
    // THE SPINE - backpack tower with the ramp
    // ------------------------------------------------------
    const S = SPINE;
    const sf = S.cz + S.d / 2, sb = S.cz - S.d / 2;
    const door = (x, y) => [x - DOOR_W / 2, x + DOOR_W / 2, y, y + DOOR_H];
    const sc = room(body, S, colors, {
      front: [door(-5, P_FLOOR), door(5, C_FLOOR), door(5, H_FLOOR)],
      // v10: the hatch is HATCH_H tall, not DOOR_H
      back: [[5 - DOOR_W / 2, 5 + DOOR_W / 2, HATCH_Y, HATCH_Y + HATCH_H]],
      // tall glass slot, and (v5) a door at the floor to each leg bay
      left: [[S.cz - 1.2, S.cz + 1.2, P_FLOOR + 4, P_FLOOR + 34],
        [LEGHALL.bz - DOOR_W / 2, LEGHALL.bz + DOOR_W / 2, P_FLOOR, P_FLOOR + DOOR_H]],
      right: [[S.cz - 1.2, S.cz + 1.2, P_FLOOR + 4, P_FLOOR + 34],
        [LEGHALL.bz - DOOR_W / 2, LEGHALL.bz + DOOR_W / 2, P_FLOOR, P_FLOOR + DOOR_H]],
    });
    // floor signs at the bottom of the spine, reading toward each door
    [-1, 1].forEach((s) => floorSign(body, s > 0 ? "LEFT LEG" : "RIGHT LEG",
      s * 2.9, P_FLOOR + 0.03, LEGHALL.bz, s > 0 ? 90 : -90,
      { width: 3.6, height: 1.0, color: def.inner, "font-color": def.glow }, 9));
    // tall glass slots in the sides
    [-1, 1].forEach((s) => pane(body, s * (S.w / 2 - 0.4), P_FLOOR + 19, S.cz, 0.15, 30, 2.4, def.glow, 0.25));

    // square spiral: landings at the corners, ramps between
    const CO = [[-5, 5], [5, 5], [5, -5], [-5, -5]];
    const lane = 3, ramp = Math.atan2(RISE, 10 - lane);
    const rampLen = Math.hypot(10 - lane, RISE) + 0.3;
    const deg = (ramp * 180) / Math.PI;
    const LAND = 13;
    for (let n = 0; n <= LAND; n++) {
      const [cx, cz] = CO[n % 4];
      const y = P_FLOOR + n * RISE;
      if (n > 0) R.floors.push(box(body, cx, y - 0.2, S.cz + cz, lane, 0.4, lane, def.dark, { collide: "true" }));
      if (n > 0) R.floors.push(box(body, cx, y + 0.01, S.cz + cz, lane - 0.4, 0.02, lane - 0.4, def.glow, { opacity: 0.5 }));
      if (n === LAND) break;
      const [nx, nz] = CO[(n + 1) % 4];
      const mx = (cx + nx) / 2, mz = (cz + nz) / 2;
      const my = y + RISE / 2 - 0.22;
      let o, w, d, rx = mx, rz = mz;
      if (cz === nz) {                      // along x
        const dir = Math.sign(nx - cx);
        o = { rz: dir * deg };
        w = rampLen; d = lane;
      } else {                              // along z
        const dir = Math.sign(nz - cz);
        o = { rx: -dir * deg };
        w = lane; d = rampLen;
      }
      R.floors.push(box(body, rx, my, S.cz + rz, w, 0.4, d, def.frame, withO({ collide: "true" }, o)));
      // railing on the open (inner) side of the ramp
      const inX = cz === nz ? 0 : -Math.sign(cx) * (lane / 2 + 0.05);
      const inZ = cz === nz ? -Math.sign(cz) * (lane / 2 + 0.05) : 0;
      box(body, rx + inX, my + 0.75, S.cz + rz + inZ, cz === nz ? rampLen : 0.12, 1.1, cz === nz ? 0.12 : rampLen,
        GLASS, withO({ opacity: 0.2, collide: "true" }, o));
      box(body, rx + inX, my + 1.32, S.cz + rz + inZ, cz === nz ? rampLen : 0.2, 0.1, cz === nz ? 0.2 : rampLen,
        def.glow, o);
    }
    // door signs, on the spine side of each door
    // v5: 4.4 wide and pulled in from the side walls - at 5.5 wide
    // over the doors they ran 1.5m into the wall and lost letters
    const inner = S.w / 2 - S.t;               // 6.2
    const signX = (x) => Math.sign(x) * (inner - 0.15 - 2.2);
    [
      [-5, P_FLOOR, "WAIST"], [5, C_FLOOR, "CHEST HALL"], [5, H_FLOOR, "BRIDGE"],
    ].forEach(([x, y, t]) => wallSign(body, t, "-z", sf - S.t - 0.075, {
      x: signX(x), y: y + DOOR_H + 0.7, width: 4.4, height: 0.9,
      color: def.inner, "font-color": def.glow,
    }, 10));
    // v10: the hatch sign used to sit over the opening. Over a
    // 10.5m opening it would be 11m above the landing and nobody
    // would read it, so it moves to the wall BESIDE the doorway at
    // head height. x 1.1 with a 4.4 sign spans -1.1 to 3.3, which
    // clears the opening (3.5 to 6.5) and the side wall.
    wallSign(body, "HATCH", "+z", sb + S.t + 0.075, { x: 1.1, y: HATCH_Y + 2.6,
      width: 4.4, height: 0.9, color: def.inner, "font-color": GOLD }, 10);
    el("m-light", { y: P_FLOOR + 20, z: S.cz, type: "point", intensity: 18, distance: 34, color: "#fff0dc" }, body);

    // spine outside: thrusters, vents, emblem
    const spineTop = S.floor - S.t + S.h;
    [-1, 1].forEach((s) => {
      cyl(body, s * 4.5, P_FLOOR - 4, sb - 1.8, 2.6, 10, def.dark);
      cyl(body, s * 4.5, P_FLOOR - 9.2, sb - 1.8, 2.0, 0.6, def.glow);
      R.jets.push(cyl(body, s * 4.5, P_FLOOR - 13.5, sb - 1.8, 1.6, 8, "#ffb347", { opacity: 0.7, visible: "false" }));
      cyl(body, s * 4.5, P_FLOOR + 1.4, sb - 1.8, 3.0, 1.0, def.trim);
      box(body, s * (S.w / 2 + 0.4), spineTop - 6, S.cz, 0.8, 8, 10, def.main);
      if (heavy) box(body, s * 5.5, spineTop + 3, S.cz - 2, 1.4, 7, 1.4, def.trim);
      else box(body, s * 6.6, spineTop + 2.5, S.cz - 3, 0.6, 8, 4, def.trim, { rz: s * -20 });
    });
    box(body, 0, spineTop + 0.4, S.cz, S.w + 1, 0.8, S.d + 1, def.trim);
    // recessed dark panels and trim bands so the backpack reads as
    // machinery, not a box
    [-1, 1].forEach((s) => {
      box(body, s * (S.w / 2 + 0.15), P_FLOOR + 9, S.cz, 0.3, 8, S.d - 3, def.frame);
      box(body, s * (S.w / 2 + 0.15), P_FLOOR + 30, S.cz, 0.3, 4, S.d - 3, def.frame);
    });
    // trim bands: four strips round the outside, never a slab
    // through the middle - the ramp shaft is in there
    [P_FLOOR + 3, P_FLOOR + 15, P_FLOOR + 27].forEach((y) => {
      [-1, 1].forEach((s) => {
        // v10: on the BACK face (s -1) a band that falls across the
        // taller hatch stops either side of it instead of barring
        // the doorway. 2.9 / 7.1 are the outside of the gold jambs.
        if (s < 0 && y > HATCH_Y && y < HATCH_Y + HATCH_H) {
          box(body, (-7.4 + 2.9) / 2, y, S.cz + s * (S.d / 2 + 0.2), 2.9 + 7.4, 0.6, 0.4, def.trim);
          box(body, (7.1 + 7.4) / 2, y, S.cz + s * (S.d / 2 + 0.2), 7.4 - 7.1, 0.6, 0.4, def.trim);
        } else {
          // v11c: on the FRONT face the bands at P_FLOOR+3 and P_FLOOR+15
          // ran straight across the waist and chest-hall doorways (they sit
          // inside the doorway where spine and chest meet). Stop them either
          // side of any door they'd cross, like the back face does.
          const x0 = -(S.w + 0.8) / 2, x1 = (S.w + 0.8) / 2;
          const doors = s > 0 ? [[-5, P_FLOOR], [5, C_FLOOR], [5, H_FLOOR]]
            .filter(([, fy]) => y > fy - 0.4 && y < fy + DOOR_H + 0.4).map(([dx]) => dx) : [];
          let from = x0;
          doors.sort((m, n) => m - n).forEach((dx) => {
            const a = dx - DOOR_W / 2 - 0.1;
            if (a > from) box(body, (from + a) / 2, y, S.cz + s * (S.d / 2 + 0.2), a - from, 0.6, 0.4, def.trim);
            from = dx + DOOR_W / 2 + 0.1;
          });
          if (x1 > from) box(body, (from + x1) / 2, y, S.cz + s * (S.d / 2 + 0.2), x1 - from, 0.6, 0.4, def.trim);
        }
        if (y > P_FLOOR + DOOR_H + 1) {
          box(body, s * (S.w / 2 + 0.2), y, S.cz, 0.4, 0.6, S.d + 0.8, def.trim);
        } else {
          // the lowest band stops either side of the leg corridor
          const gap = LEGHALL.hw + LEGHALL.wt, end = S.d / 2 + 0.4;
          [-1, 1].forEach((e) => box(body, s * (S.w / 2 + 0.2), y,
            LEGHALL.bz + e * (gap + end) / 2, 0.4, 0.6, end - gap, def.trim));
        }
      });
    });
    box(body, 0, P_FLOOR + 1.8, sb - 0.3, S.w - 3, 3, 0.4, def.frame);
    box(body, 0, P_FLOOR + 22, sb - 0.45, 9, 9, 0.3, def.main);
    box(body, 0, P_FLOOR + 22, sb - 0.62, 5, 5, 0.1, def.trim, { rz: 45 });
    // v10: 5.8 wide, not 8 - at 8 these ran into the side of the
    // taller hatch opening
    [0, 1, 2, 3].forEach((i) => box(body, 0, P_FLOOR + 10 + i * 1.4, sb - 0.5, 5.8, 0.6, 0.4, def.dark));
    box(body, 5, HATCH_Y + HATCH_H + 0.4, sb - 0.4, DOOR_W + 1.2, 0.6, 0.8, GOLD);
    // v10: gold jambs down both sides of the tall opening, so it
    // reads as one doorway and not a slot left in the panelling
    [-1, 1].forEach((s) => box(body, 5 + s * (DOOR_W / 2 + 0.3), HATCH_Y + HATCH_H / 2,
      sb - 0.4, 0.6, HATCH_H, 0.8, GOLD));
    // v11c: the gap from the hatch back to the lift's top door is walked
    // every boarding - keep it clear all the way (lift door is 3.8 wide)
    R.interiors.push({ x0: BOARD_X - 1.9, x1: BOARD_X + 1.9, y0: HATCH_Y, y1: HATCH_Y + HATCH_H, z0: sb - 5.5, z1: sb });

    // ------------------------------------------------------
    // LEGS (nobody inside - these can move all they like)
    // ------------------------------------------------------
    const LB = kbox(KL, KLW), LC = kcyl(KL, KLW), LS = ksph(KL, KLW);
    R.hip = {}; R.knee = {}; R.ankle = {};
    [-1, 1].forEach((s) => {
      const key = s > 0 ? "L" : "R";
      const hip = joint(body, s * HIP_X, HIP_Y, 0);
      LS(hip, 0, -0.65, 0, 1.1, def.frame);
      LB(hip, 0, -3.2, 0, 2.6, 6.2, 2.6, def.frame);
      LB(hip, 0, -3.0, 0.6, 3.3, 5.2, 2.8, def.main);
      LB(hip, s * 1.75, -3.2, 0, 0.3, 4.4, 2.4, def.dark);
      R.lines.legs.push(LB(hip, 0, -3.0, 2.05, 0.35, 4.4, 0.12, lineDim));
      if (heavy) LB(hip, 0, -1.2, 1.9, 3.5, 1.2, 0.5, def.trim, { rx: -12 });
      else LB(hip, s * 1.2, -2.2, 1.6, 0.4, 3.0, 1.2, def.trim, { rz: s * 10 });

      const knee = joint(hip, 0, -6.4 * KL, 0);
      LS(knee, 0, 0, 0.2, 1.55, def.dark);
      LB(knee, 0, 0.1, 1.5, 2.4, 2.0, 1.0, heavy ? def.trim : def.lit, { rx: 12 });
      LB(knee, 0, -3.3, 0, 2.8, 6.2, 2.8, def.frame);
      LB(knee, 0, -3.0, 0.9, heavy ? 3.6 : 3.1, 5.6, 2.4, def.main, { rx: -4 });
      R.lines.legs.push(LB(knee, 0, -3.2, 2.15, 0.35, 4.2, 0.12, lineDim));
      LC(knee, 0, -3.6, -1.9, 0.9, 3.4, def.dark);
      LC(knee, 0, -5.4, -1.9, 0.6, 0.4, def.glow);
      if (!heavy) LB(knee, s * 1.7, -2.8, -0.3, 0.3, 4.8, 2.2, def.trim);

      const ankle = joint(knee, 0, -6.4 * KL, 0);
      LS(ankle, 0, 0, 0, 1.1, def.dark);
      LB(ankle, 0, -0.55, 0.8, heavy ? 4.4 : 3.8, 1.1, 6.6, def.frame);
      LB(ankle, 0, -0.15, 3.3, heavy ? 4.2 : 3.4, 1.0, 1.6, def.main, { rx: heavy ? 0 : 18 });
      LB(ankle, 0, -0.95, 0.8, heavy ? 4.6 : 4.0, 0.3, 6.9, def.dark);
      LB(ankle, 0, -0.3, -2.4, 3.0, 1.2, 1.2, def.trim);
      R.hip[key] = hip; R.knee[key] = knee; R.ankle[key] = ankle;
    });

    // ------------------------------------------------------
    // ARMS
    // ------------------------------------------------------
    const AB = kbox(KA, KAW), AC = kcyl(KA, KAW), AS = ksph(KA, KAW);
    R.shoulder = {}; R.elbow = {};
    [-1, 1].forEach((s) => {
      const key = s > 0 ? "L" : "R";
      const set_ = s > 0 ? "larm" : "rarm";
      const shoulder = joint(body, s * SHOULDER.x, SHOULDER.y, 0, { rz: s * ARM_FLARE });
      AS(shoulder, 0, 0, 0, 1.8, def.dark);
      if (heavy) {
        AB(shoulder, s * 0.6, 1.0, 0, 4.4, 3.0, 5.4, def.main);
        AB(shoulder, s * 0.6, 2.6, 0, 3.8, 0.5, 4.6, def.trim);
        AB(shoulder, s * 2.85, 0.2, 0, 0.5, 2.6, 5.0, def.lit);
      } else {
        AS(shoulder, s * 0.5, 0.9, 0, 2.5, def.main, { sy: 0.75 });
        AB(shoulder, s * 1.0, 2.6, -0.6, 0.35, 2.8, 3.2, def.trim, { rz: s * -30 });
        AB(shoulder, s * 2.7, 0.4, 0, 0.3, 1.2, 3.6, def.lit);
      }
      AB(shoulder, 0, -3.0, 0, 2.2, 5.2, 2.2, def.frame);
      AB(shoulder, s * 0.35, -2.6, 0, 2.2, 3.6, 2.6, def.main);
      R.lines[set_].push(AB(shoulder, s * 1.5, -2.9, 0, 0.12, 3.8, 0.35, lineDim));

      const elbow = joint(shoulder, 0, -5.6 * KA, 0, { rx: -12 });
      AS(elbow, 0, 0, 0, 1.35, def.dark);
      AB(elbow, 0, -2.8, 0, heavy ? 3.4 : 3.0, 4.8, heavy ? 3.4 : 3.0, def.main);
      AB(elbow, 0, -1.0, 0, heavy ? 3.7 : 3.2, 0.8, heavy ? 3.7 : 3.2, def.trim);
      R.lines[set_].push(AB(elbow, s * (heavy ? 1.75 : 1.55), -3.0, 0, 0.12, 3.4, 0.35, lineDim));
      R.lines[set_].push(AB(elbow, 0, -3.0, heavy ? 1.75 : 1.55, 0.35, 3.4, 0.12, lineDim));
      if (!heavy) AB(elbow, s * 1.3, -2.4, -0.8, 0.3, 4.0, 1.6, def.trim, { rz: s * 8 });
      AB(elbow, 0, -6.2, 0, heavy ? 3.4 : 3.0, 2.6, heavy ? 3.2 : 2.9, def.frame);
      AB(elbow, 0, -6.2, heavy ? 1.7 : 1.55, heavy ? 3.2 : 2.8, 1.9, 0.4, def.dark);
      [-1, 0, 1].forEach((f) => AB(elbow, f * (heavy ? 0.95 : 0.85), -7.3, 0.6, 0.8, 0.5, 1.9, def.trim));
      if (s > 0) {
        AC(elbow, s * (heavy ? 1.9 : 1.7), -2.8, 0, 1.4, 0.35, def.trim, { rz: 90 });
        R.lines.shield.push(AC(elbow, s * (heavy ? 2.1 : 1.9), -2.8, 0, 0.8, 0.2, lineDim, { rz: 90 }));
      }
      // sword in the right hand, shield on the left forearm
      if (s < 0) buildSword(elbow, def, heavy, R.lines.rarm);
      else { R.shieldArt = buildHandShield(elbow, def, heavy, R.lines.shield); keepLerp(R.shieldArt, "rx,ry,rz", JOINT_LERP_MS); }   // v11m
      R.shoulder[key] = shoulder; R.elbow[key] = elbow;
    });

    // v10p: THE AEGIS. While the shield is up, the real shield projects a
    // hexagonal energy barrier out in front of the whole robot, so the
    // enemy can see from anywhere that it is up. An outline, not a disc,
    // so the crew can still see out: an outer hexagon, an inner one,
    // spokes joining their corners, and a small hex emblem in the middle
    // with a soft flare behind it. It sits in front of the physical
    // shield. Team colour when up; white-hot while powered (unpushable).
    R.shieldBars = [];
    R.shield = overlayGroup(body);
    {
      const AZ = CHEST.d / 2 + 17, AY = C_FLOOR + 10;
      const g = group({ y: AY, z: AZ }, R.shield);
      keepLerp(g, "sx,sy,sz");                       // v11m
      const bars = [];
      const hex = (rad, th) => {
        const apo = rad * Math.cos(Math.PI / 6);
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + Math.PI / 6;
          bars.push(box(g, apo * Math.cos(a), apo * Math.sin(a), 0, th, rad, th, def.glow, { rz: (a * 180) / Math.PI }));
        }
      };
      hex(24, 0.9);
      hex(13, 0.55);
      hex(4.2, 0.5);
      for (let i = 0; i < 6; i++) {
        const b = (i / 6) * Math.PI * 2;
        const rm = (13 + 24) / 2;
        bars.push(box(g, rm * Math.cos(b), rm * Math.sin(b), 0, 0.4, 11, 0.4, def.glow, { rz: (b * 180) / Math.PI - 90 }));
      }
      const T = LASER_PNG[def.laser] || LASER_PNG.red;
      const flare = ghostEl("m-image", { src: T.flare, width: 14, emissive: 2 }, g);   // v11j: 2 (was 3). v11l: width only - keeps its shape
      const lamp = el("m-light", { type: "point", intensity: 0, distance: 70, color: def.glow }, g);
      R.aegis = { g: g, bars: bars, flare: flare, lamp: lamp, y: AY, z: AZ };
    }

    // v7: armor bar over the head, seen from both sides
    const bar = group({ y: H_FLOOR + 19 }, body);
    R.barW = 21.4;
    box(bar, 0, 0, 0, R.barW + 0.6, 2.1, 0.5, "#111118");
    R.armorFill = box(bar, 0, 0, 0, R.barW, 1.5, 0.7, def.team_lit);
    keepLerp(R.armorFill, "width,x");                // v11m
    [0, 180].forEach((ry) => label(bar, def.name, { y: 2.2, ry: ry, z: ry ? -0.3 : 0.3, width: 10, height: 1.8,
      color: "#111118", "font-color": def.team_lit }, 8));

    // boards and manuals in every room
    roomBoards(R, body, (hx) => {
      manual(body, { x: hx, y: H_FLOOR + 4.05, z: -1.65, ry: -90, width: 5, height: 6.4 }, MANUAL.bridgeA);
      hpPanel(R, body, { x: hx, y: H_FLOOR + 5.8, z: 3.1, ry: -90, width: 3.6, height: 2.4 });
      manual(body, { x: -1.3, y: H_FLOOR + 2.45, z: HEAD.cz - HEAD.d / 2 + HEAD.t + 0.3, width: 5.6, height: 4.1 },
        MANUAL.bridgeB);
      manual(body, { x: -hx, y: H_FLOOR + 6.3, z: 0.5, ry: 90, width: 9, height: 2.2 }, MANUAL.bridgeC);
    });

    R.probe = plateProbe(body, R.plates, R.crew);
    if (SOLID_OUTSIDE) solidifyExterior(R, body);   // v11b - off since v11j
    roomSink = null;
    plateSink = null;
    alarmSink = null;
    floorSink = null;
    return R;
  }

  // ==========================================================
  // v11b: THE OUTSIDE IS SOLID
  // ==========================================================
  // Every visible cube, cylinder and sphere of the robot that isn't
  // inside a room or corridor gets collide="true", so nobody can walk
  // or fly through the hull, the trim, the legs, the arms, the sword
  // or the shield. Left alone:
  //   - anything inside a room or corridor (plates, desks, signs...)
  //     and anything that reaches into one, so the crew is never
  //     blocked by a limb or a trim piece poking through a wall
  //   - anything see-through (opacity set) - glows, glass, halos
  //   - anything hidden or under a hidden group - the aegis, jets,
  //     overlays - so there are no invisible walls
  //   - anything not made by el() (ghostEl effects) and all text
  const SOLID_TAGS = { "M-CUBE": 1, "M-CYLINDER": 1, "M-SPHERE": 1 };
  const D2R_ = Math.PI / 180;
  function numA(n, k, d) { const v = parseFloat(n.getAttribute(k)); return isNaN(v) ? d : v; }
  // three.js Euler XYZ: v' = Rx * Ry * Rz * v
  function rotXYZ(p, rx, ry, rz) {
    let [x, y, z] = p, c, s_;
    c = Math.cos(rz * D2R_); s_ = Math.sin(rz * D2R_); [x, y] = [x * c - y * s_, x * s_ + y * c];
    c = Math.cos(ry * D2R_); s_ = Math.sin(ry * D2R_); [x, z] = [x * c + z * s_, -x * s_ + z * c];
    c = Math.cos(rx * D2R_); s_ = Math.sin(rx * D2R_); [y, z] = [y * c - z * s_, y * s_ + z * c];
    return [x, y, z];
  }
  // the node's rough half-size in its own frame (no rotation)
  function halfSize(n) {
    if (n.tagName === "M-CUBE") return [numA(n, "width", 1) / 2, numA(n, "height", 1) / 2, numA(n, "depth", 1) / 2];
    const r = numA(n, "radius", 0.5) * Math.max(numA(n, "sx", 1), numA(n, "sy", 1), numA(n, "sz", 1));
    return n.tagName === "M-CYLINDER" ? [r, numA(n, "height", 1) / 2, r] : [r, r, r];
  }
  // the node's bounding box in body space (its 8 corners carried up
  // through its own turn and every group's), or null if hidden
  function bodyBox(n, body) {
    const chain = [];
    for (let g = n.parentNode; g && g !== body; g = g.parentNode) {
      if (!g.getAttribute || g.getAttribute("visible") === "false") return null;
      chain.push(g);
    }
    const h = halfSize(n);
    const lo = [Infinity, Infinity, Infinity], hi = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < 8; i++) {
      let p = [(i & 1 ? 1 : -1) * h[0], (i & 2 ? 1 : -1) * h[1], (i & 4 ? 1 : -1) * h[2]];
      [n].concat(chain).forEach((g) => {
        p = rotXYZ(p, numA(g, "rx", 0), numA(g, "ry", 0), numA(g, "rz", 0));
        p = [p[0] + numA(g, "x", 0), p[1] + numA(g, "y", 0), p[2] + numA(g, "z", 0)];
      });
      for (let a = 0; a < 3; a++) { lo[a] = Math.min(lo[a], p[a]); hi[a] = Math.max(hi[a], p[a]); }
    }
    return { lo: lo, hi: hi };
  }
  function solidifyExterior(R, body) {
    // v11c: ANY overlap with a room, corridor or doorway (beyond 2cm of
    // rounding) keeps a part passable. v11b used 0.7m here, which wrongly
    // counted things within 0.7m of a wall or floor - wall panels, floor
    // strips, the order-flash skins - as outside, and made them solid.
    const IN = 0.02;
    // the shoulder domes bulge into the arm bays 9m+ above their floor,
    // out of anyone's way, so the arms are solid all the way up
    const limb = (n) => ["L", "R"].some((k) => R.shoulder && R.shoulder[k] && R.shoulder[k].contains(n));
    const reachesIn = (q) => R.interiors.some((b) =>
      q.hi[0] > b.x0 + IN && q.lo[0] < b.x1 - IN &&
      q.hi[1] > b.y0 + IN && q.lo[1] < b.y1 - IN &&
      q.hi[2] > b.z0 + IN && q.lo[2] < b.z1 - IN);
    let made = 0;
    body.querySelectorAll("m-cube, m-cylinder, m-sphere").forEach((n) => {
      if (!SOLID_TAGS[n.tagName]) return;
      if (n.getAttribute("collide") !== "false") return;           // already solid, or a ghost effect
      if (n.hasAttribute("opacity") || n.hasAttribute("visible")) return;
      const q = bodyBox(n, body);
      if (!q || (reachesIn(q) && !limb(n))) return;
      n.setAttribute("collide", "true");
      made++;
    });
    R.solidCount = made;
  }

  // ==========================================================
  // BUILD BOTH ROBOTS
  // ==========================================================
  const robots = [];
  ROBOTS.forEach((def, i) => {
    const side = group({ ry: i === 0 ? 0 : 180 });
    const R = buildRobot(side, def);
    R.flipped = i === 1;
    R.index = i;
    R.lift = buildLift(R.root, def);
    R.lift.riders = (top) => {
      let n = 0;
      R.crew.forEach((p) => { if (R.lift.inCar(p, top)) n++; });
      return n;
    };
    R.lift.crew = () => Array.from(R.crew.values());
    R.stillSince = 1;               // standing still since load
    robots.push(R);
  });

  // ==========================================================
  // STATE
  // ==========================================================
  let phase = "IDLE";           // IDLE RESET COUNT LIVE OVER
  let countLeft = 0, clockLeft = 0, round = 0;
  let gameTimers = [];
  const center = { x: 0, z: 0 };  // v8: the field is fixed at the origin
  const later = (ms, f) => { const h = setTimeout(f, ms); gameTimers.push(h); return h; };
  function clearGameTimers() { gameTimers.forEach((h) => clearTimeout(h)); gameTimers = []; }

  const occupied = (P) => !!P && P.on.size > 0;
  const enemyOf = (R) => robots[1 - R.index];
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  function normDeg(a) { return ((a + 180) % 360 + 360) % 360 - 180; }

  function resetState(R) {
    R.wins = R.wins || 0;
    R.moving = null; R.moveTok = (R.moveTok || 0) + 1;
    R.lastLeg = null; R.lastDir = 0; R.lastStepAt = 0;
    R.stallUntil = 0;
    R.arm = { L: { charge: 0, coolUntil: 0, throwing: false, lastWind: 0, shown: null },
              R: { charge: 0, coolUntil: 0, throwing: false, lastWind: 0, shown: null } };
    R.shieldUp = false; R.shieldSince = 0;
    R.sock = {};
    SOCKETS.forEach((k) => { R.sock[k] = { heat: 0, burnUntil: 0, powered: false }; });
    R.over = { start: 0, activeUntil: 0, coolUntil: 0 };
    R.fin = 0; R.syncUntil = 0; R.syncPeak = 0;
    R.msg = ""; R.msgUntil = 0;
    R.turnAnimAt = 0; R.turnLeg = "L";
    R.unwinding = false;
    R.coil = { off: 0, side: null, ready: false };
    // v7
    R.armor = ARMOR_MAX; R.down = false;
    R.gear = "walk"; R.gearAt = 0;
    R.sv = 0; R.sprintUntil = 0; R.sx = 0; R.sz = 0;
    R.emote = null; R.emoteUntil = 0; R.emoteLegs = false; R.emoteHit = false;
    R.emoteReadyAt = 0; R.roarReadyAt = 0;
    R.legTok = (R.legTok || 0) + 1;
    R.hurtFlashUntil = 0;
    if (R.seat === undefined) { R.seat = null; R.seatLeftAt = 0; }
    R.jumping = false; R.jumpTok = (R.jumpTok || 0) + 1; R.jumpReadyAt = 0;
    R.airFrom = 0; R.airUntil = 0;
    showOverlay(R.shield, false);
    // latest update
    if (R.route === undefined) R.route = null;
    R.stepLog = []; R.dashReadyAt = 0; R.dashLegAt = 0; R.dashLeg = "L";
    R.blindUntil = 0; R.blindReadyAt = 0;
    R.grabReadyAt = 0; R.heldUntil = 0; R.wsReadyAt = 0; R.shieldLockUntil = 0;
    R.finReadyAt = 0;
    if (R.root && cur(R.root, "y") > 0.5) tween(R.root, { y: 0 }, 900, "inOut");
  }

  function say(R, t) { R.msg = t; R.msgUntil = Date.now() + 2500; }
  const powered = (R, k) => R.sock[k].powered;
  const burnt = (R, k) => Date.now() < R.sock[k].burnUntil;
  const overOn = (R) => false;         // overcharge is gone
  const stalled = (R) => Date.now() < R.stallUntil;
  // v7: robots can be driven between matches too - only LIVE hurts
  const live = (R) => (phase === "LIVE" || phase === "IDLE") && !R.down;
  const canAct = (R) => live(R) && !stalled(R);
  const emoting = (R) => Date.now() < R.emoteUntil;

  // ---- where things are -------------------------------------
  const px = (R) => cur(R.root, "x");
  const pz = (R) => cur(R.root, "z");
  const py = (R) => cur(R.root, "y");
  const ph = (R) => cur(R.root, "ry");
  const sgn = (R) => (R.flipped ? -1 : 1);
  function worldPos(R) { return { x: sgn(R) * px(R), z: sgn(R) * pz(R) }; }
  function worldFwd(R) {
    const h = (ph(R) + (R.flipped ? 180 : 0)) * D2R;
    return { x: Math.sin(h), z: Math.cos(h) };
  }
  // which way something in the world is, from this robot's point of view
  function sideOf(R, wx, wz) {
    const p = worldPos(R);
    const bearing = Math.atan2(wx - p.x, wz - p.z) / D2R;
    const off = normDeg(bearing - (ph(R) + (R.flipped ? 180 : 0)));
    const d = Math.round(Math.hypot(wx - p.x, wz - p.z));
    const dir = Math.abs(off) < 30 ? "AHEAD" : Math.abs(off) > 135 ? "BEHIND" : off > 0 ? "LEFT" : "RIGHT";
    return { d: d, dir: dir };
  }

  // ---- the captain's seat -------------------------------------
  // The first person on the CAPTAIN plate holds the seat. Step off
  // for CAPTAIN_RELEASE_MS and it is free for the next person.
  function isCaptain(R, e) {
    const id = e && e.detail ? e.detail.connectionId : undefined;
    if (R.seat === null) return false;
    if (id === undefined) return occupied(R.st.captain);   // a client that sends no id
    return id === R.seat;
  }
  function tickSeat(R, now) {
    const P = R.st.captain;
    if (R.seat !== null && P.on.has(R.seat)) { R.seatLeftAt = 0; return; }
    if (R.seat !== null) {
      if (!R.seatLeftAt) R.seatLeftAt = now;
      if (now - R.seatLeftAt < CAPTAIN_RELEASE_MS) return;
      R.seat = null;
      R.seatLeftAt = 0;
      say(R, "THE CAPTAIN'S SEAT IS FREE");
    }
    if (P.on.size) {
      R.seat = P.on.values().next().value;
      say(R, "NEW CAPTAIN ON THE BRIDGE");
    }
  }

  // ---- the coil ---------------------------------------------
  function coilOf(R) {
    const E = enemyOf(R);
    const a = worldPos(R), b = worldPos(E);
    const bearing = Math.atan2(b.x - a.x, b.z - a.z) / D2R;
    const heading = ph(R) + (R.flipped ? 180 : 0);
    const off = normDeg(heading - bearing);
    const mag = Math.abs(off);
    return { off: off, side: mag < 1 ? null : off < 0 ? "R" : "L", ready: mag >= COIL_DEG - COIL_TOL && mag <= COIL_MAX };
  }
  const armName = (k) => (k === "L" ? "LEFT" : "RIGHT");
  // What the OTHER crew should be shouting about. R here is the enemy.
  function coilThreat(R) {
    if (phase !== "LIVE" || R.down) return null;
    // v10i: a finisher is the loudest thing on the field
    if (R.syncUntil) {
      return { level: 2, text: "!!! FINISHER FIRING " + secs(R.syncUntil - Date.now()) + " - SHIELD NOW !!!",
        short: "!!! FINISHER !!!" };
    }
    if (R.unwinding) return { level: 2, text: "!! SUPER HIT INCOMING - SHIELD!", short: "!! SUPER HIT!" };
    if (R.fin >= 1 && Date.now() >= R.finReadyAt) {
      return { level: 1, text: "! ENEMY FINISHER IS CHARGED - WATCH THEM", short: "! FINISHER CHARGED" };
    }
    const c = R.coil;
    if (!c || Math.abs(c.off) < COIL_WARN_DEG || Math.abs(c.off) > COIL_MAX) return null;
    const side = armName(c.side);
    if (c.ready) return { level: 1, text: "! ENEMY COILED " + side + " - SUPER PUNCH", short: "! ENEMY COILED" };
    return { level: 1, text: "! ENEMY COILING " + side + " " + Math.round(Math.abs(c.off)) + "DEG", short: "! ENEMY COILING" };
  }

  // ==========================================================
  // ANIMATION
  // ==========================================================
  // Arm angles: rz is "outward", mirrored per side.
  function armTo(R, k, o, ms, ease) {
    const s = k === "L" ? 1 : -1;
    let q = o || {};
    if (k === "R") q = swordSafe(R, q);
    const sh = { rx: q.rx === undefined ? 0 : q.rx, rz: s * (q.rz === undefined ? ARM_FLARE : q.rz) };
    const el = { rx: q.erx === undefined ? -12 : q.erx, rz: s * (q.erz === undefined ? 0 : q.erz) };
    // v11i: the arms move in the players' clients (one message per move,
    // smooth at their frame rate) instead of 20 server steps a second
    const mv = SMOOTH_ARMS ? glide : tween;         // v11k: switchable, for testing frame rate
    mv(R.shoulder[k], sh, ms, ease || "inOut");
    mv(R.elbow[k], el, ms, ease || "inOut");
    // v10m: the shield turns with the arm - square to the front while it
    // is raised or bashing, carried at the side the rest of the time
    if (k === "L" && R.shieldArt) {
      const facing = R.shieldUp || R.bashing;
      mv(R.shieldArt, facing ? shieldFacing(sh.rx, sh.rz, el.rx, el.rz) : SHIELD_STOWED, ms, ease || "inOut");
    }
    R.arm[k].shown = null;
  }
  const IDLE_ARM = {};
  const GUARD_ARM = { rx: -35, erx: -95 };
  function legsTo(R, p, ms, ease) {
    ["L", "R"].forEach((k) => {
      const q = p[k] || {};
      tween(R.hip[k], { rx: q.hip || 0 }, ms, ease || "inOut");
      tween(R.knee[k], { rx: q.knee || 0 }, ms, ease || "inOut");
      tween(R.ankle[k], { rx: q.ank || 0 }, ms, ease || "inOut");
    });
  }
  const LEGS_ZERO = {};
  // A step in three beats: lift the knee, reach, plant - while the
  // other leg pushes off its toes. amp scales it for a sprint.
  // The newest step always wins (legTok).
  function legStep(R, leg, dir, ms, amp) {
    const tok = ++R.legTok;
    const other = leg === "L" ? "R" : "L";
    const a = amp || 1;
    const f = dir >= 0;
    const go = (p, t, dur, ease) => setTimeout(() => { if (tok === R.legTok && !R.down) legsTo(R, p, dur, ease); }, t);
    const p1 = {}, p2 = {}, p3 = {};
    p1[leg] = f ? { hip: -30 * a, knee: 55 * a, ank: 8 } : { hip: 16 * a, knee: 45 * a, ank: 6 };
    p1[other] = f ? { hip: 10 * a, knee: 4 * a, ank: -14 } : { hip: -8 * a, knee: 6 * a, ank: 8 };
    p2[leg] = f ? { hip: -26 * a, knee: 12 * a, ank: -6 } : { hip: 14 * a, knee: 10 * a, ank: 4 };
    p2[other] = f ? { hip: 12 * a, knee: 8 * a, ank: -18 } : { hip: -10 * a, knee: 4 * a, ank: 10 };
    p3[leg] = {}; p3[other] = {};
    go(p1, 0, ms * 0.35, "out");
    go(p2, ms * 0.35, ms * 0.3, "inOut");
    go(p3, ms * 0.65, ms * 0.35, "in");
  }
  // arms swing against the legs: the arm opposite the stepping leg
  // comes forward. Sprinting pumps hard; walking swings from guard.
  function armSwing(R, leg, ms, sprint) {
    const now = Date.now();
    ["L", "R"].forEach((k) => {
      const A = R.arm[k];
      if (emoting(R) || A.throwing) return;
      if (k === "L" && R.shieldUp) return;   // v10g: the shield arm stays put
      if (!sprint && A.charge > 0.02) return;
      const fwd = k !== leg;
      const fighting = phase === "LIVE" || phase === "COUNT";
      const p = sprint
        ? { rx: fwd ? -65 : 40, rz: 8, erx: fwd ? -105 : -70 }
        : fighting ? { rx: GUARD_ARM.rx + (fwd ? -10 : 8), erx: GUARD_ARM.erx }
        : { rx: fwd ? -16 : 12, erx: fwd ? -30 : -14 };
      armTo(R, k, p, ms * (sprint ? 0.8 : 0.9), "inOut");
      A.shown = "swing" + now;
    });
  }

  // ---- lines, sparks, flashes -------------------------------
  function paintLines(R, now) {
    const blink = Math.floor(now / 200) % 2 === 0;
    const dim = mix(R.def.dark, R.def.glow, 0.35);
    SOCKETS.forEach((k) => {
      const S = R.sock[k];
      let c;
      if (now < S.burnUntil) c = blink ? "#ff2d3d" : "#3a0a10";
      else if (S.powered) c = overOn(R) ? "#ffffff" : R.def.glow;
      else if (S.heat > 0.7) c = blink ? "#ff8a2e" : dim;
      else c = dim;
      if (k === "legs" && R.sv > 0.5) c = blink ? "#ffffff" : R.def.glow;
      R.lines[k].forEach((n) => setColor(n, c));
    });
    // v10p: the shield's own lights follow the SHIELD BEING UP, not just the
    // power room. Down: dim. Up: bright team colour. Up and powered:
    // white-hot. Last 2 seconds of the hold: it flickers, so both crews can
    // see it's about to drop.
    if (R.aegis) {
      const up = R.shieldUp;
      const pw = powered(R, "shield");
      const hold = pw ? SHIELD_UP_MAX_P : SHIELD_UP_MAX_MS;
      const dying = up && hold - (now - R.shieldSince) < 2000 && Math.floor(now / 250) % 2 === 0;
      const lit = pw ? mix(R.def.glow, "#ffffff", 0.5) : R.def.glow;   // v11j: powered is pale team colour, not pure white
      const c = up ? (dying ? mix(lit, "#000000", 0.65) : lit) : mix(R.def.dark, R.def.glow, 0.35);
      R.aegis.bars.forEach((n) => setColor(n, c));
      R.lines.shield.forEach((n) => setColor(n, c));
      const li = !up ? 0 : dying ? 4 : pw ? 22 : 14;          // v11j: was 8 / 55 / 35
      if (R.aegis.li !== li) { R.aegis.li = li; R.aegis.lamp.setAttribute("intensity", String(li)); }
      const fw = pw ? 22 : 14;
      if (up && R.aegis.fw !== fw && !(now < (R.aegisHitUntil || 0))) { R.aegis.fw = fw; set(R.aegis.flare, { width: fw }); }
    }
    const syncing = R.syncUntil > 0;
    const hurt = now < R.hurtFlashUntil;
    const blind = now < (R.blindUntil || 0);
    const vis = R.down ? "#222222" : blind ? "#ffffff" : hurt && blink ? "#ff2d3d" : syncing || overOn(R) || emoting(R) ? (blink ? "#ffffff" : R.def.glow) : R.def.glow;
    const ordC = coreOrderColor(R, now);   // v10z
    setColor(R.core, R.down ? "#333333" : syncing ? (blink ? "#ffffff" : R.def.glow) : ordC || (overOn(R) ? "#ffffff" : R.def.glow));
    if (R.coreHalo) setColor(R.coreHalo, !R.down && !syncing && ordC ? ordC : R.def.glow);
    R.visor.forEach((n) => setColor(n, vis));
    if (R.coil && R.coil.ready && phase === "LIVE") {
      const key = R.coil.side === "L" ? "larm" : "rarm";
      if (!(now < R.sock[key].burnUntil)) R.lines[key].forEach((n) => setColor(n, blink ? "#ffd166" : "#ff9a2e"));
    }
    const threat = coilThreat(enemyOf(R));
    const fast = Math.floor(now / 120) % 2 === 0;
    const bar = !threat ? ALARM_OFF : threat.level === 2 ? (fast ? "#ff2d3d" : "#ffffff") : (blink ? "#ff9a2e" : ALARM_OFF);
    R.alarms.forEach((n) => { if (!n._order) setColor(n, bar); });
    const jets = now < (R.jetUntil || 0);
    if (jets !== R.jetsShown) {
      R.jetsShown = jets;
      R.jets.forEach((n) => n.setAttribute("visible", jets ? "true" : "false"));
    }
    // armor bar over the head
    const frac = R.armor / ARMOR_MAX;
    const w = Math.max(0.01, R.barW * frac);
    const key = Math.round(w * 10);
    if (R.barShown !== key) {
      R.barShown = key;
      glide(R.armorFill, { width: w, x: -(R.barW - w) / 2 }, 300, "out");
    }
    setColor(R.armorFill, hurt ? "#ffffff" : frac < 0.3 ? (blink ? "#ff2d3d" : "#661020") : R.def.team_lit);
  }

  function pop(parent, x, y, z, r0, r1, color, ms) {
    const f = sph(parent, x, y, z, r0, color, { opacity: 0.9 });
    glide(f, { radius: r1 }, ms, "out");             // v11h: client-side
    setTimeout(() => { if (f.parentNode) f.parentNode.removeChild(f); }, ms + 150);
  }
  function popWorld(R, wx, wy, wz, r0, r1, color, ms) {
    const s = sgn(R);
    pop(R.side, s * wx, wy, s * wz, r0, r1, color, ms);
  }
  function ring(R, x, z, r0, r1, color, ms) {
    const d = cyl(R.root, x, 0.5, z, r0, 0.2, color, { opacity: 0.55 });
    glide(d, { radius: r1 }, ms, "out");             // v11h: client-side
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, ms + 150);
  }
  function dust(R, leg, big) {
    ring(R, (leg === "L" ? 1 : -1) * HIP_X, 1, 5, big ? 24 : 18, "#cfc4ff", big ? 1000 : 900);
  }
  const SPARK_AT = {
    larm: [SHOULDER.x + 3, 42, 4], rarm: [-SHOULDER.x - 3, 42, 4],
    legs: [0, 22, 5], shield: [SHOULDER.x + 5, 38, 6], fin: [0, C_FLOOR + 7, CHEST.d / 2 + 1],
  };
  function sparks(R, k) {
    const [x, y, z] = SPARK_AT[k];
    for (let i = 0; i < 5; i++) {
      setTimeout(() => pop(R.root, x + (Math.random() - 0.5) * 6, y + (Math.random() - 0.5) * 6,
        z + Math.random() * 3, 0.6, 3, i % 2 ? "#ffb347" : "#ff2d3d", 500), i * 160);
    }
  }
  function light(R, k) { R.lines[k].forEach((n) => setColor(n, "#ffffff")); }

  // ==========================================================
  // DAMAGE
  // ==========================================================
  function digIn(E) { return (occupied(E.st.lfwd) ? 1 : 0) + (occupied(E.st.rfwd) ? 1 : 0); }
  // returns the damage actually done
  // v9: THE FLOORS FLASH RED when the robot is hurt, in every room,
  // so the whole crew knows. Bigger hits flash more times.
  const FLOOR_RED = "#ff1a2e", FLOOR_RED_DIM = "#6e0a14";
  const FLOOR_PULSE_MS = 360;
  function floorFlash(R, dmg) {
    if (!R.floors || !R.floors.length) return;
    const tok = (R.floorTok = (R.floorTok || 0) + 1);
    R.floors.forEach((n) => { if (n._floorBase === undefined) n._floorBase = n.getAttribute("color"); });
    const paint = (c) => R.floors.forEach((n) => setColor(n, c === null ? n._floorBase : c));
    const pulses = dmg >= 12 ? 3 : dmg >= 6 ? 2 : 1;
    R.floorRedUntil = Date.now() + pulses * FLOOR_PULSE_MS;
    for (let i = 0; i < pulses; i++) {
      setTimeout(() => { if (tok === R.floorTok) paint(FLOOR_RED); }, i * FLOOR_PULSE_MS);
      setTimeout(() => { if (tok === R.floorTok) paint(i === pulses - 1 ? null : FLOOR_RED_DIM); },
        i * FLOOR_PULSE_MS + 230);
    }
  }
  function hurt(E, dmg, attacker) {
    const practice = phase === "IDLE";
    if ((phase !== "LIVE" && !practice) || E.down) return 0;
    let m = 1;
    if (E.gear === "brace") m *= Math.max(0.3, BRACE_DMG - DIG_IN * digIn(E));
    if (Date.now() < E.sprintUntil) m *= SPRINT_DMG;
    if (emoting(E)) { m *= SHOWBOAT_DMG; E.emoteHit = true; }
    const d = Math.max(1, Math.round(dmg * m));
    E.armor = Math.max(0, E.armor - d);
    E.hurtFlashUntil = Date.now() + 500;
    floorFlash(E, d);
    E.lastHitAt = Date.now();
    if (practice) {
      if (E.armor <= 0) {
        E.armor = ARMOR_MAX;
        say(E, "PRACTICE KO - ARMOR REFILLED");
        say(attacker || enemyOf(E), "PRACTICE KO! START A MATCH FOR POINTS");
      }
      return d;
    }
    if (E.armor <= 0) knockOut(E, attacker);
    return d;
  }
  function knockOut(E, winner) {
    if (E.down) return;
    E.down = true;
    E.moveTok++; E.moving = null; E.sv = 0;
    E.syncUntil = 0; E.shieldUp = false;
    showOverlay(E.shield, false);
    shieldPose(E, false);
    endEmote(E, false);
    E.legTok++;
    // down on one knee
    legsTo(E, { L: { hip: -40, knee: 80, ank: -40 }, R: { hip: -10, knee: 95, ank: -30 } }, 2200, "inOut");
    armTo(E, "L", { rx: 15, rz: 20, erx: -5 }, 1800);
    armTo(E, "R", { rx: 15, rz: 20, erx: -5 }, 1800);
    E.jumping = false; E.jumpTok++;
    tween(E.root, { y: -7.3 }, 2500, "inOut");
    say(E, "ARMOR GONE - WE'RE DOWN");
    const W = winner || enemyOf(E);
    say(W, "THEY'RE DOWN!");
    endRound(W, E.def.name + " IS DOWN");
  }
  function standUp(R) {
    R.legTok++;
    legsTo(R, LEGS_ZERO, 2200, "inOut");
    tween(R.root, { y: 0 }, 2500, "inOut");
  }

  // ==========================================================
  // MOVEMENT
  // ==========================================================
  function moveTo(R, x, z, ms, kind, ease, done) {
    const tok = ++R.moveTok;
    R.moving = kind;
    tween(R.root, { x: x, z: z }, ms, ease || "inOut");
    setTimeout(() => {
      if (tok !== R.moveTok) return;
      R.moving = null;
      if (done) done();
    }, ms + 30);
  }
  function pivot(R, deg, ms, done) {
    const tok = ++R.moveTok;
    R.moving = "pivot";
    tween(R.root, { ry: ph(R) + deg }, ms, "inOut");
    setTimeout(() => { if (tok !== R.moveTok) return; R.moving = null; if (done) done(); }, ms + 30);
  }
  function stumble(R, ms) {
    R.lastLeg = null;
    R.sv = 0;
    endDash(R);
    R.stallUntil = Date.now() + (ms || STUMBLE_MS);
    say(R, "STUMBLE! LOST THE SPRINT");
    R.legTok++;
    legsTo(R, { L: { hip: -12, knee: 30, ank: -8 }, R: { hip: 10, knee: 22, ank: -6 } }, 400, "out");
    setTimeout(() => legsTo(R, { L: { hip: 8 }, R: { hip: -10, knee: 30 } }, 500), 450);
    setTimeout(() => { if (!R.down) legsTo(R, LEGS_ZERO, 700); }, 1000);
  }

  // One leg crew stepped. The captain's gear decides what it does.
  function tryStep(R, leg, dir) {
    if (emoting(R) && R.emoteLegs) return endEmote(R, false, "LEGS CANCELLED THE " + R.emote);
    if (!canAct(R) || R.unwinding) return;
    if (R.jumping) return;
    const now = Date.now();
    if (R.gear === "brace") return say(R, "BRACED - LEGS STAND ON FWD TO DIG IN");
    // v10d: the shield no longer roots us - walk in behind it
    if (burnt(R, "legs")) return say(R, "LEGS BURNT OUT");
    const prevLeg = R.lastLeg, prevDir = R.lastDir, prevAt = R.lastStepAt;
    const me = leg === "L" ? "LEFT" : "RIGHT";
    const them = leg === "L" ? "RIGHT" : "LEFT";
    const pw = powered(R, "legs") || overOn(R);

    if (R.gear === "sprint") {
      if (dir < 0) return say(R, "NO BACKING UP IN A SPRINT");
      if (R.moving && R.moving !== "sprint") return;
      R.lastLeg = leg; R.lastDir = dir; R.lastStepAt = now;
      if (prevLeg === leg && prevDir > 0 && now - prevAt < SPRINT_BEAT_MS) return stumble(R, SPRINT_STUMBLE_MS);
      const inBeat = prevLeg && prevLeg !== leg && prevDir > 0 && now - prevAt < SPRINT_BEAT_MS;
      const ms = 850;
      legStep(R, leg, 1, ms, inBeat ? 1.5 : 1);
      armSwing(R, leg, ms, true);
      if (!inBeat) return say(R, me + " LEG SET - " + them + " LEG, GO!");
      R.sprintUntil = now + SPRINT_BEAT_MS;
      setTimeout(() => dust(R, leg, true), ms * 0.7);
      light(R, "legs");
      return;
    }

    // WALK - the v6 leg rule
    // v9b: mid-dash, alternating FWD steps keep the dash running
    if (now < R.sprintUntil) {
      if (dir < 0) return say(R, "NO BACKING UP MID-DASH");
      const same = prevLeg === leg;
      R.lastLeg = leg; R.lastDir = dir; R.lastStepAt = now;
      if (same) { endDash(R); return stumble(R, SPRINT_STUMBLE_MS); }
      R.sprintUntil = Math.min(now + DASH_BEAT_MS, R.dashStart + DASH_MAX_MS);
      R.lastFwdAt = now;
      light(R, "legs");
      setTimeout(() => dust(R, leg, true), 120);
      return;
    }
    if (R.moving) return;
    R.lastLeg = leg; R.lastDir = dir; R.lastStepAt = now;
    const ms = pw ? STEP_MS_P : STEP_MS;
    if (!prevLeg) {
      R.stepLog = dir > 0 ? [{ leg: leg, at: now }] : [];
      legStep(R, leg, dir, ms, 0.5);
      return say(R, me + " LEG READY - " + them + " LEG STEP!");
    }
    if (prevLeg === leg || prevDir !== dir) {
      const yaw = (leg === "L" ? -1 : 1) * dir * (pw ? PIVOT_DEG_P : PIVOT_DEG);
      light(R, "legs");
      legStep(R, leg, dir, ms, 1);
      armSwing(R, leg, ms, false);
      pivot(R, yaw, ms, () => dust(R, leg));
      R.stepLog = [];
      return say(R, prevLeg === leg ? "ONLY " + me + " LEG - SPINNING!" : "LEGS OPPOSITE - SPINNING!");
    }
    const dist = (pw ? STRIDE_P : STRIDE) * dir;
    const h = ph(R) * D2R;
    let dx = Math.sin(h) * dist, dz = Math.cos(h) * dist;
    const E = enemyOf(R), we = worldPos(E), wr = worldPos(R), s = sgn(R);
    const gapAt = (t) => Math.hypot(wr.x + s * dx * t - we.x, wr.z + s * dz * t - we.z);
    if (gapAt(1) < MIN_GAP && gapAt(1) < gapAt(0)) {
      let lo = 0, hi = 1;
      for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; if (gapAt(m) < MIN_GAP) hi = m; else lo = m; }
      if (lo < 0.05) { legStep(R, leg, 0.3, ms, 0.4); return say(R, "TOO CLOSE - PUNCH!"); }
      dx *= lo; dz *= lo;
    }
    light(R, "legs");
    legStep(R, leg, dir, ms, 1);
    armSwing(R, leg, ms, false);
    moveTo(R, px(R) + dx, pz(R) + dz, ms, "step", "inOut", () => dust(R, leg));
    if (dir > 0) R.lastFwdAt = now; else R.lastBackAt = now;
    // a forward step in turn counts towards being IN SYNC
    if (dir > 0) {
      R.stepLog.push({ leg: leg, at: now });
      if (R.stepLog.length > SYNC_STEPS) R.stepLog.shift();
      if (legsInSync(R) && now >= R.dashReadyAt) tryDash(R);
    } else R.stepLog = [];
    if (/SPINNING|READY/.test(R.msg)) R.msgUntil = 0;
  }

  // knockback slides the robot; bracing soaks most of it
  function knockBack(E, wx, wz, dist, speed, ignoreBrace) {
    if (E.down) return;
    // v10c: a POWERED shield is planted - nothing shifts it, ram included
    if (E.shieldUp && powered(E, "shield")) {
      if (Date.now() > (E.plantSaidAt || 0) + 2500) {
        E.plantSaidAt = Date.now();
        say(E, "POWERED SHIELD HELD - NO KNOCKBACK");
        say(enemyOf(E), "THEY DIDN'T BUDGE - POWERED SHIELD");
      }
      return;
    }
    const d = dist * (E.gear === "brace" && !ignoreBrace ? BRACE_KNOCK : 1);
    if (d < 0.3) return;
    E.sv = 0; endDash(E);
    const s = sgn(E);
    const ms = Math.max(700, (d / (speed || KNOCK_SPEED)) * 1000);
    E.legTok++;
    legsTo(E, { L: { hip: 10, knee: 14 }, R: { hip: -8, knee: 18 } }, 300, "out");
    later(Math.min(ms, 900), () => { if (!E.down) legsTo(E, LEGS_ZERO, 600); });
    moveTo(E, px(E) + s * wx * d, pz(E) + s * wz * d, ms, "knock", "out");
  }

  // ==========================================================
  // PUNCHES
  // ==========================================================
  function tryPunch(R, k) {
    if (emoting(R)) return endEmote(R, false, "ARMS CANCELLED THE " + R.emote);
    if (!canAct(R)) return;
    if (Date.now() < R.sprintUntil) return say(R, "NO HITS MID-DASH");
    const A = R.arm[k];
    const key = k === "L" ? "larm" : "rarm";
    const now = Date.now();
    if (A.throwing || now < A.coolUntil) return;
    if (burnt(R, key)) return say(R, armName(k) + " ARM BURNT OUT");
    if (R.unwinding) return;
    if (A.charge < MIN_CHARGE) return say(R, k === "R" ? "PULL BACK FIRST, THEN SLASH" : "PULL BACK FIRST, THEN BASH");
    const power = A.charge;
    A.charge = 0;
    A.throwing = true;
    A.shown = null;
    light(R, key);
    const sword = k === "R";
    const c = coilOf(R);
    // time from starting the arm to the hit landing is THROW_MS + pre
    const pre = sword ? SWORD_HIT_AT - THROW_MS : 90;
    const throwArm = (ms) => {
      if (sword) return swordSwing(R, power > 0.9 || c.ready);
      // v10m: SHIELD BASH - draw the shield in to the chest, then shove
      // it straight out, face first. Same reach and damage as the punch.
      R.bashing = true;
      armTo(R, k, { rx: -40, rz: -5, erx: -100 }, 110, "out");
      setTimeout(() => armTo(R, k, { rx: -80, rz: -8, erx: -15 }, ms, "in"), 110);
    };
    if (c.ready && c.side === k) {
