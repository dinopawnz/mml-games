<!--
  SKY DRAGON  v30  -  a rideable dragon for an Otherside world
  ============================================================
  v30: CONTROL BOARD ONLY. Standing out on a wing no longer turns the
  dragon - the only way to fly or walk it is the control board (and the
  CALL keypad on the pad). The wing decks are still there as solid floor
  to walk on, and still count as riders aboard. Set DECK_STEER = true
  to bring wing steering back.

  v29: FLYING AFTER WALKING. Pressing GO, UP or HOME while it was still
  walking or sprinting (or still slowing down from a STOP) took off
  with the legs frozen mid-stride: the walk never got the chance to
  finish, so the flying pose - legs tucked, body bobbing - was never
  put back. Leaving the ground now always ends the walk first.
  Everything else, buttons included, is v28's.

  v28: BACK TO THE v16/v24 BUTTONS. v25-v27 are thrown away. This is
  the file whose buttons worked, with only these changes:
  * The floor you stand on no longer tips back when it climbs or sideways
    in turns - only the dragon you see leans. (Riders slid off the back.)
    The board is not touched by this.
  * The back wall is the thin v24 wall again. BACK_D sets how deep it is:
    0.2 is v24. v25 made it 4 and the buttons went wrong after that, so
    only raise it if you want to test whether that was the cause.
  * Words only: LEFT and RIGHT without < >, no pictures on SLOWER and
    FASTER, and the text is sized so no word is cut off. The buttons
    themselves - size, place, how they are clicked - are v24's exactly.

  v24: NO HEIGHT LIMIT. MAX_ALT is 0 (off), so UP keeps climbing
  until you press DOWN or turn (a turn holds your height).
  HOME from very high takes a while - it comes down at the normal
  climb rate. Set MAX_ALT back to 180 to restore the old ceiling.

  One dragon on a landing pad. Walk up the ramp onto its back and
  fly it from the control board at the front of the saddle:

    GO                 fly straight ahead, and keep going
    STOP               stop and hover in place, wings flapping
    UP / DOWN          climb or descend - straight up/down when stopped,
                       diagonally when going. It keeps going until you
                       press the other one, turn, or reach the limit.
                       Stopped over the ground, DOWN lands it.
    < LEFT / RIGHT >   turn 30 degrees (presses add up), holding height
    FASTER / SLOWER    the arrow keys on the right: speed 1-6
                       (6, 12, 20, 30, 42, 60 m/s)
    FIRE               breathe fire onto the ground for FIRE_MS
    HOME               fly back to the pad and land on it
    WALK / SPRINT      on the ground, walk or run on four legs (from the
                       air it comes down first). Steer with LEFT/RIGHT
                       (v30: the wing decks no longer steer); STOP stands still; GO or UP
                       takes off.

  THE CALL KEYPAD stands on the pad beside the foot of the ramp.
  Type 1 7 1 8 (or press TYPE and enter it). Nobody on the dragon:
  it is back on the pad at once. Riders on it: it flies them home.

  v11: A better-looking dragon - sculpted body, armour plates, real
  bat wings with fingers and scalloped glowing edges, clawed legs, a
  finned tail blade. The wing decks still steer exactly as before
  (stand out over a wing to turn that way) but are no longer drawn.

  v2: v1 did not take off because its buttons could not be clicked -
  their labels sat in front of them and were not solid. Every button
  is now a cap with a clickable label on it, built the way the Titan
  Roamer's desk is. Movement now uses the Titan Roamer's proven
  method too, twenty updates a second, each one glided to.

  SMOOTH MOVEMENT
  ------------------------------------------------------------
  The script works out where the dragon is twenty times a second and
  every screen glides it between those points (m-attr-lerp), so it
  moves continuously at whatever frame rate the screen runs. This
  standalone file does very little else, so the updates arrive on
  time - the Kingdom Clash dragon jumps because that world's script is
  busy with 16,000 other things.
  USE_GLIDE = true tries v1's method instead (one instruction per
  change, run by each screen from document time); keep it off unless
  you want to test it.

  THINGS THAT CAN ONLY BE PROVEN IN YOUR WORLD
  ------------------------------------------------------------
  1. Riders being CARRIED. The saddle is a solid floor with walls and
     a roof you cannot see. Whether the Otherside client carries an
     avatar standing on a moving floor is up to the client, not this
     file. It has the best chance it can: the floor moves smoothly
     instead of jumping.
  2. LEFT and RIGHT are worked out for a rider facing forward. If
     they come out mirrored, set TURN_FLIP = -1.
  3. The world is assumed flat at y = 0 with the pad at the origin.
     Move everything with the root group, or change PAD_X / PAD_Z.
-->
<m-group id="root"></m-group>

<script>
(function () {
  "use strict";

  // ==========================================================
  // SETTINGS
  // ==========================================================
  const PAD_X = 0, PAD_Z = 0;         // where the landing pad is
  // v7: THE EDGE. v6 turned the dragon round 450 m from the pad - at
  // full speed (60 m/s) that is under eight seconds of flying, which is
  // why it seemed to turn round by itself. It is now 4 km, and the
  // board says so when it happens. Set BOUND_R = 0 to switch it off.
  const BOUND_R = 0;                  // v8: no edge at all - it flies until you turn it
  // v24: NO CEILING. It climbs as long as you hold UP. Put a number
  // back here (e.g. 180) to bring a ceiling back; 0 means none.
  const MAX_ALT = 0;                  // highest it will climb (saddle height), 0 = no limit
  // v14: THE LOOK - the frost dragon, in nine parts so its wings flap,
  // its neck and head move and its legs fold: the dragon_..._hq.glb files.
  // Otherside only loads models from a web address, so upload the three
  // files to one folder online and put that folder's address here,
  // ending in "/". Left "" it shows the old block-built dragon, with a
  // sign on the pad saying so.
  const MODEL_BASE = "https://cdn.jsdelivr.net/gh/dinopawnz/skydragon@main/";
  const MODEL_SCALE = 14;             // size: 14 is about 32 m nose to tail, 24 m wingtip to wingtip
  const USE_MODEL = MODEL_BASE !== "";
  // where things are on the model, in its own units (it is ~2 units long)
  const MODEL_Y = -0.075 * MODEL_SCALE, MODEL_Z = -0.27 * MODEL_SCALE;   // its back (the gold harness) sits under the saddle floor
  const MODEL_JAW_Y = 0.22 * MODEL_SCALE + MODEL_Y, MODEL_JAW_Z = 0.93 * MODEL_SCALE + MODEL_Z;
  // v15: WALK and SPRINT - on the ground, on four legs
  const WALK_SPEED = 5, SPRINT_SPEED = 16;      // m/s
  const WALK_SWING = 28, SPRINT_SWING = 42;     // degrees each leg swings forward and back - bigger = longer strides
  const WALK_LIFT = 1.1, SPRINT_LIFT = 2.0;     // metres a foot lifts as it steps forward
  const STOP_DECEL = 7;                         // m/s per second slowing down after STOP
  const GROUND_TURN_RATE = 45;                  // degrees per second turning on the ground
  const NECK_SWAY = 5, NECK_NOD = 3;  // degrees the neck sways side to side and nods
  const HEAD_NOD = 5, HEAD_TURN = 4;   // degrees the head nods and looks around
  const LEG_FOLD_FRONT = 55, LEG_FOLD_BACK = 30;   // front legs curl up under the chest in flight
  const FRONT_TUCK_LIFT = 0.6;       // metres the front legs draw up as they curl   // degrees the legs tuck back in flight
  const WING_DOWN = 30, WING_UP = 8;
  // v19: the model's spine runs a little right of its own centre line.
  // The left wing (a mirror of the right) is placed as a mirror about the
  // spine, and the whole dragon is shifted so its spine sits on the
  // saddle's centre line.
  const SPINE_X = 0.032;   // how far the wings sweep down and up (degrees)
  const PERCH_Y = USE_MODEL ? 0.3 + 0.73 * MODEL_SCALE : 4.2;   // saddle floor height when it sits on the pad (the model stands on its legs)
  const MIN_FLY_Y = PERCH_Y + 2;      // lowest it flies when not landing
  const GEARS = [0, 6, 12, 20, 30, 42, 60];   // m/s - gear 0 is only used when stopped
  const ACCEL = 24;                   // m/s per second, speeding up or slowing down (v4: was 14)
  const TURN_STEP = 30;               // degrees per LEFT/RIGHT press
  const TURN_RATE = 80;               // degrees per second while turning (v4: was 55)
  const TURN_FLIP = 1;                // -1 if left and right come out mirrored
  const ALT_STEP = 12;                // metres per UP/DOWN press
  const CLIMB_RATE = 9;               // metres per second up or down
  const VY_ACCEL = 30;                // how quickly a climb or descent starts and stops (v4: was 14)
  const FIRE_MS = 7000;               // how long one breath lasts
  const FIRE_COOL_MS = 2500;          // rest after a breath
  const FIRE_R = 9;                   // radius of the fire on the ground
  // v21: FIRELIGHT. Where the fire hits, it lights up the ground around
  // it - a flash as it first lands, then a flickering orange glow while
  // it burns, fading out after. Brightness is in Otherside's units
  // (the Titan Roamer's big flash is 8).
  const FIRE_LIGHT = 7;               // the flickering glow on the ground
  const FIRE_FLASH = 16;              // the flash as it first hits
  const FIRE_LIGHT_REACH = 55;        // metres the firelight reaches
  // v22: where the fire sits on the ground. FIRE_GROUND_Y is the height
  // of the world's ground (0 = level with the landing pad's base);
  // FIRE_SINK tucks the fire's base just into the ground so it never
  // floats above it.
  const FIRE_GROUND_Y = 0;
  const FIRE_SINK = 1.0;
  const CODE = [1, 7, 1, 8];          // v3: the CALL keypad on the pad
  const CODE_TIMEOUT = 15;            // seconds before a half-typed code is forgotten

  const BOARD_TILT = 25;              // degrees the control boards tip up towards you (0 = flat)

  const TICK_MS = 40;                 // how often the script thinks (and sends where it is) - v4: 25 a second
  const USE_GLIDE = false;            // v1's document-time glides; off - see send()
  const SEG_S = 10;                   // each glide instruction runs this long...
  const REFRESH_MS = 6000;            // ...and is renewed this often while flying straight
  const TURN_SEND_MS = 150;           // and this often while turning or climbing

  // colours: obsidian and cyan light, with real fire
  const OBSIDIAN = "#0a1116", OBSIDIAN_2 = "#111c23", BELLY = "#1a2a33";
  const NEON = "#35f2ff", NEON_DIM = "#1a8fa3", MEMBRANE = "#0d2a33";
  const HORN = "#c9d6dc", INK = "#03080b", CHALK = "#d6fdff";
  const FIRE_RED = "#ff2210", FIRE_ORANGE = "#ff5a14", FIRE_HOT = "#ffd23a", FIRE_WHITE = "#fff4c8", FIRE_DEEP = "#c41200";
  const OK_GRN = "#5fe08a", CALL_RED = "#ff4a3a", GOLD = "#ffc94a";

  // ==========================================================
  // HELPERS
  // ==========================================================
  const rootEl = document.getElementById("root");
  // v6: NOTHING IS SOLID UNLESS IT SAYS SO. MML makes every shape solid
  // by default, so every scale, spike, neck plate, rail and flame was
  // something to bump into. Now only what is marked collide: "true" is
  // solid - the saddle floor, the board and its buttons, the invisible
  // walls and roof of the saddle, the pad, the ramp and the keypad.
  const SOLID_BY_DEFAULT = false;
  function el(tag, attrs, parent) {
    const n = document.createElement(tag);
    if (!SOLID_BY_DEFAULT && (tag === "m-cube" || tag === "m-cylinder" || tag === "m-sphere" || tag === "m-label")
        && !(attrs && attrs.collide !== undefined)) n.setAttribute("collide", "false");
    for (const k in attrs) {
      if (attrs[k] === undefined || attrs[k] === null) continue;
      let v = attrs[k];
      if (typeof v === "number") v = Math.round(v * 1000) / 1000;
      n.setAttribute(k, String(v));
    }
    (parent || rootEl).appendChild(n);
    return n;
  }
  function group(o, parent) { return el("m-group", o || {}, parent); }
  function box(p, x, y, z, w, h, d, color, o) {
    return el("m-cube", Object.assign({ x: x, y: y, z: z, width: w, height: h, depth: d, color: color }, o || {}), p);
  }
  // v5: EVERY LABEL'S TEXT IS SIZED TO FIT IT. MML does not shrink
  // text for you - text too big for its label is cut off, and on a
  // short wide button that means the word simply is not there. v4 gave
  // every button the same size, so "< LEFT", "RIGHT >", "SLOWER",
  // "FASTER" and the readout came out blank. The size is now worked out
  // from the label's width, height and how many letters it holds (the
  // Titan Roamer's fitFS, proven in your world), and worked out again
  // whenever the text changes. A "font-size" given is the most it may be.
  const FS_SAFE = 0.85;              // v28: was 0.9
  function fitFS(w, h, chars, cap) {
    const byHeight = h * 80;
    const byWidth = ((w * 100) / (Math.max(1, chars) * 0.72)) * FS_SAFE;   // v28: 0.55 cut off DOWN, LEFT, RIGHT
    return Math.max(6, Math.floor(Math.min(cap === undefined ? Infinity : cap, byHeight, byWidth)));
  }
  const FIT = new Map();              // label -> {w, h, cap}
  function label(p, o) {
    const w = +o.width || 1, h = +o.height || 0.5, cap = o["font-size"];
    const txt = String(o.content == null ? "" : o.content);
    const n = el("m-label", Object.assign({}, o, { alignment: "center",
      "font-size": fitFS(w, h, Math.max(4, txt.length), cap) }), p);
    FIT.set(n, { w: w, h: h, cap: cap });
    return n;
  }
  function anim(p, attr, a, b, ms, o) {
    o = o || {};
    return el("m-attr-anim", {
      attr: attr, start: a, end: b, duration: Math.round(ms),
      loop: o.loop === false ? "false" : "true",
      "ping-pong": o.pingpong === false ? undefined : "true",
      easing: o.easing,
    }, p);
  }
  function lerpOn(p, attrs, ms, easing) {
    return el("m-attr-lerp", { attr: attrs, duration: Math.round(ms), easing: easing || "linear" }, p);
  }
  function set(n, k, v) {
    if (!n) return;
    const sv = typeof v === "number" ? String(Math.round(v * 1000) / 1000) : String(v);
    if (n.getAttribute(k) === sv) return;
    n.setAttribute(k, sv);
    // a label's text changed, or its size did: fit the text again
    if (k === "content" || k === "width" || k === "height") {
      const f = FIT.get(n);
      if (f) {
        if (k === "width") f.w = +sv;
        if (k === "height") f.h = +sv;
        const txt = n.getAttribute("content") || "";
        const fs = String(fitFS(f.w, f.h, Math.max(4, txt.length), f.cap));
        if (n.getAttribute("font-size") !== fs) n.setAttribute("font-size", fs);
      }
    }
  }
  function guard(fn) {
    return function () { try { return fn.apply(this, arguments); } catch (e) { console.log("skydragon:", e && e.message); } };
  }
  function on(n, type, fn) { n.addEventListener(type, guard(fn)); }
  function later(fn, ms) { return setTimeout(guard(fn), ms); }
  const R = (d) => (d * Math.PI) / 180;
  function docTime() {
    try {
      if (document.timeline && typeof document.timeline.currentTime === "number") return document.timeline.currentTime;
    } catch (e) { /* not available */ }
    return null;
  }
  const MOTION_FALLBACK = docTime() === null;

  // ==========================================================
  // THE PAD
  // ==========================================================
  const pad = group({ x: PAD_X, z: PAD_Z });
  el("m-cylinder", { y: 0.1, radius: 22, height: 0.2, color: "#050b10", collide: "true" }, pad);
  el("m-cylinder", { y: 0.22, radius: 21, height: 0.05, color: NEON_DIM }, pad);
  el("m-cylinder", { y: 0.24, radius: 20.3, height: 0.05, color: "#050b10" }, pad);
  [0, 45, 90, 135].forEach((a) => box(pad, 0, 0.26, 0, 0.25, 0.04, 40, NEON_DIM, { ry: a }));
  el("m-cylinder", { y: 0.28, radius: 3, height: 0.05, color: NEON }, pad);
  // the ramp up to the back of the saddle (the dragon lands facing +z)
  const SADDLE_D = 8, RAMP_L = USE_MODEL ? Math.round(PERCH_Y / 0.44) : 12;   // v12: a longer ramp up the taller dragon
  {
    const rise = PERCH_Y, run = RAMP_L;
    const len = Math.hypot(rise, run), ang = (Math.atan2(rise, run) * 180) / Math.PI;
    const rg = group({ y: rise / 2, z: -SADDLE_D / 2 - run / 2 - 0.2, rx: -ang }, pad);
    box(rg, 0, -0.15, 0, 3.4, 0.3, len, "#0b161c", { collide: "true" });
    [-1, 1].forEach((a) => box(rg, a * 1.8, 0.45, 0, 0.12, 0.12, len, NEON));
    [-1, 1].forEach((a) => box(pad, a * 1.8, 0.6, -SADDLE_D / 2 - run - 0.2, 0.2, 1.2, 0.2, NEON));
  }
  label(pad, { y: 3.2, z: -SADDLE_D / 2 - RAMP_L - 2, ry: 180, width: 10, height: 1.4, color: INK, "font-color": NEON,
    content: "SKY DRAGON - WALK UP TO RIDE" });

  // ==========================================================
  // THE DRAGON
  // ==========================================================
  // root: position and heading (the glide instructions drive these)
  // att:  bank and pitch (it leans into turns and climbs)
  const dragon = group({ x: PAD_X, y: PERCH_Y, z: PAD_Z, ry: 0 });
  const motion = {};
  const GLIDE = USE_GLIDE && !MOTION_FALLBACK;
  if (!GLIDE) {
    lerpOn(dragon, "x,y,z,ry", TICK_MS + 30, "linear");
  } else {
    ["x", "y", "z", "ry"].forEach((a) => {
      const v = a === "y" ? PERCH_Y : a === "x" ? PAD_X : a === "z" ? PAD_Z : 0;
      motion[a] = el("m-attr-anim", { attr: a, start: v, end: v, duration: 1, "start-time": 0, loop: "false" }, dragon);
    });
  }
  const att = group({}, dragon);
  lerpOn(att, "rx,rz", 700, "easeInOutQuad");
  const body = group({}, att);
  // v28: only the dragon you see leans; the floor and walls stay level
  const tilt = group({}, body);
  lerpOn(tilt, "rx,rz", 700, "easeInOutQuad");
  const look = group({}, tilt);       // v12: the block-built dragon lives here

  // --- saddle, torso and belly
  const saddle = box(body, 0, -0.15, 0, 5.2, 0.3, SADDLE_D, "#0e1b22", { collide: "true", "collision-interval": 500, opacity: USE_MODEL ? 0.01 : 1 });
  // v3: who is standing on the saddle, so the keypad knows whether to
  // bring it home by flying (riders aboard) or at once (nobody aboard)
  const riders = new Map();           // connectionId -> last heard
  const inBox = new Set();            // v11: seen inside the box by the position probe
  const whoOf = (e) => (e && e.detail ? e.detail.connectionId : undefined);
  on(saddle, "collisionstart", (e) => { const id = whoOf(e); if (id !== undefined) riders.set(id, Date.now()); });
  on(saddle, "collisionmove", (e) => { const id = whoOf(e); if (id !== undefined) riders.set(id, Date.now()); });
  on(saddle, "collisionend", (e) => { const id = whoOf(e); if (id !== undefined) riders.delete(id); });
  function ridersAboard() {
    const now = Date.now();
    riders.forEach((t, id) => { if (now - t > 30000) riders.delete(id); });   // lost an end event
    // v10: people out on the wing decks are aboard too
    const all_ = new Set(riders.keys());
    inBox.forEach((k) => all_.add(k));
    if (typeof DECKS !== "undefined") DECKS.forEach((D) => D.on.forEach((k) => all_.add(k)));
    return all_.size;
  }
  box(body, 0, -0.02, 0, 4.6, 0.04, SADDLE_D - 0.6, NEON_DIM, { opacity: USE_MODEL ? 0.01 : 0.5 });
  box(look, 0, -1.9, 0.4, 6, 3.4, 12, OBSIDIAN);                              // chest and back
  box(look, 0, -1.2, 0.4, 5.2, 1.6, 12.6, OBSIDIAN_2);                        // shoulders
  box(look, 0, -3.8, 0.4, 4.6, 1.2, 10.4, BELLY);                             // belly plates
  [-3.2, -1.2, 0.8, 2.8, 4.8].forEach((z) => box(look, 0, -4.45, z, 4.2, 0.1, 0.25, NEON_DIM));
  box(look, 0, -2.6, -5.8, 4.6, 2.6, 2.4, OBSIDIAN);                          // haunch
  // the heart: a glowing core in the chest that pulses
  const heart = box(look, 0, -2.2, 6.6, 1.8, 1.8, 0.2, NEON, { opacity: 0.9, rz: 45 });
  anim(heart, "sx", 0.8, 1.15, 900, { easing: "easeInOutSine" });
  anim(heart, "sy", 0.8, 1.15, 900, { easing: "easeInOutSine" });
  // cyan light lines down each flank
  [-1, 1].forEach((a) => {
    box(look, a * 3.02, -1.5, 0.4, 0.08, 0.2, 12, NEON);
    box(look, a * 2.95, -3.2, 0.4, 0.08, 0.12, 10, NEON_DIM);
  });
  // spikes down the spine, behind the saddle
  for (let i = 0; i < 4; i++) {
    const z = -SADDLE_D / 2 - 0.8 - i * 1.4, h = 1.6 - i * 0.25;
    box(look, 0, h / 2 - 0.2, z, 0.5, h, 0.5, OBSIDIAN_2, { ry: 45, rx: -20 });
    box(look, 0, h - 0.2, z - 0.2, 0.18, 0.3, 0.18, NEON, { ry: 45 });
  }
  // legs, folded up under it in flight
  [-1, 1].forEach((a) => {
    box(look, a * 2.2, -4.6, 3.6, 1.1, 1.6, 1.4, OBSIDIAN_2, { rx: 30 });
    box(look, a * 2.2, -5.2, 4.3, 1.2, 0.3, 1.2, NEON_DIM);
    box(look, a * 2.4, -4.4, -4.6, 1.4, 2.2, 1.8, OBSIDIAN_2, { rx: -35 });
    box(look, a * 2.4, -5.3, -3.8, 1.4, 0.3, 1.4, NEON_DIM);
  });

  // --- the saddle room: v6 - no rails. Only walls and a roof you
  // cannot see, so nobody falls or is blown off
  // v10: THE WING DECKS. A flat walkway goes out over each wing from
  // the edge of the saddle, level with it, and the invisible room now
  // takes them in - walls, roof and gate run the full width. The wings
  // themselves are not solid and never touch you; they flap below the
  // decks. STAND ON THE RIGHT DECK TO TURN RIGHT, THE LEFT TO TURN
  // LEFT, for as long as you stand there.
  const ROOM_H = 5.5, SW = 5.2;       // saddle width; the room is 5.5 m tall
  const DECK_OUT = 11.5;              // how far out over each wing the decks go
  const RW = DECK_OUT * 2 + 0.2;      // the whole room's width
  // v11: A SEALED, INVISIBLE BOX. Walls on all four sides, a roof and
  // a floor, overlapping at every corner so there is no gap anywhere.
  // Only the strip behind the saddle - where the ramp comes up - opens,
  // and only while it sits on the pad. Behind each wing deck the wall
  // is always shut, so you cannot walk off the back of a wing, landed
  // or flying. Everything is solid; nothing is drawn (opacity 0.01).
  const HID = { opacity: 0.01, collide: "true" };
  // v11: THE BOX REACHES FORWARD past the saddle, over the chest and
  // either side of the neck, so riders can walk up and watch the fire
  // pour down from the jaw. FRONT_Z is where its front wall stands.
  const FRONT_Z = USE_MODEL ? Math.max(5, Math.round(MODEL_JAW_Z) - 1) : 12;
  const BOX_L = FRONT_Z + SADDLE_D / 2, BOX_Z = (FRONT_Z - SADDLE_D / 2) / 2;
  const GATE_W = SW + 0.4;                                   // the ramp's opening
  const BACK_D = 0.2;                 // v28: back wall depth. 0.2 = v24 (buttons fine); v25 used 4
  const BACK_Z = -SADDLE_D / 2 + 0.1 - BACK_D / 2;
  [-1, 1].forEach((a) => {
    box(body, a * (RW / 2), ROOM_H / 2, BOX_Z, 0.2, ROOM_H + 0.4, BOX_L + 0.6, INK, HID);          // side wall
    const bw = (RW - GATE_W) / 2 + 0.2;
    box(body, a * (GATE_W / 2 + bw / 2 - 0.1), ROOM_H / 2, BACK_Z, bw, ROOM_H + 0.4, BACK_D, INK, HID);   // back wall behind the deck
  });
  box(body, 0, ROOM_H / 2, FRONT_Z, RW + 0.4, ROOM_H + 0.4, 0.2, INK, HID);                      // front wall

  box(head, 0, 0.15, 1.2, 2.1, 1.35, 1.6, OBSIDIAN_2, { rx: 6 });                // forehead

  // v12: THE MODEL. Swap the block-built dragon for the model. It rides

  let modelRide = null;

  // --- the control board at the front of the saddle, facing the riders.
  // v2: every button is a solid cap with its label ON it and the label
  // clickable too (collide) - exactly how the Titan Roamer desk is
  // built. v1's labels were not clickable and sat in front of the caps,
  // which is why nothing happened when you pressed them.
  // v4: THE BOARD IS CLEAR OF EVERYTHING. In v3 it was wider than the
  // saddle room, so the side rails, a rail post and the room's
  // invisible side walls ran through the outer buttons, and the arrows
  // drawn on the speed keys sat on top of them - clicks landed on those
  // instead. Now the board is narrower than the room and stands 1.2 m
  // back from its front wall, nothing touches it, and every piece of a
  // button - cap, word and arrow - takes the click.
  // ---- the wing decks and who is standing on them (v10) ------
  // The Titan Roamer's step plates, proven in your world: each deck
  // hears footsteps itself (collision events) AND a position probe in
  // the dragon's body checks everybody's position against it, so a
  // rider who stands perfectly still is still counted. You are off a
  // deck only when both say so, and only after DECK_GRACE_MS, so a
  // step across a seam never flickers the steering.
  const DECK_GRACE_MS = 350;
  const DECK_STEER = false;           // v30: standing on a wing does NOT turn it - control board only
  const DECKS = [];
  function deck(side) {
    const x0 = SW / 2, x1 = DECK_OUT, w = x1 - x0, cx = side * (x0 + w / 2);
    const sense = { collide: "true", "collision-interval": 100 };
    // v11: the deck is solid and steers exactly as before, but it is
    // see-through (opacity 0.01). NOT visible="false": in Otherside that
    // also takes away the floor, and you fall through it
    const base = box(body, cx, -0.15, 0, w, 0.3, SADDLE_D, INK, Object.assign({ opacity: 0.01 }, sense));
    const glow = null;
    const D = { side: side, base: base, glow: glow, on: new Set(), src: new Map(), leave: new Map(),
      x: cx, hw: w / 2 + 0.2, hd: SADDLE_D / 2 + 0.2 };
    const paint = () => { set(glow, "color", D.on.size ? NEON : NEON_DIM); set(glow, "opacity", D.on.size ? 0.7 : 0.35); };
    D.mark = (key, src) => {
      let s_ = D.src.get(key);
      if (!s_) { s_ = new Set(); D.src.set(key, s_); }
      s_.add(src);
      const t = D.leave.get(key);
      if (t) { clearTimeout(t); D.leave.delete(key); }
      if (!D.on.has(key)) { D.on.add(key); paint(); deckChanged(); }
    };
    D.unmark = (key, src) => {
      const s_ = D.src.get(key);
      if (!s_ || !s_.has(src)) return;
      s_.delete(src);
      if (s_.size || D.leave.has(key)) return;
      D.leave.set(key, later(() => {
        D.leave.delete(key);
        const again = D.src.get(key);
        if (again && again.size) return;
        D.src.delete(key);
        if (D.on.delete(key)) { paint(); deckChanged(); }
      }, DECK_GRACE_MS));
    };
    D.forget = (key) => {
      const t = D.leave.get(key);
      if (t) clearTimeout(t);
      D.leave.delete(key); D.src.delete(key);
      if (D.on.delete(key)) { paint(); deckChanged(); }
    };
    D.contains = (x, y, z) => Math.abs(x - D.x) <= D.hw && Math.abs(z) <= D.hd && y > -1 && y < 3;
    const keyOf = (e) => (e && e.detail && e.detail.connectionId !== undefined ? e.detail.connectionId : "anon");
    on(base, "collisionstart", (e) => D.mark(keyOf(e), "c"));
    on(base, "collisionmove", (e) => D.mark(keyOf(e), "c"));
    on(base, "collisionend", (e) => D.unmark(keyOf(e), "c"));
    DECKS.push(D);
    return D;

    if (!modelRide) return;
    if (!st.landed && rideLerp) { rideLerp.remove(); rideLerp = null; set(modelRide, "rx", 0); set(modelRide, "rz", 0); }
    if (!st.landed && !bob) bob = anim(modelRide, "y", -0.5, 0.5, 2400, { easing: "easeInOutSine" });
    if (st.landed && bob) { bob.remove(); bob = null; set(modelRide, "y", 0); }
    if (!gaitOn) LEGS.forEach((L) => { set(L.lerp, "duration", 1400); set(L.j, "rx", st.landed ? 0 : L.fold); set(L.j, "y", L.y0 + (!st.landed && L.front ? FRONT_TUCK_LIFT : 0)); });
  }
  function flapTick() {
    bobTick();
    const want = st.landed ? 2600 : st.vy > 1 ? 700 : st.v < 3 ? 750 : st.v > 35 ? 1500 : FLAP_MS;
    if (want === flapShown) return;
    flapShown = want;
    WINGS.forEach((w) => set(w, "duration", want));
  }

  function showState() {
    const doing = st.landed ? (st.walk === 2 ? "SPRINTING" : st.walk ? "WALKING" : "LANDED") : st.home ? "GOING HOME" : (st.go ? "GOING" : "HOVERING")
      + (st.steering ? (deckSteer() > 0 ? " + TURNING LEFT" : " + TURNING RIGHT") : "")
      + (st.vert > 0 || st.climbTo ? " + CLIMBING" : st.vert < 0 ? " + DESCENDING" : "");
    const line1 = st.landed && !st.walk ? "LANDED - GO, UP, WALK OR SPRINT" : st.landed ? doing : st.atEdge ? "EDGE OF THE WORLD - TURNING BACK" : doing;
    const line2 = "SPEED " + st.gear + "/" + (GEARS.length - 1) + " " + GEARS[st.gear] + "m/s  ALT " + Math.round(st.y) + "m"
      + (st.fireUntil ? "  FIRE!" : Date.now() < st.fireAt ? "  FIRE " + Math.ceil((st.fireAt - Date.now()) / 1000) : "");
    const txt = line1 + "|" + line2;
    if (txt !== st.readShown) { st.readShown = txt; READOUTS.forEach((r) => { set(r[0], "content", line1); set(r[1], "content", line2); }); }
    if (st.gear !== st.gearShown) {
      st.gearShown = st.gear;
      LAMPS.forEach((lamps) => lamps.forEach((l, i) => set(l, "color", i + 1 <= st.gear ? (i + 1 >= 5 ? CALL_RED : NEON) : "#10222a")));
    }
    light("GO", st.go && !st.home);
    light("STOP", !st.go && !st.landed && !st.home);
    light("UP", st.vert > 0);
    light("DOWN", st.vert < 0);
    light("HOME", st.home);
    light("WALK", st.walk === 1);
    light("SPRINT", st.walk === 2);
  }

  // ==========================================================
  // FIRE
  // ==========================================================
  // Built when it breathes, removed when it stops. The stream and the
  // fire on the ground are children of the DRAGON, so they fly with it
  // on every screen, frame by frame, sweeping a lane of fire across
  // the ground under its jaw. Only the height changes are sent, and
  // they glide.
  let fx = null;
  function aimOf() {
    const ahead = Math.max(8, (st.y - 0) * 0.55);          // lands further ahead the higher it is
    return { gy: FIRE_GROUND_Y - st.y - FIRE_SINK, gz: JAW_Z + ahead };
  }
  function streamShape(A) {
    const jy = JAW_Y, jz = JAW_Z;
    const h = A.gz - jz, v = jy - A.gy;
    const L = Math.max(3, Math.hypot(h, v));
    const rx = (Math.atan2(-h, Math.max(0.01, v)) * 180) / Math.PI;   // leans so its TOP is at the jaw
    return { L: L, rx: rx, my: (jy + A.gy) / 2, mz: (jz + A.gz) / 2 };
  }
  function breathe() {
    const now = Date.now();
    st.fireUntil = now + FIRE_MS;
    set(jaw, "rx", 28);
    set(mouthLight, "opacity", 0.9);
    const A = aimOf(), S = streamShape(A);
    fx = { L0: S.L, gy: A.gy };
    // --- the stream: jaw to ground
    fx.root = group({ y: S.my, z: S.mz }, dragon);
    lerpOn(fx.root, "y,z", 500, "linear");
    fx.tilt = group({ rx: S.rx }, fx.root);
    lerpOn(fx.tilt, "rx,sy", 500, "linear");
    const N = 8, L = S.L;
    for (let i = 0; i < N; i++) {
      const y = L / 2 - (i + 0.5) * (L / N);
      const w = 1.1 + i * 0.6, seg = L / N + 0.8;
      const core = box(fx.tilt, 0, y, 0, w * 0.45, seg, w * 0.45, FIRE_WHITE, { opacity: 0.95, ry: 45 });
      const mid = box(fx.tilt, 0, y, 0, w * 0.85, seg, w * 0.85, FIRE_ORANGE, { opacity: 0.8 });
      const out = box(fx.tilt, 0, y, 0, w * 1.35, seg * 0.9, w * 1.35, FIRE_RED, { opacity: 0.45, ry: 45 });
      anim(core, "sx", 0.7, 1.3, 130 + i * 17);
      anim(mid, "sx", 0.75, 1.25, 170 + i * 23);
      anim(mid, "sz", 1.25, 0.75, 150 + i * 19);
      anim(out, "sz", 0.8, 1.3, 210 + i * 29);
      anim(out, "ry", 30, 60, 400 + i * 41);
    }
    // bright gouts racing down the stream
    [480, 560, 640, 720, 800].forEach((ms, k) => {
      const g = box(fx.tilt, 0, 0, 0, 1.8 + k * 0.3, 2.8, 1.8 + k * 0.3, k % 2 ? FIRE_WHITE : FIRE_HOT, { opacity: 0.85, ry: 45 });
      anim(g, "y", L / 2, -L / 2, ms, { pingpong: false, easing: "easeInQuad" });
      anim(g, "sx", 0.6, 1.6, ms / 2);
    });
    // --- the fire on the ground
    const Rr = FIRE_R;
    fx.ground = group({ y: A.gy, z: A.gz }, dragon);
    lerpOn(fx.ground, "y,z", 500, "linear");
    const bed = el("m-cylinder", { y: 0.1, radius: Rr, height: 0.2, color: FIRE_DEEP, opacity: 0.85 }, fx.ground);
    anim(bed, "opacity", 0.6, 0.9, 300);
    const glow = el("m-cylinder", { y: 0.3, radius: Rr * 0.8, height: 0.3, color: FIRE_ORANGE, opacity: 0.6 }, fx.ground);
    anim(glow, "opacity", 0.35, 0.75, 220);
    const heartF = box(fx.ground, 0, 2.2, 0, 4.4, 4.4, 4.4, FIRE_WHITE, { opacity: 0.85, ry: 45 });
    anim(heartF, "sy", 0.6, 1.5, 160); anim(heartF, "sx", 1.2, 0.8, 190);
    const heart2 = box(fx.ground, 0, 3.5, 0, 7, 7, 7, FIRE_HOT, { opacity: 0.5 });
    anim(heart2, "sy", 0.7, 1.4, 240); anim(heart2, "ry", 0, 90, 900);
    for (let i = 0; i < 12; i++) {
      const a = (Math.PI * 2 * i) / 12, r = Rr * (i % 2 ? 0.85 : 0.65), tall = 6 + ((i * 5) % 6);
      const f = box(fx.ground, Math.cos(a) * r, tall / 2, Math.sin(a) * r, 2.4, tall, 2.4,
        i % 3 === 0 ? FIRE_ORANGE : i % 3 === 1 ? FIRE_RED : FIRE_HOT, { opacity: 0.8, ry: (i * 37) % 90 });
      anim(f, "sy", 0.45, 1.35, 170 + i * 31);
      anim(f, "sx", 1.2, 0.75, 210 + i * 17);
    }
    const ring = el("m-cylinder", { y: 0.5, radius: Rr * 1.1, height: 0.6, color: FIRE_ORANGE, opacity: 0.5 }, fx.ground);
    anim(ring, "sx", 0.15, 1, 700, { pingpong: false }); anim(ring, "sz", 0.15, 1, 700, { pingpong: false });
    for (let i = 0; i < 10; i++) {
      const a = i * 2.39, r = Rr * (0.2 + (i % 5) * 0.15);
      const e = box(fx.ground, Math.cos(a) * r, 0, Math.sin(a) * r, 0.5, 0.5, 0.5, i % 2 ? FIRE_HOT : FIRE_WHITE, { ry: 45 });
      anim(e, "y", 0.5, 14 + (i % 4) * 3, 900 + i * 110, { pingpong: false });
    }
    // --- v21: the firelight. A flash as the fire lands, a burst of
    // white heat spreading out from the spot, then two flickering lights
    // out of step with each other so the glow never looks regular.
    const LA = { type: "point", color: "#ff6a1a", distance: FIRE_LIGHT_REACH, "cast-shadows": "false" };
    fx.flash = el("m-light", Object.assign({}, LA, { y: 4, intensity: FIRE_FLASH, color: "#ffd9a0" }), fx.ground);
    lerpOn(fx.flash, "intensity", 700, "easeOutQuad");
    const burst = el("m-sphere", { y: 1, radius: 2, color: FIRE_WHITE, opacity: 0.9 }, fx.ground);
    lerpOn(burst, "radius,opacity", 650, "easeOutQuad");
    const f1 = el("m-light", Object.assign({}, LA, { y: 3, intensity: FIRE_LIGHT }), fx.ground);
    anim(f1, "intensity", FIRE_LIGHT * 0.55, FIRE_LIGHT, 170, { easing: "easeInOutSine" });
    const f2 = el("m-light", Object.assign({}, LA, { y: 6, intensity: FIRE_LIGHT * 0.6, color: "#ff3a0a", distance: FIRE_LIGHT_REACH * 0.7 }), fx.ground);
    anim(f2, "intensity", FIRE_LIGHT * 0.25, FIRE_LIGHT * 0.7, 290, { easing: "easeInOutSine" });
    // the mouth glows too
    fx.mouth = el("m-light", Object.assign({}, LA, { y: JAW_Y, z: JAW_Z, intensity: FIRE_LIGHT * 0.5, distance: 18 }), dragon);
    const flashRef = fx.flash;
    setTimeout(() => { set(flashRef, "intensity", 0); set(burst, "radius", FIRE_R * 1.8); set(burst, "opacity", 0); }, 60);
    setTimeout(() => { try { burst.remove(); } catch (e) { /* gone */ } }, 800);
    onBreath(true);
  }
  function breathTick(now) {
    if (now >= st.fireUntil) { endBreath(); return; }
    // follow the height: the stream stretches, the fire stays on the ground
    const A = aimOf();
    if (fx && Math.abs(A.gy - fx.gy) > 0.08) {
      const S = streamShape(A);
      fx.gy = A.gy;
      set(fx.root, "y", S.my); set(fx.root, "z", S.mz);
      set(fx.tilt, "rx", S.rx); set(fx.tilt, "sy", S.L / fx.L0);
      set(fx.ground, "y", A.gy); set(fx.ground, "z", A.gz);
    }
  }
  function endBreath() {
    if (fx) {
      // v21: the embers keep glowing a moment, then fade
      const g = fx.ground;
      const after = el("m-light", { type: "point", color: "#ff4a10", distance: FIRE_LIGHT_REACH * 0.8, "cast-shadows": "false",
        x: 0, y: +g.getAttribute("y") + 2, z: +g.getAttribute("z"), intensity: FIRE_LIGHT * 0.8 }, dragon);
      lerpOn(after, "intensity", 1500, "easeOutQuad");
      setTimeout(() => set(after, "intensity", 0), 60);
      setTimeout(() => { try { after.remove(); } catch (e) { /* gone */ } }, 1800);
      try { fx.mouth.remove(); } catch (e) { /* gone */ }
      try { fx.root.remove(); } catch (e) { /* gone */ }
      try { fx.ground.remove(); } catch (e) { /* gone */ }
    }
    fx = null;
    st.fireUntil = 0;
    st.fireAt = Date.now() + FIRE_COOL_MS;
    set(jaw, "rx", 0);
    set(mouthLight, "opacity", 0);
    onBreath(false);
  }
  // A hook for putting this dragon in a game: called when a breath
  // starts and stops. Where the fire is on the ground, in world space:
  // fireSpot().
  function onBreath(started) { void started; }
  function fireSpot() {
    const A = aimOf();
    return { x: st.x + Math.sin(R(st.h)) * A.gz, z: st.z + Math.cos(R(st.h)) * A.gz, r: FIRE_R };
  }
  void fireSpot;

  // ==========================================================
  // THE CALL KEYPAD (v3) - on the landing pad. Type 1 7 1 8.
  // ==========================================================
  // Built like the Titan Roamer's: each key a solid cap with a
  // clickable label, a display that shows * for each digit typed, a C
  // to clear, and a TYPE button that opens a text box for the code.
  // Nobody aboard: the dragon is back on the pad at once. Riders
  // aboard: it flies them home and lands.
  function keypad(p, o, onCode) {
    const g = group({ x: o.x || 0, y: o.y || 0, z: o.z || 0, ry: o.ry || 0 }, p);
    const K = { entry: [], expires: 0, flashTok: 0, flashing: false };
    box(g, 0, 2.2, 0, 3.4, 3.3, 0.25, "#0b161c", { collide: "true" });
    box(g, 0, 2.2, -0.14, 3.6, 3.5, 0.05, NEON_DIM);
    K.display = label(g, { y: 3.4, z: 0.15, width: 3.0, height: 0.5, color: INK, "font-color": NEON, "font-size": 28, content: "- - - -" });
    if (o.title) label(g, { y: 4.3, z: 0.05, width: 3.6, height: 0.6, color: INK, "font-color": GOLD, "font-size": 28, content: o.title });
    K.show = () => {
      if (K.flashing) return;
      const dots = [];
      for (let i = 0; i < CODE.length; i++) dots.push(i < K.entry.length ? "*" : "-");
      set(K.display, "content", dots.join(" "));
    };
    K.flash = (t) => {
      const tok = ++K.flashTok;
      K.flashing = true;
      set(K.display, "content", t);
      later(() => { if (tok !== K.flashTok) return; K.flashing = false; K.show(); }, 1800);
    };
    const isPrefix = (seq) => seq.every((d, i) => d === CODE[i]);
    K.enter = (digit) => {
      const now = Date.now();
      if (now > K.expires) K.entry = [];
      K.expires = now + CODE_TIMEOUT * 1000;
      K.entry.push(digit);
      while (K.entry.length && !isPrefix(K.entry)) K.entry.shift();
      K.show();
      if (K.entry.length === CODE.length) { K.entry = []; K.show(); onCode(K); }
    };
    K.typed = (str) => {
      const digits = String(str || "").replace(/[^0-9]/g, "");
      K.entry = [];
      for (let i = 0; i < digits.length; i++) K.enter(Number(digits[i]));
      if (digits.length && digits.length !== CODE.length) K.flash("NO");
    };
    [["1", "2", "3"], ["4", "5", "6"], ["7", "8", "9"], ["C", "0", ""]].forEach((row, r) => {
      row.forEach((key, c) => {
        if (key === "") return;
        const clear = key === "C";
        const capC = clear ? "#3d0c1a" : "#12303a";
        const cap = box(g, (c - 1) * 0.92, 2.42 - r * 0.62, 0.22, 0.78, 0.5, 0.26, capC, { collide: "true" });
        const face = label(cap, { z: 0.14, width: 0.74, height: 0.42, color: capC,
          "font-color": clear ? "#ff8f8f" : CHALK, "font-size": 30, content: key, collide: "true" });
        face.setAttribute("id", "skydragon-key-" + key);
        let last = 0;
        const hit = () => {
          const now = Date.now();
          if (now - last < 180) return;
          last = now;
          set(cap, "color", clear ? CALL_RED : NEON);
          later(() => set(cap, "color", capC), 150);
          if (clear) { K.entry = []; K.show(); } else K.enter(Number(key));
        };
        on(cap, "click", hit);
        on(face, "click", hit);
      });
    });
    if (o.promptX !== undefined) {
      const pw = el("m-prompt", { message: "Dragon code", placeholder: "4 digits" }, g);
      const btn = box(pw, o.promptX, 1.6, 0.1, 1.4, 1.1, 0.2, "#0b161c", { collide: "true" });
      label(btn, { z: 0.11, width: 1.3, height: 1.0, color: "#0b161c", "font-color": GOLD, "font-size": 30, content: "TYPE", collide: "true" });
      on(pw, "prompt", (event) => K.typed(event.detail && event.detail.value));
    }
    K.show();
    return K;
  }
  function recall() {
    if (st.landed && Math.hypot(st.x - PAD_X, st.z - PAD_Z) < 6) return "ALREADY HOME";
    if (st.fireUntil) endBreath();
    st.walk = 0;
    if (ridersAboard() === 0) {
      // nobody on it: straight back onto the pad
      land(true);
      st.tH = st.h;
      set(tilt, "rx", 0); set(tilt, "rz", 0); st.bank = 0; st.pitch = 0;
      send();
      showState();
      return "HOME";
    }
    // riders aboard: fly them home and land
    if (st.landed) takeOff();
    st.home = true; st.go = false; st.vert = 0; st.climbTo = 0;
    showState();
    return "FLYING HOME";
  }
  // the console: beside the foot of the ramp, facing people walking up
  {
    const cg = group({ x: PAD_X + 6.5, z: PAD_Z - SADDLE_D / 2 - RAMP_L - 3 });
    box(cg, 0, 0.35, 0, 7, 0.7, 4, "#0b161c", { collide: "true" });
    box(cg, 0, 0.75, 0, 7.4, 0.12, 4.4, NEON_DIM);
    label(cg, { y: 6.2, z: -0.3, ry: 180, width: 10, height: 1.3, color: INK, "font-color": NEON, "font-size": 40, content: "CALL THE DRAGON" });
    keypad(cg, { y: 0.7, ry: 180, title: "TYPE THE CODE", promptX: 2.6 }, (K) => K.flash(recall()));
  }

  setInterval(guard(flightTick), TICK_MS);
  setInterval(guard(flapTick), 500);
  showState();
})();
</script>
