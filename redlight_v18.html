<!--
  TRAP RUN - SPRINT
  ============================================================
  v18 - THE WINDOW AT ITS FLOOR TOO.

  Dinopawnz: "can we reduce leniency even still? maybe shorten
  from 900 to 800."

  Done. GRACE_MS 900 to 800. On the shortest red - 2.5s, which
  is where this is felt - the game now judges for 1700ms of it,
  against 1350ms in v13.

    v13   1150 grace   1350ms judged   MOVE_TOL 0.25
    v14   1000         1500                     0.25
    v15    900         1600                     0.25
    v16    900         1600                     0.20
    v17    900         1600                     0.18
    v18    800         1700                     0.18

  Both dials are now sitting on their floors at the same time,
  which is worth being clear about before you play it.

  THE COMPOUND FAILURE
  ------------------------------------------------------------
  These two numbers are not independent, and the way they fail
  together is specific enough to recognise on sight.

  p.froze - the point you are pinned to - is written by the
  first sweep of judge() after the window closes, out of
  whatever position last arrived for you. So the window does not
  only have to cover stopping. It has to cover stopping AND a
  report of the STOPPED position getting back before that sweep:

    see the light          ~300ms
    brake to a halt        ~200ms
    next report goes out   up to PROBE_MS, 120
    the trip               ~100ms on a good connection

  About 720 of the 800. If a player's last report before the
  sweep was taken while they were still moving, they get pinned
  to a point most of a metre behind where they actually stopped
  - and MOVE_TOL is now 0.18, so they are outside it
  immediately and get caged for stopping correctly.

  The symptom: somebody stops cleanly, on time, in plain sight,
  and is caged anyway - and it is the same people every round,
  because it tracks their connection, not their play. That is
  the v9 bug. It is not the game being hard.

  THE REVERT is one number. 900 for the window is the first
  thing to put back, not MOVE_TOL - the window is the half that
  is unfair to slow connections specifically, while MOVE_TOL is
  hard on everybody equally.

  THERE IS ALSO A REAL FIX, if you want 800 to hold rather than
  just trying it: make judge() refuse to take a freeze point off
  a report that is already stale, and wait a sweep for a fresh
  one instead. That removes the compound failure at its cause
  rather than buying margin back with leniency, and it costs a
  mover nothing. It is a change to the judging core rather than
  a dial, so it is not in this build - if the symptom above
  shows up, ask and it goes in on its own, where it can be told
  apart from everything else.

  ============================================================
  v17 - THE FLOOR, AND THE AXIS THAT STILL HAD ROOM.

  Dinopawnz: "its still too lenient. cut it down more."

  Two numbers.

  MOVE_TOL, 0.20 to 0.18. That is the last tick, and it is not a
  step above the floor any more - it IS the floor. Under it the
  jitter of a motionless avatar is on its own enough to trip the
  drift test, and the game starts caging people for standing
  still. That is not a harder game, it is the v9 bug coming back:
  it caught some people every round and never touched others,
  and the ones it caught were the ones with the worse
  connection. So this dial is finished. If the next round of
  play still feels soft, the answer is not a smaller number
  here.

  JUMP_TOL, 0.6 to 0.35. This is where the room actually was.
  It is metres of RISE allowed from the freeze point, and unlike
  drift it has no jitter floor under it - a player standing
  still does not drift upward. What bounds it is how far a body
  can rise for innocent reasons, which is a settle, not a hop.
  An avatar hop is about 1.5m, so 0.6 was letting a genuine jump
  get a third of the way up before it counted as one. 0.35 is
  still well clear of a settle and takes most of that back.

  It only ever measures RISE, so landing out of a fall cannot
  trip it, and it only runs when both samples carried a real
  height - a pads-only runtime uses the jump layer instead.

  WHICH NUMBER DID IT, if something goes wrong in play:

    caged while standing perfectly still   -> MOVE_TOL. Nothing
        else in the build produces that. 0.22 is the retreat.
    caged for a stumble or a settle on
        landing                            -> JUMP_TOL. 0.45.
    caught some people every round and
        never others                       -> GRACE_MS, and it
        means 900 is too short for the connections in the room.

  WHAT IS LEFT AFTER THIS, and why none of it moved today:

    SPRINT_TOL 0.30 looks loose next to a MOVE_TOL of 0.18, and
    it is tempting for exactly that reason. Leave it. A contact
    that clears it goes down the speed-measured branch, and that
    branch does NOT check the point-alibi list - it only checks
    cage volumes. So SPRINT_TOL is the last thing standing
    between a jittery contact on one pad and a cage with no
    alibi test at all. It is a guard, not slack.

    ALIBI_MS 6000 is what lets a player who has stopped
    reporting still prove they were standing somewhere. Cutting
    it is the other way to reproduce the v9 bug.

    STALE_MS 1500 - silence is not guilt. Same.

  ============================================================
  v16 - AND A TIGHTER TOLERANCE.

  Dinopawnz: "what does taking a bite out of MOVE_TOL do? maybe
  we should reduce that a little."

  MOVE_TOL, 0.25 to 0.20. What it does, in full, because it is
  not one thing:

  1  THE DRIFT ALLOWED FROM YOUR FREEZE POINT, which is the one
     you feel. When the reaction window closes, the first sweep
     of judge() writes down where each player is - p.froze -
     and from that instant you are allowed to be anywhere
     within MOVE_TOL of it. Step outside and you are caged, no
     second look. A 5cm cut is a 5cm shorter leash.

  2  THE RADIUS ON EVERY ALIBI. Each recorded standing position
     carries MOVE_TOL as a bubble meaning "somebody was here".
     A floor contact inside one is not movement. Smaller
     bubbles mean a contact near a still body is likelier to be
     judged as a step, which is what catches the player who
     creeps a little and hides inside somebody else's alibi.

  3  THE POCKET THE STOPPERS LEAVE YOU. A block stays parked if
     it is within MOVE_TOL + STOP_CLEAR of somebody known to be
     standing. So the clear space round a still player went
     from 1.25m to 1.20m and the invisible walls come up 5cm
     nearer. Small, and worth knowing it moved at all.

  WHY IT COMPOUNDS WITH v15. The freeze point is taken at the
  first sweep after the window closes, so shortening the window
  did not only start the judging sooner - it moved the point
  you are pinned to EARLIER, to a moment when a runner may
  still be settling out of their last stride. v16 then draws a
  smaller circle round that earlier point. The two dials
  multiply rather than add, which is why this is the right
  place to stop and play it.

  THE FLOOR IS 0.18 and this is 0.02 over it. Below that, the
  jitter of a motionless avatar is on its own enough to trip
  the test, and the game starts caging people for standing
  still - which is not a harder game, it is a broken one. 0.22
  is the retreat if that shows up.

  WHY THIS RATHER THAN MORE WINDOW. A tight tolerance is hard
  on everybody equally. A tight window is hardest on whoever
  has the worst connection.

  ============================================================
  v15 - ONE MORE STEP OFF THE WINDOW.

  Dinopawnz: "i want to push a little further on the leniency.
  just a tad bit. lets try it."

  GRACE_MS, 1000 to 900. Same single number as v14, same two
  effects, because judging and the stoppers are the same
  moment: both start 100ms sooner again.

  On a short red - the 2.5s floor, which is where this dial is
  felt - the window the game actually judges in has gone:

    v13    1150 grace    1350ms judged
    v14    1000 grace    1500ms judged
    v15     900 grace    1600ms judged

  which is a fifth more of a short round spent being watched
  than two versions ago.

  THIS IS THE LAST COMFORTABLE STEP. About 800 is the floor: a
  report can be PROBE_MS (120ms) stale before it leaves, plus
  the trip, and a person needs a good quarter second to see the
  light at all. 900 already spends most of what is left over
  after those two. Below 800 the game stops measuring who
  stopped and starts measuring who has the better connection -
  the exact failure v9 was written to end, where it caught some
  people every round and never touched others.

  THE OTHER DIAL  (taken in v16)
  ------------------------------------------------------------
  If 900 still plays soft, the next thing to take is MOVE_TOL
  rather than more of the window. It is 0.25m of drift allowed
  before you are out, and it is a different kind of leniency:
  the window forgives you for being LATE, MOVE_TOL forgives you
  for being SLOPPY.

  ============================================================
  The sprint variant. Same sealed arena, same invisible grid of
  pressure points under one solid featureless floor, but the
  cages do not keep you. A cage snaps up, holds you three
  seconds, shrinks away, and you run on.

  So nobody is eliminated and everybody finishes. What the
  floor costs you is time. Whoever is first home wins, and the
  boards read out the clock and the best time of the round.

  Traps re-arm eight seconds after they fire, so the field
  never clears out from under the back of the pack.

  THE WINNER'S BOX
  ------------------------------------------------------------
  The first body across the finish line is boxed - once per
  round, and only ever the first. The box is not a trap cage:
  it is a gold pavilion that drops around them on the line and
  holds them for thirty seconds while the field watches. Then
  the glass goes and the pavilion stays standing as a monument
  for the rest of the round.

  WAY IN
  ------------------------------------------------------------
  Runners gather in the open lobby behind the start wall and
  walk in through two portals either side of the podium. The
  two at the far end open onto the winners' terrace and are
  SEALED - glass barriers, shut from load, shut through the
  whole run. Nobody enters the arena from the finish end. They
  lift the moment the winner is boxed, which is how the winner
  and everyone behind them gets out onto the terrace, and they
  drop again when the round is stopped or a new one is called.

  The run itself is a sealed corridor. A containment field down
  both flanks means the stands cannot be climbed or skirted:
  once you are on the floor, the only way out is across it.

  THE GALLERY
  ------------------------------------------------------------
  The two elevated banks either side of the run are a spectator
  gallery, and they are reached from OUTSIDE the corridor, never
  from the floor. Stone flights climb from the lobby and the
  terrace to deck height and pass through doorways cut into the
  end walls. The deck carries the full length of the arena, so
  you can follow a runner from the start line to the finish
  without ever setting foot on the minefield.

  The deck sits at y 4.3. The flank signal repeaters used to hang
  at head height and had stone plinths planted on the running
  surface; both are fixed - the repeaters now foot on the parapet,
  so the flank is clear from the deck end to end and there is
  nothing of theirs on the field at all.

  THE SIGNAL
  ------------------------------------------------------------
  The floor is the light. The whole slab turns green or red the
  instant the phase changes - a bright flash on the turn, then a
  settled tone dark enough to read the gold inlay over - with two
  lit strips down the length and glow lights just above the deck.
  You never have to look at the walls to know what the light is
  doing. Glance down, or just catch it in the corner of your eye
  while you watch your feet.

  There is now ONE rank of repeaters per flank rather than two.
  The near rank, twenty-eight towers every 12.5m, was redundant
  the moment the floor started carrying the signal. The taller,
  sparser far rank stays as backup, along with the two big end
  towers and the five overhead beacons.

  The containment field still reaches y 24.4, so the gallery is
  twenty metres of wall away from the floor in both directions:
  nobody drops in, nobody climbs out.

  THE STOPPERS - what changed in v11
  ------------------------------------------------------------
  v10 still left a line of cages behind anyone who simply held
  the forward key. Every detector in the build is REACTIVE: it
  sees the move, decides, builds a cage - and the whole time the
  runner is still going, so the cage lands behind them. The next
  detection does the same thing a few metres on. Correcting and
  leading and alibi-ing only ever shortened the gap. None of it
  could close it, because nothing ever stopped the runner.

  Trap Run never had this problem, and the reason is physical,
  not clever: its traps are SOLID. They stand from -0.6 to 3.4,
  so you walk into one, your momentum dies against it, and the
  cage is built around a body that is standing still. Detection
  and the stop are the same event, with no network in between.

  So red light now has the same thing. A grid of solid, invisible
  blocks, parked underground on green. The instant the reaction
  window closes on red, every block comes up EXCEPT the ones near
  somebody who is known to be standing there. Stand still and you
  are in a clear pocket and nothing touches you. Keep running and
  within a few metres you hit a wall you cannot see, you stop, and
  that contact builds the cage right there - just outside the face
  you hit, which is where you are standing.

  If a reactive cage was already built behind you this red, it is
  not duplicated - it is PICKED UP and moved onto you, and any other
  empty cages in your wake are cleared away. One runner, one cage.
  If one landed just AHEAD of you instead, so you stopped against its
  outside wall, it is slid back onto you. And if you are so laggy the
  block reached your screen after you had already run onto its
  ground, the cage goes where you actually are, not on its face.

  A block only CATCHES when something has also been seen moving at
  that spot - a floor contact away from anywhere a body was standing,
  or an identity sighting that left its frozen point. A runner holding
  forward leaves that evidence all the way up to the face. A player
  standing so still their runtime reported nothing, who a block comes
  up beside, leaves none - so however late their touch arrives, they
  are recorded as standing there, not moving. Being boxed in by an
  invisible block on red costs an honest player nothing - they were
  meant to be stone anyway - and the blocks go the instant it turns
  green.

  The boards now read CAGES j/f/s - s is cages built by a stopper -
  and SETTLED n, the number of rise-on contacts that were let off.
  A stopper that picks up an existing cage does not add to s, so s
  can sit low while the stoppers are doing most of the work.

  The grid is 528 colliders at STOP_PITCH 6, on top of the 300 floor
  pads. They are all parked underground except during a red. If the
  runtime struggles, STOP_PITCH 8 halves the count at the cost of a
  few more metres of free travel before a runner hits one.

  DETECTION - what changed in v10
  ------------------------------------------------------------
  v9 fixed the line of cages and broke the catching. It had a
  latch: the first connectionId to arrive from anywhere set
  identity "live" forever, and being live switched the floor pads
  off. But a connectionId arriving only proves the runtime emits
  ids - it proves nothing about whether the POSITIONS attached to
  them are usable. If the probes are range-clamped, or cover only
  part of the run, or report in a frame that does not line up
  with the arena, the judge ends up holding an id it can never
  place on the field while the floor, which could see that body
  perfectly well, has been turned off. Nobody gets caught. That
  is what you saw.

  v10 has no mode. Both detectors run, always, and they are
  arbitrated per contact rather than per runtime: the floor
  stands down at exactly one point - the instant before it would
  build a cage - and only if identity can show a live, on-field
  sighting within a pad's width of that contact. Where identity
  is watching, the judge acts and the floor keeps quiet. Where
  identity is blind, the floor works exactly as it always did.
  Junk identity now costs nothing instead of costing everything.

  Two supporting fixes came with it. The judge now writes its
  cages into `frozen`, the floor's alibi list, so the floor stops
  throwing cages at a body somebody has already dealt with - it
  never knew about the judge's work before. And the alibi list is
  maintained on every red rather than only in fallback, which on
  its own cut the spurious cages in a no-identity runtime from
  nine to five in testing.

  The boards now read CAGES j/f: j built from identity, f built
  by the floor. If j sits at zero while people are plainly being
  caught, identity is not usable in your runtime and the floor is
  carrying the game - which is fine, and is the entire point of
  running both.

  DETECTION - what changed in v9
  ------------------------------------------------------------
  v8 ran TWO detectors that did not know about each other. The
  position probes judged players by connectionId and caged them;
  the floor pads judged anonymous contacts and caged those too.
  Neither could see the other's work, so one runner collected a
  cage from the probes and a string of them from the pads. That
  was the line of cages behind somebody who never got caught.

  The pads were anonymous by choice, not by necessity - the note
  in the old code read "identity is not needed". It was. Without
  it a cage cannot be built for a PERSON, only for a patch of
  floor, so the code had to guess how far ahead to throw it and
  then guess again, by distance and heading, whether the next
  contact was the same body it had just caged. Both guesses fail
  in the same direction on a fast runner.

  v9 has one detector. Probes and pads both just report positions
  into one roster keyed by connectionId, and judge() is the only
  thing in the build that decides somebody moved or builds a cage.
  One cage per person per red, enforced by a lookup rather than a
  radius. If the cage lands off them it is MOVED onto them for the
  next second and a half instead of a second one being built.

  Two bugs went with it. The old speed test kept its history per
  PAD, so two different people crossing one 8m pad read as a
  single body that moved 8 metres - a fabricated sprint that caged
  someone standing still. And a tall avatar poking into the jump
  layer was let off by an alibi radius; now the layer records who
  was already inside it during the reaction window, so tall and
  airborne are told apart properly.

  If a runtime offers no connectionId on either probes or floor
  contacts, the old anonymous logic switches itself back on a few
  seconds into the round. The scoreboard shows which is running:
  ID, ANON, or ... while it is still deciding.

  Set your space's spawn point inside the lobby, around
  x 0, z -168. If runners spawn at the world origin they land
  in the middle of the minefield.

  OPERATOR
  ------------------------------------------------------------
  Two numpad consoles now, and either one works. The first is on
  the podium behind the start line, facing the lobby. The second
  stands on the winners' terrace, OUTSIDE the run and past the
  glass, so a round can be stopped from the finish end without
  walking back across a live floor.

  Click the keys: 1, 7, 1, 8. The display shows how many digits
  have landed, C clears a fumble. Both consoles share one entry
  buffer, so a half-entered code on one cannot be finished on the
  other. The same code stops a round, clears every cage and the
  winner's box, and reseals the finish doors.
  Change CODE before you run anything public.
-->

<m-group id="arena"></m-group>
<m-group id="mines"></m-group>
<m-group id="cages"></m-group>
<m-group id="winner"></m-group>

<script>
  // ==========================================================
  // TUNING - the dials you actually want to touch
  // ==========================================================

  // --- the light --------------------------------------------
  const GREEN_MIN = 3.0;    // shortest green, seconds
  const GREEN_MAX = 8.0;    // longest. the gap between these two is
                            // the whole tension of the game - a fixed
                            // green can be counted and beaten.
  const RED_MIN = 2.5;      // shortest red
  const RED_MAX = 6.0;      // longest

  // --- detection --------------------------------------------
  // Movement is measured against a frozen snapshot taken when the
  // light turns, not against the previous sample. A player who
  // creeps forward and stops is still displaced from where they
  // froze, so there is no sampling rate to slip between.
  const MOVE_TOL = 0.18;    // metres of drift allowed before you are out.
                            // Avatars settle and jitter a little; below
                            // about 0.18 you will cage people for standing
                            // still. Above 0.5 you can shuffle.
                            // 0.25 v13, 0.20 v16, 0.18 v17. THIS IS THE
                            // FLOOR, not a step above it - the number in
                            // the line above is where a motionless avatar's
                            // own jitter is enough to trip the test, and
                            // this is now sitting on it. There is nothing
                            // left to take here. It does three jobs:
                            //   1 the drift allowed from p.froze, which is
                            //     where judge() first saw you after the
                            //     window closed. This is the one you feel.
                            //   2 the radius on every entry in the alibi
                            //     list, so the bubble that says "somebody
                            //     was standing here" is smaller and a
                            //     contact near a still body is likelier to
                            //     read as movement.
                            //   3 the pocket the stoppers leave round a
                            //     known-still player: that is this plus
                            //     STOP_CLEAR, so 1.25m is now 1.18m.
                            // IF ANYONE GETS CAGED STANDING PERFECTLY
                            // STILL, this is the number that did it and
                            // 0.22 is the retreat. Nothing else in the
                            // build can produce that symptom.
  const JUMP_TOL = 0.35;    // metres of RISE allowed. Catches hopping on
                            // the spot, which slips past a flat check.
                            // 0.6 through v16, 0.35 in v17. This is the
                            // one axis that still had real room: a player
                            // standing still does not drift UPWARD, so
                            // unlike MOVE_TOL there is no jitter floor
                            // underneath it - it is bounded by how far a
                            // body can rise for innocent reasons, which is
                            // a settle, not a hop. An avatar hop is about
                            // 1.5m, so 0.6 was letting a real jump get a
                            // third of the way up before it counted.
                            // Measured as RISE from the freeze point
                            // only, so landing from a fall never trips it.
  const GRACE_MS = 800;     // REACTION WINDOW. Nobody is judged until this
                            // has passed after the light turns. It covers
                            // both human reaction time and a stale update
                            // in flight. Everywhere a body is seen during
                            // this window counts as a place it is allowed
                            // to be, so a runner who is mid-stride gets
                            // their whole braking distance for free.
                            // 1150 v13, 1000 v14, 900 v15, 800 v18.
                            // THIS IS THE FLOOR. What has to finish inside
                            // it is not just stopping - it is stopping AND
                            // having a report of the stopped position land
                            // before judge() takes the freeze point:
                            //   see the light          ~300ms
                            //   brake to a halt        ~200ms
                            //   next report goes out   up to PROBE_MS 120
                            //   the trip               ~100ms on a good one
                            // which is about 720 of the 800. There is no
                            // room under this, and the failure below it is
                            // not "harder" - it is p.froze being written
                            // from a report taken while the player was
                            // still moving, so their real stopped position
                            // is most of a metre from it and they are
                            // caged for having stopped correctly. See
                            // THE COMPOUND FAILURE in the header.
                            // 900 is the retreat, and it is one number.
  const PROBE_RANGE = 70;   // per probe. deliberately modest - see below
  const PROBE_MS = 120;     // how often each probe reports
  const PAD_MS = 70;        // how often each floor pad reports contact. Lower
                            // is a faster catch and more work for the runtime.
  // How long a gap between two reports on the same pad before the speed
  // test gives up. It was PAD_MS * 4 = 280ms, which is not a property of
  // the game - it is a property of the PLAYER. Anyone whose contacts
  // arrive slower than that, because of ping or framerate or a busy
  // runtime, had the speed test silently switched off and was judged by
  // the alibi test alone. That is why the game caught some people every
  // time and never touched others.
  const SPEED_WINDOW = 600;

  // --- IDENTITY (v9) ----------------------------------------
  // The build always had identity in it - the position probes are
  // keyed by connectionId - it just was not wired to the cages, and
  // the floor pads were judged anonymously alongside it. Two
  // detectors, no shared state, so a runner collected one cage from
  // the probes and a string of them from the pads. That is the line
  // of cages.
  //
  // v9 makes identity the primary detector wherever the runtime
  // offers it, from EITHER source, and keeps the old anonymous path
  // as a fallback for a runtime that offers neither.
  const JUDGE_MS = 80;      // how often the judge sweeps the roster
  const STALE_MS = 1500;    // stop judging anyone we have not heard from
                            // in this long. A still player may simply
                            // stop reporting, and silence is not guilt.
  const VEL_MS = 150;       // how far back the velocity sample is held
  const ID_LEAD_TIME = 0.25; // seconds of the runner's own travel to throw
                            // the cage forward by. MUCH shorter than the
                            // anonymous path's 0.45, because a cage that
                            // knows its owner gets corrected onto them if
                            // it lands wrong - it does not have to be
                            // right first time.
  const ID_LEAD_MAX = 3.0;
  // A cage may be moved onto its owner for this long after it is
  // built. A TIME budget, not a count: if the first correction is
  // itself a step behind - which is exactly what a bad connection
  // does - a count of three or four runs out while the cage is still
  // chasing. Within the window it keeps snapping until it lands, and
  // in practice it lands on the first or second try because the
  // walls stop the runner the moment it does.
  const CAGE_FIX_MS = 1500;
  const CAGE_FIXES = 12;    // sanity cap on attribute churn, not the
                            // real limit - CAGE_FIX_MS is.


  // Lead by TIME, not distance. A cage is built at (report + lead), but
  // the runner keeps moving while the report travels and the cage gets
  // built. A fixed 1.0 is correct at exactly one speed-and-latency pair;
  // for a faster player, or one further away, it lands behind them every
  // single time - consistently, which is the other half of why this was
  // per-player rather than random.
  const LEAD_TIME = 0.45;   // seconds of the runner's own travel
  const LEAD_MIN = 1.0;     // never shorter than the old fixed lead
  const LEAD_MAX = 6.0;     // a 9 m/s runner with a 400ms cage lag is 3.6m
                            // past the report before the cage exists, so a
                            // 3.2 ceiling still lands behind them.

  // ONE cage per runner per red, and no trail. When a detection lands
  // close behind a cage that just went up, on the same heading, it is the
  // same person - the previous cage missed and they ran out of its bubble.
  // Building another one behind them is what makes the line of cages.
  const TRACK_R = 9.0;
  const TRACK_MS = 1800;

  const SPRINT_TOL = 0.30;  // how far a contact may travel ON ONE PAD between
                            // two reports before it counts as running
  // --- THE STOPPERS (v11) -----------------------------------
  // Solid blocks that rise on red wherever nobody is standing, so a
  // runner holding forward hits a wall and stops - the way Trap Run's
  // traps stop you. See the notes at the top of the file.
  const STOPPERS = true;
  const STOP_PITCH = 6;     // block grid, metres. Smaller means a runner
                            // gets less free travel before they hit one,
                            // and more colliders for the runtime. 6 is
                            // Trap Run's trap pitch.
  const STOP_CLEAR = 1.0;   // no block rises within this of anybody known
                            // to be standing still, measured from the
                            // body to the block's face. Covers jitter and
                            // avatar width. It was 2.0, and in a crowd the
                            // pockets that left around honest players
                            // joined up into lanes a cheater could run down.
                            // Honest players do not depend on it anyway -
                            // STOP_EVIDENCE below is what protects them.
  const STOP_BACK = 1.0;    // the cage is centred this far out from the
                            // face they hit - i.e. on the runner, who is
                            // pressed against it.
  const STOP_ADOPT_R = 12;  // a cage built behind a runner in this radius...
  const STOP_ADOPT_MS = 2500; // ...this recently, that nobody is standing
                            // in, is moved onto them rather than left
                            // behind as a second cage.
  const STOP_ALIBI_R = 1.5; // a settle contact excuses this much of a face
  // A block only catches when something has been SEEN moving at that
  // exact spot, moments before - a floor contact away from anywhere a
  // body was standing, or an identity sighting that left its frozen
  // point. A runner's own footsteps lead right up to the face they hit,
  // so they always qualify. A still player the runtime never reports,
  // who a block came up beside, produces no such thing - and keeping
  // this TIGHT is what stops a cheater who runs past them from getting
  // them caged instead. At 3m and 1.5s a crowd test put the cheater's
  // cage on the bystander.
  const STOP_EVIDENCE_R = 1.5;
  const STOP_EVIDENCE_MS = 900;
  const OCC_DELAY = 600;    // a contact inside a cage only proves somebody is
                            // IN it once the cage has had time to reach their
                            // screen. Before that it is a runner passing
                            // through ground a cage has not arrived on yet.
  const STOP_SEE = 0;       // opacity. 0 is invisible, like Trap Run's traps.

  // --- the jump layer ---------------------------------------
  // Trap Run's pads were 4 tall so nobody could hop over them. That
  // is not available here: a tall pad is a solid wall, and on green
  // people have to be able to run. So the tall volume lives ABOVE
  // head height instead, and only exists while the light is red.
  // A standing avatar cannot touch it. Anyone leaving the ground
  // puts their head straight into it.
  const JUMP_LAYER = true;
  const JUMP_BOTTOM = 3.4;  // underside. Deliberately generous - Otherside
                            // avatars vary enormously in height and a slab
                            // that clips a tall one standing still is worse
                            // than one a short one can hop under. The alibi
                            // check below is the real protection; this is
                            // just margin on top of it.
  const JUMP_H = 3.6;       // thickness of the slab
  const JUMP_PAD = 12;      // its grid is coarser than the floor's - it only
                            // has to report WHERE, not how finely
  const SKY_PARK = -900;    // where it waits out the green light

  const SPRINT_MAX = 2.5;   // ...and how far is too far to believe. A jump
                            // bigger than this is two different people on the
                            // same pad, not one person moving, so it is
                            // ignored rather than caging an innocent.

  // --- the starting gate ------------------------------------
  const START_GATE = true;  // a solid barrier across the start threshold,
                            // up until the first green light of a round
  const GATE_H = 14;        // tall enough that it cannot be jumped
  const GATE_SEE = 0.13;    // Faintly visible on purpose. A genuinely
                            // invisible wall reads as a broken game -
                            // people walk into nothing and assume they
                            // are stuck. At this opacity you can see the
                            // run through it and still know it is there.
  const PROBE_Z = [-88, -44, 0, 44, 88];  // probes down the length of the run

  // --- cages ------------------------------------------------
  const CAGE_A = 2.8;       // interior half-width - Trap Run's size, which
                            // is the one that actually landed on people.
  const CAGE_LEAD = 1.0;    // metres thrown along the heading, fixed, also
                            // as Trap Run had it.
                            // own direction of travel. A cage built exactly
                            // where the contact was reported arrives behind
                            // a sprinter, because they have kept running in
                            // the time it took to report and build. Trap Run
                            // hit this same wall - see its notes on capture
                            // feeling late.
  const CAGE_H = 7;         // cage height
  const HOLD_CYCLES = 1;    // How many WHOLE green lights a caged player
                            // sits out. 1 means: caught on red, you watch
                            // the next green go by, and you are released
                            // when the one after it starts. Set to 0 and
                            // they rejoin at the very next green, which is
                            // barely a penalty. Set higher to punish more.
  const MAX_CAGES = 240;    // hard ceiling, protects framerate

  // --- the winner's box -------------------------------------
  // Exactly one of these is ever built, and only for the first
  // body over the line. It is deliberately bigger than a trap
  // cage: a runner arriving flat out needs room to land in, and
  // it has to read as a prize rather than a punishment.
  const WINNER_BOX = true;
  const WINNER_A = 3.6;     // interior half-width. Wide enough that the
                            // whole depth of the finish sensor sits inside
                            // it, so the box cannot close behind a sprinter.
  const WINNER_H = 9;       // taller than a trap cage, and lidded
  const WINNER_HOLD = 30;   // seconds the winner is held. After this the
                            // glass is removed and the gold frame stays up
                            // as a monument for the rest of the round.

  // --- the finish doors -------------------------------------
  const FINISH_SEALED = true;  // the two portals onto the terrace stay shut
                            // at all times, so nobody walks into the arena
                            // from the finish end. They lift only once the
                            // winner has been boxed.

  // --- the spectator gallery --------------------------------
  const GALLERY = true;
  const GALLERY_ENDS = [-1, 1];  // which ends get a doorway and a flight.
                            // -1 is the lobby, 1 is the terrace. Set to
                            // [-1] if you would rather the gallery could
                            // not be walked end to end - with both ends
                            // open, somebody can go up at the terrace and
                            // come down in the lobby. It never touches the
                            // run either way, but it is a route.
  // The small flank repeaters were the problem. Their housings are
  // centred at y 12 and are 11.4 x 0.95 tall, so the underside sits
  // at y 6.585, and they repeat every 15m down both flanks at 5.89
  // wide - which is 39% of the length of the run turned into solid
  // black box at exactly the height a spectator's head was. Worse,
  // the green lamp is a 2m sphere bulging out to x 50.29, and the
  // deck's inner edge is at 48.9, so the lamps were physically
  // inside the gallery.
  //
  // So the deck drops until a tall avatar's head passes UNDER the
  // housings. Derived rather than typed, so if you retune the
  // repeaters the gallery follows them.
  // The flank repeaters, which were wrong in two ways.
  //
  // Height: the housings were centred at y 12, underside 6.585. Over
  // a 4.3 deck that is barely above eye level - they read as a low
  // awning every 15m - and the green lamp is a 2m sphere bulging out
  // to x 50.29, hanging directly over a deck whose inner edge is at
  // 48.9. Raised until there is real air between them and the
  // gallery.
  //
  // Footing: signalTower plants a stone plinth 5 x scale square at
  // ground level, and at x 48.3 that puts a solid, COLLIDING block
  // between 2 and 3 metres onto the running surface. There were 42
  // of them down the two flanks. The flank towers now foot on the
  // parapet instead, which is what the parapet is for. Only the two
  // big end towers still stand on the floor, and they stand on the
  // apron where there is nothing to obstruct.
  const REP_HY = 15.5;      // near rank, housing centre
  const REP_SCALE = 0.95;
  const REP_FAR_HY = 30;    // far rank: twice as high, half as often
  const REP_FAR_SCALE = 1.35;
  const REP_UNDER = REP_HY - 11.4 * REP_SCALE / 2;   // 10.085
  const PARAPET_TOP = 4.48; // top of the parapet's gold cap, where
                            // every flank tower is now footed

  const HEADROOM = 2.2;     // generous. Otherside avatars get tall.
  const DECK_CEIL = Math.floor((REP_UNDER - HEADROOM) * 10) / 10;
  const DECK_PREF = 4.3;    // the deck height you actually want. With
                            // the repeaters raised DECK_CEIL is now
                            // 7.8, so the tall gallery is available
                            // again - set this to 7.16 and the deck,
                            // the stairs, the doorways and the
                            // balustrades all follow it back up.
  const DECK_Y = Math.min(DECK_PREF, DECK_CEIL);

  const DOOR_W = 10;        // gallery doorway, cut into the outer return
  const DOOR_H = 9.5;       // of each end wall. It sits ON the deck, so
                            // from the run it is a hole in a wall you
                            // cannot reach and that leads nowhere useful.
  const RAIL_H = 1.2;       // Balustrade along the field edge, waist high.
                            // It was 3.6 when the deck was up at 7.16 and
                            // nobody was looking through it; at this deck
                            // height a 3.6 wall of glass IS the view. It
                            // collides, but only so nobody clips through
                            // the edge - the containment field behind it
                            // is what actually holds the boundary.
  const STAIR_X = 58;       // centreline of each flight. Offset a metre
                            // inboard of the doorway on purpose: the
                            // lobby and terrace columns stand at x 64
                            // with a 1.3 radius, and at 58.5 the stair
                            // cheeks came within 100mm of them.
  const STAIR_W = 7;
  const STAIR_N = Math.max(6, Math.round(DECK_Y / 0.4));   // ~0.39 rise
  const STAIR_RUN = 1.0;    // tread depth

  function hasGallery(side) {
    return GALLERY && GALLERY_ENDS.indexOf(side) >= 0;
  }

  // --- detail ----------------------------------------------
  const DETAIL = true;      // arena decoration
  const CAGE_DETAIL = true; // gold posts + finial on each cage
  const LIGHT = 0.05;       // global brightness, applied to every light in
                            // the build. 0 kills them outright and leaves
                            // only whatever ambient the space itself has.

  // --- control panel ----------------------------------------
  const GATES_CLOSE_ON_RUN = false;  // governs the START doors only now. The
                            // finish doors follow FINISH_SEALED above.
  const ARMED_ON_LOAD = false;  // ALWAYS false, or you spawn into a live minefield
  const ARM_DELAY = 10;         // countdown after entering the code, seconds
  const CODE = [1, 7, 1, 8];    // rune discs, left to right are 1..9 then 0
  const CODE_TIMEOUT = 15;      // seconds to finish the sequence before it resets
  const FINISH_CONSOLE = true;  // a second numpad on the terrace, so a round
                                // can be stopped from the finish end without
                                // walking back across a live floor. It drives
                                // the same lock and the same buffer as the
                                // start console. Set false for one console
                                // only, at the start end, as before.

  // ==========================================================
  // GEOMETRY
  // ==========================================================
  const FIELD_W = 96;
  const FIELD_L = 200;
  const START_Z = -(FIELD_L / 2 + 6);   // arches straddle the boundary line
  const FINISH_Z = FIELD_L / 2 + 6;
  const ARENA_W = FIELD_W + 40;
  const ARENA_L = FIELD_L + 80;
  const ARENA_H = 56;

  // The deck length and the containment length MUST be the same
  // number, which is why they now live together up here. See the
  // note on BOUND_L below for what happened when they were not.
  const DECK_L = GALLERY ? ARENA_L - 2 : FIELD_L;
  const DECK_TOP = GALLERY ? DECK_Y : 7.16;   // the old stand height,
                                              // if you turn the gallery off

  const FLOOR = "#281d55";
  // The floor carries the signal now. Two tones per phase: a HOT one
  // that lands the instant the light turns, and a settled one it
  // falls back to a quarter second later. The flash is what catches
  // you in peripheral vision while you are watching your feet; the
  // settled tone is dark enough that the gold inlay still reads on
  // top of it, which a full-saturation floor would drown.
  const FLOOR_GREEN = "#17693c";
  const FLOOR_GREEN_HOT = "#2fd071";
  const FLOOR_RED = "#7d1424";
  const FLOOR_RED_HOT = "#ff2d3d";
  const FLOOR_GLOW_OFF = "#3a2a72";
  const GOLD = "#e8c547";
  const WALL = "#120c26";
  const STONE = "#1f1746";
  const INK = "#e8e2ff";
  const JEWELS = ["#ff5ec8", "#4ec9f0", "#a76bff", "#5ef0b8", "#ffb84e"];

  const RED_ON = "#ff2d3d";
  const RED_OFF = "#3a0a12";
  const GREEN_ON = "#3dff88";
  const GREEN_OFF = "#0a2a18";

  const SIGN_TEXT = "WHEN THE LIGHT IS RED, BE STONE.";

  const arena = document.getElementById("arena");
  const mineRoot = document.getElementById("mines");
  const cageRoot = document.getElementById("cages");
  const winRoot = document.getElementById("winner");

  function el(tag, attrs, parent) {
    const node = document.createElement(tag);
    node.setAttribute("collide", "false");
    for (const key in attrs) {
      let value = attrs[key];
      if (tag === "m-light" && key === "intensity") {
        value = Math.round(value * LIGHT * 10) / 10;
      }
      node.setAttribute(key, value);
    }
    (parent || arena).append(node);
    return node;
  }

  function rand(a, b) { return a + Math.random() * (b - a); }
  function jewel(i) { return JEWELS[i % JEWELS.length]; }

  // ==========================================================
  // SHELL - ground, walls, ceiling
  // ==========================================================
  el("m-cube", {
    y: -2, width: ARENA_W, height: 4, depth: ARENA_L,
    color: "#0e0922", collide: "true",
  });

  // long side walls - these stay sealed
  [-1, 1].forEach((s, i) => {
    el("m-cube", {
      x: s * ARENA_W / 2, y: ARENA_H / 2,
      width: 2, height: ARENA_H, depth: ARENA_L,
      color: WALL, collide: "true",
    });
    [20, 40].forEach((y) => {
      el("m-cube", {
        x: s * ARENA_W / 2, y: y,
        width: 2.6, height: 0.8, depth: ARENA_L, color: jewel(i),
      });
    });
  });

  // ==========================================================
  // THE CEILING - coffered, with a rose over the centre circle
  // ------------------------------------------------------------
  // Beams on a 20m grid, recessed panels between them, gilded
  // bosses at the crossings, and a rose directly above the floor
  // rosette so the two read as a pair.
  // ==========================================================
  const CEIL_Y = 54;
  const CEIL_STEP = 20;

  // the sealing plane above the coffers
  el("m-cube", {
    y: CEIL_Y + 1.4, width: ARENA_W, height: 2, depth: ARENA_L,
    color: "#0a0618", collide: "true",
  });

  // recessed panels
  for (let x = -50; x <= 50; x += CEIL_STEP) {
    for (let z = -130; z <= 130; z += CEIL_STEP) {
      if (Math.sqrt(x * x + z * z) < 24) continue;      // the rose sits here
      const alt = (Math.abs(x / CEIL_STEP) + Math.abs(z / CEIL_STEP)) % 2;
      el("m-cube", {
        x: x, z: z, y: CEIL_Y - 0.2,
        width: 17.6, height: 0.7, depth: 17.6,
        color: alt ? "#241a4d" : "#1b1440",
      });
    }
  }

  // beams
  for (let x = -60; x <= 60; x += CEIL_STEP) {
    el("m-cube", { x: x, y: CEIL_Y - 0.5, width: 2.4, height: 1.4, depth: ARENA_L - 6, color: "#2a1f5c" });
    el("m-cube", { x: x, y: CEIL_Y - 1.25, width: 1.0, height: 0.14, depth: ARENA_L - 6, color: GOLD, opacity: 0.6 });
  }
  for (let z = -120; z <= 120; z += CEIL_STEP) {
    el("m-cube", { z: z, y: CEIL_Y - 0.5, width: ARENA_W - 6, height: 1.4, depth: 2.4, color: "#2a1f5c" });
    el("m-cube", { z: z, y: CEIL_Y - 1.25, width: ARENA_W - 6, height: 0.14, depth: 1.0, color: GOLD, opacity: 0.6 });
  }

  // gilded bosses on alternate crossings
  [-40, 0, 40].forEach((x) => {
    for (let z = -100; z <= 100; z += 40) {
      if (Math.sqrt(x * x + z * z) < 24) continue;
      el("m-sphere", { x: x, z: z, y: CEIL_Y - 1.5, radius: 0.9, color: GOLD });
    }
  });

  // the rose
  [[20, "#2a1f5c"], [15, "#3a2a72"], [10, "#2a1f5c"], [5, "#4a3690"]].forEach(([r, color], i) => {
    el("m-cylinder", { y: CEIL_Y - 0.5 - i * 0.25, radius: r, height: 0.5, color: color });
  });
  for (let i = 0; i < 16; i++) {
    el("m-cube", { y: CEIL_Y - 1.6, ry: i * 22.5, width: 0.45, height: 0.3, depth: 40, color: GOLD, opacity: 0.55 });
  }
  el("m-sphere", { y: CEIL_Y - 2.4, radius: 1.8, color: GOLD });
  el("m-light", { y: CEIL_Y - 5, type: "point", intensity: 26, color: "#e0c48a" });

  // pendant lamps hung off the crossings
  [-30, 30].forEach((x, i) => {
    for (let z = -100; z <= 100; z += 40) {
      el("m-cylinder", { x: x, z: z, y: CEIL_Y - 4, radius: 0.12, height: 7, color: "#2a1f5c" });
      el("m-sphere", { x: x, z: z, y: CEIL_Y - 7.6, radius: 0.85, color: jewel(i + z / 40) });
      el("m-light", { x: x, z: z, y: CEIL_Y - 8.4, type: "point", intensity: 11, color: jewel(i + z / 40) });
    }
  });

  // ==========================================================
  // PORTALS - two doorways at each end, flanking the podium
  // ------------------------------------------------------------
  // The start pair are ordinary jewelled portcullises. The
  // finish pair are glass barriers: same mechanism, but they
  // are shut from the moment the world loads and only lift
  // once a winner has been boxed. That is the whole reason
  // nobody can walk in off the terrace and stroll up the run
  // against the traffic.
  // ==========================================================
  const PORTAL_W = 16;
  const PORTAL_H = 20;
  const PORTAL_X = 42;      // portals sit at x = -42 and +42
  const gates = [];

  function endWall(z, side, i) {
    const half = ARENA_W / 2;
    const pL = PORTAL_X - PORTAL_W / 2;
    const pR = PORTAL_X + PORTAL_W / 2;
    const glassy = side > 0;          // the finish end

    // the middle block between the two portals, full height
    el("m-cube", {
      x: 0, z: z, y: ARENA_H / 2,
      width: 2 * pL, height: ARENA_H, depth: 2,
      color: WALL, collide: "true",
    });

    // The outer returns are where the gallery doorways go. Note the
    // wall below DECK_Y stays solid whatever happens: the opening
    // sits ON the deck, which means that from the running floor it
    // is a hole nine metres up in a wall you cannot climb. There is
    // no version of this that gives a runner a way out.
    const retW = half - pR;               // 18m of return, x 50 to 68
    const retC = (pR + half) / 2;         // centred on x 59
    const jambW = (retW - DOOR_W) / 2;
    const doorTop = DECK_Y + DOOR_H;

    [-1, 1].forEach((sx) => {
      const cx = sx * retC;

      if (!hasGallery(side)) {
        el("m-cube", {
          x: cx, z: z, y: ARENA_H / 2,
          width: retW, height: ARENA_H, depth: 2, color: WALL, collide: "true",
        });
        return;
      }

      // everything below the deck: solid
      el("m-cube", {
        x: cx, z: z, y: DECK_Y / 2,
        width: retW, height: DECK_Y, depth: 2, color: WALL, collide: "true",
      });

      // a jamb either side of the opening
      [-1, 1].forEach((e) => {
        el("m-cube", {
          x: cx + e * (DOOR_W + jambW) / 2, z: z, y: DECK_Y + DOOR_H / 2,
          width: jambW, height: DOOR_H, depth: 2, color: WALL, collide: "true",
        });
      });

      // and everything above it
      el("m-cube", {
        x: cx, z: z, y: (doorTop + ARENA_H) / 2,
        width: DOOR_W, height: ARENA_H - doorTop, depth: 2,
        color: WALL, collide: "true",
      });

      // gold frame and a word, so it reads as a way through rather
      // than a gap somebody forgot to fill in
      [-1, 1].forEach((e) => {
        el("m-cylinder", {
          x: cx + e * (DOOR_W / 2 + 0.5), z: z,
          y: DECK_Y + DOOR_H / 2, radius: 0.5, height: DOOR_H, color: GOLD,
        });
      });
      el("m-cube", {
        x: cx, z: z, y: doorTop + 0.5,
        width: DOOR_W + 2, height: 1.0, depth: 2.4, color: GOLD,
      });
      [[1.35, 0], [-1.35, 180]].forEach(([dz, ry]) => {
        el("m-label", {
          x: cx, z: z + dz, y: doorTop + 2.3, ry: ry,
          width: 8, height: 1.4, "font-size": 58, alignment: "center",
          color: "#120c26", "font-color": GOLD, content: "GALLERY",
        });
      });
    });

    [8, 30].forEach((y) => {
      el("m-cube", { z: z, y: y, width: 2 * pL, height: 0.8, depth: 2.6, color: jewel(i) });
    });

    [-1, 1].forEach((sx) => {
      const px = sx * PORTAL_X;

      // lintel over the opening
      el("m-cube", {
        x: px, z: z, y: (PORTAL_H + ARENA_H) / 2,
        width: PORTAL_W, height: ARENA_H - PORTAL_H, depth: 2,
        color: WALL, collide: "true",
      });

      // gold frame
      [-1, 1].forEach((e) => {
        el("m-cylinder", {
          x: px + e * (PORTAL_W / 2 + 0.6), z: z,
          y: PORTAL_H / 2, radius: 0.7, height: PORTAL_H + 1.4, color: GOLD,
        });
      });
      el("m-cube", {
        x: px, z: z, y: PORTAL_H + 0.7,
        width: PORTAL_W + 2.6, height: 1.4, depth: 2.6, color: GOLD,
      });

      // portcullis - drops to seal the run, retracts into the lintel
      const gate = document.createElement("m-group");
      gate.setAttribute("x", px);
      gate.setAttribute("z", z);
      gate.setAttribute("y", 0);
      arena.append(gate);

      el("m-cube", {
        y: PORTAL_H / 2, width: PORTAL_W, height: PORTAL_H, depth: 0.5,
        color: glassy ? "#9fe8ff" : jewel(i + 2),
        opacity: glassy ? 0.22 : 0.18, collide: "true",
      }, gate);
      for (let b = 0; b <= 8; b++) {
        el("m-cylinder", {
          x: -PORTAL_W / 2 + b * (PORTAL_W / 8),
          y: PORTAL_H / 2, radius: 0.22, height: PORTAL_H, color: GOLD,
        }, gate);
      }
      el("m-cube", { y: 0.4, width: PORTAL_W, height: 0.8, depth: 0.9, color: GOLD }, gate);

      // The glass says what it is, on both faces, so nobody stands
      // there wondering whether the world is broken. Children of the
      // gate group, so they ride up with it when it lifts.
      if (glassy) {
        [[0.42, 0], [-0.42, 180]].forEach(([dz, ry]) => {
          el("m-label", {
            z: dz, y: 8.4, ry: ry,
            width: 12, height: 1.8, "font-size": 74, alignment: "center",
            color: "#0d0d14", "font-color": "#9fe8ff", content: "NO ENTRY",
          }, gate);
          el("m-label", {
            z: dz, y: 6.6, ry: ry,
            width: 13, height: 1.2, "font-size": 40, alignment: "center",
            color: "#0d0d14", "font-color": GOLD,
            content: "OPENS WHEN THE WINNER IS BOXED",
          }, gate);
        });
      }

      gates.push({ group: gate, side: side });
    });
  }

  endWall(-ARENA_L / 2, -1, 0);   // start end, opens onto the lobby
  endWall(ARENA_L / 2, 1, 1);     // finish end, glass, onto the terrace

  function setGates(side, open) {
    gates.forEach((g) => {
      if (g.side === side) g.group.setAttribute("y", open ? PORTAL_H : 0);
    });
  }

  // ==========================================================
  // THE LOBBY - an open pavilion, not a sealed room.
  // Roof on columns, no side or back walls: runners and
  // spectators wander in and out from the surrounding world.
  // ==========================================================
  const LOBBY_D = 56;
  const LOBBY_Z = -(ARENA_L / 2 + LOBBY_D / 2);
  const ROOM_H = 22;

  el("m-cube", {
    z: LOBBY_Z, y: -2, width: ARENA_W, height: 4, depth: LOBBY_D,
    color: "#0e0922", collide: "true",
  });
  el("m-cube", { z: LOBBY_Z, y: 0.1, width: ARENA_W - 16, height: 0.2, depth: LOBBY_D - 10, color: "#1b1440" });

  // a step down on all three open sides, so the edge reads as an invitation
  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * (ARENA_W / 2 + 1.6), z: LOBBY_Z, y: -0.5,
      width: 3.2, height: 1, depth: LOBBY_D, color: "#181040", collide: "true",
    });
  });
  el("m-cube", {
    z: -(ARENA_L / 2 + LOBBY_D) - 1.6, y: -0.5,
    width: ARENA_W + 6.4, height: 1, depth: 3.2, color: "#181040", collide: "true",
  });

  // roof on columns
  el("m-cube", {
    z: LOBBY_Z, y: ROOM_H + 0.8, width: ARENA_W, height: 1.6, depth: LOBBY_D,
    color: "#0a0618", collide: "true",
  });
  el("m-cube", {
    z: LOBBY_Z, y: ROOM_H - 0.3, width: ARENA_W + 2, height: 0.5, depth: LOBBY_D + 2, color: GOLD,
  });
  [-1, 1].forEach((sx) => {
    [-1, 1].forEach((sz) => {
      const x = sx * (ARENA_W / 2 - 4);
      const z = LOBBY_Z + sz * (LOBBY_D / 2 - 4);
      el("m-cube", { x: x, z: z, y: 0.5, width: 4, height: 1, depth: 4, color: STONE, collide: "true" });
      el("m-cylinder", { x: x, z: z, y: 10.5, radius: 1.3, height: 19, color: "#2a1f5c", collide: "true" });
      el("m-cylinder", { x: x, z: z, y: 20.2, radius: 1.7, height: 0.6, color: GOLD });
    });
  });

  el("m-light", { z: LOBBY_Z, y: ROOM_H - 4, type: "point", intensity: 38, color: "#8f7bd8" });

  // the briefing, on the inside face of the start wall, at reading height
  el("m-cube", {
    z: -(ARENA_L / 2) - 1.2, y: 4.3, width: 30, height: 4.6, depth: 0.3, color: "#0d0d14",
  });
  el("m-label", {
    z: -(ARENA_L / 2) - 1.45, y: 5.2, ry: 180,
    width: 28, height: 1.9, "font-size": 80, alignment: "center",
    color: "#0d0d14", "font-color": INK,
    content: "GREEN LIGHT RUN. RED LIGHT FREEZE.",
  });
  el("m-label", {
    z: -(ARENA_L / 2) - 1.45, y: 3.3, ry: 180,
    width: 22, height: 1.3, "font-size": 58, alignment: "center",
    color: "#0d0d14", "font-color": GOLD,
    content: "MOVE ON RED AND YOU ARE CAGED WHERE YOU STAND",
  });

  // benches, set back so they never block a doorway
  [-1, 1].forEach((s) => {
    [-1, 1].forEach((sz) => {
      el("m-cube", {
        x: s * 30, z: LOBBY_Z + sz * 16,
        y: 1.0, width: 16, height: 2.0, depth: 3, color: STONE, collide: "true",
      });
    });
  });

  // ==========================================================
  // THE TERRACE - equally open to the world outside, but the
  // only way from here onto the run is through the glass, and
  // the glass does not lift until the round has been won.
  // ==========================================================
  const TER_D = 40;
  const TER_Z = ARENA_L / 2 + TER_D / 2;

  el("m-cube", {
    z: TER_Z, y: -2, width: ARENA_W, height: 4, depth: TER_D,
    color: "#0e0922", collide: "true",
  });
  el("m-cube", { z: TER_Z, y: 0.1, width: ARENA_W - 20, height: 0.2, depth: TER_D - 10, color: "#3a1436" });

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * (ARENA_W / 2 + 1.6), z: TER_Z, y: -0.5,
      width: 3.2, height: 1, depth: TER_D, color: "#181040", collide: "true",
    });
  });
  el("m-cube", {
    z: ARENA_L / 2 + TER_D + 1.6, y: -0.5,
    width: ARENA_W + 6.4, height: 1, depth: 3.2, color: "#181040", collide: "true",
  });

  [-1, 1].forEach((sx) => {
    [-1, 1].forEach((sz) => {
      const x = sx * (ARENA_W / 2 - 4);
      const z = TER_Z + sz * (TER_D / 2 - 4);
      el("m-cube", { x: x, z: z, y: 0.5, width: 4, height: 1, depth: 4, color: STONE, collide: "true" });
      el("m-cylinder", { x: x, z: z, y: 8, radius: 1.3, height: 14, color: "#2a1f5c", collide: "true" });
      el("m-sphere", { x: x, z: z, y: 15.6, radius: 1.5, color: GOLD });
    });
  });

  el("m-light", { z: TER_Z, y: 20, type: "point", intensity: 34, color: "#c25f9a" });

  // ==========================================================
  // THE FLOOR - one solid slab. no tiles, no seams, no tells.
  // ==========================================================
  const floorSlab = el("m-cube", {
    z: 0, y: 0.1, width: FIELD_W, height: 0.2, depth: FIELD_L,
    color: FLOOR,
  });

  // Two lit strips inlaid down the length, well inside the running
  // surface. These are the part you actually catch while sprinting:
  // dead ahead is the run, and the colour is in the bottom corners of
  // your vision the whole way without turning your head.
  const floorStrips = [-1, 1].map((s) => el("m-cube", {
    x: s * (FIELD_W / 2 - 3), y: 0.23,
    width: 1.1, height: 0.06, depth: FIELD_L - 4,
    color: FLOOR_GLOW_OFF,
  }));

  // and lights just above the deck, so the phase colour is in the air
  // of the corridor and not only underfoot
  const floorGlow = [];
  for (let z = -FIELD_L / 2 + 12.5; z < FIELD_L / 2; z += 25) {
    floorGlow.push(el("m-light", {
      z: z, y: 3.4, type: "point", intensity: 20, color: FLOOR_GLOW_OFF,
    }));
  }

  // "GREEN" | "RED" | "OFF". Every phase change goes through here.
  // The token guards the flash: if the light turns again inside the
  // 260ms, the stale timeout must not repaint the floor the old
  // colour on its way out.
  let floorToken = 0;
  function setFloor(state) {
    floorToken++;
    const mine = floorToken;
    const settled = state === "GREEN" ? FLOOR_GREEN : state === "RED" ? FLOOR_RED : FLOOR;
    const hot = state === "GREEN" ? FLOOR_GREEN_HOT : state === "RED" ? FLOOR_RED_HOT : FLOOR;
    const lit = state === "GREEN" ? GREEN_ON : state === "RED" ? RED_ON : FLOOR_GLOW_OFF;

    floorSlab.setAttribute("color", hot);
    floorStrips.forEach((p) => p.setAttribute("color", lit));
    floorGlow.forEach((l) => l.setAttribute("color", lit));

    if (state === "OFF") return;
    setTimeout(() => {
      if (mine !== floorToken) return;
      floorSlab.setAttribute("color", settled);
    }, 260);
  }

  // gold trim on the outer edge only, never across the run
  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * (FIELD_W / 2 + 0.3), y: 0.14,
      width: 0.6, height: 0.28, depth: FIELD_L, color: GOLD,
    });
  });

  // safe aprons, outside the boundary at each end
  [[-1, "#1c5c46"], [1, "#5c1c4e"]].forEach(([s, color]) => {
    el("m-cube", { z: s * (FIELD_L / 2 + 12), y: 0.09, width: FIELD_W, height: 0.18, depth: 24, color: color });
  });

  // ==========================================================
  // BOUNDARY - the line you do not want to be standing past
  // ==========================================================
  // BOUND_L was ARENA_L - 4, which ended the parapet at z +/-138.
  // The gallery deck runs to +/-139. That left a metre of deck at
  // each end with no containment beside it at all, so a spectator
  // who walked to the end of the gallery could step off the inner
  // edge and drop straight into the arena behind the finish line -
  // and from there walk onto the field. Matched to the deck.
  const BOUND_L = GALLERY ? DECK_L : ARENA_L - 4;

  [-1, 1].forEach((s) => {
    // Solid parapet. Runs wall to wall, not just the length of the
    // field, so the stands cannot be climbed, jumped onto, or
    // skirted round the ends where the tiers stop. Both portals
    // sit at x 42, well inside this, so no doorway is blocked.
    el("m-cube", {
      x: s * 48.3, y: 2.1, width: 1.2, height: 4.2, depth: BOUND_L,
      color: STONE, collide: "true",
    });
    el("m-cube", {
      x: s * 48.3, y: 4.34, width: 1.7, height: 0.28, depth: BOUND_L, color: GOLD,
    });
    // The invisible extension, up to y 24.4. It used to start at
    // 14.4 - height 20, so its underside was at 4.4, leaving a
    // 200mm gap above the 4.2 parapet top. That gap never mattered
    // while the gallery deck was at 7.16, because there was nothing
    // at 4.3 to climb onto. There is now. Closed.
    el("m-cube", {
      x: s * 48.3, y: 14.3, width: 1.2, height: 20.2, depth: BOUND_L,
      color: "#000000", opacity: 0, collide: "true",
    });

    // threshold band across each end
    el("m-cube", { z: s * (FIELD_L / 2 - 0.6), y: 0.24, width: FIELD_W, height: 0.1, depth: 1.2, color: "#ff5ec8" });
  });

  // ==========================================================
  // DISTANCE MARKERS - four per flank, and nothing else
  // ------------------------------------------------------------
  // These positions are exported, because the signal towers have to
  // be placed AGAINST them. The boards sit at multiples of 25 in z,
  // each 5 wide lying along the run.
  // ==========================================================
  const MARK_D = [25, 50, 75, 100, 125, 150, 175];
  const MARK_Z = MARK_D.map((d) => -FIELD_L / 2 + d);
  const MARK_HALF = 2.5;      // half the panel width, along z

  MARK_D.forEach((d, mi) => {
    const z = MARK_Z[mi];
    [-1, 1].forEach((s) => {
      el("m-cube", {
        x: s * 47.62, z: z, y: 2.5, ry: s * -90,
        width: 5, height: 1.9, depth: 0.18, color: "#0d0d14",
      });
      el("m-label", {
        x: s * 47.48, z: z, y: 2.5, ry: s * -90,
        width: 4.4, height: 1.5, "font-size": 95, alignment: "center",
        color: "#0d0d14", "font-color": GOLD, content: String(d),
      });
    });
  });

  // ==========================================================
  // STANDS - one clean bank per flank, flush to the parapet
  // ------------------------------------------------------------
  // With the gallery on, these run the WHOLE length of the arena
  // rather than stopping level with the field, so the deck reaches
  // the end walls and the stairs have somewhere to arrive. The
  // corner sentinels' plinths end up buried inside the bank and
  // their columns rise straight out of the deck, which is a better
  // look than the old floating bases anyway.
  // ==========================================================
  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * 58.45, y: (DECK_TOP - 0.16) / 2,
      width: 19.1, height: DECK_TOP - 0.16, depth: DECK_L,
      color: STONE, collide: "true",
    });
    el("m-cube", {
      x: s * 58.45, y: DECK_TOP - 0.08,
      width: 19.5, height: 0.16, depth: DECK_L, color: GOLD,
    });
  });

  // ==========================================================
  // THE SPECTATOR GALLERY
  // ==========================================================
  // Two stone flights per end, climbing from the lobby and the
  // terrace to deck height and through the doorways cut above.
  // Each step is a block from the ground up rather than a floating
  // tread, so there is no gap under the stair for an avatar to
  // catch a foot in.
  const STAIR_RISE = DECK_Y / STAIR_N;
  const ZEDGE = ARENA_L / 2 + 1;     // outer face of the end wall
  const DOOR_X = (PORTAL_X + PORTAL_W / 2 + ARENA_W / 2) / 2;   // = 59

  function galleryStair(sx, sz) {
    const x = sx * STAIR_X;

    // The landing that carries the deck through the doorway. It is
    // centred on the DOOR, not on the stair, so it never clips a
    // jamb; the stair is a metre inboard and simply lands on it.
    el("m-cube", {
      x: sx * DOOR_X, z: sz * (ARENA_L / 2 + 0.5), y: DECK_Y / 2,
      width: DOOR_W - 0.4, height: DECK_Y, depth: 3,
      color: STONE, collide: "true",
    });
    el("m-cube", {
      x: sx * DOOR_X, z: sz * (ARENA_L / 2 + 0.5), y: DECK_Y + 0.05,
      width: DOOR_W - 0.4, height: 0.1, depth: 3, color: GOLD, opacity: 0.5,
    });

    for (let i = 0; i < STAIR_N; i++) {
      const h = (i + 1) * STAIR_RISE;
      const zc = sz * (ZEDGE + (STAIR_N - 1 - i) * STAIR_RUN + STAIR_RUN / 2);

      el("m-cube", {
        x: x, z: zc, y: h / 2,
        width: STAIR_W, height: h, depth: STAIR_RUN + 0.06,
        color: STONE, collide: "true",
      });

      // gold nosing on the exposed edge of every tread. In this
      // light a flight of plain stone steps is a ramp you cannot
      // read the pitch of.
      el("m-cube", {
        x: x, z: zc + sz * (STAIR_RUN / 2), y: h + 0.04,
        width: STAIR_W + 0.2, height: 0.08, depth: 0.18,
        color: GOLD, opacity: 0.7,
      });

      // stepped cheeks either side, so nobody walks off the flank
      [-1, 1].forEach((e) => {
        el("m-cube", {
          x: x + e * (STAIR_W / 2 + 0.3), z: zc, y: (h + 1.0) / 2,
          width: 0.6, height: h + 1.0, depth: STAIR_RUN + 0.06,
          color: "#2a1f5c", collide: "true",
        });
      });
    }

    // newel lamps at the foot
    const zFoot = sz * (ZEDGE + STAIR_N * STAIR_RUN + 0.4);
    [-1, 1].forEach((e) => {
      const nx = x + e * (STAIR_W / 2 + 0.3);
      el("m-cylinder", { x: nx, z: zFoot, y: 1.6, radius: 0.45, height: 3.2, color: "#2a1f5c", collide: "true" });
      el("m-sphere", { x: nx, z: zFoot, y: 3.6, radius: 0.6, color: "#ffb84e" });
      el("m-light", { x: nx, z: zFoot, y: 3.6, type: "point", intensity: 9, color: "#ffb84e" });
    });

    // and a sign facing whoever is walking up to it
    const zSign = sz * (ZEDGE + STAIR_N * STAIR_RUN + 2.2);
    const ry = sz < 0 ? 180 : 0;
    el("m-cube", {
      x: x, z: zSign, y: 2.6, ry: ry,
      width: 9, height: 2.0, depth: 0.3, color: "#0d0d14",
    });
    el("m-label", {
      x: x, z: zSign + sz * 0.25, y: 2.6, ry: ry,
      width: 8.4, height: 1.4, "font-size": 52, alignment: "center",
      color: "#0d0d14", "font-color": GOLD, content: "SPECTATOR GALLERY",
    });
  }

  if (GALLERY) {
    // Waist-high balustrade down the field edge of each deck. It
    // collides, but only so nobody clips through the lip - the
    // containment field at x 48.3 reaches y 24.4 and is what
    // actually holds the boundary. At this deck height the rail has
    // to stay low: anything much above a metre and the spectator is
    // looking at glass rather than at the run.
    [-1, 1].forEach((sx) => {
      el("m-cube", {
        x: sx * 49.0, y: DECK_Y + RAIL_H / 2,
        width: 0.18, height: RAIL_H, depth: DECK_L,
        color: "#9fe8ff", opacity: 0.1, collide: "true",
      });
      el("m-cube", {
        x: sx * 49.0, y: DECK_Y + RAIL_H,
        width: 0.5, height: 0.18, depth: DECK_L, color: GOLD,
      });
      for (let z = -132; z <= 132; z += 12) {
        el("m-cylinder", {
          x: sx * 49.0, z: z, y: DECK_Y + RAIL_H / 2,
          radius: 0.1, height: RAIL_H, color: GOLD, opacity: 0.8,
        });
      }
      // a low kerb against the outer wall, so the deck reads as a
      // room with two sides rather than a shelf
      el("m-cube", {
        x: sx * 66.9, y: DECK_Y + 0.45,
        width: 0.5, height: 0.9, depth: DECK_L, color: "#2a1f5c", collide: "true",
      });
    });

    GALLERY_ENDS.forEach((sz) => {
      [-1, 1].forEach((sx) => galleryStair(sx, sz));
    });

    // ------------------------------------------------------------
    // Closing the ends of the deck.
    //
    // Two separate holes lived here. The first was the parapet
    // stopping a metre short, fixed by BOUND_L above. The second is
    // subtler: the runners' portal opening spans x 34 to 50, and
    // the end wall's outer return does not begin until x 50, but
    // the parapet's outer face is at 48.9. That leaves a slot 1.1m
    // wide and 2m deep, at the exact corner where the deck meets
    // the end wall, open all the way down to y 0 - with the deck
    // surface right beside it. Step sideways off the end of the
    // gallery and you drop through it into the arena.
    //
    // So: fill the slot solid to deck height, and put a balustrade
    // across both ends of the deck so nobody can walk into that
    // corner in the first place.
    // ------------------------------------------------------------
    [-1, 1].forEach((sx) => {
      [-1, 1].forEach((sz) => {
        // the plug
        el("m-cube", {
          x: sx * 49.55, z: sz * 140, y: DECK_Y / 2,
          width: 1.3, height: DECK_Y, depth: 2.6,
          color: STONE, collide: "true",
        });

        // and a rail across the end of the deck, in two stretches
        // where there is a doorway and one where there is not
        const zEnd = sz * (DECK_L / 2 - 0.1);
        const runs = hasGallery(sz)
          ? [[48.9, DOOR_X - DOOR_W / 2], [DOOR_X + DOOR_W / 2, 68]]
          : [[48.9, 68]];

        runs.forEach(([x0, x1]) => {
          el("m-cube", {
            x: sx * (x0 + x1) / 2, z: zEnd, y: DECK_Y + RAIL_H / 2,
            width: x1 - x0, height: RAIL_H, depth: 0.18,
            color: "#9fe8ff", opacity: 0.1, collide: "true",
          });
          el("m-cube", {
            x: sx * (x0 + x1) / 2, z: zEnd, y: DECK_Y + RAIL_H,
            width: x1 - x0, height: 0.18, depth: 0.5, color: GOLD,
          });
        });
      });
    });
  }

  // the motto, high on the side walls, clear of everything below
  [-1, 1].forEach((s) => {
    [-60, 0, 60].forEach((z) => {
      el("m-cube", {
        x: s * 66.2, z: z, y: 13, ry: s * -90,
        width: 30, height: 3.8, depth: 0.3, color: "#0d0d14",
      });
      el("m-label", {
        x: s * 66.0, z: z, y: 13, ry: s * -90,
        width: 28, height: 2.6, "font-size": 68, alignment: "center",
        color: "#0d0d14", "font-color": INK, content: SIGN_TEXT,
      });
    });
  });

  // ==========================================================
  // COLOSSAL SENTINELS in the corners
  // ------------------------------------------------------------
  // Their plinths used to be 6 tall, which was invisible when the
  // deck sat at 7.16 - the bank swallowed them. At a 4.3 deck they
  // would be 1.7m blocks standing in the corner of the gallery,
  // right where the stairs arrive, leaving a 4m squeeze to get
  // past. So the plinth top is pinned to the deck and the column
  // grows straight out of the floor instead.
  // ==========================================================
  [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz], i) => {
    const x = sx * (ARENA_W / 2 - 8);
    const z = sz * (ARENA_L / 2 - 14);
    const plinth = GALLERY ? DECK_Y : 6;
    el("m-cube", { x: x, z: z, y: plinth / 2, width: 14, height: plinth, depth: 14, color: STONE, collide: "true" });
    el("m-cylinder", { x: x, z: z, y: (plinth + 38) / 2, radius: 4.2, height: 38 - plinth, color: "#2a1f5c" });
    el("m-sphere", { x: x, z: z, y: 40, radius: 4.5, color: "#2a1f5c" });
    el("m-cylinder", { x: x, z: z, y: 44, radius: 3.0, height: 8, color: jewel(i) });
    el("m-sphere", { x: x, z: z, y: 49, radius: 3.0, color: jewel(i) });
    el("m-light", { x: x, z: z, y: 49, type: "point", intensity: 26, color: jewel(i) });
  });

  // ==========================================================
  // ARCHES
  // ==========================================================
  [[START_Z, "START", 0], [FINISH_Z, "FINISH", 1]].forEach(([z, word, i]) => {
    [-1, 1].forEach((s) => {
      const px = s * (FIELD_W / 2 + 5);
      el("m-cube", { x: px, z: z, y: 1.6, width: 5, height: 3.2, depth: 5, color: STONE, collide: "true" });
      el("m-cylinder", { x: px, z: z, y: 9, radius: 1.6, height: 12, color: "#2a1f5c" });
      el("m-sphere", { x: px, z: z, y: 15.6, radius: 2.0, color: jewel(i) });
      el("m-light", { x: px, z: z, y: 15.6, type: "point", intensity: 15, color: jewel(i) });

      // The word, at head height on the plinth. With the gallery on
      // the plinth is buried inside the bank, so this rides up to
      // read from the deck instead of being swallowed by it.
      [0, 180].forEach((ry) => {
        el("m-label", {
          x: px, z: z + (ry ? -2.6 : 2.6), y: GALLERY ? DECK_Y + 1.9 : 2.4, ry: ry,
          width: 4.6, height: 1.6, "font-size": 105, alignment: "center",
          color: "#120c26", "font-color": GOLD, content: word,
        });
      });
    });

    el("m-cube", { z: z, y: 15, width: FIELD_W + 14, height: 1.8, depth: 1.8, color: "#2a1f5c" });
    [0, 180].forEach((ry) => {
      el("m-label", {
        z: z, y: 17.6, ry: ry,
        width: word.length * 2.6, height: 4,
        "font-size": 180, alignment: "center",
        color: "#120c26", "font-color": GOLD, content: word,
      });
    });
  });

  el("m-light", { y: 44, type: "point", intensity: 42, color: "#6d5cae" });
  el("m-light", { z: -FIELD_L / 3, y: 30, type: "point", intensity: 24, color: "#5d4b9c" });
  el("m-light", { z: FIELD_L / 3, y: 30, type: "point", intensity: 24, color: "#5d4b9c" });

  // ==========================================================
  // FLOOR INLAY
  // ------------------------------------------------------------
  // Flat, non-colliding, and fixed. Pure decoration - but useful
  // here, because a runner freezing on a line has something to
  // measure themselves against.
  // ==========================================================
  const INLAY = 0.22;

  // centre rosette
  [[15, "#31235f"], [11.5, "#3a2a72"], [8, "#31235f"], [5, "#4a3690"], [2.2, GOLD]]
    .forEach(([r, color], i) => {
      el("m-cylinder", { y: INLAY + i * 0.01, radius: r, height: 0.04, color: color });
    });
  for (let i = 0; i < 16; i++) {
    el("m-cube", {
      y: INLAY + 0.06, ry: i * 22.5,
      width: 0.25, height: 0.04, depth: 34, color: GOLD, opacity: 0.5,
    });
  }

  // straight transverse bands, evenly spaced
  for (let d = 20; d < FIELD_L; d += 20) {
    const z = -FIELD_L / 2 + d;
    if (Math.abs(z) < 18) continue;
    el("m-cube", {
      z: z, y: INLAY, width: FIELD_W - 12, height: 0.04, depth: 0.3,
      color: GOLD, opacity: 0.32,
    });
  }

  // long inlaid borders, well inside the running surface
  [-1, 1].forEach((s) => {
    el("m-cube", { x: s * (FIELD_W / 2 - 6), y: INLAY, width: 0.3, height: 0.04, depth: FIELD_L - 12, color: GOLD, opacity: 0.4 });
    el("m-cube", { x: s * (FIELD_W / 2 - 7.2), y: INLAY, width: 0.12, height: 0.04, depth: FIELD_L - 12, color: GOLD, opacity: 0.25 });
  });

  // ==========================================================
  // VAULT RIBS + CHANDELIERS overhead
  // ==========================================================
  for (let d = 25; d < FIELD_L; d += 50) {
    const z = -FIELD_L / 2 + d;

    el("m-cube", { z: z, y: 52, width: ARENA_W - 6, height: 1.2, depth: 1.6, color: "#2a1f5c" });
    [-1, 1].forEach((s) => {
      el("m-cube", { x: s * (ARENA_W / 2 - 8), z: z, y: 46, width: 1.4, height: 12, depth: 1.6, color: "#2a1f5c" });
    });

    const ch = document.createElement("m-group");
    ch.setAttribute("z", z);
    ch.setAttribute("y", 26);
    arena.append(ch);

    el("m-cylinder", { y: 14, radius: 0.2, height: 28, color: "#2a1f5c" }, ch);
    el("m-cylinder", { radius: 5.5, height: 0.5, color: "#2a1f5c" }, ch);
    el("m-cylinder", { radius: 3.0, height: 0.4, y: 1.4, color: "#2a1f5c" }, ch);
    for (let b = 0; b < 8; b++) {
      const a = b * 45 * Math.PI / 180;
      el("m-sphere", {
        x: 5.5 * Math.sin(a), z: 5.5 * Math.cos(a),
        y: -1.2, radius: 0.9, color: jewel(b + d),
      }, ch);
    }
    el("m-light", { y: -2, type: "point", intensity: 22, color: "#e0a865" }, ch);

    const spin = document.createElement("m-attr-anim");
    spin.setAttribute("attr", "ry");
    spin.setAttribute("start", "0");
    spin.setAttribute("end", "360");
    spin.setAttribute("duration", "48000");
    spin.setAttribute("loop", "true");
    ch.append(spin);
  }

  // ==========================================================
  // DECORATION - wall banners only, evenly spaced, nothing loose
  // ==========================================================
  if (DETAIL) {
    [-1, 1].forEach((s, si) => {
      for (let z = -100; z <= 100; z += 50) {
        el("m-cube", {
          x: s * (ARENA_W / 2 - 2.2), z: z, y: 30,
          width: 0.4, height: 26, depth: 9,
          color: jewel(si + (z + 100) / 50),
        });
        el("m-cube", {
          x: s * (ARENA_W / 2 - 2.2), z: z, y: 43.4,
          width: 0.6, height: 0.5, depth: 9.6, color: GOLD,
        });
      }
    });
  }

  // ==========================================================
  // CAGES - built on demand, one per sprung trap
