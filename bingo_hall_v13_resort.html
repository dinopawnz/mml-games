  BINGO HALL  v12
  ============================================================
  v4 - LOOK, LIGHTS, MANUAL DAUB, FLOOR MAP

  1. NO AUTO-DAUB. It's gone from the code, not just switched off.
     Players click every number themselves. Every number is its own
     square: click the number, the square turns red with the number
     still on it. Click again to undo. No bars, no click positions.
     The middle square says FREE. Only the booth's owner can daub.

  2. EVERYTHING IS ON THE HOST DESK SCREEN (the separate monitor is
     gone). Top left:
       - THE VERDICT on the claim being checked, green or red:
         BOOTH 14: REAL BINGO - SAY YES   and the reason under it
       - BINGO NOT CALLED: booths that have the pattern, daubed,
         but haven't pressed BINGO
       - MISSED A DAUB: the pattern is there on called numbers but
         the player hasn't daubed all of it
     Top right, THE BOOTH MAP: every booth as a bar, laid out the way
     you see the floor standing behind the desk (nearest row at the
     bottom, the aisle as the gap in the middle).
       HAS BINGO    green   has a real bingo, hasn't pressed BINGO
       MISSED DAUB  purple  a whole line's been called but they
                            haven't clicked all of it
       CLAIMED      gold    pressed BINGO - flashes green (real) or
                            red (not a bingo). Solid gold = winner
       PLAYING      blue    in a booth, nothing to act on
       (dark = empty booth)
     The safety catch is unchanged: saying NO to a real bingo (or YES
     to a fake one) is refused the first time; press again within 10
     seconds to force it.

  3. The HOW TO PLAY board is on the left wall as you come in, not
     standing in the lobby.

  4. Lights a notch lower (LIGHT 0.015, was 0.018), and the two lights
     don't cast shadows - that's the biggest frame-rate win in here.

  LOOK (v5): THE BINGO PALACE. The underwater floor is gone. Emerald
     walls with cream-and-gold pilasters, gold art-deco sunbursts on
     every panel, a frieze of numbered bingo balls round the top of the
     room, red carpet with a gold diamond lattice under the booths, a black
     marble aisle with bingo balls inlaid, and a cream marble lobby with
     BINGO spelled across the entrance in brass letters on black marble.
     Crystal chandeliers down the aisle, pendant lamps of five B-I-N-G-O
     balls over the booths, red velvet stage curtains and twinkling
     marquee bulbs round the stage opening and the sign out front. On
     stage: two brass ball cages that turn all night and two giant
     bingo balls on pedestals either side of the desk.
     THE REEF: a 22 m reef tank built into the right-hand wall - walnut
     cabinet and hood, gold-framed glass, rockwork, corals, sea fans,
     swaying seagrass, schools of fish, a sea turtle, seahorses, moon
     jellies, rising bubbles and a sunken bingo ball. All movement is
     client-side animation, no network traffic. If the glass draws solid
     in Otherside, set TANK_GLASS_OPACITY to 0 (an invisible wall stays).
     TANK false removes it. BULB_TWINKLE false stills the bulbs.
  THE FRONT (v7): a gold arched portal with a stained-glass fanlight and
     B-I-N-G-O balls, the name on a navy-and-gold plaque, a crown bingo
     ball "7" in a gold sunburst over the arch, bulbs round the arch, two
     glowing water columns with fish, banners, corner towers with glass
     cupolas, and a glass aquarium dome on the roof with a whale circling
     inside. Out front: a marble plaza with a compass medallion, a black
     marble walk with lamp posts, two fountains, flowerbeds, cypress trees
     and a monument sign. DOME false drops the dome, OUTSIDE_FANCY false
     drops the lamps, fountains, beds, trees and sign.
  LOGOS (v8): the OG flame is inlaid in gold on the walk outside the doors
     and crowns the monument sign. The Other Games logo sits either side
     of the crown ball on the front, over the doors on the inside, and on
     every empty booth's screen above CLICK TO PLAY (it goes when the card
     appears). The logo images are embedded in the file (v9) - nothing
     to upload. LOGOS false turns them all off.
  TRIANGLES (v10): cut to get well under Otherside's 1 million limit.
     The damask armchair models are swapped for block-built velvet
     armchairs (GLB_DECOR true brings the models back - they're heavy).
     LOWPOLY draws thin rods and tiny balls as boxes. The flowerbed bush
     balls became clipped hedges, cypresses are one shape, tower greenery
     and tank sand mounds are gone, 4 ball pendants instead of 6, fewer
     fish in the dome, and some small discs became squares.
  LOGOS (v11): every logo is now ApeChurch - on the walk outside the
     doors, in the circle on top of the monument sign (raised so it sits
     fully clear of the sign), inside over the doors, and on every empty
     booth's screen above CLICK TO PLAY. The two logos either side of the
     crown ball are gone. (v12) The two giant balls on the stage carry the
     ApeChurch logo instead of numbers.
  RESORT (v13): the hall now sits on a sand island in a turquoise
     lagoon (20_Sand deed pack). The outside walls are wrapped in massive
     Luster gold slabs (05_Luster pack texture) carrying Ape Church menu
     boards: THE MENU, HOW TO PLAY, THE BALLS, HOUSE RULES, BEACH BAR,
     GOOD LUCK, the welcome board and the logomark. A boardwalk runs from
     the plaza through a gold ring to a pier with a second ring over the
     water, with green-and-cream cabanas either side, palms, giant shells,
     sea stacks, gold towers, trees and orbs. All static: two GLBs in
     #resort. The front stone is Luster gold. Lights are capped at 1.
     GAME LOGIC IS UNCHANGED.
  TRIANGLES (v14): small parts that are far overhead or hidden are drawn
     as boxes (lowpoly: true on the element) - the tower and crown finials,
     the chandelier tips, the cage finials, the fish in the dome, the lamp
     poles, the fountain jets and the cypress trunks. About 12,000 fewer
     triangles in the file's own shapes (123k -> 110k). Looks the same.
  LOGOS (v17): the ApeChurch logos are gone. The Other Games wordmark is
     inside over the doors and on every empty booth's screen above CLICK
     TO PLAY; the OG flame, in gold, is on the walk outside the doors, in
     the circle on top of the monument sign and on the two giant stage
     balls. (The menu boards on the outside walls are part of the resort
     model, not this file.)
  LOAD (v17): SAME GAME, SAME LOOK, LIGHTER CARDS.
     Everything plays and looks exactly as v14: every card is visible to
     everyone, click a number and the square turns red, green/red while
     a host checks it. What changed is HOW the squares are drawn.
     A text label is drawn fresh for every square on every screen - it
     has its own text texture, and a daub redraws it. A card is 31 of
     them, and every visitor draws every player's card. Now each square
     is a picture instead: the 75 numbers x 4 colours (cream, red,
     green, check-red), the B I N G O headers and FREE are baked into
     this file as tiny images drawn exactly the way a label draws them
     (same size, bold Arial, same spacing). Every card in the hall
     shares the same 306 pictures, so a client decodes each one once
     however many players there are, and a daub just swaps a square to
     a picture it already has - nothing is redrawn. Only the message
     line under each card is still a text label (its text changes).
     The 40 brass booth numbers never change, so they're pictures too.
     (v18) Otherside lights a picture differently from a label, so the
     plates came out brighter and yellower than before. They're now
     baked in the colours a label plate actually shows in the hall
     (measured from screenshots), so they look as they did in v14.
     The wall frieze balls are back to text labels.
       CARD_TILES false  = card squares back to text labels
       STATIC_TILES false = booth numbers back to text labels
  5. (older) bottle-green walls with walnut pilasters, a curtained
     stage opening, pendant lamps, brass-capped booth partitions and
     B-I-N-G-O medallions on the front of the host desk. Booth rows
     are built as shared shells (one counter, one front, shared
     partitions per block of 4), so the hall has fewer objects than
     v3 even with the extra detail.

  A card counts as a bingo when the pattern is complete on numbers
  that were called AND daubed. The FREE square counts. Extra daubs
  on uncalled numbers elsewhere don't spoil a real line.

  STILL FROM v2/v3 (the light build): an empty booth draws no card;
  a daub only changes one square's colour; the called board is 5
  labels; HOST YES / NO keys only exist while a booth is being
  checked.

  THE CODE IS 2580 (HOST_CODE below). Change it before a public
  event and keep this file to yourself.

  ------------------------------------------------------------
  SPAWN / TURNING
  ------------------------------------------------------------
  BUILD_RY is 180, so the front doors face arrival. With the turn,
  the doors are at world z -26 and the stage is at the far end.
  Set your spawn just outside the doors: x 0, z -32, y 0.
  BUILD_RY 0 undoes the turn.

  ------------------------------------------------------------
  FOR PLAYERS
  ------------------------------------------------------------
  1. Walk into any booth whose light is GREEN.
  2. Click CLICK TO PLAY on the TV - that booth is yours (its light
     turns blue) and your card appears. One booth each.
  3. When a ball is called, click that number on your card - its
     square turns red. Click again to un-daub.
  4. Got the pattern? Hit the red BINGO button on your desk. Your
     card locks, a BINGO! sign lights up over your booth and the
     hall waits for a host.

  Nothing stops you daubing a number that was never called - that
  is what the hosts are checking for. A BAD BINGO locks your
  button for 20 seconds (BAD_BINGO_LOCK_MS).

  ------------------------------------------------------------
  FOR HOSTS
  ------------------------------------------------------------
  The HOST DESK is on the stage. Stand behind it facing the crowd.

  LOG IN FIRST: click TYPE CODE and enter 2580. Co-hosts do the
  same. Once logged in, these are plain clicks:
    CALL NEXT BALL   blocked while a BINGO is waiting to be checked
    AUTO             a ball every AUTO_SECONDS (pauses on a claim)
    PATTERN          ANY LINE / 4 CORNERS / BIG X / PICTURE FRAME /
                     BLACKOUT
    UNDO BALL        takes back the last ball (press twice)

  Every desk key flashes when pressed: CREAM = it worked, RED = it
  was refused. The bottom line of the screen says what happened
  (CALLED B 7 - BALL 12, TOO SOON, HOSTS ONLY...).

  These ALWAYS need the code typed:
    NEW GAME         wipes the board, deals new cards. People keep
                     their booths.
    CONFIRM          oldest claim  (2580 14 = booth 14)
    REJECT           oldest claim  (2580 14 = booth 14)

  AT THE BOOTH: a claiming booth shows HOST YES / HOST NO above its
  TV. Look at the card, click one, type the code. The VERIFY screen
  on the back wall mirrors the card being checked. While checked,
  the daubed squares turn GREEN (really called) or RED (never
  called).

  TYPE CODE commands (all start with the code):
    2580  log in          2580 c  call      2580 new  new game
    2580 yes 14 / 2580 no 14      2580 undo
    2580 auto 8 / 2580 auto off   2580 pattern corners
    2580 free 14   empty booth 14
  FRAME RATE TEST (v19):
    2580 fill        puts a card on every empty booth, as if the hall
                     were full (a few squares daubed on each)
    2580 clear       takes those test cards away again
    2580 tiles off   every card switches to the old text-label squares
    2580 tiles on    every card switches back to picture squares
    Note your frame rate: empty hall, then fill with tiles on, then
    tiles off. Nothing is saved - reloading the document resets it.
  ============================================================

  // ==========================================================
  // GUARD
  // ==========================================================
  const BUILD = "V19";
  let scriptErrors = 0;
  let lastError = "";
  function guard(fn) {
    return function (a, b) {
      try { return fn.call(this, a, b); }
      catch (err) {
        scriptErrors++;
        lastError = String((err && err.message) || err).slice(0, 40);
      }
    };
  }
  function every(fn, ms) { return setInterval(guard(fn), ms); }
  function later(fn, ms) { return setTimeout(guard(fn), ms); }
  function on(node, type, fn) { node.addEventListener(type, guard(fn)); }

  // ==========================================================
  // HELPERS
  // ==========================================================
  function fmt(v) { return typeof v === "number" ? String(+v.toFixed(3)) : String(v); }
  function el(tag, attrs, parent) {
    // LOW POLY: a round shape costs 10-40x the triangles of a box. Rods
    // thinner than 14 cm and balls smaller than 20 cm look the same as boxes.
    const lp = attrs && attrs.lowpoly; if (lp) { attrs = Object.assign({}, attrs); delete attrs.lowpoly; }
    if (LOWPOLY && tag === "m-cylinder" && attrs.radius !== undefined && (attrs.radius <= 0.07 || lp)) {

      delete attrs.radius; tag = "m-cube";
    } else if (LOWPOLY && tag === "m-sphere" && attrs.radius !== undefined && (attrs.radius < 0.1 || lp)) {
      const d = attrs.radius * 1.7;

      delete attrs.radius; tag = "m-cube";

    const n = document.createElement(tag);

    if (shape) { n.setAttribute("collide", "false"); n.__a.collide = "false"; }

      let v = attrs[k];
      if (v === undefined || v === null) continue;
      if (tag === "m-light" && k === "intensity") v = Math.min(1, Math.round(v * LIGHT * 100) / 100);
      v = fmt(v);
      n.setAttribute(k, v);
      n.__a[k] = v;
    }

  let idSeen = false, noIdHits = 0;

    if (id === undefined || id === null) { noIdHits++; return undefined; }

  function idsText() { return idSeen ? "IDS OK" : noIdHits ? "NO PLAYER IDS" : "IDS -"; }

  function tooSoon(obj, key, ms) {

  function slot(n) { return !n ? "    " : n < 10 ? "  " + n : String(n); }
  function rowText(card, r) {

  // ==========================================================
  // PATTERNS - card squares are r*5+c, 12 is FREE
  // ==========================================================
  const LINES = [];

  for (let c = 0; c < 5; c++) LINES.push({ name: "COLUMN " + LETTERS[c], cells: [0, 1, 2, 3, 4].map((r) => r * 5 + c) });

  let called = [];

  let pattern = PATTERNS[START_PATTERN] ? START_PATTERN : "LINE";
  let autoOn = false, autoSecs = AUTO_SECONDS, nextAutoAt = 0;
  let lastCallAt = 0;
  let claims = [];
  let winners = [];
  let lastReject = null;

  let boardNote = null;
  let deskNote = null;

  const hall = group({}, world);
  const boothRoot = group({}, world);

  // ==========================================================
  // BUILD HELPERS - marquee bulbs, art deco sunbursts
  // ==========================================================
  // A marquee bulb: a small cube that twinkles between warm white and
  // amber. Neighbours run opposite ways, so a row reads as chasing
  // lights. Client-side only (no network traffic); a client that can't
  // animate colour just shows them lit.
  function bulb(p, x, y, z, i) {
    const a = i % 2 ? BULB_B : BULB_A, b = i % 2 ? BULB_A : BULB_B;
    const n = box(p, x, y, z, 0.2, 0.2, 0.2, a);
    if (BULB_TWINKLE) el("m-attr-anim", { attr: "color", start: a, end: b, duration: 900, loop: "true", "ping-pong": "true" }, n);
    return n;
  }
  function bulbRow(p, x0, y0, z0, x1, y1, z1, gap) {
    const len = Math.hypot(x1 - x0, y1 - y0, z1 - z0), n = Math.max(1, Math.round(len / gap));
    for (let k = 0; k <= n; k++) {
      const t = k / n;
      bulb(p, x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, z0 + (z1 - z0) * t, k);
    }
  }
  // gold rays fanning up from a hub, flat in the parent's x/y plane
  function sunburst(p, x, y, z, len, rays, spread) {
    for (let k = 0; k < rays; k++) {
      const deg = -spread + (2 * spread * k) / (rays - 1), a = deg * Math.PI / 180;
      const L = k % 2 ? len * 0.7 : len;

  // ==========================================================
  // BUILD - HALL SHELL
  // ==========================================================
  (function buildShell() {
    const zMid = (Z_BACK + Z_FRONT) / 2, zLen = Z_FRONT - Z_BACK;
    // FLOOR - red carpet with a gold diamond lattice under the booths,
    // a black marble aisle with gold edges, cream marble tiles in the lobby
    const LZ0 = 14.5, BZ0 = STAGE_FRONT + 1, BX = HALL_HW - 1.2;
    box(hall, 0, -0.05, zMid, HALL_HW * 2, 0.1, zLen, CARPET, { collide: "true" });
    // the lattice: two sets of diagonal gold lines, clipped to the seating area
    (function lattice() {
      const STEP = 3.2;
      [1, -1].forEach((dir) => {
        // lines x = dir * z + c
        const cs = [-BX - (dir > 0 ? LZ0 : -BZ0), BX - (dir > 0 ? BZ0 : -LZ0)];

      box(hall, s * (HALL_HW - 0.01), WALL_H / 2, zMid, 0.02, WALL_H, zLen, WALL);

      box(hall, s * (HALL_HW - 0.06), 2.62, zMid, 0.1, 0.1, zLen, GOLD);

      box(hall, s * (DOOR_HW + segW / 2), WALL_H / 2, Z_FRONT - 0.01, segW, WALL_H, 0.02, WALL);

      zs.forEach((z) => {

    box(hall, 0, WALL_H - 0.4, Z_FRONT + 0.52, HALL_HW * 2 + 1, 0.3, 0.06, GOLD);         // facade cornice
    box(hall, 0, DOOR_H + 0.2, Z_FRONT + 0.25, DOOR_HW * 2 + 0.8, 0.4, 0.7, GOLD);
    box(hall, 0, 1.3, Z_BACK + 0.03, HALL_HW * 2, 2.6, 0.06, ONYX);

    // CHANDELIERS - three tiered crystal ones down the aisle. They turn

    function chandelier(x, z) {

      el("m-cylinder", { x: x, y: top - 0.06, z: z, radius: 1.1, height: 0.04, color: CEIL }, hall);
      el("m-cylinder", { x: x, y: (top + y + 1.5) / 2, z: z, radius: 0.05, height: top - y - 1.5, color: GOLD }, hall);
      const g = group({ x: x, y: y, z: z }, hall);
      el("m-attr-anim", { attr: "ry", start: 0, end: 360, duration: 90000, loop: "true" }, g);
      [[1.4, 0.75, 9], [0.8, 1.3, 14], [0.2, 0.75, 9]].forEach((t) => {
        const ty = t[0], r = t[1], n = t[2];

    // BALL PENDANTS over the booths: five bingo balls on gold wires,
    // turning slowly.
    function ballPendant(x, z) {
      const y = 14.4, top = WALL_H - 0.02;
      el("m-cylinder", { x: x, y: top - 0.02, z: z, radius: 0.5, height: 0.04, color: GOLD }, hall);
      el("m-cylinder", { x: x, y: (top + y + 0.9) / 2, z: z, radius: 0.035, height: top - y - 0.9, color: GOLD }, hall);
      const g = group({ x: x, y: y, z: z }, hall);
      el("m-attr-anim", { attr: "ry", start: 0, end: 360, duration: 40000, loop: "true" }, g);
      el("m-cylinder", { y: 0.9, radius: 0.95, height: 0.06, color: GOLD }, g);
      const drops = [0.2, 0.7, 0.4, 0.85, 0.5];
      LETTERS.forEach((L, i) => {

  // ==========================================================

  (function buildFront() {

      [-0.4, 0, 0.4].forEach((f) => box(hall, x + f, SPRING / 2, F + 1.22, 0.08, SPRING - 1.6, 0.04, GOLD));

    });
    const ARCH_N = 18;

      const t0 = (k / ARCH_N) * Math.PI, t1 = ((k + 1) / ARCH_N) * Math.PI, tm = (t0 + t1) / 2;
      const chord = 2 * AR * Math.sin((t1 - t0) / 2) + 0.06, deg = (tm * 180) / Math.PI + 90;
      box(hall, AR * Math.cos(tm), SPRING + AR * Math.sin(tm), F + 0.6, chord, AW, 1.2, GOLD, { rz: deg });
      const R2 = AR + 1.05, chord2 = 2 * R2 * Math.sin((t1 - t0) / 2) + 0.06;
      box(hall, R2 * Math.cos(tm), SPRING + R2 * Math.sin(tm), F + 0.25, chord2, 0.24, 0.5, GOLD, { rz: deg });
    }
    // marquee bulbs round the inside of the arch
    for (let k = 0, n = 30; k <= n; k++) {

      box(hall, rm * Math.cos(a), SPRING + rm * Math.sin(a), F + 0.17, L, 0.07, 0.04, GOLD, { rz: deg });
    }
    // B-I-N-G-O balls on an arc in the fanlight
    LETTERS.forEach((L, i) => {
      const a = ((145 - i * 27.5) * Math.PI) / 180, x = 5 * Math.cos(a), y = SPRING + 5 * Math.sin(a);
      el("m-cylinder", { x: x, y: y, z: F + 0.24, rx: 90, radius: 0.62, height: 0.12, color: L_BG[i] }, hall);
      el("m-cylinder", { x: x, y: y, z: F + 0.31, rx: 90, radius: 0.4, height: 0.04, color: "#ffffff" }, hall);
      label(hall, L, { x: x, y: y, z: F + 0.34, w: 0.5, h: 0.5, chars: 1, bg: "#ffffff", fg: INK });

    // the name, on a gold-framed plaque across the arch
    box(hall, 0, 10.2, F + 0.85, 13.4, 2.1, 0.1, GOLD);

  // ==========================================================
  // BUILD - THE REEF TANK, set into the right-hand wall. Walnut cabinet
  // and hood, cream-and-gold end pillars, a 22 m glass front. Inside:
  // rockwork, corals, sea fans and swaying seagrass, schools of fish, a
  // sea turtle, seahorses, moon jellies, rising bubbles and a sunken
  // bingo ball. All movement is client-side animation - no network
  // traffic. Built in wall-local terms: x runs along the wall, z comes
  // out of the wall towards the room.
  // ==========================================================
  (function buildReefTank() {
    if (!TANK) return;
    let seed = 11;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const HALF = (TANK_Z1 - TANK_Z0) / 2, PIL = 2, WIN = HALF - PIL;   // water shows from -WIN to WIN
    const Y0 = 1.2, Y1 = 4.9, TOP = TANK_HOOD_TOP, D = 1.9, GD = 1.8, BK = 0.15, SAND_Y = 1.45;
    const t = sideWall(TANK_SIDE, 0);
    if ((TANK_Z0 + TANK_Z1) / 2 !== 0) set(t, "z", (TANK_Z0 + TANK_Z1) / 2);
    const MUL = [-6.5, 0, 6.5];
    const PANES = [-WIN].concat(MUL, [WIN]);

    // --- the furniture ---
    box(t, 0, TANK_BASE / 2, D / 2 + 0.05, HALF * 2, TANK_BASE, D, WOOD, { collide: "true" });
    box(t, 0, 0.06, D + 0.07, HALF * 2, 0.12, 0.04, GOLD);
    box(t, 0, TANK_BASE - 0.03, D + 0.07, HALF * 2, 0.06, 0.06, GOLD);
    for (let k = 0; k < PANES.length - 1; k++) {
      const a = PANES[k], b = PANES[k + 1];
      box(t, (a + b) / 2, 0.47, D + 0.06, b - a - 0.7, 0.5, 0.02, GOLD);
      box(t, (a + b) / 2, 0.47, D + 0.075, b - a - 0.8, 0.42, 0.02, IVORY);
    }
    box(t, 0, (TANK_BASE + Y0) / 2, D - 0.05, HALF * 2, Y0 - TANK_BASE, 0.1, ONYX);        // lip under the glass
    box(t, 0, Y0, D + 0.01, HALF * 2, 0.05, 0.06, GOLD);
    // hood
    box(t, 0, (Y1 + TOP) / 2, D / 2 + 0.1, HALF * 2, TOP - Y1, D + 0.1, WOOD, { collide: "true" });
    box(t, 0, Y1 + 0.04, D + 0.16, HALF * 2, 0.08, 0.04, GOLD);
    box(t, 0, TOP - 0.04, D + 0.16, HALF * 2, 0.08, 0.04, GOLD);
    box(t, 0, (Y1 + TOP) / 2, D + 0.16, 4.2, 0.62, 0.02, GOLD);
    label(t, "THE REEF", { y: (Y1 + TOP) / 2, z: D + 0.18, w: 4.0, h: 0.52, chars: 8, bg: ONYX, fg: GOLD });
    // end pillars (the fish turn round inside these)
    [-1, 1].forEach((s) => {
      const u = s * (HALF - PIL / 2), yc = (TANK_BASE + Y1) / 2, h = Y1 - TANK_BASE;
      box(t, u, yc, D / 2 + 0.08, PIL, h, D + 0.06, IVORY, { collide: "true" });
      [-0.5, 0, 0.5].forEach((f) => box(t, u + f, yc - 0.5, D + 0.12, 0.06, h - 1.6, 0.02, GOLD));
      sunburst(t, u, Y1 - 1.05, D + 0.12, 0.8, 7, 62);
      box(t, s * (WIN - 0.02), (Y0 + Y1) / 2, (BK + GD) / 2, 0.02, Y1 - Y0, GD - BK, REEF_WATER);   // dark inner end
    });
    // glass and gold mullions
    const glassAttrs = TANK_GLASS_OPACITY > 0
      ? { opacity: TANK_GLASS_OPACITY, collide: "true" }
      : { visible: "false", collide: "true" };
    box(t, 0, (Y0 + Y1) / 2, GD, WIN * 2, Y1 - Y0, 0.03, "#d6f3ff", glassAttrs);
    MUL.forEach((u) => box(t, u, (Y0 + Y1) / 2, GD + 0.04, 0.12, Y1 - Y0, 0.06, GOLD));
    // brass rail to lean on
    for (let k = 0; k <= 6; k++) el("m-cylinder", { x: -WIN + (k * WIN) / 3, y: 0.5, z: D + 0.6, radius: 0.04, height: 1.0, color: GOLD }, t);
    el("m-cylinder", { y: 1.0, z: D + 0.6, rz: 90, radius: 0.05, height: WIN * 2, color: GOLD }, t);
    el("m-light", { y: 4.4, z: 1.2, type: "point", intensity: 45, distance: 14, color: "#7fd8ff" }, t);

    // --- the water ---
    box(t, 0, (Y0 + Y1) / 2, BK, WIN * 2, Y1 - Y0, 0.02, REEF_WATER);
    box(t, 0, (3.5 + Y1) / 2, BK + 0.01, WIN * 2, Y1 - 3.5, 0.02, REEF_MID);
    box(t, 0, (4.45 + Y1) / 2, BK + 0.02, WIN * 2, Y1 - 4.45, 0.02, REEF_TOP);
    box(t, 0, 4.62, BK + 0.03, WIN * 2, 0.05, 0.02, "#c8f4ff");                             // waterline
    for (let k = 0; k < 8; k++) {                                                            // light shafts
      box(t, -9.2 + k * 2.6 + rnd() * 0.8, 3.1, BK + 0.035, 0.3 + rnd() * 0.35, 3.0, 0.01, REEF_SHAFT, { rz: 12 + rnd() * 8 });
    }
    box(t, 0, (1.0 + SAND_Y) / 2, (BK + GD) / 2, WIN * 2, SAND_Y - 1.0, GD - BK - 0.02, REEF_SAND);

    // rockwork along the back, with a ledge bridging two rocks
    const ROCKS = ["#7a5d4c", "#5f4a42", "#8c6d58", "#6b5448"];
    const rocks = [[-9.4, 0.85], [-7.1, 0.7], [-4.7, 1.0], [-1.5, 0.8], [1.3, 1.1], [4.4, 0.75], [7.1, 1.0], [9.5, 0.8]];
    rocks.forEach((r, k) => el("m-sphere", { x: r[0], y: SAND_Y + r[1] * 0.3, z: 0.55, radius: r[1], sx: 1.45, sy: 0.8, sz: 0.6, color: ROCKS[k % 4] }, t));
    el("m-sphere", { x: 2.9, y: 2.55, z: 0.6, radius: 0.6, sx: 2.3, sy: 0.45, sz: 0.8, color: ROCKS[2] }, t);

    // brain corals
    [[-8.3, 1.1, 0], [-3.9, 1.35, 1], [0.3, 1.25, 2], [3.7, 1.45, 3], [9.0, 1.2, 4], [-5.6, 0.5, 5]].forEach((c) => {
      el("m-sphere", { x: c[0], y: SAND_Y + 0.12, z: c[1], radius: 0.28, sy: 0.65, color: CORALS[c[2]] }, t);
    });
    // branching corals
    function branch(u, d, color, h) {
      const g = group({ x: u, y: SAND_Y, z: d }, t);
      for (let k = 0; k < 5; k++) {
        const L = (0.5 + 0.12 * (k % 3)) * h;
        const arm = group({ rz: (k - 2) * 20, rx: k % 2 ? 14 : -14 }, g);
        el("m-cylinder", { y: L / 2, radius: 0.045, height: L, color: color }, arm);
      }
    }
    branch(-9.7, 1.3, CORALS[1], 1.1); branch(-6.1, 1.0, CORALS[0], 1.3); branch(-0.9, 1.35, CORALS[2], 1.0);
    branch(2.3, 1.15, CORALS[4], 1.2); branch(6.8, 1.25, CORALS[3], 1.0); branch(10.0, 1.1, CORALS[5], 1.2);
    // sea fans, rocking in the current
    [[-4.6, 0.45, 2.0, "#c24bd6"], [5.0, 0.45, 1.9, "#ff5b5b"], [-10.1, 0.5, 1.6, "#ff9f43"], [8.3, 0.5, 2.1, "#c24bd6"]].forEach((f, k) => {
      const g = group({ x: f[0], y: f[2], z: f[1] }, t);
      el("m-attr-anim", { attr: "rx", start: -7, end: 7, duration: 3600 + k * 500, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, g);
      el("m-cylinder", { y: 0.15, radius: 0.035, height: 0.3, color: f[3] }, g);
      // a lacy fan: branches radiating from the stem, with cross-ribs
      for (let k = 0; k < 9; k++) {
        const deg = -56 + k * 14, a = deg * Math.PI / 180, L = k % 2 ? 0.95 : 1.15;
        box(g, -Math.sin(a) * L / 2, 0.3 + Math.cos(a) * L / 2, 0, 0.035, L, 0.02, f[3], { rz: deg });
      }
      [0.55, 0.9].forEach((r) => box(g, 0, 0.3 + r * 0.9, 0.01, r * 1.55, 0.03, 0.02, f[3]));
    });
    // anemones
    [[5.8, 1.2, "#f7a8d8"], [-7.3, 1.35, "#ffd28a"]].forEach((a, k) => {
      const g = group({ x: a[0], y: SAND_Y, z: a[1] }, t);
      el("m-attr-anim", { attr: "rz", start: -5, end: 5, duration: 2400 + k * 700, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, g);
      el("m-cylinder", { y: 0.08, radius: 0.2, height: 0.16, color: "#b0406a" }, g);
      for (let j = 0; j < 10; j++) {
        const q = (j / 10) * Math.PI * 2;
        el("m-cylinder", { x: Math.sin(q) * 0.14, y: 0.33, z: Math.cos(q) * 0.14, rx: Math.cos(q) * 18, rz: -Math.sin(q) * 18, radius: 0.028, height: 0.36, color: a[2] }, g);
      }
    });
    // seagrass, swaying from the root
    [[-10.4, 0.3], [-10.0, 0.45], [-9.1, 0.35], [-5.3, 0.3], [-4.9, 0.4], [-4.2, 0.3], [-2.6, 0.35],
      [2.6, 0.3], [3.1, 0.4], [3.5, 0.3], [6.1, 0.35], [8.8, 0.3], [9.3, 0.42], [9.9, 0.32], [10.5, 0.4], [-0.3, 0.3]]
      .forEach((p, k) => {
        const h = 1.2 + rnd() * 1.3;
        const g = group({ x: p[0], y: SAND_Y - 0.05, z: p[1] }, t);
        el("m-attr-anim", { attr: "rz", start: -11, end: 11, duration: 2600 + Math.round(rnd() * 2400), loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, g);
        el("m-cylinder", { y: h / 2, radius: 0.045, height: h, color: SEAGRASS[k % 3] }, g);
      });

    // a sunken bingo ball and a little treasure chest
    const sb = group({ x: -3.2, y: SAND_Y + 0.12, z: 1.2, rz: 18, rx: -12 }, t);
    el("m-sphere", { radius: 0.34, color: L_BG[4] }, sb);
    el("m-cylinder", { z: 0.32, rx: 90, radius: 0.21, height: 0.03, color: "#ffffff" }, sb);
    label(sb, "O 75", { z: 0.34, w: 0.34, h: 0.2, chars: 4, bg: "#ffffff", fg: INK });
    const ch = group({ x: -2.1, y: SAND_Y, z: 1.15, ry: -15 }, t);
    box(ch, 0, 0.16, 0, 0.56, 0.3, 0.36, "#6b3f1e");
    [-0.2, 0.2].forEach((x) => box(ch, x, 0.16, 0, 0.05, 0.32, 0.38, GOLD));
    box(ch, 0, 0.3, 0.02, 0.5, 0.02, 0.3, GLOW);
    const lid = group({ y: 0.31, z: -0.18, rx: -50 }, ch);
    box(lid, 0, 0.02, 0.18, 0.56, 0.06, 0.36, "#6b3f1e");
    [[0.3, 0.3], [0.42, 0.22], [0.2, 0.36], [0.5, 0.33]].forEach((c) => el("m-cylinder", { x: c[0], y: 0.02, z: c[1], radius: 0.06, height: 0.02, color: GOLD }, ch));

    // bubbles: rise out of the sand and vanish into the hood
    [[-2.1, 1.15], [7.8, 0.5], [-7.7, 0.6]].forEach((c) => {
      for (let k = 0; k < 5; k++) {
        const b = el("m-sphere", { x: c[0] + (rnd() - 0.5) * 0.15, y: 1.3, z: c[1], radius: 0.035 + rnd() * 0.035, color: "#e6fbff" }, t);
        el("m-attr-anim", { attr: "y", start: 1.3, end: 5.1, duration: 3000 + k * 470 + Math.round(rnd() * 300), loop: "true" }, b);
      }
    });

    // --- the swimmers ---
    // Each loops the length of the tank and wraps round inside the end
    // pillars. dir 1 swims +x, -1 swims back the other way.
    function swimmer(y, d, ms, dir, bob) {
      const s = dir > 0 ? -(HALF - PIL / 2) : HALF - PIL / 2;
      const g = group({ x: s, y: y, z: d, ry: dir > 0 ? 0 : 180 }, t);
      el("m-attr-anim", { attr: "x", start: s, end: -s, duration: ms, loop: "true" }, g);
      const inner = group({}, g);
      el("m-attr-anim", { attr: "y", start: -bob, end: bob, duration: 2400 + Math.round(rnd() * 1600), loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, inner);
      return inner;
    }
    // a fish in profile, nose to +x
    function fish(p, x, y, z, r, body, tail, sy) {
      el("m-sphere", { x: x, y: y, z: z, radius: r, sx: 1.9, sy: sy || 1, sz: 0.55, color: body }, p);
      box(p, x - r * 2.05, y, z, r * 0.75, r * 1.5 * (sy || 1), 0.03, tail);
    }
    const scatter = (n, sx, sy, sz, f) => { for (let k = 0; k < n; k++) f((rnd() - 0.5) * sx, (rnd() - 0.5) * sy, (rnd() - 0.5) * sz, k); };
    // neon tetras
    let g = swimmer(3.3, 1.0, 21000, 1, 0.2);
    scatter(10, 1.3, 0.55, 0.6, (x, y, z) => fish(g, x, y, z, 0.065, "#39d6ff", "#ff3b5c"));
    // yellow tangs
    g = swimmer(2.6, 0.95, 28000, -1, 0.15);
    scatter(4, 1.4, 0.5, 0.4, (x, y, z) => fish(g, x, y, z, 0.16, "#ffd23a", "#ffc21a", 1.3));
    // pink anthias
    g = swimmer(4.0, 1.2, 24000, -1, 0.18);
    scatter(7, 1.2, 0.5, 0.5, (x, y, z) => fish(g, x, y, z, 0.08, "#ff6fb5", "#ffb3d9"));
    // green chromis
    g = swimmer(2.0, 1.25, 26000, 1, 0.15);
    scatter(6, 1.2, 0.4, 0.5, (x, y, z) => fish(g, x, y, z, 0.07, "#7ff0c4", "#bff8e0"));
    // a big blue tang with a black streak and a yellow tail
    g = swimmer(2.3, 1.35, 32000, 1, 0.2);
    fish(g, 0, 0, 0, 0.2, "#1f5fe0", "#ffd23a", 1.15);
    box(g, 0.02, 0.05, 0.12, 0.5, 0.06, 0.01, "#101820", { rz: -8 });
    // a pair of angelfish, tall and striped
    g = swimmer(3.2, 0.75, 36000, 1, 0.12);
    [[0, 0], [-0.6, 0.35]].forEach((o) => {
      el("m-sphere", { x: o[0], y: o[1], radius: 0.2, sx: 1.05, sy: 1.45, sz: 0.3, color: "#efe8d2" }, g);
      [-0.06, 0.08].forEach((sx) => box(g, o[0] + sx, o[1], 0.065, 0.035, 0.5, 0.01, "#1a1a1a"));
      box(g, o[0] - 0.05, o[1] + 0.4, 0, 0.05, 0.38, 0.02, "#efe8d2", { rz: 28 });
      box(g, o[0] - 0.05, o[1] - 0.4, 0, 0.05, 0.38, 0.02, "#efe8d2", { rz: -28 });
      box(g, o[0] - 0.28, o[1], 0, 0.14, 0.26, 0.02, "#efe8d2");
    });
    // a sea turtle, flippers beating
    g = swimmer(3.6, 1.0, 64000, -1, 0.25);
    el("m-sphere", { radius: 0.42, sx: 1.35, sy: 0.5, sz: 1.0, color: "#5f7a3a" }, g);
    el("m-sphere", { y: -0.08, radius: 0.38, sx: 1.3, sy: 0.35, sz: 0.95, color: "#d8c98f" }, g);
    el("m-sphere", { y: 0.1, radius: 0.28, sx: 1.4, sy: 0.4, sz: 1.0, color: "#7a8f45" }, g);
    el("m-sphere", { x: 0.68, y: 0.03, radius: 0.15, sx: 1.3, color: "#8fa060" }, g);
    [-1, 1].forEach((s) => {
      const fl = group({ x: 0.25, z: s * 0.32 }, g);
      el("m-attr-anim", { attr: "rx", start: -28 * s, end: 28 * s, duration: 1500, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, fl);
      box(fl, 0.05, 0, s * 0.18, 0.3, 0.04, 0.36, "#7d9050", { ry: s * 25 });
      box(g, -0.5, -0.02, s * 0.22, 0.2, 0.04, 0.2, "#7d9050", { ry: -s * 30 });
    });
    // clownfish hovering over their anemone
    const cf = group({ x: 5.8, y: SAND_Y + 0.75, z: 1.2 }, t);
    el("m-attr-anim", { attr: "ry", start: -30, end: 30, duration: 3800, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, cf);
    el("m-attr-anim", { attr: "y", start: SAND_Y + 0.65, end: SAND_Y + 0.85, duration: 1900, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, cf);
    [[0.15, 0.05, 0.1], [-0.25, -0.1, -0.1]].forEach((o) => {
      fish(cf, o[0], o[1], o[2], 0.1, "#ff7a1a", "#ff7a1a");
      [0.07, -0.08].forEach((bx) => box(cf, o[0] + bx, o[1], o[2], 0.035, 0.19, 0.12, "#ffffff"));
    });
    // seahorses bobbing by the seagrass
    [[-4.4, 2.3, 1.05], [9.6, 2.6, 1.0]].forEach((p, k) => {
      const h = group({ x: p[0], y: p[1], z: p[2], ry: k ? 180 : 0 }, t);
      el("m-attr-anim", { attr: "y", start: p[1] - 0.12, end: p[1] + 0.12, duration: 3000 + k * 600, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, h);
      const c = k ? "#ffb03a" : "#ff8fb8";
      el("m-sphere", { radius: 0.1, sy: 2.0, sz: 0.8, color: c }, h);
      el("m-sphere", { x: 0.04, y: -0.02, radius: 0.08, sy: 1.5, sz: 0.8, color: c }, h);
      el("m-sphere", { x: 0.05, y: 0.25, radius: 0.075, sz: 0.8, color: c }, h);
      el("m-cylinder", { x: 0.16, y: 0.24, rz: 90, radius: 0.025, height: 0.16, color: c }, h);
      el("m-cylinder", { x: -0.03, y: -0.3, rz: 15, radius: 0.03, height: 0.24, color: c }, h);
      el("m-sphere", { x: 0.02, y: -0.44, radius: 0.045, color: c }, h);
      box(h, -0.1, 0.02, 0, 0.08, 0.14, 0.02, c);
    });
    // moon jellies drifting up and down
    [[-8.3, 3.9, 1.0], [8.6, 3.5, 0.9]].forEach((p, k) => {
      const j = group({ x: p[0], y: p[1], z: p[2] }, t);
      el("m-attr-anim", { attr: "y", start: p[1] - 0.5, end: p[1] + 0.35, duration: 7000 + k * 1500, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, j);
      el("m-sphere", { radius: 0.28, sy: 0.6, color: "#e9d8ff" }, j);
      el("m-sphere", { y: -0.05, radius: 0.18, sy: 0.5, color: "#fff0ff" }, j);
      for (let q = 0; q < 4; q++) {
        const a = (q / 4) * Math.PI * 2;
        el("m-cylinder", { x: Math.sin(a) * 0.14, y: -0.35, z: Math.cos(a) * 0.14, radius: 0.015, height: 0.5, color: "#e6d0ff" }, j);
      }
    });
  })();

  // ==========================================================
  // BUILD - DECOR: damask armchairs (one 2 MB model, loaded once,
  // no lights inside it, no glass) + side tables with little lamps.
  // Lounges in the lobby and a pair of host chairs on the stage.
  // ==========================================================
  (function buildDecor() {
    const CS = 1.35;                // armchair ~0.93 m tall
    const VELVET = "#5b2a6e", VELVET_DK = "#43204f";
    function chair(p, x, y, z, face) {
      if (GLB_DECOR) return el("m-model", { src: CHAIR_GLB, x: x, y: y, z: z, ry: face + CHAIR_FACE, sx: CS, sy: CS, sz: CS }, p);
      // a velvet club armchair from boxes, facing its local +z
      const g = group({ x: x, y: y, z: z, ry: face }, p);
      box(g, 0, 0.3, 0.02, 0.9, 0.24, 0.8, VELVET, { collide: "true" });          // base
      box(g, 0, 0.47, 0.06, 0.66, 0.12, 0.68, VELVET_DK);                        // cushion
      box(g, 0, 0.72, -0.32, 0.9, 0.72, 0.18, VELVET, { collide: "true" });      // back
      box(g, 0, 1.09, -0.32, 0.92, 0.04, 0.2, GOLD);
      [-1, 1].forEach((s) => {
        box(g, s * 0.39, 0.6, 0.04, 0.14, 0.34, 0.78, VELVET);                   // arms
        box(g, s * 0.39, 0.78, 0.04, 0.16, 0.03, 0.8, GOLD);
        [-0.3, 0.33].forEach((lz) => box(g, s * 0.36, 0.09, lz, 0.07, 0.18, 0.07, GOLD));   // legs
      });
      return g;
    }
    function sideTable(p, x, y, z) {
      el("m-cylinder", { x: x, y: y + 0.02, z: z, radius: 0.22, height: 0.04, color: GOLD }, p);
      el("m-cylinder", { x: x, y: y + 0.32, z: z, radius: 0.045, height: 0.56, color: GOLD }, p);
      el("m-cylinder", { x: x, y: y + 0.62, z: z, radius: 0.36, height: 0.05, color: WOOD }, p);
      el("m-cylinder", { x: x, y: y + 0.82, z: z, radius: 0.02, height: 0.36, color: GOLD }, p);
      el("m-cylinder", { x: x, y: y + 1.05, z: z, radius: 0.17, height: 0.22, color: SHADE }, p);
    }
    // lobby lounges, one each side of the runner, chairs facing the aisle
    [-1, 1].forEach((s) => {
      const x = s * 16, face = s < 0 ? 90 : -90;
      box(hall, x, 0.03, 20, 3.4, 0.02, 5.4, GOLD);                 // rug with a brass edge
      box(hall, x, 0.042, 20, 3.2, 0.02, 5.2, LOUNGE_RUG);
      chair(hall, x, 0.05, 18.4, face);
      chair(hall, x, 0.05, 21.6, face);
      sideTable(hall, x, 0.05, 20);
    });
    // host chairs either side of the desk, facing the crowd
    [-1, 1].forEach((s) => {
      chair(hall, s * 9.2, STAGE_H, -33.2, 0);

  function showCard(b) {

    b.cardG = g;

  // One shell per block of booths: a mat, a front, a counter and shared
  // brass-capped partitions - far fewer objects than a shell per booth.
  function buildBlock(s, z, row) {
    const len = BOOTHS_PER_SIDE * BW, xc = s * (AISLE / 2 + len / 2);
    box(boothRoot, xc, 0.525, z - BD / 2 + 0.05, len - 0.14, 1.05, 0.1, WOOD, { collide: "true" });
    box(boothRoot, xc, 1.09, z - 1.3, len - 0.14, 0.08, 0.75, "#2a1a10", { collide: "true" });
    for (let k = 0; k <= BOOTHS_PER_SIDE; k++) {
      const x = s * (AISLE / 2 + k * BW + (k === 0 ? 0.07 : k === BOOTHS_PER_SIDE ? -0.07 : 0));
      box(boothRoot, x, 1.0, z, 0.14, 2.0, BD, WOOD, { collide: "true" });
      box(boothRoot, x, 2.03, z, 0.2, 0.06, BD + 0.04, GOLD);
    }
    if (FANCY) {
      // booth walls: an ivory panel set into every partition (one block shows
      // on both faces), under the gold cap
      for (let k = 0; k <= BOOTHS_PER_SIDE; k++) {
        const x = s * (AISLE / 2 + k * BW + (k === 0 ? 0.07 : k === BOOTHS_PER_SIDE ? -0.07 : 0));
        box(boothRoot, x, 1.05, z + 0.3, 0.17, 1.2, 2.2, IVORY);

      box(boothRoot, xc, 0.55, z - BD / 2 - 0.01, len - 0.5, 0.7, 0.02, IVORY);
      box(boothRoot, xc, 1.04, z - BD / 2 - 0.02, len - 0.14, 0.05, 0.04, GOLD);
      // gold lip on the player's counter
      box(boothRoot, xc, 1.14, z - 0.925, len - 0.14, 0.03, 0.04, GOLD);
    }
  }

  (function buildBooths() {
    let n = 1;
    for (let r = 0; r < BOOTH_ROWS; r++) {
      const z = ROW0 + r * ROW_PITCH;
      buildBlock(-1, z, r);
      buildBlock(1, z, r);
      const xs = [];
      for (let k = BOOTHS_PER_SIDE - 1; k >= 0; k--) xs.push(-(AISLE / 2 + BW / 2 + k * BW));
      for (let k = 0; k < BOOTHS_PER_SIDE; k++) xs.push(AISLE / 2 + BW / 2 + k * BW);
      xs.forEach((x) => buildBooth(n++, x, z, r));
    }

  // ==========================================================
  // BUILD - HOST DESK
  // ==========================================================
  // The desk screen is split: claim check and status on the left, the
  // booth map on the right, one row of keys along the edge nearest the
  // host. It's no taller than v3's, so it doesn't block the board.
  // The map is drawn the way the host sees the floor from behind the
  // desk: nearest row at the bottom, booth 1 of each row on the right.
  const NB = BOOTHS_PER_SIDE * 2;                 // booths per row
  const MAP_P = 0.3;                              // map pitch (metres)
  function mapIdx(j) { return NB - 1 - j; }       // screen slot -> booth in row
  function mapX(j) { return MAP_P * (j - (NB - 1) / 2 + (j >= NB / 2 ? 0.5 : -0.5)); }
  function mapRowText(r) {
    const a = [];
    for (let j = 0; j < NB; j++) a.push(slot(r * NB + mapIdx(j) + 1) + (j === NB / 2 - 1 ? "          " : "   "));
    return a.join("").trimEnd();
  }

  const desk = { map: [] };
  const FLASH_MS = 350;
  function flashKey(n, ok) {
    const k = desk.keys.find((q) => q.el === n);
    if (!k) return;
    k.flash = { until: Date.now() + FLASH_MS, bg: ok ? "#fff4c2" : "#ff3030", fg: ok ? INK : "#ffffff" };
    paintDesk();
    later(paintDesk, FLASH_MS + 30);
  }
  (function buildDesk() {
    const SW = 13.0, SH = 2.8;
    const g = group({ x: 0, y: STAGE_H, z: -29.5, ry: 180 }, hall);
    box(g, 0, 0.5, 0, SW + 0.4, 1.0, 1.0, WOOD, { collide: "true" });
    box(g, 0, 1.0, 0, SW + 0.6, 0.06, 1.1, GOLD);
    box(g, 0, 0.85, -1.2, SW, 1.7, 0.3, WOOD);
    // crowd side: B I N G O medallions
    LETTERS.forEach((L, i) => {
      el("m-cylinder", { x: (i - 2) * 1.8, y: 0.9, z: -1.38, rx: 90, radius: 0.5, height: 0.06, color: L_BG[i] }, g);
    });

    const s = group({ y: 1.0, z: 0.5, rx: -60 }, g);
    box(s, 0, SH / 2 - 0.05, -0.1, SW + 0.16, SH + 0.16, 0.04, GOLD);
    box(s, 0, SH / 2 - 0.05, -0.06, SW, SH, 0.08, FRAME, { collide: "true" });

    // left: status up top, the verdict right above the keys
    const line = (y, h, chars, fg) => label(s, "", { x: -2.95, y: y, z: 0.02, w: 6.8, h: h, chars: chars, align: "left", bg: SCREEN, fg: fg });
    desk.diag = line(2.54, 0.24, 72, KEY_GREY);
    desk.status = line(2.26, 0.26, 64, CHALK);
    desk.sleepers = line(1.96, 0.26, 64, MAP_BINGO);
    desk.almost = line(1.66, 0.26, 64, MAP_MISSED);
    desk.verdict = line(1.3, 0.4, 40, "#ffffff");
    desk.reason = line(0.94, 0.26, 64, CHALK);
    desk.note = line(0.64, 0.26, 64, "#ffe7a0");

    // right: booth map with its key beside it
    const MX = 2.55;
    label(s, "BOOTHS - AS SEEN FROM THIS DESK", { x: 3.35, y: 2.54, z: 0.02, w: 4.6, h: 0.24, bg: SCREEN, fg: GOLD });
    for (let r = 0; r < BOOTH_ROWS; r++) {
      const y = 0.76 + r * 0.36;
      label(s, mapRowText(r), { x: MX, y: y, z: 0.02, w: 3.1, h: 0.28, fs: pitchFs(MAP_P), bg: SCREEN, fg: CHALK });
      for (let j = 0; j < NB; j++) {
        desk.map[r * NB + mapIdx(j)] = box(s, MX + mapX(j), y - 0.18, 0.04, MAP_P * 0.8, 0.05, 0.02, MAP_EMPTY);
      }
    }
    [["HAS BINGO", MAP_BINGO], ["MISSED DAUB", MAP_MISSED], ["CLAIMED", MAP_CLAIM], ["PLAYING", MAP_PLAY]].forEach((t, k) => {
      label(s, t[0], { x: 5.0, y: 2.2 - k * 0.36, z: 0.02, w: 1.5, h: 0.26, chars: 11, bg: SCREEN, fg: t[1] });
    });

    // keys, one row
    const KW = [2.3, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45, 1.45], GAP = 0.06;
    let kx = -(KW.reduce((p, w) => p + w, 0) + GAP * (KW.length - 1)) / 2;
    const KX = KW.map((w) => { const c = kx + w / 2; kx += w + GAP; return c; });
    desk.keys = [];
    function key(parent, text, k, bg, fg) {
      const n = label(parent, text, { x: KX[k], y: 0.28, z: 0.03, w: KW[k], h: 0.4, fs: 19, bg: bg, fg: fg, collide: true });
      desk.keys.push({ el: n, bg: bg, fg: fg, flash: null });
      return n;
    }
    desk.call = key(s, "CALL NEXT BALL", 0, "#1f9e4d", "#ffffff");
    desk.auto = key(s, "AUTO OFF", 1, "#3a3350", CHALK);
    desk.pattern = key(s, "PATTERN", 2, "#3a3350", CHALK);
    desk.undo = key(s, "UNDO BALL", 3, "#3a3350", CHALK);
    // the four code keys open a prompt; they flash when clicked too
    [["Host code, then a command: c = call, new, yes 14, no 14, undo", "code + command", "TYPE CODE", "#3a3350", CHALK, (e) => hostCommand(e)],
     ["NEW GAME - host code", "code", "NEW GAME", "#6b4a0e", "#ffe7a0", (e) => { if (hostTyped(e) !== null) newGame(); }],
     ["CONFIRM BINGO - host code (add a booth number, or oldest claim)", "code [booth]", "CONFIRM", "#145c32", "#c8ffd8",
       (e) => { const r = hostTyped(e); if (r !== null) verifyFromDesk(true, r); }],
     ["REJECT BINGO - host code (add a booth number, or oldest claim)", "code [booth]", "REJECT", "#6b1414", "#ffc8c8",
       (e) => { const r = hostTyped(e); if (r !== null) verifyFromDesk(false, r); }],
    ].forEach((d, i) => {
      const pr = mkPrompt(s, d[0], d[1]);
      const k = key(pr, d[2], 4 + i, d[3], d[4]);
      on(k, "click", () => flashKey(k, true));
      on(pr, "prompt", d[5]);
    });

    // every key flashes when pressed: cream = done, red = refused
    on(desk.call, "click", (e) => { if (!tooSoon(desk, "call", 400)) flashKey(desk.call, hostClick(e) && callBall()); });
    on(desk.auto, "click", (e) => {
      if (tooSoon(desk, "auto", 400)) return;
      const ok = hostClick(e); if (ok) setAuto(!autoOn); flashKey(desk.auto, ok);
    });
    on(desk.pattern, "click", (e) => {
      if (tooSoon(desk, "pat", 400)) return;
      const ok = hostClick(e); if (ok) cyclePattern(); flashKey(desk.pattern, ok);
    });
    on(desk.undo, "click", (e) => {
      if (tooSoon(desk, "undo", 400)) return;
      if (!hostClick(e)) { flashKey(desk.undo, false); return; }
      const now = Date.now();
      if (now > undoArmedUntil) { undoArmedUntil = now + 4000; deskMsg("PRESS UNDO AGAIN TO TAKE BACK THE LAST BALL"); flashKey(desk.undo, true); return; }
      undoArmedUntil = 0;
      flashKey(desk.undo, undoBall());
    });
  })();

  // ==========================================================
  // CARDS
  // ==========================================================
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function dealCard(b) {
    for (let c = 0; c < 5; c++) {
      const pool = [];
      for (let k = 1; k <= 15; k++) pool.push(c * 15 + k);
      shuffle(pool);
      for (let r = 0; r < 5; r++) b.card[r * 5 + c] = pool[r];
    }
    b.card[12] = 0;
    for (let i = 0; i < 25; i++) b.daub[i] = i === 12;
    if (b.cells && !b.tiles) b.cells.forEach((cell, i) => { if (cell) set(cell, "content", String(b.card[i])); });
  }
  function goodCell(b, i) { return i === 12 || (b.daub[i] && calledSet.has(b.card[i])); }
  function findWin(b) {
    const sets = PATTERNS[pattern].sets;
    for (let k = 0; k < sets.length; k++) {
      if (sets[k].cells.every((i) => goodCell(b, i))) return sets[k].name;
    }
    return null;
  }
  function tally(b) {
    let good = 0, bad = 0;
    for (let i = 0; i < 25; i++) {
      if (i === 12 || !b.daub[i]) continue;
      if (calledSet.has(b.card[i])) good++; else bad++;
    }
    return { good: good, bad: bad };
  }
  function markColor(b, i, checking) {
    if (!checking) return DAUB;
    return calledSet.has(b.card[i]) ? GOOD : BAD;
  }

  // ==========================================================
  // PLAYERS
  // ==========================================================
  function boothOf(id) {
    for (let i = 0; i < booths.length; i++) if (booths[i].owner === id) return booths[i];
    return null;
  }
  function boothMsg(b, text, ms) {
    b.msg = { text: text, until: Date.now() + (ms || 3500) };
    paintBooth(b);
  }
  function takeBooth(b, id) {
    if (id === undefined) {
      if (b.owner === null) { b.owner = "?"; showCard(b); }
      return true;
    }
    if (b.owner === id) return true;
    if (b.owner !== null && b.owner !== "?") { boothMsg(b, "THIS BOOTH IS TAKEN"); return false; }
    const mine = boothOf(id);
    if (mine) {
      if (mine.claim || (called.length > 0 && phase !== "OVER")) {
        boothMsg(b, "YOU'RE ON BOOTH " + mine.n);
        return false;
      }
      release(mine);
    }
    b.owner = id;
    showCard(b);
    paintBooth(b);
    return true;
  }
  function release(b) {
    b.owner = null;
    b.test = false;
    // a card still being checked, or a winner, stays on show
    if (!b.claim && !b.won) hideCard(b);
    paintBooth(b);
  }

  function onFree(b, e) {
    const id = whoOf(e);
    if (tooSoon(b, "free:" + id, 300)) return;
    takeBooth(b, id);
  }

  function onCell(b, i, id) {
    if (tooSoon(b, "c" + i + ":" + id, 250)) return;
    if (!takeBooth(b, id)) return;
    if (i === 12) return;
    if (b.won) return;
    if (b.claim) { boothMsg(b, "CARD LOCKED - CHECKING"); return; }
    if (phase === "READY") { boothMsg(b, "WAIT FOR THE FIRST BALL"); return; }
    if (phase === "OVER") { boothMsg(b, "GAME OVER"); return; }
    if (!b.daub[i] && DAUB_ONLY_CALLED && !calledSet.has(b.card[i])) { boothMsg(b, "NOT CALLED YET"); return; }
    b.daub[i] = !b.daub[i];
    paintBooth(b);
  }

  function onClaim(b, e) {
    const id = whoOf(e);
    if (tooSoon(b, "claim:" + id, 800)) return;
    if (!takeBooth(b, id)) return;
    if (b.won) return;
    if (b.claim) { boothMsg(b, "ALREADY CLAIMED"); return; }
    if (phase === "OVER") { boothMsg(b, "GAME OVER"); return; }
    if (!called.length) { boothMsg(b, "NO BALLS CALLED YET"); return; }
    if (Date.now() < b.lockUntil) { boothMsg(b, "BINGO LOCKED - WAIT"); return; }

    b.msg = null;
    b.claim = { at: Date.now(), ball: called.length };
    claims.push(b);
    phase = "CHECKING";
    showSign(b);
    showKeys(b);
    note("BINGO CALLED! BOOTH " + b.n + " - HOSTS ARE CHECKING", 0);
    paintAll();
  }

  // ==========================================================
  // HOSTS
  // ==========================================================
  function deskMsg(text) { deskNote = { text: text, until: Date.now() + 6000 }; paintDesk(); }
  function note(text, ms) { boardNote = { text: text, until: ms ? Date.now() + ms : 0 }; }

  function hostClick(e) {
    const id = whoOf(e);
    if (id === undefined) { deskMsg("NO PLAYER IDS - USE TYPE CODE COMMANDS"); return false; }
    if (!hosts.has(id)) { deskMsg("HOSTS ONLY - LOG IN WITH TYPE CODE FIRST"); return false; }
    return true;
  }
  function hostTyped(e) {
    const d = (e && e.detail) || {};
    const id = whoOf(e);
    const rest = afterCode(d.value);
    if (rest === null) return null;
    if (id !== undefined) hosts.add(id);
    return rest;
  }

  function hostCommand(e) {
    const rest = hostTyped(e);
    if (rest === null) return;
    const parts = rest.split(" ").filter(Boolean);
    const cmd = parts[0] || "";
    const arg = parts[1];
    if (cmd === "") { deskMsg("LOGGED IN - " + hosts.size + " HOST" + (hosts.size === 1 ? "" : "S")); return; }
    if (cmd === "c" || cmd === "call" || cmd === "next") { callBall(); return; }
    if (cmd === "n" || cmd === "new") { newGame(); return; }
    if (cmd === "y" || cmd === "yes" || cmd === "ok" || cmd === "confirm") { verifyFromDesk(true, arg || ""); return; }
    if (cmd === "x" || cmd === "no" || cmd === "reject" || cmd === "bad") { verifyFromDesk(false, arg || ""); return; }
    if (cmd === "u" || cmd === "undo") { undoBall(); return; }
    if (cmd === "auto" || cmd === "a") {
      if (arg === "off" || arg === "0") { setAuto(false); return; }
      const s = Number(arg);
      if (isFinite(s) && s >= 3 && s <= 120) autoSecs = s;
      setAuto(arg ? true : !autoOn);
      return;
    }
    if (cmd === "p" || cmd === "pattern") {
      const want = { line: "LINE", lines: "LINE", corners: "CORNERS", corner: "CORNERS", x: "X", frame: "FRAME", blackout: "BLACKOUT", full: "BLACKOUT" }[arg];
      if (want) setPattern(want); else cyclePattern();
      return;
    }
    if (cmd === "fill") {
      let n = 0;
      booths.forEach((b) => {
        if (b.owner !== null || b.cardG) return;
        b.owner = "test"; b.test = true;
        // a few squares daubed, so the test cards show some red
        for (let k = 0; k < 6; k++) { const i = Math.floor(Math.random() * 25); if (i !== 12) b.daub[i] = true; }
        showCard(b);
        n++;
      });
      deskMsg("TEST: " + n + " CARDS ADDED - " + (cardTiles ? "PICTURE" : "LABEL") + " SQUARES");
      paintAll();
      return;
    }
    if (cmd === "clear") {
      let n = 0;
      booths.forEach((b) => {
        if (!b.test) return;
        b.test = false;
        for (let i = 0; i < 25; i++) b.daub[i] = i === 12;
        release(b);
        n++;
      });
      deskMsg("TEST: " + n + " TEST CARDS REMOVED");
      paintAll();
      return;
    }
    if (cmd === "tiles") {
      if (arg !== "on" && arg !== "off") { deskMsg("TILES ON OR TILES OFF - NOW " + (cardTiles ? "ON" : "OFF")); return; }
      cardTiles = arg === "on";
      let n = 0;
      booths.forEach((b) => {
        if (!b.cardG) return;
        kill(b.cardG); b.cardG = null; b.cells = null; b.message = null;
        showCard(b);
        n++;
      });
      deskMsg("CARD SQUARES: " + (cardTiles ? "PICTURES" : "TEXT LABELS") + " - " + n + " CARDS REBUILT");
      paintAll();
      return;
    }
    if (cmd === "f" || cmd === "free") {
      const b = booths[Number(arg) - 1];
      if (!b) { deskMsg("FREE WHICH BOOTH? e.g. FREE 14"); return; }
      release(b);
      deskMsg("BOOTH " + b.n + " IS FREE");
      return;
    }
    deskMsg("UNKNOWN COMMAND: " + cmd.toUpperCase().slice(0, 20));
  }

  function verifyFromDesk(yes, rest) {
    const num = Number(String(rest || "").replace(/[^0-9]/g, ""));
    let b = null;
    if (num) {
      b = booths[num - 1];
      if (!b || !b.claim) { deskMsg("BOOTH " + num + " HAS NO CLAIM"); return; }
    } else {
      b = claims[0];
      if (!b) { deskMsg("NO CLAIMS TO CHECK"); return; }
    }
    rule(b, yes);
  }
  function onBoothVerify(b, yes, e) {
    if (hostTyped(e) === null) return;
    if (!b.claim) return;
    rule(b, yes);
  }

  // What the card really shows. ok = the pattern is complete on numbers
  // that were called AND daubed (FREE counts).
  function verdict(b) {
    const P = PATTERNS[pattern];
    const w = findWin(b);
    const notCalled = [];
    for (let i = 0; i < 25; i++) if (i !== 12 && b.daub[i] && !calledSet.has(b.card[i])) notCalled.push(b.card[i]);
    if (w) {
      return { ok: true, name: w, reason: w + " - ALL CALLED AND DAUBED" +
        (notCalled.length ? " (+" + notCalled.length + " EXTRA DAUB NOT CALLED)" : "") };
    }
    const m = missedDaubs(b);
    if (m) return { ok: false, reason: "NOT DAUBED: " + m.nums.join(", ") + " (WOULD MAKE " + m.name + ")" };
    if (notCalled.length) return { ok: false, reason: "DAUBED BUT NEVER CALLED: " + notCalled.slice(0, 6).join(", ") };
    return { ok: false, reason: "NO " + P.name + " ON THIS CARD" };
  }
  // the pattern is there on called numbers, but some aren't daubed
  function missedDaubs(b) {
    const sets = PATTERNS[pattern].sets;
    for (let k = 0; k < sets.length; k++) {
      const cells = sets[k].cells;
      if (!cells.every((i) => i === 12 || calledSet.has(b.card[i]))) continue;
      const nums = cells.filter((i) => i !== 12 && !b.daub[i]).map((i) => b.card[i]);
      if (nums.length) return { name: sets[k].name, nums: nums };
    }
    return null;
  }

  // THE SAFETY CATCH. A YES on a card that isn't a bingo, or a NO on one
  // that is, is refused the first time - press the same one again
  // within FORCE_MS to overrule the game.
  function rule(b, yes) {
    const v = verdict(b);
    const disagrees = yes ? !v.ok : v.ok;
    const now = Date.now();
    if (disagrees && !(b.arm && b.arm.yes === yes && now < b.arm.until)) {
      b.arm = { yes: yes, until: now + FORCE_MS };
      deskMsg("BOOTH " + b.n + (v.ok ? " IS A REAL BINGO" : " IS NOT A BINGO") + " - " +
        (yes ? "CONFIRM" : "REJECT") + " AGAIN IN 10s TO FORCE");
      paintAll();
      return;
    }
    b.arm = null;
    if (yes) confirmClaim(b); else rejectClaim(b);
  }

  function dropClaim(b) {
    b.claim = null;
    b.arm = null;
    b.msg = null;
    hideKeys(b);
    const i = claims.indexOf(b);
    if (i >= 0) claims.splice(i, 1);
  }
  function confirmClaim(b) {
    dropClaim(b);
    b.won = true;
    winners.push(b);
    showSign(b);
    confetti(b);
    if (!claims.length) { phase = "OVER"; note(winnersText(), 0); }
    else note("BOOTH " + b.n + " WINS! STILL CHECKING BOOTH " + claims[0].n, 0);
    deskMsg("CONFIRMED BOOTH " + b.n);
    paintAll();
  }
  function rejectClaim(b) {
    const now = Date.now();
    dropClaim(b);
    b.lockUntil = now + BAD_BINGO_LOCK_MS;
    b.badUntil = now + 5000;
    lastReject = { b: b, until: now + BOARD_NOTE_MS };
    hideSign(b);
    if (b.owner === null && !b.won) hideCard(b);
    if (!claims.length) {
      if (winners.length) { phase = "OVER"; note(winnersText(), 0); }
      else {
        phase = "PLAYING";
        nextAutoAt = now + autoSecs * 1000;
        note("NOT A BINGO! BOOTH " + b.n + " - PLAY ON", BOARD_NOTE_MS);
      }
    } else {
      note("NOT A BINGO - BOOTH " + b.n + ". NOW CHECKING BOOTH " + claims[0].n, 0);
    }
    deskMsg("REJECTED BOOTH " + b.n);
    paintAll();
  }
  function winnersText() {
    const ns = winners.map((w) => w.n);
    if (ns.length === 1) return "BINGO! BOOTH " + ns[0] + " WINS!";
    return "BINGO! BOOTHS " + ns.slice(0, -1).join(", ") + " & " + ns[ns.length - 1] + " WIN!";
  }

  // ==========================================================
  // CALLING
  // ==========================================================
  function callBall() {
    if (phase === "CHECKING") { deskMsg("CHECK THE BINGO FIRST"); return false; }
    if (phase === "OVER") { deskMsg("GAME OVER - START A NEW GAME"); return false; }
    if (called.length >= 75) { deskMsg("ALL 75 BALLS ARE OUT"); return false; }
    const now = Date.now();
    if (now - lastCallAt < MIN_CALL_GAP_MS) { deskMsg("TOO SOON - WAIT A SECOND"); return false; }
    lastCallAt = now;
    const left = [];
    for (let k = 1; k <= 75; k++) if (!calledSet.has(k)) left.push(k);
    const n = left[Math.floor(Math.random() * left.length)];
    called.push(n);
    calledSet.add(n);
    if (phase === "READY") phase = "PLAYING";
    nextAutoAt = now + autoSecs * 1000;
    if (boardNote && !boardNote.until) boardNote = null;
    deskMsg("CALLED " + ballText(n) + " - BALL " + called.length);
    paintAll();
    return true;
  }
  function undoBall() {
    if (phase !== "PLAYING" || !called.length) { deskMsg("NOTHING TO UNDO RIGHT NOW"); return false; }
    const n = called.pop();
    calledSet.delete(n);
    if (!called.length) phase = "READY";
    note("BALL " + ballText(n) + " TAKEN BACK", BOARD_NOTE_MS);
    deskMsg("UNDID " + ballText(n));
    paintAll();
    return true;
  }
  function setAuto(v) {
    autoOn = v;
    nextAutoAt = Date.now() + 3000;
    deskMsg(autoOn ? "AUTO: A BALL EVERY " + autoSecs + "s" : "AUTO OFF");
  }
  function setPattern(p) {
    pattern = p;
    note("NOW PLAYING FOR: " + PATTERNS[p].name, BOARD_NOTE_MS);
    deskMsg("PATTERN: " + PATTERNS[p].name);
    paintAll();
  }
  function cyclePattern() {
    setPattern(PATTERN_ORDER[(PATTERN_ORDER.indexOf(pattern) + 1) % PATTERN_ORDER.length]);
  }

  function newGame() {
    called = [];
    calledSet.clear();
    claims = [];
    winners = [];
    lastReject = null;
    phase = "READY";
    autoOn = false;
    undoArmedUntil = 0;
    booths.forEach((b) => {
      b.claim = null; b.won = false; b.lockUntil = 0; b.badUntil = 0; b.msg = null;
      hideSign(b);
      hideKeys(b);
      if (b.fx) { kill(b.fx); b.fx = null; }
      if (b.owner === null) hideCard(b);
      dealCard(b);
    });
    note("NEW GAME - NEW CARDS! PLAYING FOR " + PATTERNS[pattern].name, BOARD_NOTE_MS);
    deskMsg("NEW GAME DEALT - CALL THE FIRST BALL WHEN READY");
    paintAll();
  }

  // ==========================================================
  // EFFECTS - claim sign, host keys, confetti. Only exist when needed.
  // ==========================================================
  // A brass-framed BINGO! sign that floats over the booth, readable from
  // the stage and from the rows behind, with the five ball colours on top.
  // The bob is a client-side animation - no network traffic.
  function showSign(b) {
    if (b.sign) return;
    const g = group({ y: 5.75, z: -1.6 }, b.group);
    el("m-attr-anim", { attr: "y", start: 5.6, end: 5.9, duration: 1400, loop: "true", "ping-pong": "true", easing: "easeInOutSine" }, g);
    const frame = box(g, 0, 0, 0, 3.0, 1.1, 0.08, CLAIM_A);
    const sideA = label(g, "BINGO!", { z: -0.05, ry: 180, w: 2.8, h: 0.9, bg: ONYX, fg: "#ffd23a" });
    const sideB = label(g, "BINGO!", { z: 0.05, w: 2.8, h: 0.9, bg: ONYX, fg: "#ffd23a" });
    LETTERS.forEach((L, i) => el("m-sphere", { x: (i - 2) * 0.55, y: 0.78, radius: 0.21, color: L_BG[i] }, g));
    b.sign = { g: g, frame: frame, a: sideA, b: sideB };
  }
  function hideSign(b) { if (b.sign) { kill(b.sign.g); b.sign = null; } }

  function showKeys(b) {
    if (b.keys) return;
    const g = group({ y: 3.05 }, b.tv);
    const yes = mkPrompt(g, "HOST: confirm BINGO for booth " + b.n + " - type the code", "code");
    label(yes, "HOST YES", { x: -0.65, z: 0.02, w: 1.2, h: 0.4, bg: GOOD, fg: "#ffffff", collide: true });
    on(yes, "prompt", (e) => onBoothVerify(b, true, e));
    const no = mkPrompt(g, "HOST: reject BINGO for booth " + b.n + " - type the code", "code");
    label(no, "HOST NO", { x: 0.65, z: 0.02, w: 1.2, h: 0.4, bg: "#b01c1c", fg: "#ffffff", collide: true });
    on(no, "prompt", (e) => onBoothVerify(b, false, e));
    b.keyNote = label(g, "HOST: CHECK THE CARD", { y: 0.42, z: 0.02, w: 3.2, h: 0.34, chars: 30, bg: SCREEN, fg: CHALK });
    b.keys = g;
  }
  function hideKeys(b) { if (b.keys) { kill(b.keys); b.keys = null; b.keyNote = null; } }

  function confetti(b) {
    if (!CONFETTI || b.fx) return;
    const g = group({ x: b.x, z: b.z }, fxRoot);
    const cols = L_BG.concat([GOLD, DAUB]);
    for (let k = 0; k < 12; k++) {
      const top = 6.5 + Math.random() * 3;
      const c = el("m-cube", {
        x: (Math.random() * 2 - 1) * 1.7, y: top, z: (Math.random() * 2 - 1) * 1.7,
        width: 0.18, height: 0.18, depth: 0.03, color: cols[k % cols.length],
      }, g);
      loopAnim(c, "y", top, 0.3, 2400 + Math.random() * 1800);
      loopAnim(c, "ry", 0, 360, 700 + Math.random() * 900);
    }
    b.fx = g;
  }

  // ==========================================================
  // PAINTING - set() only sends what changed
  // ==========================================================
  function boothText(b, now) {
    if (b.msg && now < b.msg.until) return b.msg.text;
    const B = "BOOTH " + b.n + " - ";
    if (b.won) return B + "WINNER!";
    if (b.claim) return B + "HOST COMING";
    if (now < b.lockUntil) return B + "NOT A BINGO";
    if (phase === "OVER") return B + "GAME OVER";
    if (phase === "READY") return B + "GET READY";
    return B + "CLICK YOUR NUMBERS";
  }
  function paintBooth(b) {
    const now = Date.now();
    const bad = now < b.badUntil;

    let lamp;
    if (b.won) lamp = CLAIM_A;
    else if (b.claim) lamp = blink ? CLAIM_A : CLAIM_B;
    else if (bad) lamp = blink ? BAD_A : BAD_B;
    else if (b.owner !== null) lamp = TAKEN_LAMP;
    else lamp = FREE_LAMP;
    set(b.lamp, "color", lamp);
    if (b.sign) {
      set(b.sign.frame, "color", b.won || blink ? CLAIM_A : CLAIM_B);
      set(b.sign.a, "content", b.won ? "WINNER!" : "BINGO!");
      set(b.sign.b, "content", b.won ? "WINNER!" : "BINGO!");
    }

    if (!b.cardG) {
      if (b.freeText) set(b.freeText, "content", b.msg && now < b.msg.until ? b.msg.text : "CLICK TO PLAY");
      return;
    }
    set(b.message, "content", boothText(b, now));
    if (b.keyNote) {
      const armed = b.arm && now < b.arm.until;
      set(b.keyNote, "content", !armed ? "HOST: CHECK THE CARD"
        : b.arm.yes ? "NOT A BINGO! YES AGAIN = FORCE" : "REAL BINGO! NO AGAIN = FORCE");
      set(b.keyNote, "color", !armed ? SCREEN : blink ? "#8a5a00" : "#4a2f00");
    }

    // a daubed square turns red (green/red while being checked)
    const checking = CHECK_COLORS && (!!b.claim || b.won || bad);
    for (let i = 0; i < 25; i++) {
      const cell = b.cells[i];
      if (!cell) continue;
      if (b.tiles) {
        // same colours as markColor: red daub, or green / red while checked
        const k = !b.daub[i] ? "c" : !checking ? "d" : calledSet.has(b.card[i]) ? "g" : "b";
        set(cell, "src", TILE[k + b.card[i]]);
        continue;
      }
      set(cell, "color", b.daub[i] ? markColor(b, i, checking) : CREAM);
      set(cell, "font-color", b.daub[i] ? "#ffffff" : INK);
    }
  }

  function marqueeText(now) {
    if (boardNote && (!boardNote.until || now < boardNote.until)) {
      if (!boardNote.until && phase === "PLAYING") boardNote = null;
      else return boardNote.text;
    }
    if (phase === "READY") return "GRAB A BOOTH! PLAYING FOR " + PATTERNS[pattern].name;
    if (phase === "PLAYING") return "PLAYING FOR " + PATTERNS[pattern].name + " - GOT IT? HIT BINGO!";
    if (phase === "CHECKING") return "BINGO CALLED! BOOTH " + claims[0].n + " - HOSTS ARE CHECKING";
    return winnersText();
  }

  function calledRowText(L) {
    const a = [];
    for (let k = 1; k <= 15; k++) { const n = L * 15 + k; a.push(calledSet.has(n) ? slot(n) : "    "); }
    return LETTERS[L] + "     " + a.join("  ");
  }

  function paintBoards() {
    const now = Date.now();
    const last = called.length ? called[called.length - 1] : 0;
    for (let L = 0; L < 5; L++) set(calledRows[L], "content", calledRowText(L));
    set(ballDisc, "color", last ? L_BG[letterOf(last)] : FRAME);
    set(ballLabel, "content", last ? ballText(last) : "--");
    set(countLabel, "content", "BALL " + called.length + " / 75");
    const prev = called.slice(-5, -1).reverse().map(ballText).join("   ");
    set(lastLabel, "content", prev ? "LAST: " + prev : "LAST BALLS");

    set(marquee, "content", marqueeText(now));
    set(marquee, "font-color", phase === "OVER" ? (blink ? "#ffd23a" : "#ffffff") : phase === "CHECKING" ? "#ffffff" : "#ffd23a");
    set(marquee, "color", phase === "CHECKING" ? (blink ? "#7a1010" : "#120f18") : "#120f18");

    const P = PATTERNS[pattern];
    set(patternName, "content", "PLAYING FOR: " + P.name);
    set(patternSub, "content", P.sub);
    const show = new Set(P.show);
    patternCells.forEach((c, i) => set(c, "color", show.has(i) ? (i === 12 ? GOLD : DAUB) : UNCALLED_BG));

    let vb = null, title = "NO CLAIMS YET", foot = "HIT BINGO TO CLAIM";
    if (claims.length) { vb = claims[0]; title = "CHECKING BOOTH " + vb.n; }
    else if (lastReject && now < lastReject.until) { vb = lastReject.b; title = "NOT A BINGO: BOOTH " + vb.n; }
    else if (winners.length) { vb = winners[winners.length - 1]; title = "WINNER: BOOTH " + vb.n; }
    set(verifyTitle, "content", title);
    set(verifyTitle, "font-color", claims.length ? (blink ? "#ffd23a" : "#ffffff") : GOLD);
    for (let r = 0; r < 5; r++) set(verifyRows[r], "content", vb ? rowText(vb.card, r) : "");
    for (let i = 0; i < 25; i++) {
      if (!verifyMarks[i]) continue;
      set(verifyMarks[i], "color", vb && vb.daub[i] ? markColor(vb, i, CHECK_COLORS) : CREAM);
    }
    if (vb) {
      const t = tally(vb);
      foot = CHECK_COLORS ? t.good + " CALLED | " + t.bad + " NOT CALLED" : "BALL " + called.length;
      if (claims.length > 1) foot += " | +" + (claims.length - 1) + " WAITING";
    }
    set(verifyFoot, "content", foot);

    const before = called.slice(-4, -1).reverse().map(ballText).join("   ");
    repeaters.forEach((r) => {
      set(r.ball, "content", last ? ballText(last) : "--");
      set(r.ball, "color", last ? L_BG[letterOf(last)] : FRAME);
      set(r.ball, "font-color", last ? L_FG[letterOf(last)] : CHALK);
      set(r.last, "content", before ? "BEFORE: " + before : P.name);
    });
  }

  function shortName(n) {
    return n.replace("COLUMN ", "COL ").replace("DIAGONAL", "DIAG").replace("4 CORNERS", "CORNERS")
      .replace("PICTURE FRAME", "FRAME").replace("BIG X", "X").replace("BLACKOUT", "FULL");
  }
  function listText(items) {
    if (!items.length) return "NOBODY";
    let out = "";
    for (let k = 0; k < items.length; k++) {
      const next = (out ? out + "  |  " : "") + items[k];
      if (next.length > 32) return out + "  +" + (items.length - k) + " MORE";
      out = next;
    }
    return out;
  }
  function paintDesk() {
    const now = Date.now();
    const live = phase === "PLAYING" || phase === "CHECKING";

    // claim verdict
    if (claims.length) {
      const b = claims[0];
      const v = verdict(b);
      set(desk.verdict, "content", "BOOTH " + b.n + ": " + (v.ok ? "REAL BINGO - SAY YES" : "NOT A BINGO - SAY NO") +
        (claims.length > 1 ? "  (+" + (claims.length - 1) + " WAITING)" : ""));
      set(desk.verdict, "color", v.ok ? "#146c36" : "#8a1616");
      set(desk.reason, "content", v.reason);
    } else {
      set(desk.verdict, "content", phase === "OVER" ? winnersText() : "NO CLAIMS");
      set(desk.verdict, "color", phase === "OVER" ? "#6b4a0e" : SCREEN);
      set(desk.reason, "content", phase === "OVER" ? "NEW GAME NEEDS THE CODE" : "THE VERDICT SHOWS HERE WHEN SOMEONE CLAIMS");
    }

    // booth map + the two lists
    const sleepers = [], almost = [];
    booths.forEach((b) => {
      let c;
      if (b.won) c = MAP_CLAIM;
      else if (b.claim) c = blink ? MAP_CLAIM : verdict(b).ok ? MAP_BINGO : MAP_BAD;
      else if (now < b.badUntil) c = MAP_BAD;
      else if (b.owner === null) c = MAP_EMPTY;
      else {
        c = MAP_PLAY;
        if (live) {
          const w = findWin(b);
          if (w) { c = MAP_BINGO; sleepers.push(b.n + " " + shortName(w)); }
          else {
            const m = missedDaubs(b);
            if (m) { c = MAP_MISSED; almost.push(b.n + " " + shortName(m.name)); }
          }
        }
      }
      set(desk.map[b.n - 1], "color", c);
    });
    set(desk.sleepers, "content", "BINGO NOT CALLED: " + listText(sleepers));
    set(desk.sleepers, "font-color", sleepers.length ? MAP_BINGO : KEY_GREY);
    set(desk.almost, "content", "MISSED A DAUB: " + listText(almost));
    set(desk.almost, "font-color", almost.length ? MAP_MISSED : KEY_GREY);

    // status
    set(desk.status, "content", phase + " | BALL " + called.length + "/75 | " + PATTERNS[pattern].name +
      " | AUTO " + (autoOn ? autoSecs + "s" : "OFF") + " | DAUB MANUAL");
    const taken = booths.filter((b) => b.owner !== null).length;
    set(desk.diag, "content", "HOSTS " + hosts.size + " | " + taken + "/" + booths.length + " BOOTHS | " + idsText() + " | ERR " + scriptErrors + (lastError && scriptErrors ? " " + lastError.slice(0, 14) : "") + " | " + BUILD);
    let nt = "";
    if (deskNote && now < deskNote.until) nt = deskNote.text;
    else if (winners.length) nt = "WINNERS: BOOTH " + winners.map((w) => w.n).join(", ");
    set(desk.note, "content", nt);

    set(desk.auto, "content", autoOn ? "AUTO " + autoSecs + "s" : "AUTO OFF");
    const keyBg = {};
    keyBg[0] = phase === "CHECKING" || phase === "OVER" ? "#3a3350" : "#1f9e4d";
    keyBg[1] = autoOn ? "#1f6fd0" : "#3a3350";
    keyBg[3] = now < undoArmedUntil ? "#b01c1c" : "#3a3350";
    desk.keys.forEach((k, i) => {
      const f = k.flash && now < k.flash.until ? k.flash : null;
      set(k.el, "color", f ? f.bg : keyBg[i] || k.bg);
      set(k.el, "font-color", f ? f.fg : k.fg);
    });
  }

  function paintAll() {
    booths.forEach(paintBooth);
    paintBoards();
    paintDesk();
  }

  // ==========================================================
  // LOOPS
  // ==========================================================
  every(() => {
    if (!autoOn) return;
    if (phase !== "READY" && phase !== "PLAYING") return;
    if (Date.now() >= nextAutoAt) callBall();
  }, 250);

  every(() => { blink = !blink; paintAll(); }, 500);

  if (typeof window !== "undefined" && window.addEventListener) {
    on(window, "disconnected", (e) => {
      const id = e && e.detail ? e.detail.connectionId : undefined;
      if (id === undefined) return;
      hosts.delete(id);
      const b = boothOf(id);
      if (b) release(b);
    });
  }

  // ==========================================================
  // START
  // ==========================================================
  booths.forEach(dealCard);
  paintAll();
</script>
