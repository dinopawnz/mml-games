  v21 - THE DOGS CHASE PEOPLE, NOT FOOTPRINTS. v19's air-hold
  did not fix jumping and this explains why. It kept the last
  FOOTSTEP and ran its line - but the line came from
  trailVelocity, which reads a heading by pairing two footsteps
  0.15 to 1.3 s apart. A hopping runner does not produce that.
  They touch down for a fifth of a second, which the pads stamp
  two or three times in one spot - too close together in time to
  pair - and then go quiet for a second, which is too long a gap
  to pair either. So trailVelocity returned no heading at all,
  the air-hold dutifully saved a heading of zero, and the dog
  ran to the takeoff point and sat on it. Worse, the old
  "arrived and heard nothing, delete that footstep" rule then
  ate the whole cluster in a second, and the dog patrolled away
  underneath somebody still in the air.

  The fix is a different unit. A footstep is no longer a target,
  it is a FIX on a QUARRY: the game's running guess at one
  person, holding a position, a heading, and when it was last
  heard. A quarry moves on its heading every tick whether the
  floor can hear it or not, and a touchdown near where a quarry
  ought to be by now is that quarry landing, so it corrects the
  heading instead of starting a fresh one. Hop, hop, hop reads
  as one person crossing at a steady 8.4 m/s, because the
  heading is measured takeoff to landing - which is exactly the
  measurement a hop hands you - and not across a stride.

  Dogs now pick quarries, not footsteps. Footsteps still do the
  close-range catch backstop and still feed the speed clock.

  And when a quarry really does die, a dog SEARCHES: it runs the
  ground that quarry was heading over, weaving SWEEP_WIDE either
  side of the line for SWEEP_MS, before it drops to patrol. A
  dog that has lost you now looks like a dog that has lost you,
  not one that has stopped caring.

  New on the console readout: Q, the number of people the floor
  currently believes are running. If somebody hops the length of
  the pitch and Q sits at 0, the pads are not hearing them at
  all - a floor problem, not a dog one, and worth telling me.

  THE GAME
  ------------------------------------------------------------
  Three bulldogs loose on a pitch. They hunt whoever is on it and
  cage them where they catch them. That is the whole of it.

  There is no call, no run, no side you are sent to, and nowhere
  on the pitch that is safe. Walk on and the dogs come for you;
  walk off past the end line and they cannot follow. You shout
  BULLDOG yourself when you host - the field does not need to
  know you said it.

  THE HOST
  ------------------------------------------------------------
  Click CODE on either console (or TYPE CODE) to let the
  dogs out. On the same keypad, PACK_CODE - 1917 - calls another
  dog out and CULL_CODE - 4525 - puts one back in the kennel, one
  per entry, whether or not the dogs are already loose. The pack
  runs between one dog and MAX_HUNTERS; for none at all, stop the
  game. The starting code again puts them away and opens every
  cage. Change CODE before you run anything public.

  Beside each keypad is SPEED, on its own pad and behind its own
  code. Type SPEED_CODE - 2233 - then a number of metres per
  second, and the dogs run at that from the next tick. Nobody
  without that code can touch it. See THE SPEED PAD below.

  Whoever enters the code is the host for that session, and the
  host is the only one who can open a cage:

    - click any part of a cage to let that one person out
    - hit OPEN ALL CAGES on either console to empty the lot

  Somebody let out gets GRACE_MS of immunity - eight seconds by
  default - so a mistaken catch can actually get away rather
  than being re-caged on the spot. A green FREED ring follows
  them while it lasts.

  If your runtime does not report who clicked, the game cannot
  tell the host from anybody else and the cages open for whoever
  clicks them. Set HOST_FREE false to stop pretending otherwise.

  WHO GETS HUNTED
  ------------------------------------------------------------
  Anybody the position probes can see between the touchlines,
  the moment they can see them. There is no register and no
  joining - jump on the pitch halfway through and a dog will be
  on you. Step off and you are dropped from the list.

  The host standing at a console is off the pitch, so the dogs
  leave them alone without any special case.

  CATCHING
  ------------------------------------------------------------
  A dog catches you when it gets within CATCH_R of you. That is
  3.6 m, which sounds generous, and is: position reports arrive
  every PROBE_MS, and an avatar at a dead sprint covers several
  metres between two of them. A dog that trusts the last report
  is always swiping at the grass behind you, which is why a
  runner holding W used to be untouchable. So the dogs now
  extrapolate - they aim at where PREDICT_MAX seconds of your
  current speed puts you - and the catch radius covers what is
  left of the error.

HUNT_SPEED starts at PLAYER_SPEED times DOG_PACE, and DOG_PACE
  is 1.02: a dog runs a hair over what an avatar runs at, where
  v17 had it a hair under at 0.97. That is 8.6 m/s against the
  8.4 estimate. It is a small change with a real edge in it - a
  runner at a flat sprint no longer slowly pulls away, the dog
  slowly gains - so if it plays too hard, the SPEED pad takes it
  back down mid-game without a reload.

  What makes a dog dangerous is still its reach more than its
  legs: CATCH_R is 3.6 m and it aims PREDICT_MAX ahead of where
  you were last seen. Those are the numbers to touch if it feels
  unfair before you touch the speed.

  THE SPEED PAD
  ------------------------------------------------------------
  A second pad sits beside the TYPE CODE pad at both consoles,
  lipped in yellow and reading DOG SPEED and the figure the dogs
  are on. Type SPEED_CODE and then a number of metres per second
  - 2233 8.6 - and that is what they run at from the next
  movement tick, loose or still in the kennel, no reload, no
  restart. Patrol and walk-home pace follow it by their usual
  shares.

  It only takes a number between SPEED_MIN and SPEED_MAX (1 and
  20). Anything outside is pulled to the nearest end and the
  boards say so. Decimals are fine - 8.6 is a valid entry. So is
  2233-8.6 or 2233 8.6: anything that is not a digit or a point
  is treated as a separator.

  WHO CAN USE IT
  There are two locks on this pad, and they are not the same lock.

  1. SPEED_CODE, which always works. An entry that does not begin
     with it does nothing at all - no change, no message, no hint
     on the boards that a code was wanted. A player prodding the
     pad gets silence and learns nothing, which is v7's rule about
     codes: nothing anybody can see in the world says what one is.
     Change it before you run anything public, the same as CODE.

  2. SPEED_HOST_ONLY, which works when it can. If a game is
     running, the host is known, and the runtime reports who
     typed, then even a correct code from anybody who is not the
     host is refused and the boards say SPEED PAD: HOST ONLY. If
     any of those three is missing - no game running, nobody has
     entered the operator code yet, or the runtime will not say
     who clicked - it stands aside and the code alone governs.
     That is the same call the cages make, and for the same
     reason: a lock that cannot be checked is better off open
     than shut against everybody including you.

  So in a public room the honest position is that the code is
  what is really protecting the pad. Treat it like CODE.

  SPEED_PAD false takes the pad out of the world altogether. No
  pad, no entry, no lock to worry about - the dogs run at
  DOG_PACE for the whole session and the only way to change it is
  to edit this file and reload.

  What it does NOT do: nothing typed into this pad starts or
  stops the game, calls a dog out, or sends one back. Those are
  the keypad's job, and the two pads do not share an entry, so a
  number typed at one can never land as a code at the other.

  DOG_PACE is now only the number the game boots at. Once you
  have typed into the pad, the dogs are on whatever you typed
  until the document reloads, and DOG on the console readout is
  the figure to trust.

  DO NOT TRUST PLAYER_SPEED UNTIL YOU HAVE READ IT OFF THE BOARD.
  It is 8.4 here and that is an estimate. Let the dogs out, sprint
  the length of the pitch, and the consoles show CLOCKED - the
  floor's own measurement of the fastest anybody has moved this
  run - next to DOG, what the dogs are set to. Put CLOCKED into
  PLAYER_SPEED. It reads a little low rather than high, so if
  anything you will end up with a dog a shade slower than your
  people, which is the safer way to be wrong.

  If the game ever seems to disagree with where people are, set
  DEBUG_TRACK true: a pillar stands wherever the game thinks
  each player is, marked HUNTED, CAGED or OFF.

  Set your spawn point in the lobby, around x 0, z -168.

<m-group id="dogs"></m-group>
<m-group id="cages"></m-group>
<m-group id="marks"></m-group>

<script>
  // ==========================================================
  // GUARD - nothing that happens in an event or a timer can take
  // the script down. An exception is counted, shown on the consoles
  // (ERR n), and the game carries on.
  // ==========================================================
  const BOOT = Date.now();
  let scriptErrors = 0;
  let lastError = "";
  function guard(fn) {
    return function (a, b) {
      try { return fn.call(this, a, b); }
      catch (err) {
        scriptErrors++;
        lastError = String((err && err.message) || err).slice(0, 40);
      }
    };
  }
  function every(fn, ms) { return setInterval(guard(fn), ms); }
  function later(fn, ms) { return setTimeout(guard(fn), ms); }
  function on(node, type, fn) { node.addEventListener(type, guard(fn)); }

  // ==========================================================
  // TUNING
  // ==========================================================

  // --- the dogs ---------------------------------------------
  const HUNTERS = 1;            // bulldogs the pitch starts with
  const MAX_HUNTERS = 6;        // and the most the host can call out

  // A dog runs at what an avatar runs at. Every speed in here is a
  // share of PLAYER_SPEED, so that one number is the only one worth
  // getting right - and it is an ESTIMATE, not a fact. Older notes
  // in this file claimed 9.8 m/s; they were wrong, because at 9.3
  // the dogs were still running people down in a straight line.
  //
  // Do not guess again. Let the dogs out, have somebody sprint the
  // length of the pitch, and read CLOCKED off either console: that
  // is the floor's own measurement of the fastest anybody has moved
  // this session. Put that number here.
  const PLAYER_SPEED = 8.4;     // m/s on foot. ESTIMATE - replace it with
                                // what CLOCKED says on the consoles.
  const DOG_PACE = 1.02;        // dog's share of it at boot. 1 is level;
                                // this is a hair over, so a dog very slowly
                                // gains on a flat sprint instead of very
                                // slowly losing it. v17 had 0.97.
                                // This only sets the number the game STARTS
                                // at - the SPEED pad beside each keypad
                                // overrides it while the game is running.
  let HUNT_SPEED = PLAYER_SPEED * DOG_PACE;
  const HUNT_ACCEL = 0;         // 0 = full pace from the first tick, the
                                // way it has always been. A number here is
                                // m/s/s and makes a dog build up to speed
                                // instead; it is off because that is not
                                // how this dog is meant to run.

  // Roaming and drifting-home speeds are shares of whatever the dogs
  // are currently set to run at, so typing a new speed into the SPEED
  // pad moves the whole dog and not just its chase.
  const PATROL_SHARE = 0.72 / DOG_PACE;   // roaming, hearing nothing.
                                          // A dog never stands still.
  const RETURN_SHARE = 0.61 / DOG_PACE;   // drifting back to its mark
  let PATROL_SPEED = HUNT_SPEED * PATROL_SHARE;
  let RETURN_SPEED = HUNT_SPEED * RETURN_SHARE;

  // the ends of the SPEED pad. Nothing outside these is accepted.
  const SPEED_MIN = 1;
  const SPEED_MAX = 20;
  const HUNT_MS = 80;           // movement tick
  const HUNT_BODY_R = 1.4;      // radius of the invisible solid body
  const HUNT_TURN = 0.4;        // steering smoothing, 0..1
  const HUNT_SEPARATION = 14;   // dogs push apart so they spread out
  const LEAD_MAX = 1.4;         // seconds a dog aims ahead of a runner
  const CATCH_R = 3.6;          // how close counts as caught. Deliberately
                                // wide - see CATCHING in the notes above.
  const CATCH_PAUSE = 900;      // a dog stands over its catch this long
  const RETREAT_MS = 900;       // and backs off for all of it
  const FOOT_CATCH_R = 2.5;     // a fresh footstep this close to a dog's
                                // centre is a catch, contact event or not
  const FOOT_CATCH_MS = 350;    // ...if it is no older than this
  const DOG_SIZE = 1.1;         // scale of the dog model. Cosmetic.
  const HUNT_BODY_H = 4.2;      // height of that invisible body. Tall on
                                // purpose - see JUMPERS. 3.5 up to v18.

  // --- quarries: what a dog actually chases ------------------
  // Not footsteps. A quarry is the game's running guess at one
  // person - where they were last heard, and how fast and which way
  // they were going - and it keeps moving whether the floor can
  // hear them or not. See JUMPERS in the notes above.
  const QUARRY_MATCH = 16;      // m. A footstep this close to where a
                                // quarry should be by now is that quarry
                                // touching down again, not a new person.
                                // Wide on purpose: a long hop covers
                                // eleven metres, and a landing that fails
                                // to match splits one runner into two
                                // half-tracked ghosts.
  const QUARRY_HOLD = 5000;     // ms a quarry survives on dead reckoning
                                // with the floor hearing nothing at all.
                                // 0 turns quarries off and puts the v18
                                // footstep-chasing back.
  const QUARRY_GHOST = 2400;    // ms. A dog standing on a quarry that has
                                // not been heard from this long drops it:
                                // that is a ghost, not a person.
  const QUARRY_SMOOTH = 0.5;    // how far each new fix pulls the quarry's
                                // heading round. 1 is believe the last two
                                // touchdowns and nothing else.
  const QUARRY_MAX = 24;        // most quarries tracked at once
  const QUARRY_LEAD_MAX = 34;   // m dead reckoning will run out to before
                                // it stops adding distance
  const QUARRY_TRUST = 0.9;     // s of silence a quarry's heading is
                                // believed in full. Past that the
                                // projection is walked out at
                                // QUARRY_DOUBT of the speed, because
                                // somebody who has been quiet a long time
                                // may well have turned while you could not
                                // see them, and running the old line at
                                // full pace lands the dog wide.
  const QUARRY_DOUBT = 0.45;
  const SWEEP_MS = 3500;        // ms a dog searches the ground a lost
                                // quarry was heading over before it gives
                                // up and goes back to patrolling
  const SWEEP_WIDE = 16;        // m the search weaves either side of that
  const TRAIL_SPAN = 1.3;       // s - the widest gap between two footsteps
                                // that still counts as one person's stride.
                                // Only the speed clock uses this now.

  // --- catching ---------------------------------------------
  const PREDICT_MAX = 0.7;      // seconds of movement a dog extrapolates
                                // from your last reported position
  const CAGE_A = 2.8;           // interior half-width - Red Light's size,
                                // the one that actually lands on runners
  const CAGE_H = 6;
  const CAGE_OUT = 1.6;         // clearance past the catch, away from the
                                // dog, so the dog is never caged with it
  const MAX_CAGES = 60;
  const CAGE_MIN_GAP = 6.0;     // two cages never closer than this
  const CAGE_FIT = 3.0;         // a cage must land within this of its owner
  const CAGE_LAG = 0.3;         // seconds of a runner's own speed the cage
  const CAGE_LEAD_MAX = 4.5;    // is thrown ahead of them, at most this far
  const TAG_SNAP_R = 4.0;       // a contact snaps onto the nearest body
  const TAG_SPOT_R = 4.0;       // nowhere tagged twice in quick succession
  const TAG_SPOT_MS = 3000;
  const MARK_MS = 8000;         // how long a FREED ring follows you

  // --- letting people out -----------------------------------
  const HOST_FREE = true;       // only the host can open a cage. The host is
                                // whoever entered the code. If the runtime
                                // will not say who clicked, anyone can.
  const ALL_QUIET_MS = 180000;  // nobody running on the pitch outside a
                                // cage for this long: every cage opens.
                                // 0 turns it off.
  const GRACE_MS = 8000;        // immunity after being let out, so a
                                // mistaken catch can get clear

  // --- the floor's ears - how the dogs find people ----------
  const FOOT_PITCH = 8;         // pad grid, metres
  const PAD_MS = 90;            // collision-interval on every pad
  const FOOT_MEMORY = 2600;     // how long a footstep stays interesting
  const HUNT_SENSE = 130;       // how far a dog can hear
  const SPEED_SAMPLE_MS = 400;  // how often the speed clock takes a
                                // reading off the floor. See THE SPEED
                                // CLOCK below - this is what CLOCKED on
                                // the consoles comes from.
  const TRAIL_MAX = 14;         // m/s - faster than this between two
                                // footsteps is two different people

  // --- identity ---------------------------------------------
  const USE_PROBES = false;     // steer and catch by position probes. OFF:
                                // in this world they do not match where
                                // people are - see the v3 note at the top.
  const PROBE_Z = [-70, 0, 70];
  const PROBE_RANGE = 78;
  const PROBE_MS = 200;         // how often positions are reported. Lower is
                                // a sharper picture of somebody running.
  const DEBUG_TRACK = false;    // show where the game thinks everyone is

  // --- look -------------------------------------------------
  const DETAIL = true;
  const GALLERY = true;
  const GALLERY_ENDS = [-1, 1];
  const LIGHT = 0.055;          // global dimmer on every light
  const FLOOD = 22;             // each of the eight floodlights (was 34)
  const FIRE_GLOW = 28;         // each touchline fire (was 70)
  const STATUE_GLOW = 10;       // the statues' eyes (was 40); their
                                // floor light is about twice this
  const MARKER_GLOW = 12;       // the red light over the dog (was 24)
  const FLASH_MS = 900;         // floodlights go red for this on a catch

  // --- triangle budget --------------------------------------
  // Otherside caps a world's triangles, and in MML the count is
  // decided almost entirely by WHICH primitive you reach for, not
  // how big it is. A cube is a dozen triangles. A cylinder is
  // rebuilt as a many-sided tube every time, and a sphere is worse
  // again - roughly a hundred cubes' worth each. So a 5 cm bar and
  // a 40 m tower cost the same if both are cylinders, and the cheap
  // win is swapping round shapes for square ones wherever the eye
  // cannot tell, then thinning out repeated decoration.
  //
  // These dials do that. Turn them back up if the world fits.
  const LOW_POLY = true;        // square stand-ins for round shapes that
                                // are small, thin, or far away: lamp
                                // globes, rail posts, wall studs, the
                                // cage bars, the dog's paws
  const WALL_PAWS = false;      // the paw-print trail along both side
                                // walls. 5 discs a paw, ~50 paws: the
                                // single most expensive thing in here
  const WALL_CRESTS = [-80, 80];// where the bulldog crests hang on each
                                // side wall (was four a side). Keep them
                                // off the banners (-100,-50,0,50,100),
                                // the slogan boards (-60,0,60) and the
                                // ribs, or they will sit on top of them.
  const CREST_STUDS = false;    // the ring of studs round each crest
  const PAW_STEP = 18;          // spacing of the pitch paw trails, metres
                                // (was 9 - half as many prints now)
  const FIRE_Z = [-80, 0, 80];  // where the touchline fires stand (was
                                // five a side). Each is three flames.
  const STATUE_ENDS = [-1, 1];  // which ends get the colossal bulldogs

  // --- the pitch --------------------------------------------
  const HOME_D = 22;            // depth of the end zones behind each home
                                // line - the line the corner flags stand on
  const HOME_TOL = 0.4;         // touching the line counts as home, so this
                                // much short of it is already safe
  const DOG_LINE = true;        // the dogs are held between the two flagged
                                // home lines and cannot chase, reach or tag
                                // anybody past one. false puts it back to
                                // v11, where nowhere was safe.

  // --- control ----------------------------------------------
  const CODE = [1, 7, 1, 8];      // let the dogs out / put them away
  const PACK_CODE = [1, 9, 1, 7]; // another dog out, one per entry, up to
                                  // MAX_HUNTERS
  const CULL_CODE = [4, 5, 2, 5]; // one dog back in the kennel, one per
                                  // entry, down to a single dog. To have
                                  // none at all, stop the game.
                                  // Both work whether the dogs are out or
                                  // not, and neither disturbs the run.
  const CAGE_CODE = [1, 3, 4, 7]; // typed into a cage's code box: opens that cage

  // THE SIGHT SLOT. Why you could not click a cage from the stands:
  // the boundary is concrete from the ground to y 4.2 and an opacity-0
  // collider from 4.2 all the way to y 24.4. The decks are at y 4.3, so
  // a spectator's eye sits at about 5.9 - inside that invisible piece.
  // A click stops at the first thing the ray meets whether you can see
  // it or not, so every shot at a cage died on the wall.
  //
  // The wall does not need to be there at eye level. The glass rail at
  // x 49.0 already blocks bodies from 4.3 to 5.5. So the invisible part
  // is now built in two, with a gap between GLASS_SILL and GLASS_HEAD:
  //
  //     24.4  ---------------  upper, unchanged above
  //      6.4  ---------------  GLASS_HEAD
  //                            <- the slot. rays through, bodies not
  //      5.5  ---------------  GLASS_SILL, level with the rail top
  //      4.2  ---------------  lower, filling the space behind the rail
  //
  // The lower piece matters as much as the slot. Without it there is a
  // 1.2m-wide ledge on top of the concrete at y 4.2 with open air above
  // it, and anyone who cleared the rail would land there and step off
  // onto the pitch. With it, the only opening is 0.9m tall, and an
  // avatar is about twice that - it cannot fit, and it cannot stand in
  // the slot either because its head is in the upper piece.
  const GLASS_SILL = 5.5;       // = DECK_Y + RAIL_H, the rail top
  const GLASS_HEAD = 6.4;       // 0.9m of slot. Raise for a wider shot at
                                // the cages, lower if anybody ever gets
                                // through - but never above about 7.2,
                                // which is where an avatar starts to fit.
  const SPEED_PAD = true;         // build the SPEED pad at all. false takes
                                  // it out of the world entirely and the
                                  // dogs run at DOG_PACE for the session.
  const SPEED_CODE = [2, 2, 3, 3];// must lead every speed entry: type the
                                  // code and then the number, 2233 8.6.
                                  // An entry that does not start with it is
                                  // dropped in silence - no message, no
                                  // hint that a code exists. Change it
                                  // before you run anything public.
  const SPEED_HOST_ONLY = true;   // and, when the runtime reports who typed,
                                  // only the host may use the pad even with
                                  // the code. The host is whoever entered
                                  // the operator code to start the game.
                                  // If the runtime will not say who typed,
                                  // or no game is running, the code alone
                                  // governs - see THE SPEED PAD.
  const STOP_TWICE = true;        // stopping takes the code twice, 10 s apart at most
  const CODE_TIMEOUT = 15;
  const FINISH_CONSOLE = true;

  // ==========================================================
  // GEOMETRY
  // ==========================================================
  const FIELD_W = 96;
  const FIELD_L = 200;
  const ARENA_W = FIELD_W + 40;
  const ARENA_L = FIELD_L + 80;
  const ARENA_H = 56;

  const DECK_Y = 4.3;
  const DECK_L = GALLERY ? ARENA_L - 2 : FIELD_L;
  const DECK_TOP = GALLERY ? DECK_Y : 7.16;
  const DOOR_W = 10;
  const DOOR_H = 9.5;
  const RAIL_H = 1.2;
  const STAIR_X = 58;
  const STAIR_W = 7;
  const STAIR_N = Math.max(6, Math.round(DECK_Y / 0.4));
  const STAIR_RUN = 1.0;

  const LINE_Z = FIELD_L / 2 - HOME_D;   // the two home lines sit at +-LINE_Z
  const CTRL_Z = -126;
  const FIN_CTRL_Z = 126;

  // ==========================================================
  // PALETTE - a night stadium
  // ==========================================================
  const TURF = "#16211a";       // the pitch: near-black green
  const TURF_B = "#1b281f";
  const LINE = "#b3ad9c";       // bone, not bright chalk
  const COLLAR_RED = "#6a141c";
  const STUD = "#8b939b";
  const PAW_INK = "#3d1318";
  const END_BLUE = "#131c36";
  const END_GOLD = "#2e2410";
  const HEAD = "#5c3f27", MUZZLE = "#7b5c3e", BRINDLE = "#2b1b10";
  const CHALK = "#f1f2ea";
  const BRICK = "#1c2230";      // the walls: gunmetal, not red brick
  const BRICK_DK = "#11151e";
  const CONCRETE = "#3b414d";
  const STEEL = "#a3abb2";
  const STEEL_DK = "#2b3034";
  const BOARD = "#1d2b24";      // blackboard green
  const FRAME = "#39404d";      // and its steel frame
  const INK = "#10141a";
  const LAMP = "#e9efff";       // cool stadium white
  const HOME_BLUE = "#2a5bd0";
  const HOME_BLUE_DIM = "#1b3470";
  const HOME_YEL = "#f0b418";
  const HOME_YEL_DIM = "#6e5717";
  const CALL_RED = "#e3262f";
  const CALL_DIM = "#5a1418";
  const WIN_GOLD = "#ffd23f";
  const DOG_FAWN = "#c4935f";
  const DOG_LIGHT = "#ead3b0";
  const DOG_DARK = "#5b3a22";
  const COLLAR = "#c8202c";

  function homeCol(side) { return side < 0 ? HOME_BLUE : HOME_YEL; }
  function homeDim(side) { return side < 0 ? HOME_BLUE_DIM : HOME_YEL_DIM; }
  function homeName(side) { return side < 0 ? "BLUE" : "YELLOW"; }

  const arena = document.getElementById("arena");
  const dogRoot = document.getElementById("dogs");
  const cageRoot = document.getElementById("cages");
  const markRoot = document.getElementById("marks");

  function el(tag, attrs, parent) {
    const node = document.createElement(tag);
    node.setAttribute("collide", "false");
    for (const key in attrs) {
      let value = attrs[key];
      if (tag === "m-light" && key === "intensity") {
        value = Math.round(value * LIGHT * 10) / 10;
      }
      node.setAttribute(key, value);
    }
    (parent || arena).append(node);
    return node;
  }

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  // ----------------------------------------------------------
  // CHEAP STAND-INS
  // ----------------------------------------------------------
  // Three shapes that are drawn as cylinders or spheres in the
  // full-fat build and as cubes when LOW_POLY is on. Each one is
  // either small, thin, or high enough up that square reads the
  // same as round - and each one is repeated dozens of times.

  // a glowing lamp globe (there is an m-light on it either way)
  function globe(attrs, parent) {
    const r = attrs.radius;
    if (!LOW_POLY) return el("m-sphere", attrs, parent);
    const b = Object.assign({}, attrs);
    delete b.radius;
    b.width = +(r * 1.6).toFixed(3);
    b.height = +(r * 1.6).toFixed(3);
    b.depth = +(r * 1.6).toFixed(3);
    b.ry = (attrs.ry || 0) + 45;
    return el("m-cube", b, parent);
  }

  // a thin upright bar: rail posts, cage bars, corner posts
  function bar(attrs, parent) {
    const r = attrs.radius;
    if (!LOW_POLY) return el("m-cylinder", attrs, parent);
    const b = Object.assign({}, attrs);
    delete b.radius;
    b.width = +(r * 1.7).toFixed(3);
    b.depth = +(r * 1.7).toFixed(3);
    b.ry = (attrs.ry || 0) + 45;
    return el("m-cube", b, parent);
  }


  function hasGallery(side) {
    return GALLERY && GALLERY_ENDS.indexOf(side) >= 0;
  }

  // four labels round one point, so a word reads from any side
  function crossLabels(parent, y, text, bg, fg, w, h, fs) {
    const made = [];
    [0, 90, 180, 270].forEach((ry) => {
      const r = ry * Math.PI / 180;
      made.push(el("m-label", {
        x: 0.02 * Math.sin(r), z: 0.02 * Math.cos(r), y: y, ry: ry,
        width: w, height: h, "font-size": fs, alignment: "center",
        color: bg, "font-color": fg, content: text,
      }, parent));
    });
    return made;
  }

  // ==========================================================
  // SHELL
  // ==========================================================
  el("m-cube", {
    y: -2, width: ARENA_W, height: 4, depth: ARENA_L,
    color: "#141715", collide: "true",
  });

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * ARENA_W / 2, y: ARENA_H / 2,
      width: 2, height: ARENA_H, depth: ARENA_L,
      color: BRICK, collide: "true",
    });
    // two thin lit strips in the team colours, all the way down
    [[18.6, HOME_BLUE], [19.6, HOME_YEL]].forEach(([y, c]) => {
      el("m-cube", {
        x: s * ARENA_W / 2, y: y,
        width: 2.3, height: 0.35, depth: ARENA_L, color: c,
      });
    });
    // steel ribs every 20 m, so the wall reads as structure, not a slab
    for (let z = -130; z <= 130; z += 20) {
      el("m-cube", {
        x: s * (ARENA_W / 2 - 1.1), z: z, y: (DECK_Y + ARENA_H) / 2 + 1,
        width: 0.9, height: ARENA_H - DECK_Y - 2, depth: 1.4, color: BRICK_DK,
      });
      el("m-cube", {
        x: s * (ARENA_W / 2 - 1.2), z: z, y: 19.1,
        width: 1.0, height: 1.7, depth: 1.6, color: STEEL_DK,
      });
    }
    // the collar: a crimson band the full length of the wall
    el("m-cube", {
      x: s * ARENA_W / 2, y: 40,
      width: 2.5, height: 1.8, depth: ARENA_L, color: COLLAR_RED,
    });
    [39.05, 40.95].forEach((y) => {
      el("m-cube", { x: s * ARENA_W / 2, y: y, width: 2.6, height: 0.16, depth: ARENA_L, color: STUD });
    });
  });

  // ==========================================================
  // ROOF AND FLOODLIGHTS
  // ==========================================================
  const CEIL_Y = 54;
  const FLOOD_Y = 40;

  el("m-cube", {
    y: CEIL_Y + 1.4, width: ARENA_W, height: 2, depth: ARENA_L,
    color: "#111413", collide: "true",
  });
  for (let z = -120; z <= 120; z += 20) {
    el("m-cube", { z: z, y: CEIL_Y - 0.6, width: ARENA_W - 4, height: 1.2, depth: 1.0, color: STEEL_DK });
  }

  const floods = [];
  [-30, 30].forEach((x) => {
    el("m-cube", { x: x, y: FLOOD_Y + 1.2, width: 1.0, height: 1.0, depth: FIELD_L + 10, color: STEEL_DK });
    for (let z = -90; z <= 90; z += 60) {
      el("m-cylinder", {
        x: x, z: z, y: (FLOOD_Y + 1.7 + CEIL_Y) / 2,
        radius: 0.12, height: CEIL_Y - FLOOD_Y - 1.7, color: STEEL_DK,
      });
    }
    [-75, -25, 25, 75].forEach((z) => {
      el("m-cube", { x: x, z: z, y: FLOOD_Y, width: 3.2, height: 1.0, depth: 2.2, color: STEEL_DK });
      el("m-cube", { x: x, z: z, y: FLOOD_Y - 0.55, width: 2.8, height: 0.1, depth: 1.8, color: LAMP });
      floods.push(el("m-light", {
        x: x, z: z, y: FLOOD_Y - 2, type: "point", intensity: FLOOD, color: LAMP,
      }));
    });
  });

  // ==========================================================
  // END WALLS - two open portals at each end, always open
  // ==========================================================
  const PORTAL_W = 16;
  const PORTAL_H = 20;
  const PORTAL_X = 42;

  function endWall(z, side) {
    const half = ARENA_W / 2;
    const pL = PORTAL_X - PORTAL_W / 2;
    const pR = PORTAL_X + PORTAL_W / 2;

    el("m-cube", {
      x: 0, z: z, y: ARENA_H / 2,
      width: 2 * pL, height: ARENA_H, depth: 2,
      color: BRICK, collide: "true",
    });

    const retW = half - pR;
    const retC = (pR + half) / 2;
    const jambW = (retW - DOOR_W) / 2;
    const doorTop = DECK_Y + DOOR_H;

    [-1, 1].forEach((sx) => {
      const cx = sx * retC;

      if (!hasGallery(side)) {
        el("m-cube", {
          x: cx, z: z, y: ARENA_H / 2,
          width: retW, height: ARENA_H, depth: 2, color: BRICK, collide: "true",
        });
        return;
      }

      el("m-cube", {
        x: cx, z: z, y: DECK_Y / 2,
        width: retW, height: DECK_Y, depth: 2, color: BRICK, collide: "true",
      });
      [-1, 1].forEach((e) => {
        el("m-cube", {
          x: cx + e * (DOOR_W + jambW) / 2, z: z, y: DECK_Y + DOOR_H / 2,
          width: jambW, height: DOOR_H, depth: 2, color: BRICK, collide: "true",
        });
      });
      el("m-cube", {
        x: cx, z: z, y: (doorTop + ARENA_H) / 2,
        width: DOOR_W, height: ARENA_H - doorTop, depth: 2,
        color: BRICK, collide: "true",
      });
      el("m-cube", {
        x: cx, z: z, y: doorTop + 0.5,
        width: DOOR_W + 2, height: 1.0, depth: 2.4, color: STEEL,
      });
      [[1.35, 0], [-1.35, 180]].forEach(([dz, ry]) => {
        el("m-label", {
          x: cx, z: z + dz, y: doorTop + 2.3, ry: ry,
          width: 8, height: 1.4, "font-size": 58, alignment: "center",
          color: BOARD, "font-color": CHALK, content: "GALLERY",
        });
      });
    });

    // this end's colour, painted across the middle of the wall
    [8, 30].forEach((y) => {
      el("m-cube", { z: z, y: y, width: 2 * pL, height: 1.2, depth: 2.6, color: homeCol(side) });
    });

    [-1, 1].forEach((sx) => {
      const px = sx * PORTAL_X;
      el("m-cube", {
        x: px, z: z, y: (PORTAL_H + ARENA_H) / 2,
        width: PORTAL_W, height: ARENA_H - PORTAL_H, depth: 2,
        color: BRICK, collide: "true",
      });
      [-1, 1].forEach((e) => {
        el("m-cylinder", {
          x: px + e * (PORTAL_W / 2 + 0.6), z: z,
          y: PORTAL_H / 2, radius: 0.7, height: PORTAL_H + 1.4, color: STEEL,
        });
      });
      el("m-cube", {
        x: px, z: z, y: PORTAL_H + 0.7,
        width: PORTAL_W + 2.6, height: 1.4, depth: 2.6, color: STEEL,
      });
      [[1.35, 0], [-1.35, 180]].forEach(([dz, ry]) => {
        el("m-label", {
          x: px, z: z + dz, y: PORTAL_H + 3.2, ry: ry,
          width: 12, height: 2.0, "font-size": 80, alignment: "center",
          color: BOARD, "font-color": CHALK, content: "WAY IN",
        });
      });
    });
  }

  endWall(-ARENA_L / 2, -1);
  endWall(ARENA_L / 2, 1);

  // ==========================================================
  // LOBBY
  // ==========================================================
  const LOBBY_D = 56;
  const LOBBY_Z = -(ARENA_L / 2 + LOBBY_D / 2);
  const ROOM_H = 22;

  el("m-cube", {
    z: LOBBY_Z, y: -2, width: ARENA_W, height: 4, depth: LOBBY_D,
    color: "#141715", collide: "true",
  });
  el("m-cube", { z: LOBBY_Z, y: 0.1, width: ARENA_W - 16, height: 0.2, depth: LOBBY_D - 10, color: "#22302a" });

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * (ARENA_W / 2 + 1.6), z: LOBBY_Z, y: -0.5,
      width: 3.2, height: 1, depth: LOBBY_D, color: CONCRETE, collide: "true",
    });
  });
  el("m-cube", {
    z: -(ARENA_L / 2 + LOBBY_D) - 1.6, y: -0.5,
    width: ARENA_W + 6.4, height: 1, depth: 3.2, color: CONCRETE, collide: "true",
  });

  el("m-cube", {
    z: LOBBY_Z, y: ROOM_H + 0.8, width: ARENA_W, height: 1.6, depth: LOBBY_D,
    color: "#111413", collide: "true",
  });
  el("m-cube", {
    z: LOBBY_Z, y: ROOM_H - 0.3, width: ARENA_W + 2, height: 0.5, depth: LOBBY_D + 2, color: HOME_BLUE,
  });
  [-1, 1].forEach((sx) => {
    [-1, 1].forEach((sz) => {
      const x = sx * (ARENA_W / 2 - 4);
      const z = LOBBY_Z + sz * (LOBBY_D / 2 - 4);
      el("m-cube", { x: x, z: z, y: 0.5, width: 4, height: 1, depth: 4, color: CONCRETE, collide: "true" });
      el("m-cylinder", { x: x, z: z, y: 10.5, radius: 1.3, height: 19, color: BRICK, collide: "true" });
      el("m-cylinder", { x: x, z: z, y: 20.2, radius: 1.7, height: 0.6, color: STEEL });
    });
  });

  el("m-light", { z: LOBBY_Z, y: ROOM_H - 4, type: "point", intensity: 28, color: LAMP });

  // the rules, chalked on a blackboard on the lobby face of the start wall
  el("m-cube", {
    z: -(ARENA_L / 2) - 1.2, y: 5.2, width: 35, height: 8.2, depth: 0.3, color: FRAME,
  });
  el("m-cube", {
    z: -(ARENA_L / 2) - 1.3, y: 5.2, width: 34, height: 7.4, depth: 0.3, color: BOARD,
  });
  [
    [7.5, 2.0, 88, WIN_GOLD, "BRITISH BULLDOG"],
    [5.6, 1.3, 50, CHALK, "HEAR BULLDOG? RUN TO THE OTHER END."],
    [4.2, 1.3, 50, CALL_RED, "A DOG CATCHES YOU, OR YOU'RE TOO SLOW: YOU'RE OUT."],
    [2.8, 1.3, 50, CHALK, "STAY IN YOUR HOME UNTIL THE CALL."],
    [1.6, 1.1, 44, WIN_GOLD, "LAST ONE STANDING WINS."],
  ].forEach(([y, h, fs, col, text]) => {
    el("m-label", {
      z: -(ARENA_L / 2) - 1.5, y: y, ry: 180,
      width: 32, height: h, "font-size": fs, alignment: "center",
      color: BOARD, "font-color": col, content: text,
    });
  });

  [-1, 1].forEach((s) => {
    [-1, 1].forEach((sz) => {
      el("m-cube", {
        x: s * 30, z: LOBBY_Z + sz * 16,
        y: 0.6, width: 16, height: 1.2, depth: 2.4, color: FRAME, collide: "true",
      });
    });
  });

  // ==========================================================
  // TERRACE
  // ==========================================================
  const TER_D = 40;
  const TER_Z = ARENA_L / 2 + TER_D / 2;

  el("m-cube", {
    z: TER_Z, y: -2, width: ARENA_W, height: 4, depth: TER_D,
    color: "#141715", collide: "true",
  });
  el("m-cube", { z: TER_Z, y: 0.1, width: ARENA_W - 20, height: 0.2, depth: TER_D - 10, color: "#3a3320" });

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * (ARENA_W / 2 + 1.6), z: TER_Z, y: -0.5,
      width: 3.2, height: 1, depth: TER_D, color: CONCRETE, collide: "true",
    });
  });
  el("m-cube", {
    z: ARENA_L / 2 + TER_D + 1.6, y: -0.5,
    width: ARENA_W + 6.4, height: 1, depth: 3.2, color: CONCRETE, collide: "true",
  });

  [-1, 1].forEach((sx) => {
    [-1, 1].forEach((sz) => {
      const x = sx * (ARENA_W / 2 - 4);
      const z = TER_Z + sz * (TER_D / 2 - 4);
      el("m-cube", { x: x, z: z, y: 0.5, width: 4, height: 1, depth: 4, color: CONCRETE, collide: "true" });
      el("m-cylinder", { x: x, z: z, y: 8, radius: 1.3, height: 14, color: BRICK, collide: "true" });
      globe({ x: x, z: z, y: 15.6, radius: 1.5, color: HOME_YEL });
    });
  });

  el("m-light", { z: TER_Z, y: 20, type: "point", intensity: 22, color: LAMP });

  // ==========================================================
  // THE PITCH
  // ==========================================================
  // Everything painted on the pitch is flat and sits under the
  // invisible floor pads (top 0.36), in layers:
  //   0.20 base   0.22 bands   0.24 end zones   0.25 paw trails
  //   0.28 lines  0.27-0.34 the centre emblem
  function paint(tag, top, h, attrs) {
    return el(tag, Object.assign({ y: +(top - h / 2).toFixed(3), height: h }, attrs));
  }

  // dark base, with wide bands so the length of the run reads - the
  // middle forty metres left plain under the emblem
  paint("m-cube", 0.2, 0.2, { width: FIELD_W, depth: FIELD_L, color: TURF });
  for (let k = -5; k < 5; k++) {
    if (k === -1 || k === 0 || (k + 10) % 2 === 0) continue;
    paint("m-cube", 0.22, 0.04, { z: k * 20 + 10, width: FIELD_W, depth: 20, color: TURF_B });
  }

  // end zones - deep team colours, BULLDOG across each, a row of
  // steel studs along the line
  [-1, 1].forEach((side) => {
    const zc = side * (LINE_Z + HOME_D / 2);
    const zone = side < 0 ? END_BLUE : END_GOLD;
    paint("m-cube", 0.24, 0.06, { z: zc, width: FIELD_W, depth: HOME_D, color: zone });
    el("m-label", {
      // rz, not ry, to turn it round: with ry 180 the label lies face
      // DOWN and the word reads mirrored from above
      z: zc, y: 0.29, rx: -90, rz: side < 0 ? 0 : 180,
      width: 60, height: 9, "font-size": 300, alignment: "center",
      color: zone, "font-color": side < 0 ? "#2f4c9a" : "#8a6a1e", content: "BULLDOG",
    });
    paint("m-cube", 0.28, 0.08, { z: side * LINE_Z, width: FIELD_W, depth: 0.9, color: LINE });
    paint("m-cube", 0.28, 0.08, { z: side * (FIELD_L / 2 - 0.3), width: FIELD_W, depth: 0.5, color: LINE });
    for (let x = -FIELD_W / 2 + 6; x <= FIELD_W / 2 - 6; x += 6) {
      paint("m-cube", 0.31, 0.06, { x: x, z: side * (LINE_Z + 1.4), ry: 45, width: 0.9, depth: 0.9, color: STUD });
    }
    [-1, 1].forEach((sx) => {
      const x = sx * (FIELD_W / 2 - 1);
      el("m-cylinder", { x: x, z: side * LINE_Z, y: 1.6, radius: 0.07, height: 3.2, color: LINE });
      el("m-cube", {
        x: x - sx * 0.55, z: side * LINE_Z, y: 2.8,
        width: 1.0, height: 0.7, depth: 0.04, color: homeCol(side),
      });
    });
  });

  // touchlines as spiked collars: crimson leather, steel studs
  [-1, 1].forEach((s) => {
    paint("m-cube", 0.28, 0.08, { x: s * (FIELD_W / 2 - 0.4), width: 0.5, depth: FIELD_L, color: LINE });
    paint("m-cube", 0.26, 0.04, { x: s * (FIELD_W / 2 - 1.9), width: 1.8, depth: LINE_Z * 2, color: COLLAR_RED });
    for (let z = -LINE_Z + 3; z <= LINE_Z - 3; z += 6) {
      paint("m-cube", 0.3, 0.04, { x: s * (FIELD_W / 2 - 1.9), z: z, ry: 45, width: 0.8, depth: 0.8, color: STUD });
    }
  });
  paint("m-cube", 0.28, 0.08, { width: FIELD_W, depth: 0.4, color: LINE });   // halfway

  // paw-print trails: one set running each way down the pitch
  function pawPrint(x, z, dir) {
    paint("m-cylinder", 0.25, 0.02, { x: x, z: z, radius: 1.35, sx: 1.2, sz: 0.95, color: PAW_INK });
    [[-1.55, 1.25], [-0.6, 2.0], [0.6, 2.0], [1.55, 1.25]].forEach(([tx, tz]) => {
      if (LOW_POLY) paint("m-cube", 0.25, 0.02, { x: x + tx, z: z + tz * dir, ry: 45, width: 0.8, depth: 0.95, color: PAW_INK });
      else paint("m-cylinder", 0.25, 0.02, { x: x + tx, z: z + tz * dir, radius: 0.5, sz: 1.2, color: PAW_INK });
    });
  }
  [[-27, 1], [27, -1]].forEach(([x0, dir]) => {
    let k = 0;
    for (let z = -LINE_Z + 8; z <= LINE_Z - 8; z += PAW_STEP, k++) {
      const zz = dir > 0 ? z : -z;
      if (Math.abs(zz) < 16) continue;   // leave the emblem clear
      pawPrint(x0 + (k % 2 ? 2.2 : -2.2), zz, dir);
    }
  });

  // the centre spot: a spiked collar ring round a bulldog's head
  paint("m-cylinder", 0.27, 0.06, { radius: 13, color: COLLAR_RED });
  paint("m-cylinder", 0.29, 0.08, { radius: 11.4, color: TURF });
  for (let k = 0; k < 18; k++) {
    const a = k * 20 * Math.PI / 180;
    paint(LOW_POLY ? "m-cube" : "m-cylinder", 0.31, 0.04, LOW_POLY
      ? { x: 12.2 * Math.sin(a), z: 12.2 * Math.cos(a), ry: 45, width: 0.78, depth: 0.78, color: STUD }
      : { x: 12.2 * Math.sin(a), z: 12.2 * Math.cos(a), radius: 0.45, color: STUD });
  }
  [-1, 1].forEach((s) => {
    paint("m-cylinder", 0.3, 0.02, { x: s * 7.6, z: 6.0, ry: s * 35, radius: 2.9, sx: 1.0, sz: 0.6, color: BRINDLE });
  });
  paint("m-cylinder", 0.31, 0.04, { radius: 8, sx: 1.15, sz: 0.95, color: HEAD });
  paint("m-cylinder", 0.32, 0.02, { z: 3.3, radius: 4.4, sx: 1.4, sz: 0.42, color: BRINDLE });
  [-1, 1].forEach((s) => {
    paint("m-cylinder", 0.33, 0.02, { x: s * 3.1, z: 1.6, radius: 1.0, color: "#0c0a09" });
    paint("m-cylinder", 0.34, 0.02, { x: s * 2.8, z: 1.9, radius: 0.35, color: CALL_RED });
  });
  paint("m-cylinder", 0.32, 0.02, { z: -3.2, radius: 4.2, sx: 1.35, sz: 0.8, color: MUZZLE });
  [-1, 1].forEach((s) => {
    paint("m-cylinder", 0.33, 0.02, { x: s * 2.3, z: -4.4, radius: 2.3, color: MUZZLE });
    paint("m-cylinder", 0.34, 0.02, { x: s * 1.6, z: -6.5, radius: 0.45, color: LINE });
  });
  paint("m-cube", 0.34, 0.02, { z: -5.3, width: 3.6, depth: 0.25, color: BRINDLE });
  paint("m-cylinder", 0.34, 0.02, { z: -1.6, radius: 1.5, sx: 1.4, sz: 0.8, color: "#0c0a09" });

  // Where each dog waits between runs, painted like a kennel mark.
  // The marks are spread across however many dogs are actually out,
  // so calling another one re-spaces the whole line rather than
  // stacking it on top of one already standing there.
  function guardX(i, n) {
    const span = FIELD_W * 0.72;
    return n <= 1 ? 0 : -span / 2 + span * i / (n - 1);
  }

  // ==========================================================
  // BOUNDARY - wall plus an invisible extension to y 24.4
  // ==========================================================
  const BOUND_L = GALLERY ? DECK_L : ARENA_L - 4;

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * 48.3, y: 2.1, width: 1.2, height: 4.2, depth: BOUND_L,
      color: CONCRETE, collide: "true",
    });
    el("m-cube", {
      x: s * 48.3, y: 4.34, width: 1.7, height: 0.28, depth: BOUND_L, color: CHALK,
    });
    // below the slot: fills the space behind the rail so the concrete
    // top at 4.2 is never a ledge you can stand on
    el("m-cube", {
      x: s * 48.3, y: (4.2 + GLASS_SILL) / 2,
      width: 1.2, height: GLASS_SILL - 4.2, depth: BOUND_L,
      color: "#000000", opacity: 0, collide: "true",
    });
    // above the slot: the rest of the old wall, unchanged
    el("m-cube", {
      x: s * 48.3, y: (GLASS_HEAD + 24.4) / 2,
      width: 1.2, height: 24.4 - GLASS_HEAD, depth: BOUND_L,
      color: "#000000", opacity: 0, collide: "true",
    });
  });

  // ==========================================================
  // STANDS + GALLERY
  // ==========================================================
  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * 58.45, y: (DECK_TOP - 0.16) / 2,
      width: 19.1, height: DECK_TOP - 0.16, depth: DECK_L,
      color: CONCRETE, collide: "true",
    });
    el("m-cube", {
      x: s * 58.45, y: DECK_TOP - 0.08,
      width: 19.5, height: 0.16, depth: DECK_L, color: "#6c7176",
    });
  });

  const STAIR_RISE = DECK_Y / STAIR_N;
  const ZEDGE = ARENA_L / 2 + 1;
  const DOOR_X = (PORTAL_X + PORTAL_W / 2 + ARENA_W / 2) / 2;

  function galleryStair(sx, sz) {
    const x = sx * STAIR_X;

    el("m-cube", {
      x: sx * DOOR_X, z: sz * (ARENA_L / 2 + 0.5), y: DECK_Y / 2,
      width: DOOR_W - 0.4, height: DECK_Y, depth: 3,
      color: CONCRETE, collide: "true",
    });

    for (let i = 0; i < STAIR_N; i++) {
      const h = (i + 1) * STAIR_RISE;
      const zc = sz * (ZEDGE + (STAIR_N - 1 - i) * STAIR_RUN + STAIR_RUN / 2);

      el("m-cube", {
        x: x, z: zc, y: h / 2,
        width: STAIR_W, height: h, depth: STAIR_RUN + 0.06,
        color: CONCRETE, collide: "true",
      });
      el("m-cube", {
        x: x, z: zc + sz * (STAIR_RUN / 2), y: h + 0.04,
        width: STAIR_W + 0.2, height: 0.08, depth: 0.18,
        color: HOME_YEL,
      });
      [-1, 1].forEach((e) => {
        el("m-cube", {
          x: x + e * (STAIR_W / 2 + 0.3), z: zc, y: (h + 1.0) / 2,
          width: 0.6, height: h + 1.0, depth: STAIR_RUN + 0.06,
          color: STEEL_DK, collide: "true",
        });
      });
    }

    const zFoot = sz * (ZEDGE + STAIR_N * STAIR_RUN + 0.4);
    [-1, 1].forEach((e) => {
      const nx = x + e * (STAIR_W / 2 + 0.3);
      el("m-cylinder", { x: nx, z: zFoot, y: 1.6, radius: 0.45, height: 3.2, color: STEEL_DK, collide: "true" });
      globe({ x: nx, z: zFoot, y: 3.6, radius: 0.6, color: LAMP });
      el("m-light", { x: nx, z: zFoot, y: 3.6, type: "point", intensity: 5, color: LAMP });
    });

    const zSign = sz * (ZEDGE + STAIR_N * STAIR_RUN + 2.2);
    const ry = sz < 0 ? 180 : 0;
    el("m-cube", {
      x: x, z: zSign, y: 2.6, ry: ry,
      width: 9, height: 2.0, depth: 0.3, color: FRAME,
    });
    el("m-label", {
      x: x, z: zSign + sz * 0.25, y: 2.6, ry: ry,
      width: 8.4, height: 1.4, "font-size": 52, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "SPECTATOR GALLERY",
    });
  }

  if (GALLERY) {
    [-1, 1].forEach((sx) => {
      el("m-cube", {
        x: sx * 49.0, y: DECK_Y + RAIL_H / 2,
        width: 0.18, height: RAIL_H, depth: DECK_L,
        color: "#cfe8f0", opacity: 0.12, collide: "true",
      });
      el("m-cube", {
        x: sx * 49.0, y: DECK_Y + RAIL_H,
        width: 0.5, height: 0.18, depth: DECK_L, color: STEEL,
      });
      for (let z = -132; z <= 132; z += 12) {
        bar({
          x: sx * 49.0, z: z, y: DECK_Y + RAIL_H / 2,
          radius: 0.1, height: RAIL_H, color: STEEL,
        });
      }
      el("m-cube", {
        x: sx * 66.9, y: DECK_Y + 0.45,
        width: 0.5, height: 0.9, depth: DECK_L, color: STEEL_DK, collide: "true",
      });
    });

    GALLERY_ENDS.forEach((sz) => {
      [-1, 1].forEach((sx) => galleryStair(sx, sz));
    });

    [-1, 1].forEach((sx) => {
      [-1, 1].forEach((sz) => {
        el("m-cube", {
          x: sx * 49.55, z: sz * 140, y: DECK_Y / 2,
          width: 1.3, height: DECK_Y, depth: 2.6,
          color: CONCRETE, collide: "true",
        });

        const zEnd = sz * (DECK_L / 2 - 0.1);
        const runs = hasGallery(sz)
          ? [[48.9, DOOR_X - DOOR_W / 2], [DOOR_X + DOOR_W / 2, 68]]
          : [[48.9, 68]];

        runs.forEach(([x0, x1]) => {
          el("m-cube", {
            x: sx * (x0 + x1) / 2, z: zEnd, y: DECK_Y + RAIL_H / 2,
            width: x1 - x0, height: RAIL_H, depth: 0.18,
            color: "#cfe8f0", opacity: 0.12, collide: "true",
          });
          el("m-cube", {
            x: sx * (x0 + x1) / 2, z: zEnd, y: DECK_Y + RAIL_H,
            width: x1 - x0, height: 0.18, depth: 0.5, color: STEEL,
          });
        });
      });
    });
  }

  if (DETAIL) {
    const SLOGANS = ["THE DOGS ARE FASTER THAN YOU.", "NOWHERE ON THIS PITCH IS SAFE.", "THE DOGS ARE FASTER THAN YOU."];
    [-1, 1].forEach((s) => {
      [-60, 0, 60].forEach((z, k) => {
        el("m-cube", {
          x: s * 66.2, z: z, y: 13, ry: s * -90,
          width: 31, height: 4.6, depth: 0.3, color: FRAME,
        });
        el("m-label", {
          x: s * 66.0, z: z, y: 13, ry: s * -90,
          width: 30, height: 3.8, "font-size": 64, alignment: "center",
          color: BOARD, "font-color": CHALK, content: SLOGANS[k],
        });
      });
      // banners: crimson, gold-edged, a gold paw on each
      for (let z = -100; z <= 100; z += 50) {
        const bx = s * (ARENA_W / 2 - 2.2);
        el("m-cube", { x: bx, z: z, y: 31, width: 0.4, height: 20, depth: 8, color: COLLAR_RED });
        [-1, 1].forEach((e) => {
          el("m-cube", { x: bx, z: z + e * 3.85, y: 31, width: 0.46, height: 20, depth: 0.3, color: WIN_GOLD });
        });
        el("m-cube", { x: bx, z: z, y: 21.1, width: 0.46, height: 0.3, depth: 8, color: WIN_GOLD });
        el("m-cube", {
          x: s * (ARENA_W / 2 - 2.2), z: z, y: 41.4,
          width: 0.6, height: 0.5, depth: 8.6, color: STEEL,
        });
        wallPaw(s, bx + -s * 0.25, z, 30, 1.25, 0, WIN_GOLD);
      }
    });

    // studs along the wall collar
    [-1, 1].forEach((s) => {
      for (let z = -136; z <= 136; z += 8) {
        el(LOW_POLY ? "m-cube" : "m-cylinder", LOW_POLY ? {
          x: s * (ARENA_W / 2 - 1.3), z: z, y: 40, rx: 45,
          width: 0.25, height: 0.66, depth: 0.66, color: STUD,
        } : {
          x: s * (ARENA_W / 2 - 1.3), z: z, y: 40, rz: 90,
          radius: 0.42, height: 0.25, color: STUD,
        });
      }
    });

    // bulldog crests, between the banners and clear of the ribs
    [-1, 1].forEach((s) => {
      WALL_CRESTS.forEach((z) => {
        const team = z < 0 ? HOME_BLUE : HOME_YEL;
        wallCrest(s, z, 28, team);
      });
    });

    // paw prints walking the length of both walls, above the gallery
    if (WALL_PAWS) [-1, 1].forEach((s) => {
      let k = 0;
      for (let z = -128; z <= 128; z += 6.5, k++) {
        if (Math.abs(((z + 130) % 20) - 0) < 1.6 || Math.abs(((z + 130) % 20) - 20) < 1.6) continue;  // a rib
        let slogan = false;
        [-60, 0, 60].forEach((c) => { if (Math.abs(z - c) < 16.5) slogan = true; });
        if (slogan) continue;
        wallPaw(s, s * (ARENA_W / 2 - 1.05), z, 8.6 + (k % 2 ? 0.9 : -0.9), 1.0, s, "#5a1a20");
      }
    });
  }

  // --- helpers for the wall decoration ----------------------
  // A flat disc on a side wall, facing the pitch. u runs along the
  // wall (image-right as seen from the pitch), v is up. su and sv
  // stretch it along and up. Layer steps it off the wall so
  // overlapping shapes stack cleanly.
  function wallDisc(s, x, zc, yc, u, v, r, su, sv, layer, color, tilt) {
    return el("m-cylinder", {
      x: (x - s * (0.03 + layer * 0.05)).toFixed(3),
      z: (zc + s * u).toFixed(3), y: (yc + v).toFixed(3),
      rz: 90, rx: tilt || 0, radius: r, sx: sv, sz: su, height: 0.04, color: color,
    });
  }

  // a paw print on a wall. dir: which way it walks along the wall
  // (+1/-1 as seen from the pitch), or 0 to stand upright
  function wallPaw(s, x, zc, yc, k, dir, color) {
    wallDisc(s, x, zc, yc, 0, 0, 1.35 * k, 1.2, 0.95, 0, color);
    [[-1.55, 1.25], [-0.6, 2.0], [0.6, 2.0], [1.55, 1.25]].forEach(([a, b]) => {
      const u = dir ? b * k * dir : a * k;
      const v = dir ? a * k : b * k;
      // the big pad stays a disc; the four toes are small enough
      // that a tilted plate reads the same from the pitch
      if (LOW_POLY) wallToe(s, x, zc, yc, u, v, 0.5 * k, color);
      else wallDisc(s, x, zc, yc, u, v, 0.5 * k, 1.0, 1.0, 0, color);
    });
  }
  function wallToe(s, x, zc, yc, u, v, r, color) {
    return el("m-cube", {
      x: (x - s * 0.03).toFixed(3),
      z: (zc + s * u).toFixed(3), y: (yc + v).toFixed(3),
      rx: 45, width: 0.05, height: r * 1.6, depth: r * 1.6, color: color,
    });
  }

  // a shield with a bulldog's face in a studded collar
  function wallCrest(s, zc, yc, team) {
    const face = s * (ARENA_W / 2 - 1);   // the wall's inner face
    const plate = (dx, attrs) => el("m-cube", Object.assign({ x: face - s * dx }, attrs));
    // edge in the team colour, then the dark shield on top of it
    plate(0.08, { z: zc, y: yc + 1.5, width: 0.1, height: 11.2, depth: 12.8, color: team });
    plate(0.08, { z: zc, y: yc - 4.2, rx: 45, width: 0.1, height: 9.0, depth: 9.0, color: team });
    plate(0.16, { z: zc, y: yc + 1.5, width: 0.1, height: 10.4, depth: 12.0, color: "#141923" });
    plate(0.16, { z: zc, y: yc - 4.2, rx: 45, width: 0.1, height: 8.4, depth: 8.4, color: "#141923" });
    const x = face - s * 0.2;
    const K = 0.42;                           // the floor emblem, scaled down
    const d = (u, v, r, su, sv, layer, color, tilt) =>
      wallDisc(s, x, zc, yc + 1.2, u * K, v * K, r * K, su, sv, layer, color, tilt);
    d(0, 0, 13, 1, 1, 0, COLLAR_RED);
    d(0, 0, 11.4, 1, 1, 1, "#141923");
    if (CREST_STUDS) {
      for (let i = 0; i < 12; i++) {
        const a = i * 30 * Math.PI / 180;
        d(12.2 * Math.sin(a), 12.2 * Math.cos(a), 0.55, 1, 1, 2, STUD);
      }
    }
    [-1, 1].forEach((e) => d(e * 7.6, 6.0, 2.9, 1.0, 0.6, 2, BRINDLE, e * 35));
    d(0, 0, 8, 1.15, 0.95, 3, HEAD);
    d(0, 3.3, 4.4, 1.4, 0.42, 4, BRINDLE);
    [-1, 1].forEach((e) => {
      d(e * 3.1, 1.6, 1.0, 1, 1, 5, "#0c0a09");
      d(e * 2.8, 1.9, 0.35, 1, 1, 6, CALL_RED);
    });
    d(0, -3.2, 4.2, 1.35, 0.8, 4, MUZZLE);
    [-1, 1].forEach((e) => {
      d(e * 2.3, -4.4, 2.3, 1, 1, 5, MUZZLE);
      d(e * 1.6, -6.5, 0.45, 1, 1, 6, LINE);
    });
    d(0, -1.6, 1.5, 1.4, 0.8, 6, "#0c0a09");
    // a plaque under it
    el("m-label", {
      x: face - s * 0.2, z: zc, y: yc - 5.6, ry: -s * 90,
      width: 7.5, height: 1.2, "font-size": 70, alignment: "center",
      color: "#141923", "font-color": team, content: "BULLDOG",
    });
  }

  // ==========================================================
  // THE SHOW - what makes it feel like a final, not a field
  // ==========================================================
  if (DETAIL) {
    // BULLDOG, ten metres high, across the inside of both end walls
    [-1, 1].forEach((side) => {
      const z = side * (ARENA_L / 2 - 1.3);
      el("m-cube", { z: z + side * 0.2, y: 36, width: 70, height: 13, depth: 0.3, color: BRICK_DK });
      el("m-label", {
        z: z, y: 36, ry: side < 0 ? 0 : 180,
        width: 68, height: 12, "font-size": 300, alignment: "center",
        color: BRICK_DK, "font-color": homeCol(side), content: "BULLDOG",
      });
      [29.2, 42.8].forEach((y) => {
        el("m-cube", { z: z + side * 0.05, y: y, width: 70, height: 0.4, depth: 0.4, color: homeCol(side) });
      });
    });

    // LED ribbon boards along the inside of both touchline walls
    [-1, 1].forEach((s) => {
      el("m-cube", {
        x: s * 47.62, y: 2.9, width: 0.12, height: 1.7, depth: FIELD_L, color: "#0a0d14",
      });
      for (let k = 0; k < 10; k++) {
        const z = -FIELD_L / 2 + 10 + k * 20;
        el("m-label", {
          x: s * 47.54, z: z, y: 2.9, ry: -s * 90,
          width: 16, height: 1.5, "font-size": 96, alignment: "center",
          color: "#0a0d14", "font-color": k % 2 ? HOME_YEL : HOME_BLUE,
          content: k % 2 ? "RUN" : "BULLDOG",
        });
      }
    });

    // team fire along the top of both touchline walls: blue at the
    // blue end, gold at the gold end, red on halfway
    [-1, 1].forEach((s) => {
      FIRE_Z.forEach((z, k) => {
        const fire = z < 0 ? "#3c7dff" : z > 0 ? "#ffb21a" : CALL_RED;
        // The braziers stand on taller posts than they used to. They sat
        // with their bowls at y 5.3 and their flames at 5.8, which is
        // squarely in the sight slot - three of them a side, one of them
        // on halfway where the host naturally stands, each throwing a
        // 15-degree blind cone across the pitch. Up on a post the whole
        // fire clears GLASS_HEAD and the slot is open the length of the
        // deck. They also look better on posts.
        const g = el("m-group", { x: s * 48.3, z: z, y: 4.48 });
        const SIL = GLASS_SILL - 4.48, HED = GLASS_HEAD - 4.48;
        // full-thickness below the slot, a thin stem THROUGH it, bowl and
        // flame above it. The brazier has to cross the slot to stand on
        // the wall, so the only question is how much of it does: at full
        // thickness it threw a 9-degree blind cone across the pitch from
        // wherever you stood behind it, and one of the three is on
        // halfway, where the host stands. At 0.12 it is a wire.
        el("m-cylinder", { y: SIL / 2, radius: 0.35, height: SIL, color: STEEL_DK }, g);
        el("m-cylinder", { y: (SIL + HED) / 2, radius: 0.12, height: HED - SIL, color: STEEL_DK }, g);
        el("m-cylinder", { y: HED + 0.18, radius: 0.85, height: 0.35, color: STEEL_DK }, g);
        [[HED + 0.7, 0.62, 430], [HED + 1.3, 0.42, 370], [HED + 1.8, 0.24, 310]].forEach(([y, r, ms], fi) => {
          // the body of the flame stays round; the two tongues above
          // it are boxes - they are small, they are moving, and they
          // are lit from inside
          const f = (LOW_POLY && fi > 0)
            ? el("m-cube", { y: y, ry: 45, width: r * 1.5, height: r * 2.1, depth: r * 1.5, color: fire }, g)
            : el("m-sphere", { y: y, radius: r, color: fire }, g);
          const a = document.createElement("m-attr-anim");
          a.setAttribute("attr", "sy");
          a.setAttribute("start", "0.8");
          a.setAttribute("end", "1.25");
          a.setAttribute("duration", String(ms + k * 23));
          a.setAttribute("loop", "true");
          f.append(a);
        });
        const lamp = el("m-light", { y: GLASS_HEAD - 4.48 + 1.6, type: "point", intensity: FIRE_GLOW, distance: 14, color: fire }, g);
        const la = document.createElement("m-attr-anim");
        la.setAttribute("attr", "intensity");
        la.setAttribute("start", String(Math.round(FIRE_GLOW * 0.8 * LIGHT * 100) / 100));
        la.setAttribute("end", String(Math.round(FIRE_GLOW * 1.15 * LIGHT * 100) / 100));
        la.setAttribute("duration", String(520 + k * 37));
        la.setAttribute("loop", "true");
        lamp.append(la);
      });
    });

    // two colossal bulldogs at each end, eyes burning, watching the run
    const STATUE_S = 4.2;
    STATUE_ENDS.forEach((side) => {
      [-1, 1].forEach((sx) => {
        const x = sx * 22, z = side * 124;
        el("m-cube", { x: x, z: z, y: 0.6, width: 9.5, height: 1.2, depth: 19.5, color: STEEL_DK, collide: "true" });
        el("m-cube", { x: x, z: z, y: 1.25, width: 9.9, height: 0.15, depth: 19.9, color: homeCol(side) });
        const g = el("m-group", { x: x, z: z, y: 1.3, ry: side < 0 ? 0 : 180 });
        const m = el("m-group", { z: (-0.3 * STATUE_S).toFixed(2) }, g);
        dogModel(m, STATUE_S, CALL_RED);
        [-1, 1].forEach((e) => {
          el("m-light", {
            x: e * 0.32 * STATUE_S, z: 2.3 * STATUE_S - 0.3 * STATUE_S, y: 1.95 * STATUE_S,
            type: "point", intensity: STATUE_GLOW, distance: 10, color: CALL_RED,
          }, g);
        });
        el("m-light", { y: 1.5, z: 9, type: "point", intensity: STATUE_GLOW * 1.8, distance: 16, color: LAMP }, g);
      });
    });
  }

  // ==========================================================
  // GAME STATE
  // ==========================================================
  // Declared before anything that runs at load - const and let are
  // not hoisted, which is the trap that once made a console look
  // dead in red light.
  let phase = "STANDBY";      // STANDBY | HUNT
  let totalCaught = 0;
  let hostId = null;          // whoever entered the code, if we can tell
  let flashUntil = 0;
  let idSeen = false;

  const bodies = new Map();   // connectionId -> { x, z, t, vx, vz }
  const caged = new Map();    // connectionId -> the cage holding them
  const grace = new Map();    // connectionId -> when they can be caught again
  const foot = [];            // [x, z, t] footsteps - what the dogs hunt
  const safeZones = [];       // [x, z, until] - a cage the host just opened
  const recentTags = [];      // [x, z, t]
  const cages = [];
  const marks = [];

  const PARK = -900;


  // THE RUN is the ground between the two home lines - the lines the
  // corner flags stand on. That is the dogs' ground and all of it is
  // live: no side you are sent to, no corner they will not come to.
  // Behind either line, in the end zone, is home. A dog will not set
  // foot past a flag and cannot reach, chase or tag anybody who is
  // standing there, so the run between the ends is the whole game.
  const FIELD_EDGE = 1.5;
  function onField(x, z) {
    return Math.abs(x) <= FIELD_W / 2 + FIELD_EDGE &&
      Math.abs(z) <= FIELD_L / 2 + FIELD_EDGE;
  }
  // between the flags, with the line itself counting as home
  function inRun(z) {
    return !DOG_LINE || Math.abs(z) <= LINE_Z - HOME_TOL;
  }

  // Where somebody IS, not where the last report put them. Reports
  // arrive every PROBE_MS and a sprinting avatar covers several
  // metres between two of them, so a dog working from the raw
  // number is permanently swiping at the grass behind its target.
  function where(b, now) {
    const age = Math.min(Math.max((now - b.t) / 1000, 0), PREDICT_MAX);
    return [b.x + b.vx * age, b.z + b.vz * age];
  }

  // Catchable: not already in a cage, and not inside the immunity
  // somebody gets for a few seconds after being let out of one.
  function isTarget(id, now) {
    if (caged.has(id)) return false;
    const g = grace.get(id);
    return !(g !== undefined && now < g);
  }
  function judging() { return USE_PROBES && idSeen; }

  function inSafeZone(x, z) {
    const now = Date.now();
    for (let i = safeZones.length - 1; i >= 0; i--) {
      if (now > safeZones[i][2]) { safeZones.splice(i, 1); continue; }
      if (Math.hypot(x - safeZones[i][0], z - safeZones[i][1]) <= SAFE_R) return true;
    }
    return false;
  }
  // INSIDE the bars, which means a prisoner. Not "near a cage".
  //
  // This is the v21 bug. The test was CAGE_A + 1.2 = 4.0m from a cage's
  // centre, and the only solid part of a cage is its six wall panels at
  // CAGE_A = 2.8 - the base plinth does not collide, so a runner can
  // walk right up and lean on the wall, which puts their centre at
  // about 2.8 + their own radius = 3.15m out. That is well inside 4.0,
  // so the game read them as already caged: their footsteps stopped
  // feeding the dogs, any quarry on them was deleted, pickTarget
  // skipped them and tagAt refused to tag them even on contact. Hugging
  // a cage was a hiding place.
  //
  // A prisoner cannot get further out than 2.8 - 0.35 = 2.45m, and a
  // runner outside cannot get closer in than about 3.15m, so 2.8m sits
  // in a clean 0.7m dead band between the two. Anything past the wall
  // is ordinary pitch and whoever is standing on it is fair game.
  const CAGE_IN_R = CAGE_A;
  function insideCage(x, z) {
    for (let i = 0; i < cages.length; i++) {
      if (Math.hypot(x - cages[i].x, z - cages[i].z) < CAGE_IN_R) return true;
    }
    return false;
  }
  // somebody a dog may go after or catch at this spot
  function huntableAt(x, z) {
    return onField(x, z) && inRun(z) && !insideCage(x, z) && !inSafeZone(x, z);
  }

  // ==========================================================
  // IDENTITY - who is where
  // ==========================================================
  // Three position probes down the middle of the arena. Every body
  // they report is kept with a smoothed velocity, which is what lets
  // a dog run at where you are GOING rather than where you were.
  const sample = (event) => {
    const d = event && event.detail;
    if (!d || d.connectionId === undefined) return;
    const dr = d.documentRelative;
    if (!dr || !dr.position) return;
    idSeen = true;
    const now = Date.now();
    const x = dr.position.x, z = dr.position.z;
    const b = bodies.get(d.connectionId);
    if (!b) {
      bodies.set(d.connectionId, { x: x, z: z, t: now, vx: 0, vz: 0 });
      return;
    }
    const dt = (now - b.t) / 1000;
    if (dt > 0.05 && dt < 2) {
      b.vx = b.vx * 0.5 + ((x - b.x) / dt) * 0.5;
      b.vz = b.vz * 0.5 + ((z - b.z) / dt) * 0.5;
    }
    b.x = x; b.z = z; b.t = now;
  };
  const drop = (event) => {
    const d = event && event.detail;
    if (d && d.connectionId !== undefined) bodies.delete(d.connectionId);
  };

  if (USE_PROBES || DEBUG_TRACK) PROBE_Z.forEach((pz) => {
    const probe = document.createElement("m-position-probe");
    probe.setAttribute("z", pz);
    probe.setAttribute("y", 1);
    probe.setAttribute("range", String(PROBE_RANGE));
    probe.setAttribute("interval", String(PROBE_MS));
    arena.append(probe);
    on(probe, "positionenter", sample);
    on(probe, "positionmove", sample);
    on(probe, "positionleave", drop);
  });

  // Somebody standing perfectly still can go a long time without a
  // single probe event, and standing still in a home is exactly
  // what players are told to do. So a body's LAST KNOWN position is
  // trusted until the probes say it left (positionleave). Only a
  // body silent for minutes is dropped, in case a leave was lost.
  // A quiet body is stationary, so its velocity is zeroed.
  const BODY_KEEP_MS = 180000;
  every(() => {
    const now = Date.now();
    bodies.forEach((b, id) => {
      if (now - b.t > BODY_KEEP_MS) bodies.delete(id);
      else if (now - b.t > PROBE_MS * 3) { b.vx = 0; b.vz = 0; }
    });
  }, 500);

  function bodyOf(id) {
    return bodies.get(id) || null;
  }

  // nearest catchable person to a point, within r, taken at where
  // they are going rather than where they were
  function nearestTarget(x, z, r, now) {
    let best = null, bestD = r;
    bodies.forEach((b, id) => {
      if (!isTarget(id, now)) return;
      const p = where(b, now);
      if (!onField(p[0], p[1])) return;
      const d = Math.hypot(p[0] - x, p[1] - z);
      if (d <= bestD) { bestD = d; best = { id: id, x: p[0], z: p[1] }; }
    });
    return best;
  }

  function countOnField() {
    if (!judging()) return -1;
    const now = Date.now();
    let n = 0;
    bodies.forEach((b, id) => {
      if (caged.has(id)) return;
      const p = where(b, now);
      if (onField(p[0], p[1])) n++;
    });
    return n;
  }

  // DEBUG_TRACK: a pillar wherever the game thinks each body is
  const trackMarks = new Map();   // id -> { g, label, shown }
  function paintTracking() {
    if (!DEBUG_TRACK) return;
    const now = Date.now();
    bodies.forEach((b, id) => {
      let t = trackMarks.get(id);
      if (!t) {
        const g = document.createElement("m-group");
        markRoot.append(g);
        el("m-cylinder", { y: 1.5, radius: 0.15, height: 3, color: "#3fa7ff", opacity: 0.8 }, g);
        const label = el("m-label", {
          y: 3.4, width: 1.6, height: 0.5, "font-size": 32, alignment: "center",
          color: BOARD, "font-color": CHALK, content: "-",
        }, g);
        t = { g: g, label: label, shown: "" };
        trackMarks.set(id, t);
      }
      const p = where(b, now);
      t.g.setAttribute("x", p[0].toFixed(2));
      t.g.setAttribute("z", p[1].toFixed(2));
      const text = caged.has(id) ? "CAGED"
        : !onField(p[0], p[1]) ? "OFF"
        : isTarget(id, now) ? "HUNTED" : "FREED";
      if (text !== t.shown) { t.shown = text; t.label.setAttribute("content", text); }
    });
    trackMarks.forEach((t, id) => {
      if (bodies.has(id)) return;
      if (t.g.parentNode) t.g.parentNode.removeChild(t.g);
      trackMarks.delete(id);
    });
  }

  // ==========================================================
  // FOOTSTEPS - how a dog finds people with no identity
  // ==========================================================
  // Invisible pads over the whole pitch, exactly as Beacon has them.
  // A collisionmove fires when a contact point moves, so running
  // feet are loud and somebody standing still is silent. This is
  // what the dogs hunt by.
  let lastRunnerStep = Date.now();   // last footstep by somebody NOT caged
  function noteFoot(x, z) {
    if (phase === "HUNT" && huntableAt(x, z)) lastRunnerStep = Date.now();
    if (phase !== "HUNT") return;
    const now = Date.now();
    foot.push([x, z, now]);
    if (foot.length > 400) foot.splice(0, foot.length - 400);
    // the footstep's real job: telling a quarry where it is
    if (huntableAt(x, z)) feedQuarry(x, z, now);
  }
  // ==========================================================
  // QUARRIES - the dogs stop chasing footprints and chase people
  // ==========================================================
  // A footstep is a moment. A person is a moment plus a direction
  // that carries on when the moment stops. Up to v20 the dogs
  // chased footsteps, and a hopping runner beat that outright: they
  // touch down for a fraction of a second every second or so, so
  // the floor gets a scatter of stamps in one spot, a long silence,
  // then a scatter eight metres away. Reading a heading off that
  // failed - the stamps in one cluster are too close together in
  // time, and the gap to the next cluster too long - so the dog
  // came up with no direction, ran to the last stamp it had,
  // deleted it, and went back to patrolling under a runner who was
  // still in the air.
  //
  // So a footstep is no longer a target. It is a FIX on a quarry.
  // A quarry holds a position, a heading and the time it was last
  // heard from, and it moves on that heading every tick whether or
  // not the floor can hear it. A touchdown near where a quarry
  // should be by now is that quarry, and it corrects the heading
  // rather than starting a new one - so hop, hop, hop reads as one
  // person crossing the pitch at a steady eight metres a second,
  // which is what it is.
  //
  // A quarry dies when nothing has fed it for QUARRY_HOLD, when a
  // dog is standing on it and it has been silent for QUARRY_GHOST,
  // when it is caged, or when its line takes it off the pitch.
  const quarry = [];          // { x, z, vx, vz, t, fixes, id }
  let quarrySeq = 0;

  // Where a quarry should be now, running its last known heading on
  // from its last known fix.
  function quarryAt(q, now) {
    const silent = (now - q.t) / 1000;
    // full confidence for the length of a jump, then less
    const age = silent <= QUARRY_TRUST
      ? silent
      : QUARRY_TRUST + (silent - QUARRY_TRUST) * QUARRY_DOUBT;
    let dx = q.vx * age, dz = q.vz * age;
    const run = Math.hypot(dx, dz);
    if (run > QUARRY_LEAD_MAX) { dx *= QUARRY_LEAD_MAX / run; dz *= QUARRY_LEAD_MAX / run; }
    return [q.x + dx, q.z + dz];
  }

  function quarryById(id) {
    for (let i = 0; i < quarry.length; i++) if (quarry[i].id === id) return quarry[i];
    return null;
  }

  function dropQuarry(q) {
    const i = quarry.indexOf(q);
    if (i >= 0) quarry.splice(i, 1);
  }

  // A footstep landed. Whose?
  function feedQuarry(x, z, now) {
    if (!QUARRY_HOLD) return;
    let best = null, bestD = QUARRY_MATCH;
    for (let i = 0; i < quarry.length; i++) {
      const p = quarryAt(quarry[i], now);
      const d = Math.hypot(p[0] - x, p[1] - z);
      if (d < bestD) { bestD = d; best = quarry[i]; }
    }
    if (!best) {
      if (quarry.length >= QUARRY_MAX) quarry.shift();
      quarry.push({ x: x, z: z, vx: 0, vz: 0, t: now, fixes: 0, id: ++quarrySeq });
      return;
    }
    // Two touchdowns and the time between them IS the velocity. No
    // stride-matching, no lookback window: a hop measured from take
    // off to landing gives exactly the runner's ground speed.
    const dt = (now - best.t) / 1000;
    if (dt >= 0.12) {
      let nvx = (x - best.x) / dt, nvz = (z - best.z) / dt;
      const m = Math.hypot(nvx, nvz);
      if (m > TRAIL_MAX) { nvx *= TRAIL_MAX / m; nvz *= TRAIL_MAX / m; }
      const k = best.fixes ? QUARRY_SMOOTH : 1;
      best.vx = best.vx * (1 - k) + nvx * k;
      best.vz = best.vz * (1 - k) + nvz * k;
      best.fixes++;
    }
    best.x = x; best.z = z; best.t = now;
  }

  function forgetOldQuarries(now) {
    for (let i = quarry.length - 1; i >= 0; i--) {
      const q = quarry[i];
      if (now - q.t > QUARRY_HOLD) { quarry.splice(i, 1); continue; }
      // last actually heard standing somewhere a dog may not go
      if (!huntableAt(q.x, q.z)) quarry.splice(i, 1);
    }
  }

  // Somebody just went in a cage: whatever quarry was them stops.
  // 8m was too wide a broom - it swept up every other runner within
  // eight metres of the catch as well, and a group breaking in the same
  // direction lost the dogs all at once. One cage across is enough to
  // be sure of the person who was actually caught.
  const CAGE_QUARRY_R = CAGE_A + 1.7;
  function cageQuarry(x, z, now) {
    for (let i = quarry.length - 1; i >= 0; i--) {
      const p = quarryAt(quarry[i], now);
      if (Math.hypot(p[0] - x, p[1] - z) < CAGE_QUARRY_R ||
          Math.hypot(quarry[i].x - x, quarry[i].z - z) < CAGE_QUARRY_R) quarry.splice(i, 1);
    }
  }

  function forgetOldFeet() {
    const cut = Date.now() - FOOT_MEMORY;
    let i = 0;
    while (i < foot.length && foot[i][2] < cut) i++;
    if (i) foot.splice(0, i);
  }

  const PAD_COLS = Math.max(1, Math.round(FIELD_W / FOOT_PITCH));
  const PAD_ROWS = Math.max(1, Math.round(FIELD_L / FOOT_PITCH));
  const PAD_W = FIELD_W / PAD_COLS;
  const PAD_D = FIELD_L / PAD_ROWS;

  for (let r = 0; r < PAD_ROWS; r++) {
    for (let c = 0; c < PAD_COLS; c++) {
      const px = -FIELD_W / 2 + PAD_W / 2 + c * PAD_W;
      const pz = -FIELD_L / 2 + PAD_D / 2 + r * PAD_D;
      const pad = el("m-cube", {
        x: px, z: pz, y: 0.18,
        width: PAD_W + 0.4, height: 0.36, depth: PAD_D + 0.4,
        color: "#000000", opacity: 0,
        collide: "true", "collision-interval": PAD_MS,
      });
      const heard = (e) => {
        const p = e && e.detail && e.detail.position;
        if (p && typeof p.x === "number") noteFoot(px + p.x, pz + p.z);
        else noteFoot(px, pz);
      };
      on(pad, "collisionstart", heard);
      on(pad, "collisionmove", heard);
    }
  }

  // ==========================================================
  // CAGES - where a caught player spends the rest of the game
  // ==========================================================
  const SAFE_R = CAGE_A + 5;   // how big a just-opened cage's safe spot is
  const SIDE = 2 * CAGE_A * Math.tan(Math.PI / 6) + 0.4;
  const CORNER = CAGE_A / Math.cos(Math.PI / 6);
  const EDGE_X = FIELD_W / 2 - CAGE_A + 0.3;   // a cage can stand against the touchline wall
  const EDGE_Z = DOG_LINE ? LINE_Z - CAGE_A - 0.3 : FIELD_L / 2 - 2.5;

  // Last-resort spacing, used only when the normal CAGE_MIN_GAP leaves
  // nowhere at all to put a cage. At this distance two hexes clip each
  // other by about half a metre, which looks a bit crowded and leaves a
  // prisoner 2.2m of interior - and is much better than the alternative,
  // which is that a corner already full of cages becomes a place you
  // cannot be caught.
  const CAGE_TIGHT_GAP = CAGE_A * 1.65;
  function spotClear(x, z, gap) {
    const g = gap === undefined ? CAGE_MIN_GAP : gap;
    if (Math.abs(x) > EDGE_X || Math.abs(z) > EDGE_Z) return false;
    for (let i = 0; i < cages.length; i++) {
      if (Math.hypot(x - cages[i].x, z - cages[i].z) < g) return false;
    }
    return true;
  }

  // Walk outwards in rings from the spot asked for and take the
  // clear point nearest the person it is for.
  function freeSpot(x, z, bx, bz, gap) {
    const cx = clamp(x, -EDGE_X, EDGE_X);
    const cz = clamp(z, -EDGE_Z, EDGE_Z);
    if (spotClear(cx, cz, gap)) return [cx, cz];
    for (let ring = 1; ring <= 26; ring++) {
      const r = ring * 0.5;
      let best = null, bestD = Infinity;
