      for (let k = 0; k < 16; k++) {
        const a = (k / 16) * Math.PI * 2 + ring * 0.31;
        const tx = cx + Math.cos(a) * r;
        const tz = cz + Math.sin(a) * r;
        if (!spotClear(tx, tz, gap)) continue;
        const d = Math.hypot(tx - bx, tz - bz);
        if (d < bestD) { bestD = d; best = [tx, tz]; }
      }
      if (best) return best;
    }
    return [cx, cz];
  }

  function buildCage(x, z, rec) {
    const g = document.createElement("m-group");
    g.setAttribute("x", x);
    g.setAttribute("z", z);
    cageRoot.append(g);

    // The walls and lid sit inside an m-prompt: click any of them -
    // from inside the cage too - and a code box pops up. The code is
    // the only key, so it works for a caged host and never for
    // anybody who does not know it.
    const lock = document.createElement("m-prompt");
    lock.setAttribute("message", "Host code");
    lock.setAttribute("placeholder", "code");
    g.append(lock);

    el("m-cylinder", { y: 0.2, radius: CAGE_A + 0.55, height: 0.4, color: STEEL_DK }, g);
    for (let i = 0; i < 6; i++) {
      const a = i * 60;
      const r = a * Math.PI / 180;
      el("m-cube", {
        x: CAGE_A * Math.sin(r), z: CAGE_A * Math.cos(r),
        y: CAGE_H / 2, ry: a,
        width: SIDE, height: CAGE_H, depth: 0.12,
        color: CALL_RED, opacity: 0.14, collide: "true",
      }, lock);
      // bars, so it reads as a pen and not a glass box
      for (let b = -1; b <= 1; b++) {
        bar({
          x: CAGE_A * Math.sin(r) + b * (SIDE / 4) * Math.cos(r),
          z: CAGE_A * Math.cos(r) - b * (SIDE / 4) * Math.sin(r),
          y: CAGE_H / 2, ry: a, radius: 0.05, height: CAGE_H, color: STEEL,
        }, g);
      }
    }
    for (let i = 0; i < 6; i++) {
      const r = (i * 60 + 30) * Math.PI / 180;
      bar({
        x: CORNER * Math.sin(r), z: CORNER * Math.cos(r),
        y: CAGE_H / 2, radius: 0.13, height: CAGE_H + 0.4, color: STEEL,
      }, g);
    }
    el("m-cylinder", {
      y: CAGE_H + 0.15, radius: CAGE_A + 0.55, height: 0.3,
      color: STEEL_DK, collide: "true",
    }, lock);
    crossLabels(g, CAGE_H + 1.1, "CAUGHT", CALL_RED, CHALK, 3.2, 0.9, 56);
    // and a small plate on the inside wall, so a caged host knows
    [0, 180].forEach((ry) => {
      const r = ry * Math.PI / 180;
      el("m-label", {
        x: (CAGE_A - 0.2) * Math.sin(r), z: (CAGE_A - 0.2) * Math.cos(r), y: 2.2, ry: ry + 180,
        width: 2.4, height: 0.5, "font-size": 26, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "HOST: CLICK THE WALL",
      }, g);
    });

    on(lock, "prompt", (e) => {
      const typed = String((e && e.detail && e.detail.value) || "").replace(/[^0-9]/g, "");
      if (typed === CAGE_CODE.join("")) freeCage(rec, Date.now());
    });

    return g;
  }

  // x, z is where the cage is wanted; bx, bz is the person it is for.
  // If it cannot land on them, it is not built at all.
  function dropCage(x, z, bx, bz) {
    if (cages.length >= MAX_CAGES) return null;
    // Normal spacing first. If the ground round this person is already
    // full of cages there may be no spot that far off every one of them
    // AND still close enough to land round them - which quietly aborted
    // the catch and handed them immunity for standing in a cluster. So
    // fall back to the tightest spacing whose walls still do not
    // intersect, and only give up if even that has nowhere to go.
    let spot = freeSpot(x, z, bx, bz);
    if (Math.hypot(spot[0] - bx, spot[1] - bz) <= CAGE_FIT) {
      const rec0 = { x: spot[0], z: spot[1], id: null };
      rec0.group = buildCage(spot[0], spot[1], rec0);
      cages.push(rec0);
      return rec0;
    }
    // Nothing at normal spacing. Try the tightest spacing whose walls
    // still do not intersect, and allow the cage to land a little
    // further off than usual. A cage a metre wide of somebody beats
    // aborting the catch, which is what v21 did - and which made a
    // corner already full of cages a place you could not be caught.
    spot = freeSpot(x, z, bx, bz, CAGE_TIGHT_GAP);
    if (Math.hypot(spot[0] - bx, spot[1] - bz) > CAGE_FIT + 1.4) return null;
    const rec = { x: spot[0], z: spot[1], id: null };
    rec.group = buildCage(spot[0], spot[1], rec);
    cages.push(rec);
    return rec;
  }

  // ==========================================================
  // LETTING PEOPLE OUT
  // ==========================================================
  // The host is whoever entered the code. If the runtime does not
  // report who clicked - or nobody has entered a code yet - there is
  // nobody to check against, so the cage opens for whoever clicked
  // it. Pretending otherwise would just mean cages that never open.

  function freeCage(rec, now) {
    const i = cages.indexOf(rec);
    if (i < 0) return false;
    cages.splice(i, 1);
    if (rec.group && rec.group.parentNode) rec.group.parentNode.removeChild(rec.group);
    if (rec.id !== null && rec.id !== undefined) {
      caged.delete(rec.id);
      // a few seconds of immunity, or a dog standing over the cage
      // simply re-cages them before they have taken a step
      grace.set(rec.id, now + GRACE_MS);
      const b = bodyOf(rec.id);
      if (b) mark(rec.id, b.x, b.z, "FREED", "#25a35a", GRACE_MS);
    }
    // the spot stays safe for a while so the person let out can
    // actually walk away rather than be re-caged on the spot
    safeZones.push([rec.x, rec.z, now + GRACE_MS]);
    // whoever was in there is not "recently tagged here" any more
    for (let k = recentTags.length - 1; k >= 0; k--) {
      if (Math.hypot(recentTags[k][0] - rec.x, recentTags[k][1] - rec.z) < TAG_SPOT_R) {
        recentTags.splice(k, 1);
      }
    }
    paintBoards();
    return true;
  }

  function freeAll() {
    const now = Date.now();
    let n = 0;
    for (let i = cages.length - 1; i >= 0; i--) {
      if (freeCage(cages[i], now)) n++;
    }
    return n;
  }

  function clearCages() {
    cages.forEach((c) => { if (c.group.parentNode) c.group.parentNode.removeChild(c.group); });
    cages.length = 0;
    recentTags.length = 0;
  }

  // ==========================================================
  // MARKS - the OUT ring and the winner's beam
  // ==========================================================
  function mark(id, x, z, text, color, ms) {
    const g = document.createElement("m-group");
    g.setAttribute("x", x.toFixed(2));
    g.setAttribute("z", z.toFixed(2));
    markRoot.append(g);
    el("m-cylinder", { y: 3.0, radius: 0.9, height: 0.12, color: color, opacity: 0.85 }, g);
    crossLabels(g, 3.8, text, color, CHALK, 1.8, 0.8, 60);
    marks.push({ g: g, id: id, until: Date.now() + (ms || MARK_MS), x: x, z: z });
  }

  function updateMarks(now) {
    for (let i = marks.length - 1; i >= 0; i--) {
      const m = marks[i];
      if (now > m.until) {
        if (m.g.parentNode) m.g.parentNode.removeChild(m.g);
        marks.splice(i, 1);
        continue;
      }
      const b = bodyOf(m.id);
      if (b && Math.hypot(b.x - m.x, b.z - m.z) > 0.15) {
        m.x = b.x; m.z = b.z;
        m.g.setAttribute("x", b.x.toFixed(2));
        m.g.setAttribute("z", b.z.toFixed(2));
      }
    }
  }

  function clearMarks() {
    marks.forEach((m) => { if (m.g.parentNode) m.g.parentNode.removeChild(m.g); });
    marks.length = 0;
  }


  // ==========================================================
  // THE BULLDOGS
  // ==========================================================
  const dogs = [];

  // The model faces +z inside a group that turns with the dog. The
  // solid body is NOT inside that group - it stays an upright
  // cylinder on the dog's centre, so a contact reported against it
  // is always relative to where the dog is, whichever way it faces.
  // The bulldog itself, built facing +z inside group m at scale S.
  // Used for the three hunters and for the two statues at the ends.
  function dogModel(m, S, eyes) {
    const SCALED = ["x", "y", "z", "width", "height", "depth", "radius"];
    const part = (tag, a, parent) => {
      const b = {};
      for (const k in a) b[k] = SCALED.indexOf(k) >= 0 ? +(a[k] * S).toFixed(3) : a[k];
      return el(tag, b, parent || m);
    };

    // legs, a little bowed at the front, and paws
    [[-0.52, 0.55, -6], [0.52, 0.55, 6], [-0.5, -0.75, 0], [0.5, -0.75, 0]].forEach(([x, z, rz]) => {
      part("m-cylinder", { x: x, z: z, y: 0.45, rz: rz, radius: 0.2, height: 0.9, color: DOG_FAWN });
      // paws: down at the grass and half hidden by the legs, so a
      // rounded box does the job of a ball
      if (LOW_POLY) {
        part("m-cube", { x: x * 1.1, z: z + 0.08, y: 0.14, width: 0.42, height: 0.28, depth: 0.5, color: DOG_LIGHT });
      } else {
        part("m-sphere", { x: x * 1.1, z: z + 0.08, y: 0.12, radius: 0.24, color: DOG_LIGHT });
      }
    });
    // barrel, white chest, rump, a brindle saddle, a stub of a tail
    part("m-cube", { z: -0.1, y: 1.25, width: 1.5, height: 1.0, depth: 1.9, color: DOG_FAWN });
    part("m-sphere", { z: 0.55, y: 1.2, radius: 0.82, color: DOG_LIGHT });
    part("m-sphere", { z: -0.85, y: 1.3, radius: 0.72, color: DOG_FAWN });
    part("m-cube", { z: -0.25, y: 1.78, width: 1.54, height: 0.14, depth: 1.3, color: DOG_DARK });
    if (LOW_POLY) part("m-cube", { z: -1.55, y: 1.55, width: 0.3, height: 0.3, depth: 0.3, color: DOG_FAWN });
    else part("m-sphere", { z: -1.55, y: 1.55, radius: 0.16, color: DOG_FAWN });

    // spiked collar, tipped up round the neck
    const collar = document.createElement("m-group");
    collar.setAttribute("y", (1.62 * S).toFixed(2));
    collar.setAttribute("z", (0.95 * S).toFixed(2));
    collar.setAttribute("rx", 65);
    m.append(collar);
    part("m-cylinder", { radius: 0.66, height: 0.2, color: COLLAR }, collar);
    for (let k = 0; k < 10; k++) {
      const a = k * 36 * Math.PI / 180;
      part("m-cube", {
        x: 0.72 * Math.sin(a), z: 0.72 * Math.cos(a), ry: k * 36,
        width: 0.12, height: 0.12, depth: 0.16, color: STEEL,
      }, collar);
    }

    // the head: wide, flat-faced, underbite, cross
    part("m-sphere", { z: 1.45, y: 1.75, radius: 0.72, sx: 1.2, sy: 0.95, color: DOG_FAWN });
    part("m-cube", { z: 2.05, y: 1.5, width: 1.0, height: 0.5, depth: 0.35, color: DOG_LIGHT });
    [-0.3, 0.3].forEach((x) => {
      part("m-sphere", { x: x, z: 2.08, y: 1.38, radius: 0.3, color: DOG_LIGHT });
    });
    part("m-cube", { z: 2.26, y: 1.7, width: 0.36, height: 0.2, depth: 0.12, color: "#1a1210" });
    [-0.25, 0.25].forEach((x) => {
      part("m-cube", { x: x, z: 2.38, y: 1.52, width: 0.09, height: 0.14, depth: 0.08, color: CHALK });
    });
    [-1, 1].forEach((s) => {
      if (LOW_POLY) part("m-cube", { x: s * 0.32, z: 2.05, y: 1.92, ry: 45, width: 0.17, height: 0.17, depth: 0.17, color: eyes });
      else part("m-sphere", { x: s * 0.32, z: 2.05, y: 1.92, radius: 0.1, color: eyes });
      if (!LOW_POLY) part("m-sphere", { x: s * 0.3, z: 2.14, y: 1.96, radius: 0.035, color: "#ffffff" });
      part("m-cube", { x: s * 0.22, z: 2.08, y: 2.08, rz: s * 14, width: 0.4, height: 0.07, depth: 0.1, color: DOG_DARK });
      part("m-cube", { x: s * 0.62, z: 1.35, y: 2.32, rz: s * -35, width: 0.32, height: 0.26, depth: 0.08, color: DOG_DARK });
    });

  }

  function buildDog(i) {
    const g = document.createElement("m-group");
    g.setAttribute("y", PARK);
    dogRoot.append(g);

    el("m-cylinder", { y: 0.3, radius: 2.6, height: 0.04, color: CALL_RED, opacity: 0.28 }, g);

    const turn = document.createElement("m-group");
    g.append(turn);
    const m = document.createElement("m-group");
    m.setAttribute("z", (-0.3 * DOG_SIZE).toFixed(2));
    turn.append(m);

    const S = DOG_SIZE;
    dogModel(m, S, "#140c08");

    // a red marker over its head, so you can find all three across
    // a crowd from the far end of the pitch
    const top = 2.43 * S + 1.4;
    const marker = el("m-sphere", { y: top, radius: 0.42, color: CALL_RED }, g);
    const markerLight = el("m-light", { y: top, type: "point", intensity: MARKER_GLOW, color: CALL_RED }, g);

    // THE BODY. Invisible and solid: somebody running into a dog is
    // stopped dead on their own screen, and the contact that stops
    // them is the contact that reports them.
    const body = el("m-cylinder", {
      y: HUNT_BODY_H / 2, radius: HUNT_BODY_R, height: HUNT_BODY_H,
      color: "#000000", opacity: 0,
      collide: "true", "collision-interval": PAD_MS,
    }, g);

    const h = {
      g: g, turn: turn, body: body, i: i, active: false,
      x: 0, z: 0, vx: 0, vz: 1, ry: 0,
      lastTag: 0, retreatUntil: 0, pauseUntil: 0, rx: 0, rz: 0,
      guardX: 0, speed: 0, caught: 0, hungry: true,
      quarry: null, sweep: null, searching: false,
      marker: marker, markerLight: markerLight,
    };

    const grabbed = (e) => {
      const p = e && e.detail && e.detail.position;
      let x = h.x, z = h.z;
      if (p && typeof p.x === "number" && typeof p.z === "number") {
        x = h.x + p.x;
        z = h.z + p.z;
      }
      tagAt(h, x, z);
    };
    on(body, "collisionstart", grabbed);
    on(body, "collisionmove", grabbed);

    return h;
  }

  // ----------------------------------------------------------
  // THE PACK
  // Dogs are built the first time they are needed and never thrown
  // away: one taken off the pitch goes to the bench, parked out of
  // the world, and comes back the next time the host calls for it.
  // ----------------------------------------------------------
  const bench = [];

  function spreadGuards() {
    for (let i = 0; i < dogs.length; i++) dogs[i].guardX = guardX(i, dogs.length);
  }

  function setPack(n) {
    n = clamp(Math.round(n), 1, MAX_HUNTERS);
    while (dogs.length < n) dogs.push(bench.pop() || buildDog(dogs.length));
    while (dogs.length > n) {
      const h = dogs.pop();
      sleep(h);
      h.speed = 0;
      bench.push(h);
    }
    spreadGuards();
    for (let i = 0; i < dogs.length; i++) {
      const h = dogs[i];
      if (phase === "HUNT") { if (!h.active) wake(h); }
      else sleep(h);
    }
    return dogs.length;
  }

  setPack(HUNTERS);

  // How far up the pitch a dog may come. With DOG_LINE on it is the
  // home line, less the dog's own body, so its nose stops at the
  // flags and the end zone behind them is never stood in.
  const DOG_Z_MAX = DOG_LINE
    ? LINE_Z - HUNT_BODY_R - 0.2
    : FIELD_L / 2 - HUNT_BODY_R - 1;

  function placeDog(h, x, z) {
    h.x = clamp(x, -FIELD_W / 2 + 2, FIELD_W / 2 - 2);
    h.z = clamp(z, -DOG_Z_MAX, DOG_Z_MAX);
    h.g.setAttribute("x", h.x.toFixed(2));
    h.g.setAttribute("z", h.z.toFixed(2));
  }

  function face(h, deg) {
    let d = deg - h.ry;
    while (d > 180) d -= 360;
    while (d < -180) d += 360;
    if (Math.abs(d) < 4) return;
    h.ry = deg;
    h.turn.setAttribute("ry", deg.toFixed(0));
  }

  // A dog standing over a fresh catch goes dark for a moment.
  function setHungry(h, on) {
    if (h.hungry === on) return;
    h.hungry = on;
    h.marker.setAttribute("color", on ? CALL_RED : STEEL_DK);
    h.markerLight.setAttribute("intensity", on ? Math.round(MARKER_GLOW * LIGHT * 100) / 100 : 0);
  }

  function wake(h) {
    h.active = true;
    h.speed = 0;
    placeDog(h, h.guardX, 0);
    h.retreatUntil = 0;
    h.pauseUntil = 0;
    h.quarry = null;
    h.sweep = null;
    setHungry(h, true);
    face(h, 180);
    h.g.setAttribute("y", 0);
  }

  function sleep(h) {
    h.active = false;
    h.g.setAttribute("y", PARK);
  }

  function taggedRecently(x, z) {
    const now = Date.now();
    for (let i = recentTags.length - 1; i >= 0; i--) {
      if (now - recentTags[i][2] > TAG_SPOT_MS) { recentTags.splice(i, 1); continue; }
      const dx = recentTags[i][0] - x, dz = recentTags[i][1] - z;
      if (dx * dx + dz * dz <= TAG_SPOT_R * TAG_SPOT_R) return true;
    }
    return false;
  }

  // Something touched a dog. With identity that is a PERSON: the
  // contact snaps onto the nearest catchable body, so a dog never
  // cages bare grass and never cages somebody twice.
  // ageMs: how old the report of that touch already is. A contact
  // event is fresh; a footstep can be a few hundred ms old.
  function tagAt(h, rawX, rawZ, ageMs) {
    if (phase !== "HUNT" || !h.active) return;
    const now = Date.now();
    if (now < h.pauseUntil) return;

    if (judging()) {
      const hit = nearestTarget(rawX, rawZ, TAG_SNAP_R, now);
      if (!hit) return;
      catchPlayer(hit.id, hit.x, hit.z, h, now);
      return;
    }

    // A tag is a place - the spot where a body touched the dog. The
    // cage is the whole record of it. Nobody already caged, nobody in
    // a freshly opened cage's safe spot, nobody off the pitch.
    if (!huntableAt(rawX, rawZ)) return;
    if (taggedRecently(rawX, rawZ)) return;

    // Throw the cage along the runner's own path: by the time it
    // lands they have kept going - dodging round the dog as often as
    // away from it. Their path comes from the footprint trail right
    // there, and the lead covers both how old the report already is
    // and the round trip for the cage to reach their screen. The one
    // place they cannot be is inside the dog, so a lead that ends up
    // there is pushed back out to its side.
    const dir = away(h, rawX, rawZ);
    const v = trailNear(rawX, rawZ, now);
    const t = CAGE_LAG + (ageMs || 0) / 1000;
    let lx = v[0] * t, lz = v[1] * t;
    const lm = Math.hypot(lx, lz);
    if (lm > CAGE_LEAD_MAX) { lx *= CAGE_LEAD_MAX / lm; lz *= CAGE_LEAD_MAX / lm; }
    let ex = rawX + lx, ez = rawZ + lz;
    const ox = ex - h.x, oz = ez - h.z, od = Math.hypot(ox, oz);
    const clear = HUNT_BODY_R + 0.5;
    if (od < clear) {
      if (od > 0.01) { ex = h.x + ox / od * clear; ez = h.z + oz / od * clear; }
      else { ex = h.x + dir[0] * clear; ez = h.z + dir[1] * clear; }
    }
    h.rx = rawX; h.rz = rawZ;
    const rec = dropCage(ex + dir[0] * 0.4, ez + dir[1] * 0.4, ex, ez);
    if (rec) {
      recentTags.push([ex, ez, now]);
      // The footprints that led here belong to the person now in the
      // cage. Wipe them, or a dog comes back round for the last few
      // and builds a second cage on the grass beside the first.
      for (let k = foot.length - 1; k >= 0; k--) {
        const f = foot[k];
        if (Math.hypot(f[0] - rec.x, f[1] - rec.z) < 8 || Math.hypot(f[0] - rawX, f[1] - rawZ) < 5) foot.splice(k, 1);
      }
      // and the quarry that was them, or a dog turns straight round
      // and starts hunting the person it has just put in a cage
      cageQuarry(rec.x, rec.z, now);
      cageQuarry(rawX, rawZ, now);
      h.lastTag = now;
      h.pauseUntil = now + CATCH_PAUSE;
      h.retreatUntil = now + RETREAT_MS;
      setHungry(h, false);
      h.caught++;
      totalCaught++;
      flashLights();
      paintBoards();
    }
  }

  function away(h, x, z) {
    let dx = x - h.x, dz = z - h.z;
    const m = Math.hypot(dx, dz);
    if (m < 0.01) return [0, 1];
    return [dx / m, dz / m];
  }

  function catchPlayer(id, x, z, h, now) {
    if (caged.has(id)) return;
    const dir = away(h, x, z);
    const cage = dropCage(x + dir[0] * CAGE_OUT, z + dir[1] * CAGE_OUT, x, z);
    if (!cage) return;            // nowhere to put one - stay on them
    cage.id = id;
    caged.set(id, cage);
    grace.delete(id);
    h.lastTag = now;
    h.pauseUntil = now + CATCH_PAUSE;
    h.retreatUntil = now + RETREAT_MS;
    h.rx = x; h.rz = z;
    h.quarry = null;
    h.sweep = null;
    setHungry(h, false);
    h.caught++;
    totalCaught++;
    recentTags.push([x, z, now]);
    flashLights();
    paintBoards();
  }

  // Who should this dog go for? The nearest catchable person, minus
  // anybody another dog is plainly closer to - so three dogs spread
  // over three runners instead of piling onto one - and it aims at
  // where that person is heading, not where they stand.
  function pickTarget(h, now) {
    if (judging()) {
      let best = null, bestP = null, bestS = Infinity;
      bodies.forEach((b, id) => {
        if (!isTarget(id, now)) return;
        const p = where(b, now);
        if (!onField(p[0], p[1]) || !inRun(p[1])) return;
        const d = Math.hypot(p[0] - h.x, p[1] - h.z);
        let s = d;
        for (let j = 0; j < dogs.length; j++) {
          const o = dogs[j];
          if (o === h || !o.active) continue;
          if (Math.hypot(p[0] - o.x, p[1] - o.z) < d - 3) { s += 25; break; }
        }
        if (s < bestS) { bestS = s; best = b; bestP = p; }
      });
      if (!best) return null;
      const d = Math.hypot(bestP[0] - h.x, bestP[1] - h.z);
      const lead = Math.min(LEAD_MAX, d / HUNT_SPEED);
      return [bestP[0] + best.vx * lead, bestP[1] + best.vz * lead];
    }

    // The nearest quarry, leaving anybody another dog is plainly
    // closer to. A quarry that has not been heard from for a second
    // is still a person - it is dead reckoned, not forgotten - so
    // freshness is scored gently and over QUARRY_HOLD, not over the
    // life of a footstep.
    let best = null, bestScore = -1e9, bestP = null;
    for (let i = 0; i < quarry.length; i++) {
      const q = quarry[i];
      const p = quarryAt(q, now);
      if (!huntableAt(p[0], p[1])) continue;
      const d = Math.hypot(p[0] - h.x, p[1] - h.z);
      if (d > HUNT_SENSE) continue;
      let score = (1 - (now - q.t) / QUARRY_HOLD) * 110 - d * 0.85;
      for (let j = 0; j < dogs.length; j++) {
        const o = dogs[j];
        if (o === h || !o.active) continue;
        if (Math.hypot(p[0] - o.x, p[1] - o.z) < d - 3) { score -= 55; break; }
      }
      if (score > bestScore) { bestScore = score; best = q; bestP = p; }
    }
    if (!best || bestScore <= -60) return sweepTarget(h, now);

    h.quarry = best.id;
    const d = Math.hypot(bestP[0] - h.x, bestP[1] - h.z);
    const lead = Math.min(LEAD_MAX, d / HUNT_SPEED);
    // where to search if this one goes silent for good
    h.sweep = { x: bestP[0], z: bestP[1], vx: best.vx, vz: best.vz, t: now };
    return [bestP[0] + best.vx * lead, bestP[1] + best.vz * lead];
  }

  // ----------------------------------------------------------
  // JUMPERS - and what a dog does when it really has lost you
  // ----------------------------------------------------------
  // The floor is the dogs' only sense and a player in the air is
  // not touching it. The floor cannot be taught to hear a jump -
  // the pads are solid geometry, so a taller pad is a wall and not
  // a wider ear - so the dogs stopped needing to hear it. Quarries
  // do that: a jump is a gap in the fixes, and a quarry crosses a
  // gap without noticing it. A dog is not chasing your last
  // footprint any more, it is chasing you, and you being briefly
  // silent does not stop you existing.
  //
  // This is the other half: what happens when a quarry actually
  // dies. Up to v20 the dog dropped straight back to patrol, which
  // looks exactly like giving up, and is. Now it searches - it runs
  // the ground the quarry was heading over, weaving SWEEP_WIDE
  // either side of that line so it covers the width of a mistake
  // rather than a rail, for SWEEP_MS. Nine times in ten it walks
  // back into the person it lost. Then it patrols.
  function sweepTarget(h, now) {
    const S = h.sweep;
    if (!SWEEP_MS || !S) return null;
    const age = (now - S.t) / 1000;
    if (age * 1000 > SWEEP_MS) { h.sweep = null; return null; }

    let dx = S.vx * age, dz = S.vz * age;
    const run = Math.hypot(dx, dz);
    if (run > QUARRY_LEAD_MAX) { dx *= QUARRY_LEAD_MAX / run; dz *= QUARRY_LEAD_MAX / run; }
    let ax = S.x + dx, az = S.z + dz;

    const m = Math.hypot(S.vx, S.vz);
    const wide = Math.min(SWEEP_WIDE, 4 + age * 6);
    if (m > 0.6) {
      // weave across the line it was running
      const px = -S.vz / m, pz = S.vx / m;
      const w = wide * Math.sin(age * 3.1);
      ax += px * w; az += pz * w;
    } else {
      // it was standing still when we lost it: circle the spot
      ax += Math.cos(age * 3.4) * wide;
      az += Math.sin(age * 3.4) * wide;
    }

    if (!huntableAt(ax, az)) { h.sweep = null; return null; }
    h.searching = true;
    return [ax, az];
  }

  // Which way is the runner behind footstep f going? The floor's own
  // record says: find a slightly older footstep near it - the same
  // stride a moment earlier - and take the difference. Footsteps are
  // stored in time order, so this walks back from the newest.
  function trailVelocity(f) {
    let best = null, bestErr = Infinity;
    for (let i = foot.length - 1; i >= 0; i--) {
      const g = foot[i];
      const dt = (f[2] - g[2]) / 1000;
      if (dt < 0.15) continue;
      if (dt > TRAIL_SPAN) break;
      const d = Math.hypot(f[0] - g[0], f[1] - g[1]);
      if (d < 0.3 || d > TRAIL_MAX * dt) continue;
      const err = Math.abs(dt - 0.45) + d * 0.01;
      if (err < bestErr) { bestErr = err; best = g; }
    }
    if (!best) return [0, 0];
    const dt = (f[2] - best[2]) / 1000;
    return [(f[0] - best[0]) / dt, (f[1] - best[1]) / dt];
  }

  // ----------------------------------------------------------
  // THE SPEED CLOCK
  // The dog's speed only means anything next to the avatars', and
  // the only honest source for that is the floor itself. Every so
  // often this takes the newest footstep, asks the trail how fast
  // the person leaving it was travelling, and keeps the best it has
  // seen this session. The consoles show it as CLOCKED.
  //
  // It samples rather than measuring everybody - one footstep every
  // SPEED_SAMPLE_MS - because trailVelocity walks the whole
  // footstep list and doing that per step would cost more than it
  // is worth. Over a minute of running it finds the quick ones.
  // It reads a little low, never high: the trail is measured across
  // a stride, so a runner who turned inside it comes out slower
  // than they were. Take CLOCKED as a floor, not a ceiling.
  // ----------------------------------------------------------
  let clocked = 0;
  every(() => {
    if (phase !== "HUNT" || !foot.length) return;
    const f = foot[foot.length - 1];
    if (Date.now() - f[2] > 500) return;
    const v = trailVelocity(f);
    const sp = Math.hypot(v[0], v[1]);
    if (sp > clocked && sp < TRAIL_MAX) clocked = sp;
  }, SPEED_SAMPLE_MS);

  // Which way is whoever is at (x, z) going? Ask the quarry standing
  // there first - it holds a heading measured touchdown to touchdown
  // and survives a hop, which is exactly what a cage lead needs from
  // somebody who was in the air a moment ago. Only fall back to the
  // raw footprint trail if no quarry claims the spot.
  function trailNear(x, z, now) {
    let best = null, bestD = 6;
    for (let i = 0; i < quarry.length; i++) {
      const q = quarry[i];
      const p = quarryAt(q, now);
      const d = Math.min(Math.hypot(p[0] - x, p[1] - z), Math.hypot(q.x - x, q.z - z));
      if (q.fixes && d < bestD) { bestD = d; best = q; }
    }
    if (best) return [best.vx, best.vz];
    for (let i = foot.length - 1; i >= 0; i--) {
      const f = foot[i];
      if (now - f[2] > 600) break;
      if (Math.hypot(f[0] - x, f[1] - z) <= 3.5) return trailVelocity(f);
    }
    return [0, 0];
  }

  // Nothing to hear: roam. A dog never stands still - pick a spot on
  // the pitch well away from the other dogs, go there, pick another.
  function patrolTarget(h, now) {
    if (h.patrol && now < h.patrolUntil &&
        Math.hypot(h.patrol[0] - h.x, h.patrol[1] - h.z) > 4) return h.patrol;
    let pick = null, bestS = -1e9;
    for (let k = 0; k < 8; k++) {
      const p = [
        (Math.random() - 0.5) * (FIELD_W - 16),
        (Math.random() - 0.5) * (2 * DOG_Z_MAX - 14),
      ];
      if (Math.hypot(p[0] - h.x, p[1] - h.z) < 20) continue;   // somewhere worth going
      let others = 1e9;
      dogs.forEach((o) => {
        if (o === h || !o.active) return;
        others = Math.min(others, Math.hypot(p[0] - o.x, p[1] - o.z));
      });
      const s = Math.min(others, 60) - Math.hypot(p[0] - h.x, p[1] - h.z) * 0.2;
      if (s > bestS) { bestS = s; pick = p; }
    }
    if (!pick) pick = [-h.x * 0.5, -h.z * 0.5];
    h.patrol = pick;
    h.patrolUntil = now + 7000;
    return pick;
  }

  function steer(h, dirX, dirZ) {
    let m = Math.hypot(dirX, dirZ);
    if (m < 0.01) { dirX = h.vx; dirZ = h.vz; m = Math.hypot(dirX, dirZ) || 1; }
    dirX /= m; dirZ /= m;

    for (let j = 0; j < dogs.length; j++) {
      const o = dogs[j];
      if (o === h || !o.active) continue;
      const dx = h.x - o.x, dz = h.z - o.z;
      const d = Math.hypot(dx, dz);
      if (d < HUNT_SEPARATION && d > 0.01) {
        const w = (HUNT_SEPARATION - d) / HUNT_SEPARATION;
        dirX += (dx / d) * w * 1.4;
        dirZ += (dz / d) * w * 1.4;
      }
    }
    for (let s = 0; s < safeZones.length; s++) {
      const dx = h.x - safeZones[s][0], dz = h.z - safeZones[s][1];
      const d = Math.hypot(dx, dz);
      if (d < SAFE_R + 4 && d > 0.01) {
        const w = (SAFE_R + 4 - d) / (SAFE_R + 4);
        dirX += (dx / d) * w * 3.0;
        dirZ += (dz / d) * w * 3.0;
      }
    }
    // A cage is something to walk round, not somewhere to keep away
    // from. v21 held the dogs off by CAGE_A + HUNT_BODY_R + 1.4 = 5.6m,
    // but the dog's body only touches the wall at CAGE_A + HUNT_BODY_R
    // = 4.2m, so there was 1.4m of pure standoff - and a runner leaning
    // on the cage sits at about 3.15m, inside it. Even once the dog was
    // allowed to want them, it was shoved away before it could reach.
    //
    // So: clear the structure and nothing more, and fade the push right
    // down when the thing the dog is going for is AT that cage. It
    // still cannot walk through the wall - those panels collide - it
    // just comes round the outside and takes them.
    // Two clearances, not one. Walking PAST a cage the dog gives it the
    // same wide berth as always, so it rounds the outside cleanly
    // instead of scraping along the wall. Going FOR somebody who is
    // standing at that cage, it clears only its own body and comes
    // right in. The wall panels collide, so it still cannot walk
    // through - it just gets to the far side of the bars and takes them.
    const CAGE_ROUND = CAGE_A + HUNT_BODY_R + 1.4;   // going past one
    const CAGE_CLOSE = CAGE_A + HUNT_BODY_R + 0.1;   // going for somebody at one
    for (let c = 0; c < cages.length; c++) {
      const dx = h.x - cages[c].x, dz = h.z - cages[c].z;
      const d = Math.hypot(dx, dz);
      if (d <= 0.01) continue;
      let keep = CAGE_ROUND, push = 2.6;
      if (h.aimX !== undefined && h.aimX !== null &&
          Math.hypot(h.aimX - cages[c].x, h.aimZ - cages[c].z) < CAGE_ROUND + 1) {
        keep = CAGE_CLOSE; push = 1.5;
      }
      if (d >= keep) continue;
      const w = (keep - d) / keep;
      dirX += (dx / d) * w * push;
      dirZ += (dz / d) * w * push;
    }

    m = Math.hypot(dirX, dirZ) || 1;
    dirX /= m; dirZ /= m;
    h.vx = h.vx * (1 - HUNT_TURN) + dirX * HUNT_TURN;
    h.vz = h.vz * (1 - HUNT_TURN) + dirZ * HUNT_TURN;
    const vm = Math.hypot(h.vx, h.vz) || 1;
    h.vx /= vm; h.vz /= vm;
  }

  function chase(h, now, dt) {
    h.searching = false;
    h.quarry = null;
    let tgt = pickTarget(h, now);
    let speed = HUNT_SPEED;
    if (!tgt) {
      h.sweep = null;
      tgt = patrolTarget(h, now);
      speed = PATROL_SPEED;
    } else {
      h.patrol = null;
      // Standing on a quarry the floor has not heard from in a long
      // while: that is a ghost, not somebody mid-jump. Drop it, or
      // the dog circles an empty patch of grass all game. A jump is
      // well under QUARRY_GHOST, so a real jumper is never dropped
      // here - only somebody who left the pitch or stopped dead.
      const q = h.quarry === null ? null : quarryById(h.quarry);
      if (q && now - q.t > QUARRY_GHOST) {
        const p = quarryAt(q, now);
        if (Math.hypot(p[0] - h.x, p[1] - h.z) < 3.5) dropQuarry(q);
      }
    }
    // steer() needs to know what this dog is going for, so it can tell
    // "a cage is in my way" from "the person I want is standing at it"
    h.aimX = tgt[0]; h.aimZ = tgt[1];
    steer(h, tgt[0] - h.x, tgt[1] - h.z);
    // Get up to it rather than start at it. A dog that snaps to full
    // pace the instant it hears you is level on paper and miles
    // faster in the hand: it never loses the metre you gain leaving
    // a standstill, and it never loses one turning round either.
    if (!HUNT_ACCEL) h.speed = speed;
    else if (h.speed < speed) h.speed = Math.min(speed, h.speed + HUNT_ACCEL * dt);
    else h.speed = Math.max(speed, h.speed - HUNT_ACCEL * 1.6 * dt);
    placeDog(h, h.x + h.vx * h.speed * dt, h.z + h.vz * h.speed * dt);
    face(h, Math.atan2(h.vx, h.vz) * 180 / Math.PI);

    if (now < h.pauseUntil) return;
    if (judging()) {
      const hit = nearestTarget(h.x, h.z, CATCH_R, now);
      if (hit) catchPlayer(hit.id, hit.x, hit.z, h, now);
      return;
    }
    // The floor backstop. The body collider catches most people, but
    // a runner a dog comes up behind may never report touching it. A
    // footstep that fresh, that close, IS somebody in the dog's jaws.
    for (let i = foot.length - 1; i >= 0; i--) {
      const f = foot[i];
      if (now - f[2] > FOOT_CATCH_MS) break;
      if (Math.hypot(f[0] - h.x, f[1] - h.z) <= FOOT_CATCH_R) { tagAt(h, f[0], f[1], now - f[2]); break; }
    }
  }

  // With nobody to chase, a dog drifts back towards its mark.
  function heel(h, dt) {
    const dx = h.guardX - h.x, dz = -h.z;
    const d = Math.hypot(dx, dz);
    if (d < 0.5) return;
    const step = Math.min(d, RETURN_SPEED * dt);
    h.vx = dx / d; h.vz = dz / d;
    placeDog(h, h.x + h.vx * step, h.z + h.vz * step);
    face(h, Math.atan2(h.vx, h.vz) * 180 / Math.PI);
  }

  function dogTick() {
    if (phase !== "HUNT") return;
    const now = Date.now();
    const dt = HUNT_MS / 1000;
    forgetOldFeet();
    forgetOldQuarries(now);
    for (let i = 0; i < dogs.length; i++) {
      const h = dogs[i];
      if (!h.active) continue;
      if (now >= h.pauseUntil) {
        if (!h.hungry) setHungry(h, true);
        chase(h, now, dt);
      } else if (now < h.retreatUntil) {
        steer(h, h.x - h.rx, h.z - h.rz);
        placeDog(h, h.x + h.vx * PATROL_SPEED * dt, h.z + h.vz * PATROL_SPEED * dt);
      } else {
        h.speed = 0;      // stood over a catch: it starts again from nothing
      }
    }
  }

  every(dogTick, HUNT_MS);

  // ==========================================================
  // THE FIELD'S SIGNALS
  // ==========================================================
  function flashLights() {
    flashUntil = Date.now() + FLASH_MS;
    floods.forEach((l) => l.setAttribute("color", CALL_RED));
  }
  function unflash() {
    flashUntil = 0;
    floods.forEach((l) => l.setAttribute("color", LAMP));
  }

  // ==========================================================
  // BOARDS
  // ==========================================================
  const statusLabels = [];
  const countLabels = [];
  const keyDisplays = [];
  const diagLabels = [];
  const speedLabels = [];   // the face of each SPEED pad

  function ago(ms) {
    const t = Math.floor(ms / 1000), m = Math.floor(t / 60), r = t % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }
  // UP is how long this copy of the document has been running. If
  // the game resets and UP is back near 0:00, the world reloaded the
  // document - nothing in here did it.
  function paintDiag() {
    const now = Date.now();
    let text = "V21   UP " + ago(now - BOOT);
    text += "   DOG " + HUNT_SPEED.toFixed(1);
    // Q is how many people the floor currently believes are running.
    // If somebody is hopping about the pitch and Q sits at 0, the
    // pads are not hearing them at all and no amount of dead
    // reckoning will help - that is a floor problem, not a dog one.
    if (phase === "HUNT") text += "   Q " + quarry.length;
    if (clocked) text += "   CLOCKED " + clocked.toFixed(1);
    if (lastStop) text += "   STOPPED BY " + lastStop.why + " " + ago(now - lastStop.at) + " AGO";
    if (scriptErrors) text += "   ERR " + scriptErrors + " " + lastError;
    diagLabels.forEach((l) => l.setAttribute("content", text));
  }

  function setBanner(text, color) {
    statusLabels.forEach((l) => {
      l.setAttribute("content", text);
      l.setAttribute("font-color", color);
    });
  }
  function setCount(text) {
    countLabels.forEach((l) => l.setAttribute("content", text));
  }

  function clock(s) {
    const t = Math.max(0, Math.ceil(s));
    const m = Math.floor(t / 60);
    const r = t % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function paintBoards() {
    paintDiag();
    if (Date.now() < noticeUntil) {
      setBanner("BULLDOG", phase === "HUNT" ? CALL_RED : CHALK);
      setCount(noticeText);
      return;
    }
    if (phase === "HUNT") {
      const n = countOnField();
      setBanner("BULLDOG", CALL_RED);
      setCount((n >= 0 ? n + " ON THE PITCH   " : "") +
        "CAGED " + cages.length +
        (totalCaught !== cages.length ? "   CAUGHT " + totalCaught : ""));
    } else {
      setBanner("BULLDOG", CHALK);
      setCount("ENTER THE CODE TO LET THE DOGS OUT");
    }
  }

  // blackboards, one behind each home, readable from both sides
  [-112, 112].forEach((bz) => {
    [-1, 1].forEach((s) => {
      el("m-cylinder", { x: s * 7, z: bz, y: 3.4, radius: 0.4, height: 6.8, color: FRAME });
    });
    el("m-cube", { z: bz, y: 7.2, width: 16.6, height: 4.2, depth: 0.4, color: FRAME });
    el("m-cube", { z: bz, y: 7.2, width: 16, height: 3.6, depth: 0.5, color: BOARD });
    [180, 0].forEach((ry) => {
      statusLabels.push(el("m-label", {
        z: bz + (ry ? -0.3 : 0.3), y: 7.9, ry: ry,
        width: 13, height: 1.8, "font-size": 105, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "BULLDOG",
      }));
      countLabels.push(el("m-label", {
        z: bz + (ry ? -0.3 : 0.3), y: 6.4, ry: ry,
        width: 15, height: 1.1, "font-size": 44, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "",
      }));
    });
  });

  // and three hung over the middle of the pitch, so a runner looking
  // ahead sees the clock without turning round
  [-86, 0, 86].forEach((bz) => {
    el("m-cylinder", { z: bz, y: 34, radius: 0.14, height: 22, color: STEEL_DK });
    el("m-cube", { z: bz, y: 18.2, width: 15.6, height: 4.0, depth: 0.4, color: FRAME });
    el("m-cube", { z: bz, y: 18.2, width: 15, height: 3.4, depth: 0.5, color: BOARD });
    [180, 0].forEach((ry) => {
      statusLabels.push(el("m-label", {
        z: bz + (ry ? -0.3 : 0.3), y: 18.8, ry: ry,
        width: 12, height: 1.7, "font-size": 100, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "BULLDOG",
      }));
      countLabels.push(el("m-label", {
        z: bz + (ry ? -0.3 : 0.3), y: 17.4, ry: ry,
        width: 14, height: 1.0, "font-size": 40, alignment: "center",
        color: BOARD, "font-color": CHALK, content: "",
      }));
    });
  });

  // ==========================================================
  // GAME FLOW
  // ==========================================================
  // There are two states and the code is the only thing that moves
  // between them. No calls, no runs, no rounds: the dogs are either
  // out or they are not.
  function startGame(who) {
    stopGame();
    clocked = 0;                // the speed clock measures this run
    lastRunnerStep = Date.now();
    phase = "HUNT";
    hostId = who === undefined ? null : who;
    for (let i = 0; i < dogs.length; i++) wake(dogs[i]);
    paintBoards();
  }

  function stopGame() {
    phase = "STANDBY";
    clearCages();
    clearMarks();
    unflash();
    caged.clear();
    grace.clear();
    totalCaught = 0;
    hostId = null;
    foot.length = 0;
    safeZones.length = 0;
    quarry.length = 0;
    dogs.forEach((h) => { sleep(h); h.caught = 0; h.pauseUntil = 0; h.patrol = null; h.quarry = null; h.sweep = null; setHungry(h, true); });
    paintBoards();
  }

  let stopArmedUntil = 0;
  let lastStop = null;        // { at, why } - shown on the consoles

  // Everybody caged, nobody at a console: after ALL_QUIET_MS of
  // nobody running on the pitch outside a cage, every cage opens.
  every(() => {
    if (phase !== "HUNT" || !ALL_QUIET_MS || !cages.length) return;
    if (Date.now() - lastRunnerStep < ALL_QUIET_MS) return;
    const n = freeAll();
    lastRunnerStep = Date.now();
    notice("NOBODY LEFT RUNNING - " + n + " CAGES OPENED", 8000);
  }, 2000);
  function toggleGame(who) {
    if (phase === "STANDBY") { stopArmedUntil = 0; noticeUntil = 0; startGame(who); return; }
    const now = Date.now();
    if (STOP_TWICE && now > stopArmedUntil) {
      stopArmedUntil = now + 10000;
      notice("ENTER THE CODE AGAIN TO STOP", 10000);
      return;
    }
    stopArmedUntil = 0;
    noticeUntil = 0;
    lastStop = { at: now, why: "CODE" };
    stopGame();
  }

  // a message that takes over the small line on every board for a bit
  let noticeText = "", noticeUntil = 0;
  function notice(text, ms) {
    noticeText = text;
    noticeUntil = Date.now() + ms;
    paintBoards();
  }

  // --- the quick loop ---------------------------------------
  every(() => {
    const now = Date.now();
    if (flashUntil && now > flashUntil) unflash();
    grace.forEach((t, id) => { if (now > t) grace.delete(id); });
    updateMarks(now);
    paintTracking();
  }, 200);

  // --- the second hand --------------------------------------
  every(paintBoards, 1000);

  // ==========================================================
  // THE SPEED PAD
  // ----------------------------------------------------------
  // A second pad beside each keypad, separate from the code lock
  // and taking no code. Type a number of metres per second into it
  // and the dogs run at that, from the next movement tick, whether
  // they are out or still in the kennel. Patrol and walk-home pace
  // follow it by their usual shares, so the dog stays one animal.
  //
  // It is deliberately not wired to any code: nothing you type in
  // here starts, stops or changes the size of the pack.
  // ==========================================================
  function paintSpeed() {
    const text = "DOG SPEED " + HUNT_SPEED.toFixed(1);
    speedLabels.forEach((l) => l.setAttribute("content", text));
  }

  // Who may work the pad. The code is the real lock, because it works
  // whatever the runtime will tell us. This is the second one, and it
  // only bites when there is something to check against: a game
  // running, a host known, and the runtime reporting who typed. When
  // any of those is missing it stands aside rather than locking the
  // pad against everybody, which is the same call the cages make.
  function speedAllowed(who) {
    if (!SPEED_HOST_ONLY) return true;
    if (hostId === null || hostId === undefined) return true;
    if (who === null || who === undefined) return true;
    return who === hostId;
  }

  function setDogSpeed(value) {
    const v = Number(value);
    if (!isFinite(v) || v <= 0) {
      notice("SPEED PAD: TYPE A NUMBER, " + SPEED_MIN + " TO " + SPEED_MAX, 6000);
      return;
    }
    const clamped = Math.min(SPEED_MAX, Math.max(SPEED_MIN, v));
    HUNT_SPEED = clamped;
    PATROL_SPEED = HUNT_SPEED * PATROL_SHARE;
    RETURN_SPEED = HUNT_SPEED * RETURN_SHARE;
    paintSpeed();
    if (clamped !== v) {
      notice("SPEED HELD AT " + clamped.toFixed(1) + " - THE PAD STOPS AT " +
        SPEED_MIN + " AND " + SPEED_MAX, 8000);
    } else {
      notice("DOG SPEED " + clamped.toFixed(1) + " M/S", 6000);
    }
    paintDiag();
  }

  // ==========================================================
  // OPERATOR CONSOLES
  // ==========================================================
  let entry = [];
  let entryExpires = 0;

  const CODE_LEN = Math.max(CODE.length, PACK_CODE.length, CULL_CODE.length);
  function setKeyDisplay() {
    const dots = [];
    for (let i = 0; i < CODE_LEN; i++) dots.push(i < entry.length ? "*" : "-");
    const text = dots.join(" ");
    keyDisplays.forEach((l) => l.setAttribute("content", text));
  }

  const CODES = [CODE, PACK_CODE, CULL_CODE];
  function isPrefix(seq) {
    return CODES.some((c) => seq.every((d, i) => c[i] === d));
  }
  function same(a, b) { return a.length === b.length && a.every((d, i) => d === b[i]); }

  function enter(digit, who) {
    const now = Date.now();
    if (now > entryExpires) entry = [];
    entryExpires = now + CODE_TIMEOUT * 1000;
    entry.push(digit);
    while (entry.length && !isPrefix(entry)) entry.shift();
    setKeyDisplay();
    if (same(entry, CODE)) {
      entry = [];
      setKeyDisplay();
      toggleGame(who);
      return;
    }
    if (same(entry, PACK_CODE)) {
      entry = [];
      setKeyDisplay();
      changePack(1);
      return;
    }
    if (same(entry, CULL_CODE)) {
      entry = [];
      setKeyDisplay();
      changePack(-1);
    }
  }

  // One dog out, or one back in. setPack holds the ends, so the
  // codes are safe to lean on: entering PACK_CODE at MAX_HUNTERS
  // or CULL_CODE with one dog left changes nothing and says so.
  function changePack(step) {
    const was = dogs.length;
    const n = setPack(was + step);
    if (n === was) {
      notice(step > 0
        ? "THE PACK IS FULL - " + n + " DOGS"
        : "ONE DOG IS THE LAST ONE - USE THE CODE TO STOP", 6000);
    } else if (n === 1) {
      notice("DOWN TO ONE DOG", 6000);
    } else if (n === 2 && step > 0) {
      notice("A SECOND DOG IS OUT", 6000);
    } else {
      notice(n + (step > 0 ? " DOGS ON THE PITCH" : " DOGS LEFT"), 6000);
    }
    paintBoards();
  }

  function press(digit, clear, cap, who) {
    const lit = clear ? CALL_RED : WIN_GOLD;
    const dark = clear ? CALL_DIM : "#2a3530";
    cap.setAttribute("color", lit);
    later(() => cap.setAttribute("color", dark), 150);
    if (clear) {
      entry = [];
      setKeyDisplay();
    } else {
      enter(digit, who);
    }
  }

  const KEYS = [
    ["1", "2", "3"],
    ["4", "5", "6"],
    ["7", "8", "9"],
    ["C", "0", ""],
  ];

  function buildConsole(zPod, face) {
    const ry = face < 0 ? 180 : 0;

    el("m-cube", { z: zPod, y: 0.5, width: 18, height: 1, depth: 10, color: CONCRETE, collide: "true" });
    el("m-cube", { z: zPod + face * 5.6, y: 0.25, width: 18, height: 0.5, depth: 1.6, color: STEEL_DK, collide: "true" });
    el("m-cube", { z: zPod, y: 1.04, width: 18.4, height: 0.12, depth: 10.4, color: homeCol(face) });
    [-1, 1].forEach((s) => {
      el("m-cylinder", { x: s * 7.5, z: zPod - face * 3.5, y: 3, radius: 0.35, height: 6, color: STEEL_DK });
      globe({ x: s * 7.5, z: zPod - face * 3.5, y: 6.3, radius: 0.55, color: LAMP });
      el("m-light", { x: s * 7.5, z: zPod - face * 3.5, y: 6.3, type: "point", intensity: 5, color: LAMP });
    });

    const cg = document.createElement("m-group");
    cg.setAttribute("z", zPod + face);
    cg.setAttribute("y", 1);
    cg.setAttribute("ry", ry);
    arena.append(cg);

    el("m-cube", { y: 0.3, width: 2.6, height: 0.6, depth: 0.7, color: CONCRETE, collide: "true" }, cg);
    el("m-cube", { y: 2.2, width: 3.4, height: 3.3, depth: 0.2, color: BOARD, collide: "true" }, cg);
    [-1, 1].forEach((s) => {
      el("m-cube", { x: s * 1.76, y: 2.2, width: 0.16, height: 3.3, depth: 0.28, color: FRAME }, cg);
    });
    [0.55, 3.85].forEach((y) => {
      el("m-cube", { y: y, width: 3.68, height: 0.16, depth: 0.28, color: FRAME }, cg);
    });

    statusLabels.push(el("m-label", {
      y: 3.58, z: 0.12, width: 3.0, height: 0.5,
      "font-size": 40, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "BULLDOG",
    }, cg));

    keyDisplays.push(el("m-label", {
      y: 3.06, z: 0.12, width: 3.0, height: 0.46,
      "font-size": 36, alignment: "center",
      color: "#101a15", "font-color": HOME_YEL, content: "- - - -",
    }, cg));

    countLabels.push(el("m-label", {
      y: 0.34, z: 0.4, width: 3.3, height: 0.4,
      "font-size": 17, alignment: "center",
      color: BOARD, "font-color": CHALK, content: "",
    }, cg));
    diagLabels.push(el("m-label", {
      y: 0.08, z: 0.4, width: 3.3, height: 0.28,
      "font-size": 13, alignment: "center",
      color: BOARD, "font-color": STEEL, content: "",
    }, cg));

    KEYS.forEach((row, r) => {
      row.forEach((key, c) => {
        if (key === "") return;
        const clear = key === "C";
        const x = (c - 1) * 0.92;
        const y = 2.42 - r * 0.62;

        const cap = el("m-cube", {
          x: x, y: y, z: 0.2,
          width: 0.78, height: 0.5, depth: 0.24,
          color: clear ? CALL_DIM : "#2a3530",
          collide: "true",
        }, cg);

        const capFace = el("m-label", {
          z: 0.13, width: 0.74, height: 0.42,
          "font-size": 30, alignment: "center",
          color: clear ? CALL_DIM : "#2a3530",
          "font-color": clear ? CALL_RED : CHALK,
          content: key, collide: "true",
        }, cap);

        let last = 0;
        const hit = (e) => {
          const now = Date.now();
          if (now - last < 180) return;
          last = now;
          press(Number(key), clear, cap, e && e.detail ? e.detail.connectionId : undefined);
        };
        on(cap, "click", hit);
        on(capFace, "click", hit);
      });
    });

    // and the button that opens every cage, beside the keypad

    // typed entry, as a backstop for a fiddly cursor
    const promptWrap = document.createElement("m-prompt");
    promptWrap.setAttribute("message", "Operator code");
    promptWrap.setAttribute("placeholder", "4 digits");
    arena.append(promptWrap);

    const promptPad = el("m-cube", {
      z: zPod + face * 3.6, y: 1.08,
      width: 3.6, height: 0.16, depth: 1.6,
      color: BOARD, collide: "true",
    }, promptWrap);

    el("m-cube", {
      z: zPod + face * 3.6, y: 1.1,
      width: 3.9, height: 0.1, depth: 1.9, color: FRAME,
    });

    el("m-label", {
      y: 0.1, rx: -90, rz: ry,
      width: 3.4, height: 1.4,
      "font-size": 30, alignment: "center",
      color: BOARD, "font-color": CHALK,
      content: "TYPE CODE", collide: "true",
    }, promptPad);

    on(promptWrap, "prompt", (event) => {
      const d = event.detail || {};
      const typed = String(d.value || "").replace(/[^0-9]/g, "");
      entry = [];
      for (let i = 0; i < typed.length; i++) enter(Number(typed[i]), d.connectionId);
    });

    // --- and the speed pad, alongside it ---------------------
    // face*SPEED_PAD_X puts it on the same hand at both consoles,
    // because the two are approached from opposite directions.
    if (!SPEED_PAD) return;
    const SPEED_PAD_X = 4.4;
    const spx = face * SPEED_PAD_X;

    const speedWrap = document.createElement("m-prompt");
    speedWrap.setAttribute("message", "Host code, then dog speed in m/s");
    speedWrap.setAttribute("placeholder", "code + " + SPEED_MIN + "-" + SPEED_MAX);
    arena.append(speedWrap);

    const speedPad = el("m-cube", {
      x: spx, z: zPod + face * 3.6, y: 1.08,
      width: 3.6, height: 0.16, depth: 1.6,
      color: BOARD, collide: "true",
    }, speedWrap);

    el("m-cube", {
      x: spx, z: zPod + face * 3.6, y: 1.1,
      width: 3.9, height: 0.1, depth: 1.9, color: HOME_YEL_DIM,
    });

    speedLabels.push(el("m-label", {
      y: 0.1, rx: -90, rz: ry,
      width: 3.4, height: 1.4,
      "font-size": 22, alignment: "center",
      color: BOARD, "font-color": HOME_YEL,
      content: "DOG SPEED", collide: "true",
    }, speedPad));

    on(speedWrap, "prompt", (event) => {
      const d = event.detail || {};
      // Anything that is not a digit or a point is a separator, so
      // "2233 8.6", "2233-8.6" and "22338.6" are the same entry.
      const typed = String(d.value || "").replace(/[^0-9.]/g, "");
      const code = SPEED_CODE.join("");
      // No code, wrong code: nothing happens and nothing is said.
      // Somebody guessing at the pad gets silence, and the boards
      // never announce that there is a code to guess at.
      if (typed.slice(0, code.length) !== code) return;
      if (!speedAllowed(d.connectionId)) {
        notice("SPEED PAD: HOST ONLY", 6000);
        return;
      }
      const rest = typed.slice(code.length);
      if (!rest) {
        notice("SPEED PAD: CODE, THEN THE SPEED", 6000);
        return;
      }
      setDogSpeed(rest);
    });
  }

  buildConsole(CTRL_Z, -1);
  if (FINISH_CONSOLE) buildConsole(FIN_CTRL_Z, 1);

  // ==========================================================
  // GO
  // ==========================================================
  setKeyDisplay();
  paintSpeed();
  stopGame();
</script>

<script id="luster-presentation">
(function () {
  // Cosmetic finish pass only. Source meshes and all gameplay remain intact.
  const finishes = {
    "#1c2230":"#ad8436", "#11151e":"#77541f",
    "#3b414d":"#bd963f", "#a3abb2":"#e1b858",
    "#8b939b":"#d4ab4f", "#2b3034":"#8b6628",
    "#39404d":"#c29b48", "#111413":"#a47c32",
    "#6a141c":"#c69b3c", "#3d1318":"#574725",
    "#16211a":"#05060a", "#1b281f":"#080a10",
    "#141715":"#06070b", "#22302a":"#080a0e",
    "#3a3320":"#080a0e", "#6c7176":"#0b0d12",
    "#131c36":"#070a12", "#2e2410":"#100e09"
  };
  document.querySelectorAll('#arena [color]').forEach(function(n) {
    // Keep sign backgrounds, team signals and every text attribute readable.
    if(n.tagName.toLowerCase()==='m-label')return;
    const c=n.getAttribute('color');if(finishes[c])n.setAttribute('color',finishes[c]);
  });
  document.querySelectorAll('#arena m-cube').forEach(function(n) {
    const x=Math.abs(Number(n.getAttribute('x'))),y=Number(n.getAttribute('y'));
    if(Math.abs(x-46.1)<.01 && Number(n.getAttribute('width'))===1.8 && Number(n.getAttribute('height'))===.04)n.setAttribute('color','#d2a443');
    if(Math.abs(y-53.4)<.01 && Number(n.getAttribute('width'))===132)n.setAttribute('color','#dfb655');
  });
  document.querySelectorAll('#luster-decoration m-cube').forEach(function(n) {
    const c=n.getAttribute('color');
    if(c==='#29232a')n.setAttribute('color','#a77b2b');
    if(c==='#786345')n.setAttribute('color','#c29b48');
  });
  document.querySelectorAll('m-light').forEach(function(n) {
    const i=Number(n.getAttribute('intensity'));if(i>1)n.setAttribute('intensity',1);
  });
})();
</script>
