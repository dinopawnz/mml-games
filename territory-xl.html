<!--
  TERRITORY XL  -  five teams, three levels, built for a crowd
  (grown from TERRITORY v12)

  Same game: every square you stand on turns your colour and stays
  yours until somebody takes it back. Most squares at the horn wins.
  Operator types 1 7 1 8 at the console to start or abort a round.

  WHAT CHANGED FROM v12

  SIZE. The court is 300 x 300 instead of 120 x 120 - six and a
  quarter times the floor. Everything else is scaled to match:
    FLOOR   y 0    300 x 300 of 6m squares
    RING    y 8    a square loop, 36m wide, out at radius 78..114
    CROWN   y 16   an 84 x 84 platform dead centre
  Walls are 36m, the hang floats at 52m, the lobby is 56m deep.

  FIVE TEAMS. RED, YELLOW, GREEN, BLUE, PINK. Five arches, five bays,
  five doors, five columns on every scoreboard, five lanes in lane
  mode. Every loop in the file runs off TEAMS.length, so adding or
  dropping a team is a one-line change (keep FIELD / teams sensible
  for bay width). The clock and status colours on the boards no
  longer borrow team colours - the timer is white and turns orange
  in the last fifteen seconds - so the only colours on a scoreboard
  that mean a team ARE a team.

  ROOM FOR 100+.
    - eight floor->ring ramps instead of four, two at every corner,
      each 24m wide instead of 12
    - ring->crown ramps 14m wide instead of 10
    - team doors 20m wide instead of 14
    - each bay is 60 x 40m, and the STAND HERE slab spans almost
      the whole bay, so twenty-five people can enrol at once just
      by walking out
    - three ring ribbons per side instead of one (twelve signs,
      twenty-four lit faces), plus a board on every wall and the
      four-sided hang

  PERFORMANCE. About 3,400 paintable squares (v12 had ~1,100).
  Shadows are off on every light by default (SHADOWS below) - fifty
  shadow-casting point lights with a hundred people in the room is
  the fastest way to a slideshow. If a full house still chugs:
    PAD_MS    raise to 150-200 - fewer paint events per player,
              barely noticeable in play
    CELL      must divide every dimension marked "multiple of CELL"
              below. 6 is the tested value; 3 works but is 4x the
              squares. A warning is logged if the grid goes out of
              line.

  Nothing in this document caps player count. How many people can
  actually connect is set by whatever world or host is serving it.

  TUNING
    ROUND_S   240 (was 180 - the map is much further to run)
    JUMBO_Y, JUMBO_BODY, JUMBO_W, JUMBO_H   the hang
    BOARD_W, BOARD_H, BOARD_Y               the wall boards
    RIBBON_AT                               where the ring signs hang
    TIERS                                   the two terrace steps
-->

<m-group id="arena"></m-group>
<m-group id="floor"></m-group>

<script>
  // ==========================================================
  // TUNING
  // ==========================================================
  const ROUND_S = 240;
  const ARM_DELAY = 10;
  const CODE = [1, 7, 1, 8];
  const CODE_TIMEOUT = 15;

  const FIELD = 300;          // HALF (150) must be a multiple of CELL
  const CELL = 6;
  const PAD_MS = 90;

  const OUT = FIELD / 2 + 10; // outer wall half-extent
  const WALL_H = 36;

  const L2_Y = 8;             // the ring
  const L3_Y = 16;            // the crown
  const RING_IN = 78;         // multiple of CELL
  const RING_OUT = 114;       // multiple of CELL
  const CROWN_HALF = 42;      // multiple of CELL

  const RAMP_W = 24;          // floor -> ring; half of it a multiple of CELL
  const XRAMP_W = 14;         // ring -> crown
  const RAMP_T = 0.7;
  const RAMP_NOHEAD = 18;     // squares under the low end of a ramp are
                              // not created; multiple of CELL

  const LOBBY_D = 56;
  const CORRIDOR_D = 16;
  const DOOR_W = 20;
  const DOOR_H = 14;
  const GATE_H = DOOR_H;
  const ARCH_W = 18;
  const ARCH_H = 14;

  const IDENTITY_GRACE_MS = 6000;

  const LIGHT = 0.05;
  const SHADOWS = false;
  const WALL = "#150d2e";
  const STONE = "#241a4d";
  const DARK = "#0e0922";
  const GOLD = "#e8c547";
  const INK = "#e8e2ff";
  const GLASS = "#9fe8ff";
  const CLOCK = INK;          // the running clock and STANDBY
  const ALERT = "#ffb84e";    // countdown and the last fifteen seconds

  const BARE = ["#2b2154", "#342a63", "#3d3372"];

  const TEAMS = [
    { name: "RED",    lit: "#ff3b52", dim: "#5c1220" },
    { name: "YELLOW", lit: "#ffd23b", dim: "#5c4a10" },
    { name: "GREEN",  lit: "#3bff8a", dim: "#0f4a2a" },
    { name: "BLUE",   lit: "#3ba8ff", dim: "#10344c" },
    { name: "PINK",   lit: "#ff5ee0", dim: "#551a4c" },
  ];
  const NT = TEAMS.length;

  // ==========================================================
  // PLUMBING
  // ==========================================================
  const arena = document.getElementById("arena") || (() => {
    const g = document.createElement("m-group");
    g.setAttribute("id", "arena");
    (document.body || document.documentElement).appendChild(g);
    return g;
  })();
  const floorRoot = document.getElementById("floor") || (() => {
    const g = document.createElement("m-group");
    g.setAttribute("id", "floor");
    (document.body || document.documentElement).appendChild(g);
    return g;
  })();

  function el(tag, attrs, parent) {
    const node = document.createElement(tag);
    node.setAttribute("collide", "false");
    if (tag === "m-light" && !("cast-shadows" in attrs)) {
      node.setAttribute("cast-shadows", SHADOWS ? "true" : "false");
    }
    for (const key in attrs) {
      let v = attrs[key];
      if (tag === "m-light" && key === "intensity") v = Math.round(v * LIGHT * 10) / 10;
      node.setAttribute(key, v);
    }
    (parent || arena).append(node);
    return node;
  }
  function group(attrs, parent) {
    const g = document.createElement("m-group");
    for (const k in attrs) g.setAttribute(k, attrs[k]);
    (parent || arena).append(g);
    return g;
  }

  // ==========================================================
  // TYPE SIZE  -  the biggest this text can be and still fit
  // ==========================================================
  // Glyphs run about font-size/100 metres tall and advance about 0.55
  // of that, so a box w x h holding n characters is bounded by its
  // height (a fifth held back for ascenders/descenders) and by its
  // width across the LONGEST thing it will ever say, held back a
  // further tenth. cap is a ceiling, not a size.
  const FS_SAFE = 0.9;
  function fitFS(w, h, chars, cap) {
    const byHeight = h * 80;
    const byWidth = ((w * 100) / (chars * 0.55)) * FS_SAFE;
    return Math.round(Math.min(cap === undefined ? Infinity : cap, byHeight, byWidth));
  }

  const HALF = FIELD / 2;
  const COLS = Math.round(FIELD / CELL);
  const CW = FIELD / COLS;
  const mx = (x, z) => Math.max(Math.abs(x), Math.abs(z));
  const RING_MID = (RING_IN + RING_OUT) / 2;
  const RING_T = RING_OUT - RING_IN;

  // Legs, ramp edges and deck edges all sit on grid lines, so nothing
  // ever pokes up through the middle of a square. If a tweak breaks
  // that, say so rather than leave it to be found in play.
  [["HALF", HALF], ["RING_IN", RING_IN], ["RING_OUT", RING_OUT],
   ["CROWN_HALF", CROWN_HALF], ["RING_MID", RING_MID],
   ["RAMP_W/2", RAMP_W / 2], ["RAMP_NOHEAD", RAMP_NOHEAD]].forEach(([n, v]) => {
    if (v % CELL) console.warn("TERRITORY: " + n + " (" + v + ") is not a multiple of CELL (" + CELL + ")");
  });

  const BAY_W = FIELD / NT;
  const bayX = (i) => -HALF + BAY_W / 2 + i * BAY_W;
  const LOBBY_BACK = -(OUT + LOBBY_D);
  const BAY_FRONT = -OUT;
  const BAY_REAR = LOBBY_BACK + CORRIDOR_D;
  const BAY_Z = (BAY_FRONT + BAY_REAR) / 2;
  const BAY_DEPTH = BAY_FRONT - BAY_REAR;

  // ==========================================================
  // BASE SLABS
  // ==========================================================
  el("m-cube", {
    y: -1.82, width: OUT * 2 + 16, height: 4, depth: OUT * 2 + 16,
    color: DARK, collide: "true",
  });
  el("m-cube", {
    z: -(OUT + LOBBY_D / 2), y: -1.82, width: FIELD + 24, height: 4, depth: LOBBY_D + 8,
    color: DARK, collide: "true",
  });
  el("m-cube", {
    z: LOBBY_BACK - 20, y: -1.82, width: FIELD + 60, height: 4, depth: 40,
    color: "#0b0720", collide: "true",
  });

  // ==========================================================
  // OUTER WALL
  // ==========================================================
  // Built as solid spans with the doorways cut out; all dressing hangs
  // off the same spans. Local frame: +x along the wall, +z inward.
  const PILASTER_STEP = 30;     // ribs at +-15, +-45 ... so they fall
                                // between the team panels, not across them
  const BASE_H = 4;
  const RIBBON_Y = 10;
  const CORNICE_Y = WALL_H - 3;
  const PANEL_STEP = 60, PANEL_W = 26, PANEL_H = 18, PANEL_Y = 22;

  function wallSide(sx, sz, ry, openings) {
    const g = group({ x: sx * OUT, z: sz * OUT, ry: ry });
    const list = (openings || []).slice().sort((a, b) => a.c - b.c);
    const spans = [];
    let cursor = -OUT;

    const solid = (a, b) => {
      if (b - a < 0.05) return;
      spans.push([a, b]);
      const w = b - a, cx = (a + b) / 2;
      el("m-cube", {
        x: cx, y: WALL_H / 2, width: w,
        height: WALL_H, depth: 2.4, color: WALL, collide: "true",
      }, g);
      el("m-cube", {
        x: cx, z: 1.55, y: BASE_H / 2, width: w,
        height: BASE_H, depth: 1.1, color: STONE, collide: "true",
      }, g);
      el("m-cube", {
        x: cx, z: 1.62, y: BASE_H + 0.14, width: w,
        height: 0.28, depth: 1.3, color: GOLD, opacity: 0.75,
      }, g);
      el("m-cube", {
        x: cx, z: 1.35, y: RIBBON_Y, width: w,
        height: 0.6, depth: 0.35, color: "#6f5ac4", opacity: 0.9,
      }, g);
      el("m-cube", {
        x: cx, z: 1.5, y: CORNICE_Y, width: w,
        height: 1.0, depth: 1.0, color: GOLD, opacity: 0.55,
      }, g);
      el("m-cube", {
        x: cx, z: 0.3, y: WALL_H + 0.45, width: w,
        height: 0.9, depth: 3.4, color: STONE,
      }, g);
    };

    list.forEach((o) => {
      solid(cursor, o.c - o.w / 2);
      el("m-cube", {
        x: o.c, y: (DOOR_H + WALL_H) / 2, width: o.w,
        height: WALL_H - DOOR_H, depth: 2.4, color: WALL, collide: "true",
      }, g);
      [-1, 1].forEach((e) => {
        el("m-cylinder", {
          x: o.c + e * (o.w / 2 + 0.7), y: DOOR_H / 2,
          radius: 0.62, height: DOOR_H + 1.4, color: o.color || GOLD,
        }, g);
      });
      el("m-cube", {
        x: o.c, y: DOOR_H + 0.9, width: o.w + 3, height: 1.5, depth: 3,
        color: o.color || GOLD,
      }, g);
      el("m-cube", {
        x: o.c, z: 1.35, y: DOOR_H + 2.4, width: o.w + 3,
        height: 0.6, depth: 0.35, color: o.color || GOLD, opacity: 0.9,
      }, g);
      el("m-cube", {
        x: o.c, z: 1.5, y: CORNICE_Y, width: o.w + 3,
        height: 1.0, depth: 1.0, color: GOLD, opacity: 0.55,
      }, g);
      el("m-cube", {
        x: o.c, z: 0.3, y: WALL_H + 0.45, width: o.w + 3,
        height: 0.9, depth: 3.4, color: STONE,
      }, g);
      el("m-light", {
        x: o.c, y: DOOR_H + 4, type: "point", intensity: 18, color: o.color || GOLD,
      }, g);
      cursor = o.c + o.w / 2;
    });

    solid(cursor, OUT);

    const inSpan = (x, pad) => spans.some(([a, b]) => x > a + pad && x < b - pad);

    for (let x = PILASTER_STEP / 2; x < OUT - 3; x += PILASTER_STEP) {
      [-x, x].forEach((px) => {
        if (!inSpan(px, 1.6)) return;
        el("m-cube", {
          x: px, z: 1.75, y: WALL_H / 2, width: 1.9,
          height: WALL_H, depth: 1.5, color: STONE, collide: "true",
        }, g);
        el("m-cube", {
          x: px, z: 1.85, y: WALL_H - 1.3, width: 2.3,
          height: 0.6, depth: 1.8, color: GOLD, opacity: 0.7,
        }, g);
      });
    }
    [-90, 90].forEach((x) => {
      if (!inSpan(x, 1.6)) return;
      el("m-light", {
        x: x, z: 5, y: WALL_H - 6, type: "point",
        intensity: 18, color: "#8f7bd8",
      }, g);
    });

    // team panels, one per colour along each solid wall
    for (let i = -2; i <= 2; i++) {
      const px = i * PANEL_STEP;
      if (!inSpan(px, PANEL_W / 2 + 1)) continue;
      const col = TEAMS[((i + 2) % NT + NT) % NT].lit;
      el("m-cube", {
        x: px, z: 1.15, y: PANEL_Y, width: PANEL_W + 1.4, height: PANEL_H + 1.4, depth: 0.3,
        color: DARK,
      }, g);
      el("m-cube", {
        x: px, z: 1.34, y: PANEL_Y, width: PANEL_W, height: PANEL_H, depth: 0.3,
        color: col, opacity: 0.35,
      }, g);
      [-1, 1].forEach((ex) => el("m-cube", {
        x: px + ex * (PANEL_W / 2 + 0.5), z: 1.4, y: PANEL_Y, width: 0.45,
        height: PANEL_H + 1.4, depth: 0.5, color: col, opacity: 0.8,
      }, g));
      [-1, 1].forEach((ey) => el("m-cube", {
        x: px, z: 1.4, y: PANEL_Y + ey * (PANEL_H / 2 + 0.7), width: PANEL_W + 1.4,
        height: 0.45, depth: 0.5, color: col, opacity: 0.8,
      }, g));
    }
  }

  const DOOR_LIST = TEAMS.map((t, i) => ({ c: bayX(i), w: DOOR_W, color: t.lit }));
  wallSide(0, -1, 0, DOOR_LIST);
  wallSide(0, 1, 180, []);
  wallSide(-1, 0, 90, []);
  wallSide(1, 0, -90, []);

  [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz]) => {
    el("m-cube", {
      x: sx * OUT, z: sz * OUT, y: WALL_H / 2,
      width: 6, height: WALL_H, depth: 6, color: STONE, collide: "true",
    });
    el("m-cube", {
      x: sx * OUT, z: sz * OUT, y: WALL_H + 0.9,
      width: 7.4, height: 1.8, depth: 7.4, color: WALL,
    });
    el("m-cube", {
      x: sx * OUT, z: sz * OUT, y: CORNICE_Y,
      width: 6.8, height: 1.0, depth: 6.8, color: GOLD, opacity: 0.55,
    });
  });

  // ==========================================================
  // THE BOWL
  // ==========================================================
  const COURT = HALF + 0.9;
  const WALL_FACE = OUT - 1.2;
  const TIERS = [
    { from: COURT + 0.6, to: COURT + 4.6, y: 1.05 },
    { from: COURT + 4.6, to: WALL_FACE,   y: 2.15 },
  ];
  const bowlGaps = DOOR_LIST.map((o) => [o.c - o.w / 2 - 1.6, o.c + o.w / 2 + 1.6]);

  function tierRun(ry, lift, gaps) {
    const g = group({ ry: ry });
    TIERS.forEach((t, ti) => {
      const mid = (t.from + t.to) / 2, depth = t.to - t.from;
      const y = t.y + lift;
      const cuts = (gaps || []).slice().sort((a, b) => a[0] - b[0]);
      let cursor = -t.to;
      const run = (a, b) => {
        if (b - a < 0.4) return;
        el("m-cube", {
          x: (a + b) / 2, z: -mid, y: y / 2, width: b - a,
          height: y, depth: depth, color: ti ? STONE : "#1c1440", collide: "true",
        }, g);
        if (b - a > 4) el("m-cube", {
          x: (a + b) / 2, z: -(t.from + 0.14), y: y - 0.07,
          width: Math.min(b - a, t.from * 2 - 3), height: 0.14, depth: 0.28,
          color: GOLD, opacity: 0.5,
        }, g);
      };
      cuts.forEach((c) => { run(cursor, c[0]); cursor = c[1]; });
      run(cursor, t.to);
    });
  }
  tierRun(0, 0, bowlGaps);
  tierRun(180, 0, []);
  tierRun(90, 0.03, []);
  tierRun(-90, 0.03, []);

  [-1, 1].forEach((s) => {
    el("m-cube", { z: s * COURT, y: 0.25, width: COURT * 2 + 0.6,
      height: 0.14, depth: 0.6, color: GOLD, opacity: 0.85 });
    el("m-cube", { x: s * COURT, y: 0.25, width: 0.6,
      height: 0.14, depth: COURT * 2 + 0.6, color: GOLD, opacity: 0.85 });
  });

  // ==========================================================
  // FLOOR -> RING RAMPS  (laid out first; the squares need them)
  // ==========================================================
  // Two per side, one near each end, each climbing along the ring's
  // own midline from the edge of the court to the outer edge of the
  // ring. Eight in all: every corner of the map has two within a few
  // seconds' run, and none of them sit in front of a team door.
  //
  // (nx, nz) is the side's outward normal. ry turns local +x uphill;
  // mry turns the UP marker to face the middle of the floor.
  const RAMP_RUN = HALF - RING_OUT;
  const RAMP_SIDES = [
    { nx: 0,  nz: -1, ry: -90, mry: 0 },
    { nx: 0,  nz: 1,  ry: 90,  mry: 180 },
    { nx: -1, nz: 0,  ry: 0,   mry: 90 },
    { nx: 1,  nz: 0,  ry: 180, mry: -90 },
  ];
  const FLOOR_RAMPS = [];
  const RAMP_BLOCK = [];
  RAMP_SIDES.forEach((s) => {
    [-1, 1].forEach((a) => {
      const along = a * RING_MID;
      const across = (HALF + RING_OUT) / 2;
      const tanX = s.nx === 0;
      const r = {
        cx: tanX ? along : s.nx * across,
        cz: tanX ? s.nz * across : along,
        ry: s.ry, mry: s.mry,
        // marker: inboard edge of the slab, near the foot
        mx: tanX ? a * (RING_MID - RAMP_W / 2 - 2.5) : s.nx * (HALF - 3),
        mz: tanX ? s.nz * (HALF - 3) : a * (RING_MID - RAMP_W / 2 - 2.5),
      };
      FLOOR_RAMPS.push(r);
      // the low stretch with no headroom under it
      const t0 = along - RAMP_W / 2, t1 = along + RAMP_W / 2;
      const n = tanX ? s.nz : s.nx;
      const n0 = Math.min(n * HALF, n * (HALF - RAMP_NOHEAD));
      const n1 = Math.max(n * HALF, n * (HALF - RAMP_NOHEAD));
      RAMP_BLOCK.push(tanX
        ? { x0: t0, x1: t1, z0: n0, z1: n1 }
        : { x0: n0, x1: n1, z0: t0, z1: t1 });
    });
  });
  const blocked = (x, z) =>
    RAMP_BLOCK.some((b) => x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1);

  // ==========================================================
  // PAINTABLE SQUARES
  // ==========================================================
  const cells = [];

  function square(x, y, z, size, lane, level) {
    const bare = BARE[level];
    const pad = el("m-cube", {
      x: x, y: y + 0.18, z: z,
      width: size - 0.3, height: 0.36, depth: size - 0.3,
      color: bare, collide: "true", "collision-interval": PAD_MS,
    }, floorRoot);
    const idx = cells.length;
    cells.push({ el: pad, owner: -1, bare: bare, lane: lane });
    const onHit = (e) => paint(idx, e);
    pad.addEventListener("collisionstart", onHit);
    pad.addEventListener("collisionmove", onHit);
    return pad;
  }

  const laneOf = (x) => Math.min(NT - 1,
    Math.max(0, Math.floor(((x + HALF) / FIELD) * NT)));

  const onRing = (x, z) => mx(x, z) >= RING_IN && mx(x, z) <= RING_OUT;
  const onCrown = (x, z) => Math.abs(x) <= CROWN_HALF && Math.abs(z) <= CROWN_HALF;

  for (let r = 0; r < COLS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = -HALF + CW / 2 + c * CW;
      const z = -HALF + CW / 2 + r * CW;
      if (!blocked(x, z)) square(x, 0, z, CW, laneOf(x), 0);
      if (onRing(x, z)) square(x, L2_Y, z, CW, laneOf(x), 1);
      if (onCrown(x, z)) square(x, L3_Y, z, CW, laneOf(x), 2);
    }
  }

  // ==========================================================
  // RING AND CROWN
  // ==========================================================
  function deckSlab(x, z, w, d, y) {
    el("m-cube", {
      x: x, z: z, y: y - 0.3, width: w, height: 0.6, depth: d,
      color: "#1b1440", opacity: 0.55, collide: "true",
    });
  }
  [-1, 1].forEach((s) => {
    deckSlab(0, s * RING_MID, RING_OUT * 2, RING_T, L2_Y);
    deckSlab(s * RING_MID, 0, RING_T, RING_IN * 2, L2_Y);
  });
  deckSlab(0, 0, CROWN_HALF * 2, CROWN_HALF * 2, L3_Y);

  function kerb(x, z, w, d, y) {
    el("m-cube", { x: x, z: z, y: y + 0.44, width: w, height: 0.16, depth: d, color: GOLD });
  }
  [-1, 1].forEach((s) => {
    kerb(0, s * RING_OUT, RING_OUT * 2, 0.5, L2_Y);
    kerb(s * RING_OUT, 0, 0.5, RING_OUT * 2, L2_Y);
    kerb(0, s * RING_IN, RING_IN * 2, 0.5, L2_Y);
    kerb(s * RING_IN, 0, 0.5, RING_IN * 2, L2_Y);
    kerb(0, s * CROWN_HALF, CROWN_HALF * 2, 0.5, L3_Y);
    kerb(s * CROWN_HALF, 0, 0.5, CROWN_HALF * 2, L3_Y);
  });

  // Corner legs only, on grid corners - nothing stands in front of a
  // ring sign.
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    el("m-cylinder", {
      x: sx * RING_MID, z: sz * RING_MID, y: (L2_Y - 0.6) / 2, radius: 1.0,
      height: L2_Y - 0.6, color: "#2a1f5c", collide: "true",
    });
    const cl = CROWN_HALF - 12;
    el("m-cylinder", {
      x: sx * cl, z: sz * cl, y: (L3_Y - 0.6) / 2, radius: 1.2,
      height: L3_Y - 0.6, color: "#2a1f5c", collide: "true",
    });
  });

  [-64, 0, 64].forEach((a) => {
    [-1, 1].forEach((s) => {
      el("m-light", { x: a, z: s * RING_MID, y: L2_Y - 1.4, type: "point",
        intensity: 10, color: "#7f6bd0" });
      el("m-light", { x: s * RING_MID, z: a, y: L2_Y - 1.4, type: "point",
        intensity: 10, color: "#7f6bd0" });
    });
  });
  el("m-light", { y: L3_Y - 1.6, type: "point", intensity: 24, color: "#a76bff" });

  // ==========================================================
  // RAMPS
  // ==========================================================
  function ramp(cx, cz, ry, fromY, toY, run, width) {
    const rise = toY - fromY;
    const deg = Math.atan2(rise, run) * 180 / Math.PI;
    const len = Math.hypot(run, rise);
    const sink = (RAMP_T / 2) / Math.cos(deg * Math.PI / 180);
    const g = group({ x: cx, z: cz, y: (fromY + toY) / 2 + 0.36 - sink, ry: ry });
    el("m-cube", {
      rz: deg, width: len, height: RAMP_T, depth: width,
      color: STONE, collide: "true",
    }, g);
    [-1, 1].forEach((e) => {
      el("m-cube", {
        rz: deg, y: 0.45, z: e * (width / 2 - 0.25),
        width: len, height: 0.16, depth: 0.5, color: GOLD, opacity: 0.85,
      }, g);
    });
    return g;
  }

  FLOOR_RAMPS.forEach((r) => {
    ramp(r.cx, r.cz, r.ry, 0, L2_Y, RAMP_RUN, RAMP_W);
    el("m-cylinder", { x: r.mx, z: r.mz, y: 4, radius: 0.5, height: 8, color: "#2a1f5c" });
    el("m-sphere", { x: r.mx, z: r.mz, y: 8.5, radius: 0.9, color: "#a76bff" });
    el("m-light", { x: r.mx, z: r.mz, y: 8.5, type: "point", intensity: 14, color: "#a76bff" });
    el("m-label", {
      x: r.mx, z: r.mz, y: 11.2, ry: r.mry, width: 14, height: 2.4,
      "font-size": fitFS(14, 2.4, 2),
      alignment: "center", color: WALL, "font-color": GOLD, content: "UP",
    });
  });

  // RING -> CROWN on the diagonals, an X over the open middle
  const XRUN = Math.hypot(RING_IN - CROWN_HALF, RING_IN - CROWN_HALF);
  const XMID = (RING_IN + CROWN_HALF) / 2;
  [[-XMID, -XMID, -45], [XMID, -XMID, -135],
   [ XMID,  XMID, 135], [-XMID,  XMID,  45]].forEach(([px, pz, ry]) => {
    ramp(px, pz, ry, L2_Y, L3_Y, XRUN, XRAMP_W);
  });

  // ==========================================================
  // LOBBY
  // ==========================================================
  const gates = [];
  const penLabels = [];

  (function backWall() {
    const g = group({ z: LOBBY_BACK });
    const H = WALL_H - 6;
    const edge = FIELD / 2 + 12;
    let cursor = -edge;

    const solid = (a, b) => {
      if (b - a < 0.05) return;
      el("m-cube", {
        x: (a + b) / 2, y: H / 2, width: b - a, height: H, depth: 2,
        color: WALL, collide: "true",
      }, g);
    };

    TEAMS.forEach((t, i) => {
      const c = bayX(i);
      solid(cursor, c - ARCH_W / 2);
      el("m-cube", {
        x: c, y: (ARCH_H + H) / 2, width: ARCH_W, height: H - ARCH_H, depth: 2,
        color: WALL, collide: "true",
      }, g);
      [-1, 1].forEach((e) => el("m-cylinder", {
        x: c + e * (ARCH_W / 2 + 0.7), y: ARCH_H / 2,
        radius: 0.62, height: ARCH_H + 1.4, color: t.lit,
      }, g));
      el("m-cube", {
        x: c, y: ARCH_H + 0.9, width: ARCH_W + 3, height: 1.5, depth: 2.6, color: t.lit,
      }, g);
      [[-1.6, 180], [1.6, 0]].forEach(([lz, lry]) => el("m-label", {
        x: c, z: lz, y: ARCH_H + 3.6, ry: lry,
        width: ARCH_W + 2, height: 3,
        "font-size": fitFS(ARCH_W + 2, 3, 6), alignment: "center",
        color: "#0d0d14", "font-color": t.lit, content: t.name,
      }, g));
      el("m-light", {
        x: c, z: -3, y: ARCH_H + 2, type: "point", intensity: 18, color: t.lit,
      }, g);
      cursor = c + ARCH_W / 2;
    });
    solid(cursor, edge);

    // above the arch names, below the board that stands on the wall
    el("m-label", {
      z: -1.6, y: 22.5, ry: 180, width: 90, height: 5,
      "font-size": fitFS(90, 5, 9),
      alignment: "center", color: "#0d0d14", "font-color": GOLD, content: "TERRITORY",
    }, g);
  })();

  [-1, 1].forEach((s) => {
    el("m-cube", {
      x: s * (FIELD / 2 + 11), z: -(OUT + LOBBY_D / 2), y: (WALL_H - 6) / 2,
      width: 2, height: WALL_H - 6, depth: LOBBY_D + 2, color: WALL, collide: "true",
    });
  });

  TEAMS.forEach((team, ti) => {
    const cx = bayX(ti);

    el("m-cube", {
      x: cx, z: BAY_Z, y: 0.20, width: BAY_W - 1, height: 0.04,
      depth: BAY_DEPTH, color: team.dim,
    });
    el("m-light", { x: cx, z: BAY_Z, y: 11, type: "point", intensity: 22, color: team.lit });

    // glass between bays stops short of the corridor
    [-1, 1].forEach((s) => {
      el("m-cube", {
        x: cx + s * (BAY_W / 2), z: BAY_Z, y: 3.5,
        width: 0.3, height: 7, depth: BAY_DEPTH,
        color: GLASS, opacity: 0.13, collide: "true",
      });
      el("m-cube", {
        x: cx + s * (BAY_W / 2), z: BAY_Z, y: 7.1,
        width: 0.55, height: 0.2, depth: BAY_DEPTH, color: GOLD,
      });
    });

    // the plinth - click to join
    const pz = BAY_REAR + 7;
    el("m-cube", { x: cx, z: pz, y: 0.68, width: 8, height: 1, depth: 4.5,
      color: STONE, collide: "true" });
    const cap = el("m-cube", { x: cx, z: pz, y: 1.98, width: 6.6, height: 1.6, depth: 3.2,
      color: team.lit, collide: "true" });
    const capLabel = el("m-label", {
      z: 1.65, width: 6, height: 1.1,
      "font-size": fitFS(6, 1.1, 6), alignment: "center",
      color: team.lit, "font-color": "#0d0d14", content: team.name, collide: "true",
    }, cap);
    let last = 0;
    const join = (event) => {
      const now = Date.now();
      if (now - last < 250) return;
      last = now;
      enrol(ti, event);
      cap.setAttribute("color", "#ffffff");
      setTimeout(() => cap.setAttribute("color", team.lit), 160);
    };
    cap.addEventListener("click", join);
    capLabel.addEventListener("click", join);

    // the STAND HERE slab - walk across it and you are on the team.
    // Nearly the full width of the bay and eight metres deep, so a
    // whole team can cross it at once. Per-player, no shared debounce.
    const standZ = pz + 7;
    const stand = el("m-cube", {
      x: cx, z: standZ, y: 0.17, width: BAY_W - 3.5, height: 0.14,
      depth: 8, color: team.dim, collide: "true", "collision-interval": PAD_MS,
    });
    el("m-cube", {
      x: cx, z: standZ, y: 0.255, width: BAY_W - 5, height: 0.03,
      depth: 6.4, color: team.lit,
    });
    el("m-label", {
      x: cx, z: standZ, y: 0.28, rx: -90,
      width: BAY_W - 8, height: 4,
      "font-size": fitFS(BAY_W - 8, 4, 10, 260), alignment: "center",
      color: team.lit, "font-color": "#0d0d14", content: "STAND HERE",
    });
    const step = (event) => {
      const d = event && event.detail;
      const id = d ? d.connectionId : undefined;
      if (typeof id !== "number") return;
      if (roster.get(id) === ti) return;
      enrol(ti, event);
      stand.setAttribute("color", "#ffffff");
      setTimeout(() => stand.setAttribute("color", team.dim), 220);
    };
    stand.addEventListener("collisionstart", step);
    stand.addEventListener("collisionmove", step);
    cap.setAttribute("collision-interval", PAD_MS);
    cap.addEventListener("collisionstart", step);

    penLabels.push(el("m-label", {
      x: cx, z: pz + 2, y: 10, width: BAY_W - 8, height: 3,
      "font-size": fitFS(BAY_W - 8, 3, 11),
      alignment: "center", color: "#0d0d14", "font-color": team.lit,
      content: team.name + " - 0",
    }));

    // the gated door onto the floor
    const g = group({ x: cx, z: -(OUT + 1), y: 0 });
    el("m-cube", {
      y: GATE_H / 2, width: DOOR_W - 0.6, height: GATE_H, depth: 0.4,
      color: team.lit, opacity: 0.2, collide: "true",
    }, g);
    const BARS = 8;
    for (let b = 0; b <= BARS; b++) {
      el("m-cylinder", {
        x: -(DOOR_W - 0.6) / 2 + b * (DOOR_W - 0.6) / BARS, y: GATE_H / 2,
        radius: 0.16, height: GATE_H, color: GOLD, opacity: 0.85,
      }, g);
    }
    gates.push(g);
  });

  function setGates(open) {
    gates.forEach((g) => g.setAttribute("y", open ? -(GATE_H + 6) : 0));
  }

  // ==========================================================
  // BOARDS
  // ==========================================================
  const bannerLabels = [], modeLabels = [], barSegs = [], pctRows = [];

  //   banner  "STANDBY" 7, a clock 4, "DRAWN" 5, "YELLOW WINS" 11
  //   mode    the longest is "TEAM MODE - ANY SQUARE, ANY LEVEL" 33
  const BANNER_CHARS = 11;
  const MODE_CHARS = 33;

  const SCORE_FS = 200;         // ceilings, scaled by panel height
  const SCORE_CAP_FS = 160;
  const SCORE_FS_RIB = 120;

  // One display surface; every piece is a fraction of the panel, and
  // every face registers its labels so setBanner / setMode / refresh
  // drive all of them. Columns are laid out for however many teams
  // there are.
  function boardFace(parent, W, H, opts) {
    const o = opts || {};
    const ribbon = !!o.ribbon;
    const k = H / 10;
    const g = group({
      x: o.x || 0, y: o.y || 0, z: o.z || 0,
      ry: o.ry || 0, rx: o.rx || 0,
    }, parent);

    el("m-cube", { width: W + 1.1, height: H + 1.1, depth: 0.45, color: STONE }, g);
    el("m-cube", { z: 0.12, width: W + 0.5, height: H + 0.5, depth: 0.4, color: GOLD, opacity: 0.5 }, g);
    el("m-cube", { z: 0.26, width: W, height: H, depth: 0.35, color: "#0d0d14" }, g);

    if (ribbon) {
      const bh = H * 0.34, sh = H * 0.46;
      const pitch = 0.96 / NT, cw = W * (pitch - 0.01);
      bannerLabels.push(el("m-label", {
        z: 0.5, y: H * 0.29, width: W * 0.9, height: bh,
        "font-size": fitFS(W * 0.9, bh, BANNER_CHARS),
        alignment: "center", color: "#0d0d14", "font-color": CLOCK, content: "STANDBY",
      }, g));
      const strip = [];
      TEAMS.forEach((t, i) => {
        strip.push(el("m-label", {
          z: 0.5, x: (i - (NT - 1) / 2) * W * pitch, y: -H * 0.23,
          width: cw, height: sh,
          "font-size": fitFS(cw, sh, 11, SCORE_FS_RIB),
          alignment: "center", color: "#0d0d14", "font-color": t.lit,
          content: t.name + " 0%",
        }, g));
      });
      pctRows.push({ labels: strip, withName: true });
      return g;
    }

    bannerLabels.push(el("m-label", {
      z: 0.5, y: H * 0.33, width: W * 0.875, height: H * 0.24,
      "font-size": fitFS(W * 0.875, H * 0.24, BANNER_CHARS),
      alignment: "center", color: "#0d0d14", "font-color": CLOCK, content: "STANDBY",
    }, g));
    // one column per team, name over number, in its own colour, on
    // the same centres as the bar segments underneath
    const pitch = 0.9 / NT, cw = W * (pitch - 0.01);
    const col = [];
    TEAMS.forEach((t, i) => {
      const cx = (i - (NT - 1) / 2) * W * pitch;
      el("m-label", {
        z: 0.5, x: cx, y: H * 0.115, width: cw, height: H * 0.16,
        "font-size": fitFS(cw, H * 0.16, 7, SCORE_CAP_FS * k), alignment: "center",
        color: "#0d0d14", "font-color": t.lit, content: t.name,
      }, g);
      col.push(el("m-label", {
        z: 0.5, x: cx, y: -H * 0.09, width: cw, height: H * 0.22,
        "font-size": fitFS(cw, H * 0.22, 4, SCORE_FS * k), alignment: "center",
        color: "#0d0d14", "font-color": t.lit, content: "0%",
      }, g));
    });
    pctRows.push({ labels: col, withName: false });
    modeLabels.push(el("m-label", {
      z: 0.5, y: -H * 0.30, width: W * 0.906, height: H * 0.12,
      "font-size": fitFS(W * 0.906, H * 0.12, MODE_CHARS),
      alignment: "center", color: "#0d0d14", "font-color": GOLD,
      content: "WAITING FOR A ROUND",
    }, g));

    const span = W * 0.9;
    const row = { span: span, segs: [] };
    TEAMS.forEach((t) => row.segs.push(el("m-cube", {
      z: 0.55, y: -H * 0.43, width: 0.1, height: H * 0.08, depth: 0.25, color: t.lit,
    }, g)));
    barSegs.push(row);
    return g;
  }

  // --- boards on the walls ----------------------------------
  const BOARD_W = 60, BOARD_H = 18, BOARD_Y = 24;
  function wallBoard(x, z, ry, base, posts) {
    const g = group({ x: x, z: z, ry: ry });
    const y0 = base || 0;
    const cy = y0 + BOARD_Y;
    if (posts !== false) [-1, 1].forEach((s) => el("m-cylinder", {
      x: s * (BOARD_W / 2 - 3), y: (cy - BOARD_H / 2) / 2, radius: 0.8,
      height: cy - BOARD_H / 2, color: "#2a1f5c", collide: "true",
    }, g));
    boardFace(g, BOARD_W, BOARD_H, { y: cy });
    if (posts !== false) {
      el("m-light", { y: cy, z: -1.6, type: "point", intensity: 14, color: "#8f7bd8" }, g);
    }
  }

  wallBoard(0, OUT - 3, 180);                     // far wall
  wallBoard(0, -(OUT - 3), 0);                    // door wall, posts clear the middle door
  wallBoard(-(OUT - 3), 0, 90);                   // west wall
  wallBoard(OUT - 3, 0, -90);                     // east wall
  wallBoard(0, -(OUT + 2.2), 180, 2, false);      // outside face, for the lobby
  wallBoard(0, LOBBY_BACK - 1.6, 180, 12, false); // on top of the arch wall, for the apron

  // ==========================================================
  // THE HANG  -  floating four-sided board over the centre
  // ==========================================================
  const JUMBO_Y = 52;
  const JUMBO_BODY = 48;
  const JUMBO_W = 44;
  const JUMBO_H = 22;
  const JUMBO_OFF = JUMBO_BODY / 2 + 0.1;

  (function theHang() {
    const g = group({});
    el("m-cube", {
      y: JUMBO_Y + JUMBO_H / 2 + 1.8, width: JUMBO_BODY - 2,
      height: 2.4, depth: JUMBO_BODY - 2, color: STONE,
    }, g);
    el("m-cube", {
      y: JUMBO_Y, width: JUMBO_BODY,
      height: JUMBO_H + 1.6, depth: JUMBO_BODY, color: DARK,
    }, g);
    [[0, JUMBO_OFF, 0], [0, -JUMBO_OFF, 180],
     [JUMBO_OFF, 0, 90], [-JUMBO_OFF, 0, -90]].forEach(([fx, fz, ry]) => {
      boardFace(g, JUMBO_W, JUMBO_H, { x: fx, z: fz, y: JUMBO_Y, ry: ry });
    });
    el("m-cube", {
      y: JUMBO_Y - JUMBO_H / 2 - 1.4, width: JUMBO_BODY + 2,
      height: 0.8, depth: JUMBO_BODY + 2, color: GOLD, opacity: 0.6,
    }, g);
    el("m-light", { y: JUMBO_Y - JUMBO_H / 2 - 4, type: "point",
      intensity: 34, color: "#c9b6ff" }, g);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz], i) => {
      el("m-sphere", {
        x: sx * (JUMBO_BODY / 2 - 1), z: sz * (JUMBO_BODY / 2 - 1),
        y: JUMBO_Y - JUMBO_H / 2 - 2.4, radius: 1.0, color: TEAMS[i % NT].lit,
      }, g);
    });
  })();

  // ==========================================================
  // RING RIBBONS  -  three per side, both faces live
  // ==========================================================
  // Slung just inside the ring's inner lip, plumb, top tucked right
  // under the deck and bottom well over head height. The outer two on
  // each side stop short of the diagonal crown ramps.
  const RIBBON_W = 36;
  const RIBBON_H = 3.0;
  const RIBBON_T = 0.8;
  const RIBBON_BODY_H = RIBBON_H + 1.2;
  const RIBBON_HANG_Y = L2_Y - 0.7 - RIBBON_BODY_H / 2;
  const RIBBON_AT = [-46, 0, 46];

  [[0, -1, 0], [0, 1, 180], [-1, 0, 90], [1, 0, -90]].forEach(([sx, sz, ry]) => {
    RIBBON_AT.forEach((p) => {
      const g = group({
        x: sx ? sx * (RING_IN - 0.4) : p,
        z: sz ? sz * (RING_IN - 0.4) : p,
        y: RIBBON_HANG_Y, ry: ry,
      });
      el("m-cube", {
        width: RIBBON_W + 1.2, height: RIBBON_BODY_H, depth: RIBBON_T,
        color: STONE,
      }, g);
      const bTop = L2_Y - 0.3 - RIBBON_HANG_Y, bBot = RIBBON_BODY_H / 2;
      [-1, 1].forEach((e) => el("m-cube", {
        x: e * (RIBBON_W / 2 - 2), y: (bTop + bBot) / 2,
        width: 0.4, height: bTop - bBot, depth: 0.4, color: "#2a1f5c",
      }, g));
      boardFace(g, RIBBON_W, RIBBON_H, { z: RIBBON_T / 2, ribbon: true });
      boardFace(g, RIBBON_W, RIBBON_H, { z: -RIBBON_T / 2, ry: 180, ribbon: true });
    });
  });

  function setBanner(t, c) {
    bannerLabels.forEach((l) => {
      l.setAttribute("content", t);
      l.setAttribute("font-color", c);
    });
  }
  function setMode(t) { modeLabels.forEach((l) => l.setAttribute("content", t)); }

  // ==========================================================
  // TEAMS AND PAINT
  // ==========================================================
  const roster = new Map();
  let identityWorks = false;
  let identityChecked = false;
  let laneMode = false;
  let contacts = 0;

  function enrol(ti, event) {
    const d = event && event.detail;
    const id = d ? d.connectionId : undefined;
    if (typeof id !== "number") return;
    identityWorks = true;
    roster.set(id, ti);
    headcount();
  }

  function headcount() {
    const n = new Array(NT).fill(0);
    roster.forEach((ti) => { n[ti]++; });
    TEAMS.forEach((t, i) => penLabels[i].setAttribute("content", t.name + " - " + n[i]));
  }

  const onGone = (e) => {
    const id = e && e.detail && e.detail.connectionId;
    if (typeof id === "number" && roster.delete(id)) headcount();
  };
  try { (window.addEventListener ? window : document).addEventListener("disconnected", onGone); }
  catch (err) { /* older runtime, counts drift, harmless */ }

  function paint(idx, event) {
    contacts++;
    if (!running) return;
    const cell = cells[idx];
    const d = event && event.detail;
    const id = d ? d.connectionId : undefined;

    let ti = -1;
    if (typeof id === "number") {
      identityWorks = true;
      if (!roster.has(id)) return;
      ti = roster.get(id);
    } else if (laneMode) {
      ti = cell.lane;
    } else {
      return;
    }
    if (cell.owner === ti) return;
    cell.owner = ti;
    cell.el.setAttribute("color", TEAMS[ti].lit);
  }

  function wipeFloor() {
    for (let i = 0; i < cells.length; i++) {
      cells[i].owner = -1;
      cells[i].el.setAttribute("color", cells[i].bare);
    }
  }
  function tally() {
    const n = new Array(NT).fill(0);
    for (let i = 0; i < cells.length; i++) if (cells[i].owner >= 0) n[cells[i].owner]++;
    return n;
  }

  function refresh() {
    const n = tally(), total = cells.length;
    const pct = n.map((v) => Math.round((v / total) * 100));
    pctRows.forEach((row) => {
      row.labels.forEach((l, i) => l.setAttribute("content",
        row.withName ? TEAMS[i].name + " " + pct[i] + "%" : pct[i] + "%"));
    });
    barSegs.forEach((row) => {
      let cursor = -row.span / 2;
      row.segs.forEach((seg, i) => {
        const w = Math.max(0.1, (n[i] / total) * row.span);
        seg.setAttribute("width", Math.round(w * 100) / 100);
        seg.setAttribute("x", Math.round((cursor + w / 2) * 100) / 100);
        cursor += w;
      });
    });
    return n;
  }

  // ==========================================================
  // THE ROUND
  // ==========================================================
  let running = false, countdown = 0, clockLeft = 0, roundStart = 0;

  function startRound() {
    if (running || countdown > 0) return;
    wipeFloor(); refresh();
    countdown = ARM_DELAY;
    identityChecked = false; laneMode = false;
    setGates(false);
    setBanner(String(countdown), ALERT);
    setMode(roster.size > 0
      ? roster.size + " ENROLLED - DOORS OPEN IN " + ARM_DELAY
      : "PICK A PLINTH TO JOIN A TEAM");
  }
  function beginPlay() {
    running = true; clockLeft = ROUND_S; roundStart = Date.now();
    setGates(true);
    setBanner("GO", CLOCK);
    setMode(identityWorks ? "TEAM MODE - ANY SQUARE, ANY LEVEL" : "CHECKING TEAM DETECTION");
  }
  function endRound() {
    running = false; countdown = 0;
    setGates(true);
    const n = refresh();
    let w = 0;
    for (let i = 1; i < n.length; i++) if (n[i] > n[w]) w = i;
    const drawn = n.filter((v) => v === n[w]).length > 1;
    if (drawn) setBanner("DRAWN", GOLD);
    else setBanner(TEAMS[w].name + " WINS", TEAMS[w].lit);
    setMode("ENTER THE CODE FOR A NEW ROUND");
  }
  function stopRound() {
    running = false; countdown = 0; setGates(true);
    wipeFloor(); refresh();
    setBanner("STANDBY", CLOCK);
    setMode("WAITING FOR A ROUND");
  }
  function toggle() { if (running || countdown > 0) stopRound(); else startRound(); }

  function judgeIdentity() {
    if (identityChecked || !running) return;
    if (Date.now() - roundStart < IDENTITY_GRACE_MS) return;
    if (contacts < 5) return;
    identityChecked = true;
    if (identityWorks) setMode("TEAM MODE - ANY SQUARE, ANY LEVEL");
    else {
      laneMode = true;
      setMode("LANE MODE - PAINT YOUR OWN LANE");
    }
  }

  setInterval(() => {
    if (countdown > 0) {
      countdown--;
      if (countdown > 0) {
        setBanner(String(countdown), ALERT);
        setMode("DOORS OPEN IN " + countdown);
      } else beginPlay();
      return;
    }
    if (!running) return;
    judgeIdentity();
    clockLeft--;
    const m = Math.floor(clockLeft / 60), s = clockLeft % 60;
    setBanner(m + ":" + (s < 10 ? "0" : "") + s, clockLeft <= 15 ? ALERT : CLOCK);
    refresh();
    if (clockLeft <= 0) endRound();
  }, 1000);

  // ==========================================================
  // CODE LOCK  -  in the corridor, between two arches
  // ==========================================================
  const keyDisplays = [];
  let entry = [], entryExpires = 0;

  function setKeyDisplay() {
    const dots = [];
    for (let i = 0; i < CODE.length; i++) dots.push(i < entry.length ? "*" : "-");
    keyDisplays.forEach((l) => l.setAttribute("content", dots.join(" ")));
  }
  function isPrefix(seq) {
    for (let i = 0; i < seq.length; i++) if (seq[i] !== CODE[i]) return false;
    return true;
  }
  function enter(digit) {
    const now = Date.now();
    if (now > entryExpires) entry = [];
    entryExpires = now + CODE_TIMEOUT * 1000;
    entry.push(digit);
    while (entry.length && !isPrefix(entry)) entry.shift();
    setKeyDisplay();
    if (entry.length === CODE.length) { entry = []; setKeyDisplay(); toggle(); }
  }

  (function codeLock() {
    // halfway between the middle arch and the one to its right, so
    // the operator is never standing in a doorway
    const LX = (bayX(Math.floor(NT / 2)) + bayX(Math.floor(NT / 2) + 1)) / 2;
    const LZ = LOBBY_BACK + 8;

    el("m-cube", { x: LX, z: LZ, y: 0.53, width: 7, height: 0.7, depth: 4,
      color: STONE, collide: "true" });
    el("m-cube", { x: LX, z: LZ, y: 0.93, width: 7.4, height: 0.14, depth: 4.4, color: GOLD });
    const CONSOLE_GLOW = 0;
    if (CONSOLE_GLOW) el("m-light", {
      x: LX, z: LZ - 3.6, y: 1.1, type: "point",
      intensity: CONSOLE_GLOW, color: "#5ef0b8",
    });
    el("m-label", {
      x: LX, z: LZ - 2.4, y: 7.2, ry: 180, width: 14, height: 2,
      "font-size": fitFS(14, 2, 7),
      alignment: "center", color: "#0d0d14", "font-color": GOLD, content: "CONTROL",
    });

    const cg = group({ x: LX, z: LZ, y: 0.88, ry: 180 });
    el("m-cube", { y: 2.2, width: 3.4, height: 3.3, depth: 0.25,
      color: "#15151f", collide: "true" }, cg);
    keyDisplays.push(el("m-label", { y: 3.4, z: 0.15, width: 3.0, height: 0.5,
      "font-size": fitFS(3.0, 0.5, 7), alignment: "center", color: "#05050a",
      "font-color": "#7dffcf", content: "- - - -" }, cg));
    el("m-label", { y: 4.4, z: 0.15, width: 3.4, height: 0.6,
      "font-size": fitFS(3.4, 0.6, 5),
      alignment: "center", color: "#15151f", "font-color": GOLD, content: "START" }, cg);

    [["1","2","3"],["4","5","6"],["7","8","9"],["C","0",""]].forEach((row, r) => {
      row.forEach((key, c) => {
        if (key === "") return;
        const clear = key === "C";
        const cap = el("m-cube", {
          x: (c - 1) * 0.92, y: 2.42 - r * 0.62, z: 0.22,
          width: 0.78, height: 0.5, depth: 0.26,
          color: clear ? "#3d0c27" : "#181134", collide: "true",
        }, cg);
        const face = el("m-label", {
          z: 0.14, width: 0.74, height: 0.42,
          "font-size": fitFS(0.74, 0.42, 1), alignment: "center",
          color: clear ? "#3d0c27" : "#181134",
          "font-color": clear ? "#ff8fd8" : "#fff0b8", content: key, collide: "true",
        }, cap);
        let last = 0;
        const hit = () => {
          const now = Date.now();
          if (now - last < 180) return;
          last = now;
          cap.setAttribute("color", clear ? "#ff5ec8" : GOLD);
          setTimeout(() => cap.setAttribute("color", clear ? "#3d0c27" : "#181134"), 150);
          if (clear) { entry = []; setKeyDisplay(); } else enter(Number(key));
        };
        cap.addEventListener("click", hit);
        face.addEventListener("click", hit);
      });
    });

    const promptWrap = document.createElement("m-prompt");
    promptWrap.setAttribute("message", "Operator code");
    promptWrap.setAttribute("placeholder", "4 digits");
    arena.append(promptWrap);
    const pad = el("m-cube", {
      x: LX, z: LZ - 3.2, y: 0.96, width: 3.6, height: 0.16, depth: 1.6,
      color: "#15151f", collide: "true",
    }, promptWrap);
    el("m-label", {
      y: 0.1, rx: -90, width: 3.4, height: 1.4,
      "font-size": fitFS(3.4, 1.4, 9), alignment: "center",
      color: "#15151f", "font-color": GOLD, content: "TYPE CODE", collide: "true",
    }, pad);
    promptWrap.addEventListener("prompt", (event) => {
      const typed = String((event.detail && event.detail.value) || "").replace(/[^0-9]/g, "");
      entry = [];
      for (let i = 0; i < typed.length; i++) enter(Number(typed[i]));
    });

    el("m-label", {
      z: BAY_REAR - 0.6, y: 8, ry: 180, width: 70, height: 3.5,
      "font-size": fitFS(70, 3.5, 36),
      alignment: "center", color: "#0d0d14", "font-color": GOLD,
      content: "PICK A TEAM, THEN WAIT FOR YOUR DOOR",
    });
  })();

  // ==========================================================
  // LIGHTS
  // ==========================================================
  el("m-light", { y: 64, type: "point", intensity: 60, color: "#8f7bd8" });
  [[-1, -1], [-1, 1], [1, -1], [1, 1]].forEach(([sx, sz], i) => {
    // four more high washes over the quarters of a much bigger floor
    el("m-light", { x: sx * 75, z: sz * 75, y: 44, type: "point",
      intensity: 30, color: "#8f7bd8" });
    const tx = sx * (OUT + 4), tz = sz * (OUT + 4);
    el("m-cylinder", { x: tx, z: tz, y: WALL_H / 2, radius: 2.6,
      height: WALL_H, color: "#2a1f5c", collide: "true" });
    el("m-sphere", { x: tx, z: tz, y: WALL_H + 2.6, radius: 3,
      color: TEAMS[i % NT].lit });
    el("m-light", { x: tx, z: tz, y: WALL_H + 2.6, type: "point",
      intensity: 22, color: TEAMS[i % NT].lit });
  });

  headcount(); refresh(); stopRound(); setKeyDisplay();
</script>
